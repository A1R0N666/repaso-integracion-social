<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fanzine de repaso</title>
<meta name="description" content="Repaso interactivo de 1º de Integración Social: resúmenes, tarjetas, tests y juegos de los cuatro módulos.">
<meta name="theme-color" content="#F2F3F7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F3F7; --paper-2:#E6E8F0; --ink:#1C2142; --muted:#555B7C; --line:rgba(28,33,66,.16);
  --ok:#0E8A4F; --ok-bg:#D5F3E3; --bad:#C2304B; --bad-bg:#FBDDE3;
  --blue:#4AA8EC; --blue-d:#00589A; --pink:#FF5DB8; --pink-d:#C2147A;
  --yellow:#FFE14A; --yellow-d:#7E6300; --green:#2BC17A; --green-d:#007A43;
  --on-fill:#1C2142; --blend:multiply;
  --display:"Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-sm:6px; --r-md:14px; --r-lg:22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14162A; --paper-2:#1E2140; --ink:#EEF0FA; --muted:#A6ABCB; --line:rgba(238,240,250,.16);
    --ok:#4FDB97; --ok-bg:#123B2A; --bad:#FF7F95; --bad-bg:#45182A;
    --blue-d:#86C9F7; --pink-d:#FF94D2; --yellow-d:#FFE14A; --green-d:#63E3A6;
    --blend:screen;
  }
}
:root[data-theme="dark"]{
  --paper:#14162A; --paper-2:#1E2140; --ink:#EEF0FA; --muted:#A6ABCB; --line:rgba(238,240,250,.16);
  --ok:#4FDB97; --ok-bg:#123B2A; --bad:#FF7F95; --bad-bg:#45182A;
  --blue-d:#86C9F7; --pink-d:#FF94D2; --yellow-d:#FFE14A; --green-d:#63E3A6;
  --blend:screen;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--pink-d);outline-offset:3px;border-radius:4px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 96px}
h1,h2,h3{font-family:var(--display);line-height:1.05;margin:0;font-weight:800;letter-spacing:-.01em}
p{margin:0 0 .8em}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* book ink per section */
[data-ink="blue"]{--fill:var(--blue);--deep:var(--blue-d)}
[data-ink="pink"]{--fill:var(--pink);--deep:var(--pink-d)}
[data-ink="yellow"]{--fill:var(--yellow);--deep:var(--yellow-d)}
[data-ink="green"]{--fill:var(--green);--deep:var(--green-d)}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar .in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;min-height:56px}
.back{border:0;background:var(--paper-2);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;flex:none}
.bar .ttl{font-family:var(--display);font-weight:700;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.streak{font-size:14px;font-weight:700;background:var(--paper-2);border-radius:999px;padding:6px 12px;white-space:nowrap}

/* HERO — the one loud moment: misregistered riso print */
.hero{position:relative;padding:34px 0 26px;overflow:hidden}
.hero .blob{position:absolute;border-radius:50%;mix-blend-mode:var(--blend);pointer-events:none}
.hero .b1{width:190px;height:190px;background:var(--yellow);right:-60px;top:-50px}
.hero .b2{width:110px;height:110px;background:var(--pink);right:60px;top:-20px;opacity:.85}
.hero .b3{width:70px;height:70px;background:var(--blue);right:-12px;top:96px;opacity:.9}
.hero h1{position:relative;font-size:clamp(46px,13vw,92px);font-variation-settings:"wdth" 78;line-height:.9;
  text-shadow:4px 3px 0 var(--pink);}
.hero h1 span{display:block}
.hero h1 .l2{color:var(--blue-d);text-shadow:4px 3px 0 var(--yellow)}
.hero .for{position:relative;font-family:var(--display);font-weight:600;font-size:15px;margin:0 0 10px;color:var(--muted)}
.hero .lead{position:relative;max-width:30ch;font-size:18px;margin-top:18px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 26px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}

/* zine covers */
.covers{display:grid;gap:16px}
@media (min-width:560px){.covers{grid-template-columns:1fr 1fr}}
.cover{position:relative;text-align:left;border:2px solid var(--ink);border-radius:var(--r-md);padding:18px 18px 16px;
  background:var(--fill);color:var(--on-fill);overflow:hidden;min-height:168px;display:flex;flex-direction:column;
  box-shadow:5px 5px 0 var(--ink);transition:transform .12s, box-shadow .12s}
.cover:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.cover::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(28,33,66,.22) 1.2px,transparent 1.6px);
  background-size:7px 7px;-webkit-mask-image:linear-gradient(135deg,transparent 35%,#000 100%);mask-image:linear-gradient(135deg,transparent 35%,#000 100%)}
.cover > *{position:relative}
.cover h2{font-size:27px;font-variation-settings:"wdth" 85;margin-bottom:6px}
.cover .sub{font-size:15px;line-height:1.35;max-width:32ch}
.cover .meta{margin-top:auto;padding-top:14px;display:flex;justify-content:space-between;align-items:end;font-weight:700;font-size:14px}
.meter{height:8px;background:rgba(28,33,66,.18);border-radius:99px;overflow:hidden;width:110px}
.meter i{display:block;height:100%;background:var(--on-fill);border-radius:99px}

.section-t{font-size:24px;margin:34px 0 12px}
.tools{display:grid;gap:12px}
@media (min-width:560px){.tools{grid-template-columns:1fr 1fr}}
.tool{display:flex;gap:14px;align-items:center;text-align:left;background:var(--paper-2);border:0;border-radius:var(--r-md);padding:16px}
.tool .ico{width:46px;height:46px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:24px;background:var(--fill);color:var(--on-fill);border:2px solid var(--ink)}
.tool b{display:block;font-family:var(--display);font-size:18px}
.tool span{font-size:14.5px;color:var(--muted)}
.tool[disabled]{opacity:.5;cursor:default}

/* book page */
.bhead{padding:26px 0 8px}
.bhead h1{font-size:clamp(34px,9vw,54px);font-variation-settings:"wdth" 82;text-shadow:3px 2px 0 var(--fill)}
.bhead p{margin-top:10px;max-width:46ch}
.units{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:10px}
.unit{width:100%;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:transparent;border-radius:var(--r-md);padding:12px}
.unit .num{width:52px;height:52px;border-radius:12px;background:var(--fill);color:var(--on-fill);border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:24px}
.unit b{font-family:var(--display);font-size:18px;line-height:1.15;display:block}
.unit small{color:var(--muted);font-size:13.5px}
.stars{font-size:18px;letter-spacing:1px;white-space:nowrap}
.stars .on{color:var(--deep)} .stars .off{color:var(--line)}
.bigbtn{display:block;width:100%;margin-top:18px;padding:16px;border:2px solid var(--ink);border-radius:var(--r-md);background:var(--fill);color:var(--on-fill);font-family:var(--display);font-weight:800;font-size:19px;box-shadow:4px 4px 0 var(--ink)}
.bigbtn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}

/* unit page tabs */
.uhead{padding:20px 0 6px}
.uhead .tag{display:inline-block;font-weight:700;font-size:14px;color:var(--deep);margin-bottom:6px}
.uhead h1{font-size:clamp(28px,7.5vw,42px);font-variation-settings:"wdth" 85}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:18px 0 20px;background:var(--paper-2);padding:5px;border-radius:14px;position:sticky;top:57px;z-index:4}
.tab{border:0;background:transparent;border-radius:10px;padding:9px 2px;font-weight:700;font-size:13.5px;line-height:1.1;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab .e{font-size:19px}
.tab[aria-selected="true"]{background:var(--paper);box-shadow:0 0 0 2px var(--ink)}

/* esencial */
.idea{border-left:5px solid var(--fill);padding:2px 0 2px 14px;margin:0 0 20px}
.idea h3{font-size:20px;margin-bottom:6px}
.idea p{margin:0}
.trick{position:relative;margin:26px 0 8px;padding:18px 18px 16px;border:2px dashed var(--ink);border-radius:var(--r-md);background:var(--yellow);color:var(--on-fill);transform:rotate(-.6deg)}
.trick b{font-family:var(--display);font-size:18px;display:block;margin-bottom:4px}
.done-read{margin-top:22px}

/* flashcards */
.fc-wrap{perspective:1200px;margin:6px 0 16px}
.fc{position:relative;display:block;width:100%;height:290px;cursor:pointer;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.3,1)}
.fc.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--ink);border-radius:var(--r-lg);padding:24px 22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:5px 5px 0 var(--ink)}
.face.front{background:var(--fill);color:var(--on-fill)}
.face.front .t{font-family:var(--display);font-weight:800;font-size:clamp(26px,7vw,36px);line-height:1.08;font-variation-settings:"wdth" 85}
.face.rev{background:var(--paper);transform:rotateY(180deg);font-size:18.5px;line-height:1.5}
.face .hint{position:absolute;bottom:12px;left:0;right:0;font-size:13px;opacity:.75}
.fc-count{display:flex;justify-content:space-between;font-size:14px;font-weight:700;color:var(--muted);margin-bottom:8px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:2px solid var(--ink);background:var(--paper);border-radius:var(--r-md);padding:14px 10px;font-weight:700;font-size:16px}
.btn.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ink)}
.btn.again{background:var(--bad-bg);border-color:var(--bad);color:var(--ink)}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.wide{width:100%}

/* quiz */
.q-top{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;color:var(--muted)}
.prog{height:10px;background:var(--paper-2);border-radius:99px;margin:8px 0 18px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--fill);transition:width .3s}
.q{font-family:var(--display);font-weight:700;font-size:clamp(21px,5.6vw,26px);line-height:1.2;margin-bottom:16px}
.q-src{font-size:13px;font-weight:700;color:var(--deep);margin-bottom:6px}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:var(--r-md);padding:13px 14px;font-size:16.5px;display:flex;gap:10px;align-items:flex-start}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--paper-2);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.explain{margin-top:14px;padding:14px 16px;border-radius:var(--r-md);background:var(--paper-2);font-size:16px}
.explain b{font-family:var(--display)}
.result{text-align:center;padding:16px 0}
.stamp{display:inline-block;margin:10px auto 16px;padding:14px 22px;border:4px solid var(--deep);color:var(--deep);border-radius:12px;font-family:var(--display);font-weight:800;font-size:clamp(30px,9vw,46px);transform:rotate(-6deg);text-transform:uppercase;letter-spacing:.02em}
@media (prefers-reduced-motion:no-preference){.stamp{animation:stamp .45s cubic-bezier(.2,1.6,.4,1)}}
@keyframes stamp{from{transform:rotate(-6deg) scale(2.2);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}
.result .score{font-family:var(--display);font-size:60px;font-weight:800;line-height:1}
.stack{display:grid;gap:10px;margin-top:18px}

/* match */
.m-info{font-size:15px;color:var(--muted);margin-bottom:12px}
.m-terms{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.m-term{border:2px solid var(--ink);background:var(--fill);color:var(--on-fill);border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px}
.m-term.sel{box-shadow:0 0 0 4px var(--paper),0 0 0 7px var(--ink)}
.m-defs{display:grid;gap:8px}
.m-def{text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:var(--r-md);padding:12px 14px;font-size:15.5px;line-height:1.4}
.gone{visibility:hidden}
.m-def.hit,.m-term.hit{border-color:var(--ok);background:var(--ok-bg);color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.shake{animation:shake .35s}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.m-def.miss{border-color:var(--bad);background:var(--bad-bg)}

.empty{padding:26px 18px;text-align:center;background:var(--paper-2);border-radius:var(--r-md)}
.foot{margin-top:40px;font-size:13.5px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.linkbtn{border:0;background:none;padding:0;text-decoration:underline;color:var(--muted);font-size:13.5px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:700;font-size:15px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
noscript .wrap{padding-top:20px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><main class="wrap"><h1 style="font-size:34px;margin:10px 0 6px">Estudiar sin dormirse</h1><p><b>Tu móvil ha abierto la versión de solo lectura.</b> Para jugar con tarjetas y tests, abre este archivo con Chrome o Safari (en WhatsApp: mantener pulsado → Compartir / Abrir con…).</p><h2 style="font-size:28px;margin:34px 0 8px">Contexto de la intervención social</h2><h3 style="font-size:21px;margin:22px 0 8px">Tema 1. La dinámica social</h3><p><b>Somos seres sociales.</b> Vivimos en comunidad y nos relacionamos para cubrir nuestras necesidades. Esas relaciones cambian a lo largo de la vida (ciclo vital: infancia, adolescencia, adultez, vejez) y según nuestra trayectoria de vida.</p><p><b>Conducta y actitud.</b> La conducta es lo que hacemos y se ve (respuesta observable a un estímulo). La actitud es la inclinación interna hacia algo o alguien: no se ve, pero empuja la conducta.</p><p><b>Identidad y socialización.</b> La identidad es cómo te ves a ti misma y a qué grupos sientes que perteneces. La socialización es el proceso por el que aprendemos valores, normas y conductas. Los agentes de socialización (familia —el principal—, escuela, amistades, medios y redes) son quienes nos los transmiten.</p><p><b>Estructura y cambio social.</b> La estructura social es la forma que adopta el sistema de relaciones de un grupo. El estatus es el lugar que ocupa cada persona en él. El cambio social son las transformaciones duraderas de esa estructura (por demografía, tecnología, ideas o movimientos sociales).</p><p><b>Participación social.</b> Participar es intervenir en las decisiones que afectan a tu comunidad. Dos mecanismos: la sociedad civil (asociaciones, sindicatos, asociaciones vecinales) y las redes comunitarias (vecinos que se organizan solos, como en la pandemia o la DANA).</p><p><b>Perspectiva de género.</b> El sexo es biológico; el género es el rol que la sociedad espera de ti (social y cultural). La desigualdad de género es la subordinación de la mujer respecto al hombre y se aprende desde la infancia con la socialización.</p><p style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Truco:</b> CONDUCTA se Ve, ACTITUD se Siente. Piensa: la actitud es el motor y la conducta es el coche que ves pasar.</p><ul><li><b>Ciclo vital:</b> Sucesión de etapas por las que pasa una persona desde que nace hasta que muere.</li><li><b>Trayectoria de vida:</b> Secuencia completa de acontecimientos que le ocurren a una persona (familia, estudios, trabajo, vivienda…).</li><li><b>Conducta:</b> Conjunto de comportamientos y maneras de actuar de una persona. Es una respuesta observable ante un estímulo.</li><li><b>Actitud:</b> Disposición, tendencia o inclinación hacia algo o alguien.</li><li><b>Identidad:</b> Concepción y expresión que cada persona tiene de su individualidad y de su pertenencia (o no) a ciertos grupos.</li><li><b>Socialización:</b> Proceso por el que aprendemos e interiorizamos habilidades, valores y pautas de conducta para relacionarnos con el medio.</li><li><b>Agentes de socialización:</b> Personas o instancias que transmiten normas, valores y modelos de comportamiento. La familia es el agente por excelencia.</li><li><b>Estructura social:</b> Forma que adopta el sistema de relaciones entre los individuos de una sociedad o grupo.</li><li><b>Estatus social:</b> Lugar que ocupa cada persona dentro de un grupo y, por extensión, en la sociedad.</li><li><b>Cambio social:</b> Conjunto de transformaciones duraderas de una estructura social.</li><li><b>Participación:</b> Intervención de una persona en la toma de decisiones sobre los recursos y acciones que afectan a su comunidad.</li><li><b>Sexo vs. género:</b> Sexo: hecho biológico (cromosomas). Género: rol, conductas y actitudes que la sociedad espera; hecho social y cultural.</li></ul><h3 style="font-size:21px;margin:22px 0 8px">Tema 2. Procesos de inclusión y exclusión social</h3><p><b>Inclusión vs. exclusión.</b> Inclusión: la persona es aceptada y participa plenamente en la vida social, económica y cultural. Exclusión: se le impide acceder a los mecanismos de desarrollo personal y de participación, incluso a la protección oficial. Es un PROCESO y es reversible.</p><p><b>La triple ruptura.</b> La exclusión suele afectar a la vez a tres dimensiones: estructural (el sistema no protege), relacional (se rompen familia y red de apoyo) y subjetiva (privaciones, pérdidas y estigma).</p><p><b>Ejes de desigualdad y factores de riesgo.</b> Los ejes transversales (sexo, orientación e identidad de género, edad, origen, discapacidad…) hacen a la persona más vulnerable en cualquier ámbito. Los factores de riesgo aumentan la probabilidad de exclusión (paro de larga duración, situación administrativa irregular…).</p><p><b>Violencia.</b> Puede ser maltrato infantil, violencia contra la mujer o maltrato a mayores. La violencia de género la ejerce un hombre sobre su pareja o expareja; su extremo es el feminicidio. Ciclo: 1) acumulación de tensión, 2) explosión, 3) calma o luna de miel.</p><p><b>Indicadores, necesidades y demandas.</b> Un indicador de riesgo es una señal o dato observable que revela una situación de riesgo. La necesidad es la carencia; la demanda es cómo la persona expresa que quiere cubrirla y pide apoyo.</p><p><b>Reinserción social.</b> Volver a integrarse en la sociedad no es sencillo: cuanto más tiempo fuera de la comunidad y más dificultades psicosociales, más compleja es.</p><p style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Truco:</b> Triple ruptura = E·R·S: Estructural (el Estado no llega), Relacional (me quedo sin red), Subjetiva (lo que siento y sufro). &quot;La exclusión ERS un proceso&quot;.</p><ul><li><b>Inclusión social:</b> Situación de aceptación de una persona o grupo y su participación plena en la vida social, económica y cultural.</li><li><b>Exclusión social:</b> Condición de rechazo que impide a una persona o grupo acceder al desarrollo personal, la participación y la protección oficial.</li><li><b>Triple ruptura:</b> Exclusión que afecta a la vez a las dimensiones estructural, relacional y subjetiva.</li><li><b>Naturalización de la exclusión:</b> Ver las situaciones de desventaja como naturales, inevitables o culpa de la persona excluida.</li><li><b>Eje de desigualdad:</b> Aspecto que, en cualquier ámbito, hace a la persona más vulnerable al riesgo o la exclusión (sexo, edad, origen…).</li><li><b>Factores de riesgo:</b> Condiciones que aumentan la probabilidad de que una persona sufra exclusión social.</li><li><b>Violencia de género:</b> La que ejerce un hombre sobre una mujer que es o ha sido su pareja.</li><li><b>Ciclo de la violencia:</b> 1) Construcción de la tensión, 2) explosión violenta, 3) calma o luna de miel (arrepentimiento y manipulación).</li><li><b>Indicador de riesgo:</b> Señal, dato o hecho observable que revela que una persona está en riesgo o exclusión.</li><li><b>Demanda:</b> Forma en que una persona o colectivo expresa su voluntad de cubrir necesidades para las que pide apoyo profesional.</li></ul><h3 style="font-size:21px;margin:22px 0 8px">Tema 3. La intervención social: marco jurídico y protección</h3><p><b>Del modelo benéfico al estado del bienestar.</b> La acción social ha pasado de la caridad a ser un derecho. El estado del bienestar es cuando el Estado garantiza servicios clave (salud, educación, servicios sociales) financiados con impuestos.</p><p><b>Modelos de estado del bienestar.</b> Nórdico o socialdemócrata: universal, por ser ciudadano. Continental o conservador: contributivo, según lo cotizado. Liberal o anglosajón: mínimo, para casos de exclusión clara. Mediterráneo (España, Italia, Grecia, Portugal): llegó tarde (años 70‑80) y apoya mucho en la familia.</p><p><b>Niveles normativos.</b> Las normas siguen una jerarquía: internacional (ONU, Tribunal Penal Internacional), europeo (Carta de Derechos Fundamentales, Pilar Europeo de Derechos Sociales), estatal (Constitución) y autonómico (Estatutos de Autonomía). En España los servicios sociales son competencia de las comunidades autónomas.</p><p><b>Protección social.</b> Conjunto de medidas y recursos que la Administración pone en marcha para garantizar el bienestar y reducir la vulnerabilidad. Se organiza en sistemas (salud, educación, Seguridad Social, servicios sociales…).</p><p><b>El/la integrador/a social: ética.</b> Trato igualitario y respetuoso, instrumentos éticos que no etiqueten, respetar las decisiones de la persona usuaria, confidencialidad y secreto profesional, y profesionalidad en todo momento.</p><p style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Truco:</b> Modelos del bienestar con la familia &quot;N-C-L-M&quot;: Nórdico = Nación paga a todos · Continental = Cotizas y cobras · Liberal = Lo mínimo · Mediterráneo = Mamá (la familia) ayuda.</p><ul><li><b>Estado del bienestar:</b> El Estado es el actor principal que garantiza servicios clave (salud, educación…) financiados sobre todo con impuestos.</li><li><b>Modelo nórdico:</b> Universal: se tiene derecho por ser ciudadano, sin haber cotizado. Suecia, Dinamarca, Noruega…</li><li><b>Modelo continental:</b> Contributivo: las prestaciones dependen de lo cotizado. Francia, Alemania, Bélgica…</li><li><b>Modelo mediterráneo:</b> España, Italia, Grecia y Portugal. Llegó tarde (años 70‑80) y la familia tiene un gran papel.</li><li><b>Jerarquía normativa:</b> Principio por el que las normas de rango inferior no pueden contradecir a las superiores.</li><li><b>Constitución Española:</b> Norma fundamental. Define España como Estado social, democrático, de derecho y autonómico.</li><li><b>Estatuto de Autonomía:</b> Norma institucional básica de una comunidad o ciudad autónoma.</li><li><b>Plan estratégico:</b> Documento con líneas de actuación y acciones para alcanzar objetivos en un periodo de tiempo.</li><li><b>Protección social:</b> Medidas y recursos de la Administración para garantizar el bienestar y reducir la vulnerabilidad.</li><li><b>Sistema de protección social:</b> Conjunto de instituciones y normas que regulan las prestaciones sociales y su financiación (p. ej., el Sistema Nacional de Salud).</li></ul><h3 style="font-size:21px;margin:22px 0 8px">Tema 4. Colectivos en situación de riesgo social</h3><p><b>El diagnóstico.</b> Se recogen datos de fuentes de información (documentos, entrevistas, observación) para identificar necesidades. Un indicador aislado no prueba que haya riesgo: solo señala un factor de riesgo.</p><p><b>Menores, mayores y familias.</b> La familia es espacio de ayuda mutua y protección. Hay menores en riesgo (incluidos los menores extranjeros no acompañados, que necesitan protección especial), mayores que sufren edadismo (estereotipos por la edad) y familias vulnerables.</p><p><b>Mujeres y diversidad sexual.</b> La mayor discriminación hacia las mujeres es la violencia. Hay que distinguir sexo (biológico), género (social), identidad de género y orientación sexual (hacia quién sientes atracción).</p><p><b>Discapacidad.</b> Tipos: física, sensorial (visual, auditiva, sordoceguera), intelectual y por trastorno mental. Necesitan apoyos (productos de apoyo) y accesibilidad: que el entorno se pueda usar de forma segura y normalizada por todas las personas. Barreras: arquitectónicas, en el transporte y en la comunicación.</p><p><b>Adicciones.</b> Hábito compulsivo e incontrolable de consumir una sustancia o hacer una actividad para obtener placer. Las hay de sustancias (alcohol, cocaína, heroína) y comportamentales (ludopatía, compra compulsiva). Tratamiento: desintoxicación, deshabituación y rehabilitación.</p><p><b>Minorías e inmigración.</b> Discriminación por religión u origen (antisemitismo, islamofobia). Proceso migratorio: decisión, tránsito, llegada y duelo migratorio (sentimiento de pérdida). La tercera generación suele sentirse plenamente parte de la sociedad de acogida.</p><p style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Truco:</b> Tratamiento de adicciones = D·D·R, como un &quot;DeDo Recto&quot;: DEStoxicar el cuerpo, DESHABITUAR la mente, REHABILITAR la vida.</p><ul><li><b>Fuentes de información:</b> Recursos de los que se extraen los datos necesarios para el diagnóstico.</li><li><b>Edadismo:</b> Atribución de estereotipos a una persona por el hecho de ser mayor.</li><li><b>Orientación sexual:</b> Atracción sexual, emocional o afectiva hacia personas de un sexo o género determinados.</li><li><b>Género:</b> Conjunto de características sociales que se atribuyen a un sexo concreto.</li><li><b>Sordoceguera:</b> Discapacidad con deficiencia auditiva y visual a la vez.</li><li><b>Accesibilidad:</b> Característica del entorno que asegura su uso normalizado, seguro y eficiente por todas las personas.</li><li><b>Producto de apoyo:</b> Producto para prevenir, compensar o neutralizar limitaciones en la actividad (antes &quot;ayudas técnicas&quot;).</li><li><b>Adicción:</b> Hábito compulsivo e incontrolable de hacer una actividad, consumir una sustancia o mantener una relación para obtener placer.</li><li><b>Ludopatía:</b> Adicción a las apuestas, los juegos de azar o los videojuegos.</li><li><b>Deshabituación:</b> Fase psicoterapéutica para lograr autocontrol, un estilo de vida sin la conducta de abuso y prevenir recaídas.</li><li><b>Duelo migratorio:</b> Sentimiento de pérdida que vive la persona migrante (familia, cultura, tierra…) y que debe asumir.</li></ul><h3 style="font-size:21px;margin:22px 0 8px">Tema 5. Servicios y programas de intervención social</h3><p><b>Abordaje integral y trabajo en red.</b> El trabajo en red es la actuación cooperativa y coordinada de distintos profesionales y servicios con un objetivo común.</p><p><b>Tres modalidades de intervención.</b> Individual: empoderar y acompañar a una persona. Grupal: mejorar el bienestar de un grupo con una problemática común. Comunitaria: transformar una comunidad con la participación activa de sus miembros.</p><p><b>Recursos por colectivo.</b> Menores (atención temprana hasta los 6 años, teléfono 116111), mujeres (institutos de la mujer, 016, teleasistencia móvil ATENPRO), LGTBI+, discapacidad (centros ocupacionales, enclaves laborales, oficinas de vida independiente), inmigrantes (padrón, arraigo social) y pueblo gitano (Consejo Estatal del Pueblo Gitano).</p><p><b>Instrumentos.</b> Programas de intervención social y prestaciones y ayudas para cada colectivo.</p><p><b>Redes de apoyo.</b> Conjunto de conexiones personales, sociales y comunitarias que ayudan en momentos clave. Incluye los grupos de ayuda mutua: pequeños, voluntarios y estructurados.</p><p><b>Voluntariado.</b> Participación social solidaria alrededor de un proyecto colectivo sin ánimo de lucro. Se basa en la voluntariedad (libre, sin relación laboral ni obligación) y el altruismo, entre otros pilares.</p><p style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Truco:</b> Teléfonos que salvan: 016 para la violencia contra la mujer (&quot;0 golpes, 1 llamada, 6 segundos&quot;) y 116111 para la infancia (&quot;muchos unos, como niños en fila&quot;).</p><ul><li><b>Trabajo en red:</b> Actuación cooperativa y coordinada de profesionales y servicios diversos con un objetivo común.</li><li><b>Intervención individual:</b> Acciones para empoderar a una persona y acompañarla en su proceso de inclusión.</li><li><b>Intervención grupal:</b> Acciones para mejorar el bienestar de un grupo que comparte una problemática o necesidad.</li><li><b>Intervención comunitaria:</b> Acciones para transformar una comunidad mediante la participación activa de sus miembros.</li><li><b>Atención temprana:</b> Intervenciones para responder cuanto antes a las necesidades de niños y niñas de hasta 6 años con trastornos del desarrollo.</li><li><b>016:</b> Servicio de información, asesoramiento jurídico y atención psicosocial a víctimas de violencia contra la mujer.</li><li><b>116111:</b> Teléfono de ayuda a la infancia y la adolescencia, unificado en toda la Unión Europea.</li><li><b>Oficina de vida independiente (OVI):</b> Organización sin ánimo de lucro, gestionada por personas con discapacidad, que impulsa su empoderamiento y vida independiente.</li><li><b>Padrón municipal:</b> Registro de las personas que viven en un municipio. Clave para demostrar tiempo de estancia y acceder a sanidad, escuela o ayudas.</li><li><b>Arraigo social:</b> Autorización de residencia temporal para quien lleva al menos 3 años en España, tiene contrato y vínculos.</li><li><b>Grupo de ayuda:</b> Grupo pequeño, voluntario y estructurado para el apoyo mutuo con un propósito específico.</li><li><b>Voluntariado:</b> Participación social solidaria de personas en un proyecto colectivo sin ánimo de lucro.</li></ul><h2 style="font-size:28px;margin:34px 0 8px">Metodología de la intervención social</h2><h3 style="font-size:21px;margin:22px 0 8px">Tema 1. La intervención social</h3><p><b>Qué es intervenir.</b> Intervención social: cualquier actuación intencionada y justificada con una finalidad social o cultural. Su meta es mejorar las condiciones de vida, eliminar desigualdades y promover la dinamización y la movilización social. La metodología es el conjunto de estrategias, métodos y procedimientos ordenados para hacerlo.</p><p><b>Tres modelos de intervención.</b> Asistencialista-paternalista: cubre carencias sin tocar las causas (comedores sociales, ropa). Tecnocrático-burocrático: el Estado asume leyes, políticas y presupuesto. Democrático-emancipador: centrado en la persona y sus potencialidades, y tiene en cuenta las causas estructurales.</p><p><b>Tres niveles de planificación.</b> Estratégico → PLAN (líneas generales, 3‑5 años, objetivos generales). Táctico → PROGRAMA (ámbito y tiempo concretos, objetivos específicos). Operativo → PROYECTO (un año o menos, objetivos operativos medibles, actividades). El proyecto es el instrumento más usado.</p><p><b>Finalidad vs. objetivo.</b> La finalidad expresa el impacto que puede tener la intervención; el objetivo, los efectos concretos de ejecutarla.</p><p><b>Perspectiva de género.</b> Permite identificar, cuestionar y valorar la desigualdad que sufren las mujeres por serlo. Conceptos clave: androcentrismo (lo masculino como modelo universal) y empoderamiento (las mujeres ganan confianza, recursos y fuerza para cambiar su posición). Ley clave: Ley Orgánica 3/2007 de Igualdad Efectiva de Mujeres y Hombres.</p><p style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Truco:</b> PLAN, PROGRAMA, PROYECTO = de la montaña al grano de arena. Plan = mapa del país (Estratégico), Programa = mapa de la ciudad (Táctico), Proyecto = la ruta de hoy (Operativo). &quot;E‑T‑O: Esto Tiene Orden&quot;.</p><ul><li><b>Intervención social:</b> Actuación intencionada y justificada que se programa y ejecuta con una finalidad social o cultural.</li><li><b>Metodología:</b> Conjunto de estrategias, métodos y procedimientos organizados y secuenciados para intervenir en lo social.</li><li><b>Modelo asistencialista-paternalista:</b> Se centra en las carencias, no en sus causas; no busca cambio social. Ej.: comedores sociales.</li><li><b>Modelo tecnocrático-burocrático:</b> El Estado asume las políticas, la legislación y el presupuesto, sustituyendo a la caridad y al tejido asociativo.</li><li><b>Modelo democrático-emancipador:</b> Centrado en la persona y sus potencialidades; tiene en cuenta las causas estructurales de los problemas.</li><li><b>Plan:</b> Nivel estratégico y máximo de la planificación; marca líneas generales a medio-largo plazo (3‑5 años).</li><li><b>Programa:</b> Nivel táctico; concreta el plan en un ámbito y tiempo y ordena los recursos.</li><li><b>Proyecto:</b> Nivel operativo; objetivos operativos medibles y actividades. Duración de un año o menos.</li><li><b>Androcentrismo:</b> Modelo social que pone lo masculino como prototipo y considera la experiencia de los hombres superior y universal.</li><li><b>Empoderamiento:</b> Proceso por el que las mujeres ganan confianza, recursos y fuerza para enfrentar la desigualdad y cambiar su posición.</li><li><b>Perspectiva de género:</b> Metodología para identificar, cuestionar y valorar la desigualdad y discriminación que sufren las mujeres por serlo.</li></ul><h3 style="font-size:21px;margin:22px 0 8px">Tema 2. Investigación social: necesidades y diagnóstico</h3><p><b>Investigar antes de actuar.</b> La investigación social aplica técnicas, estrategias y recursos para estudiar la realidad. Sin ella, el proyecto no responde a necesidades reales.</p><p><b>Fuentes de información.</b> Primarias: las generas tú (encuestas, entrevistas, observación). Secundarias: ya existen en documentos (estadísticas, informes); son las más baratas y se consultan primero. Internas (de tu organización) o externas (de fuera).</p><p><b>Técnicas cuantitativas y cualitativas.</b> Cuantitativas: miden y cuentan; la reina es la encuesta, que usa un cuestionario (validado con un pretest o prueba piloto). Cualitativas: profundizan; la entrevista es la que da información más precisa sobre las personas.</p><p><b>Técnicas de grupo.</b> Grupo de discusión (mucha información cualitativa), grupo focalizado (preguntas centradas en un tema), técnica Delphi (personas expertas, anónimas, en varias rondas hasta el consenso) y lluvia de ideas. También las historias de vida (testimonio vivo en profundidad).</p><p><b>La observación.</b> Puede ser estructurada o no. Registros: anecdotario (hechos sin interpretar), notas de campo (con impresiones personales), diarios (en primera persona), listas de comprobación y escalas. Riesgo principal: el sesgo.</p><p><b>Herramientas para decidir.</b> Diagrama de espina de pescado (causa-efecto): dibuja las causas de un problema. Diagrama de Pareto (80‑20): el 20 % de las causas provoca el 80 % de los efectos.</p><p style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Truco:</b> DELPHI = Expertos en la sombra: Expertos + Anónimos + Rondas hasta Consenso. Piensa en el Oráculo de Delfos: sabios que responden sin dar la cara.</p><ul><li><b>Investigación social:</b> Aplicación de técnicas, estrategias y recursos para estudiar la realidad social.</li><li><b>Fuentes secundarias:</b> Información ya recogida en documentos. Se consultan primero porque son las más fáciles y baratas.</li><li><b>Recopilación documental:</b> Obtener información sobre hechos o realidades ya recogidos en documentos (fuentes secundarias).</li><li><b>Encuesta:</b> Técnica de recogida de información estandarizada, mediante un cuestionario, sobre un grupo de personas.</li><li><b>Cuestionario:</b> Listado de preguntas estructuradas con respuestas limitadas, aplicado con la máxima neutralidad.</li><li><b>Pretest:</b> Prueba piloto para validar que un cuestionario está bien diseñado antes de aplicarlo.</li><li><b>Entrevista:</b> Recogida de información mediante el intercambio verbal entre dos o más personas. No es un interrogatorio.</li><li><b>Grupo focalizado:</b> Grupo que responde a preguntas centradas en un tema y las discute; más estructurado que el grupo de discusión.</li><li><b>Técnica Delphi:</b> Personas expertas opinan de forma anónima y en varias rondas hasta lograr consenso.</li><li><b>Historia de vida:</b> Entrevista en profundidad que conoce a un grupo humano a través de un testimonio vivo.</li><li><b>Notas de campo:</b> Registro de observación que incluye impresiones e interpretaciones personales (subjetivo).</li><li><b>Diagrama de Pareto:</b> Técnica 80‑20: el 20 % de las causas genera el 80 % de los efectos.</li><li><b>Diagrama de espina de pescado:</b> Diagrama causa-efecto que representa gráficamente las causas de un problema.</li><li><b>Informe de investigación:</b> Documento formal con los resultados de la investigación y el diagnóstico social; base del diseño del proyecto.</li></ul><h3 style="font-size:21px;margin:22px 0 8px">Tema 3. Diseño y ejecución de proyectos</h3><p><b>El proyecto.</b> Documento con todas las actuaciones propuestas para atender una situación o problema social. Empieza por la identificación (título, resumen) y el diagnóstico.</p><p><b>Las preguntas del proyecto.</b> ¿Qué? (naturaleza) ¿Por qué? (fundamentación) ¿Para qué? (objetivos) ¿A quién? (destinatarios) ¿Cómo? (metodología y actividades) ¿Cuándo? (temporalización) ¿Con qué? (recursos y presupuesto) ¿Dónde? (ubicación).</p><p><b>Objetivos bien escritos.</b> En infinitivo, una sola acción por objetivo, de lo abstracto a lo concreto, y medibles. Mal: «Aumentar considerablemente las actividades». Bien: «Incrementar un 20 % las actividades respecto al año anterior».</p><p><b>Tiempo y recursos.</b> Temporalización: planning (calendario de todo el proyecto) y horario (planificación diaria o semanal). Recursos humanos, materiales (inventariables y fungibles) y económicos (presupuesto: cálculo anticipado de gastos e ingresos).</p><p><b>Ejecución.</b> Poner en marcha las actividades en el orden y forma previstos. La sesión es la unidad temporal básica. Las tareas son las acciones concretas que componen una actividad.</p><p><b>Herramientas.</b> Diagrama de árbol (medios para llegar a una meta), diagrama de decisiones de acción (prevé problemas: herramienta proactiva), diagrama de Gantt (barras en el tiempo) y PERT (relaciones entre actividades y ruta crítica: la más larga marca la duración total).</p><p style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Truco:</b> Las 8 preguntas del proyecto en una frase: &quot;QUÉ hago, POR QUÉ y PARA QUÉ, a QUIÉN, CÓMO, CUÁNDO, CON QUÉ y DÓNDE&quot;. Si respondes a todas, ya tienes proyecto.</p><ul><li><b>Proyecto (documento):</b> Documento con toda la información de las actuaciones propuestas para atender una situación o problema social.</li><li><b>Resumen del proyecto:</b> Síntesis muy breve de lo esencial: a quién se dirige, qué se hará, dónde…</li><li><b>Objetivo bien formulado:</b> En infinitivo, con una sola acción, concreto y medible (cantidad y plazo).</li><li><b>Tareas:</b> Acciones concretas necesarias para realizar una actividad.</li><li><b>Planning:</b> Calendario con todas las actividades del proyecto de principio a fin.</li><li><b>Horario:</b> Instrumento que representa la planificación diaria o semanal.</li><li><b>Recursos fungibles:</b> Materiales que se gastan al usarse: papel, pinturas, cartulinas…</li><li><b>Presupuesto:</b> Instrumento de planificación basado en un cálculo anticipado de gastos e ingresos en un periodo.</li><li><b>Sesión:</b> Unidad temporal básica de la programación en la que se ejecutan las actuaciones.</li><li><b>Diagrama de Gantt:</b> Cronograma: filas con actividades, columnas con el tiempo y barras que indican la duración.</li><li><b>PERT:</b> Técnica que analiza las actividades y sus relaciones para optimizar el tiempo. La ruta crítica es la más larga.</li><li><b>Análisis de género:</b> Estrategia que permite detectar desigualdades entre hombres y mujeres en el diagnóstico.</li></ul><h3 style="font-size:21px;margin:22px 0 8px">Tema 4. La evaluación del proyecto</h3><p><b>Evaluar todo el tiempo.</b> La evaluación no es un trámite final: debe estar presente de forma continua, desde antes de formular el proyecto hasta después de terminarlo.</p><p><b>Tipos según el momento.</b> Inicial (antes del diseño: pertinencia, necesidades, diagnóstico). Formativa o de proceso (durante: detecta desviaciones). Final, de resultado o sumativa (al acabar: logro de objetivos, satisfacción, coste).</p><p><b>Otras clasificaciones.</b> Según quién: interna, externa o mixta (y participativa). Según la función: diagnóstico, predicción, orientación y control. Según la extensión: parcial o global. Según la continuidad: longitudinal o puntual.</p><p><b>Indicadores e instrumentos.</b> Los indicadores son enunciados que miden lo cerca que estamos de un objetivo. Se evalúan todas las fases: diagnóstico y diseño (preventiva), proceso (seguimiento) y resultados.</p><p><b>Informe y calidad.</b> El informe de evaluación recoge la valoración del proceso y los resultados (la memoria es más completa y formal). Calidad: modelo europeo EFQM, mapa de procesos e indicadores, y carta de servicios (compromiso público de calidad). Para interpretar resultados: matriz DAFO.</p><p style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Truco:</b> Evaluación según el momento = como una receta: INICIAL (miro qué hay en la nevera), PROCESO (pruebo mientras cocino), FINAL (¿ha quedado rico?).</p><ul><li><b>Evaluación inicial:</b> Antes del diseño: valora la pertinencia, detecta necesidades y establece el diagnóstico.</li><li><b>Evaluación formativa o de proceso:</b> Durante el proyecto: analiza el progreso y detecta desviaciones para reajustar.</li><li><b>Evaluación final o sumativa:</b> Al terminar: valora los objetivos logrados, la satisfacción, el coste y la desviación del presupuesto.</li><li><b>Evaluación externa:</b> La realiza personal ajeno al proyecto u organización.</li><li><b>Evaluación mixta:</b> Combina interna y externa; compensa sus inconvenientes pero exige buena coordinación.</li><li><b>Evaluación global:</b> Integral: contempla el conjunto de la intervención y todos sus elementos.</li><li><b>Indicadores de evaluación:</b> Enunciados que permiten medir el grado de aproximación a un objetivo.</li><li><b>Informe de evaluación:</b> Documento con la valoración del proceso de intervención y de los resultados.</li><li><b>EFQM:</b> Modelo europeo de gestión de la calidad, el más adoptado en nuestro entorno.</li><li><b>Carta de servicios:</b> Documento con el que la institución se compromete públicamente con la calidad del servicio.</li><li><b>Matriz DAFO:</b> Herramienta para interpretar resultados: Debilidades, Amenazas, Fortalezas y Oportunidades.</li></ul><h3 style="font-size:21px;margin:22px 0 8px">Tema 5. Promoción y difusión del proyecto</h3><p><b>Publicidad y propaganda.</b> Publicidad: comunicación para dar a conocer un producto, servicio o idea y persuadir. Comercial (con ánimo de lucro), social (sin ánimo de lucro, para sensibilizar), institucional (de la Administración) y política. La propaganda tiene finalidad ideológica.</p><p><b>Campaña y público objetivo.</b> Una campaña es un conjunto organizado de estrategias para dar a conocer algo con anuncios en distintos medios. La segmentación divide el mercado en grupos parecidos; el target o público objetivo es el grupo al que te diriges.</p><p><b>Modelo AIDA.</b> Atención → Interés → Deseo → Acción. Es la sucesión de fases por la que pasa quien recibe el anuncio.</p><p><b>El mensaje.</b> Puede ser racional o emocional (muy usado en sensibilización). El eslogan es una frase atractiva, sugerente y fácil de recordar. En el diseño cuentan la composición, la letra, el plano, la luz y el color (rojo = pasión, amarillo = alegría, verde = esperanza, azul = confianza…).</p><p><b>Medios de difusión.</b> El plan de medios elige la mejor combinación: impresos (carteles, folletos, buzoneo), prensa, radio, televisión (spot), internet y redes (community manager, influencers) y BTL o street marketing (dance marketing, lipdub).</p><p><b>Fases de una campaña.</b> I) Briefing (resumen ordenado de la información necesaria), II) diseño (fase creativa: lluvia de ideas), III) preparación y ejecución, IV) evaluación. Y siempre con lenguaje no sexista y sin estereotipos.</p><p style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Truco:</b> AIDA es una cantante que te seduce paso a paso: primero te mira (Atención), te intriga (Interés), te enamora (Deseo) y acabas comprando su disco (Acción).</p><ul><li><b>Publicidad:</b> Comunicación para dar a conocer un producto, servicio o idea y persuadir a la gente para que actúe.</li><li><b>Publicidad social:</b> Generalmente sin ánimo de lucro; busca concienciar, sensibilizar o cambiar actitudes.</li><li><b>Publicidad institucional:</b> La realizan organismos públicos para informar a la ciudadanía de sus derechos y servicios.</li><li><b>Propaganda:</b> Comunicación con finalidad ideológica.</li><li><b>Campaña publicitaria:</b> Conjunto organizado de estrategias para dar a conocer algo mediante anuncios en distintos medios.</li><li><b>Target:</b> Público objetivo: grupo de personas al que se dirige una acción publicitaria.</li><li><b>Modelo AIDA:</b> Atención, Interés, Deseo y Acción.</li><li><b>Eslogan:</b> Frase o palabra atractiva, sugerente y fácil de recordar que recoge la idea clave del mensaje.</li><li><b>Plan de medios:</b> Selección de la mejor combinación de medios para lograr la máxima eficacia comunicativa.</li><li><b>Briefing:</b> Documento resumido y ordenado con la información necesaria para elaborar una campaña. Es la fase I.</li><li><b>Street marketing:</b> Marketing callejero, modalidad de BTL (acciones fuera de los medios convencionales).</li><li><b>Lipdub:</b> Vídeo en un solo plano secuencia donde la gente baila y hace playback de una canción.</li><li><b>Bola de nieve:</b> Técnica grupal para consensuar y priorizar acciones o decisiones.</li></ul><h2 style="font-size:28px;margin:34px 0 8px">Mediación comunitaria</h2><h3 style="font-size:21px;margin:22px 0 8px">Tema 1. Introducción a la mediación comunitaria</h3><p><b>Convivencia y comunidad.</b> La convivencia es la interacción entre personas que comparten un espacio y crean normas y acuerdos para vivir en armonía. No es fija: cambia todo el tiempo. Una comunidad es un grupo que comparte entorno, vínculos, normas, valores y sentido de pertenencia.</p><p><b>Qué es mediar.</b> La mediación es un proceso estructurado en el que una persona imparcial facilita el diálogo para que LAS PROPIAS PARTES construyan un acuerdo satisfactorio para todas. La mediación comunitaria añade la participación activa de la comunidad. Es tan antigua como la convivencia (el juicio de Salomón).</p><p><b>Los principios.</b> Voluntariedad (participas libremente y puedes irte), imparcialidad, neutralidad (la persona mediadora no toma partido ni impone) y confidencialidad (lo dicho queda en un espacio seguro).</p><p><b>Los modelos.</b> Tradicional lineal o de Harvard: soluciones prácticas basadas en intereses, no en posiciones. Transformativo: transformar a las personas y sus relaciones para que resuelvan solas futuros conflictos. Circular-narrativo: cambiar el relato que cada parte cuenta del conflicto. Interdisciplinario: combina distintas perspectivas profesionales.</p><p><b>Ámbitos y servicios.</b> Vecinal, escolar, intercultural, familiar… También la justicia restaurativa: reparar el daño en lugar de solo castigar. Los servicios cuentan con personas mediadoras, supervisión, equipos itinerantes y protocolos.</p><p><b>Igualdad.</b> Perspectiva de género (examinar desigualdades y relaciones de poder entre géneros) y de no discriminación: preguntarse si prestas la misma atención a todas las partes y si interpretas sin prejuicios.</p><p style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Truco:</b> Los 4 principios forman la palabra VINC (de vínculo): Voluntariedad, Imparcialidad, Neutralidad, Confidencialidad. La mediación crea vínculos.</p><ul><li><b>Convivencia:</b> Interacción entre personas que comparten un espacio y establecen normas y acuerdos para el bienestar colectivo.</li><li><b>Comunidad:</b> Grupo de personas que comparten un entorno, establecen vínculos y generan normas, valores y sentido de pertenencia.</li><li><b>Mediación:</b> Proceso estructurado en el que una persona imparcial facilita el diálogo para que las partes lleguen a un acuerdo satisfactorio.</li><li><b>Mediación comunitaria:</b> Resolución de conflictos basada en la mediación y en la participación activa de la comunidad.</li><li><b>Voluntariedad:</b> Las partes participan libremente y pueden abandonar el proceso en cualquier momento.</li><li><b>Neutralidad:</b> La persona mediadora no toma partido ni impone decisiones; acompaña el proceso.</li><li><b>Modelo transformativo:</b> Busca transformar a las personas y sus relaciones para que puedan resolver futuros conflictos por sí mismas.</li><li><b>Modelo circular-narrativo:</b> Ve el conflicto como un relato y busca cambiar cómo cada parte cuenta la historia.</li><li><b>Modelo tradicional lineal (Harvard):</b> Busca soluciones prácticas centrándose en los intereses, no en las posiciones.</li><li><b>Justicia restaurativa:</b> Aborda el conflicto reparando el daño causado en vez de solo castigar.</li><li><b>Mediación intercultural:</b> Herramienta para prevenir conflictos derivados de la diversidad cultural y fomentar el respeto mutuo.</li></ul><h3 style="font-size:21px;margin:22px 0 8px">Tema 2. Los conflictos en mediación comunitaria</h3><p><b>Qué es un conflicto.</b> Una discrepancia (real o percibida) de intereses, valores, deseos o necesidades. Es natural y está en todas las sociedades: el problema no es ser diferentes, sino no saber gestionar las diferencias.</p><p><b>Causas y respuestas.</b> Causas: intereses o necesidades, valores o creencias, problemas de comunicación y factores estructurales. Estrategias: ganar-perder, perder-perder y ganar-ganar (la única que crea acuerdos duraderos).</p><p><b>Analizar: personas, proceso y problema.</b> Personas: partes principales, secundarias y mediadores naturales. Lo que dicen (posiciones), lo que buscan de verdad (intereses) y lo que hay en el fondo (necesidades), además de emociones y valores. Proceso: cómo evoluciona en el tiempo. Problema: el motivo central del desacuerdo.</p><p><b>Tipos de conflicto.</b> Mediables (aún se puede dialogar) o no mediables (violencia, abuso, vulneración de derechos, como la violencia de género). Según visibilidad: latente (no reconocido), manifiesto (reconocido), enmascarado (punta del iceberg), inexistente, pseudoconflicto (malentendido) y endémico.</p><p><b>Intervenir: prevenir, gestionar, resolver.</b> Prevención: anticiparse con espacios de encuentro. Gestión alternativa (GAC): negociación (sin terceros), mediación (un tercero facilita), conciliación (un tercero propone soluciones), arbitraje (un árbitro decide y se acata) y transacción (ambas ceden). Resolución: total, parcial, temporal o simbólica.</p><p style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Truco:</b> Posición, interés y necesidad son un ICEBERG: arriba se ve la POSICIÓN («quiero la sala solo para cultura»), bajo el agua está el INTERÉS («que no haya ruido») y en el fondo la NECESIDAD («poder descansar»).</p><ul><li><b>Conflicto:</b> Discrepancia, real o percibida, de intereses, valores, deseos o necesidades.</li><li><b>Ganar-ganar:</b> Estrategia en la que las partes colaboran para una solución beneficiosa para todas. Crea acuerdos duraderos.</li><li><b>Posiciones:</b> Declaraciones explícitas de cada parte: su demanda o exigencia.</li><li><b>Intereses:</b> Las motivaciones que hay detrás de cada posición: lo que la parte quiere obtener o proteger.</li><li><b>Necesidades:</b> Lo más profundo: lo que está en la base de los intereses y no siempre se dice.</li><li><b>Mediadores naturales:</b> Personas que, sin ser profesionales, tienen legitimidad en la comunidad para acercar posturas.</li><li><b>Conflicto no mediable:</b> Supone violencia, abuso o vulneración de derechos (p. ej., violencia de género). No hay diálogo equilibrado.</li><li><b>Conflicto latente:</b> Existe, pero las partes no lo han reconocido explícitamente.</li><li><b>Conflicto enmascarado:</b> Solo se ve la punta del iceberg; su magnitud real está oculta.</li><li><b>Pseudoconflicto:</b> Se vive como conflicto pero no hay motivos objetivos: malentendidos o emociones mal canalizadas.</li><li><b>Conciliación:</b> Un tercero neutral facilita el diálogo Y propone soluciones, aunque no son obligatorias.</li><li><b>Arbitraje:</b> Un árbitro escucha y decide; las partes se comprometen a acatar la decisión.</li><li><b>Gestión alternativa de conflictos (GAC):</b> Técnicas para abordar conflictos sin mecanismos autoritarios ni judiciales.</li></ul><h3 style="font-size:21px;margin:22px 0 8px">Tema 3. El contexto y la planificación de la mediación</h3><p><b>El contexto sociocultural.</b> Conjunto de elementos sociales, culturales, históricos y estructurales del entorno. Sin entenderlo, la mediación difícilmente tendrá éxito. La cultura (formas de vida, creencias, normas, símbolos, valores) se transmite de generación en generación.</p><p><b>Socialización, enculturación e identidad.</b> Socialización: aprender normas y valores para integrarse. Enculturación: interiorizar la cultura de tu grupo. Identidad: personal, cultural, legitimada (la que promueven las instituciones con poder), de resistencia y de proyecto (cuando un grupo decide transformar su situación). Cohesión social: grado de integración, confianza y participación.</p><p><b>Contextos actuales.</b> Diversidad cultural (globalización, migraciones), desigualdades socioeconómicas (paro juvenil, vivienda) y nuevas problemáticas: brecha digital, crisis climática y gentrificación.</p><p><b>Mediar en contextos diversos.</b> Principios de actuación adaptados a la diversidad (como la imparcialidad situada, que adapta la neutralidad tradicional a contextos de desigualdad, o la igualdad entendida como equidad real), análisis del contexto y adaptación de la intervención (p. ej., personas traductoras).</p><p><b>Planificar la mediación.</b> Tres fases: preparación, desarrollo y evaluación. Se recopila información (mapa de actores y encuadre del conflicto), muchas veces en la premediación (contactos previos, por separado), se definen objetivos, se diseña la estrategia y se hace la convocatoria inicial.</p><p style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Truco:</b> Gentrificación = llega la &quot;gente rica&quot; al barrio, suben los precios y los de toda la vida se tienen que ir. GENTRI → GENTE RIca.</p><ul><li><b>Contexto sociocultural:</b> Elementos sociales, culturales, históricos y estructurales que configuran el entorno en que viven las personas.</li><li><b>Cultura:</b> Formas de vida, creencias, costumbres, normas, símbolos y valores compartidos por una comunidad.</li><li><b>Enculturación:</b> Proceso por el que una persona interioriza la cultura del grupo o comunidad en que vive.</li><li><b>Identidad legitimada:</b> La que promueven las instituciones con más poder (Estado, medios, sistema educativo).</li><li><b>Cohesión social:</b> Grado de integración, confianza y participación entre los miembros de una comunidad.</li><li><b>Diversidad cultural:</b> Coexistencia de múltiples expresiones culturales en un mismo espacio.</li><li><b>Brecha digital:</b> Desigualdad en el acceso, uso y aprovechamiento de las tecnologías digitales.</li><li><b>Gentrificación:</b> Transformación de una zona por la llegada de residentes con más poder adquisitivo, que desplaza a los de siempre.</li><li><b>Premediación:</b> Fase inicial: primeros contactos con las partes, normalmente por separado, para preparar el terreno.</li><li><b>Convocatoria inicial:</b> Comunicación formal que invita a las partes a la primera sesión conjunta y fija sus condiciones.</li></ul><h3 style="font-size:21px;margin:22px 0 8px">Tema 4. El desarrollo de la mediación</h3><p><b>Seis fases.</b> I) Acogida y presentación del proceso. II) Exposición de las posiciones iniciales. III) Exploración de intereses y necesidades. IV) Búsqueda de acuerdos y negociación. V) Consolidación de acuerdos. VI) Cierre y seguimiento.</p><p><b>El espacio.</b> Debe favorecer el diálogo en igualdad y neutralidad: terreno neutral, mismas condiciones para todos. La mesa redonda elimina cabeceras.</p><p><b>Intereses y acuerdos.</b> Los intereses pueden ser comunes, diferentes pero compatibles u opuestos. La ZPA (zona de posible acuerdo) es donde se cruzan los márgenes que ambas partes aceptan. MAAN: mejor alternativa si no hay acuerdo. PAAN: la peor consecuencia de no acordar. Los acuerdos deben ser claros, realistas y por escrito.</p><p><b>Técnicas.</b> Comunicativas: comunicación no violenta (observar sin juzgar, expresar sentimientos, identificar necesidades, hacer peticiones), mensajes «yo», preguntas. De transformación: externalización (separar el problema de la persona) y reestructuración cognitiva. De conducción: caucus (reunión privada con una parte), validar emociones, lenguaje tranquilizador.</p><p><b>Habilidades de la persona mediadora.</b> Comunicación verbal y no verbal, escucha activa, empatía (ponerse en los zapatos del otro), gestión emocional de las partes y autorregulación propia, y organización.</p><p style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Truco:</b> Las 6 fases como una cita: &quot;Hola (acogida) → Te cuento (posiciones) → ¿Qué te importa de verdad? (intereses) → ¿Y si…? (negociar) → Lo firmamos (consolidar) → ¿Qué tal te va? (seguimiento)&quot;.</p><ul><li><b>Espacio de mediación:</b> Lugar diseñado para favorecer el diálogo en igualdad y neutralidad.</li><li><b>Intereses compatibles:</b> No coinciden, pero se pueden satisfacer a la vez sin perjudicar a nadie.</li><li><b>Intereses opuestos:</b> No pueden satisfacerse a la vez: lo que una parte necesita choca con lo de la otra.</li><li><b>ZPA:</b> Zona de posible acuerdo: intersección de los márgenes que cada parte está dispuesta a aceptar.</li><li><b>MAAN:</b> Mejor alternativa a un acuerdo negociado: la opción más favorable fuera de la mediación.</li><li><b>PAAN:</b> Peor alternativa a un acuerdo negociado: el riesgo de no llegar a un acuerdo.</li><li><b>Comunicación no violenta (CNV):</b> Expresar las propias necesidades y entender las del otro sin juicios ni confrontación. Pasos: observar, sentir, necesitar, pedir.</li><li><b>Mensajes «yo»:</b> Hablar desde lo que yo siento («me siento… cuando…») para no provocar reacciones defensivas.</li><li><b>Externalización:</b> Separar el problema de las personas para que lo afronten como algo externo.</li><li><b>Reestructuración cognitiva:</b> Identificar y modificar pensamientos distorsionados que mantienen el conflicto.</li><li><b>Caucus:</b> Reunión privada de la persona mediadora con una de las partes, con confidencialidad.</li><li><b>Empatía:</b> Ponerse en los zapatos de la otra persona y comprender su punto de vista.</li></ul><h3 style="font-size:21px;margin:22px 0 8px">Tema 5. La evaluación de la mediación</h3><p><b>Para qué evaluar.</b> Es la recogida y análisis sistemático de información para comprender, valorar y mejorar las intervenciones y sus efectos en las personas y la comunidad.</p><p><b>Cuándo evaluar.</b> Inicial o diagnóstica: antes de empezar, para decidir si la mediación es el método adecuado. De proceso: durante las sesiones. Final: una primera valoración «en caliente» de acuerdos y satisfacción, y un seguimiento posterior para ver si los acuerdos se sostienen.</p><p><b>Diseñar el sistema en 4 pasos.</b> 1) Definir los criterios (qué dimensiones importan). 2) Redactar indicadores (señales observables y verificables; cuantitativos o cualitativos). 3) Seleccionar técnicas (método general) e instrumentos (herramienta concreta). 4) Planificar la implementación.</p><p><b>Registrar y documentar.</b> El registro documenta de forma sistemática la información del proceso para asegurar trazabilidad, legalidad y mejora continua. La memoria anual es uno de los documentos más importantes del servicio.</p><p style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Truco:</b> Criterio vs. indicador: el CRITERIO es la asignatura («satisfacción de las partes»); el INDICADOR es la nota que lo demuestra («el 80 % puntúa 4 o más»).</p><ul><li><b>Evaluación en mediación:</b> Proceso sistemático de recogida y análisis de información para comprender, valorar y mejorar las intervenciones.</li><li><b>Evaluación inicial o diagnóstica:</b> Antes de empezar: decide si la mediación es el método adecuado y planifica la intervención.</li><li><b>Evaluación final:</b> Primera valoración «en caliente» de los acuerdos y la satisfacción, más el seguimiento de su sostenibilidad.</li><li><b>Sistema de evaluación:</b> Conjunto articulado de criterios y procedimientos para recoger y analizar información sobre la mediación.</li><li><b>Criterios de evaluación:</b> Dimensiones generales que es relevante valorar (calidad, eficacia, resultados).</li><li><b>Indicador de evaluación:</b> Señal observable y verificable que muestra en qué medida se cumple un criterio.</li><li><b>Técnica vs. instrumento:</b> Técnica: el método general para recoger información. Instrumento: la herramienta concreta dentro de esa técnica.</li><li><b>Registro del proceso:</b> Documentar de forma sistemática la información para garantizar trazabilidad, legalidad y mejora continua.</li><li><b>Memoria anual:</b> Uno de los documentos más importantes del servicio de mediación.</li></ul><h2 style="font-size:28px;margin:34px 0 8px">Promoción de la autonomía personal</h2><h3 style="font-size:21px;margin:22px 0 8px">Tema 1. La promoción de la autonomía personal</h3><p><b>Autonomía = decidir + hacer.</b> Autonomía personal y social: decidir por iniciativa propia cómo vivir y hacer sin ayuda las actividades para lograrlo. Tiene dos caras: la psicosocial (autodeterminación: decidir) y la física (independencia: hacer). Las necesidades humanas se ordenan en la pirámide de Maslow.</p><p><b>Autodeterminación.</b> Capacidad y DERECHO a actuar libremente y tomar tus propias decisiones asumiendo sus riesgos (también equivocarte). Todas las personas tienen potencial para desarrollarla, incluso con discapacidad severa.</p><p><b>HAPS.</b> Habilidades de autonomía personal y social: capacidades, conductas y destrezas para funcionar en la vida diaria (autocuidado, hogar, comunidad, ocio…).</p><p><b>Dependencia y sus grados.</b> Estado permanente en que se necesita ayuda de otras personas para las actividades de la vida diaria. Ley 39/2006: Grado I moderada (ayuda al menos una vez al día), Grado II severa (2‑3 veces al día, sin cuidador permanente), Grado III gran dependencia (varias veces al día y presencia continua de otra persona). Se valora con el BVD.</p><p><b>Discapacidad no es dependencia.</b> Discapacidad: limitaciones en ciertas funciones por un déficit sensorial, físico o intelectual. Una persona con discapacidad no tiene por qué ser dependiente. El término legal es «persona con discapacidad».</p><p><b>Apoyos y cuidados.</b> Apoyos: productos (bastón, silla de ruedas) y personas. Intensidad: intermitente, limitado, extenso o generalizado. Apoyo informal (sobre todo la familia) y formal (profesionales, asistente personal). Riesgos: síndrome del cuidador y burnout del profesional. La mejor estrategia es la prevención.</p><p style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Truco:</b> Grados de dependencia como un semáforo de ayuda: I = 1 vez al día (moderada), II = 2‑3 veces (severa), III = siempre alguien al lado (gran dependencia). El número del grado ≈ las veces que necesitas ayuda.</p><ul><li><b>Autonomía personal y social:</b> Capacidad de decidir por iniciativa propia cómo vivir y de realizar sin ayuda las actividades para hacerlo.</li><li><b>Autodeterminación:</b> Capacidad y derecho de actuar libremente y tomar las propias decisiones, asumiendo sus riesgos.</li><li><b>Independencia:</b> Capacidad de realizar las actividades de la vida diaria por uno mismo, sin ayuda.</li><li><b>HAPS:</b> Habilidades de autonomía personal y social: capacidades, conductas y destrezas para funcionar en la vida diaria.</li><li><b>Dependencia:</b> Estado permanente en que una persona necesita ayuda de otras para las actividades de la vida diaria.</li><li><b>Grado II: dependencia severa:</b> Necesita ayuda 2 o 3 veces al día, pero no un cuidador permanente.</li><li><b>Grado III: gran dependencia:</b> Necesita ayuda varias veces al día y la presencia continua de otra persona.</li><li><b>Discapacidad:</b> Limitación para llevar a cabo ciertas funciones debido a un déficit sensorial, físico o intelectual.</li><li><b>Apoyo generalizado:</b> Apoyo intensivo, en distintos entornos, sin límite de tiempo; puede durar toda la vida.</li><li><b>Asistente personal:</b> Persona que ayuda a otra a realizar las tareas de la vida diaria que no puede hacer sola, respetando su control sobre su vida.</li><li><b>Síndrome del cuidador:</b> Agotamiento que aparece cuando el cuidado recae casi por completo en un familiar.</li><li><b>Burnout:</b> Síndrome del profesional quemado: agotamiento físico y emocional por el trabajo con personas vulnerables.</li></ul><h3 style="font-size:21px;margin:22px 0 8px">Tema 2. El aprendizaje de las HAPS</h3><p><b>Habilidad, hábito y rutina.</b> Habilidad: destreza para hacer algo. Hábito: conducta aprendida que sale automática en el momento oportuno. Rutina: ritmo de actividad estable que se repite casi sin pensar. Una vida con rutinas facilita aprender.</p><p><b>Cuatro fases de aprendizaje de las HAPS.</b> 1) Preparación (motivar y predisponer), 2) aprendizaje de la habilidad, 3) automatización (repetir hasta que salga sola), 4) consolidación (afianzarla e interiorizarla).</p><p><b>Factores que influyen.</b> Inteligencia (CI, inteligencias múltiples), atención (selectiva, dividida, concentración), memoria, actitud, motivación, maduración y experiencia.</p><p><b>Teorías del aprendizaje.</b> Por refuerzo o condicionamiento (premios y castigos), por observación (imitar modelos), cognitivo de Piaget (asimilación y acomodación), por mediación de Vygotsky (zona de desarrollo próximo), por descubrimiento (manipular y practicar) y significativo de Ausubel (conectar con lo que ya sabes).</p><p><b>Aprender en situación de vulnerabilidad.</b> Hay que conocer el potencial de aprendizaje de la persona, partir de su motivación y marcar objetivos funcionales, útiles en su vida diaria.</p><p style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Truco:</b> Fases de las HAPS = P‑A‑A‑C, &quot;PAAC, ¡ya lo sé!&quot;: Preparación, Aprendizaje, Automatización, Consolidación. Como aprender a ir en bici: te animan, lo intentas, ya no piensas en los pedales y nunca se olvida.</p><ul><li><b>Aprendizaje:</b> Conjunto de procesos por los que se adquieren conceptos, conocimientos y habilidades.</li><li><b>Hábito:</b> Conducta aprendida que se ejecuta automáticamente en el momento oportuno y de forma adecuada.</li><li><b>Rutina:</b> Ritmo de actividad estable que, una vez aprendido, se repite casi de forma inconsciente.</li><li><b>Atención selectiva:</b> Capacidad de centrarse en un estímulo e ignorar los demás.</li><li><b>Atención dividida:</b> Capacidad de atender a varios estímulos o tareas a la vez.</li><li><b>Aprendizaje por observación:</b> Reproducir de forma consciente una conducta vista antes en otras personas (modelos).</li><li><b>Asimilación (Piaget):</b> Incorporar información nueva del medio a la estructura mental.</li><li><b>Acomodación (Piaget):</b> Reorganizar la estructura mental tras una asimilación.</li><li><b>Zona de desarrollo próximo:</b> Distancia entre lo que la persona hace sola (real) y lo que puede hacer con ayuda (potencial). Ahí la ayuda es más eficaz.</li><li><b>Aprendizaje significativo:</b> Conectar los nuevos conocimientos con lo que la persona ya sabe. Muy útil con discapacidad intelectual.</li><li><b>Potencial de aprendizaje:</b> Capacidad de cada persona para modificarse y afrontar favorablemente nuevas situaciones.</li></ul><h3 style="font-size:21px;margin:22px 0 8px">Tema 3. Los programas de entrenamiento en HAPS</h3><p><b>Cuatro fases.</b> 1) Valoración inicial, 2) diseño del programa, 3) ejecución, 4) evaluación.</p><p><b>Valorar.</b> Evaluar en qué actividades la persona tiene déficits y con qué intensidad. Las habilidades suelen perderse en orden inverso a como se aprendieron, y la familia suele ser la primera en notarlo. Instrumentos: entrevista, observación (incluida la autoobservación) y escalas.</p><p><b>Diseñar.</b> Objetivos (metas a alcanzar), actividades, temporalización (con cronograma: filas = actividades, columnas = tiempo), recursos (humanos, materiales) y pautas de evaluación.</p><p><b>Ejecutar.</b> El objetivo es enseñar habilidades y convertirlas en hábitos. Coordinación con la familia y actitudes básicas del profesional (respeto, paciencia, empatía).</p><p><b>Evaluar.</b> Valorar todas las acciones y resultados, de forma continua. La observación es el instrumento más usado. El informe de evaluación resume el proceso y comunica a persona usuaria, familia y equipo.</p><p style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Truco:</b> V‑D‑E‑E: &quot;Veo, Diseño, Ejecuto, Evalúo&quot;. Igual que preparar un viaje: ver dónde estás, trazar la ruta, viajar y contar qué tal fue.</p><ul><li><b>Valoración de las HAPS:</b> Evaluar en qué actividades la persona tiene déficits y en qué grado.</li><li><b>Entrevista (valoración):</b> Charla con la persona usuaria o un familiar, guiada por un guion para obtener la información necesaria.</li><li><b>Observación:</b> Prestar atención a la conducta de la persona en situaciones reales (o simuladas). Inconveniente: hay que esperar a que ocurra.</li><li><b>Autoobservación:</b> La propia persona registra sus conductas o pensamientos.</li><li><b>Objetivos del programa:</b> Metas que se quieren alcanzar como resultado de la intervención.</li><li><b>Cronograma:</b> Matriz de doble entrada: actividades en filas y unidades de tiempo en columnas.</li><li><b>Objetivo del entrenamiento:</b> Enseñar habilidades y conseguir que se conviertan en hábitos.</li><li><b>Informe de evaluación:</b> Documento con los resultados y la consecución de objetivos; comunica a usuario, familia y equipo.</li></ul><h3 style="font-size:21px;margin:22px 0 8px">Tema 4. Técnicas de modificación de conducta</h3><p><b>La conducta.</b> Conjunto de comportamientos estables en distintos contextos (el comportamiento es puntual). Ante un estímulo damos una respuesta con tres componentes: motor (lo que se ve), fisiológico (lo interno) y cognitivo (lo que pienso).</p><p><b>Para INCREMENTAR conductas.</b> Refuerzo positivo (dar algo agradable tras la conducta deseada), refuerzo negativo (quitar algo molesto cuando se hace la conducta) y control de estímulos (preparar el ambiente para que aparezca).</p><p><b>Para ADQUIRIR conductas nuevas.</b> Modelado (observar un modelo), moldeado (reforzar aproximaciones sucesivas, con ayuda de instigadores o guía física) y encadenamiento (partir una conducta compleja en pasos sencillos, como vestirse).</p><p><b>Para REDUCIR o ELIMINAR conductas.</b> Coste de respuesta o castigo negativo (quitar algo agradable), castigo positivo (aplicar algo desagradable), extinción (ignorar la conducta), tiempo fuera (apartar de lo agradable), saciación, refuerzo de conductas incompatibles y sobrecorrección (reparar el daño + práctica positiva).</p><p><b>Para CONTROLAR conductas.</b> Economía de fichas (fichas canjeables por premios: combina refuerzo positivo y castigo negativo) y contrato de conducta (acuerdo escrito con compromisos y consecuencias).</p><p style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Truco:</b> POSITIVO = AÑADIR (+) y NEGATIVO = QUITAR (−). REFUERZO = la conducta SUBE; CASTIGO = la conducta BAJA. Ej.: quitarte el móvil por portarte mal = castigo negativo (quito algo bueno para que baje).</p><ul><li><b>Refuerzo positivo:</b> Dar una consecuencia agradable tras la conducta deseada para que aumente.</li><li><b>Refuerzo negativo:</b> Retirar algo molesto cuando la persona realiza la conducta deseada, para que aumente.</li><li><b>Control de estímulos:</b> Preparar el ambiente con estímulos que hagan más probable la conducta deseada.</li><li><b>Modelado:</b> Aprender observando un modelo cuya conducta se considera adecuada.</li><li><b>Moldeado:</b> Reforzar selectivamente las conductas cada vez más cercanas a la deseada (aproximaciones sucesivas).</li><li><b>Encadenamiento:</b> Descomponer una conducta compleja en una sucesión de conductas sencillas.</li><li><b>Guía física:</b> Ayuda que consiste en guiar físicamente los movimientos que se quieren desarrollar.</li><li><b>Coste de respuesta (castigo negativo):</b> Retirar algo agradable tras una conducta no deseada.</li><li><b>Castigo positivo:</b> Aplicar una consecuencia desagradable justo después de una conducta no deseada.</li><li><b>Extinción:</b> Ignorar una conducta indeseada para que desaparezca al no recibir refuerzo.</li><li><b>Tiempo fuera:</b> Retirar el refuerzo o apartar a la persona de una situación agradable tras una conducta inapropiada.</li><li><b>Sobrecorrección:</b> Reparar los efectos de la conducta (restitución) y repetir la conducta correcta (práctica positiva).</li><li><b>Economía de fichas:</b> Sistema de fichas canjeables por recompensas: se ganan con conductas deseadas y se pierden con las no deseadas.</li><li><b>Contrato de conducta:</b> Acuerdo escrito y negociado con compromisos y consecuencias de cumplir o incumplir.</li></ul><h3 style="font-size:21px;margin:22px 0 8px">Tema 5. Intervención en actividades de la vida diaria</h3><p><b>Tipos de AVD.</b> Básicas (AVDB): autocuidado (comer, vestirse, asearse, ir al baño, moverse). Instrumentales (AVDI): adaptarse al medio (cocinar, manejar dinero, medicación, transporte, teléfono). Avanzadas (AVDA): estilo de vida, intereses y participación. La independencia se pierde primero en las AVDI que exigen salir de casa y al final en las básicas.</p><p><b>Terapia ocupacional.</b> Disciplina sociosanitaria que promueve la salud y el bienestar con el uso terapéutico de actividades de cuidado, laborales y lúdicas.</p><p><b>Valorar las AVD.</b> Ver en qué grado la persona hace cada AVD y cuánta ayuda necesita. Escalas: índice de Katz y de Barthel (AVD básicas) y escala de Lawton y Brody (AVD instrumentales).</p><p><b>Recursos.</b> Productos de apoyo, productos ortoprotésicos, adaptación del hogar y del entorno, domótica y accesibilidad universal (que todo el mundo pueda usar objetos y espacios de forma segura y autónoma).</p><p><b>Pautas de intervención.</b> Higiene y aseo (preservar la intimidad, ducha mejor que bañera para transferencias), vestido, alimentación (nutrición, orientación temporal y acto social), control de esfínteres y AVDI (compras, colada, trámites, uso del teléfono e internet).</p><p style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Truco:</b> Barthel y Katz miden lo BÁSICO (B de Barthel = Básico). Lawton mide lo instrumental: &quot;Lawton = Lavadora, Llamar, Llevar dinero&quot;.</p><ul><li><b>AVD básicas (AVDB):</b> Actividades de autocuidado imprescindibles: comer, vestirse, asearse, controlar esfínteres, desplazarse.</li><li><b>AVD instrumentales (AVDI):</b> Requieren más autonomía para adaptarse al medio: cocinar, manejar dinero, medicación, transporte, teléfono.</li><li><b>AVD avanzadas (AVDA):</b> Ligadas al estilo de vida, valores e intereses; permiten el desarrollo personal y la integración.</li><li><b>Terapia ocupacional:</b> Disciplina que promueve la salud y el bienestar con el uso terapéutico de actividades de cuidado, laborales y lúdicas.</li><li><b>Índice de Barthel:</b> Escala de valoración funcional de las AVD básicas.</li><li><b>Escala de Lawton y Brody:</b> Escala de evaluación de las AVD instrumentales.</li><li><b>Accesibilidad universal:</b> Condición de objetos, espacios y servicios para que cualquier persona los use de forma segura, cómoda y autónoma.</li><li><b>Producto ortoprotésico:</b> Producto sanitario que sustituye total o parcialmente una estructura corporal o corrige o facilita su función.</li><li><b>Adaptación del entorno:</b> Modificaciones del ambiente físico para que la persona realice las AVD de forma segura e independiente.</li><li><b>Domótica:</b> Aplicación de la tecnología a la vivienda para automatizar acciones, mejorar la seguridad y ahorrar recursos.</li></ul><h3 style="font-size:21px;margin:22px 0 8px">Tema 6. Orientación y movilidad</h3><p><b>Orientación.</b> Proceso cognitivo para saber dónde y cuándo estás gracias a los sentidos. Espacial (ubicarte físicamente) y temporal (reconocer el momento: tiempo objetivo, que se mide, y subjetivo, el que sientes). Las rutinas diarias organizan el tiempo.</p><p><b>Movilidad.</b> Capacidad de cambiar la posición del cuerpo y desplazarse. Movilización: cambiar de postura sin cambiar de lugar. Desplazamiento: ir de un lugar a otro. Transferencias: pasar de cama a silla, etc.</p><p><b>Limitaciones.</b> Pueden ser cognitivas, sensoriales (sobre todo visuales) o motoras (equilibrio). Y barreras: arquitectónicas, en el transporte y en la comunicación.</p><p><b>Reestructurar el entorno.</b> Conjunto de cambios en el entorno físico para favorecer la autonomía: wayfinding (encontrar el camino en espacios complejos), simbolización (imágenes que identifican espacios o tareas), señalización y teleasistencia.</p><p><b>Técnicas.</b> Planificar recorridos con puntos de referencia, mecánica corporal para prevenir lesiones, cambios posturales (decúbitos) y transferencias. Para discapacidad visual: técnica de Hoover (bastón en arco), guía vidente y perro guía.</p><p style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Truco:</b> MOVILIZACIÓN = Me quedo en mi sitio y cambio de postura. DESPLAZAMIENTO = De un lado a otro. &quot;MO‑ver sin mover, DES‑pegar los pies&quot;.</p><ul><li><b>Orientación:</b> Proceso cognitivo que establece y actualiza la posición en el espacio y el tiempo gracias a la información sensorial.</li><li><b>Tiempo subjetivo:</b> El tiempo que cada persona siente o percibe (frente al objetivo, que se mide).</li><li><b>Movilidad:</b> Capacidad de modificar la posición del cuerpo o sus partes y de desplazarse en el ento
