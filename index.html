<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fanzine de repaso</title>
<meta name="description" content="Repaso interactivo de 1º de Integración Social: resúmenes, tarjetas, tests y juegos de 1.º de Integración Social.">
<meta name="theme-color" content="#F2F3F7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F3F7; --paper-2:#E6E8F0; --ink:#1C2142; --muted:#555B7C; --line:rgba(28,33,66,.16);
  --ok:#0E8A4F; --ok-bg:#D5F3E3; --bad:#C2304B; --bad-bg:#FBDDE3;
  --blue:#4AA8EC; --blue-d:#00589A; --pink:#FF5DB8; --pink-d:#C2147A;
  --yellow:#FFE14A; --yellow-d:#7E6300; --green:#2BC17A; --green-d:#007A43; --orange:#FF8A3D; --orange-d:#A84400;
  --on-fill:#1C2142; --blend:multiply;
  --display:"Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-sm:6px; --r-md:14px; --r-lg:22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14162A; --paper-2:#1E2140; --ink:#EEF0FA; --muted:#A6ABCB; --line:rgba(238,240,250,.16);
    --ok:#4FDB97; --ok-bg:#123B2A; --bad:#FF7F95; --bad-bg:#45182A;
    --blue-d:#86C9F7; --pink-d:#FF94D2; --yellow-d:#FFE14A; --green-d:#63E3A6; --orange-d:#FFB07A;
    --blend:screen;
  }
}
:root[data-theme="dark"]{
  --paper:#14162A; --paper-2:#1E2140; --ink:#EEF0FA; --muted:#A6ABCB; --line:rgba(238,240,250,.16);
  --ok:#4FDB97; --ok-bg:#123B2A; --bad:#FF7F95; --bad-bg:#45182A;
  --blue-d:#86C9F7; --pink-d:#FF94D2; --yellow-d:#FFE14A; --green-d:#63E3A6; --orange-d:#FFB07A;
  --blend:screen;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--pink-d);outline-offset:3px;border-radius:4px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 96px}
h1,h2,h3{font-family:var(--display);line-height:1.05;margin:0;font-weight:800;letter-spacing:-.01em}
p{margin:0 0 .8em}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* book ink per section */
[data-ink="blue"]{--fill:var(--blue);--deep:var(--blue-d)}
[data-ink="pink"]{--fill:var(--pink);--deep:var(--pink-d)}
[data-ink="yellow"]{--fill:var(--yellow);--deep:var(--yellow-d)}
[data-ink="green"]{--fill:var(--green);--deep:var(--green-d)}
[data-ink="orange"]{--fill:var(--orange);--deep:var(--orange-d)}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar .in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;min-height:56px}
.back{border:0;background:var(--paper-2);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;flex:none}
.bar .ttl{font-family:var(--display);font-weight:700;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.streak{font-size:14px;font-weight:700;background:var(--paper-2);border-radius:999px;padding:6px 12px;white-space:nowrap}

/* HERO — the one loud moment: misregistered riso print */
.hero{position:relative;padding:34px 0 26px;overflow:hidden}
.hero .blob{position:absolute;border-radius:50%;mix-blend-mode:var(--blend);pointer-events:none}
.hero .b1{width:190px;height:190px;background:var(--yellow);right:-60px;top:-50px}
.hero .b2{width:110px;height:110px;background:var(--pink);right:60px;top:-20px;opacity:.85}
.hero .b3{width:70px;height:70px;background:var(--blue);right:-12px;top:96px;opacity:.9}
.hero h1{position:relative;font-size:clamp(46px,13vw,92px);font-variation-settings:"wdth" 78;line-height:.9;
  text-shadow:4px 3px 0 var(--pink);}
.hero h1 span{display:block}
.hero h1 .l2{color:var(--blue-d);text-shadow:4px 3px 0 var(--yellow)}
.hero .for{position:relative;font-family:var(--display);font-weight:600;font-size:15px;margin:0 0 10px;color:var(--muted)}
.hero .lead{position:relative;max-width:30ch;font-size:18px;margin-top:18px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 26px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}

/* zine covers */
.covers{display:grid;gap:16px}
@media (min-width:560px){.covers{grid-template-columns:1fr 1fr}}
.cover{position:relative;text-align:left;border:2px solid var(--ink);border-radius:var(--r-md);padding:18px 18px 16px;
  background:var(--fill);color:var(--on-fill);overflow:hidden;min-height:168px;display:flex;flex-direction:column;
  box-shadow:5px 5px 0 var(--ink);transition:transform .12s, box-shadow .12s}
.cover:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.cover::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(28,33,66,.22) 1.2px,transparent 1.6px);
  background-size:7px 7px;-webkit-mask-image:linear-gradient(135deg,transparent 35%,#000 100%);mask-image:linear-gradient(135deg,transparent 35%,#000 100%)}
.cover > *{position:relative}
.cover h2{font-size:27px;font-variation-settings:"wdth" 85;margin-bottom:6px}
.cover .sub{font-size:15px;line-height:1.35;max-width:32ch}
.cover .meta{margin-top:auto;padding-top:14px;display:flex;justify-content:space-between;align-items:end;font-weight:700;font-size:14px}
.meter{height:8px;background:rgba(28,33,66,.18);border-radius:99px;overflow:hidden;width:110px}
.meter i{display:block;height:100%;background:var(--on-fill);border-radius:99px}

.section-t{font-size:24px;margin:34px 0 12px}
.tools{display:grid;gap:12px}
@media (min-width:560px){.tools{grid-template-columns:1fr 1fr}}
.tool{display:flex;gap:14px;align-items:center;text-align:left;background:var(--paper-2);border:0;border-radius:var(--r-md);padding:16px}
.tool .ico{width:46px;height:46px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:24px;background:var(--fill);color:var(--on-fill);border:2px solid var(--ink)}
.tool b{display:block;font-family:var(--display);font-size:18px}
.tool span{font-size:14.5px;color:var(--muted)}
.tool[disabled]{opacity:.5;cursor:default}

/* book page */
.bhead{padding:26px 0 8px}
.bhead h1{font-size:clamp(34px,9vw,54px);font-variation-settings:"wdth" 82;text-shadow:3px 2px 0 var(--fill)}
.bhead p{margin-top:10px;max-width:46ch}
.units{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:10px}
.unit{width:100%;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:transparent;border-radius:var(--r-md);padding:12px}
.unit .num{width:52px;height:52px;border-radius:12px;background:var(--fill);color:var(--on-fill);border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:24px}
.unit b{font-family:var(--display);font-size:18px;line-height:1.15;display:block}
.unit small{color:var(--muted);font-size:13.5px}
.stars{font-size:18px;letter-spacing:1px;white-space:nowrap}
.stars .on{color:var(--deep)} .stars .off{color:var(--line)}
.bigbtn{display:block;width:100%;margin-top:18px;padding:16px;border:2px solid var(--ink);border-radius:var(--r-md);background:var(--fill);color:var(--on-fill);font-family:var(--display);font-weight:800;font-size:19px;box-shadow:4px 4px 0 var(--ink)}
.bigbtn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}

/* unit page tabs */
.uhead{padding:20px 0 6px}
.uhead .tag{display:inline-block;font-weight:700;font-size:14px;color:var(--deep);margin-bottom:6px}
.uhead h1{font-size:clamp(28px,7.5vw,42px);font-variation-settings:"wdth" 85}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:18px 0 20px;background:var(--paper-2);padding:5px;border-radius:14px;position:sticky;top:57px;z-index:4}
.tab{border:0;background:transparent;border-radius:10px;padding:9px 2px;font-weight:700;font-size:13.5px;line-height:1.1;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab .e{font-size:19px}
.tab[aria-selected="true"]{background:var(--paper);box-shadow:0 0 0 2px var(--ink)}

/* esencial */
.sec-tools{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;font-size:14px;opacity:.85}
.linkbtn{border:0;background:none;padding:6px 0;font-weight:700;text-decoration:underline;text-underline-offset:3px;color:inherit}
.sec{border-left:5px solid var(--fill);margin:0 0 12px;padding:0 0 0 14px}
.sec summary{list-style:none;cursor:pointer;display:flex;align-items:flex-start;gap:10px;padding:6px 0}
.sec summary::-webkit-details-marker{display:none}
.sec summary h3{font-size:19px;margin:0;flex:1;line-height:1.25}
.sec summary::after{content:"+";font-family:var(--display);font-weight:800;font-size:22px;line-height:1;flex:none;margin-top:1px}
.sec[open] summary::after{content:"–"}
.sec-body{padding:2px 0 10px}
.sec-body p{margin:0 0 10px}
.sec-body ul{margin:0;padding-left:20px}
.sec-body li{margin:0 0 8px}
.trick{position:relative;margin:26px 0 8px;padding:18px 18px 16px;border:2px dashed var(--ink);border-radius:var(--r-md);background:var(--yellow);color:var(--on-fill);transform:rotate(-.6deg)}
.trick b{font-family:var(--display);font-size:18px;display:block;margin-bottom:4px}
.trick ul{margin:6px 0 0;padding-left:20px}
.trick li{margin:0 0 6px}
.done-read{margin-top:22px}

/* flashcards */
.fc-wrap{perspective:1200px;margin:6px 0 16px}
.fc{position:relative;display:grid;width:100%;cursor:pointer;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.3,1)}
.fc.flip{transform:rotateY(180deg)}
.face{position:relative;grid-area:1/1;min-height:290px;padding-bottom:40px!important;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--ink);border-radius:var(--r-lg);padding:24px 22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:5px 5px 0 var(--ink)}
.face.front{background:var(--fill);color:var(--on-fill)}
.face.front .t{font-family:var(--display);font-weight:800;font-size:clamp(26px,7vw,36px);line-height:1.08;font-variation-settings:"wdth" 85}
.face.rev{background:var(--paper);transform:rotateY(180deg);font-size:18.5px;line-height:1.5}
.face .hint{position:absolute;bottom:12px;left:0;right:0;font-size:13px;opacity:.75}
.fc-count{display:flex;justify-content:space-between;font-size:14px;font-weight:700;color:var(--muted);margin-bottom:8px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:2px solid var(--ink);background:var(--paper);border-radius:var(--r-md);padding:14px 10px;font-weight:700;font-size:16px}
.btn.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ink)}
.btn.again{background:var(--bad-bg);border-color:var(--bad);color:var(--ink)}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.wide{width:100%}

/* quiz */
.q-top{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;color:var(--muted)}
.prog{height:10px;background:var(--paper-2);border-radius:99px;margin:8px 0 18px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--fill);transition:width .3s}
.q{font-family:var(--display);font-weight:700;font-size:clamp(21px,5.6vw,26px);line-height:1.2;margin-bottom:16px}
.q-src{font-size:13px;font-weight:700;color:var(--deep);margin-bottom:6px}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:var(--r-md);padding:13px 14px;font-size:16.5px;display:flex;gap:10px;align-items:flex-start}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--paper-2);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.explain{margin-top:14px;padding:14px 16px;border-radius:var(--r-md);background:var(--paper-2);font-size:16px}
.explain b{font-family:var(--display)}
.result{text-align:center;padding:16px 0}
.stamp{display:inline-block;margin:10px auto 16px;padding:14px 22px;border:4px solid var(--deep);color:var(--deep);border-radius:12px;font-family:var(--display);font-weight:800;font-size:clamp(30px,9vw,46px);transform:rotate(-6deg);text-transform:uppercase;letter-spacing:.02em}
@media (prefers-reduced-motion:no-preference){.stamp{animation:stamp .45s cubic-bezier(.2,1.6,.4,1)}}
@keyframes stamp{from{transform:rotate(-6deg) scale(2.2);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}
.result .score{font-family:var(--display);font-size:60px;font-weight:800;line-height:1}
.stack{display:grid;gap:10px;margin-top:18px}

/* match */
.m-info{font-size:15px;color:var(--muted);margin-bottom:12px}
.m-terms{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.m-term{border:2px solid var(--ink);background:var(--fill);color:var(--on-fill);border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px}
.m-term.sel{box-shadow:0 0 0 4px var(--paper),0 0 0 7px var(--ink)}
.m-defs{display:grid;gap:8px}
.m-def{text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:var(--r-md);padding:12px 14px;font-size:15.5px;line-height:1.4}
.gone{visibility:hidden}
.m-def.hit,.m-term.hit{border-color:var(--ok);background:var(--ok-bg);color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.shake{animation:shake .35s}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.m-def.miss{border-color:var(--bad);background:var(--bad-bg)}

.empty{padding:26px 18px;text-align:center;background:var(--paper-2);border-radius:var(--r-md)}
.foot{margin-top:40px;font-size:13.5px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.linkbtn{border:0;background:none;padding:0;text-decoration:underline;color:var(--muted);font-size:13.5px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:700;font-size:15px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
noscript .wrap{padding-top:20px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><main class="wrap"><h1 style="font-size:34px;margin:10px 0 6px">Estudiar sin dormirse</h1><p><b>Tu móvil ha abierto la versión de solo lectura.</b> Para jugar con tarjetas y tests, abre este archivo con Chrome o Safari (en WhatsApp: mantener pulsado → Compartir / Abrir con…).</p><h2 style="font-size:28px;margin:34px 0 8px">Contexto de la intervención social</h2><h3 style="font-size:22px;margin:26px 0 8px">Tema 1. La dinámica social</h3><h4 style="font-size:18px;margin:16px 0 4px">1.1. La persona, un ser social</h4><p>Las personas vivimos en comunidades y nos relacionamos para cubrir nuestras necesidades. Esas relaciones cambian según su naturaleza (familiar, afectiva, laboral), sus circunstancias, su profundidad y las personas implicadas, y van cambiando a lo largo de la vida. Eso influye en cómo nos relacionamos, en nuestra conducta y en nuestra identidad.</p><h4 style="font-size:18px;margin:16px 0 4px">1.1.1. El cambio a lo largo de la vida</h4><p>Nuestras características físicas, psicológicas y emocionales cambian durante toda la vida. Este proceso de transformación tiene tres rasgos:</p><ul><li><b>Continuidad:</b> ocurre sin parar durante todo el ciclo vital.</li><li><b>Incremento de la complejidad:</b> las habilidades se perfeccionan y los procesos se vuelven más eficaces.</li><li><b>Dependencia de las experiencias:</b> influyen las situaciones vividas, las relaciones y los aprendizajes (la trayectoria de vida).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">El ciclo vital y sus etapas</h4><p>El ciclo vital es la sucesión de etapas por las que pasa una persona desde que nace hasta que muere. Las habilidades, capacidades e intereses dependen mucho de la edad.</p><ul><li><b>Infancia (0‑12 años):</b> cambios enormes y socialización muy intensa. Subetapas: primera infancia (0‑2: confianza en la figura de referencia, autonomía y lenguaje), segunda infancia (2‑6: independencia y deseo de responsabilidades), infancia tardía (6‑9: entra en la escuela, más relación con iguales) y preadolescencia (9‑12: empieza a construir su identidad).</li><li><b>Adolescencia (12‑18):</b> empieza con la pubertad. Búsqueda de identidad, más conflictos con la familia, que es sustituida como fuente de valores por los iguales, los medios y las redes.</li><li><b>Edad adulta (19‑65):</b> la más larga, centrada en la vida familiar y profesional. Adultez joven (19‑35: nuevos roles, formar familia, carrera) y adultez media (35‑65: revisión de la vida, posible crisis de la mitad de la vida).</li><li><b>Vejez (desde 65):</b> puede tener muy buena calidad de vida, pero es una etapa de pérdidas: trabajo, independencia económica, personas cercanas, pareja.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">La trayectoria de vida</h4><p>Es la secuencia completa de acontecimientos que vive una persona, sobre todo en lo familiar, formativo, laboral y residencial. Antes era lineal (estudiar → trabajo estable → familia → jubilación, casi siempre en el mismo sitio). Hoy hay disrupciones en todos los ámbitos:</p><ul><li><b>Familiar:</b> nuevos modelos de familia (monoparentales, homoparentales, reconstituidas, adoptivas, tardías), roles más democráticos y relaciones más inestables.</li><li><b>Formativo:</b> la formación se alarga y se entra y sale del sistema educativo durante toda la vida.</li><li><b>Laboral:</b> el empleo es inestable, con periodos de paro o inactividad.</li><li><b>Residencial:</b> la precariedad y el acceso difícil a la vivienda obligan a mudarse y a reconstruir las redes sociales.</li><li><b>Resiliencia:</b> capacidad de resistir las adversidades y adaptarse a ellas superándolas de forma positiva. Protege ante rupturas que pueden llevar a la exclusión.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.1.2. La conducta y la actitud</h4><p>La conducta es el conjunto de comportamientos y maneras de actuar de una persona en los distintos contextos. Es una respuesta observable ante un estímulo y depende de factores internos (genética, personalidad, valores, capacidades) y externos (la situación, las personas presentes, el contexto).</p><ul><li><b>Conducta adecuada:</b> beneficiosa para la persona y aceptable para los demás.</li><li><b>Conducta inadecuada:</b> sus consecuencias son negativas para la persona o para los demás; aumenta el riesgo de exclusión.</li><li><b>Sistema informal de normas:</b> usos y costumbres (puede incluir estereotipos y prejuicios).</li><li><b>Sistema formal de normas:</b> las leyes, con sanciones para faltas y delitos.</li><li><b>Actitud:</b> disposición, tendencia o inclinación hacia algo o alguien. Se forma en la infancia con los modelos (familia, grupo) y suele ser duradera, pero puede cambiar. Para cambiar una conducta hace falta una actitud favorable, y es mejor ofrecer alternativas que imponer exigencias.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.1.3. La identidad y la socialización</h4><p>La identidad es la concepción y expresión que cada persona tiene de su individualidad y de su pertenencia o no a ciertos grupos.</p><ul><li><b>Identidad individual:</b> lo que la persona se atribuye a sí misma. Sale de sus roles en los sistemas sociales, de su autoconcepto (la imagen que tiene de sí) y de su autoestima (el valor que se da).</li><li><b>Identidad social:</b> las características que el contexto atribuye a cada persona (color de piel, lengua, religión, origen, género, cultura…).</li><li><b>Socialización:</b> proceso por el que aprendemos e interiorizamos habilidades, valores y pautas de conducta para relacionarnos con el medio.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">Agentes y niveles de socialización</h4><p>Los agentes de socialización son las personas o instancias que transmiten normas, valores y modelos de comportamiento. Sus efectos pueden ser positivos (solidaridad, sostenibilidad) o negativos (contenidos poco éticos, agresividad, malos hábitos, estereotipos).</p><ul><li><b>Familia:</b> el agente por excelencia; la socialización empieza en ella y sigue siendo referente toda la vida.</li><li><b>Escuela:</b> socialización formal, intencionada y planificada.</li><li><b>Grupos de iguales:</b> amistades, clase, pandilla; clave en la adolescencia.</li><li><b>Medios de comunicación (tradicionales y digitales):</b> transmiten información, pero también estereotipos y modelos.</li><li><b>Socialización primaria:</b> en la infancia, sobre todo en la familia; forma la base de la personalidad; muy afectiva.</li><li><b>Socialización secundaria:</b> fuera de la familia (escuela, medios, organizaciones); da herramientas para desenvolverse socialmente.</li><li><b>Socialización terciaria:</b> en instituciones reeducativas (prisiones, centros educativos). Es una resocialización para reintegrarse; se parece al trabajo de integración social.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.2. Las estructuras sociales</h4><p>Una sociedad necesita ser estable y que sus miembros se relacionen de forma organizada. La estructura social es la forma que adopta el sistema de relaciones entre los individuos de una sociedad o grupo. Elementos:</p><ul><li><b>Individuos:</b> la unidad más pequeña.</li><li><b>Grupos sociales:</b> personas unidas por objetivos comunes, con valores y conciencia de unidad. Tipos: de pertenencia (al que perteneces), de referencia (no perteneces pero te sirve de brújula), primario o comunidad (relaciones personales y cercanas: familia, amigos) y secundario o asociación (relaciones impersonales con un fin: empresa, club).</li><li><b>Cuasigrupos:</b> no son grupos completos. Categoría (comparten un rasgo sin relación, p. ej. nacidos el mismo año) y conglomerado (comparten espacio sin interactuar, p. ej. viajeros de un tren).</li><li><b>Roles sociales:</b> el papel de cada persona en un grupo (estudiante, madre…). Se espera de ellos un comportamiento (expectativa de rol); si no se cumple puede surgir el conflicto.</li><li><b>Normas y costumbres:</b> el código que regula las relaciones.</li><li><b>Instituciones sociales:</b> pautas duraderas que cubren necesidades básicas: familiar, educativa, política, económica, religiosa y recreativa.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.2.2. Categorización y valoración social</h4><p>Cada sociedad clasifica y valora los rasgos de las personas, y eso determina su estatus: el lugar que ocupa cada uno en el grupo y en la sociedad, con su prestigio y sus ventajas o desventajas.</p><ul><li><b>Estatus atribuido o adscrito:</b> desde el nacimiento (sexo, edad, nivel económico familiar).</li><li><b>Estatus adquirido:</b> por esfuerzo y méritos (deportista, enfermera, ser madre).</li><li><b>Estatus transferido:</b> se recibe de otra persona (jefe del Estado).</li><li><b>Rasgos de alta valoración:</b> deseables (poder económico, juventud, valentía) → aceptación social y estandarización (se convierten en norma).</li><li><b>Rasgos de baja valoración:</b> no deseables (pobreza, vejez, timidez) → rechazo social y posiciones marginales.</li><li><b>Teorías de la desviación social:</b> funcionalistas (la desviación marca límites y refuerza la norma), de las subculturas (grupos desfavorecidos crean su propia cultura), del etiquetaje (las instituciones etiquetan como desviados a ciertos grupos y perpetúan su exclusión) y criminología crítica (el concepto de desviación sirve para el control social).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.2.3. El cambio social</h4><p>La estructura social no es fija. El cambio social es el conjunto de transformaciones duraderas de una estructura social: lo normativo puede volverse marginal y al revés (p. ej., la homosexualidad pasó de considerarse pecado, desorden y enfermedad a algo legítimo y normal). Factores:</p><ul><li><b>Demográficos:</b> natalidad, mortalidad, migraciones.</li><li><b>Culturales:</b> valores, creencias, tradiciones, acceso a la educación.</li><li><b>Económicos:</b> reparto de bienes, producción, consumo, infraestructuras.</li><li><b>Tecnológicos:</b> transporte, comunicación, avances médicos.</li><li><b>Ideológicos:</b> ideas de una época (antimilitarismo, antisexismo, defensa de la democracia).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.3. La participación social y comunitaria</h4><p>La participación es la intervención de una persona en la toma de decisiones sobre los recursos y acciones que afectan al desarrollo de su comunidad. Es un derecho (art. 21 de la Declaración Universal de los Derechos Humanos).</p><ul><li><b>Esfera pública:</b> participación política (elegir representantes) y ciudadana (consultas, entidades).</li><li><b>Esfera privada:</b> participación social (mejorar la vida de un colectivo) y comunitaria (resolver necesidades concretas de un grupo o sector).</li><li><b>Mecanismo 1, sociedad civil:</b> asociaciones, sindicatos, colegios profesionales, asociaciones vecinales. Un tejido asociativo rico defiende mejor los derechos.</li><li><b>Mecanismo 2, redes comunitarias:</b> la propia comunidad se organiza sin depender de entes externos (ayuda mutua en la pandemia o en la DANA de Valencia de 2024). Las mejoras son más sostenibles y la comunidad sale reforzada.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.3.2. Factores que influyen en la participación</h4><p>No todo el mundo participa igual. Influyen: el empleo y su calidad, la economía, la educación (analfabetismo, brecha digital), la cultura (barreras lingüísticas, minorías), la política (procesos penales, situación jurídica), la vivienda, la salud, el entorno familiar, la conflictividad social y el entorno físico.</p><ul><li><b>Mujeres:</b> heteropatriarcado, brecha salarial y techo de cristal, falta de recursos.</li><li><b>LGTBIQ+:</b> invisibilización, patologización, discriminación y violencia.</li><li><b>Inmigrantes:</b> burocracia, barreras lingüísticas, falta de redes, desprotección.</li><li><b>Menores:</b> adultocentrismo y desconocimiento de sus derechos.</li><li><b>Personas mayores:</b> edadismo, precariedad, brecha digital.</li><li><b>Personas con discapacidad:</b> capacitismo y barreras arquitectónicas y de comunicación.</li><li><b>Pueblo gitano:</b> rechazo, falta de referentes propios, desconfianza en el sistema.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.4. La perspectiva de género como motor de cambio</h4><p>El sexo es biológico (cromosomas XX y XY); el género son los roles, conductas y actitudes que la sociedad espera (hecho social y cultural). En Occidente lo más valorado se asocia al hombre masculino heterosexual: es el heteropatriarcado, un sistema que toma lo masculino como referente (androcentrismo) e impone la heterosexualidad. Perjudica a mujeres, personas LGTBIQ+ y también a los hombres. La desigualdad de género es la subordinación de la mujer respecto del hombre y se aprende con la socialización.</p><ul><li><b>Educación:</b> carreras STEM masculinizadas; educación y cuidados, feminizados.</li><li><b>Trabajo:</b> más paro, empleos precarios (suelo pegajoso) y dificultad para ascender (techo de cristal).</li><li><b>Salud:</b> protocolos pensados para hombres (p. ej., infartos).</li><li><b>Economía:</b> salario medio más bajo (brecha salarial).</li><li><b>Medios:</b> menos presencia y voz de las mujeres.</li><li><b>Hogar:</b> cuidados y tareas recaen en ellas (doble jornada).</li><li><b>Espacios de decisión:</b> poca presencia en política y dirección.</li><li><b>Violencia machista:</b> física, psicológica, sexual o económica.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.4.2. Aplicar la perspectiva de género</h4><p>Es el enfoque crítico de cualquier acción o situación teniendo en cuenta las desigualdades de género. Implica identificar las diferencias de roles, las dificultades de las mujeres para acceder a los recursos y los obstáculos para decidir su proyecto de vida. No consiste en hacer acciones solo para mujeres, sino en prever desde el diseño cómo afecta a mujeres y hombres. Permite:</p><ul><li>Modificar estructuras, prácticas y valores sociales.</li><li>Repartir de forma equitativa las tareas en lo público y lo privado.</li><li>Favorecer el empoderamiento de las mujeres.</li><li>Cambiar los patrones de masculinidad (que llevan a los hombres a más conductas de riesgo).</li></ul><div style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Trucos:</b><ul><li>CONDUCTA se Ve, ACTITUD se Siente: la actitud es el motor y la conducta el coche que ves pasar.</li><li>Socialización 1‑2‑3: PRIMARIA = Padres, SECUNDARIA = el Siguiente círculo (escuela, medios), TERCIARIA = Te reeducan (prisiones, centros).</li><li>Estatus A‑A‑T: Atribuido (naces con él), Adquirido (lo Aprendes/ganas), Transferido (te lo Traspasan).</li></ul></div><h3 style="font-size:22px;margin:26px 0 8px">Tema 2. Procesos de inclusión y exclusión social</h3><h4 style="font-size:18px;margin:16px 0 4px">2.1. Inclusión y exclusión: un continuo dinámico</h4><p>La inclusión social es la aceptación de una persona o grupo y su participación plena en la vida social, económica y cultural. La exclusión social es el rechazo que le impide acceder al desarrollo personal, a la participación e incluso a la protección oficial. Son los extremos de un continuo (hay grados) dinámico (se puede pasar de una zona a otra). Las condiciones no son innatas ni irreversibles, sino del contexto.</p><ul><li><b>Zona de inclusión o integración:</b> estabilidad, ingresos regulares, trabajo y redes de apoyo sólidas.</li><li><b>Zona de vulnerabilidad o riesgo:</b> inestabilidad y precariedad laboral, económica y sanitaria (riesgo social).</li><li><b>Zona de exclusión:</b> imposibilidad de participar en ámbitos clave (trabajo, renta, sanidad, red social); la persona está marginada.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.1.1. Sistemas que facilitan la inclusión</h4><p>La sociedad tiene mecanismos para que el mayor número de personas siga integrado:</p><ul><li><b>Sistemas naturales:</b> familia, iguales y vecindad. Dan identidad, protección y sentimiento de pertenencia. La clave es la reciprocidad (relaciones de respeto y colaboración entre iguales).</li><li><b>Sistemas organizados:</b> asociaciones, fundaciones, obras sociales y el tercer sector (entidades privadas sin ánimo de lucro que reinvierten todo en su misión: ONG, cooperativas, fundaciones…). La Administración las financia con subvenciones y concursos.</li><li><b>Sistemas formales:</b> la iniciativa pública (Estado y administraciones) con políticas sociales: pensiones, sanidad, educación, servicios sociales y leyes.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.1.2. Rasgos de la exclusión social</h4><p>Teorías: causas patológicas (rasgos personales), subculturales (valores distintos), administrativas (fracaso de las instituciones) y estructurales (las estructuras de poder generan exclusión). La exclusión es:</p><ul><li><b>Multifactorial:</b> se debe a varios factores; las ventajas en un ámbito pueden compensar desventajas en otro.</li><li><b>Multidimensional (triple ruptura):</b> dimensión subjetiva (privaciones y estigma), estructural (supera la protección del sistema) y relacional (rompe la red natural; desafiliación social).</li><li><b>Dinámica:</b> depende del entorno y sus normas, que cambian.</li><li><b>Acumulativa:</b> las desventajas se suman y se agravan.</li><li><b>Procesual:</b> es un proceso, no un estado definitivo; es reversible.</li><li><b>Politizable:</b> algunos grupos la usan para legitimar su poder.</li><li><b>Democratización del riesgo:</b> hoy cualquier persona puede verse en situación de vulnerabilidad (crisis, precariedad, cambios familiares…), con nuevas figuras de la exclusión.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">Mecanismos de exclusión</h4><p>La exclusión es un rechazo a la alteridad (lo distinto a la norma). Formas:</p><ul><li><b>Sustracción o eliminación física:</b> expulsión (destierro, deportación, limpieza étnica) o exterminio (genocidio).</li><li><b>Sustracción identitaria:</b> persecución o destrucción de la cultura (etnocidio).</li><li><b>Segregación espacial:</b> gueto o reclusión en instituciones (prisiones, centros psiquiátricos): institucionalización.</li><li><b>Segregación institucional:</b> concentrar a un grupo en recursos distintos (guetización), p. ej. escuelas con casi solo alumnado extranjero.</li><li><b>Estigmatización:</b> imagen negativa y discursos de odio, con discriminación legal (leyes discriminatorias: apartheid) o social (marginación e invisibilización).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">Tipos de discriminación</h4><p>Formas más frecuentes (también puede darse el autoodio: rechazar el propio rasgo):</p><ul><li><b>Racismo:</b> contra un grupo étnico considerado inferior.</li><li><b>Xenofobia:</b> rechazo a personas o culturas extranjeras.</li><li><b>Por motivos culturales o religiosos:</b> antisemitismo, islamofobia.</li><li><b>Sexismo:</b> misoginia, homofobia, lesbofobia, bifobia, transfobia, LGTBIfobia.</li><li><b>Aporofobia:</b> rechazo a la pobreza y a las personas pobres.</li><li><b>Edadismo:</b> contra mayores o menores.</li><li><b>Capacitismo:</b> contra personas con discapacidad.</li><li><b>Aculturación:</b> abandonar los rasgos de tu cultura y adoptar los del grupo dominante (problemas de identidad en 2.ª y 3.ª generación).</li><li><b>Naturalización de la exclusión:</b> ver la desventaja como natural, inevitable o culpa de quien la sufre.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.2.1. Ejes transversales de desigualdad</h4><p>Un eje de desigualdad es un aspecto que, en cualquier ámbito, hace a la persona más vulnerable. Aumentan la vulnerabilidad, crean desventajas nuevas y dificultan la inclusión. Pueden sumarse varios.</p><ul><li><b>Sexo:</b> brecha salarial, techo de cristal, doble jornada, violencia machista.</li><li><b>Orientación sexual e identidad de género:</b> rechazo, sinhogarismo, violencia.</li><li><b>Edad:</b> mayores y menores en una sociedad adultocéntrica.</li><li><b>Clase social:</b> más fracaso escolar y empleos precarios.</li><li><b>Discapacidad:</b> estigma y barreras sin adaptaciones.</li><li><b>Territorio:</b> medio rural o barrios desfavorecidos.</li><li><b>Etnia y religión:</b> prejuicios, discriminación, barreras de idioma y situación irregular.</li><li><b>Brecha digital:</b> no poder acceder a servicios que ya son digitales.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.2.2. Factores de riesgo</h4><p>Condiciones que aumentan la probabilidad de exclusión; combinan elementos personales, relacionales y socioeconómicos.</p><ul><li><b>Pobreza:</b> absoluta (no cubre mínimos de subsistencia), relativa (por debajo del nivel de vida mínimo de su territorio; para Eurostat, ingresos menores al 60 % de la media) y subjetiva (la persona siente que no llega).</li><li><b>Precariedad laboral:</b> falta de trabajo (paro de larga duración, subocupación, falsos autónomos), tipo de trabajo (sobrecualificación, trabajos estigmatizados) y malas condiciones.</li><li><b>Falta de formación:</b> escolarización incompleta, aprendizaje deficiente, difícil acceso, barreras lingüísticas, falta de titulación y analfabetismo digital.</li><li><b>Problemas de salud:</b> enfermedades crónicas o mentales, discapacidad, adicciones, maltrato.</li><li><b>Precariedad residencial:</b> falta de vivienda, residencia irregular, coste excesivo, acoso inmobiliario, infravivienda, pobreza energética y entorno degradado o mal comunicado.</li><li><b>Bajo capital relacional:</b> redes débiles, familias conflictivas, estigma, falta de arraigo.</li><li>Carencias culturales y de ocio.</li><li><b>Problemas legales y burocráticos:</b> privación de libertad, situación irregular, desamparo de menores, acceso restringido a la justicia y a la ciudadanía.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.2.3. Factores de protección</h4><p>Condiciones que reducen la posibilidad de riesgo o exclusión, en los mismos ámbitos:</p><ul><li><b>Económico:</b> rentas suficientes, políticas redistributivas, microcréditos.</li><li><b>Laboral:</b> empleo estable (da derecho a prestaciones), reciclaje profesional, programas de inserción, cooperativas.</li><li><b>Educativo:</b> sistema educativo universal, formación continua, aprendizaje de la lengua, educación inclusiva.</li><li><b>Salud:</b> Sistema Nacional de Salud y programas de salud comunitaria.</li><li><b>Residencial:</b> vivienda pública, ayudas, albergues, pisos tutelados.</li><li><b>Relacional:</b> red de apoyo amplia y tejido asociativo rico.</li><li><b>Cultural:</b> oferta de ocio accesible y buena gestión de la diversidad. Multiculturalidad: los grupos conviven separados y no se conocen. Interculturalidad: se relacionan, se conocen y se enriquecen mutuamente.</li><li><b>Jurídico:</b> ciudadanía y residencia legal, justicia gratuita, protección de menores, acompañamiento y enfoque reinsertador de las prisiones.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.3. La violencia</h4><p>Las personas vulnerables sufren más violencia, que puede ser causa o consecuencia de la exclusión. La naturalización (verla como normal o merecida) la agrava. Según su naturaleza:</p><ul><li><b>Física:</b> uso de la fuerza para causar daño.</li><li><b>Psicológica o emocional:</b> manipular, humillar, controlar, aislar; difícil de detectar.</li><li><b>Sexual:</b> actos contra la libertad sexual; incluye el acoso por razón de sexo (entorno hostil, bromas sexistas) y el acoso sexual (quien tiene poder lo usa para obtener favores sexuales).</li><li><b>Económica:</b> controlar el dinero para crear dependencia.</li><li><b>Digital:</b> ciberacoso, control del móvil, difundir imágenes íntimas.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.3.2. Maltrato infantil</h4><p>Cualquier acción, omisión o trato negligente no accidental que priva a un menor de sus derechos y bienestar y amenaza su desarrollo. Polivictimización: sufrir varias formas de victimización.</p><ul><li><b>Maltrato prenatal:</b> daño al feto.</li><li><b>Negligencia o abandono:</b> no se cubren sus necesidades básicas (incluye el absentismo).</li><li><b>Instrumentalización:</b> manipulación contra el otro progenitor o violencia vicaria (dañar a los hijos para dañar a la madre/padre).</li><li>Abuso sexual y explotación sexual (si hay ganancia).</li><li>Explotación laboral o mendicidad.</li><li>Corrupción y maltrato médico-farmacéutico (p. ej., síndrome de Münchhausen por poderes).</li><li><b>Acoso:</b> bullying (escolar), cyberbullying (en redes) y grooming (un adulto engaña al menor por internet con fines sexuales).</li><li>Bandas juveniles violentas.</li><li><b>Factores de riesgo:</b> entorno familiar deficitario, entorno social adverso, características del menor (salud frágil, discapacidad) y servicios de protección deficitarios.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.3.3. Violencia contra la mujer</h4><p>La violencia machista es la que se ejerce sobre las mujeres como manifestación de la desigualdad y las relaciones de poder de los hombres sobre ellas, en cualquier ámbito. La violencia de género es la que ejerce un hombre sobre una mujer que es o ha sido su pareja (aunque no convivan). Es progresiva y cíclica; su extremo es el feminicidio.</p><ul><li><b>Ciclo, fase 1:</b> construcción de la tensión (agresiones leves que aumentan).</li><li><b>Ciclo, fase 2:</b> explosión violenta.</li><li><b>Ciclo, fase 3:</b> calma o luna de miel (arrepentimiento, regalos, manipulación y culpa). Se repite cada vez con más intensidad; solo se rompe con la denuncia o la intervención de terceros.</li><li><b>Ámbito familiar:</b> mutilación genital, matrimonio forzado, desescolarización de niñas, crímenes de honor.</li><li><b>Ámbito laboral:</b> acoso sexual y por razón de sexo.</li><li><b>Medios y publicidad:</b> cánones de belleza y modelos desiguales.</li><li><b>Social:</b> hostigamiento verbal, agresiones sexuales, tráfico de mujeres, feminicidio.</li><li><b>Institucional:</b> revictimización en el sistema judicial.</li><li><b>Más vulnerables:</b> menores y adolescentes, mujeres con discapacidad, en exclusión, del medio rural, inmigrantes y trabajadoras sexuales.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.3.4. Maltrato a personas mayores o dependientes</h4><p>Acción única o repetida, o falta de respuesta, que causa daño a una persona mayor o dependiente en una relación de confianza. Prevalecen el maltrato económico y la negligencia; suele ser invisible.</p><ul><li><b>Vulneración de derechos:</b> no respetar su opinión ni su proyecto de vida.</li><li><b>Obstinación diagnóstica:</b> pruebas médicas sin beneficio real para la persona.</li><li><b>Obstinación terapéutica:</b> alargar artificialmente la vida en enfermedad terminal.</li><li><b>Factores de riesgo:</b> de la víctima (dependencia, aislamiento), de quien maltrata (sobrecarga, adicciones, dependencia económica), del entorno (edadismo, pobreza) y de las instituciones (personal poco preparado).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.4. Indicadores de riesgo de exclusión</h4><p>Un indicador es una señal, dato o hecho observable que revela riesgo o exclusión. Son indicios, no pruebas: hay que ver si se acumulan y analizar el caso en su globalidad.</p><ul><li><b>Personales:</b> de salud (enfermedad, discapacidad, adicciones), competenciales (déficits en AVD, bajo nivel educativo) y psicosociales (baja autoestima, falta de alternativas, actividades ligadas a la exclusión, restricciones a la ciudadanía).</li><li><b>Materiales:</b> escasez económica (por debajo del 60 % del salario mínimo), baja intensidad de trabajo (menos del 20 % del potencial), privación material severa, vivienda inadecuada y entorno deteriorado.</li><li><b>Relacionales y sociales:</b> familia desestructurada, pertenencia a grupos estigmatizados, conflictos con el entorno, falta de apoyo.</li><li><b>Violencia familiar:</b> en la víctima (lesiones sin explicación, sumisión, aislamiento, absentismo), en el agresor (quiere estar siempre presente, no deja hablar a la víctima) y en el entorno (antecedentes, control de horarios).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.5. Necesidades y demandas</h4><p>Una necesidad es todo lo que una persona tiene que satisfacer para mantener la vida, la salud y el bienestar. Una demanda es la forma en que la persona o el colectivo expresa que quiere cubrirla y pide apoyo profesional. Lo que se pide y lo que se necesita pueden no coincidir.</p><ul><li><b>Demanda explícita:</b> se formula con claridad.</li><li><b>Demanda implícita:</b> no se expresa abiertamente; hay que interpretarla.</li><li><b>Demanda inespecífica:</b> la persona no llega a definirla; hay que acompañarla.</li><li><b>Ausencia de demanda:</b> no pide nada (por no ser consciente o por miedo); hace falta un acompañamiento más profundo.</li><li><b>Modelos de necesidades:</b> pirámide de Maslow (5 niveles), modelo biopsicosocial (necesidades biológicas, psíquicas y sociales) y modelo de derechos humanos (básicas, servicios fundamentales, trabajo digno y libertades y participación).</li><li><b>Cada colectivo tiene necesidades propias:</b> p. ej., lo sanitario para LGTBIQ+, lo administrativo para inmigrantes.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.6. La reinserción social</h4><p>Proceso de adaptarse o readaptarse a la sociedad tras haber estado fuera (prisión, centros psiquiátricos o de menores, años en la calle, sectas).</p><ul><li><b>Factores que la facilitan:</b> motivación, capacidad de entender las consecuencias, redes de apoyo, nivel socioeducativo, buena salud sin adicciones y no tener historial de reincidencia.</li><li><b>Factores que la dificultan:</b> carencias personales (falta de autocrítica o empatía), aislamiento, entorno conflictivo, adicciones e identidad ligada a la exclusión.</li><li><b>Prisionización:</b> interiorizar la subcultura de la prisión y adoptar la identidad de «preso».</li><li><b>Programas:</b> educativos (talleres, habilidades), psicoemocionales (autoestima, terapia) y sociales (familia, ocio, contacto con la comunidad).</li><li><b>Iniciativas:</b> módulos terapéuticos (UTE), medidas penales alternativas (reparar el daño, trabajos en beneficio de la comunidad) y terapia asistida con animales.</li><li><b>Tipos de programas:</b> de reconducción de conducta (violencia, violencia de género, delitos sexuales, violencia contra la infancia), para personas con déficits sociales (extranjeros, jóvenes menores de 25) y terapéuticos (salud mental y adicciones).</li></ul><div style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Trucos:</b><ul><li>Triple ruptura = E‑R‑S: Estructural (el sistema no llega), Relacional (me quedo sin red), Subjetiva (lo que siento y sufro).</li><li>Las 3 zonas como un semáforo: verde inclusión, ámbar vulnerabilidad, rojo exclusión. Y se puede cambiar de color en las dos direcciones.</li><li>Ciclo de la violencia = T‑E‑L: Tensión, Explosión, Luna de miel… y vuelta a empezar más fuerte.</li><li>Demandas: EXPLÍCITA lo dice claro, IMPLÍCITA lo insinúa, INESPECÍFICA no sabe qué pedir, AUSENCIA no pide nada.</li></ul></div><h3 style="font-size:22px;margin:26px 0 8px">Tema 3. El marco de la intervención social</h3><h4 style="font-size:18px;margin:16px 0 4px">3.1. La intervención social</h4><p>La intervención o acción social es cualquier acción o conjunto de acciones planificadas para mejorar las condiciones sociales de una persona o grupo. Debe atender a las personas vulnerables, crear entornos que acojan la diferencia y fomentar la autonomía y la participación. Es más eficaz si se dirige a grupos o sectores concretos.</p><h4 style="font-size:18px;margin:16px 0 4px">3.1.1. Tipos de acciones</h4><p>Según el objetivo que priorizan, las acciones son:</p><ul><li><b>Preventivas:</b> eliminan o reducen los factores de riesgo (currículos sobre diversidad y equidad, campañas de sensibilización contra estereotipos).</li><li><b>De promoción:</b> refuerzan los factores de protección y la autonomía (programas de orientación laboral, incentivos a contratar a personas vulnerables).</li><li><b>De reinserción:</b> acompañan la vuelta a la sociedad (formación en habilidades laborales, empleo protegido).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.1.2. Discriminación positiva</h4><p>La discriminación positiva o acción positiva es un conjunto de prácticas que compensan las desventajas de un grupo históricamente discriminado para avanzar hacia la igualdad de oportunidades. Beneficia específicamente al grupo desfavorecido. Puede generar tensiones: algunos la perciben como discriminación inversa.</p><ul><li><b>Laboral:</b> cuotas de reserva de empleo, contratación preferente, flexibilidad y teletrabajo para conciliar.</li><li><b>Residencial:</b> cupos en viviendas de alquiler, prioridad en vivienda pública, ayudas preferentes.</li><li><b>Educativo:</b> criterios de compensación en la admisión y reserva de plazas.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.1.3. Evolución histórica de la acción social</h4><p>La forma de atender la alteridad (discapacidad, enfermedad, pobreza…) ha cambiado mucho:</p><ul><li><b>Antigüedad:</b> cuidado de mayores y enfermos desde el Neolítico, pero también exclusión por «impureza». Grecia trató las enfermedades como algo biofísico; Roma creó el Estado y la idea de humanitas (antecedente de la beneficencia).</li><li><b>Edad Media:</b> caridad cristiana. Hospitales, leproserías, casas de huérfanos y misericordia bajo la Iglesia; iniciativas de benefactores; auxilio de los gremios.</li><li><b>Renacimiento:</b> secularización de la pobreza. Las administraciones asumen la atención (impuestos de beneficencia), pero también se reprime la mendicidad.</li><li><b>Industrialización (s. XVII‑XIX):</b> encierro de la alteridad en hospitales generales, hospicios, penitenciarías, asilos y manicomios; nace la psiquiatría.</li><li><b>Beneficencia (tras la Revolución francesa):</b> el Estado atiende por civismo, no como deber. En España: Reglamento General de Beneficencia Pública (1822) y Ley General de Beneficencia (1849).</li><li><b>Asistencia social:</b> la ayuda empieza a verse como un derecho. Movimiento obrero y leyes: Accidentes de Trabajo (1900), Trabajo de Mujeres y Niños (1900), Descanso Semanal (1904), Huelga (1909). Instituto Nacional de Previsión (antecedente de la Seguridad Social) e Instituto de Reformas Sociales. Mutualidades y montepíos.</li><li><b>Segunda República:</b> Constitución de 1931 (no discriminación, enseñanza primaria gratuita, salario mínimo, seguros sociales). La Guerra Civil y la dictadura frenaron los avances hasta la democracia.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.1.4. El estado del bienestar</h4><p>Tras la Segunda Guerra Mundial, los Estados asumieron ser garantes del bienestar con prestaciones en cuatro ámbitos: sanidad, seguridad social, educación y servicios sociales. Modelos:</p><ul><li><b>Liberal o anglosajón (Reino Unido, Irlanda):</b> predomina lo privado y los seguros; el Estado solo cubre a quien demuestra necesidad.</li><li><b>Conservador o continental (Francia, Alemania, Bélgica…):</b> se apoya en la familia y en seguros contributivos (se cotiza para recibir).</li><li><b>Socialdemócrata o nórdico (Suecia, Dinamarca, Noruega…):</b> universal por ciudadanía, financiado con impuestos altos.</li><li><b>Mediterráneo (España, Italia, Grecia, Portugal):</b> llegó tarde (años 70‑80); la familia y lo privado pesan mucho. En España: sanidad básica y educación obligatoria universales, prestaciones contributivas y atención a la dependencia con pocos recursos.</li><li><b>Crisis del estado del bienestar:</b> menos ingresos y más necesidades → endeudamiento, recortes, copagos y privatización. «Nanny state» (estado niñera) es una crítica a las políticas muy protectoras.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.2. Jerarquía normativa</h4><p>La acción social es una competencia transferida y se regula en niveles internacional, estatal, autonómico y local. Si hay conflicto prevalece la norma de rango superior. De mayor a menor:</p><ul><li>1. Constitución Española.</li><li>2. Reglamentos y directivas de la UE aplicables directamente.</li><li>3. Tratados internacionales ratificados por España.</li><li>4. Leyes de las Cortes (orgánicas y ordinarias) y estatutos de autonomía.</li><li>5. Reales decretos ley y reales decretos legislativos.</li><li>6. Reales decretos y órdenes ministeriales.</li><li>7. Leyes y reglamentos autonómicos.</li><li>8. Ordenanzas, reglamentos y bandos locales.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.2.1. Marco internacional</h4><p>Las instituciones internacionales no pueden obligar del todo, pero influyen mucho.</p><ul><li><b>ONU (1945):</b> Declaración Universal de los Derechos Humanos y Agenda 2030 con 17 Objetivos de Desarrollo Sostenible (ODS).</li><li><b>Organismos de la ONU:</b> PNUD (desarrollo), ONU‑Hábitat (vivienda), FAO y PMA (alimentación), OMS y ONUSIDA (salud), OIT (trabajo), UNESCO (educación), UNICEF (infancia), ONU Mujeres, OIM y ACNUR (migrantes y refugiados).</li><li><b>Tribunal Penal Internacional (La Haya):</b> juzga genocidio, crímenes de guerra y crímenes contra la humanidad.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.2.2. Marco europeo</h4><p>La Unión Europea apoya y complementa a los Estados, que deben trasladar sus normas.</p><ul><li><b>Carta de Derechos Fundamentales de la UE (2000, reformada en 2007):</b> obligatoria; incluye derecho a seguridad y ayuda social.</li><li><b>Pilar Europeo de Derechos Sociales (2017):</b> 20 principios (p. ej., renta mínima y alojamiento para personas sin hogar).</li><li><b>Comité de Protección Social:</b> coordina pensiones, sanidad y cuidados.</li><li><b>Fondos europeos:</b> Fondo Social Europeo (FSE) y Mecanismo de Recuperación y Resiliencia.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.2.3. Marco estatal: la Constitución</h4><p>La Constitución Española define España como Estado social y democrático de derecho y autonómico; proclama la dignidad de las personas y obliga a promover la libertad e igualdad efectivas. Los servicios sociales los desarrollan las comunidades autónomas. Tres grupos de derechos:</p><ul><li><b>Derechos fundamentales y libertades públicas:</b> educación, asociación, huelga, sindicación. Su cambio exige reforma constitucional.</li><li><b>Derechos y deberes de la ciudadanía:</b> exigibles, pero necesitan leyes (trabajo, matrimonio, propiedad).</li><li><b>Principios rectores de la política social y económica:</b> no son exigibles directamente (vivienda, salud, cultura, Seguridad Social, discapacidad).</li><li><b>En 2024 se reformó el art. 49:</b> «disminuidos» pasó a «personas con discapacidad».</li></ul><h4 style="font-size:18px;margin:16px 0 4px">Leyes estatales por sectores</h4><p>Algunas de las normas más importantes:</p><ul><li><b>Económico:</b> Ley 19/2021 del Ingreso Mínimo Vital (compatible con trabajar para evitar la «trampa de pobreza»).</li><li><b>Laboral:</b> Estatuto de los Trabajadores (1980; RD Leg. 2/2015) y Ley 3/2023 de Empleo.</li><li><b>Residencial:</b> Ley 12/2023 por el derecho a la vivienda (zonas tensionadas, límite a subidas del alquiler, grandes tenedores).</li><li><b>Salud:</b> Ley 16/2003 de cohesión y calidad del SNS y Ley 33/2011 General de Salud Pública; quien reside más de 90 días tiene derecho a asistencia.</li><li><b>Educación:</b> LOMLOE (LO 3/2020); FP (LO 3/2022).</li><li><b>Protección social:</b> Ley General de la Seguridad Social (RD Leg. 8/2015).</li><li><b>Infancia:</b> Observatorio de la Infancia y LO 8/2021 de protección integral frente a la violencia («Ley del menor»).</li><li><b>Mayores y dependencia:</b> Imserso y Ley 39/2006 de Dependencia (crea el SAAD).</li><li><b>Discapacidad:</b> Real Patronato sobre Discapacidad, Convención de la ONU (2006) y Ley 6/2022.</li><li><b>Igualdad:</b> LO 1/2004 contra la Violencia de Género, LO 10/2022 de libertad sexual («solo sí es sí»), Ley 4/2023 trans y LGTBI (autodeterminación desde los 14, prohíbe terapias de conversión) y LO 3/2007 de igualdad efectiva.</li><li><b>Extranjería:</b> LO 4/2000 (entrada, estancia, derechos, reagrupación, menores, refugio).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.2.4‑3.2.6. Marco autonómico, local y planes</h4><p>El Estatuto de Autonomía es la norma institucional básica de cada comunidad. Las autonomías tienen leyes de servicios sociales, educativas y sanitarias propias. Los entes locales (ayuntamientos, diputaciones, cabildos, comarcas, mancomunidades) se rigen por la Ley 7/1985 de Bases del Régimen Local (reformada por la Ley 27/2013).</p><ul><li><b>Funciones locales:</b> gestionar servicios sociales básicos, financiar servicios de proximidad (comida a domicilio), planes locales de inclusión participativos y apoyo a la participación ciudadana.</li><li><b>Plan estratégico:</b> documento con líneas de actuación y acciones para alcanzar objetivos en un periodo de tiempo.</li><li><b>Tipos de planes:</b> generales de inclusión y cohesión social, y específicos para ámbitos o colectivos (familias, discapacidad, pobreza, adicciones).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.3. La protección social</h4><p>Es el conjunto de medidas y recursos que la Administración pone en marcha para garantizar el bienestar y reducir la vulnerabilidad (derecho recogido en los arts. 22 y 23 de la DUDH). Busca cubrir las necesidades básicas, garantizar derechos laborales y asegurar rentas mínimas (subsidios, Ingreso Mínimo Vital). Beneficia a toda la sociedad. Sectores:</p><ul><li><b>Económico:</b> pensiones, garantía de renta y redistribución; propuestas como la renta básica o los microcréditos.</li><li><b>Laboral:</b> inserción sociolaboral y economía social (cooperativas).</li><li><b>Educativo:</b> refuerzo de la escuela pública, apoyo escolar, aulas de acogida, formación de adultos.</li><li><b>Salud:</b> asistencia universal (también a personas en situación irregular), programas de salud, préstamo de productos de apoyo.</li><li><b>Residencial:</b> mantener y acceder a la vivienda, regular el alquiler, viviendas de emergencia, VPO y lucha contra la pobreza energética.</li><li><b>Relacional:</b> espacios de encuentro, consejos de participación y voluntariado.</li><li><b>Cultural:</b> envejecimiento activo, deporte y equipamientos culturales accesibles.</li><li><b>Jurídico:</b> justicia gratuita, protección de menores y prisiones orientadas a la reinserción.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.3.2. Los cuatro sistemas de protección social</h4><p>Un sistema de protección social es un conjunto de instituciones y normas que regulan las prestaciones sociales y su financiación. En España hay cuatro:</p><ul><li><b>Sistema Nacional de Salud (SNS):</b> universal, equitativo y descentralizado. Copago farmacéutico del 0 al 60 %.</li><li><b>Sistema Nacional de Empleo:</b> SEPE y servicios autonómicos (fomento del empleo, prestaciones por desempleo, formación).</li><li><b>Seguridad Social:</b> INSS, ISM y Tesorería (pensiones, incapacidad, nacimiento, IMV…).</li><li><b>Servicios sociales:</b> recursos y prestaciones de las Administraciones para necesidades específicas. Niveles: atención básica o primaria (puerta de entrada, local) y especializados (colectivos concretos).</li><li><b>Prestaciones garantizadas:</b> derecho subjetivo, exigible incluso judicialmente.</li><li><b>Prestaciones no garantizadas o condicionadas:</b> dependen del presupuesto disponible.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.4. El/la profesional de la integración social</h4><p>La profesionalización viene de la Charity Organization Society (1869), las corrientes pedagógicas y las escuelas de formación. En España: Diplomatura de Trabajo Social (1990), de Educación Social (1992) y Técnico Superior en Integración Social (1995). Trabaja en equipo interdisciplinar.</p><ul><li><b>Aptitudes:</b> respeto y sinceridad, responsabilidad y compromiso, objetividad y serenidad (evitar el burnout), flexibilidad y creatividad.</li><li><b>Ámbitos:</b> comunitario (a pie de calle, mediación), ocupacional (inserción laboral), residencial (centros, familias) y escolar (apoyo, prevención del acoso).</li><li><b>Funciones:</b> recopilar y analizar información, diseñar y gestionar actuaciones, gestiones administrativas, itinerarios personalizados y acompañamiento, entrenamiento en habilidades, colaborar con la comunidad, generar conciencia crítica y mediar en conflictos.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.4.2. Principios éticos y deontológicos</h4><p>Guían el comportamiento profesional:</p><ul><li>Trato igualitario y respetuoso, sin discriminación.</li><li>Usar instrumentos éticos que no etiqueten ni atenten contra la dignidad.</li><li>Tener en cuenta las decisiones de la persona usuaria (también para terminar la intervención).</li><li>Confidencialidad y secreto profesional.</li><li><b>Profesionalidad:</b> no crear relaciones de dependencia afectiva o íntima.</li><li><b>Velar por el buen desempeño:</b> denunciar malas prácticas e intrusismo.</li><li>Difundir información veraz sobre los colectivos.</li><li>Cooperar con el equipo sin invadir funciones y asumir las decisiones de equipo.</li><li>Potenciar los recursos personales y del entorno.</li></ul><div style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Trucos:</b><ul><li>Modelos del bienestar N‑C‑L‑M: Nórdico = la Nación paga a todos · Continental = Cotizas y cobras · Liberal = Lo mínimo · Mediterráneo = Mamá (la familia) ayuda.</li><li>Historia de la acción social: CARIDAD (Iglesia) → BENEFICENCIA (Estado por civismo) → ASISTENCIA (empieza a ser derecho) → BIENESTAR (el Estado garantiza).</li><li>Los 4 sistemas de protección: «SESE»: Salud, Empleo, Seguridad social, sErvicios sociales.</li></ul></div><h3 style="font-size:22px;margin:26px 0 8px">Tema 4. Ámbitos de intervención con colectivos vulnerables</h3><h4 style="font-size:18px;margin:16px 0 4px">4.1. El diagnóstico de la situación</h4><p>El diagnóstico es el proceso de recopilar y analizar datos para identificar los factores que inciden y las necesidades de las personas en riesgo o exclusión. Debe incluir: el nivel de riesgo y los factores de riesgo y protección, las personas implicadas (características, demandas, capacidades), otros agentes sociales (escuela, familia, Administración) y el pronóstico (qué pasará si se interviene y si no).</p><h4 style="font-size:18px;margin:16px 0 4px">4.1.1. Fuentes de información</h4><p>Las fuentes de información son los recursos de los que se extraen los datos.</p><ul><li><b>Fuentes secundarias:</b> contenidos ya elaborados. Internas (de la propia organización: informes, registros) o externas (publicaciones, estadísticas). Técnica: recopilación y análisis documental.</li><li><b>Fuentes primarias:</b> se producen para esta investigación.</li><li><b>Técnicas observacionales:</b> mirar y registrar conductas en el entorno real.</li><li><b>Técnicas interrogativas:</b> encuesta (cuestionario de preguntas cerradas), entrevista (estructurada, semiestructurada o abierta) e historia de vida (sucesivas entrevistas en profundidad donde la persona cuenta toda su vida).</li><li><b>Técnicas grupales:</b> grupo de discusión y foro.</li><li>La entrevista y la historia de vida se llaman técnicas conversacionales. Ninguna técnica es mejor: depende de la información buscada.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.1.2. Identificar las necesidades</h4><p>La información se ordena en variables con indicadores: información que la persona tiene de su realidad, habilidades sociales, autonomía, recursos económicos, trabajo, formación, unidad de convivencia, vivienda y contexto (entorno social y físico). Un indicador aislado no prueba exclusión; la acumulación sí. Se puede usar un gráfico radial por ámbitos (educativo, salud, laboral, económico, justicia, residencial, cultura, relacional) para ver de un vistazo en qué zona está cada ámbito.</p><h4 style="font-size:18px;margin:16px 0 4px">4.2.1. La institución familiar</h4><p>La familia es una unidad social y económica básica de personas unidas por lazos de parentesco o de pareja (sanguíneos, de afinidad, adopción o políticos). Hoy se habla de familias en plural por su diversidad. Es espacio de ayuda mutua, solidaridad y protección: cuida en las etapas vulnerables, es el principal agente de socialización y responde a necesidades (economía, afecto, vivienda). Cuando los factores de riesgo no se compensan, la familia está en riesgo social, lo que afecta más a menores, mayores, personas dependientes y mujeres.</p><h4 style="font-size:18px;margin:16px 0 4px">4.2.2. Menores en riesgo social</h4><p>Un menor está en riesgo cuando sus cuidadores no pueden cubrir sus necesidades ni garantizar sus derechos. Pobreza y desprotección no son lo mismo: la desprotección se da en todas las clases sociales.</p><ul><li><b>Desamparo por imposibilidad:</b> orfandad, progenitores en prisión o enfermos, menores que llegan solos.</li><li><b>Desamparo por incumplimiento:</b> abandono o falta de lo básico.</li><li><b>Desamparo por inadecuación:</b> p. ej., signos de abuso.</li><li><b>Maltrato:</b> acción, omisión o negligencia no accidental (puede ser también institucional o social).</li><li><b>Menores extranjeros no acompañados:</b> menores de 18 que llegan sin un adulto responsable. El término «mena» ha adquirido connotación negativa. Protocolo marco de 2014. Problemas: centros saturados, vacío legal sin documentación, y al cumplir 18 pueden quedar sin apoyo o ser repatriados.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.2.3. Personas mayores en riesgo social</h4><p>Cambios sociales: más esperanza de vida, envejecimiento de la población y nuevos modelos sociales (individualismo, sobrecarga) que dejan un vacío de cuidados. Recursos: ayuda a domicilio, teleasistencia, residencias, centros de día, unidades psicogeriátricas.</p><ul><li><b>Edadismo:</b> estereotipos por ser mayor (inútil, enfermo, sin interés sexual…) que generan sentimiento de inutilidad.</li><li><b>Aislamiento y soledad:</b> peor salud, apatía y deterioro cognitivo más rápido.</li><li><b>Pobreza:</b> pensiones bajas o no contributivas; a veces mantienen a hijos y nietos.</li><li><b>Maltrato:</b> suele quedar invisible porque ocurre en un marco de confianza.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.2.4. Familias en riesgo social</h4><p>Una familia está en riesgo social cuando no puede garantizar a alguno de sus miembros los derechos básicos o la protección necesaria. Factores: composición (monoparentales o numerosas sin apoyo), dinámica (roles confusos, poca comunicación, falta de habilidades parentales), economía y trabajo, vivienda e historia previa de violencia.</p><ul><li><b>Familias multiproblemáticas:</b> acumulan muchos problemas (conductas problemáticas, delincuencia, adicciones, violencia, falta de normas, desorganización económica, incapacidad parental). Necesitan mediación familiar y parentalidad positiva.</li><li><b>Familias petrificadas o en crisis:</b> algún miembro queda bloqueado tras un suceso traumático (muerte, enfermedad, separación, pérdida del trabajo) y deja de ejercer su rol. Cuanto más imprevisible, más devastador.</li><li><b>Familias en situación de exclusión:</b> desventaja extrema; pobreza, mala vivienda, discriminación, redes débiles y empleo precario a la vez.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.3.1. Discriminación de las mujeres</h4><p>Ser mujer es un factor transversal de riesgo por el modelo androcéntrico y heteropatriarcal. La máxima discriminación es la violencia.</p><ul><li><b>Invisibilidad del trabajo femenino:</b> tareas domésticas y de cuidados no pagadas ni valoradas; en el mercado, empleos de limpieza y cuidados mal pagados.</li><li><b>Segregación formativa y laboral:</b> pocas chicas en STEM; más en áreas feminizadas.</li><li><b>Dificultades de conciliación:</b> jornadas reducidas, menos ascensos (techo de cristal).</li><li>Condiciones más precarias y brecha salarial (menos sueldo por el mismo trabajo o de igual valor).</li><li><b>Más vulnerables:</b> mayores de 45 en paro de larga duración, jóvenes sin cualificación, inmigrantes no comunitarias y madres de familias monoparentales.</li><li><b>Trabajadoras sexuales:</b> estigma, invisibilidad, vulnerabilidad ante clientes y proxenetas; a menudo víctimas de trata.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.3.2. Sexo, género y orientación sexual</h4><p>Conceptos básicos para intervenir:</p><ul><li><b>Sexo:</b> características biológicas (cromosomas XX/XY) que clasifican en dos grupos (dimorfismo sexual).</li><li><b>Intersexualidad:</b> los órganos sexuales no corresponden claramente a un sexo (1 de cada 2.000 personas). No determina la orientación ni la identidad.</li><li><b>Género:</b> características sociales atribuidas a un sexo. Identidad de género: cómo te percibes. Expresión de género: cómo lo muestras.</li><li><b>Cisgénero:</b> la identidad coincide con el sexo asignado al nacer.</li><li><b>Transgénero:</b> la identidad no coincide con el sexo asignado. Puede ser binario (hombre o mujer trans) o no binario/intergénero (género fluido, agénero, bigénero, pangénero, demigénero).</li><li><b>Transexual:</b> persona trans que hace una transición médica (MaH/FtM o HaM/MtF).</li><li><b>Androginia:</b> expresión que combina rasgos masculinos y femeninos.</li><li><b>Teoría queer:</b> critica las categorías binarias; «queer» designa identidades no normativas.</li><li><b>Orientación sexual:</b> atracción sexual, emocional o afectiva hacia personas de un sexo o género. Heterosexual, homosexual (lesbiana, gay), bisexual y asexual (hoy es una orientación más; no es lo mismo que el celibato).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.3.3. Discriminación de las personas LGTBIQ+</h4><p>LGTBIQ+ agrupa identidades sexuales y de género no normativas. Sufren homofobia (incluye a bisexuales; también lesbofobia, gayfobia, bifobia) y transfobia: exclusión familiar, discriminación laboral, violencia. En muchos países sigue siendo delito.</p><ul><li><b>Ocultación:</b> esconder la identidad por miedo al rechazo, con malestar psicológico, fracaso escolar y absentismo.</li><li><b>Revelación pública («salir del armario»):</b> proceso difícil pero necesario para la autoestima. El outing es revelar la identidad de alguien sin su consentimiento.</li><li><b>Personas intersexuales:</b> discriminación por invisibilidad; debate sobre intervenciones quirúrgicas tempranas que buscan ajustar al bebé al modelo binario.</li><li><b>Factores que agravan el riesgo:</b> vejez (vuelven a esconderse en residencias), inmigración (doble discriminación), precariedad laboral y residencial, red familiar frágil, profesionales sin formación y trabajo sexual.</li><li><b>Datos 2024:</b> 30,6 % en riesgo de pobreza y 23 % con alguna experiencia de sinhogarismo.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.4. Personas con discapacidad</h4><p>Persona con una deficiencia física, intelectual, sensorial o psicosocial que le dificulta interactuar con el entorno, hacer las AVD o participar. Modelos explicativos:</p><ul><li><b>Modelo de la CIF (OMS, 2001):</b> la discapacidad resulta de la relación entre las condiciones de salud y los factores contextuales (personales y del entorno); afecta a funciones, actividad y participación.</li><li><b>Modelo ecológico:</b> interacción de la persona con su entorno inmediato, la comunidad y la sociedad. La discapacidad aparece cuando el contexto no se ajusta a la persona.</li><li><b>Modelo de la diversidad funcional (Foro de Vida Independiente):</b> las personas funcionan de forma distinta y tienen derecho a vivir con dignidad desde la diferencia y controlar sus vidas.</li><li><b>Discapacidad múltiple:</b> dos o más discapacidades a la vez.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.4.1. Tipos de discapacidad</h4><p>Según la función afectada, la causa, el momento (congénita o adquirida) y la intensidad:</p><ul><li><b>Física o motora:</b> limitaciones para producir, regular o ejecutar movimientos. Causas neurológicas (esclerosis múltiple, lesión medular), osteomusculares (artritis, distrofia, amputaciones) u orgánicas no motoras (fibrosis quística).</li><li><b>Intelectual:</b> limitaciones en el funcionamiento cognitivo y en la conducta adaptativa (habilidades conceptuales, sociales y prácticas); aparece antes de los 18 años.</li><li><b>Visual:</b> limitación severa o ausencia de visión.</li><li><b>Auditiva:</b> limitación importante o total de la audición; prelocutiva (antes de aprender a hablar) o poslocutiva.</li><li><b>Sordoceguera:</b> deficiencia auditiva y visual a la vez.</li><li><b>Psicosocial:</b> alteración permanente del comportamiento adaptativo por trastornos mentales: del estado de ánimo (depresión, bipolar), de la personalidad, de ansiedad (fobias, pánico, TOC, estrés postraumático) y esquizofrenia (síntomas positivos como alucinaciones y negativos como apatía).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.4.2‑4.4.3. Riesgo social y necesidades en la discapacidad</h4><p>Factores individuales: autonomía, sexo (más riesgo en mujeres), salud, trabajo, recursos, nivel sociocultural, otras vulnerabilidades y la actitud ante la discapacidad. Factores contextuales: apoyo familiar y red social, barreras, recursos escasos, prestaciones insuficientes y prejuicios sociales. Los apoyos son clave:</p><ul><li><b>Productos de apoyo (ayudas técnicas):</b> previenen, compensan o neutralizan limitaciones (sillas de ruedas, audífonos…).</li><li><b>Apoyos personales:</b> familia, profesionales o asistente personal.</li><li><b>Accesibilidad:</b> característica del medio que asegura su uso normalizado, seguro y eficiente por todas las personas. Principio de diseño universal.</li><li><b>Barreras:</b> arquitectónicas urbanísticas (BAU), en la edificación (BAE), en el transporte (BAT) y en la comunicación (incluidas las cognitivas y las TIC).</li><li><b>Necesidades educativas:</b> detección temprana, inclusión educativa y orientación.</li><li><b>Empleo:</b> ordinario (con cuota de reserva en empresas grandes), con apoyo (preparador laboral antes, durante y después), centros especiales de empleo (trabajo productivo con ajuste personal) y centros ocupacionales (terapia ocupacional).</li><li><b>Vida independiente:</b> ingresos, vivienda accesible y habilidades para las AVD.</li><li><b>Comunicación:</b> sistemas aumentativos (refuerzan el habla) y alternativos (sustituyen el habla), lengua de signos.</li><li>Ocio inclusivo, participación y vida afectiva y sexual.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.5. Personas con adicciones</h4><p>La adicción es el hábito compulsivo e incontrolable de hacer una actividad, consumir una sustancia o mantener una relación para obtener placer. Con la repetición aumenta la tolerancia (hace falta más) y aparece la dependencia:</p><ul><li><b>Dependencia física:</b> el cuerpo exige la sustancia; si baja, aparece el síndrome de abstinencia.</li><li><b>Dependencia psíquica:</b> la conducta libera dopamina y oxitocina y se siente la necesidad de repetirla.</li><li><b>Droga:</b> sustancia psicoactiva que altera el sistema nervioso central y puede causar dependencia. Vías: oral, pulmonar, nasal, parenteral (inyectada), transdérmica y transmucosal.</li><li><b>Estimulantes:</b> aumentan la actividad (mayores: cocaína, anfetaminas; menores: nicotina, cafeína).</li><li><b>Depresoras:</b> ralentizan el cerebro (alcohol, opiáceos como heroína o metadona, benzodiazepinas).</li><li><b>Alucinógenas:</b> distorsionan la percepción (LSD, mescalina).</li><li><b>Socioadicciones o adicciones comportamentales:</b> sin sustancia (trabajo, internet, ejercicio, sexo, ludopatía, oniomanía o compra compulsiva). Difíciles de detectar porque la actividad no es dañina en sí.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.5.2‑4.5.3. Riesgo y necesidades en las adicciones</h4><p>No todo consumo lleva a dependencia ni toda dependencia a exclusión. Factores:</p><ul><li><b>Del elemento adictivo:</b> poder adictivo (la heroína engancha muy rápido) e imagen social (heroína muy estigmatizada; cocaína asociada al éxito; alcohol aceptado hasta que es abuso).</li><li><b>Individuales:</b> herencia, factores psicoemocionales (baja autoestima, poca tolerancia a la frustración), personalidad (impulsividad, «a mí no me pasa nada»), situación personal (presión de grupo en la adolescencia) y visión positiva de la sustancia.</li><li><b>Contextuales:</b> entorno familiar, comunitario (acceso fácil, falta de prevención) y socioeconómico (consumismo, publicidad, crisis).</li><li><b>Deterioro que sufren:</b> personal, familiar, económico y social (delincuencia, indigencia). Suelen ocultar la adicción.</li><li><b>Tratamiento en 3 fases:</b> 1) desintoxicación (dependencia física; ambulatoria u hospitalaria), 2) deshabituación (psicoterapia, autocontrol, prevenir recaídas; comunidades terapéuticas y pisos de apoyo), 3) rehabilitación (autonomía, habilidades sociolaborales, relaciones).</li><li><b>Necesidades de calidad de vida:</b> aunque se siga consumiendo, que sea controlado y seguro (reducción de daños).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.6. Origen, etnia, cultura o religión</h4><p>Estas variables se mezclan y la discriminación puede combinarse.</p><ul><li><b>Racismo:</b> el grupo mayoritario se cree superior y discrimina por rasgos físicos o culturales. Ej.: antigitanismo (el pueblo gitano llegó a España en 1425 y sigue sufriendo discriminación).</li><li><b>Xenofobia:</b> rechazo a lo extranjero por etnocentrismo o desconocimiento.</li><li><b>Discriminación religiosa:</b> antisemitismo e islamofobia (se confunde islam con fundamentalismo; dificultades para encontrar lugares de culto o enterramiento).</li><li><b>Factores individuales:</b> edad y sexo (las mujeres sufren doble discriminación), situación jurídica (sin papeles no hay derechos de ciudadanía), recursos económicos, formación, idioma y situación laboral.</li><li><b>Factores contextuales:</b> proceso migratorio, choque cultural, redes de apoyo débiles, desigualdad en el acceso a bienes (alquiler, banca), trabajo precario, vivienda (pisos patera, camas calientes), sanidad (en situación irregular solo urgencias, embarazo y parto) y estigma en medios y discursos políticos.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">Etapas del proceso migratorio</h4><p>El viaje migratorio tiene varias fases:</p><ul><li><b>1. Premigración y toma de la decisión:</b> expectativas, a veces una visión distorsionada del éxito.</li><li><b>2. Tránsito y limbo migratorio:</b> la etapa más difícil (viaje duro, a veces ilegal) y laberinto burocrático para regularizarse.</li><li><b>3. Sobrecompensación:</b> toda la energía en sobrevivir y adaptarse.</li><li><b>4. Descompensación o crisis:</b> aparecen los conflictos y el duelo migratorio (pérdida de valores, costumbres, lengua…).</li><li><b>5. Proceso transgeneracional:</b> la 2.ª generación puede no sentirse de ningún sitio; la 3.ª suele sentirse plenamente parte de la sociedad de acogida.</li><li><b>Necesidades:</b> orientación y acompañamiento, aprender la lengua, asesoramiento jurídico (y programas para víctimas de trata), compensación educativa sin segregación, sanidad con mediadores culturales, inserción laboral, apoyo al asociacionismo y sensibilización de la ciudadanía (diálogo interreligioso).</li></ul><div style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Trucos:</b><ul><li>Tratamiento de adicciones = D‑D‑R: DESintoxicar el cuerpo, DESHABITUAR la mente, REHABILITAR la vida.</li><li>Tipos de drogas por su efecto: «E‑D‑A»: Estimulantes aceleran, Depresoras frenan, Alucinógenas dist
