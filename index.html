rno.</li><li><b>Movilización:</b> Cambio de postura sin cambiar el cuerpo de superficie o de lugar.</li><li><b>Desplazamiento:</b> Movimiento de una persona de un lugar a otro del espacio.</li><li><b>Reestructuración ambiental:</b> Intervenciones en el entorno físico habitual para favorecer la autonomía.</li><li><b>Wayfinding:</b> Recursos y sistemas para que una persona comprenda un espacio desconocido y complejo y encuentre su camino.</li><li><b>Simbolización:</b> Uso de imágenes representativas para identificar espacios, tareas o eventos.</li><li><b>Técnica de Hoover:</b> Uso del bastón describiendo un arco por delante para detectar obstáculos en exteriores.</li><li><b>Mecánica corporal:</b> Principios para mover a personas con movimientos coordinados y posturas estables, previniendo lesiones.</li></ul><h3 style="font-size:21px;margin:22px 0 8px">Tema 7. Entrenamiento en habilidades sociales</h3><p><b>Habilidades sociales e inteligencia emocional.</b> Destrezas para relacionarnos con eficacia. Muy unidas a la inteligencia emocional (Goleman): reconocer y manejar las emociones propias y ajenas.</p><p><b>Clasificación de Goldstein (6 grupos).</b> Básicas (escuchar, iniciar una conversación, dar las gracias), avanzadas, relacionadas con los sentimientos (afectivas), alternativas a la agresión (pedir permiso, negociar, autocontrol), para hacer frente al estrés y de planificación.</p><p><b>Componentes.</b> Conductuales: verbales (el mensaje), no verbales (mirada, postura, distancia: íntima hasta 0,5 m, personal, social y pública) y paralingüísticos. Además afectivos, cognitivos (como el locus de control interno o externo) y fisiológicos.</p><p><b>Capacidades clave.</b> Empatía (entender los sentimientos del otro desde su perspectiva), escucha activa (atender para comprender), asertividad (expresarte libre y seguro sin agredir ni manipular) y resolución de conflictos.</p><p><b>El programa.</b> Valoración (entrevista, observación, escalas), planificación, ejecución y evaluación. Técnicas: role playing (representar una situación real), interacción planificada, inversión de roles y dinámicas de grupo. El profesional es siempre un modelo.</p><p style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Truco:</b> Tres estilos ante un conflicto: AGRESIVO = yo gano, tú pierdes. PASIVO = yo pierdo, tú ganas. ASERTIVO = digo lo que siento respetándote. &quot;ASERTIVO = ACIERTO&quot;.</p><ul><li><b>Inteligencia emocional:</b> Capacidad de reconocer y manejar las emociones propias y de los demás (Daniel Goleman, 1995).</li><li><b>Habilidades básicas (Goldstein):</b> Las primeras que se adquieren: escuchar, iniciar y mantener una conversación, preguntar, dar las gracias, presentarse.</li><li><b>Alternativas a la agresión:</b> Grupo de Goldstein: pedir permiso, compartir, ayudar, negociar, autocontrol, defender los propios derechos.</li><li><b>Distancia íntima:</b> Hasta 0,5 m. Reservada a personas emocionalmente cercanas.</li><li><b>Componentes no verbales:</b> Elementos no lingüísticos que transmiten información: mirada, gestos, postura, distancia, aspecto externo.</li><li><b>Locus de control:</b> A qué atribuye la persona lo que le pasa: a causas externas e incontrolables o internas y controlables.</li><li><b>Empatía:</b> Capacidad de entender los sentimientos y emociones de otra persona desde su perspectiva.</li><li><b>Escucha activa:</b> Atender al mensaje verbal y no verbal de otra persona con intención de comprenderlo.</li><li><b>Asertividad:</b> Expresar sentimientos y pensamientos de forma libre y segura, sin privar a los demás de sus derechos ni agredir o manipular.</li><li><b>Role playing:</b> Representación de una situación o caso concreto de la vida real.</li><li><b>Inversión de roles:</b> Dos personas intercambian sus papeles y defienden la postura de la otra.</li></ul><h3 style="font-size:21px;margin:22px 0 8px">Tema 8. Estimulación de las funciones cognitivas</h3><p><b>Funciones cognitivas.</b> Capacidades para adquirir, procesar, almacenar, transformar y recuperar la información: percepción (Gestalt: ley de la buena forma), atención, memoria (codificar, almacenar, recuperar por reconocimiento o evocación), pensamiento y lenguaje.</p><p><b>Estado de ánimo y personalidad.</b> Estado de ánimo: tendencia emocional duradera (alteraciones: depresión, hipertimia). Personalidad: rasgos que definen a la persona (temperamento heredado + carácter adquirido). Autoconcepto: cómo te ves; autoestima: el valor que le das.</p><p><b>Disfunciones.</b> Desorientación, deterioro de memoria, disonancias cognitivas, mecanismos de defensa (protegerse de la ansiedad sin tocar las causas) y distorsiones cognitivas: interpretar mal la realidad (catastrofismo, perfeccionismo, «todos se ríen de mí»).</p><p><b>Valoración.</b> Entrevista, test de Pfeiffer (10 preguntas, rápido), miniexamen cognoscitivo de Lobo (versión española del MMSE), inventario de depresión de Beck (21 ítems) y autorregistros.</p><p><b>Técnicas de intervención.</b> Estimulación cognitiva (se basa en la plasticidad cerebral): ejercicios de memoria, reminiscencia, orientación a la realidad. Técnicas cognitivas: terapia de Beck, resolución de problemas. Otras: respiración diafragmática, relajación progresiva, mindfulness y musicoterapia.</p><p style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Truco:</b> Plasticidad cerebral = el cerebro es PLASTILINA: se puede moldear a cualquier edad. Por eso el médico «receta» jugar a las cartas o al dominó.</p><ul><li><b>Funciones cognitivas:</b> Capacidades para adquirir, procesar, almacenar, transformar y recuperar la información del entorno.</li><li><b>Percepción:</b> Proceso mental de recibir información por los sentidos, interpretarla y elaborarla.</li><li><b>Memoria:</b> Capacidad de codificar, almacenar y recuperar información de un aprendizaje o experiencia.</li><li><b>Falso recuerdo:</b> Recuerdo distorsionado o inventado de algo que no sucedió; más frecuente al envejecer.</li><li><b>Estado de ánimo:</b> Tendencia emocional duradera que impregna sentimientos, pensamientos y conductas.</li><li><b>Autoconcepto vs. autoestima:</b> Autoconcepto: cómo me percibo. Autoestima: el valor que doy a esa percepción.</li><li><b>Mecanismo de defensa:</b> Proceso inconsciente para protegerse de la ansiedad sin actuar sobre sus causas.</li><li><b>Distorsión cognitiva:</b> Interpretación errónea de la realidad por pensamientos o creencias irracionales.</li><li><b>Catastrofismo:</b> Distorsión que imagina siempre el peor escenario posible.</li><li><b>Test de Pfeiffer:</b> Cuestionario de 10 preguntas, sencillo y rápido, para valorar el estado mental.</li><li><b>Inventario de Beck:</b> Cuestionario autoaplicado de 21 apartados sobre síntomas de depresión.</li><li><b>Plasticidad cerebral:</b> Capacidad del cerebro de modificar su organización y funcionamiento para adaptarse o compensar daños.</li><li><b>Reminiscencia:</b> Técnica que estimula el recuerdo de vivencias del pasado.</li><li><b>Relajación progresiva:</b> Técnica para identificar las tensiones musculares y controlarlas voluntariamente.</li></ul></main></noscript>

   ["Técnica de Hoover","Uso del bastón describiendo un arco por delante para detectar obstáculos en exteriores."],
   ["Mecánica corporal","Principios para mover a personas con movimientos coordinados y posturas estables, previniendo lesiones."]
  ],
  quiz:[

   ["Los carteles con dibujos para identificar el baño o el comedor de un centro son…",["Simbolización","Técnica de Hoover","Guía vidente","Domótica"],"Imágenes representativas que identifican espacios."],
   ["El sistema que ayuda a encontrar el camino en un hospital o aeropuerto es el…",["Wayfinding","Encadenamiento","Moldeado","Caucus"],"Combina recursos para ubicarse en espacios complejos."],
   ["La técnica de Hoover se usa con personas con…",["Discapacidad visual","Discapacidad auditiva","Adicciones","Depresión"],"Es una técnica de bastón para desplazarse de forma independiente."],
   ["¿Cuál es el mejor tratamiento de las lesiones del profesional al mover personas?",["La prevención con mecánica corporal","Tomar analgésicos","Hacerlo deprisa","Hacerlo siempre solo"],"Movimientos coordinados y pausados y postura estable."]
  ]
},
{ n:7, title:"Entrenamiento en habilidades sociales",
  ideas:[
   ["Habilidades sociales e inteligencia emocional","Destrezas para relacionarnos con eficacia. Muy unidas a la inteligencia emocional (Goleman): reconocer y manejar las emociones propias y ajenas."],
   ["Clasificación de Goldstein (6 grupos)","Básicas (escuchar, iniciar una conversación, dar las gracias), avanzadas, relacionadas con los sentimientos (afectivas), alternativas a la agresión (pedir permiso, negociar, autocontrol), para hacer frente al estrés y de planificación."],
   ["Componentes","Conductuales: verbales (el mensaje), no verbales (mirada, postura, distancia: íntima hasta 0,5 m, personal, social y pública) y paralingüísticos. Además afectivos, cognitivos (como el locus de control interno o externo) y fisiológicos."],
   ["Capacidades clave","Empatía (entender los sentimientos del otro desde su perspectiva), escucha activa (atender para comprender), asertividad (expresarte libre y seguro sin agredir ni manipular) y resolución de conflictos."],
   ["El programa","Valoración (entrevista, observación, escalas), planificación, ejecución y evaluación. Técnicas: role playing (representar una situación real), interacción planificada, inversión de roles y dinámicas de grupo. El profesional es siempre un modelo."]
  ],
  truco:"Tres estilos ante un conflicto: AGRESIVO = yo gano, tú pierdes. PASIVO = yo pierdo, tú ganas. ASERTIVO = digo lo que siento respetándote. \"ASERTIVO = ACIERTO\".",
  cards:[
   ["Inteligencia emocional","Capacidad de reconocer y manejar las emociones propias y de los demás (Daniel Goleman, 1995)."],
   ["Habilidades básicas (Goldstein)","Las primeras que se adquieren: escuchar, iniciar y mantener una conversación, preguntar, dar las gracias, presentarse."],
   ["Alternativas a la agresión","Grupo de Goldstein: pedir permiso, compartir, ayudar, negociar, autocontrol, defender los propios derechos."],
   ["Distancia íntima","Hasta 0,5 m. Reservada a personas emocionalmente cercanas."],
   ["Componentes no verbales","Elementos no lingüísticos que transmiten información: mirada, gestos, postura, distancia, aspecto externo."],
   ["Locus de control","A qué atribuye la persona lo que le pasa: a causas externas e incontrolables o internas y controlables."],
   ["Empatía","Capacidad de entender los sentimientos y emociones de otra persona desde su perspectiva."],
   ["Escucha activa","Atender al mensaje verbal y no verbal de otra persona con intención de comprenderlo."],
   ["Asertividad","Expresar sentimientos y pensamientos de forma libre y segura, sin privar a los demás de sus derechos ni agredir o manipular."],
   ["Role playing","Representación de una situación o caso concreto de la vida real."],
   ["Inversión de roles","Dos personas intercambian sus papeles y defienden la postura de la otra."]
  ],
  quiz:[
   ["Decir «no me apetece ir, prefiero quedarme hoy» con calma y respeto es…",["Asertividad","Agresividad","Pasividad","Manipulación"],"Expresas lo que piensas sin agredir ni privar a otros de sus derechos."],
   ["¿Quién popularizó la inteligencia emocional?",["Daniel Goleman","Jean Piaget","Abraham Maslow","Arnold Goldstein"],"Lo hizo en 1995."],
   ["Escuchar e iniciar una conversación son habilidades…",["Básicas","Avanzadas","Alternativas a la agresión","De planificación"],"Según Goldstein, son las primeras que se adquieren."],
   ["Representar una situación real para practicar cómo actuar es…",["Role playing","Tiempo fuera","Economía de fichas","Wayfinding"],"Permite valorar mensaje, tono, distancia, mirada…"],
   ["«He suspendido porque el profesor me tiene manía» muestra un locus de control…",["Externo","Interno","Neutro","Positivo"],"Atribuye lo que pasa a causas externas e incontrolables."],
   ["¿Hasta qué distancia llega la zona íntima?",["Hasta 0,5 metros","Hasta 3 metros","Hasta 10 metros","No existe"],"Se reserva a personas emocionalmente cercanas."]
  ]
},
{ n:8, title:"Estimulación de las funciones cognitivas",
  ideas:[
   ["Funciones cognitivas","Capacidades para adquirir, procesar, almacenar, transformar y recuperar la información: percepción (Gestalt: ley de la buena forma), atención, memoria (codificar, almacenar, recuperar por reconocimiento o evocación), pensamiento y lenguaje."],
   ["Estado de ánimo y personalidad","Estado de ánimo: tendencia emocional duradera (alteraciones: depresión, hipertimia). Personalidad: rasgos que definen a la persona (temperamento heredado + carácter adquirido). Autoconcepto: cómo te ves; autoestima: el valor que le das."],
   ["Disfunciones","Desorientación, deterioro de memoria, disonancias cognitivas, mecanismos de defensa (protegerse de la ansiedad sin tocar las causas) y distorsiones cognitivas: interpretar mal la realidad (catastrofismo, perfeccionismo, «todos se ríen de mí»)."],
   ["Valoración","Entrevista, test de Pfeiffer (10 preguntas, rápido), miniexamen cognoscitivo de Lobo (versión española del MMSE), inventario de depresión de Beck (21 ítems) y autorregistros."],
   ["Técnicas de intervención","Estimulación cognitiva (se basa en la plasticidad cerebral): ejercicios de memoria, reminiscencia, orientación a la realidad. Técnicas cognitivas: terapia de Beck, resolución de problemas. Otras: respiración diafragmática, relajación progresiva, mindfulness y musicoterapia."]
  ],
  truco:"Plasticidad cerebral = el cerebro es PLASTILINA: se puede moldear a cualquier edad. Por eso el médico «receta» jugar a las cartas o al dominó.",
  cards:[
   ["Funciones cognitivas","Capacidades para adquirir, procesar, almacenar, transformar y recuperar la información del entorno."],
   ["Percepción","Proceso mental de recibir información por los sentidos, interpretarla y elaborarla."],
   ["Memoria","Capacidad de codificar, almacenar y recuperar información de un aprendizaje o experiencia."],
   ["Falso recuerdo","Recuerdo distorsionado o inventado de algo que no sucedió; más frecuente al envejecer."],
   ["Estado de ánimo","Tendencia emocional duradera que impregna sentimientos, pensamientos y conductas."],
   ["Autoconcepto vs. autoestima","Autoconcepto: cómo me percibo. Autoestima: el valor que doy a esa percepción."],
   ["Mecanismo de defensa","Proceso inconsciente para protegerse de la ansiedad sin actuar sobre sus causas."],
   ["Distorsión cognitiva","Interpretación errónea de la realidad por pensamientos o creencias irracionales."],
   ["Catastrofismo","Distorsión que imagina siempre el peor escenario posible."],
   ["Test de Pfeiffer","Cuestionario de 10 preguntas, sencillo y rápido, para valorar el estado mental."],
   ["Inventario de Beck","Cuestionario autoaplicado de 21 apartados sobre síntomas de depresión."],
   ["Plasticidad cerebral","Capacidad del cerebro de modificar su organización y funcionamiento para adaptarse o compensar daños."],
   ["Reminiscencia","Técnica que estimula el recuerdo de vivencias del pasado."],
   ["Relajación progresiva","Técnica para identificar las tensiones musculares y controlarlas voluntariamente."]
  ],
  quiz:[
   ["No ir a una entrevista de trabajo porque «seguro que no me cogen» es…",["Catastrofismo","Asertividad","Reminiscencia","Plasticidad"],"Es una distorsión que imagina el peor escenario."],
   ["¿En qué se basan todas las técnicas de estimulación cognitiva?",["En la plasticidad cerebral","En el castigo","En la herencia genética","En la suerte"],"El cerebro puede reorganizarse para adaptarse o compensar daños."],
   ["¿Qué instrumento valora la depresión con 21 apartados?",["Inventario de Beck","Test de Pfeiffer","Índice de Barthel","Escala de Lawton"],"Es un cuestionario autoaplicado."],
   ["Usar fotos antiguas para que una persona mayor recuerde su juventud es…",["Reminiscencia","Extinción","Wayfinding","Moldeado"],"Estimula la rememoración de vivencias."],
   ["El miniexamen cognoscitivo de Lobo es una adaptación española del…",["MMSE de Folstein","Test de Pfeiffer","Inventario de Beck","Índice de Katz"],"Valora varias áreas cognitivas."],
   ["La diferencia entre temperamento y carácter es que el temperamento…",["Es hereditario","Se aprende con la vida","Es lo mismo","Solo existe en la infancia"],"El carácter se adquiere a lo largo de la vida."]
  ]

</script>
<script>
(function(){
"use strict";
const $app=document.getElementById('app');
const KEY='fanzine-repaso-v1';
let S={units:{},cards:{},fails:{},days:[],last:null};
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function touchDay(){const d=new Date().toISOString().slice(0,10); if(!S.days.includes(d)){S.days.push(d); if(S.days.length>60)S.days.shift(); save();}}
function streak(){let n=0;const set=new Set(S.days);const d=new Date();for(;;){const k=d.toISOString().slice(0,10);if(set.has(k)){n++;d.setDate(d.getDate()-1);}else break;}return n;}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const book=id=>BOOKS.find(b=>b.id===id);
const uKey=(b,n)=>b+':'+n;
function uState(b,n){return S.units[uKey(b,n)]||(S.units[uKey(b,n)]={read:false,best:0,cards:false});}
function starsOf(b,n){const u=S.units[uKey(b,n)]||{};return (u.read?1:0)+(u.cards?1:0)+((u.best||0)>=80?1:0);}
function bookPct(bk){const max=bk.units.length*3;let s=0;bk.units.forEach(u=>s+=starsOf(bk.id,u.n));return Math.round(s/max*100);}
function starHTML(n){return '<span class="stars" aria-label="'+n+' de 3 estrellas">'+[0,1,2].map(i=>'<span class="'+(i<n?'on':'off')+'">★</span>').join('')+'</span>';}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),1800);}
function allQuestions(filter){const out=[];BOOKS.forEach(b=>{if(filter&&filter.book&&filter.book!==b.id)return;b.units.forEach(u=>{u.quiz.forEach((q,i)=>out.push({b:b.id,ink:b.color,short:b.short,n:u.n,i:i,q:q[0],opts:q[1],ex:q[2]}));});});return out;}
const qid=q=>q.b+':'+q.n+':'+q.i;
const failCount=()=>Object.keys(S.fails).length;

function bar(title,back,ink){
  return '<header class="bar"'+(ink?' data-ink="'+ink+'"':'')+'><div class="in">'+
    (back?'<button class="back" aria-label="Volver" data-go="'+back+'">←</button>':'')+
    '<div class="ttl">'+esc(title)+'</div>'+
    '<div class="streak" title="Días seguidos estudiando">🔥 '+streak()+'</div></div></header>';
}

/* ---------- HOME ---------- */
function home(){
  const total=BOOKS.reduce((a,b)=>a+b.units.length,0);
  const cards=BOOKS.reduce((a,b)=>a+b.units.reduce((x,u)=>x+u.cards.length,0),0);
  const qs=allQuestions().length;
  let h='<main class="wrap"><section class="hero">'+
    '<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>'+
    '<p class="for">Para Alzahra · 1.º de Integración Social</p>'+
    '<h1><span>Estudiar</span><span class="l2">sin dormirse</span></h1>'+
    '<p class="lead">Tus cuatro libros, en pequeño: lee lo esencial, gira tarjetas y ponte a prueba. Cada tema da hasta tres estrellas.</p>'+
    '</section>'+
    '<div class="stats"><span class="chip">'+total+' temas</span><span class="chip">'+cards+' tarjetas</span><span class="chip">'+qs+' preguntas</span></div>'+
    '<div class="covers">';
  BOOKS.forEach(b=>{const p=bookPct(b);
    h+='<button class="cover" data-ink="'+b.color+'" data-go="#/b/'+b.id+'"><h2>'+esc(b.title)+'</h2><div class="sub">'+esc(b.intro)+'</div>'+
      '<div class="meta"><span>'+b.units.length+' temas</span><span style="display:flex;align-items:center;gap:8px">'+p+'%<span class="meter"><i style="width:'+p+'%"></i></span></span></div></button>';});
  h+='</div><h2 class="section-t">Modo juego</h2><div class="tools">'+
    '<button class="tool" data-ink="pink" data-go="#/quiz/mix"><span class="ico">⚡</span><span><b>Repaso relámpago</b><span>10 preguntas al azar de los cuatro libros</span></span></button>'+
    '<button class="tool" data-ink="yellow" data-go="#/quiz/fails"'+(failCount()?'':' disabled')+'><span class="ico">🎯</span><span><b>Mis fallos ('+failCount()+')</b><span>'+(failCount()?'Vuelve a las preguntas que fallaste hasta acertarlas':'Aquí irán las preguntas que falles')+'</span></span></button>'+
    '<button class="tool" data-ink="green" data-go="#/match/mix"><span class="ico">🧩</span><span><b>Emparejar mezclado</b><span>Une conceptos con su definición</span></span></button>'+
    '<button class="tool" data-ink="blue" data-go="#/cards/mix"><span class="ico">🃏</span><span><b>Tarjetas al azar</b><span>15 tarjetas de cualquier libro</span></span></button>'+
    '</div><div class="foot"><span>Tu progreso se guarda en este móvil.</span><button class="linkbtn" id="reset">Borrar mi progreso</button></div></main>';
  return bar('Fanzine de repaso')+h;
}

/* ---------- BOOK ---------- */
function bookView(id){
  const b=book(id); if(!b) return home();
  let h=bar(b.short,'#/',b.color)+'<main class="wrap" data-ink="'+b.color+'"><section class="bhead"><h1>'+esc(b.title)+'</h1><p class="muted">'+esc(b.intro)+'</p></section><ol class="units">';
  b.units.forEach(u=>{h+='<li><button class="unit" data-go="#/u/'+b.id+'/'+u.n+'/esencial"><span class="num">'+u.n+'</span><span><b>'+esc(u.title)+'</b><small>'+u.cards.length+' tarjetas · '+u.quiz.length+' preguntas</small></span>'+starHTML(starsOf(b.id,u.n))+'</button></li>';});
  h+='</ol><button class="bigbtn" data-go="#/quiz/book/'+b.id+'">Examen del libro: 12 preguntas</button>'+
     '<p class="muted" style="margin-top:14px;font-size:14.5px">Estrellas: ★ leer lo esencial · ★ saberte todas las tarjetas · ★ sacar 80 % o más en el test.</p></main>';
  return h;
}

/* ---------- UNIT ---------- */
const TABS=[['esencial','📖','Lo esencial'],['tarjetas','🃏','Tarjetas'],['test','✅','Test'],['emparejar','🧩','Emparejar']];
function unitView(id,n,tab){
  const b=book(id); const u=b&&b.units.find(x=>x.n==n); if(!u) return home();
  let h=bar(b.short+' · Tema '+u.n,'#/b/'+b.id,b.color)+'<main class="wrap" data-ink="'+b.color+'"><section class="uhead"><span class="tag">Tema '+u.n+' de '+b.units.length+'</span><h1>'+esc(u.title)+'</h1></section>'+
    '<nav class="tabs" role="tablist">'+TABS.map(t=>'<button class="tab" role="tab" aria-selected="'+(t[0]===tab)+'" data-go="#/u/'+b.id+'/'+u.n+'/'+t[0]+'"><span class="e" aria-hidden="true">'+t[1]+'</span>'+t[2]+'</button>').join('')+'</nav><div id="pane"></div></main>';
  return h;
}
function paneEsencial(b,u){
  const st=uState(b.id,u.n);
  let h=u.ideas.map(i=>'<div class="idea"><h3>'+esc(i[0])+'</h3><p>'+esc(i[1])+'</p></div>').join('');
  h+='<div class="trick"><b>Truco para recordarlo</b>'+esc(u.truco)+'</div>';
  h+='<button class="bigbtn done-read" id="readok">'+(st.read?'Leído ✓ Ahora, a las tarjetas':'Ya lo he leído: ganar ★')+'</button>';
  return h;
}

/* ---------- FLASHCARDS ---------- */
let FC=null;
function startCards(list,meta){FC={list:shuffle(list),i:0,known:0,again:0,meta:meta,flipped:false};}
function paneCards(){
  if(!FC.list.length) return '<div class="empty">No hay tarjetas aquí.</div>';
  if(FC.i>=FC.list.length){
    const all=FC.again===0;
    if(FC.meta.unit&&all){const st=uState(FC.meta.b,FC.meta.n); if(!st.cards){st.cards=true;save();}}
    return '<div class="result"><div class="stamp">'+(all?'¡Todas!':'¡Bien!')+'</div><p>'+(all?'Te sabes todas las tarjetas'+(FC.meta.unit?' y ganas ★.':'.'):'Has marcado '+FC.again+' para repasar. Ya han vuelto a salir al final; repite la ronda para dominarlas.')+'</p>'+
      '<div class="stack"><button class="btn solid wide" id="fc-restart">Otra ronda</button></div></div>';
  }
  const c=FC.list[FC.i];
  return '<div class="fc-count"><span>'+(FC.i+1)+' / '+FC.list.length+'</span><span>✓ '+FC.known+' · ↻ '+FC.again+'</span></div>'+
   '<div class="fc-wrap"><div class="fc'+(FC.flipped?' flip':'')+'" id="fc" role="button" tabindex="0" aria-label="Girar tarjeta">'+
   '<div class="face front"'+(c.ink?' data-ink="'+c.ink+'" style="background:var(--fill)"':'')+'><div class="t">'+esc(c.f)+'</div><div class="hint">Toca para ver la respuesta</div></div>'+
   '<div class="face rev"><div>'+esc(c.b)+'</div><div class="hint">'+(c.src?esc(c.src):'¿Lo sabías?')+'</div></div></div></div>'+
   '<div class="duo"><button class="btn again" id="fc-again">↻ Repasar</button><button class="btn ok" id="fc-ok">✓ Lo sé</button></div>';
}

/* ---------- QUIZ ---------- */
let QZ=null;
function startQuiz(qs,meta){QZ={qs:qs.map(q=>Object.assign({},q,{shown:shuffle(q.opts)})),i:0,ok:0,answered:null,meta:meta};}
function paneQuiz(){
  if(!QZ.qs.length) return '<div class="empty">No hay preguntas aquí todavía.</div>';
  if(QZ.i>=QZ.qs.length){
    const pct=Math.round(QZ.ok/QZ.qs.length*100);
    if(QZ.meta.unit){const st=uState(QZ.meta.b,QZ.meta.n); if(pct>st.best){st.best=pct;save();}}
    const word=pct===100?'¡Perfecto!':pct>=80?'¡Matrícula!':pct>=50?'¡Aprobado!':'¡A repasar!';
    return '<div class="result"><div class="stamp">'+word+'</div><div class="score">'+QZ.ok+'/'+QZ.qs.length+'</div><p class="muted">'+pct+' % de aciertos'+(QZ.meta.unit&&pct>=80?' · ganas ★':'')+'</p>'+
      '<div class="stack"><button class="btn solid wide" id="qz-restart">Repetir con otras preguntas</button>'+(failCount()?'<button class="btn wide" data-go="#/quiz/fails">Practicar mis fallos ('+failCount()+')</button>':'')+'</div></div>';
  }
  const q=QZ.qs[QZ.i], a=QZ.answered, correct=q.opts[0];
  let h='<div class="q-top"><span>Pregunta '+(QZ.i+1)+' de '+QZ.qs.length+'</span><span>✓ '+QZ.ok+'</span></div><div class="prog"><i style="width:'+(QZ.i/QZ.qs.length*100)+'%"></i></div>';
  if(QZ.meta.mixed) h+='<div class="q-src" data-ink="'+q.ink+'">'+esc(q.short)+' · Tema '+q.n+'</div>';
  h+='<div class="q">'+esc(q.q)+'</div><div class="opts">';
  q.shown.forEach((o,k)=>{let cls='opt'; if(a!==null){ if(o===correct)cls+=' right'; else if(o===a)cls+=' wrong'; }
    h+='<button class="'+cls+'" data-opt="'+k+'"'+(a!==null?' disabled':'')+'><span class="k">'+'ABCD'[k]+'</span><span>'+esc(o)+'</span></button>';});
  h+='</div>';
  if(a!==null){h+='<div class="explain"><b>'+(a===correct?'¡Correcto! ':'Era: «'+esc(correct)+'». ')+'</b>'+esc(q.ex)+'</div><div class="stack"><button class="btn solid wide" id="qz-next">'+(QZ.i+1<QZ.qs.length?'Siguiente':'Ver resultado')+'</button></div>';}
  return h;
}

/* ---------- MATCH ---------- */
let MT=null;
function startMatch(pool,meta){const pick=shuffle(pool).slice(0,5);MT={pairs:pick,terms:shuffle(pick.map((p,i)=>i)),defs:shuffle(pick.map((p,i)=>i)),sel:null,hit:new Set(),miss:0,meta:meta,t0:Date.now()};}
function paneMatch(){
  if(MT.pairs.length<2) return '<div class="empty">Hacen falta más tarjetas para este juego.</div>';
  if(MT.hit.size===MT.pairs.length){
    const secs=Math.round((Date.now()-MT.t0)/1000);
    return '<div class="result"><div class="stamp">'+(MT.miss===0?'¡Sin fallos!':'¡Hecho!')+'</div><p>'+MT.pairs.length+' parejas en '+secs+' s'+(MT.miss?' con '+MT.miss+' fallo'+(MT.miss>1?'s':''):'')+'.</p><div class="stack"><button class="btn solid wide" id="mt-restart">Otra partida</button></div></div>';
  }
  let h='<p class="m-info">Toca un concepto y después su definición.</p><div class="m-terms">';
  MT.terms.forEach(i=>{const p=MT.pairs[i];h+='<button class="m-term'+(MT.sel===i?' sel':'')+(MT.hit.has(i)?' hit gone':'')+'"'+(p.ink?' data-ink="'+p.ink+'" style="background:var(--fill)"':'')+' data-term="'+i+'"'+(MT.hit.has(i)?' disabled':'')+'>'+esc(p.f)+'</button>';});
  h+='</div><div class="m-defs">';
  MT.defs.forEach(i=>{const p=MT.pairs[i];h+='<button class="m-def'+(MT.hit.has(i)?' hit':'')+'" data-def="'+i+'"'+(MT.hit.has(i)?' disabled':'')+'>'+(MT.hit.has(i)?'<b>'+esc(p.f)+':</b> ':'')+esc(p.b)+'</button>';});
  return h+'</div>';
}

/* ---------- pools ---------- */
function cardsOf(b,u){return u.cards.map(c=>({f:c[0],b:c[1]}));}
function allCards(){const out=[];BOOKS.forEach(b=>b.units.forEach(u=>u.cards.forEach(c=>out.push({f:c[0],b:c[1],ink:b.color,src:b.short+' · Tema '+u.n}))));return out;}

/* ---------- ROUTER ---------- */
let current={};
function route(){
  const h=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  window.scrollTo(0,0);
  if(!h.length){$app.innerHTML=home();current={v:'home'};return;}
  if(h[0]==='b'){$app.innerHTML=bookView(h[1]);current={v:'book'};return;}
  if(h[0]==='u'){
    const b=book(h[1]),u=b&&b.units.find(x=>x.n==h[2]),tab=h[3]||'esencial';
    if(!u){location.hash='#/';return;}
    $app.innerHTML=unitView(h[1],h[2],tab); current={v:'unit',b:b,u:u,tab:tab};
    if(tab==='tarjetas') startCards(cardsOf(b,u),{unit:true,b:b.id,n:u.n});
    if(tab==='test') startQuiz(shuffle(u.quiz.map((q,i)=>({b:b.id,n:u.n,i:i,q:q[0],opts:q[1],ex:q[2]}))),{unit:true,b:b.id,n:u.n});
    if(tab==='emparejar') startMatch(cardsOf(b,u),{unit:true});
    renderPane(); return;
  }
  if(h[0]==='quiz'){
    let qs,title,meta={mixed:true},back='#/',ink='pink';
    if(h[1]==='mix'){qs=shuffle(allQuestions()).slice(0,10);title='Repaso relámpago';}
    else if(h[1]==='fails'){qs=shuffle(allQuestions().filter(q=>S.fails[qid(q)]));title='Mis fallos';ink='yellow';}
    else if(h[1]==='book'){const b=book(h[2]);if(!b){location.hash='#/';return;}qs=shuffle(allQuestions({book:b.id})).slice(0,12);title='Examen · '+b.short;back='#/b/'+b.id;ink=b.color;}
    $app.innerHTML=bar(title,back,ink)+'<main class="wrap" data-ink="'+ink+'" style="padding-top:22px"><div id="pane"></div></main>';
    startQuiz(qs,meta); current={v:'quiz',tab:'test',kind:h[1],arg:h[2]}; renderPane(); return;
  }
  if(h[0]==='match'){
    $app.innerHTML=bar('Emparejar mezclado','#/','green')+'<main class="wrap" data-ink="green" style="padding-top:22px"><div id="pane"></div></main>';
    startMatch(allCards(),{}); current={v:'match',tab:'emparejar'}; renderPane(); return;
  }
  if(h[0]==='cards'){
    $app.innerHTML=bar('Tarjetas al azar','#/','blue')+'<main class="wrap" data-ink="blue" style="padding-top:22px"><div id="pane"></div></main>';
    startCards(shuffle(allCards()).slice(0,15),{}); current={v:'cards',tab:'tarjetas'}; renderPane(); return;
  }
  location.hash='#/';
}
function renderPane(){
  const p=document.getElementById('pane'); if(!p) return;
  const t=current.tab;
  p.innerHTML= t==='esencial'?paneEsencial(current.b,current.u): t==='tarjetas'?paneCards(): t==='test'?paneQuiz(): paneMatch();
}

/* ---------- EVENTS ---------- */
document.addEventListener('click',function(e){
  const go=e.target.closest('[data-go]');
  if(go&&!go.disabled){e.preventDefault(); const t=go.getAttribute('data-go'); if(location.hash===t) route(); else location.hash=t; return;}
  const id=(e.target.closest('button')||{}).id;
  if(id==='reset'){ if(confirm('¿Borrar todo tu progreso? No se puede deshacer.')){S={units:{},cards:{},fails:{},days:[],last:null};save();route();} return;}
  if(id==='readok'){const st=uState(current.b.id,current.u.n); touchDay(); if(!st.read){st.read=true;save();toast('★ ¡Primera estrella!');} location.hash='#/u/'+current.b.id+'/'+current.u.n+'/tarjetas'; return;}
  // cards
  if(e.target.closest('#fc')){FC.flipped=!FC.flipped; document.getElementById('fc').classList.toggle('flip',FC.flipped); return;}
  if(id==='fc-ok'||id==='fc-again'){
    touchDay();
    if(id==='fc-ok'){FC.known++;} else {FC.again++; FC.list.push(FC.list[FC.i]);}
    FC.i++; FC.flipped=false; renderPane(); return;
  }
  if(id==='fc-restart'){FC.list=shuffle(FC.list.filter((c,i,a)=>a.findIndex(x=>x.f===c.f)===i));FC.i=0;FC.known=0;FC.again=0;FC.flipped=false;renderPane();return;}
  // quiz
  const opt=e.target.closest('[data-opt]');
  if(opt&&QZ&&QZ.answered===null){
    const q=QZ.qs[QZ.i], pick=q.shown[+opt.getAttribute('data-opt')]; QZ.answered=pick; touchDay();
    if(q.b!==undefined){ if(pick===q.opts[0]){QZ.ok++; if(S.fails[qid(q)]){delete S.fails[qid(q)];}} else {S.fails[qid(q)]=1;} save(); }
    renderPane(); const ex=document.querySelector('.explain'); if(ex) ex.scrollIntoView({block:'nearest',behavior:'smooth'}); return;
  }
  if(id==='qz-next'){QZ.i++;QZ.answered=null;renderPane();window.scrollTo({top:0});return;}
  if(id==='qz-restart'){route();return;}
  // match
  const term=e.target.closest('[data-term]');
  if(term&&MT){const i=+term.getAttribute('data-term'); MT.sel=(MT.sel===i?null:i); renderPane(); return;}
  const def=e.target.closest('[data-def]');
  if(def&&MT){
    if(MT.sel===null){toast('Primero toca un concepto de arriba');return;}
    const i=+def.getAttribute('data-def'); touchDay();
    if(i===MT.sel){MT.hit.add(i);MT.sel=null;renderPane();}
    else{MT.miss++; def.classList.add('miss','shake'); setTimeout(()=>{def.classList.remove('miss','shake');},450);}
    return;
  }
  if(id==='mt-restart'){route();return;}
});
document.addEventListener('keydown',function(e){
  if(current.tab==='tarjetas'&&FC&&FC.i<FC.list.length){ if((e.key===' '||e.key==='Enter')&&(e.target===document.body||e.target.id==='fc')){e.preventDefault();document.getElementById('fc').click();} }
});
window.addEventListener('hashchange',route);
route();
})();
</script>
