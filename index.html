U("contexto", {
n:4, title:"Ámbitos de intervención con colectivos vulnerables",
secs:[
 ["4.1. El diagnóstico de la situación","El diagnóstico es el proceso de recopilar y analizar datos para identificar los factores que inciden y las necesidades de las personas en riesgo o exclusión. Debe incluir: el nivel de riesgo y los factores de riesgo y protección, las personas implicadas (características, demandas, capacidades), otros agentes sociales (escuela, familia, Administración) y el pronóstico (qué pasará si se interviene y si no).",[]],
 ["4.1.1. Fuentes de información","Las fuentes de información son los recursos de los que se extraen los datos.",
  ["Fuentes secundarias: contenidos ya elaborados. Internas (de la propia organización: informes, registros) o externas (publicaciones, estadísticas). Técnica: recopilación y análisis documental.","Fuentes primarias: se producen para esta investigación.","Técnicas observacionales: mirar y registrar conductas en el entorno real.","Técnicas interrogativas: encuesta (cuestionario de preguntas cerradas), entrevista (estructurada, semiestructurada o abierta) e historia de vida (sucesivas entrevistas en profundidad donde la persona cuenta toda su vida).","Técnicas grupales: grupo de discusión y foro.","La entrevista y la historia de vida se llaman técnicas conversacionales. Ninguna técnica es mejor: depende de la información buscada."]],
 ["4.1.2. Identificar las necesidades","La información se ordena en variables con indicadores: información que la persona tiene de su realidad, habilidades sociales, autonomía, recursos económicos, trabajo, formación, unidad de convivencia, vivienda y contexto (entorno social y físico). Un indicador aislado no prueba exclusión; la acumulación sí. Se puede usar un gráfico radial por ámbitos (educativo, salud, laboral, económico, justicia, residencial, cultura, relacional) para ver de un vistazo en qué zona está cada ámbito.",[]],
 ["4.2.1. La institución familiar","La familia es una unidad social y económica básica de personas unidas por lazos de parentesco o de pareja (sanguíneos, de afinidad, adopción o políticos). Hoy se habla de familias en plural por su diversidad. Es espacio de ayuda mutua, solidaridad y protección: cuida en las etapas vulnerables, es el principal agente de socialización y responde a necesidades (economía, afecto, vivienda). Cuando los factores de riesgo no se compensan, la familia está en riesgo social, lo que afecta más a menores, mayores, personas dependientes y mujeres.",[]],
 ["4.2.2. Menores en riesgo social","Un menor está en riesgo cuando sus cuidadores no pueden cubrir sus necesidades ni garantizar sus derechos. Pobreza y desprotección no son lo mismo: la desprotección se da en todas las clases sociales.",
  ["Desamparo por imposibilidad: orfandad, progenitores en prisión o enfermos, menores que llegan solos.","Desamparo por incumplimiento: abandono o falta de lo básico.","Desamparo por inadecuación: p. ej., signos de abuso.","Maltrato: acción, omisión o negligencia no accidental (puede ser también institucional o social).","Menores extranjeros no acompañados: menores de 18 que llegan sin un adulto responsable. El término «mena» ha adquirido connotación negativa. Protocolo marco de 2014. Problemas: centros saturados, vacío legal sin documentación, y al cumplir 18 pueden quedar sin apoyo o ser repatriados."]],
 ["4.2.3. Personas mayores en riesgo social","Cambios sociales: más esperanza de vida, envejecimiento de la población y nuevos modelos sociales (individualismo, sobrecarga) que dejan un vacío de cuidados. Recursos: ayuda a domicilio, teleasistencia, residencias, centros de día, unidades psicogeriátricas.",
  ["Edadismo: estereotipos por ser mayor (inútil, enfermo, sin interés sexual…) que generan sentimiento de inutilidad.","Aislamiento y soledad: peor salud, apatía y deterioro cognitivo más rápido.","Pobreza: pensiones bajas o no contributivas; a veces mantienen a hijos y nietos.","Maltrato: suele quedar invisible porque ocurre en un marco de confianza."]],
 ["4.2.4. Familias en riesgo social","Una familia está en riesgo social cuando no puede garantizar a alguno de sus miembros los derechos básicos o la protección necesaria. Factores: composición (monoparentales o numerosas sin apoyo), dinámica (roles confusos, poca comunicación, falta de habilidades parentales), economía y trabajo, vivienda e historia previa de violencia.",
  ["Familias multiproblemáticas: acumulan muchos problemas (conductas problemáticas, delincuencia, adicciones, violencia, falta de normas, desorganización económica, incapacidad parental). Necesitan mediación familiar y parentalidad positiva.","Familias petrificadas o en crisis: algún miembro queda bloqueado tras un suceso traumático (muerte, enfermedad, separación, pérdida del trabajo) y deja de ejercer su rol. Cuanto más imprevisible, más devastador.","Familias en situación de exclusión: desventaja extrema; pobreza, mala vivienda, discriminación, redes débiles y empleo precario a la vez."]],
 ["4.3.1. Discriminación de las mujeres","Ser mujer es un factor transversal de riesgo por el modelo androcéntrico y heteropatriarcal. La máxima discriminación es la violencia.",
  ["Invisibilidad del trabajo femenino: tareas domésticas y de cuidados no pagadas ni valoradas; en el mercado, empleos de limpieza y cuidados mal pagados.","Segregación formativa y laboral: pocas chicas en STEM; más en áreas feminizadas.","Dificultades de conciliación: jornadas reducidas, menos ascensos (techo de cristal).","Condiciones más precarias y brecha salarial (menos sueldo por el mismo trabajo o de igual valor).","Más vulnerables: mayores de 45 en paro de larga duración, jóvenes sin cualificación, inmigrantes no comunitarias y madres de familias monoparentales.","Trabajadoras sexuales: estigma, invisibilidad, vulnerabilidad ante clientes y proxenetas; a menudo víctimas de trata."]],
 ["4.3.2. Sexo, género y orientación sexual","Conceptos básicos para intervenir:",
  ["Sexo: características biológicas (cromosomas XX/XY) que clasifican en dos grupos (dimorfismo sexual).","Intersexualidad: los órganos sexuales no corresponden claramente a un sexo (1 de cada 2.000 personas). No determina la orientación ni la identidad.","Género: características sociales atribuidas a un sexo. Identidad de género: cómo te percibes. Expresión de género: cómo lo muestras.","Cisgénero: la identidad coincide con el sexo asignado al nacer.","Transgénero: la identidad no coincide con el sexo asignado. Puede ser binario (hombre o mujer trans) o no binario/intergénero (género fluido, agénero, bigénero, pangénero, demigénero).","Transexual: persona trans que hace una transición médica (MaH/FtM o HaM/MtF).","Androginia: expresión que combina rasgos masculinos y femeninos.","Teoría queer: critica las categorías binarias; «queer» designa identidades no normativas.","Orientación sexual: atracción sexual, emocional o afectiva hacia personas de un sexo o género. Heterosexual, homosexual (lesbiana, gay), bisexual y asexual (hoy es una orientación más; no es lo mismo que el celibato)."]],
 ["4.3.3. Discriminación de las personas LGTBIQ+","LGTBIQ+ agrupa identidades sexuales y de género no normativas. Sufren homofobia (incluye a bisexuales; también lesbofobia, gayfobia, bifobia) y transfobia: exclusión familiar, discriminación laboral, violencia. En muchos países sigue siendo delito.",
  ["Ocultación: esconder la identidad por miedo al rechazo, con malestar psicológico, fracaso escolar y absentismo.","Revelación pública («salir del armario»): proceso difícil pero necesario para la autoestima. El outing es revelar la identidad de alguien sin su consentimiento.","Personas intersexuales: discriminación por invisibilidad; debate sobre intervenciones quirúrgicas tempranas que buscan ajustar al bebé al modelo binario.","Factores que agravan el riesgo: vejez (vuelven a esconderse en residencias), inmigración (doble discriminación), precariedad laboral y residencial, red familiar frágil, profesionales sin formación y trabajo sexual.","Datos 2024: 30,6 % en riesgo de pobreza y 23 % con alguna experiencia de sinhogarismo."]],
 ["4.4. Personas con discapacidad","Persona con una deficiencia física, intelectual, sensorial o psicosocial que le dificulta interactuar con el entorno, hacer las AVD o participar. Modelos explicativos:",
  ["Modelo de la CIF (OMS, 2001): la discapacidad resulta de la relación entre las condiciones de salud y los factores contextuales (personales y del entorno); afecta a funciones, actividad y participación.","Modelo ecológico: interacción de la persona con su entorno inmediato, la comunidad y la sociedad. La discapacidad aparece cuando el contexto no se ajusta a la persona.","Modelo de la diversidad funcional (Foro de Vida Independiente): las personas funcionan de forma distinta y tienen derecho a vivir con dignidad desde la diferencia y controlar sus vidas.","Discapacidad múltiple: dos o más discapacidades a la vez."]],
 ["4.4.1. Tipos de discapacidad","Según la función afectada, la causa, el momento (congénita o adquirida) y la intensidad:",
  ["Física o motora: limitaciones para producir, regular o ejecutar movimientos. Causas neurológicas (esclerosis múltiple, lesión medular), osteomusculares (artritis, distrofia, amputaciones) u orgánicas no motoras (fibrosis quística).","Intelectual: limitaciones en el funcionamiento cognitivo y en la conducta adaptativa (habilidades conceptuales, sociales y prácticas); aparece antes de los 18 años.","Visual: limitación severa o ausencia de visión.","Auditiva: limitación importante o total de la audición; prelocutiva (antes de aprender a hablar) o poslocutiva.","Sordoceguera: deficiencia auditiva y visual a la vez.","Psicosocial: alteración permanente del comportamiento adaptativo por trastornos mentales: del estado de ánimo (depresión, bipolar), de la personalidad, de ansiedad (fobias, pánico, TOC, estrés postraumático) y esquizofrenia (síntomas positivos como alucinaciones y negativos como apatía)."]],
 ["4.4.2‑4.4.3. Riesgo social y necesidades en la discapacidad","Factores individuales: autonomía, sexo (más riesgo en mujeres), salud, trabajo, recursos, nivel sociocultural, otras vulnerabilidades y la actitud ante la discapacidad. Factores contextuales: apoyo familiar y red social, barreras, recursos escasos, prestaciones insuficientes y prejuicios sociales. Los apoyos son clave:",
  ["Productos de apoyo (ayudas técnicas): previenen, compensan o neutralizan limitaciones (sillas de ruedas, audífonos…).","Apoyos personales: familia, profesionales o asistente personal.","Accesibilidad: característica del medio que asegura su uso normalizado, seguro y eficiente por todas las personas. Principio de diseño universal.","Barreras: arquitectónicas urbanísticas (BAU), en la edificación (BAE), en el transporte (BAT) y en la comunicación (incluidas las cognitivas y las TIC).","Necesidades educativas: detección temprana, inclusión educativa y orientación.","Empleo: ordinario (con cuota de reserva en empresas grandes), con apoyo (preparador laboral antes, durante y después), centros especiales de empleo (trabajo productivo con ajuste personal) y centros ocupacionales (terapia ocupacional).","Vida independiente: ingresos, vivienda accesible y habilidades para las AVD.","Comunicación: sistemas aumentativos (refuerzan el habla) y alternativos (sustituyen el habla), lengua de signos.","Ocio inclusivo, participación y vida afectiva y sexual."]],
 ["4.5. Personas con adicciones","La adicción es el hábito compulsivo e incontrolable de hacer una actividad, consumir una sustancia o mantener una relación para obtener placer. Con la repetición aumenta la tolerancia (hace falta más) y aparece la dependencia:",
  ["Dependencia física: el cuerpo exige la sustancia; si baja, aparece el síndrome de abstinencia.","Dependencia psíquica: la conducta libera dopamina y oxitocina y se siente la necesidad de repetirla.","Droga: sustancia psicoactiva que altera el sistema nervioso central y puede causar dependencia. Vías: oral, pulmonar, nasal, parenteral (inyectada), transdérmica y transmucosal.","Estimulantes: aumentan la actividad (mayores: cocaína, anfetaminas; menores: nicotina, cafeína).","Depresoras: ralentizan el cerebro (alcohol, opiáceos como heroína o metadona, benzodiazepinas).","Alucinógenas: distorsionan la percepción (LSD, mescalina).","Socioadicciones o adicciones comportamentales: sin sustancia (trabajo, internet, ejercicio, sexo, ludopatía, oniomanía o compra compulsiva). Difíciles de detectar porque la actividad no es dañina en sí."]],
 ["4.5.2‑4.5.3. Riesgo y necesidades en las adicciones","No todo consumo lleva a dependencia ni toda dependencia a exclusión. Factores:",
  ["Del elemento adictivo: poder adictivo (la heroína engancha muy rápido) e imagen social (heroína muy estigmatizada; cocaína asociada al éxito; alcohol aceptado hasta que es abuso).","Individuales: herencia, factores psicoemocionales (baja autoestima, poca tolerancia a la frustración), personalidad (impulsividad, «a mí no me pasa nada»), situación personal (presión de grupo en la adolescencia) y visión positiva de la sustancia.","Contextuales: entorno familiar, comunitario (acceso fácil, falta de prevención) y socioeconómico (consumismo, publicidad, crisis).","Deterioro que sufren: personal, familiar, económico y social (delincuencia, indigencia). Suelen ocultar la adicción.","Tratamiento en 3 fases: 1) desintoxicación (dependencia física; ambulatoria u hospitalaria), 2) deshabituación (psicoterapia, autocontrol, prevenir recaídas; comunidades terapéuticas y pisos de apoyo), 3) rehabilitación (autonomía, habilidades sociolaborales, relaciones).","Necesidades de calidad de vida: aunque se siga consumiendo, que sea controlado y seguro (reducción de daños)."]],
 ["4.6. Origen, etnia, cultura o religión","Estas variables se mezclan y la discriminación puede combinarse.",
  ["Racismo: el grupo mayoritario se cree superior y discrimina por rasgos físicos o culturales. Ej.: antigitanismo (el pueblo gitano llegó a España en 1425 y sigue sufriendo discriminación).","Xenofobia: rechazo a lo extranjero por etnocentrismo o desconocimiento.","Discriminación religiosa: antisemitismo e islamofobia (se confunde islam con fundamentalismo; dificultades para encontrar lugares de culto o enterramiento).","Factores individuales: edad y sexo (las mujeres sufren doble discriminación), situación jurídica (sin papeles no hay derechos de ciudadanía), recursos económicos, formación, idioma y situación laboral.","Factores contextuales: proceso migratorio, choque cultural, redes de apoyo débiles, desigualdad en el acceso a bienes (alquiler, banca), trabajo precario, vivienda (pisos patera, camas calientes), sanidad (en situación irregular solo urgencias, embarazo y parto) y estigma en medios y discursos políticos."]],
 ["Etapas del proceso migratorio","El viaje migratorio tiene varias fases:",
  ["1. Premigración y toma de la decisión: expectativas, a veces una visión distorsionada del éxito.","2. Tránsito y limbo migratorio: la etapa más difícil (viaje duro, a veces ilegal) y laberinto burocrático para regularizarse.","3. Sobrecompensación: toda la energía en sobrevivir y adaptarse.","4. Descompensación o crisis: aparecen los conflictos y el duelo migratorio (pérdida de valores, costumbres, lengua…).","5. Proceso transgeneracional: la 2.ª generación puede no sentirse de ningún sitio; la 3.ª suele sentirse plenamente parte de la sociedad de acogida.","Necesidades: orientación y acompañamiento, aprender la lengua, asesoramiento jurídico (y programas para víctimas de trata), compensación educativa sin segregación, sanidad con mediadores culturales, inserción laboral, apoyo al asociacionismo y sensibilización de la ciudadanía (diálogo interreligioso)."]]
],
trucos:["Tratamiento de adicciones = D‑D‑R: DESintoxicar el cuerpo, DESHABITUAR la mente, REHABILITAR la vida.","Tipos de drogas por su efecto: «E‑D‑A»: Estimulantes aceleran, Depresoras frenan, Alucinógenas distorsionan.","Empleo y discapacidad, de más a menos normalizado: ORDINARIO → CON APOYO → CENTRO ESPECIAL DE EMPLEO → CENTRO OCUPACIONAL."],
cards:[
 ["Diagnóstico","Proceso de recopilar y analizar datos para identificar factores y necesidades de personas en riesgo o exclusión."],
 ["Pronóstico","Previsión de cómo evolucionará la situación si se interviene y si no."],
 ["Fuentes secundarias","Contenidos ya elaborados que se pueden consultar (internas o externas)."],
 ["Fuentes primarias","Contenidos producidos específicamente para la investigación (observación, encuestas, entrevistas…)."],
 ["Entrevista semiestructurada","Se prepara un guion con lo que interesa y se van formulando las preguntas para obtenerlo."],
 ["Historia de vida","Sucesivas entrevistas en profundidad en las que la persona relata toda su vida."],
 ["Familia","Unidad social y económica básica de personas unidas por parentesco o pareja de hecho."],
 ["Desamparo","Situación en la que un menor no recibe la atención necesaria (por imposibilidad, incumplimiento o inadecuación)."],
 ["Menores extranjeros no acompañados","Menores de 18 años que llegan a España sin un adulto responsable."],
 ["Edadismo","Atribución de estereotipos a una persona por el hecho de ser mayor."],
 ["Familia multiproblemática","Acumula muchos problemas (conductas, adicciones, violencia, desorganización) y dificultades para cumplir sus funciones."],
 ["Familia petrificada","Algún miembro queda bloqueado tras un suceso traumático y deja de ejercer su rol."],
 ["Brecha salarial","Menor salario de las mujeres por el mismo trabajo o por trabajos de igual valor."],
 ["Intersexualidad","Los órganos sexuales no corresponden de forma clara a uno de los dos sexos."],
 ["Cisgénero","Persona cuya identidad de género coincide con el sexo asignado al nacer."],
 ["Transgénero","Persona cuya identidad de género no coincide con el sexo asignado al nacer."],
 ["Transexual","Persona trans que realiza una transición médica (hormonas, cirugía)."],
 ["Orientación sexual","Atracción sexual, emocional o afectiva hacia personas de un sexo o género determinados."],
 ["Asexualidad","Orientación sexual con poca o ninguna atracción sexual; no es lo mismo que el celibato."],
 ["Outing","Revelar la orientación o identidad de una persona sin su consentimiento."],
 ["Modelo de la CIF","La discapacidad resulta de la relación entre la salud y los factores contextuales (OMS, 2001)."],
 ["Modelo ecológico de la discapacidad","La discapacidad aparece cuando el contexto no se ajusta a la persona."],
 ["Discapacidad intelectual","Limitaciones en el funcionamiento cognitivo y la conducta adaptativa, antes de los 18 años."],
 ["Hipoacusia prelocutiva","Pérdida auditiva que aparece antes de aprender a hablar."],
 ["Sordoceguera","Deficiencia auditiva y visual a la vez."],
 ["Discapacidad psicosocial","Alteración permanente del comportamiento adaptativo por trastornos mentales."],
 ["Esquizofrenia","Trastorno mental grave con distorsión de la realidad; síntomas positivos (alucinaciones) y negativos (apatía)."],
 ["Accesibilidad","Característica del medio que asegura su uso normalizado, seguro y eficiente por todas las personas."],
 ["Empleo con apoyo","Empleo ordinario con un preparador que apoya a la persona y a la empresa antes, durante y después."],
 ["Centro especial de empleo","Trabajo productivo y remunerado con servicios de ajuste personal y social."],
 ["Sistemas alternativos de comunicación","Buscan vías alternativas al habla (los aumentativos refuerzan el habla)."],
 ["Adicción","Hábito compulsivo e incontrolable de una actividad, sustancia o relación para obtener placer."],
 ["Tolerancia","Necesidad de más cantidad o intensidad para conseguir el mismo efecto."],
 ["Síndrome de abstinencia","Malestar que aparece al bajar o dejar la sustancia o conducta adictiva."],
 ["Droga depresora","Ralentiza el cerebro: alcohol, opiáceos, benzodiazepinas."],
 ["Oniomanía","Trastorno de compra compulsiva."],
 ["Deshabituación","Fase psicoterapéutica: autocontrol, estilo de vida sin la conducta y prevención de recaídas."],
 ["Xenofobia","Rechazo y hostilidad hacia personas o culturas extranjeras."],
 ["Duelo migratorio","Sentimiento de pérdida (cultura, lengua, valores) que vive la persona migrante."]
],
quiz:[
 ["¿Qué incluye un buen diagnóstico además del nivel de riesgo?",["Personas implicadas, otros agentes y el pronóstico","Solo los datos económicos","Solo la opinión del profesional","Solo la demanda de la persona"],"El diagnóstico también valora qué pasará con y sin intervención."],
 ["Una entrevista con un guion de temas pero preguntas flexibles es…",["Semiestructurada","Estructurada","Abierta","Un cuestionario"],"Se prepara un guion de lo que interesa y se adapta la formulación."],
 ["Un menor cuyos padres están en prisión y sin otro adulto que lo cuide está en desamparo por…",["Imposibilidad","Incumplimiento","Inadecuación","Negligencia institucional"],"Los cuidadores no pueden atenderlo aunque quisieran."],
 ["Una familia en la que la madre queda bloqueada tras la muerte inesperada de un hijo es una familia…",["Petrificada o en crisis","Multiproblemática","En exclusión","Monoparental"],"Un suceso traumático incapacita a un miembro para ejercer su rol."],
 ["¿Qué término describe a una persona cuya identidad de género coincide con el sexo asignado al nacer?",["Cisgénero","Transgénero","Intersexual","Queer"],"Las personas cuya identidad no coincide son transgénero."],
 ["La intersexualidad…",["No determina la orientación sexual ni la identidad de género","Es una orientación sexual","Es lo mismo que transexualidad","Es una enfermedad mental"],"Se refiere a características biológicas, no a la orientación ni a la identidad."],
 ["Según el modelo ecológico, la discapacidad aparece cuando…",["El contexto no se ajusta a las características de la persona","Hay una enfermedad","La persona nace con ella","La persona no se esfuerza"],"Pone el foco en la interacción persona‑entorno."],
 ["Un trabajo normal en una empresa con un preparador laboral que acompaña a la persona es…",["Empleo con apoyo","Centro ocupacional","Centro especial de empleo","Empleo protegido sin sueldo"],"Es empleo ordinario con apoyo antes, durante y después del contrato."],
 ["El alcohol y la heroína son drogas…",["Depresoras","Estimulantes","Alucinógenas","Comportamentales"],"Ralentizan las funciones del cerebro."],
 ["La necesidad de consumir cada vez más para lograr el mismo efecto se llama…",["Tolerancia","Abstinencia","Deshabituación","Dependencia psíquica"],"La repetición de la conducta aumenta la tolerancia."],
 ["¿Qué fase del tratamiento de adicciones se hace en comunidades terapéuticas y pisos de apoyo?",["Deshabituación","Desintoxicación","Diagnóstico","Prevención"],"Es la fase psicoterapéutica para lograr autocontrol y prevenir recaídas."],
 ["Una persona en situación administrativa irregular, según el libro, tiene garantizada la atención sanitaria de…",["Urgencia, embarazo y parto","Todas las especialidades","Ninguna atención","Solo odontología"],"Por eso muchas evitan acudir al médico."],
 ["En el proceso migratorio, la etapa más difícil por el viaje y la burocracia es…",["Tránsito y limbo migratorio","Premigración","Sobrecompensación","Proceso transgeneracional"],"El viaje puede ser muy duro y regularizarse, un laberinto."],
 ["¿Qué generación de inmigrantes suele sentirse plenamente parte de la sociedad de acogida?",["La tercera","La primera","La segunda","Ninguna"],"La segunda a veces no se siente ni de un sitio ni del otro."],
 ["Un ascensor sin botones en braille es una barrera…",["En la comunicación","Urbanística","En el transporte","Económica"],"Impide recibir y comprender la información del entorno."]
]
});

U("contexto", {
n:5, title:"Los servicios y programas de intervención social",
secs:[
 ["5.1.1. El abordaje integral","Antes se atendía la exclusión de forma asistencialista (cubrir carencias, persona pasiva). Hoy se busca también modificar lo que provoca la exclusión y crear condiciones para la inclusión futura. El abordaje integral tiene en cuenta todas las dimensiones de la vida de la persona y requiere trabajo en red: actuación cooperativa y coordinada de profesionales y servicios diversos con un objetivo común. Se basa en:",
  ["Análisis de los factores de riesgo y de protección.","Identificar y movilizar recursos externos (ayudas, servicios), comunitarios, de la red de apoyo e internos de la persona (capacidades).","Protagonismo activo y empoderamiento de la persona, buscando su corresponsabilidad.","Ajustar las acciones al objetivo: preventivas, de promoción o de reinserción."]],
 ["5.1.2. Intervención individual","Conjunto de acciones para favorecer el empoderamiento de una persona y acompañarla en su inclusión. Es prioritaria, por ejemplo, con víctimas de violencia de género, menores extutelados o personas exreclusas.",
  ["Particularización: plan de acción ajustado a sus necesidades.","Relación personalizada: escucha activa y confidencialidad.","Acompañamiento durante todo el proceso.","Técnicas psicológicas: ventilación (expresar libremente emociones para descargarse), contención (estabilizar en una crisis) y confrontación (mostrar evidencias de la realidad frente a una visión distorsionada).","Intervención familiar: tomar conciencia de la situación, mejorar la convivencia y las habilidades parentales (p. ej., escuelas de padres y madres), habilidades sociales y red de apoyo."]],
 ["Intervención grupal y comunitaria","La intervención grupal mejora el bienestar de un grupo que comparte una problemática o necesidad; fomenta la participación y el apoyo mutuo. La comunitaria busca transformar una comunidad con la participación activa de sus miembros.",
  ["Recursos grupales: talleres, terapia de grupo y grupos de autoayuda (el profesional asesora, pero no lidera).","Lo que aporta el grupo: apoyo emocional, material, informativo, social y participación en el cambio social.","Pilares de la intervención comunitaria: diagnóstico participativo, liderazgo y organización comunitaria, coordinación con instituciones e implementación de acciones (desarrollo local).","Acciones profesionales: desarrollar redes comunitarias (asociaciones), facilitar espacios de encuentro, aumentar las competencias comunitarias, apoyar líderes y fomentar la relación con las instituciones."]],
 ["5.1.3. Sistemas de protección","Para incluir al máximo de personas participan varios sistemas, que no se excluyen:",
  ["Sistemas formales: organizados, con requisitos, costes y plazos. Tres tipos: protección pública (servicios sociales municipales, centros de menores), privados (empresas y entidades con convenios con la Administración) y no gubernamentales (entidades sin ánimo de lucro del tercer sector).","Sistemas no formales: red familiar, social y laboral de la persona (ayuda emocional, material, contactos)."]],
 ["5.2.1. Recursos para menores","La consejería de familia de cada comunidad autónoma vela por los menores, junto con justicia, policía, salud, monitores de tiempo libre y entidades (Aldeas Infantiles SOS, Save the Children, Cruz Roja, Cáritas).",
  ["Apoyo familiar: atención temprana (hasta 6 años con trastornos del desarrollo), atención socioeducativa (ludotecas, bibliotecas, centros de ocio) y atención a menores en riesgo (centros abiertos, de día, preservación familiar).","Acogimiento residencial: de urgencia (breve, mientras se estudia el caso), básico o permanente y de atención a la diversidad (discapacidad grave, salud mental).","Acogimiento familiar: el menor se integra en una familia de acogida valorada como idónea, temporal o a largo plazo.","Adopción: los derechos y deberes parentales pasan de forma definitiva a la familia adoptiva; el menor es hijo legal a todos los efectos.","Transición a la vida adulta: pisos asistidos o de transición, normalmente 1‑2 años y como máximo hasta los 21.","Víctimas de maltrato: protocolos de detección y notificación y teléfono 116111 (24 h, gratuito, confidencial, en toda la UE).","Situaciones específicas: menores extranjeros no acompañados (responsabilidad de la Administración) y menores infractores mayores de 14 años (internamiento cerrado, semiabierto o terapéutico; medidas en régimen abierto: trabajos en beneficio de la comunidad, tareas socioeducativas, libertad vigilada)."]],
 ["5.2.2‑5.2.3. Recursos para mayores y familias","Para personas mayores (servicios sociales, Imserso):",
  ["Residencias, alojamientos alternativos, apartamentos residenciales, pisos asistidos y viviendas tuteladas.","Centros de día: mantienen la autonomía y apoyan a las familias en horario diurno.","Ayuda a domicilio y teleasistencia (botón de alarma y contacto preventivo).","Entidades tutelares: personas jurídicas sin ánimo de lucro que ejercen la tutela de mayores incapacitados.","Para familias: información y orientación, ayuda a domicilio, alojamiento alternativo, puntos de encuentro familiar (para mantener la relación con los hijos en separaciones conflictivas), respiro familiar (descanso para quien cuida) y ayudas económicas.","Tercer sector: federaciones y mesas de entidades (incidencia política) y redes de trabajo territoriales (coordinación de casos entre servicios)."]],
 ["5.2.4. Recursos para mujeres","Para la igualdad de oportunidades y contra la violencia:",
  ["Institutos de la mujer (estatal: Instituto de las Mujeres; y autonómicos): estudios, sensibilización, servicios y canalización de denuncias.","Centros de información y atención a la mujer: asesoran en empleo, vivienda, economía, salud y violencia.","Centros de día para mujeres y casas de acogida (para madres, para víctimas de violencia de género, para mujeres con dificultades de integración) y pisos tutelados.","Juzgados de violencia sobre la mujer y órdenes de protección (medidas civiles y penales urgentes).","Dispositivos telemáticos: pulsera para el agresor y móvil que avisa a la víctima si se acerca.","016 (teléfono, chat, correo): información, asesoramiento jurídico y atención psicosocial.","ATENPRO: teleasistencia móvil 24 h para víctimas de violencia de género.","Puntos violeta: información y ayuda, sobre todo en fiestas.","Observatorio Estatal de Violencia sobre la Mujer."]],
 ["5.2.5. Recursos para personas LGTBIQ+","Son víctimas frecuentes de delitos de odio: conductas penales contra una persona o grupo motivadas por prejuicios (raza, religión, orientación sexual, discapacidad…). El art. 510 del Código Penal castiga promover el odio (1‑4 años de prisión). Existe la Oficina Nacional de Lucha contra los Delitos de Odio (ONDOD).",
  ["Asociaciones: FELGTBI+ (federación estatal de más de 50 entidades), Colegas, Stop (personas trans que ejercen trabajo sexual).","Servicio 028 Arcoíris: información, asesoramiento jurídico y atención psicosocial 24 h (el número recuerda el 28 de junio).","Puntos arcoíris contra agresiones por orientación o identidad.","Día Internacional del Orgullo LGTBI: 28 de junio."]],
 ["5.2.6. Recursos para personas con discapacidad","Se ha pasado de un modelo asistencial a otro de inclusión y autonomía. Muchas entidades nacen de las familias: ASPACE (parálisis cerebral), COCEMFE (discapacidad física y orgánica), Institut Guttmann (lesión medular), ONCE (visual), CNSE (sordera), Plena Inclusión (intelectual), Down España, Salud Mental España.",
  ["Atención y residencia: centros de día, atención intermedia (clubes), centros residenciales, minirresidencias o casas hogar (salud mental), pisos tutelados y pisos sociales protegidos.","Sanitarios: centros de recuperación de personas con discapacidad física (CRMF), unidades de salud mental, hospitalización de día o en hospital general, cuidados prolongados, gerontopsiquiatría, comunidades terapéuticas, UTCA (conducta alimentaria), trastornos de personalidad y patología dual.","Educativos: escolarización ordinaria, con apoyos o en educación especial (hasta los 21 años).","Empleo ordinario: cuota de reserva del 2 % en empresas de 50 o más trabajadores y del 5 % en la Administración; empleo con apoyo.","Empleo protegido: centros especiales de empleo (con posibilidad de enclave laboral en una empresa) y centros ocupacionales (finalidad ocupacional, no productiva).","Accesibilidad: CEAPAT (ayudas técnicas), CIT (intermediación telefónica), CNLSE (lengua de signos) y CESyA (subtitulado y audiodescripción).","Oficina de vida independiente (OVI): gestionada por personas con discapacidad; asesora, orienta sobre asistencia personal y apoya proyectos de vida independiente."]],
 ["5.2.7. Recursos para personas con adicciones","Se organizan en tres niveles:",
  ["Primer nivel (puerta de entrada): detectar, motivar, atención básica y derivar. Incluye reducción de daños: centros de encuentro y acogida (duchas, comida, salas de venopunción higiénica) y unidades móviles.","Segundo nivel (objetivo: la abstinencia): centros ambulatorios y centros de dispensación de metadona.","Tercer nivel (especializado): unidades de desintoxicación hospitalaria, comunidades terapéuticas, centros de día, pisos de apoyo y talleres de inserción sociolaboral.","En prisión: módulos terapéuticos o UTE (unidades terapéuticas y educativas)."]],
 ["5.2.8‑5.2.9. Recursos para inmigrantes y pueblo gitano","La atención depende del Estado (política migratoria, nacionalidad, residencia, expulsiones), las comunidades autónomas (educación, sanidad, inserción laboral) y los entes locales (padrón, informes de arraigo). Entidades: Red Acoge, SOS Racismo, Cruz Roja, Cáritas.",
  ["Arraigo social: residencia temporal por circunstancias excepcionales tras 3 años en España, con contrato y vínculos o informe de arraigo, sin antecedentes penales.","Reagrupación familiar: quien reside legalmente y tiene medios y vivienda puede traer a pareja, hijos menores o ascendientes.","Padrón municipal: registro de quienes viven en un municipio; obligatorio aunque se esté en situación irregular. Demuestra el tiempo en España y da acceso a sanidad, escuela y ayudas.","CATE: Centros de Atención Temporal de Extranjeros (primeras 72 horas).","CETI (Ceuta y Melilla) y CAED: primera acogida sin internamiento ni límite de estancia.","CIE: Centros de Internamiento de Extranjeros, retención cautelar hasta un máximo de 60 días para resolver la expulsión.","Centros de atención social y centros de día de emergencia social (ropero, duchas, orientación).","Pueblo gitano: Consejo Estatal del Pueblo Gitano (con Fundación Secretariado Gitano, Kamira, Khetane)."]],
 ["5.3.1. Programas de intervención social","Promueven las fortalezas y el empoderamiento (no son beneficencia). Fases: ámbito o colectivo, objetivos, acciones (metodología y prioridades), recursos y evaluación. También hay que sensibilizar a la sociedad. Tipos:",
  ["Habilidades personales: AVD, hábitos de higiene y horarios, habilidades sociales.","Promoción de la salud: hábitos saludables, prevención (VIH, embarazos no deseados, drogas) e intervención en enfermedades (metadona, intercambio de jeringuillas).","Educativos: refuerzo escolar, implicar a las familias, prevenir el abandono.","Inserción laboral: formación, orientación e itinerarios ocupacionales personalizados.","Ocio y tiempo libre.","Inserción social: minorías, inmigrantes, personas exreclusas.","Apoyo en momentos de especial vulnerabilidad (familias de dependientes, mediación, refugiados).","Promoción de la igualdad: mujeres (vocaciones STEAM, prevención de violencia sexual) y LGTBIQ+."]],
 ["5.3.2. Prestaciones y ayudas","Prestaciones económicas y de servicios:",
  ["Ingreso Mínimo Vital (IMV) y renta mínima de inserción autonómica.","Prestaciones familiares: por hijo a cargo, nacimiento o adopción, cuidado de menores con cáncer o enfermedad grave, cuidados en el entorno familiar.","Pensiones no contributivas: de invalidez (18‑65 años, discapacidad ≥65 %, 5 años de residencia) y de jubilación (más de 65 años y 10 de residencia, sin cotización suficiente).","Subsidios por desempleo: por agotar la prestación, por cotización insuficiente (al menos 90 días), para mayores de 52 y para víctimas de violencia de género o sexual.","Prestación vinculada al servicio (dependencia) y subsidio de movilidad.","Servicios: teleasistencia, asistencia personal, ayuda a domicilio, centros de día y de noche, atención residencial, respiro familiar y ayudas residenciales de emergencia (puntos extra en vivienda pública)."]],
 ["5.4. Las redes de apoyo","La red de apoyo de una persona es el conjunto de conexiones personales, sociales y comunitarias que le ayudan en momentos cruciales. Puede ser formal (sistemas y servicios) o informal (lazos personales, grupos de ayuda, voluntariado). El apoyo social es toda la ayuda que una persona recibe o a la que puede acceder por sus redes. El apoyo percibido no siempre coincide con el real.",
  ["Depende de: amplitud de la red, calidad de los vínculos, características de la persona, contexto y situación.","Se puede rechazar por: reticencia (siente que le coarta), autoestima (vergüenza) o atribución (cree que es por lástima).","Tipos de apoyo: emocional o expresivo, instrumental (material o intangible, como un servicio), informativo y educativo.","Rasgos: espontaneidad, reciprocidad, cooperación, solidaridad, autonomía y responsividad (respuesta rápida)."]],
 ["5.4.2. Los grupos de ayuda","Un grupo de ayuda es un grupo pequeño, voluntario y estructurado para el apoyo mutuo y un propósito concreto. Surgieron en EE. UU. en el siglo XX (alcoholismo, juego). Principios: respeto, confidencialidad e inclusión.",
  ["Características: experiencia común, estructura horizontal (entre iguales), apoyo variado, reuniones presenciales regulares, grupo pequeño y flexible, identidad propia (no sustituyen a los servicios profesionales).","Autocentrados: personas afectadas directamente (Alcohólicos Anónimos, duelo perinatal). Heterocentrados: el entorno de la persona afectada (familias).","Según el problema: internos (adicciones, enfermedades) o externos (pobreza).","Según el fin: apoyo en situaciones vitales o para el cambio legislativo y social.","Según la orientación: de acogida (crisis puntuales), de autoayuda (trabajo personal), de ayuda mutua y de resocialización."]],
 ["5.4.3. El voluntariado","La participación social crea lazos y protege de la exclusión. El voluntariado es una forma de participación social solidaria, desarrollada por personas físicas, en torno a un proyecto colectivo sin ánimo de lucro. En España es voluntaria un 10 % de la población (más de 4,2 millones; 55 % mujeres).",
  ["Voluntariedad: decisión libre, sin relación laboral ni obligación.","Altruismo: sin contraprestación económica; el beneficio es personal.","Organización: dentro de una entidad sin ánimo de lucro.","Compromiso: dedicación estable o recurrente.","Vocación social y comunitaria: busca el bien común.","Ámbitos: social, internacional, ambiental, cultural, deportivo, educativo, sociosanitario, ocio, comunitario y protección civil.","Límites: no sustituye a trabajadores remunerados ni las obligaciones de las Administraciones."]]
],
trucos:["Teléfonos que salvan: 016 violencia contra la mujer · 116111 infancia (muchos unos, como niños en fila) · 028 LGTBI (28 de junio, Orgullo).","Niveles de adicciones: 1.º «te recibo» (puerta de entrada y reducción de daños) → 2.º «te desenganchas» (ambulatorio, metadona) → 3.º «te especializo» (hospital, comunidad terapéutica).","Pilares del voluntariado = V‑A‑O‑C‑V: Voluntariedad, Altruismo, Organización, Compromiso, Vocación social."],
cards:[
 ["Trabajo en red","Actuación cooperativa y coordinada de profesionales y servicios diversos con un objetivo común."],
 ["Abordaje integral","Intervención que tiene en cuenta todas las dimensiones de la vida de la persona."],
 ["Intervención individual","Acciones para empoderar a una persona y acompañarla en su inclusión."],
 ["Ventilación","Técnica que facilita que la persona exprese libremente emociones y frustraciones para descargarse."],
 ["Contención","Técnica para estabilizar a la persona en una crisis y que recupere el control."],
 ["Confrontación","Técnica que muestra evidencias de la realidad frente a una visión distorsionada."],
 ["Intervención grupal","Acciones para mejorar el bienestar de un grupo que comparte una problemática o necesidad."],
 ["Intervención comunitaria","Acciones para transformar una comunidad mediante la participación activa de sus miembros."],
 ["Diagnóstico participativo","La propia comunidad analiza su situación, identifica necesidades y plantea estrategias."],
 ["Sistemas no formales","Red familiar, social y laboral de la persona que presta ayuda emocional y material."],
 ["Atención temprana","Intervención lo antes posible en niños y niñas de hasta 6 años con trastornos del desarrollo."],
 ["Acogimiento familiar","El menor desprotegido vive temporal o largamente con una familia de acogida declarada idónea."],
 ["Adopción","Transferencia definitiva de los derechos y deberes parentales; el menor es hijo legal."],
 ["Punto de encuentro familiar","Espacio para que los menores mantengan relación con sus progenitores en separaciones conflictivas."],
 ["Respiro familiar","Apoyo puntual para que quien cuida a una persona dependiente pueda descansar."],
 ["Entidad tutelar","Persona jurídica sin ánimo de lucro que ejerce la tutela de personas incapacitadas."],
 ["Orden de protección","Resolución judicial con medidas civiles y penales para proteger a víctimas de violencia machista."],
 ["ATENPRO","Teleasistencia móvil 24 h para víctimas de violencia de género."],
 ["Puntos violeta","Espacios de información y ayuda contra la violencia machista, sobre todo en fiestas."],
 ["Delito de odio","Conducta penal contra una persona o grupo motivada por prejuicios (raza, orientación, religión…)."],
 ["Servicio 028","Atención 24 h a personas LGTBIQ+ frente a la violencia por odio."],
 ["Cuota de reserva","2 % de puestos para personas con discapacidad en empresas de 50 o más trabajadores; 5 % en la Administración."],
 ["Enclave laboral","Trabajadores de un centro especial de empleo trabajan temporalmente en una empresa ordinaria."],

U("metodologia", {
n:1, title:"La intervención social",
secs:[
 ["1.1. La intervención social y la metodología","Todas nuestras actuaciones atienden situaciones de personas con necesidades de integración y participación. La intervención social es cualquier actuación intencionada y justificada que se programa y ejecuta con una finalidad social o cultural. Su finalidad: mejorar las condiciones de vida, eliminar desigualdades y promover la dinamización cultural y la movilización social. La metodología es el conjunto de estrategias, métodos y procedimientos organizados y secuenciados para intervenir en lo social.",[]],
 ["1.1.1. Ámbitos de la intervención social","La intervención se concreta en actuaciones en estos entornos:",
  ["Atención directa: trabajo personalizado y cercano con la persona usuaria (ayuda a domicilio, centros residenciales, monitores de tiempo libre).","Planificación, ejecución y evaluación de proyectos.","Orientación: inserción laboral, recursos sociales, participación, tiempo libre.","Dinamización social o comunitaria: asociacionismo, voluntariado, concienciación.","Educación y formación: habilidades sociales, formación ocupacional.","Ocupación del tiempo libre: ocio constructivo y no alienante."]],
 ["1.1.2. Colectivos destinatarios","Colectivos que por su vulnerabilidad necesitan medidas compensatorias:",
  ["Personas mayores: bienestar y conservación de sus facultades.","Infancia y adolescencia en riesgo: también se interviene con su familia.","Personas con discapacidad o enfermedad mental: integración y calidad de vida.","Personas inmigrantes: integración desde la interculturalidad.","Personas con drogodependencias: reducir riesgos, reforzar protección, reinserción, reducir la mortalidad y mejorar su calidad de vida.","Igualdad de oportunidades entre sexos: prevenir y eliminar la discriminación y la violencia de género.","La animación sociocultural y turística se dirige además a toda la sociedad."]],
 ["1.1.3. Modelos de intervención social","Un modelo de intervención es el conjunto de principios que forma un esquema de referencia para guiar la práctica. Según la relación con la persona usuaria (en la realidad suelen mezclarse):",
  ["Asistencialista-paternalista: carácter asistencial, se centra en las carencias sin tocar las causas estructurales; no busca cambio social (comedores sociales, ropa, ayudas de urgencia). Fue el de los inicios (caridad religiosa) y sigue vigente.","Tecnocrático-burocrático: el Estado asume políticas, leyes y presupuesto; llega la profesionalización (psicología, trabajo social, educación social), pero también la burocracia: las personas acaban adaptándose a los servicios y no al revés. Propio de la expansión del estado del bienestar.","Democrático-emancipador: capacita a las personas para superar sus dificultades por sí mismas y de forma colectiva; centrado en la persona y sus potencialidades y en las causas estructurales. Es el más extendido hoy."]],
 ["1.2.1. Criterios de planificación","La intervención no se improvisa: se planifica (planificar = decidir por anticipado qué hacer). Criterios:",
  ["Alcance temporal: largo plazo (3‑5 años), medio plazo (1‑3 años) y corto plazo (menos de un año).","Alcance espacial: estatal, autonómica y local (diputación, ayuntamiento u organización de base).","Objeto: global (todo tipo de planificaciones de un país) o sectorial (económica, social, cultural, educativa…).","Nivel de operatividad: estratégica (grandes líneas, largo plazo), táctica (más concreción) y operativa (actuaciones, presupuestos y recursos detallados). Son jerárquicos: la táctica desarrolla la estratégica y la operativa sale de la táctica."]],
 ["1.2.2. Niveles de planificación: plan, programa y proyecto","Los tres niveles se concretan en tres documentos:",
  ["PLAN (nivel estratégico): el máximo nivel; marca las líneas generales. Global o sectorial; estatal, autonómico o local. Elementos: temporalización (medio y largo plazo, 3‑5 años), objetivos generales, criterios (orientaciones para lograr los objetivos) y prioridades (lo más urgente), y previsión de presupuesto.","PROGRAMA (nivel táctico): adapta el plan a un contexto, ámbito y tiempo concretos (1‑3 años). Elementos: objetivos específicos, organización de recursos y fundamentación (argumentación que justifica el programa).","PROYECTO (nivel operativo): el instrumento más frecuente; corto plazo (un año o menos), objetivos operativos medibles y actividades.","Ejemplo: Plan de Juventud → programa de autonomía y emancipación → proyectos de vivienda, empleo y formación.","Finalidad vs. objetivo: la finalidad es el impacto (reducir el paro juvenil del barrio); el objetivo, el efecto de ejecutar la intervención (crear un servicio de orientación laboral)."]],
 ["1.3. El proyecto como eje de la intervención","El proyecto es el eje del trabajo del técnico superior: lo diseña, lo aplica y lo evalúa. Elaborarlo es responder a preguntas:",
  ["¿Qué? Naturaleza · ¿Por qué? Justificación · ¿Para qué? Objetivos.","¿Cómo? Metodología · ¿Cuáles son los contenidos? Actividades.","¿A quién? Destinatarios · ¿Dónde? Ubicación · ¿Cuándo? Temporalización.","¿Quién? Recursos humanos · ¿Con qué? Recursos materiales y financieros.","¿Cómo, qué, con qué, cuándo y quién evaluará? Evaluación."]],
 ["1.3.2. Fases del proyecto (G. Pérez Serrano)","El modelo de Pérez Serrano divide el proyecto en cuatro fases, más una introducción y una fase final de difusión:",
  ["1. Análisis y diagnóstico: identificar necesidades, delimitar el problema y prever recursos.","2. Planificación o programación: objetivos, metodología, temporalización y recursos.","3. Ejecución o implementación: poner en práctica las actividades.","4. Evaluación: en todas las fases, incluida la propia evaluación; termina en el informe final.","Difusión: elegir mensaje y medios para llegar al público.","Es dinámico (retroalimentación entre fases) y cíclico (la nueva realidad es el punto de partida de un nuevo proyecto).","Características de un buen proyecto: flexible, económico, útil, coherente, sencillo, breve, claro y original o creativo."]],
 ["1.4. La perspectiva de género","Aún hay desigualdad en educación (carreras feminizadas y masculinizadas), trabajo (brecha salarial, paro, conciliación), toma de decisiones, vida doméstica (doble jornada), relaciones (violencia de género) y medios. La perspectiva o enfoque de género es la metodología que permite identificar, cuestionar y valorar la desigualdad y la discriminación que sufren las mujeres por serlo. Es esencial en cualquier intervención.",
  ["Diferencia: rasgo de todos los seres humanos, enriquecedor; deja de serlo si genera desigualdad.","Desigualdad: construida social y culturalmente; acceso desigual a recursos.","Igualdad: mismos derechos, deberes y oportunidades; compatible con la diferencia.","Diferencias de sexo: físicas y biológicas. Diferencias de género: de tradiciones, valores y creencias.","Identidad de género: cómo se percibe cada persona. Género no binario: agénero, bigénero, trigénero, pangénero.","Roles de género: modelos y funciones esperados (femeninos en lo privado y los cuidados; masculinos en lo público, el éxito y el dominio).","Estereotipos de género: características simplificadas que se asumen como propias de cada género (mujer débil, sensible; hombre fuerte, racional).","Androcentrismo: lo masculino como prototipo universal. Patriarcado: la autoridad la ejerce el varón."]],
 ["1.4.2. La perspectiva de género como herramienta","Dos conceptos clave:",
  ["Transversalidad: la igualdad no es una medida añadida para mujeres, sino que forma parte de todos los planteamientos y actuaciones.","Empoderamiento: proceso por el que las mujeres ganan confianza, recursos y fuerza para enfrentar la desigualdad y cambiar su posición.","Debe estar en todas las fases: diagnóstico (necesidades y obstáculos de las mujeres), diseño y ejecución (criterios de igualdad) y evaluación (indicadores de desigualdad).","También en la comunicación: lenguaje no sexista y sin estereotipos."]],
 ["1.4.3. Políticas de igualdad","La igualdad es un principio jurídico universal; se busca pasar de la igualdad legal a la real.",
  ["ONU: conferencias mundiales sobre la mujer: México 1975 (Año Internacional de la Mujer; propuso la Convención contra la discriminación de la mujer, aprobada en 1979), Copenhague 1980, Nairobi 1985 y Pekín 1995 (Plataforma de Acción con 12 áreas: pobreza, educación, salud, violencia, conflictos armados, economía, poder, mecanismos institucionales, derechos humanos, medios, medio ambiente y la niña). Revisiones cada 5 años. ONU Mujeres (2010).","Unión Europea: Instituto Europeo de la Igualdad de Género (EIGE, 2006, Vilna): investiga, publica estadísticas, vigila Pekín y coordina la campaña del lazo blanco. Otras acciones: Carta de la Mujer (2010), Compromiso Estratégico 2016‑2019, Plan de Acción 2016‑2020 y adhesión al Convenio de Estambul (2017) contra la violencia hacia las mujeres."]],
 ["1.4.4. Igualdad de oportunidades en España","Parte de la Constitución de 1978, que acabó con la inferioridad legal de la mujer del franquismo.",
  ["Art. 14: igualdad ante la ley sin discriminación por nacimiento, raza, sexo, religión, opinión…","Art. 9.2: los poderes públicos deben promover la libertad e igualdad reales y efectivas.","Art. 35: derecho y deber de trabajar sin discriminación por sexo.","Ley Orgánica 3/2007 para la Igualdad Efectiva de Mujeres y Hombres: ley integral que prevé conductas discriminatorias, plantea políticas activas y transversales, fija criterios para los poderes públicos y medidas para las empresas.","Instituto de la Mujer y para la Igualdad de Oportunidades (IMIO, 2014; el Instituto de la Mujer es de 1983).","Cada comunidad autónoma tiene sus leyes de igualdad y contra la violencia de género."]],
 ["Herramientas para tomar decisiones","Diseñar y aplicar un proyecto exige decidir continuamente. Herramientas que se ven en el libro:",
  ["Detección y análisis de necesidades (UD2): diagrama de espina de pescado y diagrama de Pareto.","Diseño y ejecución (UD3): diagrama de árbol, diagrama de decisiones de acción y diagrama de Gantt (y PERT).","Evaluación (UD4): matriz DAFO.","Promoción y difusión (UD5): lluvia de ideas y bola de nieve."]]
],
trucos:["PLAN, PROGRAMA, PROYECTO = del mapa del país al plano de tu calle. Plan = Estratégico, Programa = Táctico, Proyecto = Operativo → «E‑T‑O: Esto Tiene Orden».","Modelos de intervención: ASISTENCIALISTA te da el pez · TECNOCRÁTICO te manda rellenar un formulario para el pez · DEMOCRÁTICO‑EMANCIPADOR te enseña a pescar con tu barrio.","Fases de Pérez Serrano = «Di‑Pla‑Eje‑Eva»: Diagnóstico, Planificación, Ejecución, Evaluación (y luego difundes)."],
