nde interpretando símbolos como el lenguaje; requiere abstracción.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.3.6. Aprendizaje significativo (Ausubel)</h4><p>David P. Ausubel (1918-2008): el aprendizaje significativo incorpora contenidos nuevos relacionándolos con los que la persona ya tiene. Hace los conocimientos más sólidos, duraderos y fáciles de recuperar. Es especialmente útil con personas con discapacidad intelectual o dificultades de aprendizaje.</p><ul><li><b>Condiciones:</b> que los contenidos sean potencialmente significativos, claros y ordenados, y que la persona quiera aprender (esfuerzo deliberado).</li><li><b>Dimensión 1, cómo se relaciona:</b> significativo (relación sustancial con lo que se sabe) o mecánico/por repetición (al pie de la letra, sin relación).</li><li><b>Dimensión 2, cómo se adquiere:</b> por descubrimiento (hay que descubrirlo) o por recepción (se presenta acabado).</li><li>Una recepción puede ser significativa y un descubrimiento puede ser mecánico. Ejemplos: investigación científica (descubrimiento significativo), memorizar símbolos químicos (recepción mecánica).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.4. Aprendizaje en personas vulnerables</h4><p>Potencial de aprendizaje: capacidad de cada persona para modificarse a sí misma y afrontar favorablemente distintas situaciones (equivale a modificabilidad cognitiva). En personas vulnerables a menudo no se manifiesta del todo, pero puede desarrollarse con mediadores. Hay que averiguarlo para plantear expectativas razonables, y la motivación es imprescindible.</p><h4 style="font-size:18px;margin:16px 0 4px">2.4.1. Discapacidad física o sensorial</h4><p>Es un colectivo muy heterogéneo: primero hay que identificar las limitaciones en cada área. Garantizar las HAPS es condición básica para su independencia.</p><ul><li>Dificultad por falta de experiencias (en número y calidad), sobre todo si la discapacidad es de nacimiento o temprana.</li><li>Dificultad por las limitaciones de la propia discapacidad para interactuar: accesibilidad, comunicación, relación social, integración.</li><li>Dificultad por la sobreprotección familiar, que frena la iniciativa y retroalimenta la dependencia.</li><li><b>Estrategias:</b> objetivos funcionales ligados a su vida diaria, habilidades aplicables en distintos contextos (generalización), pequeños pasos, sesiones ajustadas a su atención y cansancio, respetar los tiempos de latencia (sobre todo con sistemas alternativos de comunicación) y actividades grupales de calidad.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.4.2. Discapacidad intelectual</h4><p>La dificultad depende de la intensidad de los déficits (atención, percepción, memoria, resolución de problemas, pensamiento lógico).</p><ul><li><b>Dificultades:</b> lentitud, atención breve y fatiga rápida, poco interés y curiosidad, dificultad para hacer las cosas solo y para recordar, y falta de generalización.</li><li><b>Respuesta desadaptada ante tareas difíciles:</b> apatía o pasividad excesiva, o agresividad (protestar, tirar cosas, escapar).</li><li><b>Premisas:</b> aprenden mejor tras haber tenido éxito y con refuerzo inmediato; la participación activa favorece el aprendizaje y reduce el olvido.</li><li><b>Metodología:</b> objetivos fáciles y progresivos, temas de su realidad cercana, trabajo repetitivo y manipulativo, tareas graduales (de fácil a difícil) y secuenciales (en pasos pequeños), explicaciones claras y cortas, ofrecer el modelo correcto, dar tiempo, premiar esfuerzo y logros (sobre todo al principio y justo después), y no reforzar sin querer la evitación.</li><li><b>Su repertorio de intereses es más restringido:</b> conviene identificar qué les motiva y usarlo.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.4.3. Enfermedad mental</h4><p>Hay tanta diversidad de trastornos que las pautas deben adaptarse con cautela a cada persona.</p><ul><li><b>Dificultades:</b> deterioro de funciones superiores (sobre todo memoria y atención), percepción distorsionada de la realidad, falta de conciencia de enfermedad (esquizofrenia) y afectación emocional (labilidad, tristeza, apatía, falta de motivación).</li><li>En las demencias avanzadas se pierde el habla y luego la capacidad de ir al baño, caminar, sentarse o incluso sonreír.</li><li><b>Estrategias:</b> ambientes estructurados, espacio seguro, entorno agradable sin distractores, señalizaciones y marcadores de horarios y cambios de rutina, actividades ajustadas a sus intereses, objetivos alcanzables, reforzar lo que hace bien, conservar su independencia mientras se pueda y mucha paciencia (evitar discutir).</li><li><b>Complementos (Doc. 2.7):</b> programas de rehabilitación (formación para el trabajo, resolver problemas diarios, manejar dinero, transporte, destrezas sociales) e intervención psicoterapéutica individual.</li><li>La familia y las redes de apoyo tienen un papel primordial.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.4.4. Personas en riesgo social</h4><p>Colectivos muy heterogéneos que comparten una situación de alta vulnerabilidad, coyuntural o cronificada.</p><ul><li><b>Dificultades:</b> falta de motivación y de expectativas de éxito; pocos recursos de apoyo personal; falta de oportunidades por la mala imagen social; pocas interacciones en entornos normalizados (a veces con barreras de idioma); baja formación y falta de hábitos básicos; y en ocasiones deterioro físico y afectación emocional.</li><li><b>Estrategias:</b> implicar y motivar a la persona, trabajar la autoestima, objetivos asequibles y progresivos por tramos, actividades ajustadas a sus intereses, orientar para que encuentre sentido a lo que hace, intervenir en la comunidad contra los estereotipos, mejorar su entorno y reconstruir los apoyos sociales naturales.</li></ul><div style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Trucos:</b><ul><li>Habilidad → hábito → rutina: «sé hacerlo», «lo hago cuando toca», «lo hago sin pensar».</li><li>Fases de las HAPS = «PAAC»: Preparación, Aprendizaje, Automatización, Consolidación.</li><li>Autores y su idea en una palabra: Skinner refuerzo, Watson campana (clásico), Bandura imitar, Piaget estadios, Vygotsky ayuda (ZDP), Bruner descubrir, Ausubel conectar.</li><li>Estadios de Piaget, «Se Pre-Ocupa de la Forma»: Sensomotor, Preoperatorio, Operatorio concreto, Operatorio Formal (cortes en 2, 7, 12).</li></ul></div><h3 style="font-size:22px;margin:26px 0 8px">Tema 3. Los programas de entrenamiento en HAPS</h3><h4 style="font-size:18px;margin:16px 0 4px">3.1. Valoración inicial de las HAPS</h4><p>La intervención para adquirir, perfeccionar o restaurar HAPS se hace con programas de entrenamiento (también llamados programas en HHAP), que se planifican según las necesidades de la persona. La valoración de las HAPS es el proceso de evaluar en qué actividades presenta déficits la persona y con qué intensidad. Determina de forma objetiva el déficit en cada área, la progresión de la pérdida y las capacidades que conserva.</p><ul><li><b>Finalidades:</b> reconocer las necesidades, identificar áreas deficitarias, detectar situaciones de riesgo, obtener un diagnóstico para intervenir con acierto y determinar el tipo de atención que se requiere.</li><li>La valoración no se hace desde las limitaciones, sino desde la capacidad funcional que mantiene y puede recuperar.</li><li><b>Objetivo principal ante los primeros déficits:</b> mantener su funcionalidad física e intelectual, y con ella su autodeterminación, el mayor tiempo posible.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.1.1. Indicadores de pérdida de autonomía</h4><p>La pérdida de autonomía es gradual y las habilidades suelen perderse en orden contrario al que se adquirieron. Quien primero la detecta suele ser la familia.</p><ul><li><b>Primero fallan las AVD instrumentales fuera de casa:</b> transporte público, ir al médico, gestiones, compras.</li><li><b>Después, las del mantenimiento del hogar:</b> preparar comidas, limpiar.</li><li><b>Por último, las básicas de autocuidado:</b> vestirse, comer, asearse, desplazarse.</li><li><b>Orden de aparición (Doc. 3.1):</b> seguridad (recordarle que apague el gas), memoria, teléfono, conversaciones, lectoescritura, intereses, compras, orientación, uso del baño, alimentación, apariencia e higiene bucal, vestido e higiene personal.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.1.2. Instrumentos de evaluación</h4><p>La valoración la hacen profesionales cualificados (integración social, logopedia, terapia ocupacional, sanitarios). Los instrumentos más usados son la entrevista, la observación y las escalas estandarizadas.</p><ul><li><b>Entrevista:</b> charla con la persona usuaria, su cuidador o un familiar. Puede ser estructurada (preguntas en orden fijo, tipo cuestionario) o abierta (con un guion que se va reconduciendo). Hay que crear un ambiente de confianza.</li><li><b>Observación:</b> atender al comportamiento en situaciones reales (o simuladas). Debe ser sistemática: qué registrar, cuándo, con qué criterios y medios. Se anota en una hoja de registro.</li><li><b>Límites de la observación:</b> depende de la capacidad y experiencia del observador, su presencia puede alterar la conducta y hay que esperar a que la conducta ocurra.</li><li><b>Autoobservación:</b> la persona registra sus propias conductas o pensamientos. Es difícil con déficits cognitivos y puede registrar lo que quiere que vean los demás.</li><li><b>Escalas estandarizadas:</b> formularios breves con criterios validados. Las hay funcionales (AVDB, AVDI, desempeño), cognitivas, del estado emocional y de las relaciones sociales y el entorno. El profesional elige la más conveniente.</li><li><b>Principios éticos:</b> defensa de la privacidad, valoración positiva de la diferencia y respeto a la libertad personal.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.2. Diseño del programa</h4><p>El diseño o planificación consiste en definir qué se quiere alcanzar y cómo se llevará a cabo el programa.</p><ul><li>Formular los objetivos.</li><li>Enumerar y diseñar las actividades.</li><li>Temporizar las actividades.</li><li>Prever los recursos.</li><li>Elaborar pautas para evaluar el proceso y los resultados.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.2.1. Los objetivos</h4><p>Los objetivos son las metas que se quieren alcanzar como resultado de la intervención. Son la base de la programación, guían la intervención y sirven de referencia para evaluar. Deben ser claros, concretos y cuantificables, y se redactan en infinitivo.</p><ul><li><b>Objetivos generales o de programa:</b> fijan las metas del programa completo (recuperar y perfeccionar las habilidades de higiene, apariencia y salud personal).</li><li><b>Objetivos específicos o de actividad:</b> se derivan de los generales y son más concretos, realizables y evaluables (progresar en la higiene diaria hasta hacerla sin ayuda).</li><li>Para que sean más motivadores conviene acordarlos con la persona usuaria y sus cuidadores, y fijar plazos.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.2.2. Las actividades</h4><p>Son el conjunto de actuaciones que componen el programa para alcanzar los objetivos. Se aplican con una metodología concreta (una técnica o una combinación) y suelen resumirse en fichas.</p><ul><li><b>Componentes de una actividad:</b> objetivos específicos; desarrollo (pasos bien secuenciados, qué hace el profesional y qué técnicas usa); recursos (espacio, materiales, humanos); y pautas de observación para comprobar si se logran los objetivos.</li><li><b>Ejemplo de indicadores para la higiene bucal:</b> identifica cuándo hacerla, maneja cepillo y pasta, cepilla correctamente, la duración es adecuada, se enjuaga y guarda los enseres.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">Técnicas de intervención</h4><p>Según el objetivo que persiguen se agrupan así (se estudian en el resto del libro):</p><ul><li><b>Modificación de conducta:</b> adquirir conductas adecuadas, aumentar su frecuencia o consolidarlas, y reducir o eliminar las inadecuadas.</li><li><b>Entrenamiento de las AVD:</b> para quien ha perdido funcionalidad; a menudo con productos de apoyo.</li><li><b>Entrenamiento de la movilidad:</b> con frecuencia, uso de bastón, andador o silla de ruedas.</li><li><b>Facilitar la orientación:</b> en el espacio o en el tiempo, con estrategias o productos de apoyo.</li><li><b>Habilidades sociales:</b> interactuar, participar en el grupo y comunicarse.</li><li><b>Estimulación de las funciones cognitivas:</b> frenar o retrasar su deterioro.</li><li><b>Técnicas cognitivas:</b> identificar pensamientos distorsionados y elaborar otros más constructivos (trastornos psicológicos).</li><li><b>Ejemplos:</b> un hombre con pérdida de memoria → estimulación cognitiva y pautas de orientación; una chica en silla de ruedas tras un accidente → movilidad y AVD con productos de apoyo.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.2.3. La temporización</h4><p>Es la ordenación y distribución en el tiempo de las actividades y la duración de cada una. El instrumento más usado es el cronograma: una tabla de doble entrada con las actividades en filas y las unidades de tiempo en columnas (puede indicar también los profesionales).</p><ul><li>Secuencia u orden de las actividades.</li><li><b>Duración de cada actividad:</b> sesiones que suelen durar entre 45 y 90 minutos.</li><li>Número de sesiones y frecuencia (por ejemplo, 25 sesiones de 45 minutos, dos por semana).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.2.4. Los recursos</h4><p>Son todos los medios físicos, humanos y económicos necesarios para el programa.</p><ul><li><b>Espaciales:</b> el lugar, con amplitud y condiciones ambientales adecuadas (también al aire libre).</li><li><b>Materiales:</b> mobiliario, equipos y material reutilizable o fungible. Destacan los productos de apoyo: dispositivos, equipos, instrumentos o tecnología para prevenir, compensar, controlar, mitigar o neutralizar limitaciones funcionales.</li><li><b>Humanos:</b> las personas que preparan y conducen las actividades.</li><li><b>Económicos:</b> coste y fuentes de financiación.</li><li><b>Norma UNE-EN ISO 9999:2020:</b> clasifica los productos de apoyo en tres niveles según su función (p. ej., 12 movilidad personal, 15 actividades domésticas, 22 comunicación e información, 30 esparcimiento).</li><li>El CEAPAT (Centro de Referencia Estatal de Autonomía Personal y Ayudas Técnicas, del Imserso) tiene un catálogo actualizado de productos de apoyo.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.2.5. Pautas de evaluación y 3.2.6. Entornos institucionalizados</h4><p>En la planificación se fijan los referentes para evaluar a las personas usuarias (satisfacción, expectativas, resultados) y el diseño. En residencias o centros de día el entrenamiento se integra en la programación del centro.</p><ul><li><b>Programa de intervención terapéutica (PIT):</b> conjunto de actividades terapéuticas que un centro propone para atender de forma integral a sus usuarios.</li><li><b>Áreas del PIT:</b> funcional (AVD, rehabilitación funcional), movilidad (psicomotricidad, piscina, actividades manuales), psicosocial (habilidades sociales, musicoterapia, ludoterapia, dinámicas de grupo) y cognitiva (orientación a la realidad, psicoestimulación, rehabilitación cognitiva, reminiscencia).</li><li><b>Plan individual de intervención terapéutica (PIIT):</b> especifica los programas y actividades para una persona concreta. Participan el equipo, los servicios sociales, la familia y la propia persona si su estado lo permite.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.3. Ejecución del programa</h4><p>Es la puesta en práctica de las actividades planificadas. Depende de la colaboración de todos: la persona, el equipo interdisciplinar y la familia (que es quien mejor la conoce y su referente afectivo).</p><ul><li>La persona debe estar motivada, tener capacidad física y cognitiva suficiente (si no, hubo errores al planificar) y confiar en sí misma y en los profesionales.</li><li>Asegurarse siempre de que ha comprendido las instrucciones.</li><li>Entorno ambientado y materiales preparados antes de empezar.</li><li><b>Buena relación comunicativa y coordinación del equipo (Doc. 3.8):</b> reuniones de trabajo, informes (dan continuidad, por ejemplo entre turnos) y registros de actividades y evolución. Información clara, ordenada y sin lo superfluo.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.3.2. Fases de la ejecución</h4><p>Siguen las fases de adquisición de las HAPS; hay que afianzar cada fase antes de pasar a la siguiente. El objetivo del programa es enseñar habilidades y convertirlas en hábitos.</p><ul><li><b>1. Preparación:</b> informativa y de planificación psicológica. Informar de objetivos y beneficios, explicar técnicas y secuencia, resolver dudas y temores. Es normal que al principio se muestre reacia: hay que motivarla.</li><li><b>2. Aprendizaje o adquisición:</b> aprender a ejecutar la habilidad paso a paso. En habilidades complejas se fracciona y luego se encadena (encadenamiento). El profesional da apoyos físicos, psicológicos o materiales.</li><li><b>3. Automatización:</b> repetir de forma continuada hasta hacerlo con soltura y en el momento adecuado. Es larga; el apoyo al principio es intenso y el profesional se va retirando.</li><li><b>4. Consolidación:</b> afianzar y generalizar el aprendizaje a distintos entornos, sobre todo a la vida real. Sin ella hay retroceso. Claves: supervisión, refuerzos, rutinas y el entorno.</li><li><b>Rutinas (Doc. 3.9):</b> siempre igual y en el mismo contexto, ajustadas a los ritmos reales de la persona, elegidas con ella y compartidas por todo su entorno, que actúa como modelo.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.3.3. Coordinación con la familia</h4><p>Es imprescindible en la ejecución y el seguimiento: la automatización y la consolidación solo son posibles si la habilidad se practica en la vida real. La sobreprotección o las ideas negativas de la familia dificultan la autonomía.</p><ul><li><b>Funciones:</b> comunicación fluida familia-equipo, capacitar a la familia para dar atención y apoyo, favorecer que la familia funcione de forma autónoma y apoyar a los cuidadores frente al desgaste psicoemocional.</li><li><b>Información:</b> detallada sobre los recursos disponibles, adaptada a su nivel de comprensión.</li><li><b>Formación:</b> conocimientos, técnicas, cuidados y habilidades necesarias.</li><li><b>Orientación:</b> recursos y recomendaciones para que tomen decisiones.</li><li><b>Apoyo emocional:</b> grupos o asociaciones de familiares, encuentros periódicos de apoyo mutuo.</li><li><b>Recursos de respiro:</b> para detectar el agotamiento y evitar el burnout o la claudicación.</li><li><b>Psicoeducación (Doc. 3.10):</b> va más allá de informar; por ejemplo, en la esquizofrenia enseña a la familia a reconocer los síntomas y manejar las conductas, reduciendo la carga familiar.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.3.4. Actitudes para trabajar con familias</h4><p>Las necesidades de cada familia cambian según el momento evolutivo, la causa de la dependencia, su gravedad, la aceptación, la situación económica, etc.</p><ul><li><b>Honestidad:</b> franqueza, resaltar potencialidades, nunca falsas expectativas; no tener miedo a decir «no lo sé».</li><li><b>Respeto:</b> a su intimidad y diversidad, sin estereotipos.</li><li><b>Privacidad y confidencialidad:</b> secreto profesional, información solo por los cauces reglamentarios.</li><li>Escucha activa.</li><li><b>Comunicación:</b> lenguaje sencillo, adaptado a su edad, condición o cultura.</li><li><b>Empatía y distancia profesional:</b> para evitar el enganche afectivo.</li><li><b>Paciencia:</b> sin ponerse a la defensiva ni mostrar agresividad.</li><li>Disponibilidad, dentro de lo razonable.</li><li>Priorizar el bienestar de la persona usuaria como meta compartida.</li><li><b>Lo ideal:</b> grupos pequeños y homogéneos, aprendizaje activo y dialogado, partir de su experiencia y reforzar sus logros.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.4. La evaluación del programa</h4><p>La evaluación es la valoración de todas las acciones de una intervención y de sus resultados. Es un proceso continuo que responde a tres preguntas: ¿cuándo?, ¿qué? y ¿cómo evaluar?</p><ul><li><b>Inicial o diagnóstica:</b> detecta déficits y necesidades (la valoración inicial).</li><li><b>Del proceso o continua:</b> durante el programa; indica si hay que ajustar objetivos, actividades o productos de apoyo.</li><li><b>Del resultado o final:</b> mide en qué grado se han logrado los objetivos.</li><li><b>Del seguimiento:</b> tras terminar, revisiones periódicas para comprobar si el hábito se ha consolidado o hay nuevas necesidades.</li><li><b>Objeto:</b> el programa (con los objetivos generales: logro, idoneidad de actividades, temporización, satisfacción) o las actividades (con los objetivos específicos, recursos, desempeño de los profesionales, satisfacción).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.4.3. Modo de evaluación y 3.4.4. El informe</h4><p>Se usan los mismos instrumentos que en la valoración inicial; la observación es la más frecuente por ser la más precisa y objetiva. Los indicadores de evaluación son enunciados que permiten medir el grado de aproximación a un objetivo; con ellos se hacen las tablas de observación.</p><ul><li><b>Listas de comprobación:</b> sí/no, presencia o ausencia de la conducta.</li><li><b>Escalas de estimación:</b> de frecuencia, grado o descriptivas (nunca, a veces, a menudo, siempre).</li><li><b>Registros descriptivos:</b> anecdotarios y notas de campo; menos precisos pero más ricos en detalles.</li><li><b>Informe de evaluación:</b> documento que recoge los resultados y valora el logro de los objetivos. Comunica a persona, familia y equipo.</li><li><b>Tipos de informe:</b> inicial o diagnóstico, de progreso (permite reconducir), del resultado o final (puntos fuertes y deficiencias para mejorar) y de seguimiento.</li><li><b>Partes del informe final (Doc. 3.12):</b> descripción del programa, resultados, análisis y conclusiones (con sugerencias y recomendaciones).</li></ul><div style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Trucos:</b><ul><li>Diseño del programa = «OATRE»: Objetivos, Actividades, Temporización, Recursos, Evaluación.</li><li>La autonomía se pierde «de fuera hacia dentro»: primero la calle, luego la casa, por último el propio cuerpo.</li><li>Evaluación en 4 momentos: antes (inicial), durante (proceso), al final (resultado) y después (seguimiento).</li><li>PIT = el menú del centro para todos; PIIT = el plato de cada persona (la «I» extra es de Individual).</li></ul></div><h3 style="font-size:22px;margin:26px 0 8px">Tema 4. Técnicas de modificación de conducta</h3><h4 style="font-size:18px;margin:16px 0 4px">4.1. La conducta</h4><p>La conducta es el conjunto de comportamientos de una persona o un animal en los distintos contextos de la vida; es la manifestación observable de la personalidad. Cada persona reacciona distinto a un estímulo según su genética, creencias, experiencia y circunstancias.</p><ul><li><b>Conducta vs. comportamiento:</b> la conducta son patrones de actuación estables; el comportamiento es la actuación en un espacio y un tiempo concretos.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.1.1. Los estímulos y la respuesta</h4><p>La respuesta al estímulo no depende solo del organismo: está condicionada por su interacción con el medio. Si una persona mayor es agresiva en la residencia y no lo era en casa, probablemente influyen factores del entorno.</p><ul><li><b>Estímulo externo:</b> del entorno (un insulto, un producto llamativo, un olor desagradable).</li><li><b>Estímulo interno:</b> del propio organismo (el hambre, pensar en las vacaciones, un pensamiento distorsionado).</li><li><b>Fisiológico:</b> afecta a las funciones físicas (hambre, sueño, dolor de cabeza).</li><li><b>Psicológico:</b> afecta al componente psíquico (publicidad, pensamientos distorsionados).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.1.2. Componentes de la conducta</h4><p>No basta con mirar lo observable. Localizar el estímulo y analizarlo ayuda a predecir la respuesta y decidir mejor.</p><ul><li><b>Conductual:</b> la respuesta motora, la más observable (verbal, no verbal, paralingüística).</li><li><b>Fisiológico:</b> la respuesta interna (pupilas, respiración, sudoración, ritmo cardiaco, tensión).</li><li><b>Cognitivo:</b> el pensamiento que desencadena el estímulo y que influye en la conducta.</li><li><b>Ejemplo:</b> alguien recién ingresado en una residencia piensa que le han abandonado (cognitivo), insulta y se niega a cumplir normas (conductual) y suda y está tenso (fisiológico).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.1.3. Tipos de conductas</h4><p>Desde la intervención social se clasifican con tres criterios.</p><ul><li><b>Según la elaboración de la respuesta:</b> estereotipadas, innatas o instintivas (reflejas, sin aprendizaje: apartar la mano del fuego, bostezar); aprendidas (intencionadas y con propósito; los hábitos lo son); complejas (fruto del razonamiento: ¿qué cocino hoy?).</li><li><b>Según su manifestación:</b> agresivas (violencia verbal, física o psicológica; solo atienden a sus intereses y violan los derechos ajenos); pasivas o inhibidas (sumisión, anteponen a los demás y evitan conflictos); asertivas (respeto propio y ajeno: expresar lo que se piensa y defender los propios derechos respetando los de los demás).</li><li><b>Según sus consecuencias:</b> adecuadas (beneficiosas para uno y para los demás) e inadecuadas (consecuencias desagradables).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.1.4. La modificación de conducta</h4><p>Una técnica de modificación de conducta es una estrategia o procedimiento para transformar los patrones de comportamiento habitual de una persona y conseguir una conducta adecuada: ajustar una conducta, reducir o eliminar una inadecuada o aprender una nueva.</p><ul><li>1. Identificar la conducta objetivo con detalle (frecuencia, intensidad, duración): cuanto más detalle, más eficacia.</li><li><b>2. Fijar objetivos:</b> adquirir, aumentar la frecuencia, perfeccionar, reducir o eliminar.</li><li>3. Aplicar la técnica o combinación de técnicas adecuada.</li><li>4. Hacer seguimiento para que el cambio se mantenga y se generalice.</li><li><b>Requisitos:</b> comunicación asertiva y precisa, escucha activa y empatía (la persona no es un sujeto pasivo) y un entorno agradable sin interferencias.</li><li><b>Ejemplo (Doc. 4.1):</b> Miguel, 14 años, con discapacidad intelectual grave, tira objetos en clase. Se combinan extinción (ignorar), tiempo fuera, saciación (lanzar objetos en una sala vacía hasta aburrirse) y refuerzo de conductas incompatibles («jefe de música», recados).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.2. Incrementar o perfeccionar conductas</h4><p>Objetivo frecuente en la intervención (por ejemplo, la higiene o la alimentación). Técnicas: refuerzo positivo, refuerzo negativo y control de estímulos.</p><h4 style="font-size:18px;margin:16px 0 4px">4.2.1. El refuerzo positivo</h4><p>Consiste en proporcionar una consecuencia agradable tras realizar una conducta deseada. Además, se usa como complemento en casi todas las técnicas de aprendizaje.</p><ul><li><b>Sociales:</b> alabanzas, elogios («¡lo has conseguido!») y gestos de aprobación (sonrisas, asentir).</li><li><b>Materiales:</b> consumibles (dulces, comida preferida) o duraderos (juguetes, regalos).</li><li><b>Basados en actividades:</b> una salida, música, una serie, más tiempo para lo que le gusta.</li><li><b>Canjeables:</b> fichas que se cambian por objetos o actividades.</li><li><b>Saciación:</b> si se abusa de los refuerzos (sobre todo materiales) dejan de motivar o incluso desmotivan.</li><li>Elegirlos según cada persona (entrevista con ella y su familia) y usar varios para un mismo objetivo.</li><li><b>Refuerzo continuo:</b> cada vez que actúa bien. Solo al principio: riesgo de saciación, de no generalizar y de que la conducta desaparezca al quitar el refuerzo.</li><li><b>Refuerzo intermitente:</b> solo algunas veces. Más eficaz después de la fase inicial.</li><li>Aplicarlo inmediatamente después de la conducta (nunca antes). Al principio más potente y frecuente; luego retirarlo poco a poco, aunque puede mantenerse algo de refuerzo social.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.2.2. El refuerzo negativo</h4><p>Consiste en retirar una situación molesta o desagradable cuando la persona ejecuta una conducta. La sensación placentera viene de que desaparece lo aversivo. Diferencia con el positivo: en el positivo se da algo, en el negativo se quita; en ambos el resultado es agradable y la conducta aumenta.</p><ul><li><b>Por escape:</b> la desaparición de lo desagradable impulsa la conducta (se come la verdura para que la dejen ver la tele).</li><li><b>Por evitación:</b> la conducta impide que aparezca lo desagradable (los viernes compran comida rápida para evitar tensiones).</li><li><b>Qué se puede retirar:</b> objetos o ambientes desagradables, tareas que no le apetecen (poner la mesa, fregar), dolores o posturas molestas.</li><li>Aplicarlo cuanto antes; al principio de forma continua, luego intermitente, hasta retirarlo.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.2.3. El control de estímulos</h4><p>Consiste en preparar el medio con los estímulos discriminativos adecuados para que aumente la probabilidad de la conducta deseada. Se refuerza la respuesta solo cuando aparece en presencia del estímulo discriminativo. A diferencia del refuerzo, actúa sobre los antecedentes, no sobre la consecuencia.</p><ul><li><b>Ejemplo:</b> si hace la tarea cuando el profesional se lo indica, se refuerza; si la hace sin que se lo indiquen, no se le presta atención.</li><li>Identificar por observación la relación entre estímulos y conductas.</li><li>Detectar y eliminar los estímulos que provocan la conducta inapropiada.</li><li>Resaltar los estímulos que incitan a responder bien.</li><li><b>No abusar:</b> cada presentación no reforzada del estímulo debilita su poder.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.3.1. El modelado</h4><p>Para adquirir conductas nuevas se usan el modelado, el moldeado y el encadenamiento. El modelado se basa en la observación de un modelo cuya conducta, pensamientos o actitudes se consideran adecuados (deriva del aprendizaje social de Bandura). El modelo puede ser presencial o diferido (vídeo).</p><ul><li><b>Elección del modelo:</b> alguien que lo ejecute perfectamente y con claridad (profesionales, personas de referencia o personas que vivieron una situación parecida). Cuanto más se parezca a la persona (edad, sexo, situación) y más importante sea para ella, mejor.</li><li><b>Riesgo:</b> si el modelo tiene conductas inadecuadas, se aprenden conductas desadaptativas (redes sociales).</li><li><b>Pasos:</b> valorar si tiene capacidad, explicar la conducta y su utilidad, destacar lo clave mientras observa, imitar inmediatamente, usar instigadores si hace falta, reforzar después y retirar apoyos poco a poco con varios ensayos.</li><li><b>Tipos (Doc. 4.2):</b> pasivo o activo; simbólico (vídeo), en vivo o encubierto (imaginado); participativo o no; positivo, negativo o mixto; de conductas intermedias u objetivo; individual o grupal; simple o múltiple; de dominio (el modelo ya domina) o de afrontamiento (empieza como el observador y va mejorando).</li><li><b>Instigadores o incitadores (Doc. 4.3):</b> estímulos previos que ayudan a iniciar la respuesta (instrucciones verbales, gestos, imágenes). Se retiran a medida que se logra la respuesta.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.3.2. El moldeado</h4><p>Consiste en reforzar de forma selectiva las conductas más cercanas a la que se quiere instaurar, por aproximaciones sucesivas. Sirve para conductas que no están en el repertorio y son difíciles por su complejidad o por las limitaciones de la persona. Muy usado en rehabilitación motora y del habla y en educación especial.</p><ul><li>Definir con claridad la meta y todos los pasos intermedios.</li><li><b>Plantear bien la progresión:</b> al principio mucho refuerzo y poca exigencia; después cada vez más exigencia.</li><li>Una vez adquirida, pasar de refuerzo continuo a intermitente.</li><li><b>Guía física (Doc. 4.4):</b> el profesional induce manualmente, por contacto físico, los movimientos que se quieren desarrollar. Muy frecuente en habilidades motoras.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.3.3. El encadenamiento</h4><p>Consiste en descomponer una conducta compleja en una sucesión de conductas más sencillas, que la persona a veces ya conoce pero no sabe enlazar. Muy útil en autocuidado y tareas domésticas (vestirse, comer, asearse).</p><ul><li>1. Especificar la conducta final y todas las conductas necesarias (higiene matinal: ir al baño, lavarse manos y cara, secarse, cepillarse los dientes y el pelo).</li><li>2. Secuenciar con detalle cada subconducta según la capacidad (cepillarse: coger y abrir el tubo, coger el cepillo, poner pasta, cerrar…).</li><li>3. Entrenar cada subconducta hasta que salga bien (si no usa jabón, enseñárselo).</li><li>4. Encadenar las subconductas en orden, empezando por la primera.</li><li>Se complementa con modelado, moldeado, instigadores y refuerzos (Doc. 4.5).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.4. Reducir o eliminar conductas</h4><p>Se aplican consecuencias negativas o desagradables cada vez que aparece la conducta indeseada.</p><ul><li><b>Coste de respuesta o castigo negativo:</b> retirar algo agradable tras la conducta no deseada (elogios, caprichos, actividades gratas, relación con personas o ambientes amenos). La persona debe saber el motivo y tener alternativas adecuadas.</li><li><b>Castigo positivo:</b> aplicar una consecuencia aversiva justo después (recriminación verbal, gestual o física). Solo en casos graves (agresiones, autolesiones). Inconvenientes: no educa, crea aversión hacia quien lo aplica y produce habituación. Usarlo solo si lo demás falla.</li><li><b>Saciación (Doc. 4.6):</b> administrar el refuerzo de forma masiva para que pierda valor. De estímulo (dar el refuerzo mucho tiempo) o de respuesta/práctica masiva (hacer la conducta inadecuada de forma masiva, como tirar objetos durante mucho rato).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.4.3. La extinción y 4.4.4. El tiempo fuera</h4><p>Dos técnicas muy usadas para que la conducta deje de mantenerse.</p><ul><li><b>Extinción:</b> ignorar la conducta indeseada para que desaparezca al no recibir refuerzo. Muy eficaz con conductas reforzadas sin querer (una gracia en la mesa que hizo reír a todos). Siempre y de forma continua, nunca intermitente; mejor combinada con refuerzo de conductas alternativas.</li><li><b>Aislamiento o tiempo fuera:</b> retirar un refuerzo o impedir el acceso a él ante una conducta inapropiada.</li><li><b>Tiempo fuera de actividad:</b> apartar de una actividad agradable (no jugar al ajedrez un tiempo si tira las fichas al perder).</li><li><b>Tiempo fuera de lugar:</b> retirar de un lugar agradable (no salir al jardín si arranca las flores).</li><li>Solo funciona si la actividad o el lugar son valiosos para la persona, y debe ser breve.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">Disciplina positiva (Doc. 4.7)</h4><p>Las técnicas punitivas generan obediencia sin comprensión, y con ella resentimiento, baja autoestima, rebeldía o habituación al castigo. La disciplina positiva establece normas desde el entendimiento mutuo, la empatía y el acuerdo, con acciones sustitutivas positivas y acompañamiento emocional.</p><ul><li><b>Tiempo fuera positivo:</b> persona y profesional se retiran juntos de la situación tensa para buscar calma y dialogar una solución.</li><li><b>Sillón o rincón de la calma:</b> espacio amable y cómodo donde sentarse juntos a hablar de lo sucedido y buscar alternativas.</li><li>También son de disciplina positiva el refuerzo de conductas incompatibles y la sobrecorrección.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.4.5. Conductas incompatibles y 4.4.6. Sobrecorrección</h4><p>Dos técnicas que, además de eliminar la conducta mala, fomentan la buena.</p><ul><li><b>Refuerzo de conductas incompatibles:</b> premiar de forma continuada las conductas incompatibles con la que se quiere eliminar y no reforzar esta (gritar en clase es incompatible con estar en silencio). La persona debe saber qué se premia; a veces se premia un periodo sin la conducta, que se va alargando.</li><li><b>Sobrecorrección:</b> restitución + práctica positiva.</li><li><b>Restitución:</b> corregir los efectos de la conducta y dejar el entorno como estaba.</li><li><b>Práctica positiva:</b> repetir la conducta alternativa deseada.</li><li><b>Ejemplo:</b> si tira la bandeja de comida, la recoge y limpia (restitución) y vuelve a cogerla correctamente (práctica positiva). Eficaz en agresiones, berrinches, malos modales en la mesa o incontinencia voluntaria.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.5. Técnicas para controlar conductas</h4><p>Se basan en un acuerdo negociado entre profesional y persona usuaria, en un soporte tangible. Esto permite valorar los progresos de forma más objetiva y aumenta el compromiso. Sirven para aumentar conductas adecuadas y para reducir las inadecuadas.</p><h4 style="font-size:18px;margin:16px 0 4px">4.5.1. La economía de fichas</h4><p>Es un sistema de refuerzo que utiliza fichas canjeables por recompensas para premiar las conductas que se desea establecer. Combina refuerzo positivo (se ganan fichas) y castigo negativo (se pierden).</p><ul><li><b>Ventajas:</b> el refuerzo es inmediato y tangible, y la persona gestiona y guarda sus fichas hasta canjearlas.</li><li><b>Reglas pactadas antes de empezar:</b> qué conductas ganan y cuáles pierden fichas, el valor de cada ficha y las recompensas (variadas y que no pueda conseguir fácilmente fuera).</li><li>Contabilidad diaria de fichas ganadas, gastadas, perdidas y acumuladas.</li><li>Puede haber fichas de valor bajo a corto plazo (un café, 5-10 puntos) y de valor alto a largo plazo (una excursión, 300-400 puntos).</li><li>Al inicio refuerzo continuo; adquirida la conducta, intermitente; consolidada, desvanecimiento.</li><li><b>Desvanecimiento:</b> espaciar la entrega, dar menos fichas, pedir más puntos por premio, aumentar los criterios y sustituir las fichas por refuerzos sociales.</li><li>Para evitar «números rojos» y abandono, sobre todo al principio, usar avisos o tarjetas antes de retirar fichas.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.5.2. El contrato de conducta</h4><p>Es un acuerdo negociado entre profesional y persona usuaria, por escrito, que establece lo que la persona se compromete a hacer y las consecuencias de cumplirlo o no. Se basa en el refuerzo recíproco (refuerzo positivo + castigo negativo).</p><ul><li>Descripción detallada de las conductas a implantar, perfeccionar o eliminar.</li><li><b>Consecuencias:</b> refuerzos por cumplir y castigos negativos por incumplir.</li><li>Criterios de valoración, cómo se hará, quién la hará y cómo se informará a la persona de su evolución.</li><li>Límites de duración del contrato.</li><li>Puede provocar el rechazo si la persona no está de acuerdo con la valoración: hay que asegurarse de que es la técnica indicada e informarle siempre.</li><li><b>Modelo (Doc. 4.8):</b> un punto por conducta cumplida en un carnet, canje semanal, se pierde un punto por conducta inadecuada, revisión periódica y firma de ambas partes.</li></ul><div style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Trucos:</b><ul><li>Positivo = se AÑADE algo; negativo = se QUITA algo. Refuerzo = la conducta SUBE; castigo = la conducta BAJA. Cruza las dos y salen las cuatro técnicas.</li><li>Adquirir conductas nuevas = «las 3 M»: Modelado (mirar), Moldeado (acercarse poco a poco), y encadenaMiento (paso a paso).</li><li>Extinción = «hacer como que no lo ves», siempre y sin excepciones.</li><li>Sobrecorrección = «lo arreglas y lo repites bien».</li></ul></div><h3 style="font-size:22px;margin:26px 0 8px">Tema 5. Intervención en actividades de la vida diaria</h3><h4 style="font-size:18px;margin:16px 0 4px">5.1. Las actividades de la vida diaria</h4><p>Las AVD son los actos cotidianos que permiten a una persona desenvolverse en su día a día. Su capacidad para realizarlas determina su grado de independencia, imprescindible para la autonomía. Trabajarlas aporta equilibrio emocional (sentirse útil), seguridad en uno mismo, más autonomía y motivación, y participación activa.</p><ul><li><b>AVD básicas (AVDB):</b> autocuidado elemental: comer, vestirse, asearse, controlar esfínteres, desplazarse.</li><li><b>AVD instrumentales (AVDI):</b> adaptarse al medio: leer y escribir, tomar la medicación, manejar dinero, transporte público, cocinar, teléfono.</li><li><b>AVD avanzadas (AVDA):</b> estilo de vida y valores: ocio y tiempo libre, participación social, actividades laborales (remuneradas) y educativas.</li><li>La independencia se pierde primero en las AVDI fuera de casa, luego en las del hogar y al final en las AVDB.</li><li><b>La CIF (Doc. 5.1) también las clasifica por ámbito:</b> aprendizaje y conocimiento, tareas y demandas generales, comunicación, movilidad, autocuidado, vida doméstica, relaciones interpersonales, áreas principales de la vida (educación, trabajo, economía) y vida comunitaria y cívica.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.1.2. La terapia ocupacional</h4><p>Es la disciplina sociosanitaria que promueve la salud y el bienestar mediante el uso terapéutico de actividades de cuidado, laborales y lúdicas. Su objetivo es que la persona haga las AVD de la forma más independiente posible, modificando el entorno o usando productos de apoyo. Trabaja en geriatría, pediatría, salud mental, neurología, inserción laboral, etc.</p><ul><li><b>Valorar la capacidad funcional:</b> limitaciones, pero también capacidades y potencialidades.</li><li>Diseñar y aplicar programas de entrenamiento en AVD (valoración, planificación, ejecución y evaluación).</li><li><b>Mejorar la funcionalidad:</b> evitar el deterioro, restaurar o reeducar habilidades aprovechando las capacidades que conserva.</li><li>Asesorar y entrenar en productos de apoyo y ortoprotésicos.</li><li>Crear entornos favorables (reestructuración ambiental, eliminar barreras).</li><li>Orientar a usuarios, familias y otros profesionales, como los técnicos en atención a personas en situación de dependencia (TAPSD).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.2. Valoración de las habilidades de la vida diaria</h4><p>Consiste en evaluar en qué grado una persona realiza cada AVD, si necesita ayuda de otra persona y en qué medida. Tiene dos procesos: la recogida de información (funcionalidad, características personales, circunstancias familiares y entorno físico y social) y el diagnóstico de la funcionalidad.</p><ul><li><b>Técnicas:</b> recopilación documental y entrevistas (información general), observación directa (desempeño funcional) y escalas de valoración funcional (nivel de competencia).</li><li>La elección depende de la familiaridad del profesional con el instrumento, la fiabilidad de los datos y la profundidad de la evaluación que se busca.</li><li><b>Expediente personal:</b> informes, exploraciones e historial.</li><li>Entrevistas con la persona y su familia, preparadas con un guion (descanso, higiene, alimentación…); pueden incluir cuestionarios de autoevaluación.</li><li><b>Observación directa:</b> atender al desempeño en una situación habitual sin interferir ni alterar el ambiente; se registra en una pauta de observación, mejor acompañada de registros descriptivos.</li><li>Todo instrumento se aplica con destreza, empatía y respeto, y no sustituye el juicio profesional.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">Escalas de valoración funcional</h4><p>Herramientas estandarizadas que evalúan y registran objetivamente la competencia en las AVD. Las puede aplicar cualquier profesional con formación y familiaridad con ellas.</p><ul><li><b>Escala de la Cruz Roja:</b> seis niveles (de 0, independencia, a 5, incapacidad total) según AVD, deambulación y continencia. Muy sencilla y rápida, pero poco precisa en dependencias leves y moderadas.</li><li><b>Índice de Katz:</b> seis AVDB (aseo, vestido, uso del retrete, movilidad, continencia y alimentación), independiente o dependiente. Valora el estado actual, no la capacidad: si no quiere hacerlo o lo hace con supervisión, cuenta como dependiente. Grados de A (independiente en las seis) a G (dependiente en todas).</li><li><b>Índice de Barthel:</b> diez AVD (alimentación, vestido, cuidado personal, defecación, micción, uso del retrete, transferencia sillón-cama, deambulación y escaleras) con varias alternativas. Puntuación: 100 independencia; 91-99 leve; 61-90 moderada; 21-60 severa; 0-20 dependencia total.</li><li><b>Escala de Lawton y Brody:</b> ocho AVDI (teléfono, compras, preparar la comida, cuidado de la casa, lavado de la ropa, transporte, medicación y economía), 1 independiente o 0 dependiente. Tiene un fuerte sesgo sociocultural y de género (tareas hechas tradicionalmente por mujeres).</li><li><b>Baremo de valoración de la situación de dependencia (BVD):</b> establecido por el Real Decreto 174/2011 en desarrollo de la Ley 39/2006. Valora AVDB, tareas domésticas y toma de decisiones con nivel de desempeño, tipo de apoyo (supervisión, asistencia física parcial, sustitución máxima, apoyo especial), problema y frecuencia. Lo usan los organismos oficiales para reconocer prestaciones; es objetivo pero complejo.</li><li><b>Otras:</b> escala del Instituto de Rehabilitación de Chicago, Conjunto mínimo de datos (CMD), índice de Kenny, baremo de ayuda de tercera persona (ATP) y Medida de la independencia funcional (MIF).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.2.2. El diagnóstico</h4><p>Los datos se analizan y sistematizan para elaborar el diagnóstico de la funcionalidad, base para diseñar el programa.</p><ul><li>Identificar áreas deficitarias o problemas de desempeño.</li><li>Determinar el tipo y la cantidad de ayudas que necesita.</li><li>Establecer factores limitantes y capacidades potenciales.</li><li>Detectar situaciones de riesgo.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.3. Planificación de la intervención</h4><p>Se parte del diagnóstico, se formulan los objetivos y se concretan actividades (con contenidos y sesiones), técnicas y recursos. Hay que tener en cuenta la edad, la madurez y el desempeño de la persona.</p><ul><li><b>Áreas de actividades:</b> higiene personal (aseo, ducha, higiene dental, vestido), alimentación y nutrición (dietas, compra, cocinar, cubiertos), tareas domésticas (lavadora, tender, planchar, limpiar), cuidado de la salud (medicación, centro de salud, farmacia), instrumentales (gastos, dinero, transporte, teléfono) y vida social.</li><li><b>Se organiza en sesiones:</b> por ejemplo, dos sesiones semanales de 45 minutos durante tres meses.</li><li><b>Ejemplo (Doc. 5.11):</b> programa para trastorno mental grave de 48 sesiones de 45 minutos, con un módulo de autocuidado (higiene y vestido, alimentación, sueño, vida saludable) y otro de autonomía social (tareas domésticas, dinero y compras, trámites, comunicación, transporte), con tareas para casa y autorregistros.</li><li>Existen programas prediseñados (Alzheimer, síndrome de Down, edad escolar) útiles como orientación, aunque el programa debe ser individualizado.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.3.2. Las técnicas de intervención</h4><p>Como se trata de adquirir y perfeccionar conductas, las técnicas prioritarias son las de modificación de conducta, en una secuencia habitual.</p><ul><li><b>Preparación:</b> relación terapéutica positiva y conciencia de los beneficios.</li><li><b>Instrucción verbal:</b> qué se entrenará y cómo hacerlo.</li><li><b>Modelado:</b> el profesional ejecuta correctamente la conducta.</li><li><b>Encadenamiento:</b> descomponer procedimientos complejos en tareas sencillas.</li><li><b>Moldeado:</b> corregir las acciones para aproximarlas a la conducta deseada, con instigadores verbales, gestuales o físicos.</li><li><b>Role playing:</b> practicar en entornos simulados.</li><li><b>Automatización y consolidación:</b> repetir hasta hacerlo sin instigación ni supervisión.</li><li><b>Generalización:</b> aplicar lo aprendido en contextos reales (tareas para casa) con registro de tareas y dudas.</li><li>Seguimiento tras el programa, y contrato conductual si hace falta formalizar compromisos.</li><li><b>Complementos:</b> refuerzo, retroalimentación (feedback), orientación y entrenamiento familiar y extinción progresiva de apoyos.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.3.3. Recursos: los productos de apoyo</h4><p>Un producto de apoyo es cualquier objeto, dispositivo o entorno cotidiano creado o modificado para responder a las limitaciones funcionales de una persona. No tiene que ser sofisticado (principio de simplificación). Su elección depende de la persona, de las características del recurso (funcionalidad, manejo, precio) y del entorno donde se usará. Implantarlo incluye enseñar su uso y mantenimiento.</p><ul><li><b>Clasificación ISO 9999 para AVD:</b> 04 funciones corporales, 06 órtesis y prótesis, 09 cuidado y protección personal, 12 movilidad y transporte, 15 actividades domésticas, 18 mobiliario y adaptaciones, 22 información y comunicación, 24 manipular objetos, 27 entorno físico, 28 empleo, 30 esparcimiento y ocio.</li><li><b>Información:</b> CEAPAT (catálogo en línea) y CTI de la ONCE (déficit visual).</li><li><b>Productos adaptados:</b> objetos modificados para usarlos de forma autónoma (velcro, mangos engrosados para cubiertos o cepillos, adaptadores de vasos, alzadores de sillas, pinzas para alcanzar).</li><li><b>Productos ortoprotésicos:</b> productos sanitarios que sustituyen una estructura corporal o corrigen su función. Órtesis: uso externo, modifican el sistema neuromuscular o el esqueleto (corsés, collarines, plantillas, rodilleras). Prótesis: sustituyen un órgano o estructura; internas (cadera, lentes intraoculares, implantes auditivos) o externas (mano, pie, audífonos).</li><li><b>Productos de apoyo para AVD:</b> cuidado personal (calzadores, abotonadores, cortaúñas, orinales, absorbentes), domésticos (sujeción de cubiertos, abrelatas adaptados, calzaplatos, recogedores de mango largo, enhebradores), comunicación, manipulación (mandos para persianas, domótica) y ocio.</li><li><b>Adaptaciones del hogar:</b> mobiliario regulable y ergonómico (mesas, asientos, camas articuladas), dispositivos de apoyo (pasamanos, barras), elementos de seguridad (barandillas de cama, antideslizantes, válvulas de gas, detectores de humo) e iluminación.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">Accesibilidad y diseño universal (Doc. 5.14)</h4><p>La accesibilidad universal es la condición que deben cumplir objetos, espacios y servicios para que cualquier persona pueda usarlos de forma segura, cómoda, autónoma y en igualdad. Debe ser física, sensorial y cognitiva, y beneficia a toda la población (los pictogramas sirven a personas con autismo, a niños que no leen y a extranjeros).</p><ul><li><b>Requisitos DALCO:</b> Deambulación, Aprehensión, Localización y Comunicación.</li><li><b>Diseño universal (diseño para todos):</b> concebir desde el origen productos y entornos que todos puedan usar sin adaptación posterior.</li><li><b>7 principios:</b> uso igualitario, flexibilidad, simplicidad e intuitividad, información fácilmente perceptible, tolerancia a errores, esfuerzo físico escaso y dimensiones apropiadas.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.4.1. Pautas generales de intervención</h4><p>En el domicilio (individual) es más fácil implantar rutinas y contar con la familia, por eso resulta más eficaz; en centros suele hacerse en grupo pero individualizado según el plan de atención. El objetivo debe ser educativo (favorecer la autonomía) y no asistencial (hacerlo por la persona). El profesional necesita formación en ergonomía y saber pedir ayuda si se agota.</p><ul><li><b>Estructura de cada sesión:</b> inicio (repaso y tareas para casa), presentación de objetivos, entrenamiento y finalización (resumen y nuevas tareas).</li><li><b>Rol de instructor:</b> en la primera fase, explica lo motivacional y lo procedimental.</li><li><b>Rol de cooperador:</b> en la fase de aprendizaje, da apoyos, ayudas e indicaciones.</li><li><b>Rol de observador o supervisor:</b> cuando ya lo hace casi bien, corrige desviaciones.</li><li>Tutorías de seguimiento con la persona y su entorno, incluso después del programa.</li><li><b>Favorecer la autonomía:</b> rutina diaria con horarios, valorar dificultades y avances, entorno seguro y estructurado, ayudar solo en lo necesario (no hacer lo que puede hacer sola), promover la autodeterminación y evitar la sobreprotección.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.4.2. Higiene personal</h4><p>Objetivo: que haga con la máxima corrección y la mínima ayuda el mayor número posible de actividades: higiene básica (manos y cara), corporal (baño o ducha, genitales, manos y pies), capilar, bucal y cuidado del aspecto (afeitado, depilación, cosméticos).</p><ul><li>Tener productos y productos de apoyo preparados; entorno seguro (asideros, espejos inclinados, grifos adaptados, pictogramas, colores contrastados).</li><li><b>Intimidad:</b> invadirla lo menos posible, mantener tapada a la persona y exponer cada zona solo el tiempo necesario. Respetar sus costumbres.</li><li><b>Baño o ducha:</b> acceso, regular la temperatura (bañera: más de 15 minutos), lavar por zonas (remojo, enjabonado, aclarado), secar con suavidad los pliegues (la humedad causa maceraciones y úlceras) e hidratar.</li><li><b>Seguridad (Doc. 5.15):</b> suelos antideslizantes, plato de ducha a ras del suelo, barras, grúa si hace falta, asientos de ducha, todo al alcance y lavado sentado.</li><li><b>Baño en cama:</b> proteger la cama; cara y cuello, parte superior, parte inferior y por último genitales. Así nunca queda desnuda del todo; renovar el agua y que colabore en lo que pueda.</li><li><b>Genitales:</b> es lo que más invade la intimidad, así que lo hace la propia persona si puede. En mujeres, de pubis hacia ano; en hombres, retirar el prepucio, luego pene, escroto y perineo.</li><li>Lavado de pelo en cama con lavacabezas inflable; manos siempre antes y después de comer y tras el retrete; cara cada mañana solo con agua.</li><li><b>Manos y pies:</b> remojar, limpiar y cortar uñas, hidratar, secar bien y revisar rozaduras o úlceras (podología si hace falta).</li><li><b>Afeitado:</b> mejor eléctrico si no puede solo; depilación con crema si no es autónoma. Higiene bucal: pasta, cepillado de dientes, lengua y paladar, y enjuague; limpiar prótesis no fijas.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.4.3. Evacuación</h4><p>La falta de autonomía en la evacuación se vive con vergüenza y frustración: hay que preservar la intimidad y mostrar respeto. No debe ser solo asistencial: enseñar y dejar que participe.</p><ul><li>Siempre con guantes; proteger la cama con empapador; movilizar si no colabora.</li><li><b>Productos:</b> alzas de inodoro, ayudas para el papel higiénico, barras laterales, inodoros con chorro y aire.</li><li><b>Orinal plano o cuña:</b> micción de mujeres y defecación. Orinal de botella: micción de hombres.</li><li><b>Limitaciones leves:</b> acompañar al baño y ayudar con la ropa, sentarse y el papel.</li><li><b>Encamada y autónoma:</b> darle el orinal y salir o taparla; encamada sin colaboración: levantar la pelvis o girarla de lado para colocar la cuña.</li><li><b>Incontinencia:</b> primero entrenar micción programada y control de esfínteres. Absorbentes: bragas-pañal (fugas leves) o pañales (incontinencia consolidada). Cambio: enrollar el sucio, lavar y secar la zona perineal y ajustar el limpio.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.4.4. Vestido</h4><p>Incluye preparar el vestuario y el proceso de vestirse y calzarse.</p><ul><li><b>Preparar productos de apoyo:</b> tiradores de cremallera, abotonadores, subecalcetines, calzadores de mango largo.</li><li>Dejar las prendas apiladas en orden inverso al de colocación.</li><li>Prendas amplias, abiertas por delante y con cierres simples (velcro, elásticos); calzado sin cordones (mocasines).</li><li>Mejor sentado, por seguridad y comodidad. Respetar costumbres y preferencias.</li><li>Preparar el vestuario según estación, tiempo y actividad, combinando colores, derecho y revés y orden (clave con deterioro cognitivo).</li><li>Si hay un miembro afectado, se empieza a vestir por él. Desvestirse sigue el orden inverso.</li><li><b>Encamada:</b> primero la mitad inferior, luego la superior, ajustar, abrochar y calzar.</li><li>Priorizar siempre que lo haga sola aunque tarde más.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.4.5. Alimentación</h4><p>La comida satisface la necesidad de nutrirse, ayuda a la orientación temporal y es un acto social. Requiere habilidades de preparación y de ingesta.</p><ul><li><b>Preparación:</b> planificar el menú (dieta equilibrada), preparar utensilios, elaborar y servir.</li><li><b>Obstáculos:</b> falta de conocimientos culinarios (formación), dificultades de agarre (tablas antideslizantes, mangos adaptados) y de aproximación a los muebles.</li><li><b>Prevenir accidentes:</b> guantes aislantes, arrastrar recipientes, cocinas con testigo de calor residual.</li><li><b>Estrategias:</b> recetas, orden fijo de las cosas (clave con déficit visual), lo pesado abajo y lo más usado a mano, robots de cocina, cajones en vez de armarios bajos.</li><li><b>Dificultades en la ingesta:</b> mantener la postura, coordinación y motricidad fina, masticación y deglución, y hábitos mal asumidos.</li><li><b>Estrategias:</b> sentarse bien con la mesa a la altura de los codos y la comida a la vista, explicar qué hay en el plato, cubiertos y vasos adaptados, entrenar hábitos y adaptar la consistencia de los alimentos si hay problemas de deglución.</li><li><b>Si se necesita ayuda, se descompone la tarea:</b> por ejemplo, servir la comida cortada para que la pinche sola en vez de darle de comer.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.4.6. Control y mantenimiento de la salud</h4><p>Se centra en la prevención, la toma correcta de medicación y el autocontrol de la salud.</p><ul><li><b>Prevención:</b> actividad física regular, dieta equilibrada, prevenir accidentes (detectores, barras) y evitar conductas de riesgo como subirse a sillas o automedicarse. Saber llamar al 112; la teleasistencia y teléfonos con teclas programadas (con fotos) ayudan.</li><li><b>Medicación:</b> almacenarla en su lugar y bien conservada, usar pastilleros diarios o semanales y pautas para recordar las tomas, y enseñar la administración correcta (cápsulas, supositorios, nebulizador, insulina).</li><li><b>Autocontrol:</b> constantes vitales (temperatura, respiración, tensión y pulso), dolor, glucosa, hidratación, cambios emocionales y memoria. Revisar las zonas de presión en personas encamadas o sentadas mucho tiempo para evitar úlceras.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.4.7. AVD instrumentales</h4><p>Se priorizan las básicas, pero conviene trabajar las instrumentales: tareas domésticas, desplazamientos, gestiones financieras y tecnología. Al estar muy ligadas a los hábitos, cambiarlas es lento.</p><ul><li><b>Compra:</b> planificar y hacer la lista, elegir establecimiento (o por internet), desplazarse (carro, mejor que bolsas), elegir productos, pagar (monederos con compartimentos), volver y guardar (limpieza separada de los alimentos).</li><li><b>Ropa:</b> lavar (separar por colores y tejidos), secar, planchar, guardar y coser. Apuntar en la etiqueta, pinzas de mango largo, tendederos extensibles.</li><li><b>Limpieza:</b> planificar (cocina y baño, más a menudo), utensilios adaptados, productos adecuados (no usar cera, resbala) y reciclar la basura.</li><li><b>Desplazamientos:</b> transporte accesible con avisos visuales y sonoros, y habilidades para horarios, recorridos y billetes; vehículo privado adaptado (rampa, plataforma, transferencia desde la silla).</li><li><b>Gestiones financieras:</b> con déficit cognitivo, aprender monedas y billetes, darle el dinero justo, distinguir gastos fijos, ocasionales e imprevistos y hacer un presupuesto.</li><li><b>Tecnología:</b> aumenta la autonomía, pero puede crear brecha digital por barreras económicas, competenciales (alfabetización digital) y de accesibilidad.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.5. Adaptación del entorno</h4><p>Es el conjunto de modificaciones del ambiente físico para adecuarlo a la persona y que pueda hacer las AVD de forma segura e independiente.</p><ul><li><b>Beneficios:</b> prevenir accidentes (caídas), facilitar las AVD, mejorar la orientación, mejorar la calidad de vida (retrasa el ingreso en una residencia) y el estado emocional (autoestima y sensación de control).</li><li><b>Criterios:</b> adecuarse a la persona, ver las posibilidades de reforma (vivienda, dinero) y jerarquizar: primero las estancias de más riesgo (baño y cocina) y la opción más sencilla y barata.</li><li><b>Domótica:</b> tecnología aplicada a la vivienda para automatizar, mejorar la seguridad y controlar temperatura, luces o electrodomésticos.</li><li><b>Ejemplos (Doc. 5.18):</b> timbres de emergencia, sensores de luz, pasamanos, rampas o salvaescaleras, suelos antideslizantes, ducha a ras de suelo, cortina en vez de mampara, grifos monomando, cocina vitrocerámica y utensilios más usados a mano.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.6. Evaluación del programa</h4><p>Sirve para valorar el logro de objetivos, detectar puntos fuertes y débiles, conocer la opinión de la persona y mejorar la actuación del equipo.</p><ul><li><b>Del proceso (actividades):</b> con indicadores de logro concretos; si no se alcanzan, revisar si la actividad era adecuada, si se hizo bien o si los objetivos eran demasiado ambiciosos.</li><li><b>Del progreso:</b> registros de seguimiento de la generalización y comparar en el tiempo (p. ej., cada 6 meses) las puntuaciones en las mismas escalas (Cruz Roja 0-5, Katz 0-6, Barthel 0-100, Lawton y Brody 0-8).</li><li><b>Del resultado (programa):</b> en qué medida se han logrado los objetivos generales.</li><li><b>Del equipo profesional:</b> autoevaluaciones y escalas de actitud que sirven al profesional (formación), al equipo (coordinación) y a la organización.</li><li><b>Satisfacción de la persona usuaria:</b> esfuerzo, agrado, resultados y papel del profesional.</li><li><b>Comunicación:</b> informe de evaluación con resultados y conclusiones, que se comunica a la persona y su familia.</li></ul><div style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Trucos:</b><ul><li>AVD = «Básicas para Sobrevivir, Instrumentales para Integrarse, Avanzadas para Disfrutar».</li><li>Escalas por número de cosas: Katz 6 básicas, Lawton 8 instrumentales, Barthel 10 (sobre 100 puntos).</li><li>Orinales: «cuña plana para ellas y para hacer caca; botella para el pis de ellos».</li><li>Accesibilidad DALCO = Deambular, Agarrar (aprehensión), Localizar, COmunicar.</li></ul></div><h3 style="font-size:22px;margin:26px 0 8px">Tema 6. Orientación y movilidad</h3><h4 style="font-size:18px;margin:16px 0 4px">6.1. Las habilidades de orientación y movilidad</h4><p>Nos permiten orientarnos en el espacio y en el tiempo, desplazarnos con seguridad, alcanzar y manipular objetos y anticipar lo que va a pasar. Condicionan muchísimo que una persona haga las AVD de forma independiente.</p><ul><li><b>Componente sensorial:</b> detectar información sobre el espacio y el entorno (qué tengo al alcance, con quién estoy).</li><li><b>Componente cognitivo:</b> interpretar esa información y tomar conciencia de la posición en el espacio y el tiempo.</li><li><b>Componente físico:</b> hacer movimientos coordinados para cambiar de postura y trasladarse.</li><li>Lo sensorial y lo cognitivo se relacionan con la orientación; lo físico, con la movilidad.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">6.1.1. La orientación</h4><p>La orientación es el proceso cognitivo que permite establecer y actualizar la posición que se ocupa en el espacio y el tiempo gracias a la información sensorial.</p><ul><li><b>Orientación espacial:</b> ubicarse en términos absolutos («estoy en casa»), relativos («encima de»), respecto a una posición pasada («vengo de…») o de destino («voy a…»).</li><li><b>Conceptos que exige:</b> corporales (partes del cuerpo y sus movimientos), espaciales (cerca, lejos, derecha, izquierda; grande, pequeño) y ambientales (calzada, acera, semáforo; materiales; húmedo, móvil).</li><li><b>Tipos de espacio:</b> presente o tangible (el que alcanzan los sentidos; en videntes, el campo visual), abstracto (se representa mentalmente) y social (organizado y compartido con otras personas).</li><li><b>Orientación temporal:</b> reconocer el momento presente (hora, día, mes, estación), su relación con el pasado y el futuro, y las actividades del día según un horario.</li><li><b>Tiempo objetivo:</b> transcurre igual para todos y se mide con instrumentos. Tiempo subjetivo: el que percibe cada persona según su interés o motivación.</li><li><b>El tiempo es inmaterial, pero se objetiva con ritmos:</b> en personas dependientes, las rutinas diarias (sueño, comidas, aseo).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">6.1.2. La movilidad</h4><p>La movilidad es la capacidad de modificar la posición del cuerpo o de sus partes y de desplazarse en el entorno. El BVD la valora en tres bloques: cambiar y mantener la posición del cuerpo, desplazarse dentro del hogar y fuera de él.</p><ul><li><b>Movilización:</b> cambio de postura sin cambiar de superficie ni de lugar. Pasiva (la persona no puede hacerlo sola; el personal la realiza) o asistida (puede, pero con ayuda o supervisión).</li><li><b>Transferencia:</b> movilización en la que el cuerpo cambia de superficie de apoyo (de la cama a la silla de ruedas). Puede ser autónoma o asistida, con tabla de transferencia o disco giratorio.</li><li><b>Desplazamiento:</b> movimiento de un lugar a otro. Depende del espacio (conocido o no, barreras), del objetivo y de la distancia y complejidad del trayecto.</li><li><b>Niveles de ayuda en el desplazamiento:</b> traslado (necesita ayuda para deambular), guía y acompañamiento (casi autónomo, pequeños apoyos), movilidad interior autónoma (en casa o en el centro, ligada a las AVD) y movilidad exterior autónoma (ligada a las AVDI; depende de la proximidad y de si el entorno es conocido).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">6.1.3. Limitaciones de la orientación y la movilidad</h4><p>Pueden reducir mucho la autonomía. Las demencias también afectan a la orientación.</p><ul><li><b>Orígenes:</b> factores congénitos (parálisis cerebral, espina bífida, déficits visuales o auditivos), accidentes, enfermedades (esclerosis múltiple, Parkinson, ictus) y deterioro por la edad (artrosis).</li><li><b>Dificultades al interactuar con el medio:</b> de maniobra (acceder y moverse por los espacios), para salvar desniveles (bordillos, escaleras), de alcance (manual o visual; en silla de ruedas disminuye el campo de visión), de percepción, de orientación y de control corporal (equilibrio en miembros inferiores, manipulación en superiores).</li><li><b>Por colectivos (Doc. 6.1):</b> con andador o bastón, riesgo de caídas y trayectos cortos; en silla de ruedas, imposibilidad de superar escaleras y pasos estrechos; con discapacidad visual, dificultad para detectar obstáculos y leer señales; con discapacidad auditiva, no identificar timbres o alarmas; con discapacidad cognitiva, desorientación espacial y temporal.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">Barreras arquitectónicas</h4><p>Una barrera arquitectónica es cualquier elemento que dificulta o impide el acceso a un espacio o el desplazamiento por él. Afectan sobre todo a personas en silla de ruedas, pero también a quien lleva muletas, un carrito de la compra o un cochecito de bebé.</p><ul><li><b>Urbanísticas (BAU):</b> en espacios públicos: desniveles sin rampa, aceras estrechas, mobiliario urbano que estorba, pavimentos irregulares, bordillos.</li><li><b>En la edificación (BAE):</b> dentro de edificios: puertas difíciles, escaleras, pasos estrechos, mostradores altos, lavabos sin barras.</li><li><b>En el transporte (BAT):</b> autobuses sin rampa, mucha distancia entre andén y vagón, estaciones sin ascensor.</li><li><b>En la comunicación (BC):</b> semáforos sin sonido, ascensores sin braille, señales con letra pequeña o compleja.</li><li><b>El programa de entrenamiento sigue cuatro fases:</b> valoración, planificación, ejecución y evaluación.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">6.2. Valoración de las habilidades de orientación y movilidad</h4><p>La persona necesita capacidades físicas y cognitivas suficientes y buena predisposición. Se recoge información y se elabora un diagnóstico. Se necesitan control motor grueso (postura, marcha, equilibrio), fino (manipulación), capacidades cognitivas (comprensión espaciotemporal, memoria) y perceptivas.</p><ul><li><b>Orientación:</b> identificar dónde y cuándo está, proyectar acciones pasadas y futuras inmediatas, y ordenar y recordar elementos del espacio o ritmos de actividades.</li><li><b>Movilidad:</b> qué movimientos puede hacer (solo, con productos de apoyo o con ayuda), el esfuerzo que le suponen y el tiempo o ritmo que necesita.</li><li>Actitud y aptitud para aprender. Si son deficitarias, objetivos más modestos o un trabajo previo de preparación.</li><li><b>Instrumentos:</b> recopilación documental, entrevistas (componentes físico, psicológico y social), observación directa con tablas de registro y escalas estandarizadas de AVD (Cruz Roja, Katz, Barthel, Lawton y Brody, BVD). La orientación se evalúa con escalas cognitivas.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">6.3. Planificación del programa</h4><p>Se formulan objetivos según las necesidades detectadas; la mayoría de actividades combinan objetivos de ambas áreas. En movilidad exterior, también accesibilidad urbana y del transporte.</p><ul><li><b>Objetivos de movilidad:</b> transferencia silla-cama autónoma, prevenir úlceras por presión, favorecer la deambulación, manejar la silla de ruedas, mantener la funcionalidad.</li><li><b>Objetivos de orientación:</b> identificar puntos de referencia, interpretar la señalización, planificar recorridos, saber qué actividad toca en cada momento.</li><li><b>Técnicas de modificación de conducta:</b> instrucciones verbales, modelado, moldeado, encadenamiento, refuerzos, instigadores y retroalimentación; tareas para casa y seguimiento.</li><li><b>Técnicas de orientación:</b> conceptos espaciotemporales en situaciones cotidianas (arriba-abajo; ayer, hoy, mañana; la Navidad), aprendizaje de itinerarios, planificación de eventos y estimulación cognitiva (orientación a la realidad, reminiscencia).</li><li><b>Técnicas de movilidad:</b> movilización (personas inmovilizadas), transferencia y desplazamiento (autónomo, supervisado o con ayuda).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">6.3.3. Recursos para la orientación</h4><p>Instrumentos que facilitan la orientación y sirven para el entrenamiento y el seguimiento.</p><ul><li><b>Productos de apoyo para la orientación:</b> señalización acústica, visual y táctil (mapas táctiles, planos 3D, braille) y bastones guía.</li><li><b>Bastones para discapacidad visual (Doc. 6.5):</b> de aluminio con contera rodante. Blanco: ceguera. En España, rayas rojas y blancas: sordoceguera (la Federación Mundial usa rojas y negras). Verde: baja visión en algunos países como Argentina.</li><li><b>Tableros de orientación:</b> información básica estructurada (día, fecha, estación, lugar, tiempo que hace); se usan al inicio de las actividades.</li><li>Relojes y calendarios grandes, de lectura fácil y en lugares visibles.</li><li><b>Horarios con las actividades, la hora y el lugar:</b> imprescindibles en centros.</li><li><b>Agendas personales:</b> favorecen el autocontrol, la seguridad y la sensación de autonomía.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">6.3.3. Productos de apoyo a la movilidad</h4><p>Facilitan la movilidad de la persona y el trabajo de quien la atiende (clase 12 de la ISO).</p><ul><li><b>Bastones:</b> para quien conserva cierta estabilidad y equilibrio; empuñadura y longitud adecuadas y contera de caucho.</li><li><b>Muletas:</b> suplen la falta de una pierna o, de forma transitoria, cuando no se puede apoyar el pie.</li><li><b>Andadores con patas:</b> hay que levantarlos para avanzar, requieren fuerza.</li><li><b>Andadores rodantes:</b> piden menos fuerza pero son más inestables; para personas débiles con buen equilibrio.</li><li><b>Sillas de ruedas:</b> de tracción manual (aros o empujadas) o motorizadas. Se eligen según la capacidad de manejo, la complexión y las actividades; pueden necesitar arneses o cinchas.</li><li><b>Para transferencias y giros:</b> tablas de transferencia, sábanas deslizantes, discos de rotación, cinturones de transferencia, escalas de cuerda a los pies de la cama, rampas y plataformas.</li><li><b>Grúas:</b> móviles (las más versátiles) o fijas (pared, suelo o techo; de la cama al baño, sin cambiar de estancia). Requieren un arnés cómodo.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">6.3.4. El entorno y la reestructuración ambiental</h4><p>El entorno debe ser seguro, funcional y accesible, comprensible (señales perceptibles y bien situadas) y agradable (temperatura, luz, limpieza, decoración acogedora, separar espacios comunes y privados).</p><ul><li><b>Adaptar la unidad de convivencia:</b> pasamanos y barras, manillas mejor que pomos, persianas motorizadas, ascensores y salvaescaleras, pavimentos antideslizantes y suelos táctiles con itinerarios.</li><li><b>Reestructuración ambiental:</b> intervenciones en el entorno habitual de la persona para favorecer su autonomía; crucial con demencias o discapacidad intelectual.</li><li><b>Wayfinding (Doc. 6.6):</b> combinar flechas, pictogramas, colores, planos hápticos, texturas, braille y tecnología para que alguien entienda un espacio desconocido (aeropuertos, hospitales). Principios: identidad propia para cada espacio, rutas bien estructuradas, solo información relevante, simplificar las decisiones y textos simples con letra de palo seco.</li><li><b>Simbolización:</b> usar imágenes (pictogramas, dibujos, fotos) para identificar espacios, tareas, ubicación de objetos y acontecimientos (una tarta para un cumpleaños).</li><li><b>Señalización:</b> señales visuales (a la altura de la vista), acústicas (sin perturbar la tranquilidad) y táctiles o hápticas (braille, relieve, texturas). Indican itinerarios, accesos, riesgos, emergencias y localizaciones.</li><li><b>Cuidado con la hipersensibilidad sensorial (TEA) y el daltonismo:</b> usar tramas además de colores.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">6.4.1. Ejecución de actividades de orientación</h4><p>Se entrena con actividades formales (sistemáticas) e interacciones informales (indicaciones durante la actividad). Debe primar lo educativo sobre lo asistencial.</p><ul><li><b>Conceptos de situación:</b> al inicio de la sesión, decir el día, el momento, el mes, la estación, el lugar y el tiempo; recordar lo pasado y anticipar lo siguiente; al final, planificar el día o la semana.</li><li><b>Planificación de recorridos:</b> aprender puntos de referencia significativos (un árbol, una parada, una tienda) y las distancias entre ellos (en pasos, metros o tiempo).</li><li><b>Fases:</b> recorrer juntos el trayecto y elegir referencias (en plano o maqueta); repetir con el profesional primero como guía, luego como acompañante y por último como supervisor; y finalmente hacerlo solo.</li><li>Debe saber resolver problemas (pedir ayuda si se desorienta) e interpretar horarios del transporte.</li><li><b>Planificación de eventos:</b> los personales en agendas individuales; los colectivos (Navidad, fiestas) en almanaques y horarios.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">6.4.2. Movilizaciones</h4><p>No suponen cambiar de superficie. Pueden ser cambios posturales (prevenir úlceras, comodidad, hacer la cama) o pasos previos para otras actividades (subir hacia la cabecera, llevar al lado, sentar en el borde).</p><ul><li><b>Posiciones (Doc. 6.7):</b> decúbito supino (boca arriba), prono (boca abajo, cabeza de lado), lateral, Sims (lateral izquierdo con la pierna derecha flexionada), Fowler (semisentada a 45°) y Trendelenburg (supino con las piernas más altas que la cabeza).</li><li><b>Antes:</b> evaluar y planificar, explicar el procedimiento, pedir colaboración y tener los productos preparados.</li><li><b>Durante:</b> ergonomía e higiene postural, usar productos de apoyo o pedir ayuda, evitar caídas (barandillas), movimientos suaves sin tirones y respetar la intimidad.</li><li><b>Después:</b> dejarla en una posición segura y cómoda (almohadas, sin arrugas en la ropa de cama).</li><li><b>Mecánica corporal (Doc. 6.8):</b> cama a la altura de la cintura, pies separados para ampliar la base, acercarse a la persona, usar el cuerpo como contrapeso, flexionar las rodillas con la espalda recta y girar en bloque sin torcer el tronco. Siempre que se pueda, entre dos personas.</li><li><b>Supino a lateral:</b> llevarla al borde contrario, brazo y pierna alejados cruzados, brazo de giro separado, y girar sujetando hombro y cadera.</li><li><b>Hacia la cabecera:</b> si colabora, flexiona las piernas y se impulsa a la señal; si no colabora, dos profesionales la levantan por debajo de los hombros.</li><li><b>Desplazamiento lateral por segmentos:</b> cuello y espalda, cintura y piernas.</li><li><b>Sentar en el borde:</b> de lado, un brazo tras el hombro y otro bajo las corvas, levantar el tronco mientras se bajan las piernas.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">6.4.3. Transferencias</h4><p>Tienen más riesgo que las movilizaciones porque cambian de plano y de superficie. La silla de ruedas debe estar junto a la cama, frenada y con los reposapiés plegados.</p><ul><li><b>Persona autónoma:</b> silla al mismo nivel, retirar el reposabrazos, una mano en el reposabrazos y otra en la cama y desplazarse con un impulso (mejor con tabla de transferencia). Sirve también para pasar a otra silla o al coche.</li><li><b>Persona que colabora:</b> el profesional, de frente con las piernas separadas y flexionadas, le rodea la cintura (o usa cinturón), ella pone los brazos en sus hombros; a la señal la levanta en bloque, pivota y la sienta despacio.</li><li><b>Persona que no colabora:</b> dos profesionales, uno detrás sujetando los antebrazos por debajo de las axilas y otro delante por los muslos; a la señal la trasladan en bloque.</li><li><b>Enderezar a alguien sentado:</b> desde detrás de la silla, brazos bajo las axilas sujetando sus muñecas, tirar hacia arriba y hacia atrás.</li><li><b>Grúa:</b> colocar el arnés (cintas largas bajo los muslos y cortas bajo los hombros), anclar, izar suavemente, trasladar despacio vigilando el balanceo, descender y retirar el arnés.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">6.4.4. Deambulación</h4><p>Según la ayuda: con bastón, con andador, con ayuda de otra person
