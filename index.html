  ["1. Sensación: respuesta a los estímulos captados por los receptores. Exteroceptiva (del exterior, por los sentidos), propioceptiva (del propio cuerpo: postura, equilibrio) o visceroceptiva o interoceptiva (de los órganos internos: hambre, náuseas).","2. Selección: solo se atiende a una pequeña parte de los estímulos, según su naturaleza (intensidad, movimiento, novedad) y factores internos (necesidades, intereses).","3. Organización: se ordenan los estímulos para que tengan sentido (manchas que forman una figura).","4. Interpretación: se les da significado según la experiencia, los intereses y los prejuicios; por eso cambia a lo largo de la vida.","Características: selectiva, subjetiva, relativa (depende del contexto) y temporal.","Distorsiones perceptivas (Doc. 8.2): atención selectiva (solo lo que interesa), exposición selectiva (solo lo agradable) y defensa perceptiva (se suprime lo que amenaza las propias creencias).","La Gestalt (Doc. 8.1): «el todo es más que la suma de las partes». Ley de la pregnancia o buena forma: percibimos de la forma más sencilla posible. Principios: proximidad, semejanza, continuidad, simetría, cierre, movimiento común, memoria, jerarquización y contraste."]],
 ["La atención","Es la capacidad de focalizar la actividad mental en un objeto o acción concreta. Permite reaccionar a tiempo a los estímulos, discriminarlos, concentrarse y hacer varias cosas a la vez.",
  ["Según el propósito: voluntaria (intencionada) o involuntaria (se activa sola).","Según la actitud: sostenida (tiempo máximo de concentración sin errores), dividida (varias tareas a la vez) y selectiva (una sola fuente, descartando el resto).","Factores externos: intensidad del estímulo y previsibilidad (lo imprevisto atrae más).","Factores internos: estado físico (fatiga, sueño, hambre, frío) y psíquico (ánimo, interés, motivación)."]],
 ["La memoria","Es la capacidad de codificar, almacenar y recuperar la información procedente de un aprendizaje o una experiencia. Todo aprendizaje implica retención. No es perfecta: puede crear falsos recuerdos, más frecuentes con la edad.",
  ["Adquisición: entrada por los sentidos, filtrada por la atención y la percepción.","Memoria inmediata o sensorial (SIS): mucha información, milisegundos.","Memoria a corto plazo (STM): capacidad limitada, algunos segundos.","Memoria a largo plazo (LTM): horas, días o años. Episódica (hechos y experiencias personales), semántica (conocimiento del mundo y lenguaje) y procedimental (habilidades que se hacen casi sin pensar).","Recuperación por reconocimiento (identificar algo presente: examen tipo test) o por evocación (recordar algo ausente: examen de desarrollo).","Mecanismos de olvido (Doc. 8.3): desvanecimiento (con el tiempo, sin refuerzo), desplazamiento (lo nuevo ocupa el lugar), interferencia (información parecida lo desvirtúa) y represión (la mente bloquea recuerdos traumáticos)."]],
 ["El pensamiento y el lenguaje","Son las funciones superiores, que se asientan sobre las básicas.",
  ["Pensamiento: capacidad de procesar y ordenar ideas y conceptos y generar conclusiones. Implica razonamiento (analizar y extraer conclusiones por deducción o inducción) y creatividad (crear ideas nuevas).","Guilford (Doc. 8.4): pensamiento convergente (razonamiento lógico, soluciones convencionales) y divergente (creatividad, soluciones originales). Se combinan en la innovación.","Lenguaje: código simbólico y estructurado de signos que hace posible la comunicación y organiza el pensamiento.","Función comunicativa (expresar y entenderse) y función simbólica (asociar significante y significado). Integra todas las funciones cognitivas."]],
 ["8.1.2. El estado de ánimo","Es una tendencia emocional de larga duración que impregna los sentimientos, pensamientos y comportamientos de la persona. Sus oscilaciones son normales (eutimia) si no interfieren en la vida diaria; son patológicas si causan interferencias o malestar notable.",
  ["Trastornos del estado de ánimo: perturbaciones persistentes que interfieren en la vida; de tipo depresivo (desinterés, falta de placer) o maníaco (irritabilidad, expansividad).","Distimia: ánimo bajo, pérdida de interés y placer, irritabilidad, pesimismo, baja autoestima.","Depresión mayor: lo anterior más pérdida de energía, alteraciones del sueño e ideas de muerte o suicidio; hay alteración de los neurotransmisores y requiere tratamiento médico.","Hipertimia: ánimo expansivo y exaltado, con exceso de actividad y euforia.","Trastorno bipolar (antes psicosis maniacodepresiva): cambios repentinos entre periodos eufóricos y depresivos, sin causa externa."]],
 ["8.1.3. La personalidad y la autoestima","La personalidad es el conjunto de características emocionales, de pensamiento y de conducta que definen globalmente a una persona; es relativamente estable. Se debe al temperamento (heredado) y al carácter (adquirido).",
  ["Rasgos en pares opuestos: extraversión/introversión, egocentrismo/alocentrismo, emotividad/frialdad, constancia/inconstancia, actividad/inactividad, dominio/sumisión e impulsividad/serenidad.","Si un rasgo es extremo o rígido puede aparecer un trastorno de personalidad: patrones muy rígidos e inadaptados que perturban la vida personal, laboral y social; difíciles de tratar.","DSM (Doc. 8.6), 10 trastornos en 3 grupos: A, raros o excéntricos (paranoide, esquizoide, esquizotípico); B, dramáticos o emocionales (antisocial, histriónico, narcisista, límite); C, ansiosos o temerosos (evitativo, dependiente, obsesivo-compulsivo).","Autoconcepto: percepción que una persona tiene de sí misma. Autoestima: el valor que da a esa percepción. Alta si se ajusta o supera la realidad; baja si se minimizan las cualidades.","Tipos (Doc. 8.7): baja estable (indecisión), baja inestable (muy vulnerable a comentarios), alta estable (seguridad), alta inestable (baja tolerancia al fracaso) e inflada (prepotencia)."]],
 ["8.2.1. Disfunción cognitiva","Es una alteración en alguna función que limita la competencia cognitiva. Puede deberse a un déficit cerebral o a una disonancia.",
  ["Por déficit: congénita (discapacidad intelectual), pérdida por afectación cerebral adquirida (tumor, traumatismo, ictus) o deterioro (demencias como Alzheimer o Parkinson: memoria, atención y orientación).","Agnosia (Doc. 8.8): no poder reconocer estímulos conocidos sin fallo de memoria ni de los sentidos. Tipos: prosopagnosia (rostros), auditiva, amusia (música), cromática (colores), táctil y simultagnosia (un solo objeto a la vez).","Por disonancia: desajuste entre cogniciones (realidad y lo que se cree o desea) que genera ansiedad. Se resuelve adaptándose a la realidad (requiere personalidad flexible), con mecanismos de defensa o con distorsiones cognitivas.","Mecanismos de defensa: procesos inconscientes que protegen de la ansiedad sin tocar sus causas: negación, proyección (atribuir a otros lo propio), regresión (volver a conductas antiguas), racionalización (inventar explicaciones) y distorsión (devaluación o idealización)."]],
 ["Distorsiones cognitivas","Una distorsión cognitiva es una interpretación errónea de la realidad por pensamientos, percepciones o creencias irracionales. Pensar racionalmente no es lo mismo que pensar en positivo: es valorar las evidencias.",
  ["Inferencia arbitraria: dar algo por hecho sin pruebas. Incluye la adivinación del pensamiento (creer que se ríen de ti) y la del futuro (no ir a la entrevista porque «seguro que no me cogen»; si es lo peor, catastrofismo).","Abstracción selectiva o filtraje: fijarse solo en el detalle negativo.","Sobregeneralización: de un caso aislado sacar una regla general («ninguna empresa me contratará jamás»).","Magnificación y minimización: exagerar o quitar importancia a los hechos.","Personalización: atribuirse sin pruebas lo que pasa fuera («me ha dejado por mi culpa»).","Pensamiento dicotómico o polarizado: todo o nada, sin matices.","Descalificación de lo positivo: buscar siempre la lectura negativa (te llaman al despacho y piensas que te despiden)."]],
 ["8.2.2. Características cognitivas por colectivos","Cualquiera puede tener dificultades cognitivas, pero en algunos colectivos son más frecuentes.",
  ["Discapacidad sensorial o motora: no implica limitación cognitiva, pero la falta de experiencias puede condicionarla; cuanto más temprana y severa, más repercusión. Si la causa es general (parálisis cerebral, esclerosis múltiple), puede afectar a lo cognitivo.","Discapacidad intelectual: atención dispersa y centrada en lo poco relevante, lenguaje pobre en todas sus áreas, déficit de abstracción (imaginación, planificación) y dificultad para imitar, secuenciar, comprender reglas y generalizar.","Personas mayores: más limitaciones perceptivas, pérdida paulatina de memoria, desorientación, menos agilidad mental, dificultades con estrategias abstractas y afectación del lenguaje; se acentúan rasgos de personalidad y la inflexibilidad.","Demencias: 1) pérdida de memoria (hasta la agnosia), 2) dificultad en las AVD, 3) desorientación espaciotemporal, 4) pérdida del lenguaje.","Trastornos mentales: alucinaciones, distracción, pensamiento desorganizado o delirante y lenguaje pobre.","Estados depresivos: menos atención, fallos de memoria a corto plazo, lentitud, dificultad de expresión, apatía y pobreza afectiva."]],
 ["8.2.3. La intervención en las funciones cognitivas","Las funciones cognitivas se pueden mejorar con práctica y entrenamiento. Primero hay que valorar bien la capacidad cognitiva y el estado de ánimo. La intervención cognitiva no se trata aislada de lo psicosocial, lo conductual o el ambiente.",
  ["Pasos: formular objetivos (mantener, rehabilitar, estimular la memoria, mejorar la atención), marco temporal, contenidos, técnicas y planificación de cada sesión, grupal e individual.","Programas de psicoestimulación (Doc. 8.9): combinan actividades grupales e individuales. PPI (1991, integral, equipo interdisciplinar ocho horas diarias), PPP (2006, preventivo y lúdico para mayores institucionalizados) y PACID (2011, del Centro de Referencia Estatal de Alzheimer, para demencias, busca la neuroplasticidad)."]],
 ["8.3. Valoración de la capacidad cognitiva","Se valoran el déficit cognitivo y el estado de ánimo, con entrevista, observación y sobre todo escalas estandarizadas.",
  ["Test de Pfeiffer (SPMSQ): 10 preguntas (fecha, día, lugar, teléfono, edad, nacimiento, presidente actual y anterior, apellido de la madre, restar de 3 en 3 desde 20). Errores: 0-2 normal, 3-4 leve, 5-7 moderado, 8-10 severo; un error más con estudios bajos y uno menos con estudios altos.","Escala de incapacidad psíquica de la Cruz Roja: niveles de 0 (normal) a 5 (vida vegetativa); muy rápida, típica en geriatría.","Miniexamen cognoscitivo de Lobo (MEC): adaptación española del MMSE de Folstein. Cinco áreas: orientación, fijación, concentración y cálculo, memoria diferida, y lenguaje y construcción. Sobre 35: 31-35 normal; 0-14 grave. Punto de corte de demencia: 0-23 en mayores de 65 años. Limitado con bajo nivel cultural o déficit sensorial.","Escala de depresión de Hamilton: 17 ítems; 0-7 sin depresión, 23 o más muy severa.","Escala de depresión geriátrica de Yesavage: respuestas sí/no sobre la última semana; versiones de 30, 15 y 5 preguntas. EDG-15: 0-4 normal, 10 o más depresión establecida.","Inventario de depresión de Beck (BDI): autoaplicado, 21 apartados sobre las últimas dos semanas; 0-13 mínima, 29-63 grave.","Inventario de ansiedad de Beck (BAI): 21 síntomas de la última semana; 0-7 mínima, 26-63 grave.","Autorregistros: la persona anota pensamientos amenazadores, cuándo y dónde aparecen y el malestar que le causan."]],
 ["8.4.1. Técnicas de estimulación cognitiva","Procedimiento para mantener en buen estado o perfeccionar las funciones cognitivas. Sirven para prevenir el deterioro, estimular las funciones con retraso y rehabilitar las perdidas. Se basan en la plasticidad cerebral (Doc. 8.19): el cerebro crea conexiones, forma neuronas nuevas (neurogénesis) y reorganiza redes.",
  ["Rehabilitación por restauración (ejercitar lo afectado si se puede recuperar), compensación (apoyos externos: agendas, calendarios) o sustitución u optimización (usar otras reservas: entrenar oído y tacto si se pierde la vista).","Tipos de terapias: generales o integrales, de orientación a la realidad, de capacidades específicas (memoria, atención, lenguaje) y motivacionales y emocionales (reminiscencia, grupos de buenos días, Montessori).","Pautas: llamarla por su nombre y mirarla, hablar de frente y claro, mantener la calma ante una agresión, ayudarla a orientarse con pistas e imágenes, darle tiempo (no acabar sus frases), entorno sin ruido ni tele, reforzar logros y evitar el estrés."]],
 ["Orientación a la realidad y entrenamiento de la memoria","Dos de las técnicas más usadas.",
  ["Terapia de orientación a la realidad: mantener la comprensión del entorno con información espacial, temporal y personal estructurada (colores por habitaciones, líneas en el suelo, pictogramas, calendarios, tableros).","En sesiones programadas: grupos de hasta 8 personas con nivel parecido, una hora diaria, mismo lugar y hora. Saludo, presentación, orientación temporal y espacial, comentar un suceso, actividades cognitivas y cierre.","Las 24 horas: informal y continua; profesionales y familia recuerdan los datos de orientación en cada interacción y le preguntan qué hace, con quién, qué día es.","Entrenamiento de la memoria: técnicas estructuradas para mantenerla o ralentizar su pérdida, en talleres. Estimula también atención y percepción (pasatiempos, reconocer objetos por el tacto, discriminar olores).","Memoria inmediata (recordar lo que se está haciendo, nombres), a corto plazo (repasar al final de la sesión) y a largo plazo (evocar el pasado, con pistas y asociaciones).","Estrategias: visualización (imagen mental), asociación (con algo familiar), categorización (lista de la compra por grupos) y repetición verbalizada.","Ayudas para la memoria: agendas, calendarios visibles, libreta, papel junto al teléfono, mirar el reloj, listas, dejar llaves y gafas siempre en el mismo sitio y notas para no olvidar el gas."]],
 ["Atención, lenguaje, razonamiento y terapias emocionales","Más técnicas de estimulación cognitiva.",
  ["Atención: juegos de mesa, pasatiempos, prensa, manualidades; lugar adecuado, rutinas, descanso, variar metodología, tono de voz y recursos audiovisuales.","Lenguaje: lectura, conversación, crucigramas, ordenar frases, sinónimos y antónimos, completar refranes y canciones; a veces logopedia o sistemas aumentativos o alternativos de comunicación.","Razonamiento: clasificación, seriación, observación (rompecabezas, tangram), análisis y deducción (acertijos, incoherencias) y cálculo (también en compras o juegos).","Reminiscencia: estimular el recuerdo de la propia vida con objetos o estímulos significativos, porque la memoria remota es la última en deteriorarse. Estímulos gráficos, auditivos, objetos, olores o sabores. Mejora también el autoconcepto y la autoestima; evitar recuerdos dolorosos y que nadie se burle.","Recursos de reminiscencia (Doc. 8.21): caja de recuerdos, libro autobiográfico o historia de vida y línea del tiempo.","Grupos de buenos días: personas sin deterioro y algunas con demencia leve o moderada; saludo, orientación y debate de titulares de prensa. Estimulan, refuerzan la autoestima y las habilidades sociales.","Terapia Montessori: adaptada a mayores con deterioro. Actividades autodirigidas sin corregir desde fuera, materiales familiares (lana, pinzas, botones), respeto a la persona, estimulación cognitiva, sensorial y social, y planificación centrada en la persona según la fase (leve: mantener independencia; moderado-grave: AVD básicas; severo: estimular los cinco sentidos)."]],
 ["8.4.2. Técnicas cognitivas","Una técnica cognitiva es una herramienta que facilita adquirir habilidades para modificar la conducta mediante la intervención psicológica. No eliminan los pensamientos irracionales, sino que cambian la respuesta y la importancia que se les da. Secuencia: localizar el problema, analizarlo objetivamente y sustituirlo por pensamientos racionales.",
  ["Reestructuración cognitiva: identificar distorsiones y sustituirlas por pensamientos racionales; requiere meses.","Terapia cognitiva de Beck (1967, depresión): fase I, observar y registrar los pensamientos desadaptados; fase II, generar pensamientos alternativos; fase III, modificar los esquemas comparando unos y otros.","Afrontamiento: estrategias para controlar situaciones de mucho estrés. La más usada es la inoculación del estrés (Meichenbaum y Cameron, 1972).","Inoculación del estrés: fase educativa (componentes cognitivo, fisiológico y motor del estrés), fase de adquisición de habilidades y ensayo (relajación, jerarquía de unas 10 situaciones de 10 a 100 puntos, vivenciarlas en imaginación de menor a mayor y pensamientos para afrontar en 4 etapas: preparación, confrontación, activación emocional y refuerzo del éxito) y fase de aplicación.","Resolución de problemas (D'Zurilla y Goldfried, 1971): I orientación al problema (es normal tenerlos), II definición y formulación (quién, qué, dónde, cuándo, cómo y por qué, y la respuesta habitual), III generación de alternativas (lluvia de ideas), IV toma de decisiones (pros y contras) y V puesta en práctica y evaluación (si no funciona, volver a la IV).","Ejemplo (Doc. 8.26): Lola, 71 años, se siente apartada en su coral; descubre que el problema real es tomárselo como algo personal y elige colaborar, contar hasta diez y apoyar las propuestas de otros."]],
 ["8.4.3. Otras técnicas","Ayudan a mantener la funcionalidad cerebral, mejorar el ánimo y el estado físico.",
  ["Psicomotricidad: trabaja esquema corporal, coordinación (fina: precisión con manos y dedos; gruesa: movimientos amplios), control postural y equilibrio, lateralidad, control respiratorio y estructuración espaciotemporal (ritmos).","Técnica de relajación: procedimiento para controlar la propia activación fisiológica; aumenta el autocontrol y ayuda contra la ansiedad, el estrés, el pánico o las fobias.","Respiración profunda o diafragmática: tumbado, una mano en el abdomen y otra en el tórax, inspirar por la nariz llevando el aire al abdomen y espirar por la boca, 5-10 minutos.","Relajación progresiva: tensar unos 10 segundos y relajar grupos musculares en orden (manos, brazos, hombros, cabeza, pecho, abdomen, cintura, glúteos, muslos, piernas y pies), en sesiones de una hora.","Mindfulness o atención plena: práctica mental de autoconocimiento y autoaceptación; atención en el aquí y ahora sin juzgar. Mejora el afrontamiento, la salud, la memoria, la atención y el autocontrol.","Musicoterapia: actividades musicales estructuradas para mejorar lo físico, cognitivo y anímico. Clínica (hospital, psicosis, autismo) o preventiva y comunitaria. Muchas personas con demencia conservan el ritmo y las canciones."]],
 ["8.5. Evaluación de la intervención","Sigue los mismos principios que las demás unidades.",
  ["Se valoran el proceso (actividades, recursos, participación), la progresión (situación inicial frente a final), los resultados (objetivos logrados), la satisfacción de la persona y el desempeño profesional.","Perspectiva informal: observación en situaciones cotidianas, con diarios y anecdotarios.","Perspectiva formal: escalas de estimación o listas de control con indicadores (p. ej., en reminiscencia: recuerda la imagen, la describe, narra hechos asociados, se emociona placenteramente).","Para la progresión se repite la misma escala cada cierto tiempo (por ejemplo, cada mes).","El equipo hace un informe y propone continuar, modificar o sustituir el programa."]]
],
trucos:["Percepción en 4 pasos «SSOI»: Sensación, Selección, Organización, Interpretación.","Memoria a largo plazo: Episódica = mi «Episodio» de vida; Semántica = «Significados»; Procedimental = «Procedimientos» como montar en bici.","Pfeiffer cuenta ERRORES (más es peor); el MEC de Lobo cuenta ACIERTOS (más es mejor).","Resolución de problemas «O-D-G-T-P»: Orientarse, Definir, Generar alternativas, Tomar la decisión y Probar."],
cards:[
 ["Funciones cognitivas","Capacidades para adquirir, procesar, almacenar, transformar y recuperar la información del entorno."],
 ["Funciones cognitivas básicas vs. superiores","Básicas: percepción, atención, memoria y orientación. Superiores: pensamiento y lenguaje."],
 ["Percepción","Proceso mental que recibe información por los sentidos, la interpreta y la elabora."],
 ["4 fases de la percepción","Sensación, selección, organización e interpretación."],
 ["Sensación propioceptiva","Informa de la posición del propio cuerpo, la postura y el equilibrio."],
 ["Sensación interoceptiva","Procede de los órganos internos: hambre, sed, náuseas."],
 ["4 características de la percepción","Selectiva, subjetiva, relativa y temporal."],
 ["Gestalt","Corriente centrada en la percepción: «el todo es más que la suma de las partes»."],
 ["Ley de la pregnancia","Tendemos a percibir las imágenes de la forma más sencilla y estable posible."],
 ["Atención sostenida, dividida y selectiva","Sostenida: concentración prolongada. Dividida: varias tareas a la vez. Selectiva: una sola fuente."],
 ["Memoria","Capacidad de codificar, almacenar y recuperar información de un aprendizaje o experiencia."],
 ["3 tipos de memoria a largo plazo","Episódica, semántica y procedimental."],
 ["Reconocimiento vs. evocación","Reconocimiento: identificar algo presente. Evocación: recordar algo ausente."],
 ["4 mecanismos de olvido","Desvanecimiento, desplazamiento, interferencia y represión."],
 ["Pensamiento convergente vs. divergente","Convergente: lógico, soluciones convencionales. Divergente: creativo, soluciones originales (Guilford)."],
 ["2 funciones del lenguaje","Comunicativa y simbólica."],
 ["Estado de ánimo","Tendencia emocional de larga duración que impregna sentimientos, pensamientos y conductas."],
 ["Eutimia","Oscilaciones normales del ánimo que no interfieren en la vida diaria."],
 ["Trastorno bipolar","Cambios repentinos entre periodos eufóricos y depresivos sin causa externa."],
 ["Personalidad","Conjunto de características emocionales, de pensamiento y de conducta que definen a una persona."],
 ["Temperamento vs. carácter","Temperamento: heredado. Carácter: adquirido a lo largo de la vida."],
 ["3 grupos de trastornos de personalidad (DSM)","A: raros o excéntricos. B: dramáticos o emocionales. C: ansiosos o temerosos."],
 ["Autoconcepto vs. autoestima","Autoconcepto: cómo me percibo. Autoestima: el valor que doy a esa percepción."],
 ["Disfunción cognitiva","Alteración en alguna función que limita la competencia cognitiva."],
 ["Agnosia","No reconocer estímulos ya conocidos sin fallo de memoria ni de los sentidos."],
 ["Prosopagnosia","Agnosia de los rostros, incluso de familiares."],
 ["Mecanismo de defensa","Proceso inconsciente que protege de la ansiedad sin actuar sobre sus causas."],
 ["Proyección","Atribuir a los demás sentimientos propios para culpabilizarlos."],
 ["Distorsión cognitiva","Interpretación errónea de la realidad por pensamientos o creencias irracionales."],
 ["Sobregeneralización","Sacar una conclusión general de un solo caso aislado."],
 ["Pensamiento dicotómico","Pensar en todo o nada, blanco o negro, sin matices."],
 ["Progresión de la demencia","Pérdida de memoria, dificultad en las AVD, desorientación y pérdida del lenguaje."],
 ["Test de Pfeiffer","10 preguntas; cuenta errores: 0-2 normal, 8-10 deterioro severo."],
 ["MEC de Lobo","Adaptación española del MMSE; 5 áreas, sobre 35 puntos. Demencia en mayores de 65: 0-23."],
 ["Escala de Yesavage","Escala de depresión geriátrica con respuestas sí/no; versiones de 30, 15 y 5 preguntas."],
 ["BDI y BAI","Inventarios de Beck de depresión (BDI) y de ansiedad (BAI), de 21 apartados cada uno."],
 ["Plasticidad cerebral","Capacidad del cerebro de modificar su estructura y funcionamiento para adaptarse o compensar daños."],
 ["3 estrategias de rehabilitación cognitiva","Restauración, compensación y sustitución u optimización."],
 ["Terapia de orientación a la realidad","Mantener la comprensión del entorno con información espacial, temporal y personal estructurada."],
 ["Orientación a la realidad: sesiones vs. 24 horas","Sesiones: grupos de hasta 8, una hora diaria. 24 horas: informal y continua, en cada interacción."],
 ["4 estrategias de memoria","Visualización, asociación, categorización y repetición."],
 ["Reminiscencia","Estimular el recuerdo de la propia vida con objetos significativos; la memoria remota es la última en perderse."],
 ["Grupos de buenos días","Personas sin deterioro y otras con demencia leve que comentan titulares de prensa."],
 ["Técnica cognitiva","Herramienta para modificar la conducta cambiando la respuesta a los pensamientos irracionales."],
 ["3 fases de la terapia de Beck","Registrar pensamientos desadaptados, generar alternativos y modificar los esquemas."],
 ["Inoculación del estrés","Meichenbaum y Cameron (1972): fase educativa, de adquisición de habilidades y ensayo y de aplicación."],
 ["5 fases de la resolución de problemas","Orientación, definición, generación de alternativas, toma de decisiones y puesta en práctica."],
 ["Relajación progresiva","Tensar y relajar grupos musculares en orden para controlar la tensión."],
 ["Mindfulness","Atención plena al aquí y ahora, aceptándolo sin juzgar."],
 ["Musicoterapia","Actividades musicales estructuradas para mejorar lo físico, cognitivo y anímico."]
],
quiz:[
 ["¿Cuál es una función cognitiva superior?",["El lenguaje","La atención","La percepción","La memoria"],"Las superiores son el pensamiento y el lenguaje."],
 ["El hambre o las náuseas son sensaciones…",["Interoceptivas o visceroceptivas","Exteroceptivas","Propioceptivas","Auditivas"],"Proceden de los órganos internos."],
 ["Ver solo lo agradable e ignorar lo desagradable es la distorsión perceptiva de…",["Exposición selectiva","Defensa perceptiva","Pregnancia","Interferencia"],"La defensa perceptiva suprime lo que amenaza las propias creencias."],
 ["Recordar cómo montar en bici es memoria…",["Procedimental","Episódica","Semántica","Sensorial"],"Son habilidades que se hacen casi sin pensar."],
 ["En un examen tipo test se recupera la información por…",["Reconocimiento","Evocación","Represión","Desplazamiento"],"Basta con identificar la respuesta correcta entre las opciones."],
 ["Cambios bruscos entre euforia y depresión sin causa externa definen…",["El trastorno bipolar","La distimia","La hipertimia","La eutimia"],"Antes se llamaba psicosis maniacodepresiva."],
 ["No reconocer la cara de un hijo sin problemas de vista ni de memoria es…",["Prosopagnosia","Amusia","Simultagnosia","Agnosia cromática"],"Es la agnosia de los rostros."],
 ["Culpar a otros de sentimientos que son tuyos es el mecanismo de…",["Proyección","Regresión","Negación","Racionalización"],"Se atribuye a los demás lo propio."],
 ["«Me han rechazado en una entrevista, nunca me contratará nadie» es…",["Sobregeneralización","Personalización","Pensamiento dicotómico","Filtraje"],"Se saca una regla general de un caso aislado."],
 ["En el test de Pfeiffer, 6 errores indican deterioro…",["Moderado","Leve","Severo","Normal"],"5-7 errores: moderado."],
 ["¿Qué escala es la adaptación española del MMSE de Folstein?",["El miniexamen cognoscitivo de Lobo","El test de Pfeiffer","La escala de Hamilton","El inventario de Beck"],"Valora cinco áreas cognitivas sobre 35 puntos."],
 ["¿Qué escala de depresión está pensada para personas mayores?",["Yesavage","Hamilton","BAI","EMES"],"Es la escala de depresión geriátrica, con respuestas sí/no."],
 ["Usar una agenda porque la memoria no se puede recuperar es rehabilitación por…",["Compensación","Restauración","Sustitución","Represión"],"Se usan apoyos externos para la función perdida."],
 ["La orientación a la realidad en sesiones programadas se hace con grupos de…",["Hasta 8 personas","Más de 20 personas","Una sola persona siempre","Toda la residencia"],"Con nivel cognitivo similar, una hora diaria en el mismo lugar."],
 ["La reminiscencia funciona porque…",["La memoria remota es la última en deteriorarse","Se olvida primero lo antiguo","Solo usa la memoria inmediata","Elimina los recuerdos dolorosos"],"Por eso se evocan sucesos significativos del pasado."],
 ["¿Quién creó la terapia cognitiva para la depresión en 1967?",["Aaron Beck","Donald Meichenbaum","Thomas D'Zurilla","Maria Montessori"],"Registra pensamientos desadaptados y los sustituye por alternativos."],
 ["La inoculación del estrés de Meichenbaum y Cameron tiene las fases…",["Educativa, adquisición de habilidades y ensayo, y aplicación","Sensación, selección y organización","Orientación, definición y decisión","Registro, alternativas y esquemas"],"Incluye relajación y jerarquía de situaciones estresantes."],
 ["Si la solución elegida no funciona en la resolución de problemas, hay que…",["Volver a la fase de toma de decisiones","Abandonar la técnica","Empezar por la relajación","Aplicar un castigo"],"Se eligen otras alternativas de la fase IV."]
]

U("convivencia", {
n:2, title:"Organización de la intervención en la unidad de convivencia",
secs:[
 ["Qué vas a encontrar en esta unidad","Continúa la Unidad 1 (RA1: qué es la unidad de convivencia, sus tipos y recursos). Ahora (RA2) se aprende a organizar la intervención a partir de un análisis riguroso de sus necesidades: por un lado, los factores y niveles que explican su grado de autonomía; por otro, las técnicas para valorar sus necesidades en los ámbitos doméstico, personal y relacional y diseñar la respuesta (formativa, organizativa y estratégica) más adecuada.",[]],
 ["1. Factores de la autonomía","La autonomía de una unidad de convivencia es su capacidad para identificar sus propias necesidades, tomar decisiones sobre ellas y desarrollar, con sus propios medios o con el apoyo puntual que precise, las tareas necesarias para resolverlas. No es innata ni fija: se adquiere, se entrena y puede debilitarse o fortalecerse según factores internos (competencias de cada miembro) y externos (contexto social, económico y relacional).",[]],
 ["1.1. Factores internos: las habilidades parentales","Son el factor interno más determinante: la capacidad de la madre, el padre u otra persona responsable para atender las necesidades evolutivas y educativas de sus hijos e hijas y organizar el día a día del hogar. Su ausencia o déficit suele ser el origen del problema que motiva la intervención. Valorarlas es una de las primeras actuaciones de los servicios sociales especializados, porque orienta el diagnóstico y el plan de mejora.",
  ["Personales: capacidad cognitiva y emocional para desempeñar funciones (autoestima, autoconcepto, control de los impulsos).","De atención y cuidado: cuidado físico, psicológico y emocional de los demás miembros (seguridad, bienestar, relación afectiva, refuerzo del vínculo).","Educativas: socialización y escolarización de los hijos (apoyo al aprendizaje, fomento de la motivación, modelos positivos).","Sociales: capacidades comunicativas y relaciones sociales y de convivencia (habilidades comunicativas, resolución de conflictos).","De organización doméstica: desenvolverse en la vivienda de forma funcional e independiente (preparar comidas, compras, higiene y control de la salud del hogar)."]],
 ["1.2. Factores externos","Están fuera de la unidad de convivencia, que tiene poco control sobre ellos, pero condicionan mucho su margen real de maniobra. Por eso la intervención trabaja en dos direcciones a la vez: reforzar las competencias internas (formación, acompañamiento, capacitación) y facilitar el acceso a recursos externos que compensen lo que la familia no puede resolver sola.",
  ["Recursos económicos: la estabilidad laboral y los ingresos determinan si puede cubrir sus necesidades básicas sin ayudas.","Vivienda y entorno: espacio suficiente, salubridad y accesibilidad son la base material de la autonomía doméstica.","Nivel educativo y cultural: influye en acceder a información, hacer trámites y decidir con conocimiento.","Red de apoyo social: familia extensa, vecindario y amistades amplían los recursos y reducen la dependencia de los servicios sociales.","Oferta de recursos del entorno: que existan o no programas en la zona condiciona qué apoyos están realmente a su alcance."]],
 ["2. Niveles de autonomía","No todas las unidades necesitan el mismo apoyo. Determinar el nivel es imprescindible para dimensionar la intervención: demasiado apoyo genera dependencia y cronifica el problema; demasiado poco deja necesidades sin cubrir. Los cuatro niveles son un continuo, no categorías cerradas, y se revisan durante toda la intervención: el objetivo siempre es acompañar a la familia hacia un nivel de autonomía superior. Para situarla se combina la puntuación del Apgar familiar con el resto de técnicas de valoración.",
  ["1. Autonomía plena: identifica sus necesidades, decide y tiene recursos para resolverlas sin apoyo externo. Intervención: ninguna, o solo información y orientación puntual.","2. Autonomía con apoyos puntuales: gestiona su día a día con normalidad, pero necesita ayuda concreta y temporal ante una dificultad específica (un trámite, una crisis, una carencia en un área). Intervención de baja intensidad, focalizada y corta.","3. Autonomía con apoyo continuado: carencias más estructurales en lo doméstico, personal o relacional; necesita supervisión y acompañamiento sostenidos. Intervención: plan de mejora con seguimiento periódico y trabajo en varias áreas.","4. Dependencia o necesidad de sustitución: ahora no puede hacerse cargo de sus responsabilidades básicas ni decidir con garantías (p. ej., si está en juego la seguridad de un menor). Puede requerir que otra instancia administrativa o judicial asuma temporalmente esa función. Intervención de alta intensidad, a menudo protectora o de control."]],
 ["3. Necesidades en el ámbito doméstico, personal y relacional","Antes de intervenir hay que identificar con precisión qué necesita la unidad de convivencia, recogiendo y analizando información de forma sistemática con técnicas de valoración generales o específicas.",
  ["Doméstico: el funcionamiento material del hogar (vivienda y sus condiciones, economía doméstica, organización de tareas y rutinas, alimentación, higiene del hogar).","Personal: el desarrollo y bienestar de cada miembro (salud física y emocional, autoestima, hábitos de vida, competencias individuales, autonomía funcional).","Relacional: la calidad de las relaciones dentro y fuera de la unidad (comunicación entre miembros, estilo educativo, red de apoyo social, relación con la familia extensa y el entorno)."]],
 ["3.1. Técnicas generales de valoración","Sirven para cualquier ámbito.",
  ["Entrevista: requiere gran experiencia y destreza; el profesional debe mostrar sensibilidad y recoger la información sin dar consejos ni emitir juicios de valor.","Cuestionario: preguntas estructuradas, cerradas o abiertas, que recogen información de forma sistemática y comparable entre casos.","Observación: registro directo del comportamiento y las interacciones en su contexto habitual; aporta lo que la entrevista no capta.","Recopilación documental: consultar informes, expedientes e historiales previos de otros servicios o profesionales."]],
 ["3.2. El genograma: personas y estado vital","Las técnicas específicas representan de forma gráfica y sistemática la estructura, las relaciones y el entorno de la familia: genograma, Apgar familiar, mapa familiar, ecomapa y diagrama de redes sociales. El genograma representa, como un árbol familiar, la composición de la unidad de convivencia y las relaciones entre sus miembros a lo largo de varias generaciones, con una simbología convencional. Todas las figuras se dibujan del mismo tamaño.",
  ["Hombre: cuadrado. Mujer: círculo.","Hombre trans: cuadrado con un círculo pequeño dentro. Mujer trans: círculo con un cuadrado pequeño dentro.","No binario: arco (parte superior redondeada, base plana). Intersexual: círculo con una línea vertical.","Desconocido: rombo. Otro: rombo con signo de interrogación. Mascota: rombo punteado unido a su dueño con línea punteada.","Cada figura puede llevar nombre, fechas, ocupación, educación y notas.","Vivo: solo la figura. Fallecido: X sobre la figura (si se pone la edad al morir dentro, la X pasa a marcas en las esquinas).","Persona índice (la principal): anillo o contorno doble alrededor.","Embarazo: triángulo. Aborto espontáneo: círculo pequeño relleno. Aborto: X pequeña. Mortinato: figura a medio tamaño con una X.","Gemelos mellizos: dos líneas de hijo desde un mismo punto. Gemelos idénticos: lo mismo, unidos por una barra corta.","Conviene preguntar directamente por las pérdidas gestacionales: suelen omitirse y marcan a una familia durante años."]],
 ["El genograma: líneas de pareja y de hijos","La pareja se une con una línea debajo de sus figuras; las parejas anteriores, a la izquierda de las posteriores. Una relación sin matrimonio que terminó conserva su línea y añade una barra. Los hijos cuelgan de la línea de los padres, el mayor a la izquierda.",
  ["Compromiso: noviazgo (discontinua fina), cohabitación (discontinua), compromiso (punteada), matrimonio (continua), pareja de vida (continua gruesa), desconocido (punteada gris con ?).","Disolución: separación física (discontinua con una barra), separación legal (continua con una barra), divorcio (dos barras), vueltos a casar (dos barras cruzadas por otra invertida), anulación (dos barras y una X), viudo/a (X sobre la línea).","Circunstancias (en rosa): aventura (discontinua rosa), aventura con separación (una barra), con divorcio (dos barras), aventura y casados, relación de una noche (puntos rosas) y violación (línea roja con X gruesa; registrar solo lo que se revele).","Hijos: biológico (continua), adoptado (dos líneas, continua y punteada), acogida (punteada), hijastro (trazo y punto), subrogado (discontinua con S), donante de esperma (SD) y de óvulo (ED). Los padres biológicos de un hijo adoptado o acogido se unen con una línea curva fina."]],
 ["El genograma: líneas emocionales","Se dibujan entre dos personas cualesquiera. El color tiene significado: azul y verde para la conexión; rojo para el conflicto, la fusión y la distancia. Las flechas indican relaciones en una sola dirección y apuntan a quien lo recibe. Se usan solo las necesarias, y el abuso se registra con cuidado y con la participación de la persona.",
  ["Estándar: conectada (línea simple), cercana (doble: vínculo cálido con límites sanos), fusionada (triple: sobreimplicación, límites difusos), distante (discontinua roja), hostil (zigzag), cercana y hostil, abuso emocional, físico y sexual, enfocado en, enfocado negativamente, cuidador, corte (contacto roto a propósito) y corte reparado.","Ampliada: indiferente (sin implicación) y nunca se conocieron.","Positivas (verde): armonía, amistad, amor, enamorado/a, apego (vínculo seguro) y limerencia (enamoramiento no correspondido).","Hostilidad y violencia: conflicto, odio, desconfianza, distante y hostil, fusión y conflicto, fusión y hostil, violencia, distante y violencia, cercana y violencia, fusión y violencia.","Abuso y control: abuso, negligencia física (se niegan cuidados, comida o techo), negligencia emocional, manipulación (influencia encubierta) y control (coercitivo).","Atención: celoso/a (posesividad), fan o admirador e influencia (condiciona mucho las decisiones del otro)."]],
 ["El Apgar familiar","Escala creada por Smilkstein (1978) que evalúa numéricamente el funcionamiento familiar en personas de cualquier nivel sociocultural y económico. Tiene cinco preguntas que se puntúan nunca (0), a veces (1) o siempre (2), con un máximo de 10 puntos.",
  ["Adaptabilidad: usar recursos internos y externos para resolver problemas cuando se altera el equilibrio familiar.","Participación o cooperación: participación, reparto de responsabilidades y decisiones compartidas.","Desarrollo (gradiente de crecimiento): maduración de los miembros a lo largo del ciclo vital.","Afectividad: relaciones de afecto y demostraciones de cariño.","Capacidad de resolución (resolve): tiempo dedicado a las necesidades emocionales y físicas de la familia y compromiso para hacerlo.","Preguntas: ¿está satisfecho con la ayuda de su familia cuando tiene un problema?, ¿discute con su pareja los problemas del hogar?, ¿toman juntos las decisiones importantes?, ¿está satisfecho con el tiempo que pasan juntos?, ¿siente que su familia le quiere?","Resultado: 7-10 familia funcional; 4-6 disfunción familiar leve; 0-3 disfunción familiar severa."]],
 ["Mapa familiar, ecomapa y diagrama de redes","Tres técnicas más para conocer la vivienda, el entorno y la red de apoyo.",
  ["Mapa familiar: informa de las características físicas de la vivienda (distribución, quién ocupa cada espacio, falta de espacio personal e intimidad). Lo dibuja la propia persona usuaria como un plano de su casa, señalando espacios comunes, dónde se discute, dónde se estudia… Muy útil para el ámbito doméstico y para organizar entornos seguros.","Ecomapa: sitúa a la familia en el centro (con un pequeño genograma) y muestra sus relaciones con los sistemas del entorno: familia extensa, barrio, trabajo, ocio, educación, servicios sociales.","Líneas del ecomapa: fina = relación débil; gruesa = relación fuerte; con marcas o rayada = estresante o conflictiva; de trazo quebrado = tenue o distante.","Diagrama de redes sociales: representa la red de apoyo de una persona con dos variables: el tipo de relación (en los sectores del círculo: quienes conviven en casa, familia extensa, amistades, vecindario, relaciones laborales, culturales, otras organizaciones) y la intensidad (en los círculos concéntricos alrededor del «YO»).","Intensidad del 1 al 5: 1 relación intensa diaria; 2 diaria; 3 frecuente y aceptada; 4 esporádica; 5 puntual (algún contacto). La persona va colocando en el gráfico a quienes forman su red en ese momento."]],
 ["La matriz DAFO","Debilidades, Amenazas, Fortalezas y Oportunidades: herramienta de análisis estratégico de las organizaciones que se puede aplicar a una unidad de convivencia. A diferencia de las demás técnicas, que sirven para recoger información, el DAFO sirve para sistematizarla en un único documento visual, cruzando el origen del factor (interno o externo) con su signo (positivo o negativo). Con toda la información se formula el diagnóstico: si el funcionamiento familiar es deficiente, qué áreas fallan, con qué capacidades y recursos propios cuenta y qué intervención es la más adecuada.",
  ["Fortalezas (interno y positivo): buena comunicación, apoyo y colaboración familiar, habilidades parentales adecuadas, capacidad para resolver conflictos, ingresos estables.","Debilidades (interno y negativo): dificultades en la gestión doméstica, problemas de comunicación, conflictos familiares, falta de habilidades parentales, dificultades económicas.","Oportunidades (externo y positivo): servicios sociales disponibles, recursos comunitarios cercanos, apoyo del centro educativo, ayudas y prestaciones, asociaciones y red vecinal.","Amenazas (externo y negativo): entorno social desfavorecido, desempleo o precariedad laboral, falta de recursos especializados cercanos, aislamiento geográfico o social, escasez de servicios de apoyo."]],
 ["4. Necesidades de formación, información, supervisión y acompañamiento","Las carencias detectadas se traducen en necesidades de apoyo concretas. No son excluyentes y suelen combinarse en un mismo plan. Saber cuál predomina es clave: no tiene sentido un programa intensivo de formación para una familia que ya sabe hacerlo pero desconoce los recursos, ni basta con informar cuando falta una competencia.",
  ["De formación: le faltan competencias y debe adquirirlas de forma estructurada. Respuesta: formación parental, talleres de habilidades sociales, escuelas de familias, cursos de economía doméstica.","De información: desconoce los recursos, derechos o trámites a su alcance. Respuesta: información sobre prestaciones, ayudas, recursos sanitarios o educativos y procedimientos administrativos.","De supervisión: ya tiene las competencias, pero hay que comprobar periódicamente que las mantiene y aplica. Respuesta: visitas de seguimiento, revisión de pautas, control del estado de menores o personas dependientes.","De acompañamiento: necesita una presencia continuada que sostenga el cambio día a día, más que enseñar. Respuesta: acompañar en gestiones, apoyo emocional sostenido, presencia profesional en el domicilio.","Relación con los niveles: la información predomina en autonomía plena o con apoyos puntuales; la supervisión y el acompañamiento, en apoyo continuado o dependencia."]],
 ["5. Objetivos y niveles de planificación","Las necesidades se traducen en objetivos organizados en tres niveles de concreción, de mayor a menor amplitud.",
  ["Plan: planificación general a largo plazo; marca las líneas estratégicas.","Programa: a medio plazo; concreta el plan para un colectivo o contexto.","Proyecto: concreta un programa en actividades con objetivos operativos a corto plazo, dirigidas a una unidad de convivencia concreta.","Competencias: el Estado fija el marco general, las comunidades autónomas concretan normas y programas y las entidades locales acercan los recursos a la ciudadanía.","Región de Murcia: Ley 3/2021, de 29 de julio, de Servicios Sociales de la Región de Murcia, que regula el sistema público y el catálogo de prestaciones (SAD, teleasistencia, programa de familia, recursos residenciales).","Formulación de objetivos: de lo general a lo específico y a lo operativo, cada uno vinculado a necesidades detectadas. Ejemplo: «fomentar la corresponsabilidad en los cuidados» se concreta en facilitar el empleo de la cuidadora principal, mejorar deducciones fiscales o prevenir la pobreza infantil, con actuaciones y calendario.","Tipos de objetivos (vistos en la Unidad 1): de concienciación, de prevención, de apoyo, de capacitación y terapéuticos. Estrategias: capacitación parental, terapia familiar y mediación familiar."]],
 ["5.1. Tipos de programas de atención a las familias","Se agrupan según las necesidades que atienden.",
  ["Educación para familias vulnerables: ayudan a superar una dificultad social analizando necesidades, estableciendo actuaciones y orientando sobre ayudas.","Incentivación de la parentalidad positiva: conocimientos, recursos y apoyos en todas las etapas de los hijos, sobre todo en la primera infancia.","Apoyo a familias monoparentales: atención psicológica individual o familiar y, a veces, cuidado de menores fuera del horario escolar.","Apoyo a familias con algún miembro con necesidades especiales: mayores, discapacidad o enfermedad grave; apoyo económico y actuaciones que alivian la carga.","Apoyo a familias con violencia familiar: detección, atención y tratamiento, en coordinación con servicios sociales y tercer sector.","Orientación o mediación familiar: familias con relaciones conflictivas de pareja o paternofiliales, para mejorar la comunicación y evitar la ruptura.","Conciliación familiar: evitar la discriminación laboral por cargas familiares y formar a quienes vuelven al mercado laboral.","Solidaridad entre familias: acogida familiar, alternativa no institucional para menores que no pueden estar con su familia de origen."]],
 ["6. Espacio, recursos y tiempos","Definidos los objetivos, hay que concretar dónde se interviene, con qué recursos y en qué tiempos, porque condicionan la eficacia del plan.",
  ["Domicilio familiar: permite ver el funcionamiento real y trabajar lo doméstico, pero exige respetar la intimidad del hogar.","Dependencias del servicio social o recurso especializado: contexto neutro y estructurado, útil para entrevistas, terapia o mediación.","Espacios comunitarios (centros cívicos, asociaciones, escuelas): para actuaciones grupales o preventivas. El mapa familiar ayuda a decidir si hay que intervenir en la distribución de la vivienda.","Recursos humanos (equipo interdisciplinar), materiales (espacios, materiales didácticos o terapéuticos, transporte) y económicos (presupuesto para becas, ayudas o prestaciones).","Servicios básicos de atención social primaria: organizados por zonas y unidades básicas por las comunidades autónomas; son el acceso más cercano al sistema y coordinan equipos de trabajo social, educación, integración social, terapia ocupacional y psicología.","Tiempos: los planes de intervención familiar no suelen superar los 18 meses; si no hay cambios significativos, se revisa el plan. La frecuencia del seguimiento (semanal, quincenal, mensual) depende del nivel de autonomía: a menor autonomía, más contacto."]],
 ["6.4. Entornos seguros","Garantizar entornos seguros para todos, sobre todo menores y personas más vulnerables, no es un añadido: es una condición transversal presente en la elección del espacio, los recursos y el calendario.",
  ["Seguridad física del hogar: adecuar la vivienda para prevenir accidentes y garantizar espacios propios e intimidad.","Seguridad en la intervención: espacios y horarios que no añadan riesgo (p. ej., evitar coincidir con la persona agresora en casos de violencia).","Prevención de riesgos laborales y ambientales, para usuarios y para el equipo.","Protocolos claros ante emergencias durante la intervención."]],
 ["7. Carencias en la vida cotidiana y el papel del TSIS","Las dificultades sostenidas desorganizan el funcionamiento cotidiano más allá del problema inicial. Estas alteraciones suelen ser el indicador más visible, y el primero que detecta el equipo, de que la familia necesita apoyo. Son típicas de las familias multiproblemáticas (Unidad 1).",
  ["Falta de pautas de horarios, normas y rituales: sin horarios de comida, sueño, estudio u ocio, ni rituales estables como comer juntos.","Falta de espacios diferenciados: sin zonas separadas para menores y adultos, lo que dificulta la intimidad y puede favorecer riesgos.","Ausencia de espacios personales: sin armario, cama o estantería propios que ayuden al orden y a la identidad.","Desorganización de la economía doméstica: no saber cuánto entra y sale y confundir necesidades básicas con consumos no prioritarios.","Deficiencias en el cuidado básico: descuido de la alimentación, la higiene personal y del hogar o la atención sanitaria.","El Técnico Superior en Integración Social interviene organizando actividades de apoyo a la gestión doméstica, programando actividades que refuercen las habilidades de organización doméstica y haciendo el control y seguimiento con actitud autocrítica, criterios de calidad y retroalimentación para corregir desviaciones."]],
 ["8. Respetar las decisiones de cada miembro","No toda intervención la pide la familia, y eso cambia cómo se interviene.",

<script>
(function(){
"use strict";
const $app=document.getElementById('app');
const KEY='fanzine-repaso-v2';
let S={units:{},cards:{},fails:{},days:[],last:null};
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function touchDay(){const d=new Date().toISOString().slice(0,10); if(!S.days.includes(d)){S.days.push(d); if(S.days.length>60)S.days.shift(); save();}}
function streak(){let n=0;const set=new Set(S.days);const d=new Date();for(;;){const k=d.toISOString().slice(0,10);if(set.has(k)){n++;d.setDate(d.getDate()-1);}else break;}return n;}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const book=id=>BOOKS.find(b=>b.id===id);
const uKey=(b,n)=>b+':'+n;
function uState(b,n){return S.units[uKey(b,n)]||(S.units[uKey(b,n)]={read:false,best:0,cards:false});}
function starsOf(b,n){const u=S.units[uKey(b,n)]||{};return (u.read?1:0)+(u.cards?1:0)+((u.best||0)>=80?1:0);}
function bookPct(bk){const max=bk.units.length*3;let s=0;bk.units.forEach(u=>s+=starsOf(bk.id,u.n));return Math.round(s/max*100);}
function starHTML(n){return '<span class="stars" aria-label="'+n+' de 3 estrellas">'+[0,1,2].map(i=>'<span class="'+(i<n?'on':'off')+'">★</span>').join('')+'</span>';}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),1800);}
function allQuestions(filter){const out=[];BOOKS.forEach(b=>{if(filter&&filter.book&&filter.book!==b.id)return;b.units.forEach(u=>{u.quiz.forEach((q,i)=>out.push({b:b.id,ink:b.color,short:b.short,n:u.n,i:i,q:q[0],opts:q[1],ex:q[2]}));});});return out;}
const qid=q=>q.b+':'+q.n+':'+q.i;
const failCount=()=>Object.keys(S.fails).length;

function bar(title,back,ink){
  return '<header class="bar"'+(ink?' data-ink="'+ink+'"':'')+'><div class="in">'+
    (back?'<button class="back" aria-label="Volver" data-go="'+back+'">←</button>':'')+
    '<div class="ttl">'+esc(title)+'</div>'+
    '<div class="streak" title="Días seguidos estudiando">🔥 '+streak()+'</div></div></header>';
}

/* ---------- HOME ---------- */
function home(){
  const total=BOOKS.reduce((a,b)=>a+b.units.length,0);
  const cards=BOOKS.reduce((a,b)=>a+b.units.reduce((x,u)=>x+u.cards.length,0),0);
  const qs=allQuestions().length;
  let h='<main class="wrap"><section class="hero">'+
    '<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>'+
    '<p class="for">Para Alzahra · 1.º de Integración Social</p>'+
    '<h1><span>Estudiar</span><span class="l2">sin dormirse</span></h1>'+
    '<p class="lead">Tus libros y apuntes, en pequeño: lee lo esencial, gira tarjetas y ponte a prueba. Cada tema da hasta tres estrellas.</p>'+
    '</section>'+
    '<div class="stats"><span class="chip">'+total+' temas</span><span class="chip">'+cards+' tarjetas</span><span class="chip">'+qs+' preguntas</span></div>'+
    '<div class="covers">';
  BOOKS.forEach(b=>{const p=bookPct(b);
    h+='<button class="cover" data-ink="'+b.color+'" data-go="#/b/'+b.id+'"><h2>'+esc(b.title)+'</h2><div class="sub">'+esc(b.intro)+'</div>'+
      '<div class="meta"><span>'+b.units.length+(b.units.length===1?' tema':' temas')+'</span><span style="display:flex;align-items:center;gap:8px">'+p+'%<span class="meter"><i style="width:'+p+'%"></i></span></span></div></button>';});
  h+='</div><h2 class="section-t">Modo juego</h2><div class="tools">'+
    '<button class="tool" data-ink="pink" data-go="#/quiz/mix"><span class="ico">⚡</span><span><b>Repaso relámpago</b><span>10 preguntas al azar de todos los temas</span></span></button>'+
    '<button class="tool" data-ink="yellow" data-go="#/quiz/fails"'+(failCount()?'':' disabled')+'><span class="ico">🎯</span><span><b>Mis fallos ('+failCount()+')</b><span>'+(failCount()?'Vuelve a las preguntas que fallaste hasta acertarlas':'Aquí irán las preguntas que falles')+'</span></span></button>'+
    '<button class="tool" data-ink="green" data-go="#/match/mix"><span class="ico">🧩</span><span><b>Emparejar mezclado</b><span>Une conceptos con su definición</span></span></button>'+
    '<button class="tool" data-ink="blue" data-go="#/cards/mix"><span class="ico">🃏</span><span><b>Tarjetas al azar</b><span>15 tarjetas de cualquier libro</span></span></button>'+
    '</div><div class="foot"><span>Tu progreso se guarda en este móvil.</span><button class="linkbtn" id="reset">Borrar mi progreso</button></div></main>';
  return bar('Fanzine de repaso')+h;
}

/* ---------- BOOK ---------- */
function bookView(id){
  const b=book(id); if(!b) return home();
  let h=bar(b.short,'#/',b.color)+'<main class="wrap" data-ink="'+b.color+'"><section class="bhead"><h1>'+esc(b.title)+'</h1><p class="muted">'+esc(b.intro)+'</p></section><ol class="units">';
  b.units.forEach(u=>{h+='<li><button class="unit" data-go="#/u/'+b.id+'/'+u.n+'/esencial"><span class="num">'+u.n+'</span><span><b>'+esc(u.title)+'</b><small>'+u.cards.length+' tarjetas · '+u.quiz.length+' preguntas</small></span>'+starHTML(starsOf(b.id,u.n))+'</button></li>';});
  h+='</ol><button class="bigbtn" data-go="#/quiz/book/'+b.id+'">Examen del libro: 12 preguntas</button>'+
     '<p class="muted" style="margin-top:14px;font-size:14.5px">Estrellas: ★ leer lo esencial · ★ saberte todas las tarjetas · ★ sacar 80 % o más en el test.</p></main>';
  return h;
}

/* ---------- UNIT ---------- */
const TABS=[['esencial','📖','Lo esencial'],['tarjetas','🃏','Tarjetas'],['test','✅','Test'],['emparejar','🧩','Emparejar']];
function unitView(id,n,tab){
  const b=book(id); const u=b&&b.units.find(x=>x.n==n); if(!u) return home();
  let h=bar(b.short+' · Tema '+u.n,'#/b/'+b.id,b.color)+'<main class="wrap" data-ink="'+b.color+'"><section class="uhead"><span class="tag">Tema '+u.n+(b.units[b.units.length-1].n===b.units.length?' de '+b.units.length:'')+'</span><h1>'+esc(u.title)+'</h1></section>'+
    '<nav class="tabs" role="tablist">'+TABS.map(t=>'<button class="tab" role="tab" aria-selected="'+(t[0]===tab)+'" data-go="#/u/'+b.id+'/'+u.n+'/'+t[0]+'"><span class="e" aria-hidden="true">'+t[1]+'</span>'+t[2]+'</button>').join('')+'</nav><div id="pane"></div></main>';
  return h;
}
function liHtml(s){const k=s.indexOf(': ');return (k>0&&k<70)?'<b>'+esc(s.slice(0,k))+':</b> '+esc(s.slice(k+2)):esc(s);}
function paneEsencial(b,u){
  const st=uState(b.id,u.n);
  let h='<div class="sec-tools"><span>'+u.secs.length+' apartados · toca para abrir</span><button class="linkbtn" id="openall">Abrir todos</button></div>';
  h+=u.secs.map((s,i)=>'<details class="sec"'+(i===0?' open':'')+'><summary><h3>'+esc(s[0])+'</h3></summary><div class="sec-body">'+(s[1]?'<p>'+esc(s[1])+'</p>':'')+(s[2]&&s[2].length?'<ul>'+s[2].map(x=>'<li>'+liHtml(x)+'</li>').join('')+'</ul>':'')+'</div></details>').join('');
  h+='<div class="trick"><b>Trucos para recordarlo</b><ul>'+u.trucos.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul></div>';
  h+='<button class="bigbtn done-read" id="readok">'+(st.read?'Leído ✓ Ahora, a las tarjetas':'Ya lo he leído: ganar ★')+'</button>';
  return h;
}

/* ---------- FLASHCARDS ---------- */
let FC=null;
function startCards(list,meta){FC={list:shuffle(list),i:0,known:0,again:0,meta:meta,flipped:false};}
function paneCards(){
  if(!FC.list.length) return '<div class="empty">No hay tarjetas aquí.</div>';
  if(FC.i>=FC.list.length){
    const all=FC.again===0;
    if(FC.meta.unit&&all){const st=uState(FC.meta.b,FC.meta.n); if(!st.cards){st.cards=true;save();}}
    return '<div class="result"><div class="stamp">'+(all?'¡Todas!':'¡Bien!')+'</div><p>'+(all?'Te sabes todas las tarjetas'+(FC.meta.unit?' y ganas ★.':'.'):'Has marcado '+FC.again+' para repasar. Ya han vuelto a salir al final; repite la ronda para dominarlas.')+'</p>'+
      '<div class="stack"><button class="btn solid wide" id="fc-restart">Otra ronda</button></div></div>';
  }
  const c=FC.list[FC.i];
  return '<div class="fc-count"><span>'+(FC.i+1)+' / '+FC.list.length+'</span><span>✓ '+FC.known+' · ↻ '+FC.again+'</span></div>'+
   '<div class="fc-wrap"><div class="fc'+(FC.flipped?' flip':'')+'" id="fc" role="button" tabindex="0" aria-label="Girar tarjeta">'+
   '<div class="face front"'+(c.ink?' data-ink="'+c.ink+'" style="background:var(--fill)"':'')+'><div class="t">'+esc(c.f)+'</div><div class="hint">Toca para ver la respuesta</div></div>'+
   '<div class="face rev"><div>'+esc(c.b)+'</div><div class="hint">'+(c.src?esc(c.src):'¿Lo sabías?')+'</div></div></div></div>'+
   '<div class="duo"><button class="btn again" id="fc-again">↻ Repasar</button><button class="btn ok" id="fc-ok">✓ Lo sé</button></div>';
}

/* ---------- QUIZ ---------- */
let QZ=null;
function startQuiz(qs,meta){QZ={qs:qs.map(q=>Object.assign({},q,{shown:shuffle(q.opts)})),i:0,ok:0,answered:null,meta:meta};}
function paneQuiz(){
  if(!QZ.qs.length) return '<div class="empty">No hay preguntas aquí todavía.</div>';
  if(QZ.i>=QZ.qs.length){
    const pct=Math.round(QZ.ok/QZ.qs.length*100);
    if(QZ.meta.unit){const st=uState(QZ.meta.b,QZ.meta.n); if(pct>st.best){st.best=pct;save();}}
    const word=pct===100?'¡Perfecto!':pct>=80?'¡Matrícula!':pct>=50?'¡Aprobado!':'¡A repasar!';
    return '<div class="result"><div class="stamp">'+word+'</div><div class="score">'+QZ.ok+'/'+QZ.qs.length+'</div><p class="muted">'+pct+' % de aciertos'+(QZ.meta.unit&&pct>=80?' · ganas ★':'')+'</p>'+
      '<div class="stack"><button class="btn solid wide" id="qz-restart">Repetir con otras preguntas</button>'+(failCount()?'<button class="btn wide" data-go="#/quiz/fails">Practicar mis fallos ('+failCount()+')</button>':'')+'</div></div>';
  }
  const q=QZ.qs[QZ.i], a=QZ.answered, correct=q.opts[0];
  let h='<div class="q-top"><span>Pregunta '+(QZ.i+1)+' de '+QZ.qs.length+'</span><span>✓ '+QZ.ok+'</span></div><div class="prog"><i style="width:'+(QZ.i/QZ.qs.length*100)+'%"></i></div>';
  if(QZ.meta.mixed) h+='<div class="q-src" data-ink="'+q.ink+'">'+esc(q.short)+' · Tema '+q.n+'</div>';
  h+='<div class="q">'+esc(q.q)+'</div><div class="opts">';
  q.shown.forEach((o,k)=>{let cls='opt'; if(a!==null){ if(o===correct)cls+=' right'; else if(o===a)cls+=' wrong'; }
    h+='<button class="'+cls+'" data-opt="'+k+'"'+(a!==null?' disabled':'')+'><span class="k">'+'ABCD'[k]+'</span><span>'+esc(o)+'</span></button>';});
  h+='</div>';
  if(a!==null){h+='<div class="explain"><b>'+(a===correct?'¡Correcto! ':'Era: «'+esc(correct)+'». ')+'</b>'+esc(q.ex)+'</div><div class="stack"><button class="btn solid wide" id="qz-next">'+(QZ.i+1<QZ.qs.length?'Siguiente':'Ver resultado')+'</button></div>';}
  return h;
}

/* ---------- MATCH ---------- */
let MT=null;
function startMatch(pool,meta){const sh=pool.filter(p=>p.b.length<=110),pick=shuffle(sh.length>=5?sh:pool).slice(0,5);MT={pairs:pick,terms:shuffle(pick.map((p,i)=>i)),defs:shuffle(pick.map((p,i)=>i)),sel:null,hit:new Set(),miss:0,meta:meta,t0:Date.now()};}
function paneMatch(){
  if(MT.pairs.length<2) return '<div class="empty">Hacen falta más tarjetas para este juego.</div>';
  if(MT.hit.size===MT.pairs.length){
    const secs=Math.round((Date.now()-MT.t0)/1000);
    return '<div class="result"><div class="stamp">'+(MT.miss===0?'¡Sin fallos!':'¡Hecho!')+'</div><p>'+MT.pairs.length+' parejas en '+secs+' s'+(MT.miss?' con '+MT.miss+' fallo'+(MT.miss>1?'s':''):'')+'.</p><div class="stack"><button class="btn solid wide" id="mt-restart">Otra partida</button></div></div>';
  }
  let h='<p class="m-info">Toca un concepto y después su definición.</p><div class="m-terms">';
  MT.terms.forEach(i=>{const p=MT.pairs[i];h+='<button class="m-term'+(MT.sel===i?' sel':'')+(MT.hit.has(i)?' hit gone':'')+'"'+(p.ink?' data-ink="'+p.ink+'" style="background:var(--fill)"':'')+' data-term="'+i+'"'+(MT.hit.has(i)?' disabled':'')+'>'+esc(p.f)+'</button>';});
  h+='</div><div class="m-defs">';
  MT.defs.forEach(i=>{const p=MT.pairs[i];h+='<button class="m-def'+(MT.hit.has(i)?' hit':'')+'" data-def="'+i+'"'+(MT.hit.has(i)?' disabled':'')+'>'+(MT.hit.has(i)?'<b>'+esc(p.f)+':</b> ':'')+esc(p.b)+'</button>';});
  return h+'</div>';
}

/* ---------- pools ---------- */
function cardsOf(b,u){return u.cards.map(c=>({f:c[0],b:c[1]}));}
function allCards(){const out=[];BOOKS.forEach(b=>b.units.forEach(u=>u.cards.forEach(c=>out.push({f:c[0],b:c[1],ink:b.color,src:b.short+' · Tema '+u.n}))));return out;}

/* ---------- ROUTER ---------- */
let current={};
function route(){
  const h=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  window.scrollTo(0,0);
  if(!h.length){$app.innerHTML=home();current={v:'home'};return;}
  if(h[0]==='b'){$app.innerHTML=bookView(h[1]);current={v:'book'};return;}
  if(h[0]==='u'){
    const b=book(h[1]),u=b&&b.units.find(x=>x.n==h[2]),tab=h[3]||'esencial';
    if(!u){location.hash='#/';return;}
    $app.innerHTML=unitView(h[1],h[2],tab); current={v:'unit',b:b,u:u,tab:tab};
    if(tab==='tarjetas') startCards(cardsOf(b,u),{unit:true,b:b.id,n:u.n});
    if(tab==='test') startQuiz(shuffle(u.quiz.map((q,i)=>({b:b.id,n:u.n,i:i,q:q[0],opts:q[1],ex:q[2]}))),{unit:true,b:b.id,n:u.n});
    if(tab==='emparejar') startMatch(cardsOf(b,u),{unit:true});
    renderPane(); return;
  }
  if(h[0]==='quiz'){
    let qs,title,meta={mixed:true},back='#/',ink='pink';
    if(h[1]==='mix'){qs=shuffle(allQuestions()).slice(0,10);title='Repaso relámpago';}
    else if(h[1]==='fails'){qs=shuffle(allQuestions().filter(q=>S.fails[qid(q)]));title='Mis fallos';ink='yellow';}
    else if(h[1]==='book'){const b=book(h[2]);if(!b){location.hash='#/';return;}qs=shuffle(allQuestions({book:b.id})).slice(0,12);title='Examen · '+b.short;back='#/b/'+b.id;ink=b.color;}
    $app.innerHTML=bar(title,back,ink)+'<main class="wrap" data-ink="'+ink+'" style="padding-top:22px"><div id="pane"></div></main>';
    startQuiz(qs,meta); current={v:'quiz',tab:'test',kind:h[1],arg:h[2]}; renderPane(); return;
  }
  if(h[0]==='match'){
    $app.innerHTML=bar('Emparejar mezclado','#/','green')+'<main class="wrap" data-ink="green" style="padding-top:22px"><div id="pane"></div></main>';
    startMatch(allCards(),{}); current={v:'match',tab:'emparejar'}; renderPane(); return;
  }
  if(h[0]==='cards'){
    $app.innerHTML=bar('Tarjetas al azar','#/','blue')+'<main class="wrap" data-ink="blue" style="padding-top:22px"><div id="pane"></div></main>';
    startCards(shuffle(allCards()).slice(0,15),{}); current={v:'cards',tab:'tarjetas'}; renderPane(); return;
  }
  location.hash='#/';
}
function renderPane(){
  const p=document.getElementById('pane'); if(!p) return;
  const t=current.tab;
  p.innerHTML= t==='esencial'?paneEsencial(current.b,current.u): t==='tarjetas'?paneCards(): t==='test'?paneQuiz(): paneMatch();
}

/* ---------- EVENTS ---------- */
document.addEventListener('click',function(e){
  const go=e.target.closest('[data-go]');
  if(go&&!go.disabled){e.preventDefault(); const t=go.getAttribute('data-go'); if(location.hash===t) route(); else location.hash=t; return;}
  const id=(e.target.closest('button')||{}).id;
  if(id==='reset'){ if(confirm('¿Borrar todo tu progreso? No se puede deshacer.')){S={units:{},cards:{},fails:{},days:[],last:null};save();route();} return;}
  if(id==='openall'){const ds=[...document.querySelectorAll('details.sec')],open=ds.some(d=>!d.open);ds.forEach(d=>d.open=open);e.target.textContent=open?'Cerrar todos':'Abrir todos';return;}
  if(id==='readok'){const st=uState(current.b.id,current.u.n); touchDay(); if(!st.read){st.read=true;save();toast('★ ¡Primera estrella!');} location.hash='#/u/'+current.b.id+'/'+current.u.n+'/tarjetas'; return;}
  // cards
  if(e.target.closest('#fc')){FC.flipped=!FC.flipped; document.getElementById('fc').classList.toggle('flip',FC.flipped); return;}
  if(id==='fc-ok'||id==='fc-again'){
    touchDay();
    if(id==='fc-ok'){FC.known++;} else {FC.again++; FC.list.push(FC.list[FC.i]);}
    FC.i++; FC.flipped=false; renderPane(); return;
  }
  if(id==='fc-restart'){FC.list=shuffle(FC.list.filter((c,i,a)=>a.findIndex(x=>x.f===c.f)===i));FC.i=0;FC.known=0;FC.again=0;FC.flipped=false;renderPane();return;}
  // quiz
  const opt=e.target.closest('[data-opt]');
  if(opt&&QZ&&QZ.answered===null){
    const q=QZ.qs[QZ.i], pick=q.shown[+opt.getAttribute('data-opt')]; QZ.answered=pick; touchDay();
    if(q.b!==undefined){ if(pick===q.opts[0]){QZ.ok++; if(S.fails[qid(q)]){delete S.fails[qid(q)];}} else {S.fails[qid(q)]=1;} save(); }
    renderPane(); const ex=document.querySelector('.explain'); if(ex) ex.scrollIntoView({block:'nearest',behavior:'smooth'}); return;
  }
  if(id==='qz-next'){QZ.i++;QZ.answered=null;renderPane();window.scrollTo({top:0});return;}
  if(id==='qz-restart'){route();return;}
  // match
  const term=e.target.closest('[data-term]');
  if(term&&MT){const i=+term.getAttribute('data-term'); MT.sel=(MT.sel===i?null:i); renderPane(); return;}
  const def=e.target.closest('[data-def]');
  if(def&&MT){
    if(MT.sel===null){toast('Primero toca un concepto de arriba');return;}
    const i=+def.getAttribute('data-def'); touchDay();
    if(i===MT.sel){MT.hit.add(i);MT.sel=null;renderPane();}
    else{MT.miss++; def.classList.add('miss','shake'); setTimeout(()=>{def.classList.remove('miss','shake');},450);}
    return;
  }
  if(id==='mt-restart'){route();return;}
});
document.addEventListener('keydown',function(e){
  if(current.tab==='tarjetas'&&FC&&FC.i<FC.list.length){ if((e.key===' '||e.key==='Enter')&&(e.target===document.body||e.target.id==='fc')){e.preventDefault();document.getElementById('fc').click();} }
});
window.addEventListener('hashchange',route);
route();
})();
</script>
</body>
