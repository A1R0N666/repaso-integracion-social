  ["Escala de la Cruz Roja: seis niveles (de 0, independencia, a 5, incapacidad total) según AVD, deambulación y continencia. Muy sencilla y rápida, pero poco precisa en dependencias leves y moderadas.","Índice de Katz: seis AVDB (aseo, vestido, uso del retrete, movilidad, continencia y alimentación), independiente o dependiente. Valora el estado actual, no la capacidad: si no quiere hacerlo o lo hace con supervisión, cuenta como dependiente. Grados de A (independiente en las seis) a G (dependiente en todas).","Índice de Barthel: diez AVD (alimentación, vestido, cuidado personal, defecación, micción, uso del retrete, transferencia sillón-cama, deambulación y escaleras) con varias alternativas. Puntuación: 100 independencia; 91-99 leve; 61-90 moderada; 21-60 severa; 0-20 dependencia total.","Escala de Lawton y Brody: ocho AVDI (teléfono, compras, preparar la comida, cuidado de la casa, lavado de la ropa, transporte, medicación y economía), 1 independiente o 0 dependiente. Tiene un fuerte sesgo sociocultural y de género (tareas hechas tradicionalmente por mujeres).","Baremo de valoración de la situación de dependencia (BVD): establecido por el Real Decreto 174/2011 en desarrollo de la Ley 39/2006. Valora AVDB, tareas domésticas y toma de decisiones con nivel de desempeño, tipo de apoyo (supervisión, asistencia física parcial, sustitución máxima, apoyo especial), problema y frecuencia. Lo usan los organismos oficiales para reconocer prestaciones; es objetivo pero complejo.","Otras: escala del Instituto de Rehabilitación de Chicago, Conjunto mínimo de datos (CMD), índice de Kenny, baremo de ayuda de tercera persona (ATP) y Medida de la independencia funcional (MIF)."]],
 ["5.2.2. El diagnóstico","Los datos se analizan y sistematizan para elaborar el diagnóstico de la funcionalidad, base para diseñar el programa.",
  ["Identificar áreas deficitarias o problemas de desempeño.","Determinar el tipo y la cantidad de ayudas que necesita.","Establecer factores limitantes y capacidades potenciales.","Detectar situaciones de riesgo."]],
 ["5.3. Planificación de la intervención","Se parte del diagnóstico, se formulan los objetivos y se concretan actividades (con contenidos y sesiones), técnicas y recursos. Hay que tener en cuenta la edad, la madurez y el desempeño de la persona.",
  ["Áreas de actividades: higiene personal (aseo, ducha, higiene dental, vestido), alimentación y nutrición (dietas, compra, cocinar, cubiertos), tareas domésticas (lavadora, tender, planchar, limpiar), cuidado de la salud (medicación, centro de salud, farmacia), instrumentales (gastos, dinero, transporte, teléfono) y vida social.","Se organiza en sesiones: por ejemplo, dos sesiones semanales de 45 minutos durante tres meses.","Ejemplo (Doc. 5.11): programa para trastorno mental grave de 48 sesiones de 45 minutos, con un módulo de autocuidado (higiene y vestido, alimentación, sueño, vida saludable) y otro de autonomía social (tareas domésticas, dinero y compras, trámites, comunicación, transporte), con tareas para casa y autorregistros.","Existen programas prediseñados (Alzheimer, síndrome de Down, edad escolar) útiles como orientación, aunque el programa debe ser individualizado."]],
 ["5.3.2. Las técnicas de intervención","Como se trata de adquirir y perfeccionar conductas, las técnicas prioritarias son las de modificación de conducta, en una secuencia habitual.",
  ["Preparación: relación terapéutica positiva y conciencia de los beneficios.","Instrucción verbal: qué se entrenará y cómo hacerlo.","Modelado: el profesional ejecuta correctamente la conducta.","Encadenamiento: descomponer procedimientos complejos en tareas sencillas.","Moldeado: corregir las acciones para aproximarlas a la conducta deseada, con instigadores verbales, gestuales o físicos.","Role playing: practicar en entornos simulados.","Automatización y consolidación: repetir hasta hacerlo sin instigación ni supervisión.","Generalización: aplicar lo aprendido en contextos reales (tareas para casa) con registro de tareas y dudas.","Seguimiento tras el programa, y contrato conductual si hace falta formalizar compromisos.","Complementos: refuerzo, retroalimentación (feedback), orientación y entrenamiento familiar y extinción progresiva de apoyos."]],
 ["5.3.3. Recursos: los productos de apoyo","Un producto de apoyo es cualquier objeto, dispositivo o entorno cotidiano creado o modificado para responder a las limitaciones funcionales de una persona. No tiene que ser sofisticado (principio de simplificación). Su elección depende de la persona, de las características del recurso (funcionalidad, manejo, precio) y del entorno donde se usará. Implantarlo incluye enseñar su uso y mantenimiento.",
  ["Clasificación ISO 9999 para AVD: 04 funciones corporales, 06 órtesis y prótesis, 09 cuidado y protección personal, 12 movilidad y transporte, 15 actividades domésticas, 18 mobiliario y adaptaciones, 22 información y comunicación, 24 manipular objetos, 27 entorno físico, 28 empleo, 30 esparcimiento y ocio.","Información: CEAPAT (catálogo en línea) y CTI de la ONCE (déficit visual).","Productos adaptados: objetos modificados para usarlos de forma autónoma (velcro, mangos engrosados para cubiertos o cepillos, adaptadores de vasos, alzadores de sillas, pinzas para alcanzar).","Productos ortoprotésicos: productos sanitarios que sustituyen una estructura corporal o corrigen su función. Órtesis: uso externo, modifican el sistema neuromuscular o el esqueleto (corsés, collarines, plantillas, rodilleras). Prótesis: sustituyen un órgano o estructura; internas (cadera, lentes intraoculares, implantes auditivos) o externas (mano, pie, audífonos).","Productos de apoyo para AVD: cuidado personal (calzadores, abotonadores, cortaúñas, orinales, absorbentes), domésticos (sujeción de cubiertos, abrelatas adaptados, calzaplatos, recogedores de mango largo, enhebradores), comunicación, manipulación (mandos para persianas, domótica) y ocio.","Adaptaciones del hogar: mobiliario regulable y ergonómico (mesas, asientos, camas articuladas), dispositivos de apoyo (pasamanos, barras), elementos de seguridad (barandillas de cama, antideslizantes, válvulas de gas, detectores de humo) e iluminación."]],
 ["Accesibilidad y diseño universal (Doc. 5.14)","La accesibilidad universal es la condición que deben cumplir objetos, espacios y servicios para que cualquier persona pueda usarlos de forma segura, cómoda, autónoma y en igualdad. Debe ser física, sensorial y cognitiva, y beneficia a toda la población (los pictogramas sirven a personas con autismo, a niños que no leen y a extranjeros).",
  ["Requisitos DALCO: Deambulación, Aprehensión, Localización y Comunicación.","Diseño universal (diseño para todos): concebir desde el origen productos y entornos que todos puedan usar sin adaptación posterior.","7 principios: uso igualitario, flexibilidad, simplicidad e intuitividad, información fácilmente perceptible, tolerancia a errores, esfuerzo físico escaso y dimensiones apropiadas."]],
 ["5.4.1. Pautas generales de intervención","En el domicilio (individual) es más fácil implantar rutinas y contar con la familia, por eso resulta más eficaz; en centros suele hacerse en grupo pero individualizado según el plan de atención. El objetivo debe ser educativo (favorecer la autonomía) y no asistencial (hacerlo por la persona). El profesional necesita formación en ergonomía y saber pedir ayuda si se agota.",
  ["Estructura de cada sesión: inicio (repaso y tareas para casa), presentación de objetivos, entrenamiento y finalización (resumen y nuevas tareas).","Rol de instructor: en la primera fase, explica lo motivacional y lo procedimental.","Rol de cooperador: en la fase de aprendizaje, da apoyos, ayudas e indicaciones.","Rol de observador o supervisor: cuando ya lo hace casi bien, corrige desviaciones.","Tutorías de seguimiento con la persona y su entorno, incluso después del programa.","Favorecer la autonomía: rutina diaria con horarios, valorar dificultades y avances, entorno seguro y estructurado, ayudar solo en lo necesario (no hacer lo que puede hacer sola), promover la autodeterminación y evitar la sobreprotección."]],
 ["5.4.2. Higiene personal","Objetivo: que haga con la máxima corrección y la mínima ayuda el mayor número posible de actividades: higiene básica (manos y cara), corporal (baño o ducha, genitales, manos y pies), capilar, bucal y cuidado del aspecto (afeitado, depilación, cosméticos).",
  ["Tener productos y productos de apoyo preparados; entorno seguro (asideros, espejos inclinados, grifos adaptados, pictogramas, colores contrastados).","Intimidad: invadirla lo menos posible, mantener tapada a la persona y exponer cada zona solo el tiempo necesario. Respetar sus costumbres.","Baño o ducha: acceso, regular la temperatura (bañera: más de 15 minutos), lavar por zonas (remojo, enjabonado, aclarado), secar con suavidad los pliegues (la humedad causa maceraciones y úlceras) e hidratar.","Seguridad (Doc. 5.15): suelos antideslizantes, plato de ducha a ras del suelo, barras, grúa si hace falta, asientos de ducha, todo al alcance y lavado sentado.","Baño en cama: proteger la cama; cara y cuello, parte superior, parte inferior y por último genitales. Así nunca queda desnuda del todo; renovar el agua y que colabore en lo que pueda.","Genitales: es lo que más invade la intimidad, así que lo hace la propia persona si puede. En mujeres, de pubis hacia ano; en hombres, retirar el prepucio, luego pene, escroto y perineo.","Lavado de pelo en cama con lavacabezas inflable; manos siempre antes y después de comer y tras el retrete; cara cada mañana solo con agua.","Manos y pies: remojar, limpiar y cortar uñas, hidratar, secar bien y revisar rozaduras o úlceras (podología si hace falta).","Afeitado: mejor eléctrico si no puede solo; depilación con crema si no es autónoma. Higiene bucal: pasta, cepillado de dientes, lengua y paladar, y enjuague; limpiar prótesis no fijas."]],
 ["5.4.3. Evacuación","La falta de autonomía en la evacuación se vive con vergüenza y frustración: hay que preservar la intimidad y mostrar respeto. No debe ser solo asistencial: enseñar y dejar que participe.",
  ["Siempre con guantes; proteger la cama con empapador; movilizar si no colabora.","Productos: alzas de inodoro, ayudas para el papel higiénico, barras laterales, inodoros con chorro y aire.","Orinal plano o cuña: micción de mujeres y defecación. Orinal de botella: micción de hombres.","Limitaciones leves: acompañar al baño y ayudar con la ropa, sentarse y el papel.","Encamada y autónoma: darle el orinal y salir o taparla; encamada sin colaboración: levantar la pelvis o girarla de lado para colocar la cuña.","Incontinencia: primero entrenar micción programada y control de esfínteres. Absorbentes: bragas-pañal (fugas leves) o pañales (incontinencia consolidada). Cambio: enrollar el sucio, lavar y secar la zona perineal y ajustar el limpio."]],
 ["5.4.4. Vestido","Incluye preparar el vestuario y el proceso de vestirse y calzarse.",
  ["Preparar productos de apoyo: tiradores de cremallera, abotonadores, subecalcetines, calzadores de mango largo.","Dejar las prendas apiladas en orden inverso al de colocación.","Prendas amplias, abiertas por delante y con cierres simples (velcro, elásticos); calzado sin cordones (mocasines).","Mejor sentado, por seguridad y comodidad. Respetar costumbres y preferencias.","Preparar el vestuario según estación, tiempo y actividad, combinando colores, derecho y revés y orden (clave con deterioro cognitivo).","Si hay un miembro afectado, se empieza a vestir por él. Desvestirse sigue el orden inverso.","Encamada: primero la mitad inferior, luego la superior, ajustar, abrochar y calzar.","Priorizar siempre que lo haga sola aunque tarde más."]],
 ["5.4.5. Alimentación","La comida satisface la necesidad de nutrirse, ayuda a la orientación temporal y es un acto social. Requiere habilidades de preparación y de ingesta.",
  ["Preparación: planificar el menú (dieta equilibrada), preparar utensilios, elaborar y servir.","Obstáculos: falta de conocimientos culinarios (formación), dificultades de agarre (tablas antideslizantes, mangos adaptados) y de aproximación a los muebles.","Prevenir accidentes: guantes aislantes, arrastrar recipientes, cocinas con testigo de calor residual.","Estrategias: recetas, orden fijo de las cosas (clave con déficit visual), lo pesado abajo y lo más usado a mano, robots de cocina, cajones en vez de armarios bajos.","Dificultades en la ingesta: mantener la postura, coordinación y motricidad fina, masticación y deglución, y hábitos mal asumidos.","Estrategias: sentarse bien con la mesa a la altura de los codos y la comida a la vista, explicar qué hay en el plato, cubiertos y vasos adaptados, entrenar hábitos y adaptar la consistencia de los alimentos si hay problemas de deglución.","Si se necesita ayuda, se descompone la tarea: por ejemplo, servir la comida cortada para que la pinche sola en vez de darle de comer."]],
 ["5.4.6. Control y mantenimiento de la salud","Se centra en la prevención, la toma correcta de medicación y el autocontrol de la salud.",
  ["Prevención: actividad física regular, dieta equilibrada, prevenir accidentes (detectores, barras) y evitar conductas de riesgo como subirse a sillas o automedicarse. Saber llamar al 112; la teleasistencia y teléfonos con teclas programadas (con fotos) ayudan.","Medicación: almacenarla en su lugar y bien conservada, usar pastilleros diarios o semanales y pautas para recordar las tomas, y enseñar la administración correcta (cápsulas, supositorios, nebulizador, insulina).","Autocontrol: constantes vitales (temperatura, respiración, tensión y pulso), dolor, glucosa, hidratación, cambios emocionales y memoria. Revisar las zonas de presión en personas encamadas o sentadas mucho tiempo para evitar úlceras."]],
 ["5.4.7. AVD instrumentales","Se priorizan las básicas, pero conviene trabajar las instrumentales: tareas domésticas, desplazamientos, gestiones financieras y tecnología. Al estar muy ligadas a los hábitos, cambiarlas es lento.",
  ["Compra: planificar y hacer la lista, elegir establecimiento (o por internet), desplazarse (carro, mejor que bolsas), elegir productos, pagar (monederos con compartimentos), volver y guardar (limpieza separada de los alimentos).","Ropa: lavar (separar por colores y tejidos), secar, planchar, guardar y coser. Apuntar en la etiqueta, pinzas de mango largo, tendederos extensibles.","Limpieza: planificar (cocina y baño, más a menudo), utensilios adaptados, productos adecuados (no usar cera, resbala) y reciclar la basura.","Desplazamientos: transporte accesible con avisos visuales y sonoros, y habilidades para horarios, recorridos y billetes; vehículo privado adaptado (rampa, plataforma, transferencia desde la silla).","Gestiones financieras: con déficit cognitivo, aprender monedas y billetes, darle el dinero justo, distinguir gastos fijos, ocasionales e imprevistos y hacer un presupuesto.","Tecnología: aumenta la autonomía, pero puede crear brecha digital por barreras económicas, competenciales (alfabetización digital) y de accesibilidad."]],
 ["5.5. Adaptación del entorno","Es el conjunto de modificaciones del ambiente físico para adecuarlo a la persona y que pueda hacer las AVD de forma segura e independiente.",
  ["Beneficios: prevenir accidentes (caídas), facilitar las AVD, mejorar la orientación, mejorar la calidad de vida (retrasa el ingreso en una residencia) y el estado emocional (autoestima y sensación de control).","Criterios: adecuarse a la persona, ver las posibilidades de reforma (vivienda, dinero) y jerarquizar: primero las estancias de más riesgo (baño y cocina) y la opción más sencilla y barata.","Domótica: tecnología aplicada a la vivienda para automatizar, mejorar la seguridad y controlar temperatura, luces o electrodomésticos.","Ejemplos (Doc. 5.18): timbres de emergencia, sensores de luz, pasamanos, rampas o salvaescaleras, suelos antideslizantes, ducha a ras de suelo, cortina en vez de mampara, grifos monomando, cocina vitrocerámica y utensilios más usados a mano."]],
 ["5.6. Evaluación del programa","Sirve para valorar el logro de objetivos, detectar puntos fuertes y débiles, conocer la opinión de la persona y mejorar la actuación del equipo.",
  ["Del proceso (actividades): con indicadores de logro concretos; si no se alcanzan, revisar si la actividad era adecuada, si se hizo bien o si los objetivos eran demasiado ambiciosos.","Del progreso: registros de seguimiento de la generalización y comparar en el tiempo (p. ej., cada 6 meses) las puntuaciones en las mismas escalas (Cruz Roja 0-5, Katz 0-6, Barthel 0-100, Lawton y Brody 0-8).","Del resultado (programa): en qué medida se han logrado los objetivos generales.","Del equipo profesional: autoevaluaciones y escalas de actitud que sirven al profesional (formación), al equipo (coordinación) y a la organización.","Satisfacción de la persona usuaria: esfuerzo, agrado, resultados y papel del profesional.","Comunicación: informe de evaluación con resultados y conclusiones, que se comunica a la persona y su familia."]]
],
trucos:["AVD = «Básicas para Sobrevivir, Instrumentales para Integrarse, Avanzadas para Disfrutar».","Escalas por número de cosas: Katz 6 básicas, Lawton 8 instrumentales, Barthel 10 (sobre 100 puntos).","Orinales: «cuña plana para ellas y para hacer caca; botella para el pis de ellos».","Accesibilidad DALCO = Deambular, Agarrar (aprehensión), Localizar, COmunicar."],
cards:[
 ["AVD","Actos cotidianos que permiten a una persona desenvolverse en su día a día."],
 ["AVDB","Básicas, de autocuidado: comer, vestirse, asearse, controlar esfínteres, desplazarse."],
 ["AVDI","Instrumentales, para adaptarse al medio: dinero, medicación, transporte, cocinar, teléfono."],
 ["AVDA","Avanzadas: ocio, participación social, trabajo y educación."],
 ["Terapia ocupacional","Disciplina sociosanitaria que promueve la salud con el uso terapéutico de actividades de cuidado, laborales y lúdicas."],
 ["Valoración de las habilidades de la vida diaria","Evaluar en qué grado realiza cada AVD, si necesita ayuda y en qué medida."],
 ["3 técnicas de recogida de información","Recopilación documental y entrevistas, observación directa y escalas de valoración funcional."],
 ["Escala de la Cruz Roja","6 niveles según AVD, deambulación y continencia; sencilla pero poco precisa."],
 ["Índice de Katz","6 AVDB (aseo, vestido, retrete, movilidad, continencia, alimentación); valora el estado actual."],
 ["Índice de Barthel","10 AVD, de 0 a 100 puntos. 100 independiente, 0-20 dependencia total."],
 ["Barthel 61-90","Dependencia moderada."],
 ["Escala de Lawton y Brody","8 AVDI; tiene sesgo sociocultural y de género."],
 ["BVD","Baremo de valoración de la situación de dependencia (RD 174/2011, Ley 39/2006); lo usan los organismos oficiales."],
 ["4 contenidos del diagnóstico","Áreas deficitarias, tipo y cantidad de ayudas, factores limitantes y capacidades, y situaciones de riesgo."],
 ["Secuencia de técnicas en un programa de AVD","Preparación, instrucción verbal, modelado, encadenamiento, moldeado, role playing, automatización, generalización y seguimiento."],
 ["Producto de apoyo","Objeto, dispositivo o entorno creado o modificado para responder a limitaciones funcionales."],
 ["3 factores para elegir un producto de apoyo","La persona, las características del recurso y el entorno de uso."],
 ["Producto adaptado","Objeto modificado para que la persona lo use de forma autónoma (mango engrosado, velcro)."],
 ["Órtesis","Producto sanitario externo que modifica el sistema neuromuscular o el esqueleto (corsé, plantillas)."],
 ["Prótesis","Sustituye un órgano o estructura corporal; puede ser interna (cadera) o externa (audífono)."],
 ["Accesibilidad universal","Que cualquier persona pueda usar objetos, espacios y servicios de forma segura, cómoda y autónoma."],
 ["Requisitos DALCO","Deambulación, aprehensión, localización y comunicación."],
 ["Diseño universal","Concebir desde el origen productos y entornos que todos puedan usar sin adaptación posterior."],
 ["7 principios del diseño universal","Uso igualitario, flexibilidad, simplicidad, información perceptible, tolerancia a errores, poco esfuerzo y dimensiones apropiadas."],
 ["3 roles del profesional en AVD","Instructor, cooperador y observador o supervisor."],
 ["Objetivo educativo vs. asistencial","Educativo: favorecer la autonomía. Asistencial: hacerlo por la persona. Se prioriza el educativo."],
 ["Estructura de una sesión de AVD","Inicio, presentación de objetivos, entrenamiento y finalización."],
 ["Orden del baño en cama","Cara y cuello, parte superior, parte inferior y genitales."],
 ["¿Por qué secar bien los pliegues?","La humedad produce maceraciones y favorece las úlceras."],
 ["Cuña vs. botella","Cuña (plana): micción de mujeres y defecación. Botella: micción de hombres."],
 ["Bragas-pañal vs. pañal","Bragas-pañal: fugas leves. Pañal: incontinencia consolidada."],
 ["Vestir con un miembro afectado","Se empieza a vestir por el miembro afectado."],
 ["Vestir a una persona encamada","Primero la mitad inferior, luego la superior, ajustar, abrochar y calzar."],
 ["3 funciones de la comida","Nutrir, orientar en el tiempo y ser un acto social."],
 ["Altura correcta de la mesa","A la altura de los codos, con la comida dentro del campo visual."],
 ["3 aspectos de la salud en AVD","Prevención, toma correcta de medicación y seguimiento y autocontrol."],
 ["Pastillero","Dispensador diario o semanal que ayuda a no equivocarse con las tomas."],
 ["3 barreras de la brecha digital","Económicas, competenciales y de accesibilidad."],
 ["Adaptación del entorno","Modificaciones del ambiente físico para que la persona haga las AVD de forma segura e independiente."],
 ["¿Qué estancias se adaptan primero?","Las de más riesgo: el baño y la cocina."],
 ["Domótica","Tecnología aplicada a la vivienda para automatizar acciones y mejorar la seguridad."]
],
quiz:[
 ["Leer, tomar la medicación y usar el transporte público son AVD…",["Instrumentales","Básicas","Avanzadas","Laborales"],"Las AVDI sirven para adaptarse al medio e integrarse."],
 ["¿Qué escala valora 10 AVD con una puntuación de 0 a 100?",["Índice de Barthel","Índice de Katz","Escala de Lawton y Brody","Escala de la Cruz Roja"],"Barthel: 100 independencia, 0-20 dependencia total."],
 ["¿Qué escala valora solo actividades instrumentales?",["Lawton y Brody","Katz","Barthel","Cruz Roja"],"Lawton y Brody evalúa ocho AVDI."],
 ["El índice de Katz considera dependiente a quien hace la actividad con supervisión porque…",["Valora el estado actual, no la capacidad","Siempre exagera","Solo se usa con niños","Solo mide AVDI"],"Katz mira lo que la persona hace ahora, no lo que podría hacer."],
 ["¿Qué escala es muy rápida pero poco precisa en dependencias leves y moderadas?",["Cruz Roja","Barthel","BVD","Lawton y Brody"],"La de la Cruz Roja es sencilla pero limitada para diagnosticar."],
 ["¿Qué instrumento usan los organismos oficiales para reconocer prestaciones de dependencia?",["El BVD","El índice de Katz","La escala de Lawton y Brody","Una pauta de observación"],"El baremo de valoración de la situación de dependencia (RD 174/2011)."],
 ["Un corsé o unas plantillas ortopédicas son…",["Órtesis","Prótesis internas","Productos adaptados","Mobiliario adaptado"],"Las órtesis modifican el sistema neuromuscular o el esqueleto desde fuera."],
 ["Los requisitos DALCO son…",["Deambulación, aprehensión, localización y comunicación","Dieta, alimentación, limpieza y cocina","Diseño, accesibilidad, lectura y control","Dependencia, autonomía, libertad y convivencia"],"Son los cuatro ámbitos de la accesibilidad."],
 ["En la fase de aprendizaje, el profesional que da apoyos e indicaciones actúa como…",["Cooperador","Instructor","Supervisor","Evaluador externo"],"El instructor actúa al inicio y el supervisor cuando ya lo hace casi bien."],
 ["La intervención en AVD debe ser prioritariamente…",["Educativa, para favorecer la autonomía","Asistencial, haciéndolo por la persona","Solo médica","Solo familiar"],"No hay que hacer nada que la persona pueda hacer por sí misma."],
 ["En el baño en cama, ¿qué se lava al final?",["Los genitales","La cara","La espalda","Los brazos"],"Orden: cara y cuello, parte superior, parte inferior y genitales."],
 ["¿Qué orinal se usa para la micción de los hombres?",["El de botella","La cuña","El orinal plano","Un empapador"],"La cuña sirve para la micción de las mujeres y para defecar."],
 ["Al vestir a alguien con un brazo afectado, se empieza…",["Por el brazo afectado","Por el brazo sano","Por los zapatos","Por la ropa interior"],"Se viste primero el miembro afectado y se desviste al revés."],
 ["¿A qué altura debe quedar la mesa al comer?",["A la altura de los codos","A la altura de la cintura","A la altura del pecho","Lo más baja posible"],"Así se mantiene una buena postura con la comida a la vista."],
 ["¿Qué estancias se adaptan primero en un domicilio?",["Baño y cocina","Salón y dormitorio","Terraza y garaje","Pasillo y recibidor"],"Son las que suponen más riesgo de accidentes."],
 ["¿Qué barrera de la brecha digital se refiere a no saber usar los aparatos?",["Competencial","Económica","De accesibilidad","Arquitectónica"],"Las barreras competenciales se resuelven con alfabetización digital."],
 ["Comparar las puntuaciones de Barthel cada 6 meses sirve para la evaluación…",["Del progreso","Inicial","Del equipo profesional","De la satisfacción"],"Permite ver la evolución de la funcionalidad."]
]
});

U("promocion", {
n:6, title:"Orientación y movilidad",
secs:[
 ["6.1. Las habilidades de orientación y movilidad","Nos permiten orientarnos en el espacio y en el tiempo, desplazarnos con seguridad, alcanzar y manipular objetos y anticipar lo que va a pasar. Condicionan muchísimo que una persona haga las AVD de forma independiente.",
  ["Componente sensorial: detectar información sobre el espacio y el entorno (qué tengo al alcance, con quién estoy).","Componente cognitivo: interpretar esa información y tomar conciencia de la posición en el espacio y el tiempo.","Componente físico: hacer movimientos coordinados para cambiar de postura y trasladarse.","Lo sensorial y lo cognitivo se relacionan con la orientación; lo físico, con la movilidad."]],
 ["6.1.1. La orientación","La orientación es el proceso cognitivo que permite establecer y actualizar la posición que se ocupa en el espacio y el tiempo gracias a la información sensorial.",
  ["Orientación espacial: ubicarse en términos absolutos («estoy en casa»), relativos («encima de»), respecto a una posición pasada («vengo de…») o de destino («voy a…»).","Conceptos que exige: corporales (partes del cuerpo y sus movimientos), espaciales (cerca, lejos, derecha, izquierda; grande, pequeño) y ambientales (calzada, acera, semáforo; materiales; húmedo, móvil).","Tipos de espacio: presente o tangible (el que alcanzan los sentidos; en videntes, el campo visual), abstracto (se representa mentalmente) y social (organizado y compartido con otras personas).","Orientación temporal: reconocer el momento presente (hora, día, mes, estación), su relación con el pasado y el futuro, y las actividades del día según un horario.","Tiempo objetivo: transcurre igual para todos y se mide con instrumentos. Tiempo subjetivo: el que percibe cada persona según su interés o motivación.","El tiempo es inmaterial, pero se objetiva con ritmos: en personas dependientes, las rutinas diarias (sueño, comidas, aseo)."]],
 ["6.1.2. La movilidad","La movilidad es la capacidad de modificar la posición del cuerpo o de sus partes y de desplazarse en el entorno. El BVD la valora en tres bloques: cambiar y mantener la posición del cuerpo, desplazarse dentro del hogar y fuera de él.",
  ["Movilización: cambio de postura sin cambiar de superficie ni de lugar. Pasiva (la persona no puede hacerlo sola; el personal la realiza) o asistida (puede, pero con ayuda o supervisión).","Transferencia: movilización en la que el cuerpo cambia de superficie de apoyo (de la cama a la silla de ruedas). Puede ser autónoma o asistida, con tabla de transferencia o disco giratorio.","Desplazamiento: movimiento de un lugar a otro. Depende del espacio (conocido o no, barreras), del objetivo y de la distancia y complejidad del trayecto.","Niveles de ayuda en el desplazamiento: traslado (necesita ayuda para deambular), guía y acompañamiento (casi autónomo, pequeños apoyos), movilidad interior autónoma (en casa o en el centro, ligada a las AVD) y movilidad exterior autónoma (ligada a las AVDI; depende de la proximidad y de si el entorno es conocido)."]],
 ["6.1.3. Limitaciones de la orientación y la movilidad","Pueden reducir mucho la autonomía. Las demencias también afectan a la orientación.",
  ["Orígenes: factores congénitos (parálisis cerebral, espina bífida, déficits visuales o auditivos), accidentes, enfermedades (esclerosis múltiple, Parkinson, ictus) y deterioro por la edad (artrosis).","Dificultades al interactuar con el medio: de maniobra (acceder y moverse por los espacios), para salvar desniveles (bordillos, escaleras), de alcance (manual o visual; en silla de ruedas disminuye el campo de visión), de percepción, de orientación y de control corporal (equilibrio en miembros inferiores, manipulación en superiores).","Por colectivos (Doc. 6.1): con andador o bastón, riesgo de caídas y trayectos cortos; en silla de ruedas, imposibilidad de superar escaleras y pasos estrechos; con discapacidad visual, dificultad para detectar obstáculos y leer señales; con discapacidad auditiva, no identificar timbres o alarmas; con discapacidad cognitiva, desorientación espacial y temporal."]],
 ["Barreras arquitectónicas","Una barrera arquitectónica es cualquier elemento que dificulta o impide el acceso a un espacio o el desplazamiento por él. Afectan sobre todo a personas en silla de ruedas, pero también a quien lleva muletas, un carrito de la compra o un cochecito de bebé.",
  ["Urbanísticas (BAU): en espacios públicos: desniveles sin rampa, aceras estrechas, mobiliario urbano que estorba, pavimentos irregulares, bordillos.","En la edificación (BAE): dentro de edificios: puertas difíciles, escaleras, pasos estrechos, mostradores altos, lavabos sin barras.","En el transporte (BAT): autobuses sin rampa, mucha distancia entre andén y vagón, estaciones sin ascensor.","En la comunicación (BC): semáforos sin sonido, ascensores sin braille, señales con letra pequeña o compleja.","El programa de entrenamiento sigue cuatro fases: valoración, planificación, ejecución y evaluación."]],
 ["6.2. Valoración de las habilidades de orientación y movilidad","La persona necesita capacidades físicas y cognitivas suficientes y buena predisposición. Se recoge información y se elabora un diagnóstico. Se necesitan control motor grueso (postura, marcha, equilibrio), fino (manipulación), capacidades cognitivas (comprensión espaciotemporal, memoria) y perceptivas.",
  ["Orientación: identificar dónde y cuándo está, proyectar acciones pasadas y futuras inmediatas, y ordenar y recordar elementos del espacio o ritmos de actividades.","Movilidad: qué movimientos puede hacer (solo, con productos de apoyo o con ayuda), el esfuerzo que le suponen y el tiempo o ritmo que necesita.","Actitud y aptitud para aprender. Si son deficitarias, objetivos más modestos o un trabajo previo de preparación.","Instrumentos: recopilación documental, entrevistas (componentes físico, psicológico y social), observación directa con tablas de registro y escalas estandarizadas de AVD (Cruz Roja, Katz, Barthel, Lawton y Brody, BVD). La orientación se evalúa con escalas cognitivas."]],
 ["6.3. Planificación del programa","Se formulan objetivos según las necesidades detectadas; la mayoría de actividades combinan objetivos de ambas áreas. En movilidad exterior, también accesibilidad urbana y del transporte.",
  ["Objetivos de movilidad: transferencia silla-cama autónoma, prevenir úlceras por presión, favorecer la deambulación, manejar la silla de ruedas, mantener la funcionalidad.","Objetivos de orientación: identificar puntos de referencia, interpretar la señalización, planificar recorridos, saber qué actividad toca en cada momento.","Técnicas de modificación de conducta: instrucciones verbales, modelado, moldeado, encadenamiento, refuerzos, instigadores y retroalimentación; tareas para casa y seguimiento.","Técnicas de orientación: conceptos espaciotemporales en situaciones cotidianas (arriba-abajo; ayer, hoy, mañana; la Navidad), aprendizaje de itinerarios, planificación de eventos y estimulación cognitiva (orientación a la realidad, reminiscencia).","Técnicas de movilidad: movilización (personas inmovilizadas), transferencia y desplazamiento (autónomo, supervisado o con ayuda)."]],
 ["6.3.3. Recursos para la orientación","Instrumentos que facilitan la orientación y sirven para el entrenamiento y el seguimiento.",
  ["Productos de apoyo para la orientación: señalización acústica, visual y táctil (mapas táctiles, planos 3D, braille) y bastones guía.","Bastones para discapacidad visual (Doc. 6.5): de aluminio con contera rodante. Blanco: ceguera. En España, rayas rojas y blancas: sordoceguera (la Federación Mundial usa rojas y negras). Verde: baja visión en algunos países como Argentina.","Tableros de orientación: información básica estructurada (día, fecha, estación, lugar, tiempo que hace); se usan al inicio de las actividades.","Relojes y calendarios grandes, de lectura fácil y en lugares visibles.","Horarios con las actividades, la hora y el lugar: imprescindibles en centros.","Agendas personales: favorecen el autocontrol, la seguridad y la sensación de autonomía."]],
 ["6.3.3. Productos de apoyo a la movilidad","Facilitan la movilidad de la persona y el trabajo de quien la atiende (clase 12 de la ISO).",
  ["Bastones: para quien conserva cierta estabilidad y equilibrio; empuñadura y longitud adecuadas y contera de caucho.","Muletas: suplen la falta de una pierna o, de forma transitoria, cuando no se puede apoyar el pie.","Andadores con patas: hay que levantarlos para avanzar, requieren fuerza.","Andadores rodantes: piden menos fuerza pero son más inestables; para personas débiles con buen equilibrio.","Sillas de ruedas: de tracción manual (aros o empujadas) o motorizadas. Se eligen según la capacidad de manejo, la complexión y las actividades; pueden necesitar arneses o cinchas.","Para transferencias y giros: tablas de transferencia, sábanas deslizantes, discos de rotación, cinturones de transferencia, escalas de cuerda a los pies de la cama, rampas y plataformas.","Grúas: móviles (las más versátiles) o fijas (pared, suelo o techo; de la cama al baño, sin cambiar de estancia). Requieren un arnés cómodo."]],
 ["6.3.4. El entorno y la reestructuración ambiental","El entorno debe ser seguro, funcional y accesible, comprensible (señales perceptibles y bien situadas) y agradable (temperatura, luz, limpieza, decoración acogedora, separar espacios comunes y privados).",
  ["Adaptar la unidad de convivencia: pasamanos y barras, manillas mejor que pomos, persianas motorizadas, ascensores y salvaescaleras, pavimentos antideslizantes y suelos táctiles con itinerarios.","Reestructuración ambiental: intervenciones en el entorno habitual de la persona para favorecer su autonomía; crucial con demencias o discapacidad intelectual.","Wayfinding (Doc. 6.6): combinar flechas, pictogramas, colores, planos hápticos, texturas, braille y tecnología para que alguien entienda un espacio desconocido (aeropuertos, hospitales). Principios: identidad propia para cada espacio, rutas bien estructuradas, solo información relevante, simplificar las decisiones y textos simples con letra de palo seco.","Simbolización: usar imágenes (pictogramas, dibujos, fotos) para identificar espacios, tareas, ubicación de objetos y acontecimientos (una tarta para un cumpleaños).","Señalización: señales visuales (a la altura de la vista), acústicas (sin perturbar la tranquilidad) y táctiles o hápticas (braille, relieve, texturas). Indican itinerarios, accesos, riesgos, emergencias y localizaciones.","Cuidado con la hipersensibilidad sensorial (TEA) y el daltonismo: usar tramas además de colores."]],
 ["6.4.1. Ejecución de actividades de orientación","Se entrena con actividades formales (sistemáticas) e interacciones informales (indicaciones durante la actividad). Debe primar lo educativo sobre lo asistencial.",
  ["Conceptos de situación: al inicio de la sesión, decir el día, el momento, el mes, la estación, el lugar y el tiempo; recordar lo pasado y anticipar lo siguiente; al final, planificar el día o la semana.","Planificación de recorridos: aprender puntos de referencia significativos (un árbol, una parada, una tienda) y las distancias entre ellos (en pasos, metros o tiempo).","Fases: recorrer juntos el trayecto y elegir referencias (en plano o maqueta); repetir con el profesional primero como guía, luego como acompañante y por último como supervisor; y finalmente hacerlo solo.","Debe saber resolver problemas (pedir ayuda si se desorienta) e interpretar horarios del transporte.","Planificación de eventos: los personales en agendas individuales; los colectivos (Navidad, fiestas) en almanaques y horarios."]],
 ["6.4.2. Movilizaciones","No suponen cambiar de superficie. Pueden ser cambios posturales (prevenir úlceras, comodidad, hacer la cama) o pasos previos para otras actividades (subir hacia la cabecera, llevar al lado, sentar en el borde).",
  ["Posiciones (Doc. 6.7): decúbito supino (boca arriba), prono (boca abajo, cabeza de lado), lateral, Sims (lateral izquierdo con la pierna derecha flexionada), Fowler (semisentada a 45°) y Trendelenburg (supino con las piernas más altas que la cabeza).","Antes: evaluar y planificar, explicar el procedimiento, pedir colaboración y tener los productos preparados.","Durante: ergonomía e higiene postural, usar productos de apoyo o pedir ayuda, evitar caídas (barandillas), movimientos suaves sin tirones y respetar la intimidad.","Después: dejarla en una posición segura y cómoda (almohadas, sin arrugas en la ropa de cama).","Mecánica corporal (Doc. 6.8): cama a la altura de la cintura, pies separados para ampliar la base, acercarse a la persona, usar el cuerpo como contrapeso, flexionar las rodillas con la espalda recta y girar en bloque sin torcer el tronco. Siempre que se pueda, entre dos personas.","Supino a lateral: llevarla al borde contrario, brazo y pierna alejados cruzados, brazo de giro separado, y girar sujetando hombro y cadera.","Hacia la cabecera: si colabora, flexiona las piernas y se impulsa a la señal; si no colabora, dos profesionales la levantan por debajo de los hombros.","Desplazamiento lateral por segmentos: cuello y espalda, cintura y piernas.","Sentar en el borde: de lado, un brazo tras el hombro y otro bajo las corvas, levantar el tronco mientras se bajan las piernas."]],
 ["6.4.3. Transferencias","Tienen más riesgo que las movilizaciones porque cambian de plano y de superficie. La silla de ruedas debe estar junto a la cama, frenada y con los reposapiés plegados.",
  ["Persona autónoma: silla al mismo nivel, retirar el reposabrazos, una mano en el reposabrazos y otra en la cama y desplazarse con un impulso (mejor con tabla de transferencia). Sirve también para pasar a otra silla o al coche.","Persona que colabora: el profesional, de frente con las piernas separadas y flexionadas, le rodea la cintura (o usa cinturón), ella pone los brazos en sus hombros; a la señal la levanta en bloque, pivota y la sienta despacio.","Persona que no colabora: dos profesionales, uno detrás sujetando los antebrazos por debajo de las axilas y otro delante por los muslos; a la señal la trasladan en bloque.","Enderezar a alguien sentado: desde detrás de la silla, brazos bajo las axilas sujetando sus muñecas, tirar hacia arriba y hacia atrás.","Grúa: colocar el arnés (cintas largas bajo los muslos y cortas bajo los hombros), anclar, izar suavemente, trasladar despacio vigilando el balanceo, descender y retirar el arnés."]],
 ["6.4.4. Deambulación","Según la ayuda: con bastón, con andador, con ayuda de otra persona o en silla de ruedas.",
  ["Bastón: siempre en el lado de la pierna más débil. Al andar: bastón, pierna fuerte y luego pierna débil. Al subir y bajar escaleras: bastón, pie débil y después pie fuerte.","Andador: agarrar firme, adelantarlo un poco, avanzar un pie y luego el otro; el cuerpo siempre dentro del perímetro del andador.","Con ayuda: pasar un brazo por la espalda sujetando la cintura y con la otra mano el antebrazo; si está muy débil, que alguien siga detrás con una silla de ruedas. Si da muy pocos pasos, el profesional va de frente, de espaldas, sujetando sus antebrazos.","Silla de ruedas en un escalón: perpendicular, levantar las ruedas delanteras pisando la barra de soporte y subir o bajar con las traseras haciendo contrapeso.","Escaleras con silla: mejor rampas o ascensores; si no, entre dos personas: se sube de espaldas y se baja de frente."]],
 ["6.4.5. Discapacidad visual","Los itinerarios se diseñan alrededor de los espacios (siguiendo paredes), no cruzándolos, y se segmentan en acciones. Además, se entrenan los demás sentidos (sonidos, olores como referencia).",
  ["Prebastón, en lugares conocidos: rastreo (dorso de la mano rozando la pared a la altura de la cadera), alineación (usar un objeto conocido como referencia), protección baja o diagonal (brazo cruzado delante, palma abajo), protección alta (antebrazo ante la cara a unos 90° y 10 cm) y encuadre (espalda contra un punto para ir en línea recta por espacios abiertos).","Técnica de Hoover: la más habitual en exteriores; índice extendido en el mango, brazo centrado a la altura del ombligo, barrido rítmico de muñeca de lado a lado; el bastón toca a la derecha mientras avanza el pie izquierdo.","Técnica de deslizamiento: en interiores, bastón en diagonal con la contera pegada a la pared.","Técnica de toque o de dos puntos: terrenos abruptos, arco con un toque en cada extremo.","Escaleras: colocarse a la derecha, medir el escalón con el bastón y llevarlo siempre un peldaño por delante.","Guía vidente: la persona va medio paso por detrás, sujetando el brazo del guía por encima del codo; en pasos estrechos el guía lleva el brazo hacia atrás; en escaleras, avisa, se detiene ante el primer escalón y va siempre un peldaño por delante. Nunca dejarla en campo abierto.","Perro guía: para ceguera total o restos no funcionales. Exige un entrenamiento que no todos superan y cuidar del perro; el perro no decide sobre la orientación ni la seguridad."]],
 ["6.5. Evaluación del programa","Usa los mismos instrumentos que la valoración (entrevistas, escalas y sobre todo registros de observación con indicadores basados en los objetivos).",
  ["Resultados: si se han logrado los objetivos y en qué medida (p. ej., hace sola las transferencias cama-silla, silla-inodoro, silla-coche, silla-sofá).","Actividades: según sus objetivos específicos, en varias fases, hasta consolidar el hábito (p. ej., identifica puntos de referencia, cruza con seguridad, pregunta si se desorienta).","Actuación profesional: autoevaluación de cada miembro del equipo.","Las conclusiones se recogen en un informe para la persona y su familia, muy útil si se deriva a otro servicio."]]
],
trucos:["El bastón va siempre del lado débil. Al andar: «bastón, fuerte, débil». En escaleras: «bastón, débil, fuerte».","Barreras «BAU-BAE-BAT-BC»: Urbanísticas (calle), Edificación (dentro), Transporte y Comunicación.","Silla de ruedas por escaleras: se sube de espaldas y se baja de frente.","Movilización = misma superficie; transferencia = cambia de superficie; desplazamiento = cambia de lugar."],
cards:[
 ["3 componentes de las habilidades de orientación y movilidad","Sensorial, cognitivo y físico."],
 ["Orientación","Proceso cognitivo para establecer y actualizar la posición en el espacio y el tiempo con la información sensorial."],
 ["3 tipos de conceptos de orientación espacial","Corporales, espaciales y ambientales."],
 ["Espacio presente, abstracto y social","Presente: al alcance de los sentidos. Abstracto: se imagina. Social: organizado y compartido."],
 ["Tiempo objetivo vs. subjetivo","Objetivo: igual para todos y medible. Subjetivo: como lo percibe cada persona."],
 ["¿Cómo se objetiva el tiempo en personas dependientes?","Con ritmos: las rutinas diarias de sueño, comidas y aseo."],
 ["Movilidad","Capacidad de modificar la posición del cuerpo o sus partes y de desplazarse en el entorno."],
 ["Movilización pasiva vs. asistida","Pasiva: la persona no puede y la hace el personal. Asistida: puede, con ayuda o supervisión."],
 ["Transferencia","Movilización en la que el cuerpo cambia de superficie de apoyo."],
 ["Desplazamiento","Movimiento de una persona de un lugar a otro del espacio."],
 ["4 orígenes de las limitaciones","Factores congénitos, accidentes, enfermedades y deterioro por la edad."],
 ["Barrera arquitectónica","Cualquier elemento que dificulta o impide el acceso a un espacio o el desplazamiento por él."],
 ["4 tipos de barreras arquitectónicas","Urbanísticas (BAU), en la edificación (BAE), en el transporte (BAT) y en la comunicación (BC)."],
 ["Un semáforo sin señal sonora es una barrera…","En la comunicación (BC)."],
 ["Tablero de orientación","Soporte con día, fecha, estación, lugar y tiempo; se usa al inicio de las actividades."],
 ["Bastón blanco / rojo y blanco","Blanco: ceguera. Con rayas rojas y blancas (España): sordoceguera."],
 ["Andador con patas vs. rodante","Con patas: hay que levantarlo, requiere fuerza. Rodante: menos fuerza pero más inestable."],
 ["Grúa móvil vs. fija","Móvil: versátil, se lleva a cualquier sitio. Fija: anclada, de un punto a otro sin cambiar de estancia."],
 ["4 características del entorno adecuado","Seguro, funcional y accesible, comprensible y agradable."],
 ["Reestructuración ambiental","Intervenciones en el entorno habitual de la persona para favorecer su autonomía."],
 ["Wayfinding","Sistemas de señales, colores, planos y tecnología para entender y recorrer espacios desconocidos."],
 ["Simbolización","Uso de pictogramas, dibujos o fotos para identificar espacios, tareas, objetos y acontecimientos."],
 ["3 tipos de señales","Visuales, acústicas y táctiles o hápticas."],
 ["2 conceptos clave para aprender recorridos","Los puntos de referencia y las distancias entre ellos."],
 ["Rol del profesional al enseñar un recorrido","Primero guía, luego acompaña y al final solo supervisa."],
 ["Decúbito supino / prono","Supino: boca arriba. Prono: boca abajo."],
 ["Posición de Fowler","Semisentada, con una inclinación de 45°."],
 ["Posición de Trendelenburg","Boca arriba con las piernas más altas que la cabeza."],
 ["Posición de Sims","Decúbito lateral izquierdo con la pierna derecha flexionada."],
 ["Principios de mecánica corporal","Cama a la cintura, base amplia, acercarse a la persona, rodillas flexionadas con espalda recta y girar en bloque."],
 ["¿Por qué las transferencias tienen más riesgo?","Porque implican un cambio de plano y de superficie de apoyo."],
 ["Silla de ruedas antes de una transferencia","Junto a la cama, con los frenos puestos y los reposapiés plegados."],
 ["Fases de la transferencia con grúa","Colocar el arnés, anclar, izar, trasladar, descender y retirar el arnés."],
 ["¿En qué lado se lleva el bastón?","En el lado de la pierna más débil."],
 ["Secuencia de la marcha con bastón","Bastón, pierna fuerte y luego pierna débil."],
 ["Escaleras con silla de ruedas","Entre dos personas: se sube de espaldas y se baja de frente."],
 ["Técnica de rastreo","Prebastón: dorso de la mano rozando la pared a la altura de la cadera."],
 ["Técnica de Hoover","Bastón en exteriores con barrido rítmico de lado a lado, coordinado con los pasos."],
 ["Guía vidente","La persona ciega va medio paso detrás, sujetando el brazo del guía por encima del codo."],
 ["Perro guía","Para ceguera total o restos no funcionales; exige entrenamiento y cuidar al perro."]
],
quiz:[
 ["El componente que interpreta la información y da conciencia de la posición es el…",["Cognitivo","Sensorial","Físico","Social"],"El sensorial capta la información y el cognitivo la interpreta."],
 ["«Vengo de la farmacia» es orientación espacial respecto a…",["Una posición pasada","Una posición de destino","Términos relativos","Términos absolutos"],"Se relaciona la ubicación con una posición anterior."],
 ["Cambiar a alguien de postura en la cama sin moverlo de superficie es…",["Una movilización","Una transferencia","Un desplazamiento","Una deambulación"],"La transferencia implica cambiar de superficie."],
 ["Pasar de la cama a la silla de ruedas es…",["Una transferencia","Una movilización","Un traslado de guía","Un cambio postural"],"El cuerpo cambia de superficie de apoyo."],
 ["Un autobús sin rampa de acceso es una barrera…",["En el transporte (BAT)","Urbanística (BAU)","En la edificación (BAE)","En la comunicación (BC)"],"Las BAT impiden usar los medios de transporte."],
 ["¿Qué bastón indica sordoceguera en España?",["Rayas rojas y blancas","Blanco","Verde","Rayas rojas y negras"],"El blanco indica ceguera; las rayas rojas y negras las usa la Federación Mundial."],
 ["¿Qué andador es mejor para alguien débil pero con buen equilibrio?",["El rodante","El de patas","Unas muletas","Un bastón de tres patas"],"El rodante requiere menos fuerza aunque es más inestable."],
 ["Usar pictogramas para indicar el comedor o la peluquería es…",["Simbolización","Señalización acústica","Wayfinding táctil","Encuadre"],"La simbolización usa imágenes representativas."],
 ["Al enseñar un recorrido, el profesional al final…",["Solo supervisa","Guía todo el tiempo","Hace el recorrido por la persona","Deja de intervenir desde el primer día"],"Primero guía, luego acompaña y por último supervisa."],
 ["La posición semisentada a 45° se llama…",["Fowler","Trendelenburg","Sims","Decúbito prono"],"Trendelenburg es boca arriba con las piernas elevadas."],
 ["Según la mecánica corporal, para levantar a una persona hay que…",["Flexionar las rodillas y mantener la espalda recta","Doblar la espalda","Torcer el tronco al girar","Tener los pies juntos"],"Se levanta extendiendo las piernas, con la espalda recta y girando en bloque."],
 ["Antes de una transferencia, la silla de ruedas debe estar…",["Frenada y con los reposapiés plegados","Sin frenos para moverla fácil","Lejos de la cama","Con los reposapiés bajados"],"Así se evitan caídas y tropiezos."],
 ["¿En qué lado se lleva el bastón?",["En el de la pierna más débil","En el de la pierna fuerte","Siempre en la mano derecha","Alternando cada día"],"El peso descansa en la pierna fuerte y el bastón."],
 ["Para bajar escaleras con una silla de ruedas entre dos personas, se baja…",["De frente","De espaldas","De lado","Con las ruedas delanteras levantadas por una sola persona"],"Se sube de espaldas y se baja de frente."],
 ["¿Qué técnica de bastón es la más habitual en exteriores?",["Técnica de Hoover","Técnica de rastreo","Técnica de deslizamiento","Técnica de encuadre"],"El barrido rítmico detecta obstáculos y huecos."],
 ["Con un guía vidente, la persona ciega se coloca…",["Medio paso por detrás, sujetando el brazo por encima del codo","Delante del guía","De la mano del guía","Detrás, agarrada a la cintura"],"El movimiento del brazo del guía le informa de giros y desniveles."]
]
});

U("promocion", {
n:7, title:"Entrenamiento en habilidades sociales",
secs:[
 ["7.1. Las habilidades sociales","Somos seres biopsicosociales: necesitamos relacionarnos y formar parte de un grupo. Las habilidades sociales son un conjunto de capacidades y destrezas que nos ayudan a funcionar con mayor eficacia en las relaciones interpersonales. Quien tiene dificultades vive las relaciones con ansiedad, lo que puede causar frustración, inadaptación y baja autoestima. Se pueden aprender o perfeccionar con entrenamiento.",
  ["Inteligencia emocional (Doc. 7.1): la popularizó Daniel Goleman en 1995 (antes la usaron Mayer y Salovey en 1990). Es la capacidad de reconocer y manejar las emociones.","Aptitudes personales: autoconsciencia (reconocer las propias emociones), autorregulación (regular impulsos y estados de ánimo) y motivación (tendencias emocionales que guían hacia las metas).","Aptitudes sociales: empatía (conciencia de los sentimientos y necesidades de los demás) y habilidades sociales (inducir en los demás respuestas deseadas)."]],
 ["7.1.1. Tipología de habilidades (Goldstein)","Arnold Goldstein clasifica 50 habilidades sociales en seis grupos según su finalidad.",
  ["I. Básicas: las primeras que se adquieren; escuchar, iniciar y mantener una conversación, preguntar, dar las gracias, presentarse, presentar a otros, hacer un cumplido.","II. Avanzadas: estrategias para las relaciones; pedir ayuda, participar, dar y seguir instrucciones, disculparse, convencer.","III. Afectivas: identificar y gestionar emociones propias y ajenas; conocer y expresar sentimientos, comprender los de los demás, enfrentarse al enfado de otro, expresar afecto.","IV. Alternativas a la agresión: evitar o gestionar el conflicto sin violencia; pedir permiso, compartir, ayudar, negociar, autocontrol, defender los derechos, responder a bromas, no entrar en peleas.","V. Para hacer frente al estrés: formular y responder a una queja, deportividad, resolver la vergüenza, responder al fracaso o a una acusación, presiones de grupo.","VI. De planificación: proyectarse en el futuro y resolver problemas (tomar decisiones, fijar objetivos)."]],
 ["7.1.2. Componentes conductuales","La conducta social tiene componentes conductuales, cognitivos y fisiológicos. Los conductuales son los más fáciles de observar y entrenar, y son de tres tipos: verbales, no verbales y afectivos.",
  ["Componentes verbales: elementos del código lingüístico. En toda comunicación se pierde información entre lo que el emisor quiere decir y lo que el receptor interpreta (Doc. 7.3: lo que quiere expresar, lo que transmite, lo que oye, lo que escucha, lo que entiende, lo que interpreta). Hay que adaptar el discurso a la persona para reducir esa pérdida.","Funciones del lenguaje no verbal: ratificar el mensaje, enfatizarlo, sustituir palabras (asentir), contradecirlo (sonrisa irónica) y regular la interacción (pedir o ceder el turno).","Paralenguaje: calidad de la voz (tono, intensidad, timbre), prosodia (entonación), fluidez (velocidad, pausas, silencios), vocalizaciones (mmm) e indicadores de turno.","Kinesia o lenguaje corporal: mirada, expresión facial, gestos y postura.","Tipos de gestos (Doc. 7.4): reguladores (indican qué hacer: que empiece o repita), emblemas (significado conocido por todos: pulgar arriba), ilustradores (acompañan y aclaran: señalar) y adaptadores (automanipulaciones inconscientes: tocarse el pelo).","Proxémica: distancia pública (más de 3 m, grupos desconocidos), social (1,5-3 m, conversaciones no privadas), personal (0,5-1,5 m, temas confidenciales) e íntima (hasta 0,5 m, personas cercanas; incluye la zona íntima privada de contacto físico). En higiene y movilizaciones se invade la zona íntima: hacerlo con el máximo respeto.","Aspecto externo: higiene, ropa o peinado influyen en la aceptación de los demás.","Componentes afectivos: señales, casi siempre involuntarias, que expresan el grado de afinidad (simpatía o antipatía, calidez o frialdad); forman el mensaje afectivo."]],
 ["7.1.2. Componentes cognitivos y fisiológicos","Los cognitivos son los conocimientos y capacidades para percibir, procesar y usar la información en una situación comunicativa. Los fisiológicos son las reacciones orgánicas ante ella.",
  ["Competencias cognitivas: procesar información, resolver conflictos, mostrar empatía.","Constructos personales: cada uno interpreta según sus esquemas (alguien con depresión magnifica una señal negativa).","Expectativas: lo que cree que se espera de él o las consecuencias que tendrá su conducta.","Valores subjetivos de los estímulos: a unos les importa mucho el reconocimiento social y a otros no.","Sistemas de autorregulación: cómo se autoevalúa, se premia o se castiga.","Locus de control: externo (atribuye lo que le pasa a causas incontrolables: «el profe me tiene manía») o interno (a sí mismo: «he estudiado poco»).","Percepción de la situación: formalidad (más formal, más distante), distancia física y psicológica, privacidad, familiaridad, restricción (genera presión) y calidez (favorece el diálogo).","Distancia psicológica (Doc. 7.5): comunicación estereotipada («vaya frío»), datos impersonales, ideas y opiniones, sentimientos y emociones (nivel propio de la intervención) y compromiso personal (amistad íntima o pareja; se evita en la relación profesional).","Fisiológicos: sonrojarse, temblar, sudar, taquicardia al hablar en público; o reacciones desproporcionadas (rabietas, euforia), frecuentes en discapacidad intelectual. Al ganar competencia social, mejora su control."]],
 ["7.1.3. Capacidades para la competencia social","Facilitan la gestión de las relaciones y se influyen entre sí.",
  ["Empatía: capacidad de entender los sentimientos y emociones de otra persona desde su perspectiva. Permite comprender mejor los problemas, ampliar soluciones y equilibrar el propio punto de vista.","Escucha activa: atender al mensaje verbal y no verbal de otra persona con la intención de comprender lo que pretende comunicar, dando feedback de que se la escucha.","Asertividad: expresar sentimientos, emociones y pensamientos propios de forma libre y segura, sin privar a los demás de sus derechos, sin agresividad ni manipulación. No es tener siempre razón.","Estilo agresivo: no respeta los derechos ajenos e impone sus opiniones. Estilo pasivo o inhibido: no expresa lo que piensa ni defiende sus derechos. Ambos generan malestar; el asertivo mejora la autoestima y las relaciones.","Resolución de conflictos: capacidad de alcanzar acuerdos satisfactorios para las partes en una disputa. Requiere voluntad, diálogo y negociación. El conflicto no es negativo en sí: es una oportunidad si se resuelve bien."]],
 ["7.1.4. Dificultades en la competencia social","Habilidades deficitarias causan falta de aceptación, aislamiento o exclusión. Las habilidades deben entenderse en su contexto cultural (mirar a los ojos es correcto aquí pero no en todas las culturas).",
  ["Déficit en las habilidades: no se han aprendido por un ambiente pobre en estímulos o adverso (un niño al que no enseñaron a pedir permiso). La sobreprotección lo agrava en niños con discapacidad.","Interferencias (la habilidad existe pero algo impide usarla): experiencias pasadas negativas, bajas expectativas por baja autoestima (víctimas de violencia de género), falta de práctica (jubilación, pérdida de empleo, aislamiento sensorial), pérdida de facultades cognitivas, discapacidad intelectual (efusividad exagerada), alteraciones del pensamiento o del ánimo (depresión) y ansiedad.","En personas en riesgo social suelen coincidir déficit e interferencia."]],
 ["7.1.5. Programas de entrenamiento en habilidades sociales","Un programa de entrenamiento en habilidades sociales es el conjunto de actividades orientadas a dotar a la persona de destrezas para desenvolverse con mayor eficacia en distintos entornos sociales. Se usan en integración social, en educación y, en casos graves, en clínica. Mejoran las relaciones, reducen la ansiedad y el estrés y aumentan la autoestima.",
  ["Fases: valoración del déficit, planificación, ejecución y evaluación.","Pueden diseñarse para una persona o para un grupo que comparte dificultades."]],
 ["7.2. La valoración de las habilidades sociales","Decir «tiene déficit en habilidades sociales» no sirve para planificar: puede fallar en una habilidad o contexto y no en otros. Hay que evaluar cada habilidad en sus tres dimensiones (conductual, cognitiva y fisiológica).",
  ["Entrevista personal: mejor semiestructurada o abierta. Sirve para indagar el origen de la dificultad, conocer expectativas y motivación y ver su nivel de ejecución (discurso, apariencia, comportamiento). No se usa como única técnica.","Observación en situaciones simuladas: contexto ficticio relacionado con su realidad; bien estructurada, pero la persona puede fingir.","Observación natural: cómo actúa en situaciones cotidianas. En ambas: registros de observación y discreción. Esos registros sirven también para evaluar el progreso."]],
 ["7.2.3. Escalas estandarizadas","Evalúan aspectos conductuales, cognitivos e incluso fisiológicos.",
  ["ISRA (Inventario de situaciones y respuestas de ansiedad): Miguel Tobal y Cano Vindel, 1986. 224 ítems que evalúan por separado los tres componentes en 22 situaciones de cuatro tipos (evaluación, sociales, fóbicas y cotidianas), puntuadas de 0 a 4.","ERA (Escala reducida de ansiedad): versión de 17 ítems (1995) para cuando hay poco tiempo o bajo nivel cultural.","EMES (Escala multidimensional de expresión social): Vicente E. Caballo, 1987. EMES-C (cognitiva, 44 ítems: más puntuación, más pensamientos negativos) y EMES-M (motora, 64 ítems: menos puntuación, menos habilidades).","Cuestionario de apoyo social funcional Duke-UNC: 11 afirmaciones de 1 a 5; menos de 32 puntos indica apoyo social bajo. Mide el apoyo percibido, no el real.","EHS de Gismero (2000): 33 ítems y 6 factores: autoexpresión en situaciones sociales, defensa de los derechos como consumidor, expresión de enfado o disconformidad, decir no y cortar interacciones, hacer peticiones e iniciar interacciones positivas con el sexo opuesto. Más puntuación, más habilidad.","Otras (Doc. 7.9): Inventario de asertividad de Gambrill y Richey, de Rathus (RAS), FNES (miedo a la evaluación negativa), SADS (evitación y malestar social) y CHIS de Inés Monjas (niños y adolescentes)."]],
 ["7.3. La planificación del programa","La meta es que la persona sea lo más competente posible socialmente. Las reacciones físicas y emocionales no se controlan a voluntad, pero se entrenan actuando sobre su causa (autoestima) o su manifestación (relajación, ensayos).",
  ["Objetivos habituales: adquirir o perfeccionar habilidades y usarlas en el contexto adecuado; mejorar la comunicación; desarrollar empatía, escucha, asertividad y resolución de conflictos; gestionar emociones; mejorar autoestima y autoconfianza; aceptar las críticas como mejora; participar más en los grupos.","Diseño: fijar el marco temporal (p. ej., 18 sesiones de 50 minutos, martes y jueves), delimitar bloques de actividades con objetivos operativos, repartirlos en sesiones con título y cronograma (grupo, individual o familia) y planificar cada sesión con objetivo, actividades e indicadores.","Ejemplo de bloques (Doc. 7.15): «Cómo soy yo y cómo somos nosotros», «Hablando con encanto», «Me expreso con la cara y el cuerpo», «Escucho a los demás y los entiendo», «Acepto lo que dices, pero no lo comparto», «Halágame y te halago», «Te pido y me pides».","Ficha de sesión (Doc. 7.18): presentación, actividades (p. ej., «La entrega de vasos», «En los zapatos de otro» con inversión de roles), reflexión y tareas para casa, y cierre."]],
 ["7.3.3. Técnicas de intervención","Se usan técnicas de modificación de conducta (refuerzo, modelado, moldeado, encadenamiento) y cognitivas, pero sobre todo dos: dramatización y dinámicas de grupo.",
  ["Técnicas de dramatización: representar situaciones lo más reales y espontáneas posible para comprenderlas y vivirlas. Es útil grabarlas para analizarlas después.","Role playing: representar una situación concreta de la vida real; cada uno interpreta un personaje. Permite ensayar conductas y que el profesional detecte déficits. Fases: diseño, montaje del escenario, presentación (los demás reciben un registro de observación), representación (sin interrumpir salvo motivo) y discusión y cierre. Dura entre 45 minutos y una hora.","Interacción planificada: representación entre la persona usuaria y el profesional; a veces la persona no sabe que es simulada.","Inversión de roles: dos personas intercambian papeles y defienden la posición de la otra. Desarrolla empatía, autoconocimiento y flexibilidad.","Tareas de consolidación (Doc. 7.19): tareas sorpresa (cambiar elementos del escenario) y tareas de transición (puente hacia la vida real).","Dinámicas de grupo: técnicas vivenciales grupales que facilitan la socialización, la cohesión, el sentimiento de pertenencia y la tolerancia.","Tipos de dinámicas: de presentación, de conocimiento, de confianza y cohesión, de control de emociones y autoestima, de colaboración, de comunicación y de habilidades sociales."]],
 ["7.3.4. Recursos","No suelen hacer falta recursos especializados: basta un espacio amplio y estimulante, y a veces ordenador, música, vídeo o fotos.",
  ["Espacios en el domicilio: ordenados, con espacio para recibir visitas (o la habitación, si está encamada).","Espacios en centros: lugares tranquilos para recibir visitas sin ser observados, salas de estar con zonas de distinta privacidad y lugares para fiestas que puedan organizar los propios residentes.","Acompañamiento: estar junto a la persona y apoyar su integración (al incorporarse a un taller o a una residencia; en domicilio, a personas viudas con riesgo de aislamiento: visitas, compras, ocio).","TIC: la competencia digital es imprescindible; formar en navegación, correo y mensajería, videollamadas y participación virtual (foros, redes).","Asociacionismo: asociaciones de personas usuarias (defienden derechos: apoyo legal, psicológico, orientación) y de familiares (información, formación, apoyo emocional y orientación)."]],
 ["7.4. La ejecución del programa","Se suele hacer en grupo (con sesiones individuales de refuerzo). El grupo es un escenario más natural, permite aprender por observación y refuerzo de los demás, ofrece más variedad y da apoyo mutuo.",
  ["Secuencia de una sesión: recordatorio (repaso y tareas para casa; puede hacerlo un portavoz rotatorio), exposición, identificación de la actividad, definición del problema, identificación de soluciones, instrucciones, modelado, práctica (role playing), retroalimentación, tareas para casa (con autorregistro) y conclusión y cierre.","Actuación profesional: ser modelo de conducta asertiva y empática, asegurarse de que todos entienden, dar tiempo suficiente, que las actividades sean gratificantes y lúdicas, usar recursos (fotos, pictogramas, vídeos), atención individualizada, buen uso de refuerzos e implicar a la familia."]],
 ["7.4.3. Orientaciones para la comunicación","Muchas personas vulnerables tienen déficits para entender y ser entendidas.",
  ["Verbal: estructura del mensaje, dicción, fluidez (ni muy rápido ni muy lento, sin muletillas; pausas moderadas sí, prolongadas parecen desinterés y su ausencia, agresividad) e interacción (comprobar que se entiende y equilibrar los turnos: frenar al impulsivo y animar al que habla poco).","Voz: volumen adecuado y modulado (bajo transmite inseguridad; alto, prepotencia) y entonación variada.","Mirada: a los ojos, sin ser fija ni demasiado sostenida.","Expresión facial: congruente con el mensaje; si no, genera desconfianza.","Sonrisa: espontánea y natural, en el momento adecuado; favorece los mensajes afectivos.","Postura: acercamiento (inclinarse hacia delante, la más adecuada), retirada (rechazo), expansión (arrogante, agresiva) y contracción (inseguridad, ánimo bajo).","Gestualidad: que ayude a comprender el mensaje."]],
 ["Escucha activa, asertividad y conflictos","Orientaciones para entrenar estas capacidades.",
  ["Escucha activa: empatía (piedra angular), atención sin interrumpir, retroalimentación y lenguaje no verbal receptivo; hacer preguntas y mensajes de verificación (repetir o reformular).","Barreras de la escucha (Doc. 7.20): anticipación (pensar en lo que vamos a responder), prejuicio, filtrado (oír solo lo que interesa) y selección (atender solo a opiniones afines).","Asertividad: trabajar la autoestima (condición previa), expresar las propias opiniones, aceptar y valorar las críticas, gestionar emociones e impulsos y saber disculparse solo cuando toca. Técnicas: disco rayado, sándwich, banco de niebla, pregunta asertiva, enunciados en primera persona.","Negociación: las propias partes dialogan para llegar a un acuerdo. Mediación: interviene una persona imparcial que facilita los acuerdos.","Pasos: 1) reconocer el conflicto con voluntad de resolverlo; 2) definir posiciones (qué quiere) e intereses (motivos reales); 3) buscar opciones beneficiosas para ambos; 4) acuerdos sin ganadores ni perdedores.","Ayudan (Doc. 7.21): respeto, separar el problema de lo personal, escucha, empatía, autocontrol, humildad, asertividad y pedir perdón. Dificultan: insultos, ataques personales, generalizaciones, culpar al otro, inflexibilidad, amenazas y sacar otros problemas."]],
 ["7.5. La evaluación de la intervención","El objetivo final es que la persona use lo aprendido en situaciones reales y variadas, por eso la evaluación es continua.",
  ["Es más difícil que en otras habilidades (Doc. 7.22): variables poco objetivas, muchos elementos a la vez (verbales, paraverbales, no verbales, contexto), factores culturales que generan sesgos, la paradoja del observador (la conducta cambia al sentirse observado) y la variedad de situaciones.","Evaluación de las actividades: del resultado (indicadores de la actividad: saluda, toma y cede la palabra, cierra la conversación) y de las personas (puntualidad, apariencia, atención, respeto, gestión emocional).","Autoevaluación: la persona reflexiona sobre su actuación, sentimientos y utilidad (tras actuar, tras los comentarios o al ver la grabación).","Coevaluación: los compañeros valoran la actuación con un registro (mensaje, no verbal, distancia, asertividad, empatía, escucha).","Los profesionales también se autoevalúan.","Evaluación del programa: escala de estimación sobre los objetivos generales, o repetir las mismas escalas del inicio (ISRA, EMES, Duke-UNC, EHS) y comparar. Se hace un informe y se comunica a la persona y su familia."]]
],
trucos:["Inteligencia emocional de Goleman: 3 «para mí» (autoconsciencia, autorregulación, motivación) + 2 «para los demás» (empatía, habilidades sociales).","Distancias como círculos: íntima (medio brazo, <0,5 m), personal (hasta 1,5 m), social (hasta 3 m) y pública (más de 3 m).","Goldstein en 6: «Básicas, Avanzadas, Afectivas, Alternativas a la agresión, Estrés y Planificación».","Locus interno = «depende de mí»; locus externo = «la culpa es de otros o de la suerte»."],
cards:[
 ["Habilidades sociales","Conjunto de capacidades y destrezas para funcionar con mayor eficacia en las relaciones interpersonales."],
 ["Inteligencia emocional","Capacidad de reconocer y manejar las emociones; la popularizó Daniel Goleman en 1995."],
 ["5 aptitudes de la inteligencia emocional","Autoconsciencia, autorregulación, motivación, empatía y habilidades sociales."],
 ["6 grupos de habilidades de Goldstein","Básicas, avanzadas, afectivas, alternativas a la agresión, para hacer frente al estrés y de planificación."],
 ["Ejemplos de habilidades básicas","Escuchar, iniciar y mantener una conversación, preguntar, dar las gracias, presentarse, hacer un cumplido."],
 ["3 componentes de las habilidades sociales","Conductuales, cognitivos y fisiológicos."],
 ["3 tipos de componentes conductuales","Verbales, no verbales y afectivos."],
 ["Paralenguaje","Elementos vocales sin contenido lingüístico: tono, volumen, entonación, ritmo, pausas."],
 ["Kinesia","Lenguaje corporal: mirada, expresión facial, gestos y postura."],
 ["4 tipos de gestos","Reguladores, emblemas, ilustradores y adaptadores."],
 ["Emblema","Gesto convencional que todos entienden, como el pulgar hacia arriba."],
 ["Adaptadores","Movimientos inconscientes para gestionar emociones: tocarse el pelo o la nariz."],
 ["Proxémica","Gestión del espacio personal y la distancia con los demás."],
 ["4 distancias","Íntima (<0,5 m), personal (0,5-1,5 m), social (1,5-3 m) y pública (>3 m)."],
 ["Componentes afectivos","Señales casi involuntarias que expresan el grado de afinidad entre interlocutores."],
 ["Componentes cognitivos","Conocimientos y capacidades para percibir, procesar y usar la información al comunicarse."],
 ["Locus de control interno vs. externo","Interno: atribuye lo que pasa a sí mismo. Externo: a causas externas e incontrolables."],
 ["Distancia psicológica adecuada en intervención","Sentimientos y emociones; el compromiso personal se evita en la relación profesional."],
 ["Componentes fisiológicos","Reacciones orgánicas a la situación comunicativa: sonrojarse, sudar, temblar."],
 ["Empatía","Entender los sentimientos y emociones de otra persona desde su perspectiva."],
 ["Escucha activa","Atender al mensaje verbal y no verbal para comprender lo que la otra persona quiere comunicar."],
 ["Asertividad","Expresar lo que se siente y piensa de forma libre y segura, sin privar a los demás de sus derechos."],
 ["Resolución de conflictos","Capacidad de alcanzar acuerdos satisfactorios para las partes de una disputa."],
 ["Déficit vs. interferencia","Déficit: la habilidad no se aprendió. Interferencia: existe, pero algo impide usarla."],
 ["Programa de entrenamiento en habilidades sociales","Conjunto de actividades para que la persona se desenvuelva con más eficacia en distintos entornos sociales."],
 ["2 tipos de observación","En situaciones simuladas y natural."],
 ["ISRA","Inventario de situaciones y respuestas de ansiedad; 224 ítems, tres componentes y 22 situaciones."],
 ["EMES","Escala multidimensional de expresión social (Caballo): EMES-C cognitiva y EMES-M motora."],
 ["Duke-UNC","Cuestionario de apoyo social percibido; menos de 32 puntos es apoyo bajo."],
 ["EHS de Gismero","33 ítems y 6 factores de habilidades sociales; más puntos, más habilidad."],
 ["2 técnicas clave en habilidades sociales","Técnicas de dramatización y dinámicas de grupo."],
 ["Role playing","Representar una situación concreta de la vida real interpretando personajes."],
 ["5 fases del role playing","Diseño, montaje del escenario, presentación, representación y discusión y cierre."],
 ["Interacción planificada","Representación entre la persona usuaria y el profesional en un escenario preparado."],
 ["Inversión de roles","Dos personas intercambian papeles y defienden la posición de la otra."],
 ["Dinámica de grupo","Técnica vivencial grupal para interactuar, comunicarse y compartir sentimientos."],
 ["4 barreras de la escucha activa","Anticipación, prejuicio, filtrado y selección."],
 ["Negociación vs. mediación","Negociación: las partes solas. Mediación: con una persona imparcial que facilita el acuerdo."],
 ["Posición vs. interés","Posición: lo que se pide. Interés: el motivo real que hay detrás."],
 ["Paradoja del observador","La conducta cambia cuando la persona sabe que la observan."],
 ["Autoevaluación vs. coevaluación","Autoevaluación: la persona valora su actuación. Coevaluación: la valoran sus compañeros."]
],
quiz:[
 ["¿Quién popularizó el concepto de inteligencia emocional en 1995?",["Daniel Goleman","Arnold Goldstein","Vicente Caballo","Howard Gardner"],"Goleman; antes lo habían usado Mayer y Salovey en 1990."],
 ["«Negociar» y «emplear el autocontrol» pertenecen al grupo de habilidades de Goldstein…",["Alternativas a la agresión","Básicas","Avanzadas","De planificación"],"Permiten resolver problemas sin violencia."],
 ["El tono, la entonación y las pausas forman parte del…",["Paralenguaje","Componente cognitivo","Proxémica","Componente afectivo"],"Son elementos vocales sin contenido lingüístico."],
 ["Tocarse el pelo de forma inconsciente cuando estás nervioso es un gesto…",["Adaptador","Emblema","Ilustrador","Regulador"],"Los adaptadores sirven para gestionar las emociones."],
 ["¿Qué distancia se usa para hablar de temas algo confidenciales?",["Personal (0,5-1,5 m)","Pública (más de 3 m)","Social (1,5-3 m)","Íntima (menos de 0,5 m)"],"La íntima se reserva a personas emocionalmente cercanas."],
 ["«He suspendido porque el profesor me tiene manía» refleja un locus de control…",["Externo","Interno","Asertivo","Afectivo"],"Atribuye el resultado a una causa ajena e incontrolable."],
 ["Expresar tu opinión con seguridad respetando la de los demás es…",["Asertividad","Pasividad","Agresividad","Inhibición"],"La asertividad defiende los propios derechos sin atacar los ajenos."],
 ["Una persona jubilada que ya casi no se relaciona tiene, sobre todo, una…",["Interferencia por falta de práctica","Falta total de habilidades innatas","Mejora de su competencia social","Discapacidad intelectual"],"La habilidad existe, pero la falta de práctica impide usarla."],
 ["¿Qué escala mide el apoyo social percibido?",["Duke-UNC","ISRA","EHS de Gismero","EMES-M"],"Con 11 afirmaciones; menos de 32 puntos indica apoyo bajo."],
 ["¿Qué escala evalúa la ansiedad en 22 situaciones con sus tres componentes?",["ISRA","Duke-UNC","EHS","CHIS"],"El Inventario de situaciones y respuestas de ansiedad tiene 224 ítems."],
 ["Dos personas intercambian sus papeles y defienden la postura de la otra. Es…",["Inversión de roles","Role playing simple","Interacción planificada","Dinámica de presentación"],"Desarrolla la empatía y la flexibilidad."],
 ["¿Cuál es la última fase del role playing?",["Discusión y cierre","Representación","Montaje del escenario","Diseño"],"Primero hablan los intérpretes y luego los observadores."],
 ["Pensar en lo que vas a responder en vez de escuchar es la barrera de…",["Anticipación","Filtrado","Selección","Prejuicio"],"Se presta más atención a la propia respuesta que al mensaje."],
 ["En la mediación, a diferencia de la negociación…",["Interviene una persona imparcial","Las partes no hablan entre sí","Siempre hay un ganador","Se decide por votación"],"La mediadora facilita que las partes lleguen a acuerdos."],
 ["¿Qué postura es la más adecuada para favorecer la interacción?",["Acercamiento","Retirada","Expansión","Contracción"],"Inclinarse hacia delante indica interés y atención."],
 ["¿Por qué es difícil evaluar las habilidades sociales?",["Por la paradoja del observador y los factores culturales","Porque siempre se miden con un número exacto","Porque solo tienen un componente","Porque no se pueden entrenar"],"Además, intervienen muchos elementos a la vez."]
]
});

U("promocion", {
n:8, title:"Estimulación de las funciones cognitivas",
secs:[
 ["8.1. Las funciones cognitivas","Las funciones cognitivas son las capacidades que permiten a una persona adquirir, procesar, almacenar, transformar y recuperar la información del entorno. Se usan en todo, desde reconocer a las personas hasta razonar o decidir, y están muy relacionadas entre sí: si una se altera, afecta a las demás. Para que funcionen bien ayudan un estado emocional equilibrado, una personalidad sana con buena autoestima y un repertorio amplio de conductas.",
  ["Funciones básicas: regulan procesos elementales: percepción, atención, memoria y orientación espaciotemporal.","Funciones superiores: más complejas y propias del ser humano: pensamiento y lenguaje."]],
 ["La percepción","Es el proceso mental que permite recibir información del entorno mediante los sentidos, interpretarla y elaborarla.",
