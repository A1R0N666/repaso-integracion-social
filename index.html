a o en silla de ruedas.</p><ul><li><b>Bastón:</b> siempre en el lado de la pierna más débil. Al andar: bastón, pierna fuerte y luego pierna débil. Al subir y bajar escaleras: bastón, pie débil y después pie fuerte.</li><li><b>Andador:</b> agarrar firme, adelantarlo un poco, avanzar un pie y luego el otro; el cuerpo siempre dentro del perímetro del andador.</li><li><b>Con ayuda:</b> pasar un brazo por la espalda sujetando la cintura y con la otra mano el antebrazo; si está muy débil, que alguien siga detrás con una silla de ruedas. Si da muy pocos pasos, el profesional va de frente, de espaldas, sujetando sus antebrazos.</li><li><b>Silla de ruedas en un escalón:</b> perpendicular, levantar las ruedas delanteras pisando la barra de soporte y subir o bajar con las traseras haciendo contrapeso.</li><li><b>Escaleras con silla:</b> mejor rampas o ascensores; si no, entre dos personas: se sube de espaldas y se baja de frente.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">6.4.5. Discapacidad visual</h4><p>Los itinerarios se diseñan alrededor de los espacios (siguiendo paredes), no cruzándolos, y se segmentan en acciones. Además, se entrenan los demás sentidos (sonidos, olores como referencia).</p><ul><li><b>Prebastón, en lugares conocidos:</b> rastreo (dorso de la mano rozando la pared a la altura de la cadera), alineación (usar un objeto conocido como referencia), protección baja o diagonal (brazo cruzado delante, palma abajo), protección alta (antebrazo ante la cara a unos 90° y 10 cm) y encuadre (espalda contra un punto para ir en línea recta por espacios abiertos).</li><li><b>Técnica de Hoover:</b> la más habitual en exteriores; índice extendido en el mango, brazo centrado a la altura del ombligo, barrido rítmico de muñeca de lado a lado; el bastón toca a la derecha mientras avanza el pie izquierdo.</li><li><b>Técnica de deslizamiento:</b> en interiores, bastón en diagonal con la contera pegada a la pared.</li><li><b>Técnica de toque o de dos puntos:</b> terrenos abruptos, arco con un toque en cada extremo.</li><li><b>Escaleras:</b> colocarse a la derecha, medir el escalón con el bastón y llevarlo siempre un peldaño por delante.</li><li><b>Guía vidente:</b> la persona va medio paso por detrás, sujetando el brazo del guía por encima del codo; en pasos estrechos el guía lleva el brazo hacia atrás; en escaleras, avisa, se detiene ante el primer escalón y va siempre un peldaño por delante. Nunca dejarla en campo abierto.</li><li><b>Perro guía:</b> para ceguera total o restos no funcionales. Exige un entrenamiento que no todos superan y cuidar del perro; el perro no decide sobre la orientación ni la seguridad.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">6.5. Evaluación del programa</h4><p>Usa los mismos instrumentos que la valoración (entrevistas, escalas y sobre todo registros de observación con indicadores basados en los objetivos).</p><ul><li><b>Resultados:</b> si se han logrado los objetivos y en qué medida (p. ej., hace sola las transferencias cama-silla, silla-inodoro, silla-coche, silla-sofá).</li><li><b>Actividades:</b> según sus objetivos específicos, en varias fases, hasta consolidar el hábito (p. ej., identifica puntos de referencia, cruza con seguridad, pregunta si se desorienta).</li><li><b>Actuación profesional:</b> autoevaluación de cada miembro del equipo.</li><li>Las conclusiones se recogen en un informe para la persona y su familia, muy útil si se deriva a otro servicio.</li></ul><div style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Trucos:</b><ul><li>El bastón va siempre del lado débil. Al andar: «bastón, fuerte, débil». En escaleras: «bastón, débil, fuerte».</li><li>Barreras «BAU-BAE-BAT-BC»: Urbanísticas (calle), Edificación (dentro), Transporte y Comunicación.</li><li>Silla de ruedas por escaleras: se sube de espaldas y se baja de frente.</li><li>Movilización = misma superficie; transferencia = cambia de superficie; desplazamiento = cambia de lugar.</li></ul></div><h3 style="font-size:22px;margin:26px 0 8px">Tema 7. Entrenamiento en habilidades sociales</h3><h4 style="font-size:18px;margin:16px 0 4px">7.1. Las habilidades sociales</h4><p>Somos seres biopsicosociales: necesitamos relacionarnos y formar parte de un grupo. Las habilidades sociales son un conjunto de capacidades y destrezas que nos ayudan a funcionar con mayor eficacia en las relaciones interpersonales. Quien tiene dificultades vive las relaciones con ansiedad, lo que puede causar frustración, inadaptación y baja autoestima. Se pueden aprender o perfeccionar con entrenamiento.</p><ul><li><b>Inteligencia emocional (Doc. 7.1):</b> la popularizó Daniel Goleman en 1995 (antes la usaron Mayer y Salovey en 1990). Es la capacidad de reconocer y manejar las emociones.</li><li><b>Aptitudes personales:</b> autoconsciencia (reconocer las propias emociones), autorregulación (regular impulsos y estados de ánimo) y motivación (tendencias emocionales que guían hacia las metas).</li><li><b>Aptitudes sociales:</b> empatía (conciencia de los sentimientos y necesidades de los demás) y habilidades sociales (inducir en los demás respuestas deseadas).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">7.1.1. Tipología de habilidades (Goldstein)</h4><p>Arnold Goldstein clasifica 50 habilidades sociales en seis grupos según su finalidad.</p><ul><li><b>I. Básicas:</b> las primeras que se adquieren; escuchar, iniciar y mantener una conversación, preguntar, dar las gracias, presentarse, presentar a otros, hacer un cumplido.</li><li><b>II. Avanzadas:</b> estrategias para las relaciones; pedir ayuda, participar, dar y seguir instrucciones, disculparse, convencer.</li><li><b>III. Afectivas:</b> identificar y gestionar emociones propias y ajenas; conocer y expresar sentimientos, comprender los de los demás, enfrentarse al enfado de otro, expresar afecto.</li><li><b>IV. Alternativas a la agresión:</b> evitar o gestionar el conflicto sin violencia; pedir permiso, compartir, ayudar, negociar, autocontrol, defender los derechos, responder a bromas, no entrar en peleas.</li><li><b>V. Para hacer frente al estrés:</b> formular y responder a una queja, deportividad, resolver la vergüenza, responder al fracaso o a una acusación, presiones de grupo.</li><li><b>VI. De planificación:</b> proyectarse en el futuro y resolver problemas (tomar decisiones, fijar objetivos).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">7.1.2. Componentes conductuales</h4><p>La conducta social tiene componentes conductuales, cognitivos y fisiológicos. Los conductuales son los más fáciles de observar y entrenar, y son de tres tipos: verbales, no verbales y afectivos.</p><ul><li><b>Componentes verbales:</b> elementos del código lingüístico. En toda comunicación se pierde información entre lo que el emisor quiere decir y lo que el receptor interpreta (Doc. 7.3: lo que quiere expresar, lo que transmite, lo que oye, lo que escucha, lo que entiende, lo que interpreta). Hay que adaptar el discurso a la persona para reducir esa pérdida.</li><li><b>Funciones del lenguaje no verbal:</b> ratificar el mensaje, enfatizarlo, sustituir palabras (asentir), contradecirlo (sonrisa irónica) y regular la interacción (pedir o ceder el turno).</li><li><b>Paralenguaje:</b> calidad de la voz (tono, intensidad, timbre), prosodia (entonación), fluidez (velocidad, pausas, silencios), vocalizaciones (mmm) e indicadores de turno.</li><li><b>Kinesia o lenguaje corporal:</b> mirada, expresión facial, gestos y postura.</li><li><b>Tipos de gestos (Doc. 7.4):</b> reguladores (indican qué hacer: que empiece o repita), emblemas (significado conocido por todos: pulgar arriba), ilustradores (acompañan y aclaran: señalar) y adaptadores (automanipulaciones inconscientes: tocarse el pelo).</li><li><b>Proxémica:</b> distancia pública (más de 3 m, grupos desconocidos), social (1,5-3 m, conversaciones no privadas), personal (0,5-1,5 m, temas confidenciales) e íntima (hasta 0,5 m, personas cercanas; incluye la zona íntima privada de contacto físico). En higiene y movilizaciones se invade la zona íntima: hacerlo con el máximo respeto.</li><li><b>Aspecto externo:</b> higiene, ropa o peinado influyen en la aceptación de los demás.</li><li><b>Componentes afectivos:</b> señales, casi siempre involuntarias, que expresan el grado de afinidad (simpatía o antipatía, calidez o frialdad); forman el mensaje afectivo.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">7.1.2. Componentes cognitivos y fisiológicos</h4><p>Los cognitivos son los conocimientos y capacidades para percibir, procesar y usar la información en una situación comunicativa. Los fisiológicos son las reacciones orgánicas ante ella.</p><ul><li><b>Competencias cognitivas:</b> procesar información, resolver conflictos, mostrar empatía.</li><li><b>Constructos personales:</b> cada uno interpreta según sus esquemas (alguien con depresión magnifica una señal negativa).</li><li><b>Expectativas:</b> lo que cree que se espera de él o las consecuencias que tendrá su conducta.</li><li><b>Valores subjetivos de los estímulos:</b> a unos les importa mucho el reconocimiento social y a otros no.</li><li><b>Sistemas de autorregulación:</b> cómo se autoevalúa, se premia o se castiga.</li><li><b>Locus de control:</b> externo (atribuye lo que le pasa a causas incontrolables: «el profe me tiene manía») o interno (a sí mismo: «he estudiado poco»).</li><li><b>Percepción de la situación:</b> formalidad (más formal, más distante), distancia física y psicológica, privacidad, familiaridad, restricción (genera presión) y calidez (favorece el diálogo).</li><li><b>Distancia psicológica (Doc. 7.5):</b> comunicación estereotipada («vaya frío»), datos impersonales, ideas y opiniones, sentimientos y emociones (nivel propio de la intervención) y compromiso personal (amistad íntima o pareja; se evita en la relación profesional).</li><li><b>Fisiológicos:</b> sonrojarse, temblar, sudar, taquicardia al hablar en público; o reacciones desproporcionadas (rabietas, euforia), frecuentes en discapacidad intelectual. Al ganar competencia social, mejora su control.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">7.1.3. Capacidades para la competencia social</h4><p>Facilitan la gestión de las relaciones y se influyen entre sí.</p><ul><li><b>Empatía:</b> capacidad de entender los sentimientos y emociones de otra persona desde su perspectiva. Permite comprender mejor los problemas, ampliar soluciones y equilibrar el propio punto de vista.</li><li><b>Escucha activa:</b> atender al mensaje verbal y no verbal de otra persona con la intención de comprender lo que pretende comunicar, dando feedback de que se la escucha.</li><li><b>Asertividad:</b> expresar sentimientos, emociones y pensamientos propios de forma libre y segura, sin privar a los demás de sus derechos, sin agresividad ni manipulación. No es tener siempre razón.</li><li><b>Estilo agresivo:</b> no respeta los derechos ajenos e impone sus opiniones. Estilo pasivo o inhibido: no expresa lo que piensa ni defiende sus derechos. Ambos generan malestar; el asertivo mejora la autoestima y las relaciones.</li><li><b>Resolución de conflictos:</b> capacidad de alcanzar acuerdos satisfactorios para las partes en una disputa. Requiere voluntad, diálogo y negociación. El conflicto no es negativo en sí: es una oportunidad si se resuelve bien.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">7.1.4. Dificultades en la competencia social</h4><p>Habilidades deficitarias causan falta de aceptación, aislamiento o exclusión. Las habilidades deben entenderse en su contexto cultural (mirar a los ojos es correcto aquí pero no en todas las culturas).</p><ul><li><b>Déficit en las habilidades:</b> no se han aprendido por un ambiente pobre en estímulos o adverso (un niño al que no enseñaron a pedir permiso). La sobreprotección lo agrava en niños con discapacidad.</li><li><b>Interferencias (la habilidad existe pero algo impide usarla):</b> experiencias pasadas negativas, bajas expectativas por baja autoestima (víctimas de violencia de género), falta de práctica (jubilación, pérdida de empleo, aislamiento sensorial), pérdida de facultades cognitivas, discapacidad intelectual (efusividad exagerada), alteraciones del pensamiento o del ánimo (depresión) y ansiedad.</li><li>En personas en riesgo social suelen coincidir déficit e interferencia.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">7.1.5. Programas de entrenamiento en habilidades sociales</h4><p>Un programa de entrenamiento en habilidades sociales es el conjunto de actividades orientadas a dotar a la persona de destrezas para desenvolverse con mayor eficacia en distintos entornos sociales. Se usan en integración social, en educación y, en casos graves, en clínica. Mejoran las relaciones, reducen la ansiedad y el estrés y aumentan la autoestima.</p><ul><li><b>Fases:</b> valoración del déficit, planificación, ejecución y evaluación.</li><li>Pueden diseñarse para una persona o para un grupo que comparte dificultades.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">7.2. La valoración de las habilidades sociales</h4><p>Decir «tiene déficit en habilidades sociales» no sirve para planificar: puede fallar en una habilidad o contexto y no en otros. Hay que evaluar cada habilidad en sus tres dimensiones (conductual, cognitiva y fisiológica).</p><ul><li><b>Entrevista personal:</b> mejor semiestructurada o abierta. Sirve para indagar el origen de la dificultad, conocer expectativas y motivación y ver su nivel de ejecución (discurso, apariencia, comportamiento). No se usa como única técnica.</li><li><b>Observación en situaciones simuladas:</b> contexto ficticio relacionado con su realidad; bien estructurada, pero la persona puede fingir.</li><li><b>Observación natural:</b> cómo actúa en situaciones cotidianas. En ambas: registros de observación y discreción. Esos registros sirven también para evaluar el progreso.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">7.2.3. Escalas estandarizadas</h4><p>Evalúan aspectos conductuales, cognitivos e incluso fisiológicos.</p><ul><li><b>ISRA (Inventario de situaciones y respuestas de ansiedad):</b> Miguel Tobal y Cano Vindel, 1986. 224 ítems que evalúan por separado los tres componentes en 22 situaciones de cuatro tipos (evaluación, sociales, fóbicas y cotidianas), puntuadas de 0 a 4.</li><li><b>ERA (Escala reducida de ansiedad):</b> versión de 17 ítems (1995) para cuando hay poco tiempo o bajo nivel cultural.</li><li><b>EMES (Escala multidimensional de expresión social):</b> Vicente E. Caballo, 1987. EMES-C (cognitiva, 44 ítems: más puntuación, más pensamientos negativos) y EMES-M (motora, 64 ítems: menos puntuación, menos habilidades).</li><li><b>Cuestionario de apoyo social funcional Duke-UNC:</b> 11 afirmaciones de 1 a 5; menos de 32 puntos indica apoyo social bajo. Mide el apoyo percibido, no el real.</li><li><b>EHS de Gismero (2000):</b> 33 ítems y 6 factores: autoexpresión en situaciones sociales, defensa de los derechos como consumidor, expresión de enfado o disconformidad, decir no y cortar interacciones, hacer peticiones e iniciar interacciones positivas con el sexo opuesto. Más puntuación, más habilidad.</li><li><b>Otras (Doc. 7.9):</b> Inventario de asertividad de Gambrill y Richey, de Rathus (RAS), FNES (miedo a la evaluación negativa), SADS (evitación y malestar social) y CHIS de Inés Monjas (niños y adolescentes).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">7.3. La planificación del programa</h4><p>La meta es que la persona sea lo más competente posible socialmente. Las reacciones físicas y emocionales no se controlan a voluntad, pero se entrenan actuando sobre su causa (autoestima) o su manifestación (relajación, ensayos).</p><ul><li><b>Objetivos habituales:</b> adquirir o perfeccionar habilidades y usarlas en el contexto adecuado; mejorar la comunicación; desarrollar empatía, escucha, asertividad y resolución de conflictos; gestionar emociones; mejorar autoestima y autoconfianza; aceptar las críticas como mejora; participar más en los grupos.</li><li><b>Diseño:</b> fijar el marco temporal (p. ej., 18 sesiones de 50 minutos, martes y jueves), delimitar bloques de actividades con objetivos operativos, repartirlos en sesiones con título y cronograma (grupo, individual o familia) y planificar cada sesión con objetivo, actividades e indicadores.</li><li><b>Ejemplo de bloques (Doc. 7.15):</b> «Cómo soy yo y cómo somos nosotros», «Hablando con encanto», «Me expreso con la cara y el cuerpo», «Escucho a los demás y los entiendo», «Acepto lo que dices, pero no lo comparto», «Halágame y te halago», «Te pido y me pides».</li><li><b>Ficha de sesión (Doc. 7.18):</b> presentación, actividades (p. ej., «La entrega de vasos», «En los zapatos de otro» con inversión de roles), reflexión y tareas para casa, y cierre.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">7.3.3. Técnicas de intervención</h4><p>Se usan técnicas de modificación de conducta (refuerzo, modelado, moldeado, encadenamiento) y cognitivas, pero sobre todo dos: dramatización y dinámicas de grupo.</p><ul><li><b>Técnicas de dramatización:</b> representar situaciones lo más reales y espontáneas posible para comprenderlas y vivirlas. Es útil grabarlas para analizarlas después.</li><li><b>Role playing:</b> representar una situación concreta de la vida real; cada uno interpreta un personaje. Permite ensayar conductas y que el profesional detecte déficits. Fases: diseño, montaje del escenario, presentación (los demás reciben un registro de observación), representación (sin interrumpir salvo motivo) y discusión y cierre. Dura entre 45 minutos y una hora.</li><li><b>Interacción planificada:</b> representación entre la persona usuaria y el profesional; a veces la persona no sabe que es simulada.</li><li><b>Inversión de roles:</b> dos personas intercambian papeles y defienden la posición de la otra. Desarrolla empatía, autoconocimiento y flexibilidad.</li><li><b>Tareas de consolidación (Doc. 7.19):</b> tareas sorpresa (cambiar elementos del escenario) y tareas de transición (puente hacia la vida real).</li><li><b>Dinámicas de grupo:</b> técnicas vivenciales grupales que facilitan la socialización, la cohesión, el sentimiento de pertenencia y la tolerancia.</li><li><b>Tipos de dinámicas:</b> de presentación, de conocimiento, de confianza y cohesión, de control de emociones y autoestima, de colaboración, de comunicación y de habilidades sociales.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">7.3.4. Recursos</h4><p>No suelen hacer falta recursos especializados: basta un espacio amplio y estimulante, y a veces ordenador, música, vídeo o fotos.</p><ul><li><b>Espacios en el domicilio:</b> ordenados, con espacio para recibir visitas (o la habitación, si está encamada).</li><li><b>Espacios en centros:</b> lugares tranquilos para recibir visitas sin ser observados, salas de estar con zonas de distinta privacidad y lugares para fiestas que puedan organizar los propios residentes.</li><li><b>Acompañamiento:</b> estar junto a la persona y apoyar su integración (al incorporarse a un taller o a una residencia; en domicilio, a personas viudas con riesgo de aislamiento: visitas, compras, ocio).</li><li><b>TIC:</b> la competencia digital es imprescindible; formar en navegación, correo y mensajería, videollamadas y participación virtual (foros, redes).</li><li><b>Asociacionismo:</b> asociaciones de personas usuarias (defienden derechos: apoyo legal, psicológico, orientación) y de familiares (información, formación, apoyo emocional y orientación).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">7.4. La ejecución del programa</h4><p>Se suele hacer en grupo (con sesiones individuales de refuerzo). El grupo es un escenario más natural, permite aprender por observación y refuerzo de los demás, ofrece más variedad y da apoyo mutuo.</p><ul><li><b>Secuencia de una sesión:</b> recordatorio (repaso y tareas para casa; puede hacerlo un portavoz rotatorio), exposición, identificación de la actividad, definición del problema, identificación de soluciones, instrucciones, modelado, práctica (role playing), retroalimentación, tareas para casa (con autorregistro) y conclusión y cierre.</li><li><b>Actuación profesional:</b> ser modelo de conducta asertiva y empática, asegurarse de que todos entienden, dar tiempo suficiente, que las actividades sean gratificantes y lúdicas, usar recursos (fotos, pictogramas, vídeos), atención individualizada, buen uso de refuerzos e implicar a la familia.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">7.4.3. Orientaciones para la comunicación</h4><p>Muchas personas vulnerables tienen déficits para entender y ser entendidas.</p><ul><li><b>Verbal:</b> estructura del mensaje, dicción, fluidez (ni muy rápido ni muy lento, sin muletillas; pausas moderadas sí, prolongadas parecen desinterés y su ausencia, agresividad) e interacción (comprobar que se entiende y equilibrar los turnos: frenar al impulsivo y animar al que habla poco).</li><li><b>Voz:</b> volumen adecuado y modulado (bajo transmite inseguridad; alto, prepotencia) y entonación variada.</li><li><b>Mirada:</b> a los ojos, sin ser fija ni demasiado sostenida.</li><li><b>Expresión facial:</b> congruente con el mensaje; si no, genera desconfianza.</li><li><b>Sonrisa:</b> espontánea y natural, en el momento adecuado; favorece los mensajes afectivos.</li><li><b>Postura:</b> acercamiento (inclinarse hacia delante, la más adecuada), retirada (rechazo), expansión (arrogante, agresiva) y contracción (inseguridad, ánimo bajo).</li><li><b>Gestualidad:</b> que ayude a comprender el mensaje.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">Escucha activa, asertividad y conflictos</h4><p>Orientaciones para entrenar estas capacidades.</p><ul><li><b>Escucha activa:</b> empatía (piedra angular), atención sin interrumpir, retroalimentación y lenguaje no verbal receptivo; hacer preguntas y mensajes de verificación (repetir o reformular).</li><li><b>Barreras de la escucha (Doc. 7.20):</b> anticipación (pensar en lo que vamos a responder), prejuicio, filtrado (oír solo lo que interesa) y selección (atender solo a opiniones afines).</li><li><b>Asertividad:</b> trabajar la autoestima (condición previa), expresar las propias opiniones, aceptar y valorar las críticas, gestionar emociones e impulsos y saber disculparse solo cuando toca. Técnicas: disco rayado, sándwich, banco de niebla, pregunta asertiva, enunciados en primera persona.</li><li><b>Negociación:</b> las propias partes dialogan para llegar a un acuerdo. Mediación: interviene una persona imparcial que facilita los acuerdos.</li><li><b>Pasos:</b> 1) reconocer el conflicto con voluntad de resolverlo; 2) definir posiciones (qué quiere) e intereses (motivos reales); 3) buscar opciones beneficiosas para ambos; 4) acuerdos sin ganadores ni perdedores.</li><li><b>Ayudan (Doc. 7.21):</b> respeto, separar el problema de lo personal, escucha, empatía, autocontrol, humildad, asertividad y pedir perdón. Dificultan: insultos, ataques personales, generalizaciones, culpar al otro, inflexibilidad, amenazas y sacar otros problemas.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">7.5. La evaluación de la intervención</h4><p>El objetivo final es que la persona use lo aprendido en situaciones reales y variadas, por eso la evaluación es continua.</p><ul><li><b>Es más difícil que en otras habilidades (Doc. 7.22):</b> variables poco objetivas, muchos elementos a la vez (verbales, paraverbales, no verbales, contexto), factores culturales que generan sesgos, la paradoja del observador (la conducta cambia al sentirse observado) y la variedad de situaciones.</li><li><b>Evaluación de las actividades:</b> del resultado (indicadores de la actividad: saluda, toma y cede la palabra, cierra la conversación) y de las personas (puntualidad, apariencia, atención, respeto, gestión emocional).</li><li><b>Autoevaluación:</b> la persona reflexiona sobre su actuación, sentimientos y utilidad (tras actuar, tras los comentarios o al ver la grabación).</li><li><b>Coevaluación:</b> los compañeros valoran la actuación con un registro (mensaje, no verbal, distancia, asertividad, empatía, escucha).</li><li>Los profesionales también se autoevalúan.</li><li><b>Evaluación del programa:</b> escala de estimación sobre los objetivos generales, o repetir las mismas escalas del inicio (ISRA, EMES, Duke-UNC, EHS) y comparar. Se hace un informe y se comunica a la persona y su familia.</li></ul><div style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Trucos:</b><ul><li>Inteligencia emocional de Goleman: 3 «para mí» (autoconsciencia, autorregulación, motivación) + 2 «para los demás» (empatía, habilidades sociales).</li><li>Distancias como círculos: íntima (medio brazo, &lt;0,5 m), personal (hasta 1,5 m), social (hasta 3 m) y pública (más de 3 m).</li><li>Goldstein en 6: «Básicas, Avanzadas, Afectivas, Alternativas a la agresión, Estrés y Planificación».</li><li>Locus interno = «depende de mí»; locus externo = «la culpa es de otros o de la suerte».</li></ul></div><h3 style="font-size:22px;margin:26px 0 8px">Tema 8. Estimulación de las funciones cognitivas</h3><h4 style="font-size:18px;margin:16px 0 4px">8.1. Las funciones cognitivas</h4><p>Las funciones cognitivas son las capacidades que permiten a una persona adquirir, procesar, almacenar, transformar y recuperar la información del entorno. Se usan en todo, desde reconocer a las personas hasta razonar o decidir, y están muy relacionadas entre sí: si una se altera, afecta a las demás. Para que funcionen bien ayudan un estado emocional equilibrado, una personalidad sana con buena autoestima y un repertorio amplio de conductas.</p><ul><li><b>Funciones básicas:</b> regulan procesos elementales: percepción, atención, memoria y orientación espaciotemporal.</li><li><b>Funciones superiores:</b> más complejas y propias del ser humano: pensamiento y lenguaje.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">La percepción</h4><p>Es el proceso mental que permite recibir información del entorno mediante los sentidos, interpretarla y elaborarla.</p><ul><li><b>1. Sensación:</b> respuesta a los estímulos captados por los receptores. Exteroceptiva (del exterior, por los sentidos), propioceptiva (del propio cuerpo: postura, equilibrio) o visceroceptiva o interoceptiva (de los órganos internos: hambre, náuseas).</li><li><b>2. Selección:</b> solo se atiende a una pequeña parte de los estímulos, según su naturaleza (intensidad, movimiento, novedad) y factores internos (necesidades, intereses).</li><li><b>3. Organización:</b> se ordenan los estímulos para que tengan sentido (manchas que forman una figura).</li><li><b>4. Interpretación:</b> se les da significado según la experiencia, los intereses y los prejuicios; por eso cambia a lo largo de la vida.</li><li><b>Características:</b> selectiva, subjetiva, relativa (depende del contexto) y temporal.</li><li><b>Distorsiones perceptivas (Doc. 8.2):</b> atención selectiva (solo lo que interesa), exposición selectiva (solo lo agradable) y defensa perceptiva (se suprime lo que amenaza las propias creencias).</li><li><b>La Gestalt (Doc. 8.1):</b> «el todo es más que la suma de las partes». Ley de la pregnancia o buena forma: percibimos de la forma más sencilla posible. Principios: proximidad, semejanza, continuidad, simetría, cierre, movimiento común, memoria, jerarquización y contraste.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">La atención</h4><p>Es la capacidad de focalizar la actividad mental en un objeto o acción concreta. Permite reaccionar a tiempo a los estímulos, discriminarlos, concentrarse y hacer varias cosas a la vez.</p><ul><li><b>Según el propósito:</b> voluntaria (intencionada) o involuntaria (se activa sola).</li><li><b>Según la actitud:</b> sostenida (tiempo máximo de concentración sin errores), dividida (varias tareas a la vez) y selectiva (una sola fuente, descartando el resto).</li><li><b>Factores externos:</b> intensidad del estímulo y previsibilidad (lo imprevisto atrae más).</li><li><b>Factores internos:</b> estado físico (fatiga, sueño, hambre, frío) y psíquico (ánimo, interés, motivación).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">La memoria</h4><p>Es la capacidad de codificar, almacenar y recuperar la información procedente de un aprendizaje o una experiencia. Todo aprendizaje implica retención. No es perfecta: puede crear falsos recuerdos, más frecuentes con la edad.</p><ul><li><b>Adquisición:</b> entrada por los sentidos, filtrada por la atención y la percepción.</li><li><b>Memoria inmediata o sensorial (SIS):</b> mucha información, milisegundos.</li><li><b>Memoria a corto plazo (STM):</b> capacidad limitada, algunos segundos.</li><li><b>Memoria a largo plazo (LTM):</b> horas, días o años. Episódica (hechos y experiencias personales), semántica (conocimiento del mundo y lenguaje) y procedimental (habilidades que se hacen casi sin pensar).</li><li><b>Recuperación por reconocimiento (identificar algo presente:</b> examen tipo test) o por evocación (recordar algo ausente: examen de desarrollo).</li><li><b>Mecanismos de olvido (Doc. 8.3):</b> desvanecimiento (con el tiempo, sin refuerzo), desplazamiento (lo nuevo ocupa el lugar), interferencia (información parecida lo desvirtúa) y represión (la mente bloquea recuerdos traumáticos).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">El pensamiento y el lenguaje</h4><p>Son las funciones superiores, que se asientan sobre las básicas.</p><ul><li><b>Pensamiento:</b> capacidad de procesar y ordenar ideas y conceptos y generar conclusiones. Implica razonamiento (analizar y extraer conclusiones por deducción o inducción) y creatividad (crear ideas nuevas).</li><li><b>Guilford (Doc. 8.4):</b> pensamiento convergente (razonamiento lógico, soluciones convencionales) y divergente (creatividad, soluciones originales). Se combinan en la innovación.</li><li><b>Lenguaje:</b> código simbólico y estructurado de signos que hace posible la comunicación y organiza el pensamiento.</li><li>Función comunicativa (expresar y entenderse) y función simbólica (asociar significante y significado). Integra todas las funciones cognitivas.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">8.1.2. El estado de ánimo</h4><p>Es una tendencia emocional de larga duración que impregna los sentimientos, pensamientos y comportamientos de la persona. Sus oscilaciones son normales (eutimia) si no interfieren en la vida diaria; son patológicas si causan interferencias o malestar notable.</p><ul><li><b>Trastornos del estado de ánimo:</b> perturbaciones persistentes que interfieren en la vida; de tipo depresivo (desinterés, falta de placer) o maníaco (irritabilidad, expansividad).</li><li><b>Distimia:</b> ánimo bajo, pérdida de interés y placer, irritabilidad, pesimismo, baja autoestima.</li><li><b>Depresión mayor:</b> lo anterior más pérdida de energía, alteraciones del sueño e ideas de muerte o suicidio; hay alteración de los neurotransmisores y requiere tratamiento médico.</li><li><b>Hipertimia:</b> ánimo expansivo y exaltado, con exceso de actividad y euforia.</li><li><b>Trastorno bipolar (antes psicosis maniacodepresiva):</b> cambios repentinos entre periodos eufóricos y depresivos, sin causa externa.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">8.1.3. La personalidad y la autoestima</h4><p>La personalidad es el conjunto de características emocionales, de pensamiento y de conducta que definen globalmente a una persona; es relativamente estable. Se debe al temperamento (heredado) y al carácter (adquirido).</p><ul><li><b>Rasgos en pares opuestos:</b> extraversión/introversión, egocentrismo/alocentrismo, emotividad/frialdad, constancia/inconstancia, actividad/inactividad, dominio/sumisión e impulsividad/serenidad.</li><li>Si un rasgo es extremo o rígido puede aparecer un trastorno de personalidad: patrones muy rígidos e inadaptados que perturban la vida personal, laboral y social; difíciles de tratar.</li><li><b>DSM (Doc. 8.6), 10 trastornos en 3 grupos:</b> A, raros o excéntricos (paranoide, esquizoide, esquizotípico); B, dramáticos o emocionales (antisocial, histriónico, narcisista, límite); C, ansiosos o temerosos (evitativo, dependiente, obsesivo-compulsivo).</li><li><b>Autoconcepto:</b> percepción que una persona tiene de sí misma. Autoestima: el valor que da a esa percepción. Alta si se ajusta o supera la realidad; baja si se minimizan las cualidades.</li><li><b>Tipos (Doc. 8.7):</b> baja estable (indecisión), baja inestable (muy vulnerable a comentarios), alta estable (seguridad), alta inestable (baja tolerancia al fracaso) e inflada (prepotencia).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">8.2.1. Disfunción cognitiva</h4><p>Es una alteración en alguna función que limita la competencia cognitiva. Puede deberse a un déficit cerebral o a una disonancia.</p><ul><li><b>Por déficit:</b> congénita (discapacidad intelectual), pérdida por afectación cerebral adquirida (tumor, traumatismo, ictus) o deterioro (demencias como Alzheimer o Parkinson: memoria, atención y orientación).</li><li><b>Agnosia (Doc. 8.8):</b> no poder reconocer estímulos conocidos sin fallo de memoria ni de los sentidos. Tipos: prosopagnosia (rostros), auditiva, amusia (música), cromática (colores), táctil y simultagnosia (un solo objeto a la vez).</li><li><b>Por disonancia:</b> desajuste entre cogniciones (realidad y lo que se cree o desea) que genera ansiedad. Se resuelve adaptándose a la realidad (requiere personalidad flexible), con mecanismos de defensa o con distorsiones cognitivas.</li><li><b>Mecanismos de defensa:</b> procesos inconscientes que protegen de la ansiedad sin tocar sus causas: negación, proyección (atribuir a otros lo propio), regresión (volver a conductas antiguas), racionalización (inventar explicaciones) y distorsión (devaluación o idealización).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">Distorsiones cognitivas</h4><p>Una distorsión cognitiva es una interpretación errónea de la realidad por pensamientos, percepciones o creencias irracionales. Pensar racionalmente no es lo mismo que pensar en positivo: es valorar las evidencias.</p><ul><li><b>Inferencia arbitraria:</b> dar algo por hecho sin pruebas. Incluye la adivinación del pensamiento (creer que se ríen de ti) y la del futuro (no ir a la entrevista porque «seguro que no me cogen»; si es lo peor, catastrofismo).</li><li><b>Abstracción selectiva o filtraje:</b> fijarse solo en el detalle negativo.</li><li><b>Sobregeneralización:</b> de un caso aislado sacar una regla general («ninguna empresa me contratará jamás»).</li><li><b>Magnificación y minimización:</b> exagerar o quitar importancia a los hechos.</li><li><b>Personalización:</b> atribuirse sin pruebas lo que pasa fuera («me ha dejado por mi culpa»).</li><li><b>Pensamiento dicotómico o polarizado:</b> todo o nada, sin matices.</li><li><b>Descalificación de lo positivo:</b> buscar siempre la lectura negativa (te llaman al despacho y piensas que te despiden).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">8.2.2. Características cognitivas por colectivos</h4><p>Cualquiera puede tener dificultades cognitivas, pero en algunos colectivos son más frecuentes.</p><ul><li><b>Discapacidad sensorial o motora:</b> no implica limitación cognitiva, pero la falta de experiencias puede condicionarla; cuanto más temprana y severa, más repercusión. Si la causa es general (parálisis cerebral, esclerosis múltiple), puede afectar a lo cognitivo.</li><li><b>Discapacidad intelectual:</b> atención dispersa y centrada en lo poco relevante, lenguaje pobre en todas sus áreas, déficit de abstracción (imaginación, planificación) y dificultad para imitar, secuenciar, comprender reglas y generalizar.</li><li><b>Personas mayores:</b> más limitaciones perceptivas, pérdida paulatina de memoria, desorientación, menos agilidad mental, dificultades con estrategias abstractas y afectación del lenguaje; se acentúan rasgos de personalidad y la inflexibilidad.</li><li><b>Demencias:</b> 1) pérdida de memoria (hasta la agnosia), 2) dificultad en las AVD, 3) desorientación espaciotemporal, 4) pérdida del lenguaje.</li><li><b>Trastornos mentales:</b> alucinaciones, distracción, pensamiento desorganizado o delirante y lenguaje pobre.</li><li><b>Estados depresivos:</b> menos atención, fallos de memoria a corto plazo, lentitud, dificultad de expresión, apatía y pobreza afectiva.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">8.2.3. La intervención en las funciones cognitivas</h4><p>Las funciones cognitivas se pueden mejorar con práctica y entrenamiento. Primero hay que valorar bien la capacidad cognitiva y el estado de ánimo. La intervención cognitiva no se trata aislada de lo psicosocial, lo conductual o el ambiente.</p><ul><li><b>Pasos:</b> formular objetivos (mantener, rehabilitar, estimular la memoria, mejorar la atención), marco temporal, contenidos, técnicas y planificación de cada sesión, grupal e individual.</li><li><b>Programas de psicoestimulación (Doc. 8.9):</b> combinan actividades grupales e individuales. PPI (1991, integral, equipo interdisciplinar ocho horas diarias), PPP (2006, preventivo y lúdico para mayores institucionalizados) y PACID (2011, del Centro de Referencia Estatal de Alzheimer, para demencias, busca la neuroplasticidad).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">8.3. Valoración de la capacidad cognitiva</h4><p>Se valoran el déficit cognitivo y el estado de ánimo, con entrevista, observación y sobre todo escalas estandarizadas.</p><ul><li><b>Test de Pfeiffer (SPMSQ):</b> 10 preguntas (fecha, día, lugar, teléfono, edad, nacimiento, presidente actual y anterior, apellido de la madre, restar de 3 en 3 desde 20). Errores: 0-2 normal, 3-4 leve, 5-7 moderado, 8-10 severo; un error más con estudios bajos y uno menos con estudios altos.</li><li><b>Escala de incapacidad psíquica de la Cruz Roja:</b> niveles de 0 (normal) a 5 (vida vegetativa); muy rápida, típica en geriatría.</li><li><b>Miniexamen cognoscitivo de Lobo (MEC):</b> adaptación española del MMSE de Folstein. Cinco áreas: orientación, fijación, concentración y cálculo, memoria diferida, y lenguaje y construcción. Sobre 35: 31-35 normal; 0-14 grave. Punto de corte de demencia: 0-23 en mayores de 65 años. Limitado con bajo nivel cultural o déficit sensorial.</li><li><b>Escala de depresión de Hamilton:</b> 17 ítems; 0-7 sin depresión, 23 o más muy severa.</li><li><b>Escala de depresión geriátrica de Yesavage:</b> respuestas sí/no sobre la última semana; versiones de 30, 15 y 5 preguntas. EDG-15: 0-4 normal, 10 o más depresión establecida.</li><li><b>Inventario de depresión de Beck (BDI):</b> autoaplicado, 21 apartados sobre las últimas dos semanas; 0-13 mínima, 29-63 grave.</li><li><b>Inventario de ansiedad de Beck (BAI):</b> 21 síntomas de la última semana; 0-7 mínima, 26-63 grave.</li><li><b>Autorregistros:</b> la persona anota pensamientos amenazadores, cuándo y dónde aparecen y el malestar que le causan.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">8.4.1. Técnicas de estimulación cognitiva</h4><p>Procedimiento para mantener en buen estado o perfeccionar las funciones cognitivas. Sirven para prevenir el deterioro, estimular las funciones con retraso y rehabilitar las perdidas. Se basan en la plasticidad cerebral (Doc. 8.19): el cerebro crea conexiones, forma neuronas nuevas (neurogénesis) y reorganiza redes.</p><ul><li>Rehabilitación por restauración (ejercitar lo afectado si se puede recuperar), compensación (apoyos externos: agendas, calendarios) o sustitución u optimización (usar otras reservas: entrenar oído y tacto si se pierde la vista).</li><li><b>Tipos de terapias:</b> generales o integrales, de orientación a la realidad, de capacidades específicas (memoria, atención, lenguaje) y motivacionales y emocionales (reminiscencia, grupos de buenos días, Montessori).</li><li><b>Pautas:</b> llamarla por su nombre y mirarla, hablar de frente y claro, mantener la calma ante una agresión, ayudarla a orientarse con pistas e imágenes, darle tiempo (no acabar sus frases), entorno sin ruido ni tele, reforzar logros y evitar el estrés.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">Orientación a la realidad y entrenamiento de la memoria</h4><p>Dos de las técnicas más usadas.</p><ul><li><b>Terapia de orientación a la realidad:</b> mantener la comprensión del entorno con información espacial, temporal y personal estructurada (colores por habitaciones, líneas en el suelo, pictogramas, calendarios, tableros).</li><li><b>En sesiones programadas:</b> grupos de hasta 8 personas con nivel parecido, una hora diaria, mismo lugar y hora. Saludo, presentación, orientación temporal y espacial, comentar un suceso, actividades cognitivas y cierre.</li><li><b>Las 24 horas:</b> informal y continua; profesionales y familia recuerdan los datos de orientación en cada interacción y le preguntan qué hace, con quién, qué día es.</li><li><b>Entrenamiento de la memoria:</b> técnicas estructuradas para mantenerla o ralentizar su pérdida, en talleres. Estimula también atención y percepción (pasatiempos, reconocer objetos por el tacto, discriminar olores).</li><li>Memoria inmediata (recordar lo que se está haciendo, nombres), a corto plazo (repasar al final de la sesión) y a largo plazo (evocar el pasado, con pistas y asociaciones).</li><li><b>Estrategias:</b> visualización (imagen mental), asociación (con algo familiar), categorización (lista de la compra por grupos) y repetición verbalizada.</li><li><b>Ayudas para la memoria:</b> agendas, calendarios visibles, libreta, papel junto al teléfono, mirar el reloj, listas, dejar llaves y gafas siempre en el mismo sitio y notas para no olvidar el gas.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">Atención, lenguaje, razonamiento y terapias emocionales</h4><p>Más técnicas de estimulación cognitiva.</p><ul><li><b>Atención:</b> juegos de mesa, pasatiempos, prensa, manualidades; lugar adecuado, rutinas, descanso, variar metodología, tono de voz y recursos audiovisuales.</li><li><b>Lenguaje:</b> lectura, conversación, crucigramas, ordenar frases, sinónimos y antónimos, completar refranes y canciones; a veces logopedia o sistemas aumentativos o alternativos de comunicación.</li><li><b>Razonamiento:</b> clasificación, seriación, observación (rompecabezas, tangram), análisis y deducción (acertijos, incoherencias) y cálculo (también en compras o juegos).</li><li><b>Reminiscencia:</b> estimular el recuerdo de la propia vida con objetos o estímulos significativos, porque la memoria remota es la última en deteriorarse. Estímulos gráficos, auditivos, objetos, olores o sabores. Mejora también el autoconcepto y la autoestima; evitar recuerdos dolorosos y que nadie se burle.</li><li><b>Recursos de reminiscencia (Doc. 8.21):</b> caja de recuerdos, libro autobiográfico o historia de vida y línea del tiempo.</li><li><b>Grupos de buenos días:</b> personas sin deterioro y algunas con demencia leve o moderada; saludo, orientación y debate de titulares de prensa. Estimulan, refuerzan la autoestima y las habilidades sociales.</li><li><b>Terapia Montessori:</b> adaptada a mayores con deterioro. Actividades autodirigidas sin corregir desde fuera, materiales familiares (lana, pinzas, botones), respeto a la persona, estimulación cognitiva, sensorial y social, y planificación centrada en la persona según la fase (leve: mantener independencia; moderado-grave: AVD básicas; severo: estimular los cinco sentidos).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">8.4.2. Técnicas cognitivas</h4><p>Una técnica cognitiva es una herramienta que facilita adquirir habilidades para modificar la conducta mediante la intervención psicológica. No eliminan los pensamientos irracionales, sino que cambian la respuesta y la importancia que se les da. Secuencia: localizar el problema, analizarlo objetivamente y sustituirlo por pensamientos racionales.</p><ul><li><b>Reestructuración cognitiva:</b> identificar distorsiones y sustituirlas por pensamientos racionales; requiere meses.</li><li><b>Terapia cognitiva de Beck (1967, depresión):</b> fase I, observar y registrar los pensamientos desadaptados; fase II, generar pensamientos alternativos; fase III, modificar los esquemas comparando unos y otros.</li><li><b>Afrontamiento:</b> estrategias para controlar situaciones de mucho estrés. La más usada es la inoculación del estrés (Meichenbaum y Cameron, 1972).</li><li><b>Inoculación del estrés:</b> fase educativa (componentes cognitivo, fisiológico y motor del estrés), fase de adquisición de habilidades y ensayo (relajación, jerarquía de unas 10 situaciones de 10 a 100 puntos, vivenciarlas en imaginación de menor a mayor y pensamientos para afrontar en 4 etapas: preparación, confrontación, activación emocional y refuerzo del éxito) y fase de aplicación.</li><li><b>Resolución de problemas (D&#x27;Zurilla y Goldfried, 1971):</b> I orientación al problema (es normal tenerlos), II definición y formulación (quién, qué, dónde, cuándo, cómo y por qué, y la respuesta habitual), III generación de alternativas (lluvia de ideas), IV toma de decisiones (pros y contras) y V puesta en práctica y evaluación (si no funciona, volver a la IV).</li><li><b>Ejemplo (Doc. 8.26):</b> Lola, 71 años, se siente apartada en su coral; descubre que el problema real es tomárselo como algo personal y elige colaborar, contar hasta diez y apoyar las propuestas de otros.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">8.4.3. Otras técnicas</h4><p>Ayudan a mantener la funcionalidad cerebral, mejorar el ánimo y el estado físico.</p><ul><li><b>Psicomotricidad:</b> trabaja esquema corporal, coordinación (fina: precisión con manos y dedos; gruesa: movimientos amplios), control postural y equilibrio, lateralidad, control respiratorio y estructuración espaciotemporal (ritmos).</li><li><b>Técnica de relajación:</b> procedimiento para controlar la propia activación fisiológica; aumenta el autocontrol y ayuda contra la ansiedad, el estrés, el pánico o las fobias.</li><li><b>Respiración profunda o diafragmática:</b> tumbado, una mano en el abdomen y otra en el tórax, inspirar por la nariz llevando el aire al abdomen y espirar por la boca, 5-10 minutos.</li><li><b>Relajación progresiva:</b> tensar unos 10 segundos y relajar grupos musculares en orden (manos, brazos, hombros, cabeza, pecho, abdomen, cintura, glúteos, muslos, piernas y pies), en sesiones de una hora.</li><li><b>Mindfulness o atención plena:</b> práctica mental de autoconocimiento y autoaceptación; atención en el aquí y ahora sin juzgar. Mejora el afrontamiento, la salud, la memoria, la atención y el autocontrol.</li><li><b>Musicoterapia:</b> actividades musicales estructuradas para mejorar lo físico, cognitivo y anímico. Clínica (hospital, psicosis, autismo) o preventiva y comunitaria. Muchas personas con demencia conservan el ritmo y las canciones.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">8.5. Evaluación de la intervención</h4><p>Sigue los mismos principios que las demás unidades.</p><ul><li>Se valoran el proceso (actividades, recursos, participación), la progresión (situación inicial frente a final), los resultados (objetivos logrados), la satisfacción de la persona y el desempeño profesional.</li><li><b>Perspectiva informal:</b> observación en situaciones cotidianas, con diarios y anecdotarios.</li><li><b>Perspectiva formal:</b> escalas de estimación o listas de control con indicadores (p. ej., en reminiscencia: recuerda la imagen, la describe, narra hechos asociados, se emociona placenteramente).</li><li>Para la progresión se repite la misma escala cada cierto tiempo (por ejemplo, cada mes).</li><li>El equipo hace un informe y propone continuar, modificar o sustituir el programa.</li></ul><div style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Trucos:</b><ul><li>Percepción en 4 pasos «SSOI»: Sensación, Selección, Organización, Interpretación.</li><li>Memoria a largo plazo: Episódica = mi «Episodio» de vida; Semántica = «Significados»; Procedimental = «Procedimientos» como montar en bici.</li><li>Pfeiffer cuenta ERRORES (más es peor); el MEC de Lobo cuenta ACIERTOS (más es mejor).</li><li>Resolución de problemas «O-D-G-T-P»: Orientarse, Definir, Generar alternativas, Tomar la decisión y Probar.</li></ul></div><h2 style="font-size:28px;margin:34px 0 8px">Atención a las unidades de convivencia</h2><h3 style="font-size:22px;margin:26px 0 8px">Tema 2. Organización de la intervención en la unidad de convivencia</h3><h4 style="font-size:18px;margin:16px 0 4px">Qué vas a encontrar en esta unidad</h4><p>Continúa la Unidad 1 (RA1: qué es la unidad de convivencia, sus tipos y recursos). Ahora (RA2) se aprende a organizar la intervención a partir de un análisis riguroso de sus necesidades: por un lado, los factores y niveles que explican su grado de autonomía; por otro, las técnicas para valorar sus necesidades en los ámbitos doméstico, personal y relacional y diseñar la respuesta (formativa, organizativa y estratégica) más adecuada.</p><h4 style="font-size:18px;margin:16px 0 4px">1. Factores de la autonomía</h4><p>La autonomía de una unidad de convivencia es su capacidad para identificar sus propias necesidades, tomar decisiones sobre ellas y desarrollar, con sus propios medios o con el apoyo puntual que precise, las tareas necesarias para resolverlas. No es innata ni fija: se adquiere, se entrena y puede debilitarse o fortalecerse según factores internos (competencias de cada miembro) y externos (contexto social, económico y relacional).</p><h4 style="font-size:18px;margin:16px 0 4px">1.1. Factores internos: las habilidades parentales</h4><p>Son el factor interno más determinante: la capacidad de la madre, el padre u otra persona responsable para atender las necesidades evolutivas y educativas de sus hijos e hijas y organizar el día a día del hogar. Su ausencia o déficit suele ser el origen del problema que motiva la intervención. Valorarlas es una de las primeras actuaciones de los servicios sociales especializados, porque orienta el diagnóstico y el plan de mejora.</p><ul><li><b>Personales:</b> capacidad cognitiva y emocional para desempeñar funciones (autoestima, autoconcepto, control de los impulsos).</li><li><b>De atención y cuidado:</b> cuidado físico, psicológico y emocional de los demás miembros (seguridad, bienestar, relación afectiva, refuerzo del vínculo).</li><li><b>Educativas:</b> socialización y escolarización de los hijos (apoyo al aprendizaje, fomento de la motivación, modelos positivos).</li><li><b>Sociales:</b> capacidades comunicativas y relaciones sociales y de convivencia (habilidades comunicativas, resolución de conflictos).</li><li><b>De organización doméstica:</b> desenvolverse en la vivienda de forma funcional e independiente (preparar comidas, compras, higiene y control de la salud del hogar).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.2. Factores externos</h4><p>Están fuera de la unidad de convivencia, que tiene poco control sobre ellos, pero condicionan mucho su margen real de maniobra. Por eso la intervención trabaja en dos direcciones a la vez: reforzar las competencias internas (formación, acompañamiento, capacitación) y facilitar el acceso a recursos externos que compensen lo que la familia no puede resolver sola.</p><ul><li><b>Recursos económicos:</b> la estabilidad laboral y los ingresos determinan si puede cubrir sus necesidades básicas sin ayudas.</li><li><b>Vivienda y entorno:</b> espacio suficiente, salubridad y accesibilidad son la base material de la autonomía doméstica.</li><li><b>Nivel educativo y cultural:</b> influye en acceder a información, hacer trámites y decidir con conocimiento.</li><li><b>Red de apoyo social:</b> familia extensa, vecindario y amistades amplían los recursos y reducen la dependencia de los servicios sociales.</li><li><b>Oferta de recursos del entorno:</b> que existan o no programas en la zona condiciona qué apoyos están realmente a su alcance.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2. Niveles de autonomía</h4><p>No todas las unidades necesitan el mismo apoyo. Determinar el nivel es imprescindible para dimensionar la intervención: demasiado apoyo genera dependencia y cronifica el problema; demasiado poco deja necesidades sin cubrir. Los cuatro niveles son un continuo, no categorías cerradas, y se revisan durante toda la intervención: el objetivo siempre es acompañar a la familia hacia un nivel de autonomía superior. Para situarla se combina la puntuación del Apgar familiar con el resto de técnicas de valoración.</p><ul><li><b>1. Autonomía plena:</b> identifica sus necesidades, decide y tiene recursos para resolverlas sin apoyo externo. Intervención: ninguna, o solo información y orientación puntual.</li><li><b>2. Autonomía con apoyos puntuales:</b> gestiona su día a día con normalidad, pero necesita ayuda concreta y temporal ante una dificultad específica (un trámite, una crisis, una carencia en un área). Intervención de baja intensidad, focalizada y corta.</li><li><b>3. Autonomía con apoyo continuado:</b> carencias más estructurales en lo doméstico, personal o relacional; necesita supervisión y acompañamiento sostenidos. Intervención: plan de mejora con seguimiento periódico y trabajo en varias áreas.</li><li><b>4. Dependencia o necesidad de sustitución:</b> ahora no puede hacerse cargo de sus responsabilidades básicas ni decidir con garantías (p. ej., si está en juego la seguridad de un menor). Puede requerir que otra instancia administrativa o judicial asuma temporalmente esa función. Intervención de alta intensidad, a menudo protectora o de control.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3. Necesidades en el ámbito doméstico, personal y relacional</h4><p>Antes de intervenir hay que identificar con precisión qué necesita la unidad de convivencia, recogiendo y analizando información de forma sistemática con técnicas de valoración generales o específicas.</p><ul><li><b>Doméstico:</b> el funcionamiento material del hogar (vivienda y sus condiciones, economía doméstica, organización de tareas y rutinas, alimentación, higiene del hogar).</li><li><b>Personal:</b> el desarrollo y bienestar de cada miembro (salud física y emocional, autoestima, hábitos de vida, competencias individuales, autonomía funcional).</li><li><b>Relacional:</b> la calidad de las relaciones dentro y fuera de la unidad (comunicación entre miembros, estilo educativo, red de apoyo social, relación con la familia extensa y el entorno).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.1. Técnicas generales de valoración</h4><p>Sirven para cualquier ámbito.</p><ul><li><b>Entrevista:</b> requiere gran experiencia y destreza; el profesional debe mostrar sensibilidad y recoger la información sin dar consejos ni emitir juicios de valor.</li><li><b>Cuestionario:</b> preguntas estructuradas, cerradas o abiertas, que recogen información de forma sistemática y comparable entre casos.</li><li><b>Observación:</b> registro directo del comportamiento y las interacciones en su contexto habitual; aporta lo que la entrevista no capta.</li><li><b>Recopilación documental:</b> consultar informes, expedientes e historiales previos de otros servicios o profesionales.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.2. El genograma: personas y estado vital</h4><p>Las técnicas específicas representan de forma gráfica y sistemática la estructura, las relaciones y el entorno de la familia: genograma, Apgar familiar, mapa familiar, ecomapa y diagrama de redes sociales. El genograma representa, como un árbol familiar, la composición de la unidad de convivencia y las relaciones entre sus miembros a lo largo de varias generaciones, con una simbología convencional. Todas las figuras se dibujan del mismo tamaño.</p><ul><li><b>Hombre:</b> cuadrado. Mujer: círculo.</li><li><b>Hombre trans:</b> cuadrado con un círculo pequeño dentro. Mujer trans: círculo con un cuadrado pequeño dentro.</li><li><b>No binario:</b> arco (parte superior redondeada, base plana). Intersexual: círculo con una línea vertical.</li><li><b>Desconocido:</b> rombo. Otro: rombo con signo de interrogación. Mascota: rombo punteado unido a su dueño con línea punteada.</li><li>Cada figura puede llevar nombre, fechas, ocupación, educación y notas.</li><li><b>Vivo:</b> solo la figura. Fallecido: X sobre la figura (si se pone la edad al morir dentro, la X pasa a marcas en las esquinas).</li><li><b>Persona índice (la principal):</b> anillo o contorno doble alrededor.</li><li><b>Embarazo:</b> triángulo. Aborto espontáneo: círculo pequeño relleno. Aborto: X pequeña. Mortinato: figura a medio tamaño con una X.</li><li><b>Gemelos mellizos:</b> dos líneas de hijo desde un mismo punto. Gemelos idénticos: lo mismo, unidos por una barra corta.</li><li><b>Conviene preguntar directamente por las pérdidas gestacionales:</b> suelen omitirse y marcan a una familia durante años.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">El genograma: líneas de pareja y de hijos</h4><p>La pareja se une con una línea debajo de sus figuras; las parejas anteriores, a la izquierda de las posteriores. Una relación sin matrimonio que terminó conserva su línea y añade una barra. Los hijos cuelgan de la línea de los padres, el mayor a la izquierda.</p><ul><li><b>Compromiso:</b> noviazgo (discontinua fina), cohabitación (discontinua), compromiso (punteada), matrimonio (continua), pareja de vida (continua gruesa), desconocido (punteada gris con ?).</li><li><b>Disolución:</b> separación física (discontinua con una barra), separación legal (continua con una barra), divorcio (dos barras), vueltos a casar (dos barras cruzadas por otra invertida), anulación (dos barras y una X), viudo/a (X sobre la línea).</li><li><b>Circunstancias (en rosa):</b> aventura (discontinua rosa), aventura con separación (una barra), con divorcio (dos barras), aventura y casados, relación de una noche (puntos rosas) y violación (línea roja con X gruesa; registrar solo lo que se revele).</li><li><b>Hijos:</b> biológico (continua), adoptado (dos líneas, continua y punteada), acogida (punteada), hijastro (trazo y punto), subrogado (discontinua con S), donante de esperma (SD) y de óvulo (ED). Los padres biológicos de un hijo adoptado o acogido se unen con una línea curva fina.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">El genograma: líneas emocionales</h4><p>Se dibujan entre dos personas cualesquiera. El color tiene significado: azul y verde para la conexión; rojo para el conflicto, la fusión y la distancia. Las flechas indican relaciones en una sola dirección y apuntan a quien lo recibe. Se usan solo las necesarias, y el abuso se registra con cuidado y con la participación de la persona.</p><ul><li><b>Estándar:</b> conectada (línea simple), cercana (doble: vínculo cálido con límites sanos), fusionada (triple: sobreimplicación, límites difusos), distante (discontinua roja), hostil (zigzag), cercana y hostil, abuso emocional, físico y sexual, enfocado en, enfocado negativamente, cuidador, corte (contacto roto a propósito) y corte reparado.</li><li><b>Ampliada:</b> indiferente (sin implicación) y nunca se conocieron.</li><li><b>Positivas (verde):</b> armonía, amistad, amor, enamorado/a, apego (vínculo seguro) y limerencia (enamoramiento no correspondido).</li><li><b>Hostilidad y violencia:</b> conflicto, odio, desconfianza, distante y hostil, fusión y conflicto, fusión y hostil, violencia, distante y violencia, cercana y violencia, fusión y violencia.</li><li><b>Abuso y control:</b> abuso, negligencia física (se niegan cuidados, comida o techo), negligencia emocional, manipulación (influencia encubierta) y control (coercitivo).</li><li><b>Atención:</b> celoso/a (posesividad), fan o admirador e influencia (condiciona mucho las decisiones del otro).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">El Apgar familiar</h4><p>Escala creada por Smilkstein (1978) que evalúa numéricamente el funcionamiento familiar en personas de cualquier nivel sociocultural y económico. Tiene cinco preguntas que se puntúan nunca (0), a veces (1) o siempre (2), con un máximo de 10 puntos.</p><ul><li><b>Adaptabilidad:</b> usar recursos internos y externos para resolver problemas cuando se altera el equilibrio familiar.</li><li><b>Participación o cooperación:</b> participación, reparto de responsabilidades y decisiones compartidas.</li><li><b>Desarrollo (gradiente de crecimiento):</b> maduración de los miembros a lo largo del ciclo vital.</li><li><b>Afectividad:</b> relaciones de afecto y demostraciones de cariño.</li><li><b>Capacidad de resolución (resolve):</b> tiempo dedicado a las necesidades emocionales y físicas de la familia y compromiso para hacerlo.</li><li><b>Preguntas:</b> ¿está satisfecho con la ayuda de su familia cuando tiene un problema?, ¿discute con su pareja los problemas del hogar?, ¿toman juntos las decisiones importantes?, ¿está satisfecho con el tiempo que pasan juntos?, ¿siente que su familia le quiere?</li><li><b>Resultado:</b> 7-10 familia funcional; 4-6 disfunción familiar leve; 0-3 disfunción familiar severa.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">Mapa familiar, ecomapa y diagrama de redes</h4><p>Tres técnicas más para conocer la vivienda, el entorno y la red de apoyo.</p><ul><li><b>Mapa familiar:</b> informa de las características físicas de la vivienda (distribución, quién ocupa cada espacio, falta de espacio personal e intimidad). Lo dibuja la propia persona usuaria como un plano de su casa, señalando espacios comunes, dónde se discute, dónde se estudia… Muy útil para el ámbito doméstico y para organizar entornos seguros.</li><li><b>Ecomapa:</b> sitúa a la familia en el centro (con un pequeño genograma) y muestra sus relaciones con los sistemas del entorno: familia extensa, barrio, trabajo, ocio, educación, servicios sociales.</li><li><b>Líneas del ecomapa:</b> fina = relación débil; gruesa = relación fuerte; con marcas o rayada = estresante o conflictiva; de trazo quebrado = tenue o distante.</li><li><b>Diagrama de redes sociales:</b> representa la red de apoyo de una persona con dos variables: el tipo de relación (en los sectores del círculo: quienes conviven en casa, familia extensa, amistades, vecindario, relaciones laborales, culturales, otras organizaciones) y la intensidad (en los círculos concéntricos alrededor del «YO»).</li><li><b>Intensidad del 1 al 5:</b> 1 relación intensa diaria; 2 diaria; 3 frecuente y aceptada; 4 esporádica; 5 puntual (algún contacto). La persona va colocando en el gráfico a quienes forman su red en ese momento.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">La matriz DAFO</h4><p>Debilidades, Amenazas, Fortalezas y Oportunidades: herramienta de análisis estratégico de las organizaciones que se puede aplicar a una unidad de convivencia. A diferencia de las demás técnicas, que sirven para recoger información, el DAFO sirve para sistematizarla en un único documento visual, cruzando el origen del factor (interno o externo) con su signo (positivo o negativo). Con toda la información se formula el diagnóstico: si el funcionamiento familiar es deficiente, qué áreas fallan, con qué capacidades y recursos propios cuenta y qué intervención es la más adecuada.</p><ul><li><b>Fortalezas (interno y positivo):</b> buena comunicación, apoyo y colaboración familiar, habilidades parentales adecuadas, capacidad para resolver conflictos, ingresos estables.</li><li><b>Debilidades (interno y negativo):</b> dificultades en la gestión doméstica, problemas de comunicación, conflictos familiares, falta de habilidades parentales, dificultades económicas.</li><li><b>Oportunidades (externo y positivo):</b> servicios sociales disponibles, recursos comunitarios cercanos, apoyo del centro educativo, ayudas y prestaciones, asociaciones y red vecinal.</li><li><b>Amenazas (externo y negativo):</b> entorno social desfavorecido, desempleo o precariedad laboral, falta de recursos especializados cercanos, aislamiento geográfico o social, escasez de servicios de apoyo.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4. Necesidades de formación, información, supervisión y acompañamiento</h4><p>Las carencias detectadas se traducen en necesidades de apoyo concretas. No son excluyentes y suelen combinarse en un mismo plan. Saber cuál predomina es clave: no tiene sentido un programa intensivo de formación para una familia que ya sabe hacerlo pero desconoce los recursos, ni basta con informar cuando falta una competencia.</p><ul><li><b>De formación:</b> le faltan competencias y debe adquirirlas de forma estructurada. Respuesta: formación parental, talleres de habilidades sociales, escuelas de familias, cursos de economía doméstica.</li><li><b>De información:</b> desconoce los recursos, derechos o trámites a su alcance. Respuesta: información sobre prestaciones, ayudas, recursos sanitarios o educativos y procedimientos administrativos.</li><li><b>De supervisión:</b> ya tiene las competencias, pero hay que comprobar periódicamente que las mantiene y aplica. Respuesta: visitas de seguimiento, revisión de pautas, control del estado de menores o personas dependientes.</li><li><b>De acompañamiento:</b> necesita una presencia continuada que sostenga el cambio día a día, más que enseñar. Respuesta: acompañar en gestiones, apoyo emocional sostenido, presencia profesional en el domicilio.</li><li><b>Relación con los niveles:</b> la información predomina en autonomía plena o con apoyos puntuales; la supervisión y el acompañamiento, en apoyo continuado o dependencia.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5. Objetivos y niveles de planificación</h4><p>Las necesidades se traducen en objetivos organizados en tres niveles de concreción, de mayor a menor amplitud.</p><ul><li><b>Plan:</b> planificación general a largo plazo; marca las líneas estratégicas.</li><li><b>Programa:</b> a medio plazo; concreta el plan para un colectivo o contexto.</li><li><b>Proyecto:</b> concreta un programa en actividades con objetivos operativos a corto plazo, dirigidas a una unidad de convivencia concreta.</li><li><b>Competencias:</b> el Estado fija el marco general, las comunidades autónomas concretan normas y programas y las entidades locales acercan los recursos a la ciudadanía.</li><li><b>Región de Murcia:</b> Ley 3/2021, de 29 de julio, de Servicios Sociales de la Región de Murcia, que regula el sistema público y el catálogo de prestaciones (SAD, teleasistencia, programa de familia, recursos residenciales).</li><li><b>Formulación de objetivos:</b> de lo general a lo específico y a lo operativo, cada uno vinculado a necesidades detectadas. Ejemplo: «fomentar la corresponsabilidad en los cuidados» se concreta en facilitar el empleo de la cuidadora principal, mejorar deducciones fiscales o prevenir la pobreza infantil, con actuaciones y calendario.</li><li><b>Tipos de objetivos (vistos en la Unidad 1):</b> de concienciación, de prevención, de apoyo, de capacitación y terapéuticos. Estrategias: capacitación parental, terapia familiar y mediación familiar.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.1. Tipos de programas de atención a las familias</h4><p>Se agrupan según las necesidades que atienden.</p><ul><li><b>Educación para familias vulnerables:</b> ayudan a superar una dificultad social analizando necesidades, estableciendo actuaciones y orientando sobre ayudas.</li><li><b>Incentivación de la parentalidad positiva:</b> conocimientos, recursos y apoyos en todas las etapas de los hijos, sobre todo en la primera infancia.</li><li><b>Apoyo a familias monoparentales:</b> atención psicológica individual o familiar y, a veces, cuidado de menores fuera del horario escolar.</li><li><b>Apoyo a familias con algún miembro con necesidades especiales:</b> mayores, discapacidad o enfermedad grave; apoyo económico y actuaciones que alivian la carga.</li><li><b>Apoyo a familias con violencia familiar:</b> detección, atención y tratamiento, en coordinación con servicios sociales y tercer sector.</li><li><b>Orientación o mediación familiar:</b> familias con relaciones conflictivas de pareja o paternofiliales, para mejorar la comunicación y evitar la ruptura.</li><li><b>Conciliación familiar:</b> evitar la discriminación laboral por cargas familiares y formar a quienes vuelven al mercado laboral.</li><li><b>Solidaridad entre familias:</b> acogida familiar, alternativa no institucional para menores que no pueden estar con su familia de origen.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">6. Espacio, recursos y tiempos</h4><p>Definidos los objetivos, hay que concretar dónde se interviene, con qué recursos y en qué tiempos, porque condicionan la eficacia del plan.</p><ul><li><b>Domicilio familiar:</b> permite ver el funcionamiento real y trabajar lo doméstico, pero exige respetar la intimidad del hogar.</li><li><b>Dependencias del servicio social o recurso especializado:</b> contexto neutro y estructurado, útil para entrevistas, terapia o mediación.</li><li><b>Espacios comunitarios (centros cívicos, asociaciones, escuelas):</b> para actuaciones grupales o preventivas. El mapa familiar ayuda a decidir si hay que intervenir en la distribución de la vivienda.</li><li>Recursos humanos (equipo interdisciplinar), materiales (espacios, materiales didácticos o terapéuticos, transporte) y económicos (presupuesto para becas, ayudas o prestaciones).</li><li><b>Servicios básicos de atención social primaria:</b> organizados por zonas y unidades básicas por las comunidades autónomas; son el acceso más cercano al sistema y coordinan equipos de trabajo social, educación, integración social, terapia ocupacional y psicología.</li><li><b>Tiempos:</b> los planes de intervención familiar no suelen superar los 18 meses; si no hay cambios significativos, se revisa el plan. La frecuencia del seguimiento (semanal, quincenal, mensual) depende del nivel de autonomía: a menor autonomía, más contacto.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">6.4. Entornos seguros</h4><p>Garantizar entornos seguros para todos, sobre todo menores y personas más vulnerables, no es un añadido: es una condición transversal presente en la elección del espacio, los recursos y el calendario.</p><ul><li><b>Seguridad física del hogar:</b> adecuar la vivienda para prevenir accidentes y garantizar espacios propios e intimidad.</li><li><b>Seguridad en la intervención:</b> espacios y horarios que no añadan riesgo (p. ej., evitar coincidir con la persona agresora en casos de violencia).</li><li>Prevención de riesgos laborales y ambientales, para usuarios y para el equipo.</li><li>Protocolos claros ante emergencias durante la intervención.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">7. Carencias en la vida cotidiana y el papel del TSIS</h4><p>Las dificultades sostenidas desorganizan el funcionamiento cotidiano más allá del problema inicial. Estas alteraciones suelen ser el indicador más visible, y el primero que detecta el equipo, de que la familia necesita apoyo. Son típicas de las familias multiproblemáticas (Unidad 1).</p><ul><li><b>Falta de pautas de horarios, normas y rituales:</b> sin horarios de comida, sueño, estudio u ocio, ni rituales estables como comer juntos.</li><li><b>Falta de espacios diferenciados:</b> sin zonas separadas para menores y adultos, lo que dificulta la intimidad y puede favorecer riesgos.</li><li><b>Ausencia de espacios personales:</b> sin armario, cama o estantería propios que ayuden al orden y a la identidad.</li><li><b>Desorganización de la economía doméstica:</b> no saber cuánto entra y sale y confundir necesidades básicas con consumos no prioritarios.</li><li><b>Deficiencias en el cuidado básico:</b> descuido de la alimentación, la higiene personal y del hogar o la atención sanitaria.</li><li>El Técnico Superior en Integración Social interviene organizando actividades de apoyo a la gestión doméstica, programando actividades que refuercen las habilidades de organización doméstica y haciendo el control y seguimiento con actitud autocrítica, criterios de calidad y retroalimentación para corregir desviaciones.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">8. Respetar las decisiones de cada miembro</h4><p>No toda intervención la pide la familia, y eso cambia cómo se interviene.</p><ul><li><b>Intervención solicitada:</b> la necesidad es percibida y aceptada; la colaboración es máxima y los objetivos coinciden (una ayuda económica, el ingreso de un mayor en una residencia, un programa de capacitación parental).</li><li><b>Intervención no solicitada o rechazada:</b> la demanda viene de otra persona o institución que detecta déficits (descuido parental, falta de alimentación o higiene), o la familia se opone (separación de un menor, víctima de violencia que protege al agresor). Hay que crear un clima de colaboración para que tome conciencia del problema y de su responsabilidad en la causa y la solución, superando la desconfianza.</li><li><b>Principio de eficacia:</b> un cambio impuesto rara vez se mantiene cuando se retira el apoyo; la familia tiene que hacerlo suyo.</li><li><b>Principio de autodeterminación:</b> toda persona tiene derecho a decidir sobre su vida y la de su unidad de convivencia, con el límite de los derechos de los demás, sobre todo de los menores.</li><li><b>No sustitución:</b> el objetivo es devolver o aumentar la autonomía; sustituir sus decisiones solo se justifica temporalmente si peligra la seguridad de alguien.</li><li><b>Transparencia:</b> comunicar las decisiones con claridad, escuchar a cada miembro y explicar el porqué reduce el rechazo.</li><li>Respetar sus decisiones es reconocer a la persona como sujeto activo de su propio proceso de cambio.</li></ul><div style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Trucos:</b><ul><li>Los 4 niveles de autonomía, de menos a más ayuda: «Sola, con un empujón, de la mano, en brazos» (plena, puntual, continuado, sustitución).</li><li>Apgar = Adaptabilidad, Participación, Gradiente de crecimiento (desarrollo), Afectividad y Resolución. Puntúa 0-1-2: de 7 a 10 todo bien.</li><li>Necesidades de apoyo «FISA»: Formación (no sabe), Información (no conoce), Supervisión (sabe, pero hay que comprobarlo), Acompañamiento (necesita a alguien al lado).</li><li>Plan, programa, proyecto: de lo más grande y largo a lo más pequeño y concreto, como «país, ciudad, calle».</li><li>DAFO: lo de dentro son Fortalezas y Debilidades; lo de fuera, Oportunidades y Amenazas.</li></ul></div></main></noscript>
