orsionan.</li><li>Empleo y discapacidad, de más a menos normalizado: ORDINARIO → CON APOYO → CENTRO ESPECIAL DE EMPLEO → CENTRO OCUPACIONAL.</li></ul></div><h3 style="font-size:22px;margin:26px 0 8px">Tema 5. Los servicios y programas de intervención social</h3><h4 style="font-size:18px;margin:16px 0 4px">5.1.1. El abordaje integral</h4><p>Antes se atendía la exclusión de forma asistencialista (cubrir carencias, persona pasiva). Hoy se busca también modificar lo que provoca la exclusión y crear condiciones para la inclusión futura. El abordaje integral tiene en cuenta todas las dimensiones de la vida de la persona y requiere trabajo en red: actuación cooperativa y coordinada de profesionales y servicios diversos con un objetivo común. Se basa en:</p><ul><li>Análisis de los factores de riesgo y de protección.</li><li>Identificar y movilizar recursos externos (ayudas, servicios), comunitarios, de la red de apoyo e internos de la persona (capacidades).</li><li>Protagonismo activo y empoderamiento de la persona, buscando su corresponsabilidad.</li><li><b>Ajustar las acciones al objetivo:</b> preventivas, de promoción o de reinserción.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.1.2. Intervención individual</h4><p>Conjunto de acciones para favorecer el empoderamiento de una persona y acompañarla en su inclusión. Es prioritaria, por ejemplo, con víctimas de violencia de género, menores extutelados o personas exreclusas.</p><ul><li><b>Particularización:</b> plan de acción ajustado a sus necesidades.</li><li><b>Relación personalizada:</b> escucha activa y confidencialidad.</li><li>Acompañamiento durante todo el proceso.</li><li><b>Técnicas psicológicas:</b> ventilación (expresar libremente emociones para descargarse), contención (estabilizar en una crisis) y confrontación (mostrar evidencias de la realidad frente a una visión distorsionada).</li><li><b>Intervención familiar:</b> tomar conciencia de la situación, mejorar la convivencia y las habilidades parentales (p. ej., escuelas de padres y madres), habilidades sociales y red de apoyo.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">Intervención grupal y comunitaria</h4><p>La intervención grupal mejora el bienestar de un grupo que comparte una problemática o necesidad; fomenta la participación y el apoyo mutuo. La comunitaria busca transformar una comunidad con la participación activa de sus miembros.</p><ul><li><b>Recursos grupales:</b> talleres, terapia de grupo y grupos de autoayuda (el profesional asesora, pero no lidera).</li><li><b>Lo que aporta el grupo:</b> apoyo emocional, material, informativo, social y participación en el cambio social.</li><li><b>Pilares de la intervención comunitaria:</b> diagnóstico participativo, liderazgo y organización comunitaria, coordinación con instituciones e implementación de acciones (desarrollo local).</li><li><b>Acciones profesionales:</b> desarrollar redes comunitarias (asociaciones), facilitar espacios de encuentro, aumentar las competencias comunitarias, apoyar líderes y fomentar la relación con las instituciones.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.1.3. Sistemas de protección</h4><p>Para incluir al máximo de personas participan varios sistemas, que no se excluyen:</p><ul><li><b>Sistemas formales:</b> organizados, con requisitos, costes y plazos. Tres tipos: protección pública (servicios sociales municipales, centros de menores), privados (empresas y entidades con convenios con la Administración) y no gubernamentales (entidades sin ánimo de lucro del tercer sector).</li><li><b>Sistemas no formales:</b> red familiar, social y laboral de la persona (ayuda emocional, material, contactos).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.2.1. Recursos para menores</h4><p>La consejería de familia de cada comunidad autónoma vela por los menores, junto con justicia, policía, salud, monitores de tiempo libre y entidades (Aldeas Infantiles SOS, Save the Children, Cruz Roja, Cáritas).</p><ul><li><b>Apoyo familiar:</b> atención temprana (hasta 6 años con trastornos del desarrollo), atención socioeducativa (ludotecas, bibliotecas, centros de ocio) y atención a menores en riesgo (centros abiertos, de día, preservación familiar).</li><li><b>Acogimiento residencial:</b> de urgencia (breve, mientras se estudia el caso), básico o permanente y de atención a la diversidad (discapacidad grave, salud mental).</li><li><b>Acogimiento familiar:</b> el menor se integra en una familia de acogida valorada como idónea, temporal o a largo plazo.</li><li><b>Adopción:</b> los derechos y deberes parentales pasan de forma definitiva a la familia adoptiva; el menor es hijo legal a todos los efectos.</li><li><b>Transición a la vida adulta:</b> pisos asistidos o de transición, normalmente 1‑2 años y como máximo hasta los 21.</li><li><b>Víctimas de maltrato:</b> protocolos de detección y notificación y teléfono 116111 (24 h, gratuito, confidencial, en toda la UE).</li><li><b>Situaciones específicas:</b> menores extranjeros no acompañados (responsabilidad de la Administración) y menores infractores mayores de 14 años (internamiento cerrado, semiabierto o terapéutico; medidas en régimen abierto: trabajos en beneficio de la comunidad, tareas socioeducativas, libertad vigilada).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.2.2‑5.2.3. Recursos para mayores y familias</h4><p>Para personas mayores (servicios sociales, Imserso):</p><ul><li>Residencias, alojamientos alternativos, apartamentos residenciales, pisos asistidos y viviendas tuteladas.</li><li><b>Centros de día:</b> mantienen la autonomía y apoyan a las familias en horario diurno.</li><li>Ayuda a domicilio y teleasistencia (botón de alarma y contacto preventivo).</li><li><b>Entidades tutelares:</b> personas jurídicas sin ánimo de lucro que ejercen la tutela de mayores incapacitados.</li><li><b>Para familias:</b> información y orientación, ayuda a domicilio, alojamiento alternativo, puntos de encuentro familiar (para mantener la relación con los hijos en separaciones conflictivas), respiro familiar (descanso para quien cuida) y ayudas económicas.</li><li><b>Tercer sector:</b> federaciones y mesas de entidades (incidencia política) y redes de trabajo territoriales (coordinación de casos entre servicios).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.2.4. Recursos para mujeres</h4><p>Para la igualdad de oportunidades y contra la violencia:</p><ul><li><b>Institutos de la mujer (estatal:</b> Instituto de las Mujeres; y autonómicos): estudios, sensibilización, servicios y canalización de denuncias.</li><li><b>Centros de información y atención a la mujer:</b> asesoran en empleo, vivienda, economía, salud y violencia.</li><li>Centros de día para mujeres y casas de acogida (para madres, para víctimas de violencia de género, para mujeres con dificultades de integración) y pisos tutelados.</li><li>Juzgados de violencia sobre la mujer y órdenes de protección (medidas civiles y penales urgentes).</li><li><b>Dispositivos telemáticos:</b> pulsera para el agresor y móvil que avisa a la víctima si se acerca.</li><li><b>016 (teléfono, chat, correo):</b> información, asesoramiento jurídico y atención psicosocial.</li><li><b>ATENPRO:</b> teleasistencia móvil 24 h para víctimas de violencia de género.</li><li><b>Puntos violeta:</b> información y ayuda, sobre todo en fiestas.</li><li>Observatorio Estatal de Violencia sobre la Mujer.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.2.5. Recursos para personas LGTBIQ+</h4><p>Son víctimas frecuentes de delitos de odio: conductas penales contra una persona o grupo motivadas por prejuicios (raza, religión, orientación sexual, discapacidad…). El art. 510 del Código Penal castiga promover el odio (1‑4 años de prisión). Existe la Oficina Nacional de Lucha contra los Delitos de Odio (ONDOD).</p><ul><li><b>Asociaciones:</b> FELGTBI+ (federación estatal de más de 50 entidades), Colegas, Stop (personas trans que ejercen trabajo sexual).</li><li><b>Servicio 028 Arcoíris:</b> información, asesoramiento jurídico y atención psicosocial 24 h (el número recuerda el 28 de junio).</li><li>Puntos arcoíris contra agresiones por orientación o identidad.</li><li><b>Día Internacional del Orgullo LGTBI:</b> 28 de junio.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.2.6. Recursos para personas con discapacidad</h4><p>Se ha pasado de un modelo asistencial a otro de inclusión y autonomía. Muchas entidades nacen de las familias: ASPACE (parálisis cerebral), COCEMFE (discapacidad física y orgánica), Institut Guttmann (lesión medular), ONCE (visual), CNSE (sordera), Plena Inclusión (intelectual), Down España, Salud Mental España.</p><ul><li><b>Atención y residencia:</b> centros de día, atención intermedia (clubes), centros residenciales, minirresidencias o casas hogar (salud mental), pisos tutelados y pisos sociales protegidos.</li><li><b>Sanitarios:</b> centros de recuperación de personas con discapacidad física (CRMF), unidades de salud mental, hospitalización de día o en hospital general, cuidados prolongados, gerontopsiquiatría, comunidades terapéuticas, UTCA (conducta alimentaria), trastornos de personalidad y patología dual.</li><li><b>Educativos:</b> escolarización ordinaria, con apoyos o en educación especial (hasta los 21 años).</li><li><b>Empleo ordinario:</b> cuota de reserva del 2 % en empresas de 50 o más trabajadores y del 5 % en la Administración; empleo con apoyo.</li><li><b>Empleo protegido:</b> centros especiales de empleo (con posibilidad de enclave laboral en una empresa) y centros ocupacionales (finalidad ocupacional, no productiva).</li><li><b>Accesibilidad:</b> CEAPAT (ayudas técnicas), CIT (intermediación telefónica), CNLSE (lengua de signos) y CESyA (subtitulado y audiodescripción).</li><li><b>Oficina de vida independiente (OVI):</b> gestionada por personas con discapacidad; asesora, orienta sobre asistencia personal y apoya proyectos de vida independiente.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.2.7. Recursos para personas con adicciones</h4><p>Se organizan en tres niveles:</p><ul><li><b>Primer nivel (puerta de entrada):</b> detectar, motivar, atención básica y derivar. Incluye reducción de daños: centros de encuentro y acogida (duchas, comida, salas de venopunción higiénica) y unidades móviles.</li><li><b>Segundo nivel (objetivo:</b> la abstinencia): centros ambulatorios y centros de dispensación de metadona.</li><li><b>Tercer nivel (especializado):</b> unidades de desintoxicación hospitalaria, comunidades terapéuticas, centros de día, pisos de apoyo y talleres de inserción sociolaboral.</li><li><b>En prisión:</b> módulos terapéuticos o UTE (unidades terapéuticas y educativas).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.2.8‑5.2.9. Recursos para inmigrantes y pueblo gitano</h4><p>La atención depende del Estado (política migratoria, nacionalidad, residencia, expulsiones), las comunidades autónomas (educación, sanidad, inserción laboral) y los entes locales (padrón, informes de arraigo). Entidades: Red Acoge, SOS Racismo, Cruz Roja, Cáritas.</p><ul><li><b>Arraigo social:</b> residencia temporal por circunstancias excepcionales tras 3 años en España, con contrato y vínculos o informe de arraigo, sin antecedentes penales.</li><li><b>Reagrupación familiar:</b> quien reside legalmente y tiene medios y vivienda puede traer a pareja, hijos menores o ascendientes.</li><li><b>Padrón municipal:</b> registro de quienes viven en un municipio; obligatorio aunque se esté en situación irregular. Demuestra el tiempo en España y da acceso a sanidad, escuela y ayudas.</li><li><b>CATE:</b> Centros de Atención Temporal de Extranjeros (primeras 72 horas).</li><li><b>CETI (Ceuta y Melilla) y CAED:</b> primera acogida sin internamiento ni límite de estancia.</li><li><b>CIE:</b> Centros de Internamiento de Extranjeros, retención cautelar hasta un máximo de 60 días para resolver la expulsión.</li><li>Centros de atención social y centros de día de emergencia social (ropero, duchas, orientación).</li><li><b>Pueblo gitano:</b> Consejo Estatal del Pueblo Gitano (con Fundación Secretariado Gitano, Kamira, Khetane).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.3.1. Programas de intervención social</h4><p>Promueven las fortalezas y el empoderamiento (no son beneficencia). Fases: ámbito o colectivo, objetivos, acciones (metodología y prioridades), recursos y evaluación. También hay que sensibilizar a la sociedad. Tipos:</p><ul><li><b>Habilidades personales:</b> AVD, hábitos de higiene y horarios, habilidades sociales.</li><li><b>Promoción de la salud:</b> hábitos saludables, prevención (VIH, embarazos no deseados, drogas) e intervención en enfermedades (metadona, intercambio de jeringuillas).</li><li><b>Educativos:</b> refuerzo escolar, implicar a las familias, prevenir el abandono.</li><li><b>Inserción laboral:</b> formación, orientación e itinerarios ocupacionales personalizados.</li><li>Ocio y tiempo libre.</li><li><b>Inserción social:</b> minorías, inmigrantes, personas exreclusas.</li><li>Apoyo en momentos de especial vulnerabilidad (familias de dependientes, mediación, refugiados).</li><li><b>Promoción de la igualdad:</b> mujeres (vocaciones STEAM, prevención de violencia sexual) y LGTBIQ+.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.3.2. Prestaciones y ayudas</h4><p>Prestaciones económicas y de servicios:</p><ul><li>Ingreso Mínimo Vital (IMV) y renta mínima de inserción autonómica.</li><li><b>Prestaciones familiares:</b> por hijo a cargo, nacimiento o adopción, cuidado de menores con cáncer o enfermedad grave, cuidados en el entorno familiar.</li><li><b>Pensiones no contributivas:</b> de invalidez (18‑65 años, discapacidad ≥65 %, 5 años de residencia) y de jubilación (más de 65 años y 10 de residencia, sin cotización suficiente).</li><li><b>Subsidios por desempleo:</b> por agotar la prestación, por cotización insuficiente (al menos 90 días), para mayores de 52 y para víctimas de violencia de género o sexual.</li><li>Prestación vinculada al servicio (dependencia) y subsidio de movilidad.</li><li><b>Servicios:</b> teleasistencia, asistencia personal, ayuda a domicilio, centros de día y de noche, atención residencial, respiro familiar y ayudas residenciales de emergencia (puntos extra en vivienda pública).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.4. Las redes de apoyo</h4><p>La red de apoyo de una persona es el conjunto de conexiones personales, sociales y comunitarias que le ayudan en momentos cruciales. Puede ser formal (sistemas y servicios) o informal (lazos personales, grupos de ayuda, voluntariado). El apoyo social es toda la ayuda que una persona recibe o a la que puede acceder por sus redes. El apoyo percibido no siempre coincide con el real.</p><ul><li><b>Depende de:</b> amplitud de la red, calidad de los vínculos, características de la persona, contexto y situación.</li><li><b>Se puede rechazar por:</b> reticencia (siente que le coarta), autoestima (vergüenza) o atribución (cree que es por lástima).</li><li><b>Tipos de apoyo:</b> emocional o expresivo, instrumental (material o intangible, como un servicio), informativo y educativo.</li><li><b>Rasgos:</b> espontaneidad, reciprocidad, cooperación, solidaridad, autonomía y responsividad (respuesta rápida).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.4.2. Los grupos de ayuda</h4><p>Un grupo de ayuda es un grupo pequeño, voluntario y estructurado para el apoyo mutuo y un propósito concreto. Surgieron en EE. UU. en el siglo XX (alcoholismo, juego). Principios: respeto, confidencialidad e inclusión.</p><ul><li><b>Características:</b> experiencia común, estructura horizontal (entre iguales), apoyo variado, reuniones presenciales regulares, grupo pequeño y flexible, identidad propia (no sustituyen a los servicios profesionales).</li><li><b>Autocentrados:</b> personas afectadas directamente (Alcohólicos Anónimos, duelo perinatal). Heterocentrados: el entorno de la persona afectada (familias).</li><li><b>Según el problema:</b> internos (adicciones, enfermedades) o externos (pobreza).</li><li><b>Según el fin:</b> apoyo en situaciones vitales o para el cambio legislativo y social.</li><li><b>Según la orientación:</b> de acogida (crisis puntuales), de autoayuda (trabajo personal), de ayuda mutua y de resocialización.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.4.3. El voluntariado</h4><p>La participación social crea lazos y protege de la exclusión. El voluntariado es una forma de participación social solidaria, desarrollada por personas físicas, en torno a un proyecto colectivo sin ánimo de lucro. En España es voluntaria un 10 % de la población (más de 4,2 millones; 55 % mujeres).</p><ul><li><b>Voluntariedad:</b> decisión libre, sin relación laboral ni obligación.</li><li><b>Altruismo:</b> sin contraprestación económica; el beneficio es personal.</li><li><b>Organización:</b> dentro de una entidad sin ánimo de lucro.</li><li><b>Compromiso:</b> dedicación estable o recurrente.</li><li><b>Vocación social y comunitaria:</b> busca el bien común.</li><li><b>Ámbitos:</b> social, internacional, ambiental, cultural, deportivo, educativo, sociosanitario, ocio, comunitario y protección civil.</li><li><b>Límites:</b> no sustituye a trabajadores remunerados ni las obligaciones de las Administraciones.</li></ul><div style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Trucos:</b><ul><li>Teléfonos que salvan: 016 violencia contra la mujer · 116111 infancia (muchos unos, como niños en fila) · 028 LGTBI (28 de junio, Orgullo).</li><li>Niveles de adicciones: 1.º «te recibo» (puerta de entrada y reducción de daños) → 2.º «te desenganchas» (ambulatorio, metadona) → 3.º «te especializo» (hospital, comunidad terapéutica).</li><li>Pilares del voluntariado = V‑A‑O‑C‑V: Voluntariedad, Altruismo, Organización, Compromiso, Vocación social.</li></ul></div><h2 style="font-size:28px;margin:34px 0 8px">Metodología de la intervención social</h2><h3 style="font-size:22px;margin:26px 0 8px">Tema 1. La intervención social</h3><h4 style="font-size:18px;margin:16px 0 4px">1.1. La intervención social y la metodología</h4><p>Todas nuestras actuaciones atienden situaciones de personas con necesidades de integración y participación. La intervención social es cualquier actuación intencionada y justificada que se programa y ejecuta con una finalidad social o cultural. Su finalidad: mejorar las condiciones de vida, eliminar desigualdades y promover la dinamización cultural y la movilización social. La metodología es el conjunto de estrategias, métodos y procedimientos organizados y secuenciados para intervenir en lo social.</p><h4 style="font-size:18px;margin:16px 0 4px">1.1.1. Ámbitos de la intervención social</h4><p>La intervención se concreta en actuaciones en estos entornos:</p><ul><li><b>Atención directa:</b> trabajo personalizado y cercano con la persona usuaria (ayuda a domicilio, centros residenciales, monitores de tiempo libre).</li><li>Planificación, ejecución y evaluación de proyectos.</li><li><b>Orientación:</b> inserción laboral, recursos sociales, participación, tiempo libre.</li><li><b>Dinamización social o comunitaria:</b> asociacionismo, voluntariado, concienciación.</li><li><b>Educación y formación:</b> habilidades sociales, formación ocupacional.</li><li><b>Ocupación del tiempo libre:</b> ocio constructivo y no alienante.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.1.2. Colectivos destinatarios</h4><p>Colectivos que por su vulnerabilidad necesitan medidas compensatorias:</p><ul><li><b>Personas mayores:</b> bienestar y conservación de sus facultades.</li><li><b>Infancia y adolescencia en riesgo:</b> también se interviene con su familia.</li><li><b>Personas con discapacidad o enfermedad mental:</b> integración y calidad de vida.</li><li><b>Personas inmigrantes:</b> integración desde la interculturalidad.</li><li><b>Personas con drogodependencias:</b> reducir riesgos, reforzar protección, reinserción, reducir la mortalidad y mejorar su calidad de vida.</li><li><b>Igualdad de oportunidades entre sexos:</b> prevenir y eliminar la discriminación y la violencia de género.</li><li>La animación sociocultural y turística se dirige además a toda la sociedad.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.1.3. Modelos de intervención social</h4><p>Un modelo de intervención es el conjunto de principios que forma un esquema de referencia para guiar la práctica. Según la relación con la persona usuaria (en la realidad suelen mezclarse):</p><ul><li><b>Asistencialista-paternalista:</b> carácter asistencial, se centra en las carencias sin tocar las causas estructurales; no busca cambio social (comedores sociales, ropa, ayudas de urgencia). Fue el de los inicios (caridad religiosa) y sigue vigente.</li><li><b>Tecnocrático-burocrático:</b> el Estado asume políticas, leyes y presupuesto; llega la profesionalización (psicología, trabajo social, educación social), pero también la burocracia: las personas acaban adaptándose a los servicios y no al revés. Propio de la expansión del estado del bienestar.</li><li><b>Democrático-emancipador:</b> capacita a las personas para superar sus dificultades por sí mismas y de forma colectiva; centrado en la persona y sus potencialidades y en las causas estructurales. Es el más extendido hoy.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.2.1. Criterios de planificación</h4><p>La intervención no se improvisa: se planifica (planificar = decidir por anticipado qué hacer). Criterios:</p><ul><li><b>Alcance temporal:</b> largo plazo (3‑5 años), medio plazo (1‑3 años) y corto plazo (menos de un año).</li><li><b>Alcance espacial:</b> estatal, autonómica y local (diputación, ayuntamiento u organización de base).</li><li><b>Objeto:</b> global (todo tipo de planificaciones de un país) o sectorial (económica, social, cultural, educativa…).</li><li><b>Nivel de operatividad:</b> estratégica (grandes líneas, largo plazo), táctica (más concreción) y operativa (actuaciones, presupuestos y recursos detallados). Son jerárquicos: la táctica desarrolla la estratégica y la operativa sale de la táctica.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.2.2. Niveles de planificación: plan, programa y proyecto</h4><p>Los tres niveles se concretan en tres documentos:</p><ul><li><b>PLAN (nivel estratégico):</b> el máximo nivel; marca las líneas generales. Global o sectorial; estatal, autonómico o local. Elementos: temporalización (medio y largo plazo, 3‑5 años), objetivos generales, criterios (orientaciones para lograr los objetivos) y prioridades (lo más urgente), y previsión de presupuesto.</li><li><b>PROGRAMA (nivel táctico):</b> adapta el plan a un contexto, ámbito y tiempo concretos (1‑3 años). Elementos: objetivos específicos, organización de recursos y fundamentación (argumentación que justifica el programa).</li><li><b>PROYECTO (nivel operativo):</b> el instrumento más frecuente; corto plazo (un año o menos), objetivos operativos medibles y actividades.</li><li><b>Ejemplo:</b> Plan de Juventud → programa de autonomía y emancipación → proyectos de vivienda, empleo y formación.</li><li><b>Finalidad vs. objetivo:</b> la finalidad es el impacto (reducir el paro juvenil del barrio); el objetivo, el efecto de ejecutar la intervención (crear un servicio de orientación laboral).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.3. El proyecto como eje de la intervención</h4><p>El proyecto es el eje del trabajo del técnico superior: lo diseña, lo aplica y lo evalúa. Elaborarlo es responder a preguntas:</p><ul><li>¿Qué? Naturaleza · ¿Por qué? Justificación · ¿Para qué? Objetivos.</li><li>¿Cómo? Metodología · ¿Cuáles son los contenidos? Actividades.</li><li>¿A quién? Destinatarios · ¿Dónde? Ubicación · ¿Cuándo? Temporalización.</li><li>¿Quién? Recursos humanos · ¿Con qué? Recursos materiales y financieros.</li><li>¿Cómo, qué, con qué, cuándo y quién evaluará? Evaluación.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.3.2. Fases del proyecto (G. Pérez Serrano)</h4><p>El modelo de Pérez Serrano divide el proyecto en cuatro fases, más una introducción y una fase final de difusión:</p><ul><li><b>1. Análisis y diagnóstico:</b> identificar necesidades, delimitar el problema y prever recursos.</li><li><b>2. Planificación o programación:</b> objetivos, metodología, temporalización y recursos.</li><li><b>3. Ejecución o implementación:</b> poner en práctica las actividades.</li><li><b>4. Evaluación:</b> en todas las fases, incluida la propia evaluación; termina en el informe final.</li><li><b>Difusión:</b> elegir mensaje y medios para llegar al público.</li><li>Es dinámico (retroalimentación entre fases) y cíclico (la nueva realidad es el punto de partida de un nuevo proyecto).</li><li><b>Características de un buen proyecto:</b> flexible, económico, útil, coherente, sencillo, breve, claro y original o creativo.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.4. La perspectiva de género</h4><p>Aún hay desigualdad en educación (carreras feminizadas y masculinizadas), trabajo (brecha salarial, paro, conciliación), toma de decisiones, vida doméstica (doble jornada), relaciones (violencia de género) y medios. La perspectiva o enfoque de género es la metodología que permite identificar, cuestionar y valorar la desigualdad y la discriminación que sufren las mujeres por serlo. Es esencial en cualquier intervención.</p><ul><li><b>Diferencia:</b> rasgo de todos los seres humanos, enriquecedor; deja de serlo si genera desigualdad.</li><li><b>Desigualdad:</b> construida social y culturalmente; acceso desigual a recursos.</li><li><b>Igualdad:</b> mismos derechos, deberes y oportunidades; compatible con la diferencia.</li><li><b>Diferencias de sexo:</b> físicas y biológicas. Diferencias de género: de tradiciones, valores y creencias.</li><li><b>Identidad de género:</b> cómo se percibe cada persona. Género no binario: agénero, bigénero, trigénero, pangénero.</li><li><b>Roles de género:</b> modelos y funciones esperados (femeninos en lo privado y los cuidados; masculinos en lo público, el éxito y el dominio).</li><li><b>Estereotipos de género:</b> características simplificadas que se asumen como propias de cada género (mujer débil, sensible; hombre fuerte, racional).</li><li><b>Androcentrismo:</b> lo masculino como prototipo universal. Patriarcado: la autoridad la ejerce el varón.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.4.2. La perspectiva de género como herramienta</h4><p>Dos conceptos clave:</p><ul><li><b>Transversalidad:</b> la igualdad no es una medida añadida para mujeres, sino que forma parte de todos los planteamientos y actuaciones.</li><li><b>Empoderamiento:</b> proceso por el que las mujeres ganan confianza, recursos y fuerza para enfrentar la desigualdad y cambiar su posición.</li><li><b>Debe estar en todas las fases:</b> diagnóstico (necesidades y obstáculos de las mujeres), diseño y ejecución (criterios de igualdad) y evaluación (indicadores de desigualdad).</li><li><b>También en la comunicación:</b> lenguaje no sexista y sin estereotipos.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.4.3. Políticas de igualdad</h4><p>La igualdad es un principio jurídico universal; se busca pasar de la igualdad legal a la real.</p><ul><li><b>ONU:</b> conferencias mundiales sobre la mujer: México 1975 (Año Internacional de la Mujer; propuso la Convención contra la discriminación de la mujer, aprobada en 1979), Copenhague 1980, Nairobi 1985 y Pekín 1995 (Plataforma de Acción con 12 áreas: pobreza, educación, salud, violencia, conflictos armados, economía, poder, mecanismos institucionales, derechos humanos, medios, medio ambiente y la niña). Revisiones cada 5 años. ONU Mujeres (2010).</li><li><b>Unión Europea:</b> Instituto Europeo de la Igualdad de Género (EIGE, 2006, Vilna): investiga, publica estadísticas, vigila Pekín y coordina la campaña del lazo blanco. Otras acciones: Carta de la Mujer (2010), Compromiso Estratégico 2016‑2019, Plan de Acción 2016‑2020 y adhesión al Convenio de Estambul (2017) contra la violencia hacia las mujeres.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.4.4. Igualdad de oportunidades en España</h4><p>Parte de la Constitución de 1978, que acabó con la inferioridad legal de la mujer del franquismo.</p><ul><li><b>Art. 14:</b> igualdad ante la ley sin discriminación por nacimiento, raza, sexo, religión, opinión…</li><li><b>Art. 9.2:</b> los poderes públicos deben promover la libertad e igualdad reales y efectivas.</li><li><b>Art. 35:</b> derecho y deber de trabajar sin discriminación por sexo.</li><li><b>Ley Orgánica 3/2007 para la Igualdad Efectiva de Mujeres y Hombres:</b> ley integral que prevé conductas discriminatorias, plantea políticas activas y transversales, fija criterios para los poderes públicos y medidas para las empresas.</li><li>Instituto de la Mujer y para la Igualdad de Oportunidades (IMIO, 2014; el Instituto de la Mujer es de 1983).</li><li>Cada comunidad autónoma tiene sus leyes de igualdad y contra la violencia de género.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">Herramientas para tomar decisiones</h4><p>Diseñar y aplicar un proyecto exige decidir continuamente. Herramientas que se ven en el libro:</p><ul><li><b>Detección y análisis de necesidades (UD2):</b> diagrama de espina de pescado y diagrama de Pareto.</li><li><b>Diseño y ejecución (UD3):</b> diagrama de árbol, diagrama de decisiones de acción y diagrama de Gantt (y PERT).</li><li><b>Evaluación (UD4):</b> matriz DAFO.</li><li><b>Promoción y difusión (UD5):</b> lluvia de ideas y bola de nieve.</li></ul><div style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Trucos:</b><ul><li>PLAN, PROGRAMA, PROYECTO = del mapa del país al plano de tu calle. Plan = Estratégico, Programa = Táctico, Proyecto = Operativo → «E‑T‑O: Esto Tiene Orden».</li><li>Modelos de intervención: ASISTENCIALISTA te da el pez · TECNOCRÁTICO te manda rellenar un formulario para el pez · DEMOCRÁTICO‑EMANCIPADOR te enseña a pescar con tu barrio.</li><li>Fases de Pérez Serrano = «Di‑Pla‑Eje‑Eva»: Diagnóstico, Planificación, Ejecución, Evaluación (y luego difundes).</li></ul></div><h3 style="font-size:22px;margin:26px 0 8px">Tema 2. Investigación social: necesidades y diagnóstico</h3><h4 style="font-size:18px;margin:16px 0 4px">2.1. La investigación social</h4><p>El proyecto debe responder a necesidades identificadas mediante investigación. La investigación social es la aplicación de un conjunto de técnicas, estrategias y recursos para estudiar la realidad social. Sus conclusiones permiten el diagnóstico social, base del proyecto. Se orienta a tres análisis:</p><ul><li><b>Análisis de las necesidades:</b> características, demandas, necesidades e intereses de la población.</li><li><b>Análisis del contexto:</b> medio físico (localización, accesos, medio ambiente) y humano y social (nivel socioeconómico, minorías, estructura de la población, familias, integración).</li><li><b>Análisis de los recursos:</b> qué hay y qué haría falta (valora la viabilidad).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.1.2. Un método científico</h4><p>El método científico es un procedimiento en fases que se siguen de forma sistemática para obtener información válida, objetiva y fiable. Exige elegir las fuentes y aplicar las técnicas adecuadas.</p><ul><li><b>Fiabilidad:</b> otra persona que estudiase lo mismo con la misma técnica obtendría resultados similares.</li><li><b>Validez:</b> los datos se ajustan a la realidad. Interna (concordancia entre la realidad investigada y los resultados) y externa (se pueden generalizar a poblaciones similares).</li><li><b>Fuentes secundarias (de segunda mano):</b> ya elaboradas; se consultan primero porque son las más fáciles y baratas. Internas (de la propia organización) o externas (publicaciones, estadísticas).</li><li><b>Fuentes primarias (de primera mano):</b> información nueva generada para la investigación; se usan cuando las secundarias no bastan.</li><li><b>Métodos interrogativos:</b> técnicas cuantitativas (miden y cuantifican; la reina es la encuesta) y cualitativas (buscan el sentido y significado, valoran la subjetividad: entrevista, técnicas de grupo, historias de vida).</li><li><b>Métodos observacionales:</b> la observación.</li><li><b>Investigación-acción:</b> la comunidad investiga su propia realidad para transformarla; espiral de 4 fases: diagnóstico, plan de acción, actuación y reflexión.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.2. La recopilación documental</h4><p>Obtener información de hechos o realidades ya recogidos en documentos (fuentes secundarias). Tipos de documentos: escritos, estadísticos o numéricos, audiovisuales y multimedia, y documentos objeto (restos, obras artísticas).</p><ul><li><b>Fases:</b> localizar y acceder a la información, y analizar la documentación (extraer lo relevante y archivarlo en fichas).</li><li><b>Con las TIC:</b> definir la necesidad, seleccionar documentos y extraer información. Acceso restringido (de pago, más elaborado) o libre.</li><li><b>Portales:</b> webs temáticas con recursos (Discapnet, Eduso, portal de violencia de género…).</li><li><b>Buscadores y operadores booleanos:</b> AND (ambos términos), OR (cualquiera), NOT (uno sí y otro no), comillas (frase exacta), filetype (formato) y alertas.</li><li>Buscadores especializados (libros, académicos, noticias) y tesauros (vocabularios ordenados, como el de la UNESCO).</li><li><b>RSS (Really Simple Syndication):</b> recibir automáticamente las novedades de las webs que te interesan en un lector.</li><li><b>Limitaciones:</b> sesgo informativo e inadecuación de la información. Ventajas: accesibilidad y bajo coste.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.3. La encuesta</h4><p>Técnica de recogida de información estandarizada, mediante un cuestionario, sobre un grupo de personas. Se pregunta a una muestra representativa y los resultados se extrapolan a la población. El cuestionario es un listado de preguntas estructuradas, con respuestas limitadas, que se aplica con la máxima neutralidad. Cuatro fases: elaboración del cuestionario, determinación de la muestra, administración y análisis e interpretación.</p><ul><li><b>Según su finalidad:</b> descriptiva (cómo se distribuye una realidad) o explicativa (por qué ocurre).</li><li><b>Según su contenido:</b> hechos, opiniones, o actitudes, motivaciones y sentimientos.</li><li><b>Preguntas abiertas:</b> responde con sus palabras; más ricas pero difíciles de codificar; útiles en estudios exploratorios.</li><li><b>Preguntas cerradas:</b> dicotómicas (sí/no; deben formularse de forma equilibrada: «¿a favor o en contra…?») o de elección múltiple (frecuencia, grado o varias opciones).</li><li><b>Según su función:</b> de introducción o contacto, sustantivas (lo básico investigado), filtro (descartan a quien no afecta la siguiente), de cambio de tema, de control (verifican respuestas), de distensión (relajan), colchón o amortiguadoras (suavizan temas difíciles) y en batería (varias sobre un tema, a veces en embudo).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">Escalas de actitud</h4><p>Ofrecen respuestas graduadas:</p><ul><li><b>Escalas de estimación (de ordenación):</b> de puntos, combinaciones binarias y clasificaciones directas (ordenar de mayor a menor).</li><li><b>Escalas de apreciación (de intensidad):</b> de «muy adecuado» a «muy inadecuado».</li><li><b>Escalas de distancia social:</b> preguntas indirectas sobre la cercanía aceptada hacia un grupo (turista → vecino → familiar).</li><li><b>Diferencial semántico:</b> situarse entre pares de adjetivos opuestos (gratificante‑desolador).</li><li><b>Orden del cuestionario:</b> empezar con preguntas fáciles, lo sustantivo en el segundo tercio, transiciones, distensión y cierre cordial; datos personales al final.</li><li><b>Pretest:</b> prueba piloto con un grupo pequeño para detectar preguntas confusas antes de aplicarlo.</li><li><b>Reglas:</b> pocas, sencillas, sin prejuicios, sin negaciones ni palabras valorativas (demasiado, bueno…), concretas y sin preguntar «¿por qué?».</li></ul><h4 style="font-size:18px;margin:16px 0 4px">Muestra, aplicación y análisis</h4><p>Fases II‑IV de la encuesta:</p><ul><li><b>Tamaño muestral:</b> cuántas personas hacen falta para que sea representativa (cálculos estadísticos).</li><li><b>Procedimiento muestral:</b> criterios para elegir a las personas y evitar una muestra sesgada (p. ej., no solo mujeres de Sevilla de 70 años).</li><li><b>Administración (trabajo de campo):</b> presencial (la más efectiva), telefónica, por correo o digital. El encuestador debe formular bien, ser neutral y registrar con cuidado.</li><li><b>Tabulación:</b> pasar las respuestas a una tabla (filas = cuestionarios, columnas = preguntas).</li><li><b>Comprobación de la consistencia:</b> anular cuestionarios incoherentes (con ayuda de las preguntas de control).</li><li><b>Análisis de datos:</b> frecuencias, porcentajes, tendencias… e informe.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.4. La entrevista</h4><p>Técnica de recogida de información a partir del intercambio verbal entre dos o más personas. Es la que da la información más precisa sobre las personas. Es bidireccional; puede ser individual o colectiva y también se usa para apoyo o seguimiento. A diferencia de la encuesta, las preguntas son abiertas.</p><ul><li><b>Estructurada secuenciada:</b> preguntas planificadas en el mismo orden para todos, máxima neutralidad.</li><li><b>Estructurada no secuenciada:</b> se puede alterar el orden; más natural.</li><li><b>No estructurada (abierta):</b> flexible, basada en un guion de informaciones clave; muy rica pero exige experiencia, control y un clima fluido.</li><li><b>Fase 1, preparación:</b> organizativa (avisar, explicar objetivos, garantizar anonimato y pedir consentimiento; fecha y lugar; documentarse) y del contenido (guion o preguntas).</li><li><b>Fase 2, ejecución:</b> ambiente agradable y privado, rapport (clima de confianza inicial), conducir según el guion, no es un interrogatorio, y grabar las respuestas.</li><li><b>Fase 3, cierre:</b> cuando acaba el tiempo, se obtiene toda la información o ya no se puede obtener más; síntesis, agradecimiento y puerta abierta.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.5. Las técnicas de grupo</h4><p>Entrevistas colectivas en las que la información surge de la conversación entre varias personas dirigidas por un moderador, que debe crear buen clima, gestionar la reunión, centrar los temas clave y moderar las intervenciones.</p><ul><li><b>Grupo de discusión:</b> 6‑10 personas que no se conocen pero comparten características; unos 60 minutos; se graba; mucha información cualitativa y exploratoria. Útil para ideas creativas, temas delicados o representaciones sociales (J. Callejo).</li><li><b>Grupo focalizado:</b> preguntas más específicas y centradas en el tema; moderador más directivo.</li><li><b>Técnica Delphi:</b> personas expertas opinan de forma anónima en varias rondas hasta el consenso. Fases: definir el problema, seleccionar informantes, consultas sucesivas y análisis. Es la más estructurada.</li><li>Lluvia de ideas (se ve en la UD5).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.6. Las historias de vida</h4><p>Narraciones biográficas en las que una persona relata su vida tal como la recuerda. Es una entrevista en profundidad que conoce un grupo humano mediante un testimonio vivo (muy útil con inmigrantes o exclusión).</p><ul><li>Es un relato autobiográfico y subjetivo (justo lo que interesa).</li><li>Se obtiene por mediación del investigador, con preguntas exploratorias.</li><li>Se hace en entrevistas sucesivas hasta el punto de saturación (cuando ya no aporta nada nuevo).</li><li><b>Preparación previa:</b> criterios para elegir informantes, objetivos y guion.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.7. La observación</h4><p>Técnica de recopilación de datos y captación de la realidad sociocultural de una comunidad o grupo. Permite registrar la vida cotidiana y los procesos tal como ocurren. Actitudes del observador: perceptivo, respetuoso y objetivo.</p><ul><li><b>Según la sistematización:</b> estructurada (objetivos e instrumentos definidos de antemano) o no estructurada (libre, sin categorías; útil para plantear hipótesis).</li><li><b>Según el número de observadores:</b> individual (más subjetiva) o colectiva.</li><li><b>Según la participación:</b> participante (natural, si ya pertenece al grupo, o artificial, si se integra para observar) o no participante o externa.</li><li><b>Según el lugar:</b> de la vida real o experimental (de laboratorio, p. ej., un role playing).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.7.2. Registros y proceso de observación</h4><p>Los datos se anotan en registros:</p><ul><li><b>Cerrados o categoriales:</b> listas de comprobación (presencia o ausencia de una conducta) y escalas de estimación (de grado, de frecuencia o descriptivas).</li><li><b>Abiertos descriptivos:</b> el anecdotario (anotar lo que se ve u oye sin interpretar).</li><li><b>Abiertos narrativos:</b> notas de campo (incluyen impresiones personales; subjetivas, muy útiles en observación participante) y diarios (en primera persona, totalmente subjetivos).</li><li><b>Tecnológicos:</b> audio, vídeo o fotografía.</li><li><b>Proceso:</b> análisis previo, definir el objeto, concretar la metodología, elaborar registros, observar y analizar.</li><li><b>Errores:</b> sesgo por expectativas previas, generalización a partir de un rasgo (efecto halo) y estado de ánimo del observador.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.8. El informe de investigación</h4><p>Documento formal que recoge de forma organizada los resultados de la investigación y el diagnóstico social. Sobre él se construye todo el proyecto.</p><ul><li><b>Bloque introductorio:</b> justificación, objetivos, diseño, técnicas e instrumentos.</li><li><b>Resultados:</b> análisis e interpretación, con tablas y gráficos.</li><li><b>Conclusiones:</b> por temas y por importancia; diagnóstico y recomendaciones.</li><li><b>Anexos:</b> bibliografía y documentación generada.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.9. Ética y género en la investigación</h4><p>La intervención nunca es neutra. La ética busca el equilibrio entre respetar los derechos de las personas y cumplir la metodología científica.</p><ul><li><b>Principios éticos:</b> derechos humanos y autonomía, privacidad (la persona y su imagen) y confidencialidad (los datos y su uso), consentimiento explícito e informado, prever el impacto, relaciones horizontales, honestidad, prudencia con las técnicas y fundamentación científica.</li><li><b>Tres reglas de oro:</b> informar de todo, libertad para participar o abandonar, y anonimato y secreto de las respuestas.</li><li><b>Sesgos de género:</b> androcentrismo, sobregeneralización (generalizar resultados obtenidos solo con hombres), insensibilidad de género (ignorar la variable género), doble rasero, naturalización, dicotomía sexual y familismo (tomar la familia como unidad e ignorar sus desigualdades internas).</li><li><b>Medidas:</b> análisis de género sistemático, datos desagregados, indicadores de desigualdad, identificar barreras y lenguaje no sexista.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">Herramientas: espina de pescado y Pareto</h4><p>Dos herramientas para analizar necesidades:</p><ul><li><b>Diagrama de espina de pescado (causa‑efecto o de Ishikawa):</b> representa gráficamente las causas de un problema. Pasos: definir el efecto o problema (la cabeza), identificar causas principales (espinas) y causas secundarias.</li><li><b>Diagrama de Pareto (curva 80‑20):</b> cuantifica los problemas según el principio de Pareto: el 20 % de las causas genera el 80 % de los efectos. Sirve para priorizar en qué causas actuar.</li></ul><div style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Trucos:</b><ul><li>Fiabilidad = «otra persona obtendría lo mismo»; Validez = «lo que mido se parece a la realidad».</li><li>DELPHI = expertos en la sombra: Expertos + Anónimos + Rondas hasta el Consenso (como el oráculo de Delfos).</li><li>Registros de observación, de menos a más subjetivo: LISTA → ESCALA → ANECDOTARIO (sin interpretar) → NOTAS DE CAMPO (con impresiones) → DIARIO (yo, yo, yo).</li><li>Pareto 80‑20: el 20 % de tus despistes causa el 80 % de tus suspensos.</li></ul></div><h3 style="font-size:22px;margin:26px 0 8px">Tema 3. Diseño y ejecución de proyectos</h3><h4 style="font-size:18px;margin:16px 0 4px">3.1. El proyecto de intervención social</h4><p>Formalmente, el proyecto es un documento que expone toda la información de las actuaciones propuestas para atender una situación o problema social, desde el análisis de la realidad hasta las actividades y tareas. Se articula en: definición (según las necesidades detectadas), planificación (objetivos y actuaciones) y diseño de actividades; después, implementación y evaluación. Puede dirigirse a colectivos vulnerables o a la dinamización social, cultural o del ocio.</p><h4 style="font-size:18px;margin:16px 0 4px">3.2.1. La identificación del proyecto</h4><p>Todo proyecto empieza identificándose con una denominación y una presentación.</p><ul><li><b>Denominación (título):</b> referencia clara al objeto, sin tecnicismos, ni muy concreta ni muy amplia, atractiva y que mencione la entidad. Bien: «Proyecto de mediación entre iguales en el Centro Abierto Las Eras». Mal: «Proyecto de mejora formativa de la población».</li><li><b>Presentación:</b> resumen muy breve de lo esencial (a quién se dirige, qué se quiere hacer, dónde) con los datos y el logotipo de la entidad.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.2.2. El diagnóstico social</h4><p>Concreta las características, necesidades y problemas de la población que el proyecto debe abordar. Objetiva las necesidades, permite fijar prioridades y delimita el problema. Un diagnóstico impreciso o inexistente hace fracasar el proyecto.</p><ul><li><b>Criterio de prioridad 1, intensidad de la demanda:</b> amplitud (cuántas personas), grado de insatisfacción y urgencia.</li><li><b>Criterio 2, utilidad de la demanda:</b> beneficios sociales, sobre todo para los más vulnerables.</li><li><b>Criterio 3, viabilidad:</b> posibilidad de éxito con los recursos; equilibrio entre presupuesto y beneficios esperados; posibilidad de participación de los agentes.</li><li><b>Delimitación del proyecto:</b> problemática (¿qué?), público destinatario (¿a quién?, cuántos), delimitación espaciotemporal (¿dónde y cuándo?) y propuesta metodológica (¿cómo?). Hay que dimensionarlo bien: no plantear proyectos demasiado ambiciosos.</li><li><b>Justificación:</b> fundamentación en el marco de referencia legal (normativa), programático (plan o programa del que deriva) y teórico (modelos en que se inspira); argumentación; y resultados esperados.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.3. La planificación del proyecto</h4><p>Plantea objetivos y diseña actuaciones. Responde a cuatro preguntas: ¿qué? (objetivos), ¿cómo? (actuaciones y metodología), ¿cuándo? (temporalización) y ¿con qué? (recursos). Aporta racionalidad y evita actuar de forma instintiva.</p><h4 style="font-size:18px;margin:16px 0 4px">3.3.1. Los objetivos</h4><p>Concretan las metas del proyecto; de ellos se derivan actividades, recursos y evaluación. Estructura: infinitivo + objeto directo + complementos (cantidad, lugar, tiempo). Deben ser claros, factibles y pertinentes; de lo abstracto a lo concreto y de lo general a lo particular.</p><ul><li><b>Objetivos generales:</b> intenciones del proyecto con bajo nivel de concreción; verbos no observables (favorecer, comprender, concienciar, potenciar, contribuir…). Pocos.</li><li><b>Objetivos específicos:</b> concretan los generales en propósitos observables y medibles; una sola interpretación; traducibles en indicadores; verbos de acción (aumentar, organizar, realizar, identificar…).</li><li><b>Una sola acción por objetivo. Mal:</b> «Dar a conocer las asociaciones y aumentar la participación» (dos metas).</li><li><b>Evitar expresiones vagas. Mal:</b> «Crear lo antes posible…», «Aumentar considerablemente…».</li><li><b>Bien:</b> «Aumentar en un 15 % el número de socios en un año» (acción, grado y periodo).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.3.2. La metodología y las actividades</h4><p>La metodología establece los principios, estrategias y procedimientos para alcanzar los objetivos; en lo social se prefieren metodologías participativas, vivenciales, integradoras, colaborativas, centradas en las personas y poco directivas. Las actividades deben ser coherentes con ella (si es cooperativa, nada de actividades competitivas). Las actividades son el conjunto de actuaciones diseñadas para conseguir los objetivos.</p><ul><li><b>Tipos de actividades:</b> de sensibilización, de difusión, de formación y orientación, de participación, de cooperación, asistenciales, de organización y gestión, y de evaluación y seguimiento.</li><li><b>Clasificación de Ander-Egg:</b> formación, difusión, artísticas no profesionales, lúdicas y sociales.</li><li><b>Tareas:</b> acciones concretas necesarias para realizar una actividad (contratar personal, buscar el local, elegir películas…).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.3.3. La temporalización</h4><p>Ordenación y distribución en el tiempo de las actuaciones, con su duración. Instrumentos:</p><ul><li><b>Planning:</b> calendario con todas las actividades del proyecto de principio a fin y fechas concretas.</li><li><b>Cronograma:</b> matriz con actividades o tareas en filas y tiempo en columnas; la longitud de las barras indica la duración. Muestra secuencia (orden) y sincronía (actividades simultáneas).</li><li><b>Horario:</b> planificación diaria o semanal (útil en colonias o campamentos).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.3.4. Los recursos</h4><p>Todos los medios físicos, humanos y económicos necesarios. Hay que planificarlos y conseguirlos.</p><ul><li><b>Materiales:</b> espacios (medios naturales, urbanos, locales), instalaciones y equipos, inventariables (se reutilizan: ordenadores, tiendas de campaña) y fungibles (se gastan: papel, pinturas).</li><li><b>Humanos:</b> organigrama, perfil profesional y número de personas, voluntariado (Ley 45/2015 de Voluntariado: actividad solidaria, libre, sin contraprestación y a través de entidades), condiciones de contratación y formación.</li><li><b>Económicos:</b> el presupuesto es un instrumento de planificación basado en un cálculo anticipado de gastos e ingresos en un periodo.</li><li><b>Gastos:</b> personal, espacio, materiales, gastos corrientes e imprevistos (reservar entre el 5 y el 10 %).</li><li><b>Ingresos:</b> subvenciones, patrocinadores, cuotas de usuarios, ventas, aportación de la entidad, ingresos atípicos (rifas) y otros (crowdfunding, teaming).</li><li><b>Saldo:</b> ingresos − gastos. Positivo = superávit; negativo = déficit (hay que buscar financiación).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.3.5. El diseño de actividades</h4><p>El diseño o programación de una actividad es el documento que sintetiza toda la información para hacerla operativa. Es el máximo nivel de concreción. Ficha de actividad:</p><ul><li>Denominación o título.</li><li>Objetivos operativos (muy específicos).</li><li>Público destinatario (número, perfil, agrupaciones).</li><li>Desarrollo (pasos y orientaciones).</li><li>Temporalización y duración, y distribución de tareas con responsables.</li><li>Recursos humanos, materiales y económicos.</li><li><b>Pautas de evaluación:</b> indicadores por objetivo, satisfacción, actuación profesional y diseño.</li><li><b>Adaptación:</b> prever adaptaciones por si participan personas con necesidades funcionales específicas.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.4. La ejecución del proyecto</h4><p>Consiste en implementar las actividades planificadas en el orden y forma previstos; aquí se materializa todo. Las aptitudes y actitudes del profesional son clave.</p><ul><li><b>Planificación flexible:</b> adaptar si las circunstancias cambian, hay imprevistos (lluvia), se detectan errores o conviene para los objetivos; mejor tener alternativas previstas que improvisar.</li><li><b>La ejecución nunca es neutra:</b> la implicación social del profesional es un valor. Se prefieren estilos democráticos y asertivos frente a autoritarios o inhibidos.</li><li><b>Sesión:</b> unidad temporal básica de la programación en la que se ejecutan las actuaciones.</li><li><b>Fases de una sesión:</b> preparación (entorno y adaptación psicoemocional), presentación (motivar y explicar), conducción (rol del profesional y habilidades sociales, personales y técnicas), control y seguimiento, y cierre.</li><li><b>Garantizar:</b> entornos seguros (prevención de riesgos), trato igualitario y no discriminación (incluso acción positiva) y relación respetuosa.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.5. Perspectiva de género en los proyectos</h4><p>El enfoque de género es transversal: en el diagnóstico, el diseño y la ejecución.</p><ul><li><b>Análisis de género:</b> estrategia para detectar desigualdades entre hombres y mujeres. Incluye datos desagregados por género (brechas), desigualdades y roles, necesidades expresadas por las propias mujeres, causas y elementos para el empoderamiento.</li><li><b>Diversidad:</b> las mujeres son un colectivo diverso; cruzar con edad, ingresos, origen, salud… y visibilizar a las más vulnerables (víctimas de violencia, mayores, con discapacidad, inmigrantes…).</li><li><b>Diseño:</b> lenguaje no sexista, objetivos contra estereotipos y desigualdades, medidas de empoderamiento y acción positiva, metodologías participativas, horarios que faciliten la conciliación y mecanismos de seguimiento.</li><li><b>Ejecución con compromiso:</b> lenguaje no sexista, igualdad de condiciones, no asignar roles de género (incluso invertirlos para generar empatía). Sin compromiso: formar y sensibilizar al personal.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">Herramientas para diseñar y ejecutar</h4><p>Cuatro herramientas de decisión:</p><ul><li><b>Diagrama de árbol o matricial:</b> visión de conjunto de los medios necesarios para llegar a una meta; categoriza y jerarquiza.</li><li><b>Diagrama de decisiones de acción:</b> objetivo → estrategias → pasos → posibles problemas → contramedidas valoradas (X inadecuada, O adecuada). Es proactivo: anticipa problemas.</li><li><b>Diagrama de Gantt (Henry Gantt, principios del s. XX):</b> barras de actividades en el tiempo; sirve también para el seguimiento (colorear barras o barra prevista vs. real).</li><li><b>PERT (técnica de valoración y revisión de programas):</b> nodos (situaciones) y flechas (actuaciones) para optimizar el tiempo. Pasos: ordenar actuaciones, tiempos, ruta crítica (la más larga, que marca la duración total) y optimizar.</li></ul><div style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Trucos:</b><ul><li>Las 4 preguntas de la planificación = «QUÉ‑CÓMO‑CUÁNDO‑CON QUÉ»: objetivos, metodología, temporalización, recursos.</li><li>Objetivo bien escrito = VERBO + QUÉ + CUÁNTO + CUÁNDO: «Aumentar (verbo) los socios (qué) un 15 % (cuánto) en un año (cuándo)».</li><li>Prioridades del diagnóstico = I‑U‑V: Intensidad (¿a cuántos y cuánto molesta?), Utilidad (¿a quién beneficia?), Viabilidad (¿se puede?).</li></ul></div><h3 style="font-size:22px;margin:26px 0 8px">Tema 4. La evaluación del proyecto</h3><h4 style="font-size:18px;margin:16px 0 4px">4.1. Qué es evaluar</h4><p>La evaluación integra los procedimientos para valorar en qué medida las decisiones y actuaciones están en sintonía con lo previsto en el diseño. No es solo el final: está presente de forma continua desde antes de formular el proyecto hasta después de acabarlo. Sirve para detectar desviaciones, reajustar y decidir sobre el futuro. No debe tomarse como un trámite rutinario.</p><h4 style="font-size:18px;margin:16px 0 4px">4.1.1. Características de la evaluación</h4><p>Requisitos del método científico y de los proyectos sociales:</p><ul><li><b>Objetividad:</b> captar la realidad sin ideas preconcebidas.</li><li><b>Validez:</b> los datos reflejan fielmente la realidad.</li><li><b>Fiabilidad:</b> el resultado no varía según quién evalúe ni cuándo.</li><li><b>Oportunidad:</b> elegir el momento adecuado.</li><li><b>Practicidad:</b> obtener resultados útiles; equilibrio entre lo ideal y lo viable.</li><li>En proyectos sociales debe ser continua (la final es resultado de las anteriores), sistemática (planificada), flexible (admite ajustes) y participativa (integra a los agentes; más laboriosa pero genera implicación y feedback).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.1.2. Tipos de evaluación</h4><p>Según distintos criterios:</p><ul><li><b>Según quién la hace:</b> autoevaluación (los propios ejecutores), interna (la entidad; conocen bien el proyecto pero hay riesgo de sesgo), externa (personal ajeno; más objetiva), mixta (combina ambas; riesgo de descoordinación) y de las personas usuarias (satisfacción, calidad percibida).</li><li><b>Según el momento:</b> inicial (antes del diseño: pertinencia, necesidades, diagnóstico), formativa o de proceso (durante: detecta desviaciones) y final, de resultado o sumativa (al acabar: objetivos, satisfacción, coste y desviación del presupuesto).</li><li><b>Según la función:</b> para el diagnóstico, para la predicción (prever problemas), para la orientación (feedback y ajustes) y para el control (comparar resultados con objetivos = eficacia).</li><li><b>Según la extensión:</b> parcial (una parte) o global (integral; todo proyecto debería cerrarse con una global).</li><li><b>Según la continuidad:</b> longitudinal (a lo largo del proceso) o puntual o transversal (en un momento concreto).</li><li><b>Según la información:</b> cuantitativa (datos numéricos y estadística: frecuencias, media, dispersión) o cualitativa (motivos, opiniones, efectos no deseados). Se combinan.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.2. Metodología evaluadora</h4><p>Conjunto de procedimientos que definen cómo recoger y analizar la información; debe ser congruente con la función de la evaluación.</p><ul><li><b>Técnicas:</b> documentación interna (hojas de registro e incidencias), cuestionarios (de satisfacción, de autoevaluación), entrevistas y observación (clave en la evaluación de proceso).</li><li><b>Instrumentos:</b> registros abiertos (diario, anecdotario) o categoriales (escalas de estimación, listas de control).</li><li><b>Indicadores de evaluación:</b> puntos de referencia o enunciados que permiten medir el grado de aproximación a un objetivo; siempre referidos a los objetivos y, si es posible, verificables y medibles.</li><li><b>Recursos:</b> quién (interna, externa…), cuándo (inicial, continua, final), dónde y con qué (instrumentos, tableta, móvil; con consentimiento para fotos y grabaciones).</li><li><b>Opciones metodológicas:</b> criterio prefijado muy general (exploratoria, evaluación inicial), plan establecido pero abierto (evaluación continua) y plan establecido y estructurado (cuestionarios, escalas; evaluación de resultado).</li><li><b>Análisis:</b> comparación previsto‑obtenido y estadística sencilla con hoja de cálculo; o programas: SPSS, SAS, Minitab (cuantitativos) y ATLAS.ti, AQUAD (cualitativos).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.3. La evaluación en cada fase del proyecto</h4><p>Una evaluación integral se organiza por fases:</p><ul><li><b>Evaluación del diagnóstico:</b> comprobar que se hizo bien, que responde a las necesidades y que es fiable y válido. Es preventiva y se hace antes del diseño (¿técnicas adecuadas?, ¿causas definidas?, ¿viable?).</li><li><b>Evaluación del diseño:</b> valora la idoneidad y eficacia de la planificación. Primer momento preventivo (al acabar de planificar, para asegurar coherencia) y segundo de control (al final, a posteriori). Se revisa cada elemento: objetivos, metodología, actividades, recursos, temporalización y criterios de evaluación.</li><li><b>Evaluación del proceso:</b> evaluación continua durante las actividades para comprobar si todo va según lo previsto; de seguimiento o control. Genera feedback: las desviaciones leves se corrigen en el momento; las demás se anotan para la evaluación final.</li><li><b>Evaluación de los resultados (final):</b> valora si los resultados responden a los objetivos; es global (diseño, profesionales, balance económico) y valora la rentabilidad social (relación coste‑beneficio). Sin ella el proyecto no puede cerrarse.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.4. El informe de evaluación</h4><p>Documento que recoge la valoración del proceso y de los resultados, con logros y puntos débiles. Objetivos: analizar el cumplimiento de los objetivos y comunicar los resultados. Debe incluir una valoración global del éxito. La memoria es más completa y formal que el informe.</p><ul><li><b>Partes:</b> portada, resumen, información del proyecto, estudio valorativo (diseño de la evaluación y análisis de datos), resultados, discusión (datos contradictorios, explicaciones alternativas), conclusiones (jerarquizadas) y recomendaciones.</li><li>Deben participar en su redacción los profesionales del proyecto.</li><li><b>Comunicación:</b> ideas claras y breves, lenguaje comprensible, gráficos que ayuden, sin divagaciones y con recomendaciones coherentes. Puede presentarse en persona o por vía telemática, con apoyo de presentaciones.</li><li><b>Pautas de Morris y Taylor:</b> conocer a los grupos implicados, no dar información excesiva, empezar por lo más relevante, presentación amena, dejar tiempo para preguntas y ser siempre honesto sin ir más allá de los datos.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.5. Aspectos éticos de la evaluación</h4><p>El dilema básico: hasta qué punto el valor de la investigación debe prevalecer sobre los derechos de las personas evaluadas.</p><ul><li><b>Dilemas morales de Ernest R. House:</b> derecho a la información, al bienestar, a la intimidad y privacidad, y a la dignidad y participación.</li><li><b>Allan J. Kimmel:</b> actuar éticamente sin poner en peligro la validez. La relación evaluador‑usuario es asimétrica; propone estilos democráticos y participación activa.</li><li><b>Medidas:</b> libre consentimiento informado, confidencialidad y privacidad, equidad en las relaciones (horizontales) y considerar el impacto y los beneficios.</li><li>Si la utilidad social no lo justifica, prevalecen los intereses de protección de las personas (p. ej., la privacidad).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.6. Evaluación y perspectiva de género</h4><p>Los indicadores de género permiten valorar el alcance de la aplicación del enfoque de género y su impacto en el avance hacia la igualdad. Se incluyen en todas las fases (transversalidad).</p><ul><li><b>En el diagnóstico:</b> datos desagregados por sexo, brecha de género, necesidades expresadas por las mujeres, barreras y múltiple vulnerabilidad.</li><li><b>En el diseño:</b> objetivos contra estereotipos, metodología que asegura su participación, acción positiva, horarios de conciliación y seguimiento.</li><li><b>En la ejecución:</b> formación del personal, experta en género, lenguaje no sexista, participación igualitaria y roles sin estereotipos (o invertidos).</li><li><b>Optimizarlos:</b> desagregar por género, combinar cuantitativos y cualitativos e incluir indicadores de empoderamiento y participación.</li><li><b>Evaluar el impacto:</b> ¿se superaron barreras?, ¿aumentó la concienciación?, ¿hubo participación equitativa en decisiones y liderazgo?, ¿se favoreció el empoderamiento? Un proyecto sin perspectiva de género no debería considerarse admisible.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.7. La gestión de la calidad</h4><p>Conjunto de normas y procedimientos asumidos por toda la organización para mejorar la satisfacción de las necesidades y expectativas de las personas a las que sirve. En lo social: calidad del servicio, de los resultados, de la satisfacción de usuarios y trabajadores y de la gestión de recursos. El modelo más adoptado es el europeo EFQM. La dirección debe impulsar la cultura de la calidad.</p><ul><li><b>Mapa de procesos:</b> representación gráfica de los procesos de la organización y sus relaciones.</li><li><b>Procesos estratégicos:</b> definen y despliegan la estrategia (recursos humanos, documentación, prevención de riesgos).</li><li><b>Procesos clave:</b> buscan el objetivo fundamental (acogida, estancia, atención familiar); los que más influyen en la opinión de usuarios.</li><li><b>Procesos de apoyo:</b> dan soporte (administración, mantenimiento y limpieza, informática).</li><li><b>Indicadores de calidad:</b> ítems fácilmente identificables y significativos para medir la calidad de forma fiable (p. ej., % de residentes que hacen al menos una actividad de ocio al trimestre).</li><li><b>Carta de servicios:</b> documento con el que la institución informa y se compromete públicamente con la calidad del servicio (compromisos, indicadores de seguimiento y medidas si se incumple).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">Herramienta: la matriz DAFO</h4><p>Analiza la situación interna y externa de una organización para tomar decisiones.</p><ul><li><b>Análisis interno:</b> Fortalezas y Debilidades.</li><li><b>Análisis externo (entorno):</b> Oportunidades y Amenazas.</li><li><b>Pasos:</b> analizar los cuatro factores, cruzarlos en una matriz de doble entrada y definir estrategias de prevención, crecimiento, atención preferente o mejora.</li></ul><div style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Trucos:</b><ul><li>Evaluación según el momento = una receta: INICIAL miro qué hay en la nevera, PROCESO pruebo mientras cocino, FINAL ¿ha quedado rico?</li><li>DAFO: lo de DENTRO son Debilidades y Fortalezas (lo controlas); lo de FUERA, Amenazas y Oportunidades (el entorno).</li><li>Procesos de calidad como un restaurante: ESTRATÉGICOS = el dueño decide la carta, CLAVE = cocinar y servir, de APOYO = fregar y hacer cuentas.</li></ul></div><h3 style="font-size:22px;margin:26px 0 8px">Tema 5. Promoción y difusión del proyecto</h3><h4 style="font-size:18px;margin:16px 0 4px">5.1. Por qué difundir el proyecto</h4><p>De poco sirve un proyecto extraordinario si no llega a las personas a las que va dirigido; muchos triunfan sobre todo por una buena difusión. Para ello se usan las técnicas de la publicidad. La publicidad es una forma de comunicación para dar a conocer un producto, servicio o idea a un conjunto de personas y persuadirlas para que hagan algo. El mensaje debe ser sencillo, atractivo, fácil de entender y motivador.</p><ul><li><b>Publicidad comercial:</b> con ánimo de lucro; busca la compra (empresas).</li><li><b>Publicidad social:</b> generalmente sin ánimo de lucro; concienciar, educar, sensibilizar o cambiar actitudes; promueve valores (justicia, solidaridad). Puede ser institucional (organismos públicos: informar de derechos y servicios) o de ONG (concienciar y conseguir fondos).</li><li><b>Publicidad política:</b> informar de los proyectos de un partido para conseguir el voto; muy cercana a la propaganda.</li><li><b>Propaganda:</b> comunicación ideológica para conseguir adeptos. Blanca (emisor identificado), gris (fuente poco clara) y negra (clandestina o falsificada; la usan sectas y grupos violentos).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.1.2. Las campañas</h4><p>Una campaña publicitaria es un conjunto organizado de estrategias para dar a conocer un producto o servicio a un grupo de población mediante anuncios en distintos medios. En lo social no vale todo: información verídica y de calidad, valores positivos, respeto a la dignidad y trato igualitario y no discriminatorio, tanto en el mensaje explícito como en el encubierto.</p><ul><li><b>Tipos de campañas sociales:</b> de cambio de comportamiento (tráfico, drogas), de denuncia (sinhogarismo, explotación infantil), de movilización social (pedir un centro de día), de captación de recursos (alimentos, voluntariado) e informativas sobre temas concretos (derechos, servicios).</li><li><b>Fases:</b> 1) determinar el público objetivo, 2) elaborar el anuncio, 3) seleccionar los medios. Después, emitir con la frecuencia establecida.</li><li><b>Contravalores de la publicidad:</b> elitismo, permisividad, contravalores (vanidad, superioridad), individualismo, estereotipos de género y consumismo.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.2. Fase 1: el público objetivo</h4><p>La publicidad puede ser genérica (para toda la población) o segmentada, más eficaz para necesidades concretas.</p><ul><li><b>Segmentación:</b> separar el mercado en grupos con características similares (sexo, edad, zona, nivel socioeconómico, estilo de vida). La comercial suele perpetuar estereotipos (detergentes dirigidos a mujeres).</li><li><b>Público objetivo o target:</b> grupo de personas al que se dirige una acción publicitaria. Hay que conocer sus gustos y costumbres (para el mensaje) y sus hábitos de medios (para la difusión).</li><li><b>Comportamiento del consumidor, modelos basados en el aprendizaje:</b> modelo AIDA (Atención, Interés, Deseo, Acción).</li><li><b>Modelos basados en las motivaciones:</b> estudian qué mueve al público para activarlo en el mensaje.</li><li><b>Modelos basados en las actitudes:</b> parten de cómo percibe el público el producto para mejorar esa percepción.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.3. Fase 2: el anuncio</h4><p>Un anuncio es un mensaje destinado a dar a conocer un producto o servicio. Combina un componente informativo (lo que se da a conocer) y uno persuasivo (emociones). Busca impactar y provocar un efecto (cambiar conductas o actitudes, sensibilizar). La publicidad subliminal emite mensajes por debajo del umbral de percepción consciente (imágenes escondidas, ilusiones visuales, dobles sentidos, ultrafrecuencia).</p><ul><li><b>Estrategia argumentativa:</b> demuestra con pruebas: testimonios (personas, expertos, famosos), comparación de comportamientos y silogismos («Si conduces habiendo bebido, puedes poner en peligro tu vida»).</li><li><b>Estrategia descriptiva:</b> presenta los aspectos más atractivos del proyecto (instalaciones de una residencia).</li><li><b>Estrategia emotiva:</b> despierta emociones; muy usada en sensibilización.</li><li><b>Estrategia proactiva:</b> hechos sorprendentes que el receptor debe descodificar (inversión de papeles, exageración, analogía, símbolo visual, relación paradójica imagen‑texto).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.3.2. El texto y el eslogan</h4><p>El lenguaje es el eje del mensaje: cuanto más sintético, mejor. El eslogan es una frase o palabra atractiva, sugerente y fácil de recordar que recoge el concepto clave del mensaje.</p><ul><li><b>Tipos de eslogan:</b> describir la actividad, describir las ventajas del producto, sugerir su uso, ensalzar al consumidor, apoyar la marca o diferenciarla.</li><li><b>Recursos:</b> adjetivación («Bueno, bonito y barato»), contradicción o antilogía («Pierde peso comiendo»), desafío («¿Te atreves…?»), dilogía (palabra con dos significados), frases hechas, hipérbole (exageración), identificación de la marca, interjección («Mmmm…»), onomatopeya, coloquialismos, personificación («Lavadoras inteligentes») y rima.</li><li>Elementos de audio (locución y música), gráficos (ilustrativos o con contenido) y multimedia (vídeo, animación).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.3.4. Elementos de diseño: la composición</h4><p>La composición es la manera de disponer los elementos de imagen y texto para crear el mensaje. Elementos:</p><ul><li><b>La letra:</b> tipografía, tamaño (cuerpo), efectos, color y orientación.</li><li>El punto (indica posición, atrae la vista), la línea (indica recorrido, da dinamismo) y la figura (línea cerrada que forma un contorno).</li><li><b>El plano:</b> general (todo el decorado), conjunto (grupos en su entorno), entero (la figura completa; tres cuartos).</li><li><b>Encuadres:</b> picado (desde arriba: empequeñece o ridiculiza), contrapicado (desde abajo: engrandece), inclinado (inestabilidad, sorpresa), imposible (extrañeza), a vista de pájaro (desde muy alto) y a vista de gusano (desde el suelo).</li><li><b>La luz:</b> natural, artificial y efectos lumínicos (velas, fuego).</li><li><b>Las texturas:</b> brillantes y lisas (alegría, modernidad), brillantes y ásperas (fuerza, agresividad), mates y rugosas (seriedad, austeridad), mates y rizadas (sensualidad), aterciopeladas (realeza, poder).</li><li><b>El color:</b> rojo (fuerza, pasión), amarillo (alegría, juventud), verde (naturaleza, esperanza), azul (confianza, sabiduría, fidelidad), marrón (tierra, austeridad), gris (madurez, neutralidad), blanco (pureza, armonía), negro (misterio, muerte, pero también elegancia y poder).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">Materiales impresos y audiovisuales</h4><p>Elaboración de los materiales:</p><ul><li><b>Carteles:</b> imagen + eslogan; impacto directo y descodificación rápida; mejor si son sorprendentes y creativos.</li><li><b>Folletos:</b> pieza promocional pequeña, sencilla y económica: título, explicación, fotos y contacto. Díptico (4 caras), tríptico (6 caras) y flyer (1 hoja, 2 caras). Los carteles crean impacto y los folletos amplían la información.</li><li><b>Audiovisuales:</b> propios (cámara y editor) para proyectos pequeños o encargados a profesionales; mejor que no superen los 2 minutos. Ojo con las imágenes demasiado transgresoras: pueden generar rechazo.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.4. Fase 3: los medios de difusión</h4><p>El plan de medios es la selección de los medios de difusión más adecuados para promocionar algo o comunicar una idea, con la mejor combinación para la máxima eficacia. Decide los medios y la frecuencia de emisión. OTS (opportunity to see) es el número de veces que una persona del público tiene ocasión de ver el anuncio (OTH, de oírlo). El marketing de resultados paga según los resultados conseguidos.</p><ul><li><b>Publicidad exterior:</b> en lugares públicos para público indeterminado: mobiliario urbano (marquesinas, columnas, mupis), vallas, lonas en fachadas y transporte público.</li><li><b>Folletos:</b> reparto en mano, en mostradores, buzoneo o mailing (postal o electrónico). Pancartas para eventos.</li><li><b>Prensa:</b> anuncios preferentes (página entera), generales, clasificados y encartes; revistas (más permanencia) y prensa gratuita (útil para proyectos locales).</li><li><b>Radio:</b> mensajes claros y cortos, eslogan repetido, buena locución y música. Formatos: palabras y ráfagas, cuñas (unos 20 s), publirreportajes (2‑5 min), microprogramas y programas patrocinados.</li><li><b>Televisión:</b> gran impacto pero muy cara (mejor televisiones locales). Formatos: spot (20‑30 s), publirreportaje (90 s‑3 min), infocomercial (más de 5 min), patrocinio, sobreimpresión y product placement (producto dentro del programa).</li><li><b>Internet:</b> web propia, banners, cortinilla, layers, pop‑up y pop‑under, patrocinios, posicionamiento en buscadores, redes sociales e influencers, e‑mailing y ciberspot.</li><li><b>Community manager:</b> gestor de comunidades en línea que gestiona la comunicación en redes y busca fidelizar y ampliar seguidores.</li><li><b>BTL (Below The Line) o marketing de guerrilla:</b> fuera de los medios masivos. Street marketing: flashmob (multitud instantánea), dance marketing (baile sorpresa participativo) y lipdub (vídeo en un plano secuencia con playback). Baratos y con gran viralización.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.5. Proceso de una campaña</h4><p>Cuatro fases (ejemplo: campaña de prevención de drogas en un barrio):</p><ul><li><b>Fase I, briefing:</b> documento resumido y ordenado con la información necesaria para la campaña: contexto, idea a publicitar, objetivos (concretos y medibles), target (p. ej., menores de 13‑17 años del barrio), tono y estilo, presupuesto y timing.</li><li><b>Fase II, diseño:</b> elaborar el anuncio (eslogan con lluvia de ideas, imagen y soportes) y el plan de medios (trípticos, carteles, vídeo, web y banners, marketing directo, street marketing).</li><li><b>Fase III, preparación y lanzamiento:</b> tener listos los recursos y el personal, ajustar el presupuesto, cronograma de tareas y sistema de decisiones rápidas ante imprevistos.</li><li><b>Fase IV, evaluación:</b> ¿se llegó al público?, ¿impactó el mensaje?, ¿se recuerda el eslogan?, ¿hubo la afluencia esperada? Con indicadores e instrumentos.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.6. Perspectiva de género en la difusión</h4><p>La difusión es donde más se nota el trato subordinado o denigrante a la mujer; la publicidad comercial refuerza estereotipos. La Ley Orgánica 3/2007 exige igualdad de trato.</p><ul><li><b>Lenguaje no sexista:</b> genéricos o colectivos (la ciudadanía, el alumnado), anteponer «persona» (las personas usuarias), nombrar cargos sin genérico masculino (la dirección), evitar «hombre» como genérico (el ser humano), feminizar cargos (la jueza), desdoblar alternando el orden (las niñas y los niños), barras (profesor/a), pronombres neutros (quien quiera), evitar «señorita». La arroba (@) no es correcta en un registro formal.</li><li><b>Protocolos:</b> UNESCO (1987, 1989), Consejo de Europa (1990), Orden de 1995 sobre titulaciones, LO 3/2007 y Plan Estratégico de Igualdad de Oportunidades.</li><li><b>Prácticas sexistas:</b> roles estereotipados, infravaloración de la mujer, cosificación (cuerpo como objeto de deseo) y exigencia de belleza.</li><li><b>Hacia una publicidad igualitaria:</b> actualizar roles, no asignar productos a un sexo, voces de ambos sexos, mujeres activas con objetivos propios y emocionalmente estables, cuerpos saludables, no usar a la mujer como reclamo, representar la diversidad, formar a los profesionales y asegurar que la información llegue a todas las mujeres.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">Herramientas creativas y de consenso</h4><p>Para crear mensajes y decidir:</p><ul><li><b>Lluvia de ideas (brainstorming):</b> técnica grupal para encontrar ideas creativas. Pasos: plantear el tema y las normas, aportar ideas libremente (cuantas más, mejor) y revisar y consensuar.</li><li><b>Diagrama de afinidad:</b> clasifica muchas ideas en grupos según criterios del grupo.</li><li><b>Bola de nieve:</b> técnica grupal para consensuar y priorizar: parejas → grupos de cuatro → grupos de ocho… hasta llegar al consenso.</li></ul><div style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Trucos:</b><ul><li>AIDA es una cantante que te seduce: te mira (Atención), te intriga (Interés), te enamora (Deseo) y compras su disco (Acción).</li><li>Campaña en 4 fases = «B‑D‑L‑E»: Briefing, Diseño, Lanzamiento, Evaluación.</li><li>Encuadres: PICADO = la cámara te pica desde arriba y te hace pequeño; CONTRAPICADO = desde abajo, te hace gigante.</li></ul></div><h2 style="font-size:28px;margin:34px 0 8px">Mediación comunitaria</h2><h3 style="font-size:22px;margin:26px 0 8px">Tema 1. Introducción a la mediación comunitaria</h3><h4 style="font-size:18px;margin:16px 0 4px">1.1. La convivencia</h4><p>La convivencia es la interacción entre personas que comparten un mismo espacio y establecen normas y acuerdos para la armonía y el bienestar colectivo; se basa en el respeto, la cooperación y la gestión pacífica de las diferencias. No es fija: es un proceso en constante
