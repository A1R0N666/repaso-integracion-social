U("promocion", {
n:2, title:"El aprendizaje de las HAPS en personas en situación de vulnerabilidad",
secs:[
 ["2.1. El aprendizaje de las HAPS","El aprendizaje es el conjunto de procesos mediante los cuales se adquieren conceptos, conocimientos y habilidades. Nos permite adaptarnos a un entorno que cambia. Las HAPS son uno de esos aprendizajes, y casi todo lo aprendemos de forma natural, sin darnos cuenta.",[]],
 ["2.1.1. Habilidades, hábitos y rutinas","Conseguir la autonomía es un proceso que empieza ejecutando habilidades y se consolida cuando se convierten en hábitos. Saber hacer algo no es ser autónomo: quien sabe cepillarse los dientes pero lo hace de vez en cuando no ha adquirido el hábito.",
  ["Habilidad: capacidad o destreza para realizar una actividad.","Hábito: conducta aprendida que se ejecuta automáticamente en el momento oportuno y de forma adecuada. Pasar de habilidad a hábito exige tiempo y entrenamiento.","Rutina: ritmo de actividad estable que, una vez aprendido, se aplica repetidamente casi sin pensar (cepillarse los dientes antes de dormir). Al repetir un hábito se interioriza y se convierte en rutina.","Diferencia: las rutinas sí pueden cambiarse por otras o desaparecer cuando ya no se necesitan (coger el autobús al instituto).","Las rutinas no son innatas: se adquieren en el contexto social, por eso hay que establecerlas y aprenderlas."]],
 ["Importancia de las rutinas en personas vulnerables (Doc. 2.1)","Son muy importantes para personas con discapacidad intelectual, deterioro cognitivo o muy mayores. Una vida ordenada con rutinas es una herramienta excelente para aprender y practicar HAPS.",
  ["Orden y claridad: permiten prever lo que va a pasar, lo que da seguridad y tranquilidad.","Orientación temporal: ayudan a diferenciar los momentos del día, las fases de una actividad y el orden de los acontecimientos.","Hábitos básicos: facilitan los hábitos de alimentación, higiene y sueño, que dan más autonomía.","Hábitos sociales: pueden convertirse en hábitos sociales (aspecto aseado, vestir adecuadamente, sentarse a la mesa), lo que favorece el desarrollo social y emocional."]],
 ["2.1.2. Fases de adquisición de las HAPS","El aprendizaje de las HAPS es un proceso secuencial de cuatro fases, que sirven de referencia en todos los programas de entrenamiento.",
  ["1. Preparación: preparación psicológica; es condición necesaria que la persona esté predispuesta y motivada.","2. Aprendizaje: se aprende la habilidad propiamente dicha y se ejecuta la conducta deseada.","3. Automatización: se reproduce la conducta de forma automática cuando se requiere; se toma conciencia de las situaciones en que hay que hacerla.","4. Consolidación: se afianza y se interioriza como hábito, de modo que se ejecuta de forma rutinaria en cualquier situación que lo requiera."]],
 ["2.1.3. Consideraciones sobre el aprendizaje","Aprender es natural, pero implica mecanismos psicológicos sofisticados; no es un proceso tan lineal ni predecible.",
  ["Todas las personas pueden aprender, aunque cambian la velocidad y la calidad.","No siempre es voluntario, y a veces ni siquiera consciente.","No solo se aprenden conocimientos: también conductas, control de las emociones y relación social (inteligencia emocional).","No siempre se aprende lo correcto.","Todo aprendizaje se puede modificar con otro posterior, aunque las creencias arraigadas generan fuertes resistencias.","Solo se aprende aquello para lo que el organismo está capacitado: hay una base neurofisiológica previa."]],
 ["2.2. Factores que inciden en el aprendizaje","Aprender es común a todos, pero la velocidad y el grado alcanzado varían entre personas y momentos de la vida por factores individuales: inteligencia, atención, memoria, actitud y motivación, maduración y experiencia.",[]],
 ["2.2.1. La inteligencia y el cociente intelectual","La inteligencia es la capacidad de razonar, resolver problemas, pensar en abstracto, comprender, desarrollar un lenguaje, aprender y crear. No todas las personas la tienen igual de desarrollada.",
  ["Cociente intelectual (CI): indicador numérico del grado de conocimiento, comprensión y entendimiento. Lo introdujo William Stern en 1912.","El CI relaciona la edad mental (EM) con la edad cronológica (EC): EM = EC, sin discapacidad; EM > EC, inteligencia superior al promedio; EM < EC, por debajo de la media.","Ejemplo: una persona de 18 años con discapacidad cognitiva puede tener una EM de 10 si solo hace con eficacia lo que haría un niño de esa edad.","Hoy se mide con pruebas psicométricas estandarizadas: comprensión verbal, razonamiento perceptivo, memoria de trabajo, velocidad de procesamiento y habilidad intelectual general.","Cuidado: los test comparan con personas de la misma edad pero no orientan la intervención, y el CI varía con factores emocionales y ambientales. No hay que «etiquetar» a nadie por su CI."]],
 ["Las inteligencias múltiples (Gardner, 1983)","Howard Gardner superó la idea reduccionista de una sola inteligencia: todos tenemos, en distinta medida, ocho inteligencias. Su combinación es decisiva para aprender y se desarrolla con la educación, la experiencia y el entorno.",
  ["Lingüística o lingüístico-verbal: leer, escribir, hablar, escuchar, construir frases.","Lógico-matemática: cálculo, razonamiento, problemas lógicos.","Espacial: visualizar mentalmente ideas, volúmenes, imágenes y espacios en 3D.","Musical: ritmo, entonación, audición; música, danza, composición.","Corporal-cinestésica: usar el cuerpo para expresarse y para actividades de precisión, coordinación, fuerza y equilibrio.","Intrapersonal: autoconocimiento y control del pensamiento, las emociones y la conducta.","Interpersonal: habilidades sociales, reconocer a los demás, ayudar, establecer relaciones. Clave para trabajar en intervención social.","Naturalista: observar, identificar y clasificar especies según semejanzas y diferencias.","Aportaciones posteriores: inteligencia emocional (ligada a la intra e interpersonal), existencial o espiritual, pedagógica."]],
 ["2.2.2. La atención","La atención es la capacidad de focalizar la percepción en un elemento. Aprender es un proceso activo, así que requiere atención voluntaria: cuanta más concentración, más rápido y eficaz el aprendizaje.",
  ["Atención involuntaria: la que prestamos sin darnos cuenta.","Atención voluntaria: la fijamos a propósito según intereses o necesidades. Se relaciona con la concentración (mantener la atención de forma continuada y consciente).","Atención selectiva o focalizada: centrarse en un estímulo ignorando el resto.","Atención dividida: atender a varios estímulos o tareas a la vez (escuchar, mirar la pizarra y tomar apuntes). La afectan la esquizofrenia, el TDAH, los ictus o la discapacidad auditiva: conviene presentar las tareas escalonadas.","Factores: el estado general (ánimo, enfermedad, cansancio, fatiga mental) la reduce; el interés y la afectividad la favorecen.","Para mejorarla (Doc. 2.2): establecer rutinas y secuenciar actividades en vez de simultanearlas, elegir un lugar sin distracciones, dormir lo suficiente (pero no más de 9-10 horas) y buscar condiciones de relajación."]],
 ["2.2.3. La memoria","La memoria es la capacidad de almacenar información y recuperarla voluntariamente. En las HAPS es fundamental: la persona debe recuperar de forma automática lo memorizado para hacer las actividades.",
  ["Memoria sensorial: dura milisegundos; si la información es relevante pasa a corto plazo y si no se desecha (sonidos y olores de la calle).","Memoria a corto plazo, operativa o de trabajo: no más de 40 segundos; para usar la información en ese momento.","Memoria a largo plazo o diferida: de horas a toda la vida, según la intensidad del estímulo, el esfuerzo y las veces que se use.","Fases: 1) codificación o registro (lo percibido se transforma en información manejable), 2) almacenamiento, 3) recuperación o recuerdo. Cuantas más veces se recupera una información, mejor se consolida."]],
 ["2.2.4. La actitud y la motivación","Para que aparezca una conducta hace falta un ambiente adecuado y un impulso que la active. Una actitud favorable está en la base de la motivación, y la motivación determina la conducta.",
  ["Actitud: predisposición a responder de una manera ante una situación. No es una reacción breve sino una tendencia estable y difícil de cambiar. Puede ser positiva o proactiva (favorece) o negativa (dificulta); si es negativa, lo primero es modificarla.","Motivación: conjunto de factores capaces de provocar, mantener y dirigir la conducta hacia un objetivo. Combina procesos internos y variables externas (premios, halagos, metas).","Motivaciones primarias: fisiológicas e innatas, no aprendidas (sed, hambre, sueño).","Motivaciones secundarias: aprendidas (ropa de marca, un trabajo con prestigio, un coche).","La motivación aumenta si los contenidos son significativos y útiles, las metas son alcanzables, la persona se siente capaz, reconoce que su éxito depende de su esfuerzo y el aprendizaje elimina aburrimiento y ansiedad.","En personas en situación de dependencia la motivación es imprescindible y está muy ligada a un fuerte apoyo social."]],
 ["2.2.5. La maduración y 2.2.6. La experiencia","Solo se aprende aquello para lo que el organismo está preparado. Y el aprendizaje se construye sobre lo que ya sabemos.",
  ["Maduración: cambios biológicos que permiten adquirir nuevas capacidades. Es condición necesaria (un bebé sin fuerza ni coordinación en las piernas no puede andar).","Experiencia: conocimientos y habilidades adquiridos con la práctica continuada. A los adultos les facilita aprender, pero puede dificultarlo si lo aprendido antes era erróneo."]],
 ["2.3.1. Aprendizaje por refuerzo (conductismo)","El conductismo (B. F. Skinner, 1904-1990) postula que aprendemos según las consecuencias de lo que hacemos: si a una conducta le sigue algo agradable tendemos a repetirla; si le sigue algo desagradable, a evitarla.",
  ["Refuerzo: respuesta agradable que se aplica a una conducta para que se repita o se perfeccione.","Castigo: consecuencia desagradable ante una respuesta indeseada (reprimenda, amenaza, prohibición). Cada vez está más denostado por sus efectos contraproducentes y su baja eficacia.","Condicionamiento clásico (Watson, 1878-1958): un estímulo incondicionado (el fuego) provoca una respuesta incondicionada (retirar la mano). Si un estímulo neutro se presenta repetidamente junto a él, acaba provocando solo la misma respuesta: se convierte en estímulo condicionado con respuesta condicionada.","Ejemplo: una colonia o una canción que te recuerda a una persona.","El condicionamiento clásico, demasiado rígido, fue superado por el condicionamiento operante, que explica mejor la conducta humana."]],
 ["2.3.2. Aprendizaje por observación (Bandura)","Albert Bandura (1925-2021), de las teorías del aprendizaje social, añadió el aprendizaje por observación o vicario: reproducir de forma consciente e intencionada una conducta que se ha visto hacer a otras personas (modelos). Se aprende por imitación y se mantiene por los refuerzos de esos modelos. Da cuerpo a la técnica del modelado.",
  ["Atención: observar y captar lo importante de la acción del modelo.","Retención: memorizar la información e integrarla en el propio repertorio.","Motivación: para reproducir la conducta del modelo.","Ejemplo: jóvenes que visten y se comportan como sus deportistas o cantantes favoritos."]],
 ["2.3.3. Aprendizaje cognitivo (Piaget)","Jean Piaget (1896-1980) aplica la adaptación darwiniana a la inteligencia: el aprendizaje es un proceso cognitivo que depende del desarrollo y las estructuras mentales alcanzadas. La psicología cognitiva (años 50) explica la conducta como un procesamiento de información parecido al de un ordenador; incluye a Piaget, Vygotsky, Bruner y Chomsky.",
  ["Estadio I, sensomotor (0-2 años): sin representación mental ni lenguaje; se aprende con movimiento, percepciones y manipulación de objetos.","Estadio II, preoperatorio o intuitivo (2-7 años): aparece la función simbólica (juego simbólico, dibujo, lenguaje); pensamiento egocéntrico.","Estadio III, operatorio concreto (7-12 años): fin del egocentrismo; razonamiento lógico sobre realidades concretas (clasificar, seriar, contar, espacio, tiempo, causalidad).","Estadio IV, operatorio formal (12-16 años): pensamiento abstracto, hipotético y deductivo, sobre lo posible y no solo lo real.","Asimilación: obtener información nueva del exterior e incorporarla a la estructura mental.","Acomodación: reorganizar la estructura interna tras la asimilación. La adaptación o aprendizaje es el equilibrio entre las dos."]],
 ["2.3.4. Aprendizaje por mediación (Vygotsky)","Lev Vygotsky (1896-1934) incorpora a una persona mediadora: la ayuda de otra persona en el momento oportuno hace eficaz el aprendizaje. Se relaciona con las técnicas de moldeado y encadenamiento.",
  ["Zona de desarrollo real: lo que la persona ya sabe hacer sola, sin ayuda (punto de partida).","Zona de desarrollo potencial: lo que podrá hacer con la ayuda de una persona mediadora.","Zona de desarrollo próximo (ZDP): la distancia entre las dos. Es donde se debe intervenir, porque ahí la ayuda es más eficaz.","Ejemplo (Doc. 2.5): alguien que solo anda sostenido (potencial); el profesional le enseña a poner los pies y le anima a intentarlo solo (próximo); cuando camina solo, eso ya es su zona real y puede empezar otro aprendizaje."]],
 ["2.3.5. Aprendizaje por descubrimiento (Bruner)","Jerome S. Bruner (1915-2016): las personas construyen su conocimiento encontrando activamente contenidos que se suman a los que ya tienen. Da mucha importancia a la motivación y a plantear problemas como retos. La relación con el profesional debe ser interactiva, respetuosa y dialogante.",
  ["Manera enactiva: se aprende con la acción, la manipulación y la práctica (lo más habitual en las primeras etapas).","Manera icónica: se aprende con imágenes reconocibles (fotos, dibujos).","Manera simbólica: se aprende interpretando símbolos como el lenguaje; requiere abstracción."]],
 ["2.3.6. Aprendizaje significativo (Ausubel)","David P. Ausubel (1918-2008): el aprendizaje significativo incorpora contenidos nuevos relacionándolos con los que la persona ya tiene. Hace los conocimientos más sólidos, duraderos y fáciles de recuperar. Es especialmente útil con personas con discapacidad intelectual o dificultades de aprendizaje.",
  ["Condiciones: que los contenidos sean potencialmente significativos, claros y ordenados, y que la persona quiera aprender (esfuerzo deliberado).","Dimensión 1, cómo se relaciona: significativo (relación sustancial con lo que se sabe) o mecánico/por repetición (al pie de la letra, sin relación).","Dimensión 2, cómo se adquiere: por descubrimiento (hay que descubrirlo) o por recepción (se presenta acabado).","Una recepción puede ser significativa y un descubrimiento puede ser mecánico. Ejemplos: investigación científica (descubrimiento significativo), memorizar símbolos químicos (recepción mecánica)."]],
 ["2.4. Aprendizaje en personas vulnerables","Potencial de aprendizaje: capacidad de cada persona para modificarse a sí misma y afrontar favorablemente distintas situaciones (equivale a modificabilidad cognitiva). En personas vulnerables a menudo no se manifiesta del todo, pero puede desarrollarse con mediadores. Hay que averiguarlo para plantear expectativas razonables, y la motivación es imprescindible.",[]],
 ["2.4.1. Discapacidad física o sensorial","Es un colectivo muy heterogéneo: primero hay que identificar las limitaciones en cada área. Garantizar las HAPS es condición básica para su independencia.",
  ["Dificultad por falta de experiencias (en número y calidad), sobre todo si la discapacidad es de nacimiento o temprana.","Dificultad por las limitaciones de la propia discapacidad para interactuar: accesibilidad, comunicación, relación social, integración.","Dificultad por la sobreprotección familiar, que frena la iniciativa y retroalimenta la dependencia.","Estrategias: objetivos funcionales ligados a su vida diaria, habilidades aplicables en distintos contextos (generalización), pequeños pasos, sesiones ajustadas a su atención y cansancio, respetar los tiempos de latencia (sobre todo con sistemas alternativos de comunicación) y actividades grupales de calidad."]],
 ["2.4.2. Discapacidad intelectual","La dificultad depende de la intensidad de los déficits (atención, percepción, memoria, resolución de problemas, pensamiento lógico).",
  ["Dificultades: lentitud, atención breve y fatiga rápida, poco interés y curiosidad, dificultad para hacer las cosas solo y para recordar, y falta de generalización.","Respuesta desadaptada ante tareas difíciles: apatía o pasividad excesiva, o agresividad (protestar, tirar cosas, escapar).","Premisas: aprenden mejor tras haber tenido éxito y con refuerzo inmediato; la participación activa favorece el aprendizaje y reduce el olvido.","Metodología: objetivos fáciles y progresivos, temas de su realidad cercana, trabajo repetitivo y manipulativo, tareas graduales (de fácil a difícil) y secuenciales (en pasos pequeños), explicaciones claras y cortas, ofrecer el modelo correcto, dar tiempo, premiar esfuerzo y logros (sobre todo al principio y justo después), y no reforzar sin querer la evitación.","Su repertorio de intereses es más restringido: conviene identificar qué les motiva y usarlo."]],
 ["2.4.3. Enfermedad mental","Hay tanta diversidad de trastornos que las pautas deben adaptarse con cautela a cada persona.",
  ["Dificultades: deterioro de funciones superiores (sobre todo memoria y atención), percepción distorsionada de la realidad, falta de conciencia de enfermedad (esquizofrenia) y afectación emocional (labilidad, tristeza, apatía, falta de motivación).","En las demencias avanzadas se pierde el habla y luego la capacidad de ir al baño, caminar, sentarse o incluso sonreír.","Estrategias: ambientes estructurados, espacio seguro, entorno agradable sin distractores, señalizaciones y marcadores de horarios y cambios de rutina, actividades ajustadas a sus intereses, objetivos alcanzables, reforzar lo que hace bien, conservar su independencia mientras se pueda y mucha paciencia (evitar discutir).","Complementos (Doc. 2.7): programas de rehabilitación (formación para el trabajo, resolver problemas diarios, manejar dinero, transporte, destrezas sociales) e intervención psicoterapéutica individual.","La familia y las redes de apoyo tienen un papel primordial."]],
 ["2.4.4. Personas en riesgo social","Colectivos muy heterogéneos que comparten una situación de alta vulnerabilidad, coyuntural o cronificada.",
  ["Dificultades: falta de motivación y de expectativas de éxito; pocos recursos de apoyo personal; falta de oportunidades por la mala imagen social; pocas interacciones en entornos normalizados (a veces con barreras de idioma); baja formación y falta de hábitos básicos; y en ocasiones deterioro físico y afectación emocional.","Estrategias: implicar y motivar a la persona, trabajar la autoestima, objetivos asequibles y progresivos por tramos, actividades ajustadas a sus intereses, orientar para que encuentre sentido a lo que hace, intervenir en la comunidad contra los estereotipos, mejorar su entorno y reconstruir los apoyos sociales naturales."]]
],
trucos:["Habilidad → hábito → rutina: «sé hacerlo», «lo hago cuando toca», «lo hago sin pensar».","Fases de las HAPS = «PAAC»: Preparación, Aprendizaje, Automatización, Consolidación.","Autores y su idea en una palabra: Skinner refuerzo, Watson campana (clásico), Bandura imitar, Piaget estadios, Vygotsky ayuda (ZDP), Bruner descubrir, Ausubel conectar.","Estadios de Piaget, «Se Pre-Ocupa de la Forma»: Sensomotor, Preoperatorio, Operatorio concreto, Operatorio Formal (cortes en 2, 7, 12)."],
cards:[
 ["¿Qué es el aprendizaje?","El conjunto de procesos mediante los cuales se adquieren conceptos, conocimientos y habilidades."],
 ["Habilidad","Capacidad o destreza para realizar una actividad."],
 ["Hábito","Conducta aprendida que se ejecuta automáticamente en el momento oportuno y de forma adecuada."],
 ["Rutina","Ritmo de actividad estable que, una vez aprendido, se aplica repetidamente casi de manera inconsciente."],
 ["¿Qué diferencia una rutina de un hábito?","La rutina se puede cambiar por otra o desaparecer cuando ya no se necesita."],
 ["4 beneficios de las rutinas","Orden y claridad (seguridad), orientación temporal, hábitos de alimentación/higiene/sueño, y hábitos sociales."],
 ["4 fases de adquisición de las HAPS","Preparación, aprendizaje, automatización y consolidación."],
 ["Fase de preparación","Preparación psicológica: que la persona esté predispuesta y motivada."],
 ["Fase de automatización","Reproducir la conducta de forma automática cuando se requiere, siendo consciente de cuándo hace falta."],
 ["Fase de consolidación","Afianzar el aprendizaje e interiorizarlo como hábito que se hace de forma rutinaria."],
 ["Factores que inciden en el aprendizaje","Inteligencia, atención, memoria, actitud y motivación, maduración y experiencia."],
 ["Inteligencia","Capacidad de razonar, resolver problemas, pensar en abstracto, comprender, desarrollar lenguaje, aprender y crear."],
 ["Cociente intelectual (CI)","Indicador numérico del grado de conocimiento y comprensión; relaciona edad mental y edad cronológica. Lo introdujo W. Stern en 1912."],
 ["EM < EC","Inteligencia por debajo de la media."],
 ["¿Por qué no etiquetar por el CI?","Porque no orienta la intervención y varía según factores emocionales y ambientales."],
 ["Inteligencias múltiples","Teoría de Howard Gardner (1983): 8 inteligencias (lingüística, lógico-matemática, espacial, musical, corporal-cinestésica, intrapersonal, interpersonal y naturalista)."],
 ["Inteligencia clave en intervención social","La interpersonal (habilidades sociales, relación y ayuda a los demás)."],
 ["Atención","Capacidad de focalizar la percepción en un elemento."],
 ["Atención selectiva vs. dividida","Selectiva: un solo estímulo ignorando el resto. Dividida: varios estímulos o tareas a la vez."],
 ["4 consejos para mejorar la atención","Rutinas y tareas secuenciadas, lugar sin distracciones, dormir lo suficiente (no más de 9-10 h) y relajación."],
 ["Memoria","Capacidad de almacenar información y recuperarla voluntariamente."],
 ["3 niveles de memoria","Sensorial (milisegundos), a corto plazo u operativa (≤ 40 s) y a largo plazo o diferida."],
 ["3 fases de la memoria","Codificación o registro, almacenamiento y recuperación."],
 ["Actitud","Predisposición estable a responder de una manera ante una situación."],
 ["Motivación","Conjunto de factores capaces de provocar, mantener y dirigir la conducta hacia un objetivo."],
 ["Motivaciones primarias vs. secundarias","Primarias: innatas y fisiológicas (hambre, sed). Secundarias: aprendidas (ropa de marca, prestigio)."],
 ["Maduración","Cambios biológicos que permiten adquirir nuevas capacidades; condición necesaria para aprender."],
 ["Aprendizaje por refuerzo","Conductismo (Skinner): se repiten las conductas con consecuencias agradables y se evitan las desagradables."],
 ["Condicionamiento clásico","Watson: un estímulo neutro asociado repetidamente a uno incondicionado acaba provocando la misma respuesta (estímulo condicionado)."],
 ["Aprendizaje por observación","Bandura: reproducir conscientemente la conducta de un modelo. Requiere atención, retención y motivación."],
 ["Asimilación y acomodación","Piaget. Asimilación: incorporar información nueva. Acomodación: reorganizar la estructura mental después."],
 ["4 estadios de Piaget","Sensomotor (0-2), preoperatorio (2-7), operatorio concreto (7-12) y operatorio formal (12-16)."],
 ["Zona de desarrollo próximo","Vygotsky: distancia entre lo que la persona hace sola (real) y lo que puede hacer con ayuda (potencial). Ahí se interviene."],
 ["3 maneras de conocer de Bruner","Enactiva (acción), icónica (imágenes) y simbólica (lenguaje y símbolos)."],
 ["Aprendizaje significativo","Ausubel: relacionar contenidos nuevos con los que ya se tienen. Requiere material significativo y ganas de aprender."],
 ["Potencial de aprendizaje","Capacidad de cada persona para modificarse a sí misma y afrontar favorablemente diversas situaciones (= modificabilidad cognitiva)."],
 ["3 tipos de dificultades en discapacidad física o sensorial","Falta de experiencias, limitaciones de la propia discapacidad y sobreprotección familiar."],
 ["Respuestas desadaptadas en discapacidad intelectual","Apatía o pasividad excesiva, y agresividad."],
 ["¿Cuándo aprenden mejor las personas con discapacidad intelectual?","Tras un éxito previo reforzado de inmediato y con participación activa."],
 ["Estrategia clave en riesgo social","Trabajar la autoestima, además de implicarles, dar objetivos asequibles y reconstruir apoyos sociales."]
],
quiz:[
 ["Una persona sabe cepillarse los dientes pero solo lo hace de vez en cuando. ¿Qué le falta?",["El hábito","La habilidad","La maduración","La inteligencia"],"Tiene la habilidad, pero no la ejecuta automáticamente cuando toca: le falta el hábito."],
 ["¿Qué se puede cambiar o hacer desaparecer cuando ya no se necesita?",["La rutina","El hábito","La maduración","La inteligencia"],"Las rutinas pueden sustituirse o desaparecer, como coger el autobús al instituto."],
 ["¿Cuál es el orden correcto de las fases de adquisición de las HAPS?",["Preparación, aprendizaje, automatización, consolidación","Aprendizaje, preparación, consolidación, automatización","Preparación, consolidación, aprendizaje, automatización","Automatización, aprendizaje, preparación, consolidación"],"Primero motivar, luego aprender, después automatizar y por último consolidar como hábito."],
 ["¿Quién introdujo el concepto de cociente intelectual en 1912?",["William Stern","Howard Gardner","Jean Piaget","Albert Bandura"],"William Stern lo introdujo en 1912."],
 ["Si la edad mental es mayor que la cronológica, la persona tiene…",["Inteligencia superior al promedio","Discapacidad intelectual","Inteligencia media","Deterioro cognitivo"],"EM > EC indica una inteligencia por encima del promedio."],
 ["¿Qué inteligencia es clave para trabajar en intervención social, según el libro?",["Interpersonal","Lógico-matemática","Naturalista","Musical"],"La interpersonal: reconocer a los demás, ayudar y establecer relaciones."],
 ["Escuchar, mirar la pizarra y tomar apuntes a la vez es atención…",["Dividida","Selectiva","Involuntaria","Sensorial"],"Atender a varias tareas al mismo tiempo es atención dividida."],
 ["¿Cuánto dura como máximo la memoria a corto plazo?",["Unos 40 segundos","Unos milisegundos","Unas horas","Varios días"],"La memoria a corto plazo u operativa no dura más de 40 segundos."],
 ["El hambre y la sed son motivaciones…",["Primarias","Secundarias","Aprendidas","Sociales"],"Son fisiológicas e innatas, no aprendidas: motivaciones primarias."],
 ["¿Qué autor defiende que aprendemos imitando a modelos?",["Bandura","Skinner","Ausubel","Watson"],"Bandura: aprendizaje por observación o vicario."],
 ["Según Vygotsky, ¿dónde hay que intervenir para que el aprendizaje sea más eficaz?",["En la zona de desarrollo próximo","En la zona de desarrollo real","Antes de la maduración","En el estadio sensomotor"],"En la zona de desarrollo próximo, entre lo que hace solo y lo que puede hacer con ayuda."],
 ["¿En qué estadio de Piaget aparece el pensamiento abstracto?",["Operatorio formal (12-16)","Sensomotor (0-2)","Preoperatorio (2-7)","Operatorio concreto (7-12)"],"En el operatorio formal se razona de forma hipotética y deductiva."],
 ["Aprender con fotos o dibujos es, para Bruner, la manera…",["Icónica","Enactiva","Simbólica","Mecánica"],"La icónica usa elementos visuales reconocibles."],
 ["¿Qué teoría se basa en relacionar lo nuevo con lo que ya se sabe?",["Aprendizaje significativo (Ausubel)","Condicionamiento clásico (Watson)","Aprendizaje por refuerzo (Skinner)","Inteligencias múltiples (Gardner)"],"Ausubel: el aprendizaje significativo conecta lo nuevo con la estructura previa."],
 ["¿Cuál NO es una fuente de dificultad en personas con discapacidad física o sensorial?",["El exceso de motivación","La falta de experiencias","La sobreprotección familiar","Las limitaciones de accesibilidad"],"Las tres dificultades son falta de experiencias, limitaciones de la discapacidad y sobreprotección."],
 ["Con una persona con discapacidad intelectual conviene…",["Dividir las tareas en pasos pequeños y reforzar enseguida","Dar explicaciones largas y detalladas","Empezar por las tareas más difíciles","Reforzar solo al final del programa"],"Tareas graduales y secuenciales, explicaciones cortas y refuerzo inmediato."]
]

U("promocion", {
n:3, title:"Los programas de entrenamiento en HAPS",
secs:[
 ["3.1. Valoración inicial de las HAPS","La intervención para adquirir, perfeccionar o restaurar HAPS se hace con programas de entrenamiento (también llamados programas en HHAP), que se planifican según las necesidades de la persona. La valoración de las HAPS es el proceso de evaluar en qué actividades presenta déficits la persona y con qué intensidad. Determina de forma objetiva el déficit en cada área, la progresión de la pérdida y las capacidades que conserva.",
  ["Finalidades: reconocer las necesidades, identificar áreas deficitarias, detectar situaciones de riesgo, obtener un diagnóstico para intervenir con acierto y determinar el tipo de atención que se requiere.","La valoración no se hace desde las limitaciones, sino desde la capacidad funcional que mantiene y puede recuperar.","Objetivo principal ante los primeros déficits: mantener su funcionalidad física e intelectual, y con ella su autodeterminación, el mayor tiempo posible."]],
 ["3.1.1. Indicadores de pérdida de autonomía","La pérdida de autonomía es gradual y las habilidades suelen perderse en orden contrario al que se adquirieron. Quien primero la detecta suele ser la familia.",
  ["Primero fallan las AVD instrumentales fuera de casa: transporte público, ir al médico, gestiones, compras.","Después, las del mantenimiento del hogar: preparar comidas, limpiar.","Por último, las básicas de autocuidado: vestirse, comer, asearse, desplazarse.","Orden de aparición (Doc. 3.1): seguridad (recordarle que apague el gas), memoria, teléfono, conversaciones, lectoescritura, intereses, compras, orientación, uso del baño, alimentación, apariencia e higiene bucal, vestido e higiene personal."]],
 ["3.1.2. Instrumentos de evaluación","La valoración la hacen profesionales cualificados (integración social, logopedia, terapia ocupacional, sanitarios). Los instrumentos más usados son la entrevista, la observación y las escalas estandarizadas.",
  ["Entrevista: charla con la persona usuaria, su cuidador o un familiar. Puede ser estructurada (preguntas en orden fijo, tipo cuestionario) o abierta (con un guion que se va reconduciendo). Hay que crear un ambiente de confianza.","Observación: atender al comportamiento en situaciones reales (o simuladas). Debe ser sistemática: qué registrar, cuándo, con qué criterios y medios. Se anota en una hoja de registro.","Límites de la observación: depende de la capacidad y experiencia del observador, su presencia puede alterar la conducta y hay que esperar a que la conducta ocurra.","Autoobservación: la persona registra sus propias conductas o pensamientos. Es difícil con déficits cognitivos y puede registrar lo que quiere que vean los demás.","Escalas estandarizadas: formularios breves con criterios validados. Las hay funcionales (AVDB, AVDI, desempeño), cognitivas, del estado emocional y de las relaciones sociales y el entorno. El profesional elige la más conveniente.","Principios éticos: defensa de la privacidad, valoración positiva de la diferencia y respeto a la libertad personal."]],
 ["3.2. Diseño del programa","El diseño o planificación consiste en definir qué se quiere alcanzar y cómo se llevará a cabo el programa.",
  ["Formular los objetivos.","Enumerar y diseñar las actividades.","Temporizar las actividades.","Prever los recursos.","Elaborar pautas para evaluar el proceso y los resultados."]],
 ["3.2.1. Los objetivos","Los objetivos son las metas que se quieren alcanzar como resultado de la intervención. Son la base de la programación, guían la intervención y sirven de referencia para evaluar. Deben ser claros, concretos y cuantificables, y se redactan en infinitivo.",
  ["Objetivos generales o de programa: fijan las metas del programa completo (recuperar y perfeccionar las habilidades de higiene, apariencia y salud personal).","Objetivos específicos o de actividad: se derivan de los generales y son más concretos, realizables y evaluables (progresar en la higiene diaria hasta hacerla sin ayuda).","Para que sean más motivadores conviene acordarlos con la persona usuaria y sus cuidadores, y fijar plazos."]],
 ["3.2.2. Las actividades","Son el conjunto de actuaciones que componen el programa para alcanzar los objetivos. Se aplican con una metodología concreta (una técnica o una combinación) y suelen resumirse en fichas.",
  ["Componentes de una actividad: objetivos específicos; desarrollo (pasos bien secuenciados, qué hace el profesional y qué técnicas usa); recursos (espacio, materiales, humanos); y pautas de observación para comprobar si se logran los objetivos.","Ejemplo de indicadores para la higiene bucal: identifica cuándo hacerla, maneja cepillo y pasta, cepilla correctamente, la duración es adecuada, se enjuaga y guarda los enseres."]],
 ["Técnicas de intervención","Según el objetivo que persiguen se agrupan así (se estudian en el resto del libro):",
  ["Modificación de conducta: adquirir conductas adecuadas, aumentar su frecuencia o consolidarlas, y reducir o eliminar las inadecuadas.","Entrenamiento de las AVD: para quien ha perdido funcionalidad; a menudo con productos de apoyo.","Entrenamiento de la movilidad: con frecuencia, uso de bastón, andador o silla de ruedas.","Facilitar la orientación: en el espacio o en el tiempo, con estrategias o productos de apoyo.","Habilidades sociales: interactuar, participar en el grupo y comunicarse.","Estimulación de las funciones cognitivas: frenar o retrasar su deterioro.","Técnicas cognitivas: identificar pensamientos distorsionados y elaborar otros más constructivos (trastornos psicológicos).","Ejemplos: un hombre con pérdida de memoria → estimulación cognitiva y pautas de orientación; una chica en silla de ruedas tras un accidente → movilidad y AVD con productos de apoyo."]],
 ["3.2.3. La temporización","Es la ordenación y distribución en el tiempo de las actividades y la duración de cada una. El instrumento más usado es el cronograma: una tabla de doble entrada con las actividades en filas y las unidades de tiempo en columnas (puede indicar también los profesionales).",
  ["Secuencia u orden de las actividades.","Duración de cada actividad: sesiones que suelen durar entre 45 y 90 minutos.","Número de sesiones y frecuencia (por ejemplo, 25 sesiones de 45 minutos, dos por semana)."]],
 ["3.2.4. Los recursos","Son todos los medios físicos, humanos y económicos necesarios para el programa.",
  ["Espaciales: el lugar, con amplitud y condiciones ambientales adecuadas (también al aire libre).","Materiales: mobiliario, equipos y material reutilizable o fungible. Destacan los productos de apoyo: dispositivos, equipos, instrumentos o tecnología para prevenir, compensar, controlar, mitigar o neutralizar limitaciones funcionales.","Humanos: las personas que preparan y conducen las actividades.","Económicos: coste y fuentes de financiación.","Norma UNE-EN ISO 9999:2020: clasifica los productos de apoyo en tres niveles según su función (p. ej., 12 movilidad personal, 15 actividades domésticas, 22 comunicación e información, 30 esparcimiento).","El CEAPAT (Centro de Referencia Estatal de Autonomía Personal y Ayudas Técnicas, del Imserso) tiene un catálogo actualizado de productos de apoyo."]],
 ["3.2.5. Pautas de evaluación y 3.2.6. Entornos institucionalizados","En la planificación se fijan los referentes para evaluar a las personas usuarias (satisfacción, expectativas, resultados) y el diseño. En residencias o centros de día el entrenamiento se integra en la programación del centro.",
  ["Programa de intervención terapéutica (PIT): conjunto de actividades terapéuticas que un centro propone para atender de forma integral a sus usuarios.","Áreas del PIT: funcional (AVD, rehabilitación funcional), movilidad (psicomotricidad, piscina, actividades manuales), psicosocial (habilidades sociales, musicoterapia, ludoterapia, dinámicas de grupo) y cognitiva (orientación a la realidad, psicoestimulación, rehabilitación cognitiva, reminiscencia).","Plan individual de intervención terapéutica (PIIT): especifica los programas y actividades para una persona concreta. Participan el equipo, los servicios sociales, la familia y la propia persona si su estado lo permite."]],
 ["3.3. Ejecución del programa","Es la puesta en práctica de las actividades planificadas. Depende de la colaboración de todos: la persona, el equipo interdisciplinar y la familia (que es quien mejor la conoce y su referente afectivo).",
  ["La persona debe estar motivada, tener capacidad física y cognitiva suficiente (si no, hubo errores al planificar) y confiar en sí misma y en los profesionales.","Asegurarse siempre de que ha comprendido las instrucciones.","Entorno ambientado y materiales preparados antes de empezar.","Buena relación comunicativa y coordinación del equipo (Doc. 3.8): reuniones de trabajo, informes (dan continuidad, por ejemplo entre turnos) y registros de actividades y evolución. Información clara, ordenada y sin lo superfluo."]],
 ["3.3.2. Fases de la ejecución","Siguen las fases de adquisición de las HAPS; hay que afianzar cada fase antes de pasar a la siguiente. El objetivo del programa es enseñar habilidades y convertirlas en hábitos.",
  ["1. Preparación: informativa y de planificación psicológica. Informar de objetivos y beneficios, explicar técnicas y secuencia, resolver dudas y temores. Es normal que al principio se muestre reacia: hay que motivarla.","2. Aprendizaje o adquisición: aprender a ejecutar la habilidad paso a paso. En habilidades complejas se fracciona y luego se encadena (encadenamiento). El profesional da apoyos físicos, psicológicos o materiales.","3. Automatización: repetir de forma continuada hasta hacerlo con soltura y en el momento adecuado. Es larga; el apoyo al principio es intenso y el profesional se va retirando.","4. Consolidación: afianzar y generalizar el aprendizaje a distintos entornos, sobre todo a la vida real. Sin ella hay retroceso. Claves: supervisión, refuerzos, rutinas y el entorno.","Rutinas (Doc. 3.9): siempre igual y en el mismo contexto, ajustadas a los ritmos reales de la persona, elegidas con ella y compartidas por todo su entorno, que actúa como modelo."]],
 ["3.3.3. Coordinación con la familia","Es imprescindible en la ejecución y el seguimiento: la automatización y la consolidación solo son posibles si la habilidad se practica en la vida real. La sobreprotección o las ideas negativas de la familia dificultan la autonomía.",
  ["Funciones: comunicación fluida familia-equipo, capacitar a la familia para dar atención y apoyo, favorecer que la familia funcione de forma autónoma y apoyar a los cuidadores frente al desgaste psicoemocional.","Información: detallada sobre los recursos disponibles, adaptada a su nivel de comprensión.","Formación: conocimientos, técnicas, cuidados y habilidades necesarias.","Orientación: recursos y recomendaciones para que tomen decisiones.","Apoyo emocional: grupos o asociaciones de familiares, encuentros periódicos de apoyo mutuo.","Recursos de respiro: para detectar el agotamiento y evitar el burnout o la claudicación.","Psicoeducación (Doc. 3.10): va más allá de informar; por ejemplo, en la esquizofrenia enseña a la familia a reconocer los síntomas y manejar las conductas, reduciendo la carga familiar."]],
 ["3.3.4. Actitudes para trabajar con familias","Las necesidades de cada familia cambian según el momento evolutivo, la causa de la dependencia, su gravedad, la aceptación, la situación económica, etc.",
  ["Honestidad: franqueza, resaltar potencialidades, nunca falsas expectativas; no tener miedo a decir «no lo sé».","Respeto: a su intimidad y diversidad, sin estereotipos.","Privacidad y confidencialidad: secreto profesional, información solo por los cauces reglamentarios.","Escucha activa.","Comunicación: lenguaje sencillo, adaptado a su edad, condición o cultura.","Empatía y distancia profesional: para evitar el enganche afectivo.","Paciencia: sin ponerse a la defensiva ni mostrar agresividad.","Disponibilidad, dentro de lo razonable.","Priorizar el bienestar de la persona usuaria como meta compartida.","Lo ideal: grupos pequeños y homogéneos, aprendizaje activo y dialogado, partir de su experiencia y reforzar sus logros."]],
 ["3.4. La evaluación del programa","La evaluación es la valoración de todas las acciones de una intervención y de sus resultados. Es un proceso continuo que responde a tres preguntas: ¿cuándo?, ¿qué? y ¿cómo evaluar?",
  ["Inicial o diagnóstica: detecta déficits y necesidades (la valoración inicial).","Del proceso o continua: durante el programa; indica si hay que ajustar objetivos, actividades o productos de apoyo.","Del resultado o final: mide en qué grado se han logrado los objetivos.","Del seguimiento: tras terminar, revisiones periódicas para comprobar si el hábito se ha consolidado o hay nuevas necesidades.","Objeto: el programa (con los objetivos generales: logro, idoneidad de actividades, temporización, satisfacción) o las actividades (con los objetivos específicos, recursos, desempeño de los profesionales, satisfacción)."]],
 ["3.4.3. Modo de evaluación y 3.4.4. El informe","Se usan los mismos instrumentos que en la valoración inicial; la observación es la más frecuente por ser la más precisa y objetiva. Los indicadores de evaluación son enunciados que permiten medir el grado de aproximación a un objetivo; con ellos se hacen las tablas de observación.",
  ["Listas de comprobación: sí/no, presencia o ausencia de la conducta.","Escalas de estimación: de frecuencia, grado o descriptivas (nunca, a veces, a menudo, siempre).","Registros descriptivos: anecdotarios y notas de campo; menos precisos pero más ricos en detalles.","Informe de evaluación: documento que recoge los resultados y valora el logro de los objetivos. Comunica a persona, familia y equipo.","Tipos de informe: inicial o diagnóstico, de progreso (permite reconducir), del resultado o final (puntos fuertes y deficiencias para mejorar) y de seguimiento.","Partes del informe final (Doc. 3.12): descripción del programa, resultados, análisis y conclusiones (con sugerencias y recomendaciones)."]]
],
trucos:["Diseño del programa = «OATRE»: Objetivos, Actividades, Temporización, Recursos, Evaluación.","La autonomía se pierde «de fuera hacia dentro»: primero la calle, luego la casa, por último el propio cuerpo.","Evaluación en 4 momentos: antes (inicial), durante (proceso), al final (resultado) y después (seguimiento).","PIT = el menú del centro para todos; PIIT = el plato de cada persona (la «I» extra es de Individual)."],
cards:[
 ["Valoración de las HAPS","Proceso de evaluar en qué actividades presenta déficits la persona y con qué intensidad."],
 ["5 finalidades de la valoración","Reconocer necesidades, identificar áreas deficitarias, detectar riesgos, obtener un diagnóstico y determinar el tipo de atención."],
 ["¿Desde dónde se valora la autonomía?","Desde la capacidad funcional que mantiene y puede recuperar, no desde las limitaciones."],
 ["¿En qué orden se pierde la autonomía?","Primero AVD instrumentales fuera de casa, luego las del hogar y por último las básicas de autocuidado."],
 ["¿Quién suele detectar primero la pérdida de autonomía?","La familia que vive con la persona o está cerca de ella."],
 ["3 instrumentos de evaluación","La entrevista, la observación y las escalas estandarizadas."],
 ["Entrevista estructurada vs. abierta","Estructurada: preguntas en orden fijo (cuestionario). Abierta: un guion que se va reconduciendo."],
 ["Observación sistemática","Saber qué registrar, cuándo, con qué criterios y con qué medios; se anota en una hoja de registro."],
 ["2 inconvenientes de la autoobservación","Difícil con déficits cognitivos y la persona puede registrar lo que quiere que vean los demás."],
 ["Escalas estandarizadas","Formularios breves con criterios validados: funcionales, cognitivas, emocionales y de relaciones sociales."],
 ["Diseño o planificación","Definir qué se quiere alcanzar y cómo se llevará a cabo el programa."],
 ["Objetivos","Metas que se quieren alcanzar con la intervención; claros, concretos, cuantificables y en infinitivo."],
 ["Objetivos generales vs. específicos","Generales: del programa. Específicos: de cada actividad, más concretos, realizables y evaluables."],
 ["Componentes de una actividad","Objetivos específicos, desarrollo, recursos y pautas de observación."],
 ["Técnicas de modificación de conducta","Para adquirir, aumentar o consolidar conductas adecuadas y reducir o eliminar las inadecuadas."],
 ["Estimulación cognitiva vs. técnicas cognitivas","Estimulación: frenar el deterioro de funciones cognitivas. Técnicas cognitivas: cambiar pensamientos distorsionados."],
 ["Temporización","Ordenar y distribuir en el tiempo las actividades y su duración."],
 ["Duración habitual de una sesión","Entre 45 y 90 minutos."],
 ["Cronograma","Tabla de doble entrada: actividades en filas y unidades de tiempo en columnas."],
 ["4 tipos de recursos","Espaciales, materiales, humanos y económicos."],
 ["Productos de apoyo","Dispositivos, equipos o tecnología para prevenir, compensar, mitigar o neutralizar limitaciones funcionales."],
 ["Norma de productos de apoyo","UNE-EN ISO 9999:2020, que los clasifica en tres niveles según su función."],
 ["CEAPAT","Centro de Referencia Estatal de Autonomía Personal y Ayudas Técnicas (Imserso); tiene un catálogo de productos de apoyo."],
 ["PIT","Programa de intervención terapéutica: actividades terapéuticas de un centro para atender integralmente a sus usuarios."],
 ["PIIT","Plan individual de intervención terapéutica: programas y actividades para una persona concreta."],
 ["4 áreas del PIT","Funcional (AVD), movilidad, psicosocial y cognitiva."],
 ["3 formas de coordinar al equipo","Reuniones de trabajo, informes y registros."],
 ["4 fases de la ejecución","Preparación, aprendizaje o adquisición, automatización y consolidación."],
 ["Encadenamiento","Fraccionar una habilidad compleja en pasos cortos y luego unirlos."],
 ["¿Qué pasa si no se trabaja la consolidación?","Puede haber retroceso y el hábito no se implanta."],
 ["Claves de la consolidación","Supervisión, refuerzos, rutinas y el papel del entorno."],
 ["Apoyos a la familia","Información, formación, orientación, apoyo emocional y recursos de respiro."],
 ["Recursos de respiro","Programas para detectar el agotamiento del cuidador y evitar el burnout o la claudicación."],
 ["Psicoeducación","Intervención con la familia que va más allá de informar: enseña a reconocer síntomas y manejar conductas (p. ej., esquizofrenia)."],
 ["Empatía y distancia profesional","Combinarlas para no implicarse emocionalmente y evitar el enganche afectivo."],
 ["4 momentos de la evaluación","Inicial o diagnóstica, del proceso o continua, del resultado o final, y del seguimiento."],
 ["Indicadores de evaluación","Enunciados que permiten medir el grado de aproximación a un objetivo."],
 ["Lista de comprobación vs. escala de estimación","Lista: sí/no. Escala: opciones intermedias (nunca, a veces, a menudo, siempre)."],
 ["Informe de evaluación","Documento que recoge los resultados y valora el logro de los objetivos."],
 ["4 tipos de informe","Inicial o diagnóstico, de progreso, del resultado o final y de seguimiento."]
],
quiz:[
 ["¿Qué actividades suelen fallar primero cuando se pierde autonomía?",["Las instrumentales que exigen salir de casa","Las de higiene personal","Vestirse","Comer"],"Primero transporte, médico, gestiones y compras; lo básico se pierde al final."],
 ["La valoración de la autonomía debe hacerse desde…",["La capacidad funcional que se mantiene y se puede recuperar","Las limitaciones de la persona","El diagnóstico médico únicamente","La opinión de la familia"],"Se valora desde lo que la persona conserva y puede recuperar."],
 ["Una entrevista con preguntas en un orden fijo, tipo cuestionario, es…",["Estructurada","Abierta","Autoobservación","Escala de estimación"],"La estructurada sigue un orden predeterminado de preguntas."],
 ["¿Qué inconveniente tiene la autoobservación?",["La persona puede registrar lo que quiere que vean los demás","Es demasiado cara","Requiere un cronograma","Solo sirve en residencias"],"Además, es difícil de aplicar con déficits cognitivos."],
 ["¿Cómo deben redactarse los objetivos?",["Claros, concretos, cuantificables y en infinitivo","En pasado y generales","Como preguntas","Sin plazos para no agobiar"],"Así sirven de guía y de referencia para evaluar."],
 ["«Iniciarse en las actividades de ducha y baño completo» es un objetivo…",["Específico o de actividad","General o de programa","De evaluación","De recursos"],"Es concreto, derivado del general sobre higiene: específico."],
 ["¿Qué técnica sirve para cambiar pensamientos distorsionados por otros más constructivos?",["Técnicas cognitivas","Estimulación de las funciones cognitivas","Entrenamiento de las AVD","Técnicas de movilidad"],"Las técnicas cognitivas se aplican a dificultades o trastornos psicológicos."],
 ["¿Qué instrumento se usa más para la temporización?",["El cronograma","La escala estandarizada","El anecdotario","El informe de progreso"],"El cronograma cruza actividades con unidades de tiempo."],
 ["Una silla de ruedas es un recurso…",["Material (producto de apoyo)","Espacial","Humano","Económico"],"Los productos de apoyo forman parte de los recursos materiales."],
 ["¿Qué diferencia hay entre PIT y PIIT?",["El PIT es del centro para todos y el PIIT es para una persona concreta","Son lo mismo","El PIIT es del centro y el PIT individual","El PIT solo se usa en domicilios"],"El PIIT concreta para cada persona los programas del PIT."],
 ["¿En qué fase se fracciona una habilidad compleja en pasos que luego se encadenan?",["Aprendizaje o adquisición","Preparación","Consolidación","Seguimiento"],"En la fase de aprendizaje se usa el encadenamiento."],
 ["Generalizar el aprendizaje a la vida real es propio de la fase de…",["Consolidación","Preparación","Aprendizaje","Evaluación inicial"],"La consolidación afianza y generaliza el hábito."],
 ["Los programas que ayudan a los cuidadores a evitar el burnout se llaman…",["Recursos de respiro","Psicoeducación","Escalas de estimación","Informes de progreso"],"Los recursos de respiro previenen el agotamiento y la claudicación."],
 ["¿Qué evaluación se hace tras terminar el programa para comprobar si el hábito se mantiene?",["De seguimiento","Inicial","Continua","Diagnóstica"],"Con revisiones o entrevistas periódicas tras el entrenamiento."],
 ["Un registro con opciones «nunca, a veces, a menudo, siempre» es…",["Una escala de estimación","Una lista de comprobación","Un anecdotario","Una entrevista abierta"],"Las escalas de estimación tienen opciones intermedias."],
 ["¿Qué actitud evita el «enganche afectivo» con las familias?",["Combinar empatía y distancia profesional","Dar falsas expectativas","Usar lenguaje técnico","Estar siempre a la defensiva"],"La distancia profesional evita implicarse emocionalmente en exceso."]
]

U("promocion", {
n:4, title:"Técnicas de modificación de conducta",
secs:[
 ["4.1. La conducta","La conducta es el conjunto de comportamientos de una persona o un animal en los distintos contextos de la vida; es la manifestación observable de la personalidad. Cada persona reacciona distinto a un estímulo según su genética, creencias, experiencia y circunstancias.",
  ["Conducta vs. comportamiento: la conducta son patrones de actuación estables; el comportamiento es la actuación en un espacio y un tiempo concretos."]],
 ["4.1.1. Los estímulos y la respuesta","La respuesta al estímulo no depende solo del organismo: está condicionada por su interacción con el medio. Si una persona mayor es agresiva en la residencia y no lo era en casa, probablemente influyen factores del entorno.",
  ["Estímulo externo: del entorno (un insulto, un producto llamativo, un olor desagradable).","Estímulo interno: del propio organismo (el hambre, pensar en las vacaciones, un pensamiento distorsionado).","Fisiológico: afecta a las funciones físicas (hambre, sueño, dolor de cabeza).","Psicológico: afecta al componente psíquico (publicidad, pensamientos distorsionados)."]],
 ["4.1.2. Componentes de la conducta","No basta con mirar lo observable. Localizar el estímulo y analizarlo ayuda a predecir la respuesta y decidir mejor.",
  ["Conductual: la respuesta motora, la más observable (verbal, no verbal, paralingüística).","Fisiológico: la respuesta interna (pupilas, respiración, sudoración, ritmo cardiaco, tensión).","Cognitivo: el pensamiento que desencadena el estímulo y que influye en la conducta.","Ejemplo: alguien recién ingresado en una residencia piensa que le han abandonado (cognitivo), insulta y se niega a cumplir normas (conductual) y suda y está tenso (fisiológico)."]],
 ["4.1.3. Tipos de conductas","Desde la intervención social se clasifican con tres criterios.",
  ["Según la elaboración de la respuesta: estereotipadas, innatas o instintivas (reflejas, sin aprendizaje: apartar la mano del fuego, bostezar); aprendidas (intencionadas y con propósito; los hábitos lo son); complejas (fruto del razonamiento: ¿qué cocino hoy?).","Según su manifestación: agresivas (violencia verbal, física o psicológica; solo atienden a sus intereses y violan los derechos ajenos); pasivas o inhibidas (sumisión, anteponen a los demás y evitan conflictos); asertivas (respeto propio y ajeno: expresar lo que se piensa y defender los propios derechos respetando los de los demás).","Según sus consecuencias: adecuadas (beneficiosas para uno y para los demás) e inadecuadas (consecuencias desagradables)."]],
 ["4.1.4. La modificación de conducta","Una técnica de modificación de conducta es una estrategia o procedimiento para transformar los patrones de comportamiento habitual de una persona y conseguir una conducta adecuada: ajustar una conducta, reducir o eliminar una inadecuada o aprender una nueva.",
  ["1. Identificar la conducta objetivo con detalle (frecuencia, intensidad, duración): cuanto más detalle, más eficacia.","2. Fijar objetivos: adquirir, aumentar la frecuencia, perfeccionar, reducir o eliminar.","3. Aplicar la técnica o combinación de técnicas adecuada.","4. Hacer seguimiento para que el cambio se mantenga y se generalice.","Requisitos: comunicación asertiva y precisa, escucha activa y empatía (la persona no es un sujeto pasivo) y un entorno agradable sin interferencias.","Ejemplo (Doc. 4.1): Miguel, 14 años, con discapacidad intelectual grave, tira objetos en clase. Se combinan extinción (ignorar), tiempo fuera, saciación (lanzar objetos en una sala vacía hasta aburrirse) y refuerzo de conductas incompatibles («jefe de música», recados)."]],
 ["4.2. Incrementar o perfeccionar conductas","Objetivo frecuente en la intervención (por ejemplo, la higiene o la alimentación). Técnicas: refuerzo positivo, refuerzo negativo y control de estímulos.",[]],
 ["4.2.1. El refuerzo positivo","Consiste en proporcionar una consecuencia agradable tras realizar una conducta deseada. Además, se usa como complemento en casi todas las técnicas de aprendizaje.",
  ["Sociales: alabanzas, elogios («¡lo has conseguido!») y gestos de aprobación (sonrisas, asentir).","Materiales: consumibles (dulces, comida preferida) o duraderos (juguetes, regalos).","Basados en actividades: una salida, música, una serie, más tiempo para lo que le gusta.","Canjeables: fichas que se cambian por objetos o actividades.","Saciación: si se abusa de los refuerzos (sobre todo materiales) dejan de motivar o incluso desmotivan.","Elegirlos según cada persona (entrevista con ella y su familia) y usar varios para un mismo objetivo.","Refuerzo continuo: cada vez que actúa bien. Solo al principio: riesgo de saciación, de no generalizar y de que la conducta desaparezca al quitar el refuerzo.","Refuerzo intermitente: solo algunas veces. Más eficaz después de la fase inicial.","Aplicarlo inmediatamente después de la conducta (nunca antes). Al principio más potente y frecuente; luego retirarlo poco a poco, aunque puede mantenerse algo de refuerzo social."]],
 ["4.2.2. El refuerzo negativo","Consiste en retirar una situación molesta o desagradable cuando la persona ejecuta una conducta. La sensación placentera viene de que desaparece lo aversivo. Diferencia con el positivo: en el positivo se da algo, en el negativo se quita; en ambos el resultado es agradable y la conducta aumenta.",
  ["Por escape: la desaparición de lo desagradable impulsa la conducta (se come la verdura para que la dejen ver la tele).","Por evitación: la conducta impide que aparezca lo desagradable (los viernes compran comida rápida para evitar tensiones).","Qué se puede retirar: objetos o ambientes desagradables, tareas que no le apetecen (poner la mesa, fregar), dolores o posturas molestas.","Aplicarlo cuanto antes; al principio de forma continua, luego intermitente, hasta retirarlo."]],
 ["4.2.3. El control de estímulos","Consiste en preparar el medio con los estímulos discriminativos adecuados para que aumente la probabilidad de la conducta deseada. Se refuerza la respuesta solo cuando aparece en presencia del estímulo discriminativo. A diferencia del refuerzo, actúa sobre los antecedentes, no sobre la consecuencia.",
  ["Ejemplo: si hace la tarea cuando el profesional se lo indica, se refuerza; si la hace sin que se lo indiquen, no se le presta atención.","Identificar por observación la relación entre estímulos y conductas.","Detectar y eliminar los estímulos que provocan la conducta inapropiada.","Resaltar los estímulos que incitan a responder bien.","No abusar: cada presentación no reforzada del estímulo debilita su poder."]],
 ["4.3.1. El modelado","Para adquirir conductas nuevas se usan el modelado, el moldeado y el encadenamiento. El modelado se basa en la observación de un modelo cuya conducta, pensamientos o actitudes se consideran adecuados (deriva del aprendizaje social de Bandura). El modelo puede ser presencial o diferido (vídeo).",
  ["Elección del modelo: alguien que lo ejecute perfectamente y con claridad (profesionales, personas de referencia o personas que vivieron una situación parecida). Cuanto más se parezca a la persona (edad, sexo, situación) y más importante sea para ella, mejor.","Riesgo: si el modelo tiene conductas inadecuadas, se aprenden conductas desadaptativas (redes sociales).","Pasos: valorar si tiene capacidad, explicar la conducta y su utilidad, destacar lo clave mientras observa, imitar inmediatamente, usar instigadores si hace falta, reforzar después y retirar apoyos poco a poco con varios ensayos.","Tipos (Doc. 4.2): pasivo o activo; simbólico (vídeo), en vivo o encubierto (imaginado); participativo o no; positivo, negativo o mixto; de conductas intermedias u objetivo; individual o grupal; simple o múltiple; de dominio (el modelo ya domina) o de afrontamiento (empieza como el observador y va mejorando).","Instigadores o incitadores (Doc. 4.3): estímulos previos que ayudan a iniciar la respuesta (instrucciones verbales, gestos, imágenes). Se retiran a medida que se logra la respuesta."]],
 ["4.3.2. El moldeado","Consiste en reforzar de forma selectiva las conductas más cercanas a la que se quiere instaurar, por aproximaciones sucesivas. Sirve para conductas que no están en el repertorio y son difíciles por su complejidad o por las limitaciones de la persona. Muy usado en rehabilitación motora y del habla y en educación especial.",
  ["Definir con claridad la meta y todos los pasos intermedios.","Plantear bien la progresión: al principio mucho refuerzo y poca exigencia; después cada vez más exigencia.","Una vez adquirida, pasar de refuerzo continuo a intermitente.","Guía física (Doc. 4.4): el profesional induce manualmente, por contacto físico, los movimientos que se quieren desarrollar. Muy frecuente en habilidades motoras."]],
 ["4.3.3. El encadenamiento","Consiste en descomponer una conducta compleja en una sucesión de conductas más sencillas, que la persona a veces ya conoce pero no sabe enlazar. Muy útil en autocuidado y tareas domésticas (vestirse, comer, asearse).",
  ["1. Especificar la conducta final y todas las conductas necesarias (higiene matinal: ir al baño, lavarse manos y cara, secarse, cepillarse los dientes y el pelo).","2. Secuenciar con detalle cada subconducta según la capacidad (cepillarse: coger y abrir el tubo, coger el cepillo, poner pasta, cerrar…).","3. Entrenar cada subconducta hasta que salga bien (si no usa jabón, enseñárselo).","4. Encadenar las subconductas en orden, empezando por la primera.","Se complementa con modelado, moldeado, instigadores y refuerzos (Doc. 4.5)."]],
 ["4.4. Reducir o eliminar conductas","Se aplican consecuencias negativas o desagradables cada vez que aparece la conducta indeseada.",
  ["Coste de respuesta o castigo negativo: retirar algo agradable tras la conducta no deseada (elogios, caprichos, actividades gratas, relación con personas o ambientes amenos). La persona debe saber el motivo y tener alternativas adecuadas.","Castigo positivo: aplicar una consecuencia aversiva justo después (recriminación verbal, gestual o física). Solo en casos graves (agresiones, autolesiones). Inconvenientes: no educa, crea aversión hacia quien lo aplica y produce habituación. Usarlo solo si lo demás falla.","Saciación (Doc. 4.6): administrar el refuerzo de forma masiva para que pierda valor. De estímulo (dar el refuerzo mucho tiempo) o de respuesta/práctica masiva (hacer la conducta inadecuada de forma masiva, como tirar objetos durante mucho rato)."]],
 ["4.4.3. La extinción y 4.4.4. El tiempo fuera","Dos técnicas muy usadas para que la conducta deje de mantenerse.",
  ["Extinción: ignorar la conducta indeseada para que desaparezca al no recibir refuerzo. Muy eficaz con conductas reforzadas sin querer (una gracia en la mesa que hizo reír a todos). Siempre y de forma continua, nunca intermitente; mejor combinada con refuerzo de conductas alternativas.","Aislamiento o tiempo fuera: retirar un refuerzo o impedir el acceso a él ante una conducta inapropiada.","Tiempo fuera de actividad: apartar de una actividad agradable (no jugar al ajedrez un tiempo si tira las fichas al perder).","Tiempo fuera de lugar: retirar de un lugar agradable (no salir al jardín si arranca las flores).","Solo funciona si la actividad o el lugar son valiosos para la persona, y debe ser breve."]],
 ["Disciplina positiva (Doc. 4.7)","Las técnicas punitivas generan obediencia sin comprensión, y con ella resentimiento, baja autoestima, rebeldía o habituación al castigo. La disciplina positiva establece normas desde el entendimiento mutuo, la empatía y el acuerdo, con acciones sustitutivas positivas y acompañamiento emocional.",
  ["Tiempo fuera positivo: persona y profesional se retiran juntos de la situación tensa para buscar calma y dialogar una solución.","Sillón o rincón de la calma: espacio amable y cómodo donde sentarse juntos a hablar de lo sucedido y buscar alternativas.","También son de disciplina positiva el refuerzo de conductas incompatibles y la sobrecorrección."]],
 ["4.4.5. Conductas incompatibles y 4.4.6. Sobrecorrección","Dos técnicas que, además de eliminar la conducta mala, fomentan la buena.",
  ["Refuerzo de conductas incompatibles: premiar de forma continuada las conductas incompatibles con la que se quiere eliminar y no reforzar esta (gritar en clase es incompatible con estar en silencio). La persona debe saber qué se premia; a veces se premia un periodo sin la conducta, que se va alargando.","Sobrecorrección: restitución + práctica positiva.","Restitución: corregir los efectos de la conducta y dejar el entorno como estaba.","Práctica positiva: repetir la conducta alternativa deseada.","Ejemplo: si tira la bandeja de comida, la recoge y limpia (restitución) y vuelve a cogerla correctamente (práctica positiva). Eficaz en agresiones, berrinches, malos modales en la mesa o incontinencia voluntaria."]],
 ["4.5. Técnicas para controlar conductas","Se basan en un acuerdo negociado entre profesional y persona usuaria, en un soporte tangible. Esto permite valorar los progresos de forma más objetiva y aumenta el compromiso. Sirven para aumentar conductas adecuadas y para reducir las inadecuadas.",[]],
 ["4.5.1. La economía de fichas","Es un sistema de refuerzo que utiliza fichas canjeables por recompensas para premiar las conductas que se desea establecer. Combina refuerzo positivo (se ganan fichas) y castigo negativo (se pierden).",
  ["Ventajas: el refuerzo es inmediato y tangible, y la persona gestiona y guarda sus fichas hasta canjearlas.","Reglas pactadas antes de empezar: qué conductas ganan y cuáles pierden fichas, el valor de cada ficha y las recompensas (variadas y que no pueda conseguir fácilmente fuera).","Contabilidad diaria de fichas ganadas, gastadas, perdidas y acumuladas.","Puede haber fichas de valor bajo a corto plazo (un café, 5-10 puntos) y de valor alto a largo plazo (una excursión, 300-400 puntos).","Al inicio refuerzo continuo; adquirida la conducta, intermitente; consolidada, desvanecimiento.","Desvanecimiento: espaciar la entrega, dar menos fichas, pedir más puntos por premio, aumentar los criterios y sustituir las fichas por refuerzos sociales.","Para evitar «números rojos» y abandono, sobre todo al principio, usar avisos o tarjetas antes de retirar fichas."]],
 ["4.5.2. El contrato de conducta","Es un acuerdo negociado entre profesional y persona usuaria, por escrito, que establece lo que la persona se compromete a hacer y las consecuencias de cumplirlo o no. Se basa en el refuerzo recíproco (refuerzo positivo + castigo negativo).",
  ["Descripción detallada de las conductas a implantar, perfeccionar o eliminar.","Consecuencias: refuerzos por cumplir y castigos negativos por incumplir.","Criterios de valoración, cómo se hará, quién la hará y cómo se informará a la persona de su evolución.","Límites de duración del contrato.","Puede provocar el rechazo si la persona no está de acuerdo con la valoración: hay que asegurarse de que es la técnica indicada e informarle siempre.","Modelo (Doc. 4.8): un punto por conducta cumplida en un carnet, canje semanal, se pierde un punto por conducta inadecuada, revisión periódica y firma de ambas partes."]]
],
trucos:["Positivo = se AÑADE algo; negativo = se QUITA algo. Refuerzo = la conducta SUBE; castigo = la conducta BAJA. Cruza las dos y salen las cuatro técnicas.","Adquirir conductas nuevas = «las 3 M»: Modelado (mirar), Moldeado (acercarse poco a poco), y encadenaMiento (paso a paso).","Extinción = «hacer como que no lo ves», siempre y sin excepciones.","Sobrecorrección = «lo arreglas y lo repites bien»."],
cards:[
 ["Conducta","Conjunto de comportamientos de una persona en los distintos contextos de la vida; la manifestación observable de la personalidad."],
 ["Conducta vs. comportamiento","Conducta: patrones estables. Comportamiento: actuación en un espacio y tiempo concretos."],
 ["Estímulo externo vs. interno","Externo: viene del entorno (un insulto). Interno: del propio organismo (el hambre)."],
 ["Estímulo fisiológico vs. psicológico","Fisiológico: afecta al cuerpo (sueño, dolor). Psicológico: afecta a la mente (publicidad, pensamientos)."],
 ["3 componentes de la conducta","Conductual (motor, observable), fisiológico (respuesta interna) y cognitivo (pensamiento)."],
 ["Conductas según la elaboración","Estereotipadas o innatas, aprendidas y complejas."],
 ["Conducta asertiva","Expresar lo que se piensa y defender los propios derechos respetando los de los demás."],
 ["Conducta pasiva o inhibida","Sumisión: antepone los derechos e intereses de los demás a los propios y evita conflictos."],
 ["Técnica de modificación de conducta","Estrategia para transformar los patrones de comportamiento habitual y conseguir una conducta adecuada."],
 ["Pasos para modificar una conducta","Identificar la conducta objetivo, fijar objetivos, aplicar la técnica y hacer seguimiento."],
 ["Refuerzo positivo","Dar una consecuencia agradable tras la conducta deseada."],
 ["4 tipos de refuerzo positivo","Sociales, materiales, basados en actividades y canjeables."],
 ["Saciación","Saturación por exceso de refuerzo; el refuerzo deja de motivar."],
 ["Refuerzo continuo vs. intermitente","Continuo: cada vez (solo al principio). Intermitente: solo algunas veces (más eficaz después)."],
 ["¿Cuándo aplicar el refuerzo?","Inmediatamente después de la conducta; nunca antes."],
 ["Refuerzo negativo","Retirar algo desagradable cuando la persona realiza la conducta deseada."],
 ["Refuerzo negativo por escape vs. por evitación","Escape: quitar lo desagradable que ya está. Evitación: la conducta impide que aparezca."],
 ["Control de estímulos","Preparar el medio con estímulos discriminativos y reforzar la conducta solo en su presencia. Actúa sobre los antecedentes."],
 ["3 técnicas para adquirir conductas nuevas","Modelado, moldeado y encadenamiento."],
 ["Modelado","Aprender observando a un modelo que muestra la conducta adecuada."],
 ["¿Qué hace más eficaz al modelo?","Que se parezca a la persona (edad, sexo, situación) y que sea importante para ella."],
 ["Modelado de afrontamiento","El modelo empieza con habilidades parecidas a las del observador y va mostrando cómo resolver la situación."],
 ["Instigadores","Estímulos previos que ayudan a iniciar la respuesta (instrucciones, gestos, imágenes)."],
 ["Moldeado","Reforzar selectivamente las aproximaciones sucesivas a la conducta deseada."],
 ["Guía física","Inducir manualmente los movimientos que se quieren desarrollar (habilidades motoras)."],
 ["Encadenamiento","Descomponer una conducta compleja en conductas sencillas y unirlas en orden."],
 ["Coste de respuesta o castigo negativo","Retirar algo agradable tras una conducta no deseada."],
 ["Castigo positivo","Aplicar una consecuencia aversiva justo después de la conducta no deseada; solo en casos graves."],
 ["3 inconvenientes del castigo positivo","No educa, crea aversión hacia quien lo aplica y produce habituación."],
 ["Extinción","Ignorar la conducta indeseada para que desaparezca; siempre y de forma continua."],
 ["Tiempo fuera","Retirar a la persona de una actividad o un lugar agradable ante una conducta inapropiada; debe ser breve."],
 ["Disciplina positiva","Normas basadas en el entendimiento mutuo, la empatía y el acuerdo, con acompañamiento emocional."],
 ["Rincón de la calma","Espacio cómodo donde persona y profesional hablan de lo ocurrido y buscan alternativas."],
 ["Refuerzo de conductas incompatibles","Premiar las conductas incompatibles con la que se quiere eliminar."],
 ["Sobrecorrección","Restitución (arreglar el daño) + práctica positiva (repetir la conducta correcta)."],
 ["Economía de fichas","Sistema de fichas canjeables por recompensas; combina refuerzo positivo y castigo negativo."],
 ["Desvanecimiento de las fichas","Espaciar la entrega, dar menos fichas, pedir más puntos y sustituirlas por refuerzo social."],
 ["Contrato de conducta","Acuerdo escrito y negociado sobre lo que la persona hará y las consecuencias de cumplir o no."],
 ["4 contenidos del contrato de conducta","Conductas, consecuencias, criterios de valoración y duración."]
],
quiz:[
 ["El hambre que te empuja a buscar comida es un estímulo…",["Interno y fisiológico","Externo y psicológico","Externo y fisiológico","Interno y psicológico"],"Viene del propio organismo y afecta a las funciones físicas."],
 ["Sudar y tener el corazón acelerado ante una discusión es el componente…",["Fisiológico","Cognitivo","Conductual","Asertivo"],"Son reacciones internas del organismo: componente fisiológico."],
 ["Decir lo que piensas defendiendo tus derechos y respetando los de los demás es una conducta…",["Asertiva","Pasiva","Agresiva","Estereotipada"],"La asertividad se basa en el respeto propio y ajeno."],
 ["Bostezar cuando aparece la fatiga es una conducta…",["Estereotipada o innata","Aprendida","Compleja","Asertiva"],"Es un acto reflejo que no necesita aprendizaje."],
 ["¿Cuál es un riesgo de mantener siempre el refuerzo continuo?",["La saciación y que la conducta desaparezca al quitarlo","Que la persona aprenda demasiado rápido","Que el refuerzo sea más potente","Ninguno, siempre es lo mejor"],"Por eso solo se usa al principio y luego se pasa a intermitente."],
 ["Una niña se come la verdura para que la dejen ver la tele, ya que así se libra del plato. ¿Qué técnica es?",["Refuerzo negativo por escape","Castigo positivo","Extinción","Tiempo fuera"],"Desaparece lo desagradable al hacer la conducta: refuerzo negativo por escape."],
 ["¿Qué técnica actúa sobre los antecedentes de la conducta y no sobre sus consecuencias?",["Control de estímulos","Refuerzo positivo","Sobrecorrección","Coste de respuesta"],"Prepara el medio con estímulos discriminativos."],
 ["Reforzar las aproximaciones sucesivas hasta llegar a la conducta deseada es…",["Moldeado","Modelado","Encadenamiento","Extinción"],"El moldeado refuerza cada paso cada vez más cercano a la meta."],
 ["Enseñar a cepillarse los dientes dividiéndolo en pasos y uniéndolos en orden es…",["Encadenamiento","Moldeado","Modelado encubierto","Saciación"],"El encadenamiento descompone una conducta compleja en pasos simples."],
 ["En el modelado, ¿qué mejora la eficacia del modelo?",["Que se parezca a la persona y sea importante para ella","Que sea famoso","Que sea muy distinto a la persona","Que no explique nada"],"La semejanza y la importancia del modelo aumentan su eficacia."],
 ["Ignorar sistemáticamente una conducta para que desaparezca es…",["Extinción","Castigo positivo","Refuerzo negativo","Contrato de conducta"],"La extinción retira la atención que mantenía la conducta."],
 ["¿Cómo debe aplicarse la extinción?",["Siempre y de forma continua","De forma intermitente","Solo los fines de semana","Solo con refuerzo material"],"Si se aplica de forma intermitente, la conducta se mantiene."],
 ["Quitarle a alguien una actividad que le gusta por portarse mal es…",["Coste de respuesta o castigo negativo","Refuerzo negativo","Castigo positivo","Refuerzo positivo"],"Se retira algo agradable tras la conducta no deseada."],
 ["Tira la bandeja, luego la recoge, limpia y vuelve a cogerla bien. ¿Qué técnica es?",["Sobrecorrección","Extinción","Saciación","Control de estímulos"],"Restitución más práctica positiva: sobrecorrección."],
 ["Premiar que un alumno esté en silencio para que deje de gritar es…",["Refuerzo de conductas incompatibles","Castigo positivo","Tiempo fuera","Modelado"],"Gritar y estar en silencio son incompatibles."],
 ["¿Qué técnica combina fichas canjeables con refuerzo positivo y castigo negativo?",["Economía de fichas","Encadenamiento","Moldeado","Guía física"],"Se ganan fichas con las conductas deseadas y se pierden con las indeseadas."],
 ["¿Qué debe incluir siempre un contrato de conducta?",["Conductas, consecuencias, criterios de valoración y duración","Solo los castigos","Solo la firma del profesional","Un diagnóstico médico"],"Son sus cuatro contenidos imprescindibles."]
]
});

U("promocion", {
n:5, title:"Intervención en actividades de la vida diaria",
secs:[
 ["5.1. Las actividades de la vida diaria","Las AVD son los actos cotidianos que permiten a una persona desenvolverse en su día a día. Su capacidad para realizarlas determina su grado de independencia, imprescindible para la autonomía. Trabajarlas aporta equilibrio emocional (sentirse útil), seguridad en uno mismo, más autonomía y motivación, y participación activa.",
  ["AVD básicas (AVDB): autocuidado elemental: comer, vestirse, asearse, controlar esfínteres, desplazarse.","AVD instrumentales (AVDI): adaptarse al medio: leer y escribir, tomar la medicación, manejar dinero, transporte público, cocinar, teléfono.","AVD avanzadas (AVDA): estilo de vida y valores: ocio y tiempo libre, participación social, actividades laborales (remuneradas) y educativas.","La independencia se pierde primero en las AVDI fuera de casa, luego en las del hogar y al final en las AVDB.","La CIF (Doc. 5.1) también las clasifica por ámbito: aprendizaje y conocimiento, tareas y demandas generales, comunicación, movilidad, autocuidado, vida doméstica, relaciones interpersonales, áreas principales de la vida (educación, trabajo, economía) y vida comunitaria y cívica."]],
 ["5.1.2. La terapia ocupacional","Es la disciplina sociosanitaria que promueve la salud y el bienestar mediante el uso terapéutico de actividades de cuidado, laborales y lúdicas. Su objetivo es que la persona haga las AVD de la forma más independiente posible, modificando el entorno o usando productos de apoyo. Trabaja en geriatría, pediatría, salud mental, neurología, inserción laboral, etc.",
  ["Valorar la capacidad funcional: limitaciones, pero también capacidades y potencialidades.","Diseñar y aplicar programas de entrenamiento en AVD (valoración, planificación, ejecución y evaluación).","Mejorar la funcionalidad: evitar el deterioro, restaurar o reeducar habilidades aprovechando las capacidades que conserva.","Asesorar y entrenar en productos de apoyo y ortoprotésicos.","Crear entornos favorables (reestructuración ambiental, eliminar barreras).","Orientar a usuarios, familias y otros profesionales, como los técnicos en atención a personas en situación de dependencia (TAPSD)."]],
 ["5.2. Valoración de las habilidades de la vida diaria","Consiste en evaluar en qué grado una persona realiza cada AVD, si necesita ayuda de otra persona y en qué medida. Tiene dos procesos: la recogida de información (funcionalidad, características personales, circunstancias familiares y entorno físico y social) y el diagnóstico de la funcionalidad.",
  ["Técnicas: recopilación documental y entrevistas (información general), observación directa (desempeño funcional) y escalas de valoración funcional (nivel de competencia).","La elección depende de la familiaridad del profesional con el instrumento, la fiabilidad de los datos y la profundidad de la evaluación que se busca.","Expediente personal: informes, exploraciones e historial.","Entrevistas con la persona y su familia, preparadas con un guion (descanso, higiene, alimentación…); pueden incluir cuestionarios de autoevaluación.","Observación directa: atender al desempeño en una situación habitual sin interferir ni alterar el ambiente; se registra en una pauta de observación, mejor acompañada de registros descriptivos.","Todo instrumento se aplica con destreza, empatía y respeto, y no sustituye el juicio profesional."]],
 ["Escalas de valoración funcional","Herramientas estandarizadas que evalúan y registran objetivamente la competencia en las AVD. Las puede aplicar cualquier profesional con formación y familiaridad con ellas.",
