U("metodologia", {
n:2, title:"Investigación social: necesidades y diagnóstico",
secs:[
 ["2.1. La investigación social","El proyecto debe responder a necesidades identificadas mediante investigación. La investigación social es la aplicación de un conjunto de técnicas, estrategias y recursos para estudiar la realidad social. Sus conclusiones permiten el diagnóstico social, base del proyecto. Se orienta a tres análisis:",
  ["Análisis de las necesidades: características, demandas, necesidades e intereses de la población.","Análisis del contexto: medio físico (localización, accesos, medio ambiente) y humano y social (nivel socioeconómico, minorías, estructura de la población, familias, integración).","Análisis de los recursos: qué hay y qué haría falta (valora la viabilidad)."]],
 ["2.1.2. Un método científico","El método científico es un procedimiento en fases que se siguen de forma sistemática para obtener información válida, objetiva y fiable. Exige elegir las fuentes y aplicar las técnicas adecuadas.",
  ["Fiabilidad: otra persona que estudiase lo mismo con la misma técnica obtendría resultados similares.","Validez: los datos se ajustan a la realidad. Interna (concordancia entre la realidad investigada y los resultados) y externa (se pueden generalizar a poblaciones similares).","Fuentes secundarias (de segunda mano): ya elaboradas; se consultan primero porque son las más fáciles y baratas. Internas (de la propia organización) o externas (publicaciones, estadísticas).","Fuentes primarias (de primera mano): información nueva generada para la investigación; se usan cuando las secundarias no bastan.","Métodos interrogativos: técnicas cuantitativas (miden y cuantifican; la reina es la encuesta) y cualitativas (buscan el sentido y significado, valoran la subjetividad: entrevista, técnicas de grupo, historias de vida).","Métodos observacionales: la observación.","Investigación-acción: la comunidad investiga su propia realidad para transformarla; espiral de 4 fases: diagnóstico, plan de acción, actuación y reflexión."]],
 ["2.2. La recopilación documental","Obtener información de hechos o realidades ya recogidos en documentos (fuentes secundarias). Tipos de documentos: escritos, estadísticos o numéricos, audiovisuales y multimedia, y documentos objeto (restos, obras artísticas).",
  ["Fases: localizar y acceder a la información, y analizar la documentación (extraer lo relevante y archivarlo en fichas).","Con las TIC: definir la necesidad, seleccionar documentos y extraer información. Acceso restringido (de pago, más elaborado) o libre.","Portales: webs temáticas con recursos (Discapnet, Eduso, portal de violencia de género…).","Buscadores y operadores booleanos: AND (ambos términos), OR (cualquiera), NOT (uno sí y otro no), comillas (frase exacta), filetype (formato) y alertas.","Buscadores especializados (libros, académicos, noticias) y tesauros (vocabularios ordenados, como el de la UNESCO).","RSS (Really Simple Syndication): recibir automáticamente las novedades de las webs que te interesan en un lector.","Limitaciones: sesgo informativo e inadecuación de la información. Ventajas: accesibilidad y bajo coste."]],
 ["2.3. La encuesta","Técnica de recogida de información estandarizada, mediante un cuestionario, sobre un grupo de personas. Se pregunta a una muestra representativa y los resultados se extrapolan a la población. El cuestionario es un listado de preguntas estructuradas, con respuestas limitadas, que se aplica con la máxima neutralidad. Cuatro fases: elaboración del cuestionario, determinación de la muestra, administración y análisis e interpretación.",
  ["Según su finalidad: descriptiva (cómo se distribuye una realidad) o explicativa (por qué ocurre).","Según su contenido: hechos, opiniones, o actitudes, motivaciones y sentimientos.","Preguntas abiertas: responde con sus palabras; más ricas pero difíciles de codificar; útiles en estudios exploratorios.","Preguntas cerradas: dicotómicas (sí/no; deben formularse de forma equilibrada: «¿a favor o en contra…?») o de elección múltiple (frecuencia, grado o varias opciones).","Según su función: de introducción o contacto, sustantivas (lo básico investigado), filtro (descartan a quien no afecta la siguiente), de cambio de tema, de control (verifican respuestas), de distensión (relajan), colchón o amortiguadoras (suavizan temas difíciles) y en batería (varias sobre un tema, a veces en embudo)."]],
 ["Escalas de actitud","Ofrecen respuestas graduadas:",
  ["Escalas de estimación (de ordenación): de puntos, combinaciones binarias y clasificaciones directas (ordenar de mayor a menor).","Escalas de apreciación (de intensidad): de «muy adecuado» a «muy inadecuado».","Escalas de distancia social: preguntas indirectas sobre la cercanía aceptada hacia un grupo (turista → vecino → familiar).","Diferencial semántico: situarse entre pares de adjetivos opuestos (gratificante‑desolador).","Orden del cuestionario: empezar con preguntas fáciles, lo sustantivo en el segundo tercio, transiciones, distensión y cierre cordial; datos personales al final.","Pretest: prueba piloto con un grupo pequeño para detectar preguntas confusas antes de aplicarlo.","Reglas: pocas, sencillas, sin prejuicios, sin negaciones ni palabras valorativas (demasiado, bueno…), concretas y sin preguntar «¿por qué?»."]],
 ["Muestra, aplicación y análisis","Fases II‑IV de la encuesta:",
  ["Tamaño muestral: cuántas personas hacen falta para que sea representativa (cálculos estadísticos).","Procedimiento muestral: criterios para elegir a las personas y evitar una muestra sesgada (p. ej., no solo mujeres de Sevilla de 70 años).","Administración (trabajo de campo): presencial (la más efectiva), telefónica, por correo o digital. El encuestador debe formular bien, ser neutral y registrar con cuidado.","Tabulación: pasar las respuestas a una tabla (filas = cuestionarios, columnas = preguntas).","Comprobación de la consistencia: anular cuestionarios incoherentes (con ayuda de las preguntas de control).","Análisis de datos: frecuencias, porcentajes, tendencias… e informe."]],
 ["2.4. La entrevista","Técnica de recogida de información a partir del intercambio verbal entre dos o más personas. Es la que da la información más precisa sobre las personas. Es bidireccional; puede ser individual o colectiva y también se usa para apoyo o seguimiento. A diferencia de la encuesta, las preguntas son abiertas.",
  ["Estructurada secuenciada: preguntas planificadas en el mismo orden para todos, máxima neutralidad.","Estructurada no secuenciada: se puede alterar el orden; más natural.","No estructurada (abierta): flexible, basada en un guion de informaciones clave; muy rica pero exige experiencia, control y un clima fluido.","Fase 1, preparación: organizativa (avisar, explicar objetivos, garantizar anonimato y pedir consentimiento; fecha y lugar; documentarse) y del contenido (guion o preguntas).","Fase 2, ejecución: ambiente agradable y privado, rapport (clima de confianza inicial), conducir según el guion, no es un interrogatorio, y grabar las respuestas.","Fase 3, cierre: cuando acaba el tiempo, se obtiene toda la información o ya no se puede obtener más; síntesis, agradecimiento y puerta abierta."]],
 ["2.5. Las técnicas de grupo","Entrevistas colectivas en las que la información surge de la conversación entre varias personas dirigidas por un moderador, que debe crear buen clima, gestionar la reunión, centrar los temas clave y moderar las intervenciones.",
  ["Grupo de discusión: 6‑10 personas que no se conocen pero comparten características; unos 60 minutos; se graba; mucha información cualitativa y exploratoria. Útil para ideas creativas, temas delicados o representaciones sociales (J. Callejo).","Grupo focalizado: preguntas más específicas y centradas en el tema; moderador más directivo.","Técnica Delphi: personas expertas opinan de forma anónima en varias rondas hasta el consenso. Fases: definir el problema, seleccionar informantes, consultas sucesivas y análisis. Es la más estructurada.","Lluvia de ideas (se ve en la UD5)."]],
 ["2.6. Las historias de vida","Narraciones biográficas en las que una persona relata su vida tal como la recuerda. Es una entrevista en profundidad que conoce un grupo humano mediante un testimonio vivo (muy útil con inmigrantes o exclusión).",
  ["Es un relato autobiográfico y subjetivo (justo lo que interesa).","Se obtiene por mediación del investigador, con preguntas exploratorias.","Se hace en entrevistas sucesivas hasta el punto de saturación (cuando ya no aporta nada nuevo).","Preparación previa: criterios para elegir informantes, objetivos y guion."]],
 ["2.7. La observación","Técnica de recopilación de datos y captación de la realidad sociocultural de una comunidad o grupo. Permite registrar la vida cotidiana y los procesos tal como ocurren. Actitudes del observador: perceptivo, respetuoso y objetivo.",
  ["Según la sistematización: estructurada (objetivos e instrumentos definidos de antemano) o no estructurada (libre, sin categorías; útil para plantear hipótesis).","Según el número de observadores: individual (más subjetiva) o colectiva.","Según la participación: participante (natural, si ya pertenece al grupo, o artificial, si se integra para observar) o no participante o externa.","Según el lugar: de la vida real o experimental (de laboratorio, p. ej., un role playing)."]],
 ["2.7.2. Registros y proceso de observación","Los datos se anotan en registros:",
  ["Cerrados o categoriales: listas de comprobación (presencia o ausencia de una conducta) y escalas de estimación (de grado, de frecuencia o descriptivas).","Abiertos descriptivos: el anecdotario (anotar lo que se ve u oye sin interpretar).","Abiertos narrativos: notas de campo (incluyen impresiones personales; subjetivas, muy útiles en observación participante) y diarios (en primera persona, totalmente subjetivos).","Tecnológicos: audio, vídeo o fotografía.","Proceso: análisis previo, definir el objeto, concretar la metodología, elaborar registros, observar y analizar.","Errores: sesgo por expectativas previas, generalización a partir de un rasgo (efecto halo) y estado de ánimo del observador."]],
 ["2.8. El informe de investigación","Documento formal que recoge de forma organizada los resultados de la investigación y el diagnóstico social. Sobre él se construye todo el proyecto.",
  ["Bloque introductorio: justificación, objetivos, diseño, técnicas e instrumentos.","Resultados: análisis e interpretación, con tablas y gráficos.","Conclusiones: por temas y por importancia; diagnóstico y recomendaciones.","Anexos: bibliografía y documentación generada."]],
 ["2.9. Ética y género en la investigación","La intervención nunca es neutra. La ética busca el equilibrio entre respetar los derechos de las personas y cumplir la metodología científica.",
  ["Principios éticos: derechos humanos y autonomía, privacidad (la persona y su imagen) y confidencialidad (los datos y su uso), consentimiento explícito e informado, prever el impacto, relaciones horizontales, honestidad, prudencia con las técnicas y fundamentación científica.","Tres reglas de oro: informar de todo, libertad para participar o abandonar, y anonimato y secreto de las respuestas.","Sesgos de género: androcentrismo, sobregeneralización (generalizar resultados obtenidos solo con hombres), insensibilidad de género (ignorar la variable género), doble rasero, naturalización, dicotomía sexual y familismo (tomar la familia como unidad e ignorar sus desigualdades internas).","Medidas: análisis de género sistemático, datos desagregados, indicadores de desigualdad, identificar barreras y lenguaje no sexista."]],
 ["Herramientas: espina de pescado y Pareto","Dos herramientas para analizar necesidades:",
  ["Diagrama de espina de pescado (causa‑efecto o de Ishikawa): representa gráficamente las causas de un problema. Pasos: definir el efecto o problema (la cabeza), identificar causas principales (espinas) y causas secundarias.","Diagrama de Pareto (curva 80‑20): cuantifica los problemas según el principio de Pareto: el 20 % de las causas genera el 80 % de los efectos. Sirve para priorizar en qué causas actuar."]]
],
trucos:["Fiabilidad = «otra persona obtendría lo mismo»; Validez = «lo que mido se parece a la realidad».","DELPHI = expertos en la sombra: Expertos + Anónimos + Rondas hasta el Consenso (como el oráculo de Delfos).","Registros de observación, de menos a más subjetivo: LISTA → ESCALA → ANECDOTARIO (sin interpretar) → NOTAS DE CAMPO (con impresiones) → DIARIO (yo, yo, yo).","Pareto 80‑20: el 20 % de tus despistes causa el 80 % de tus suspensos."],
cards:[
 ["Investigación social","Aplicación de técnicas, estrategias y recursos para estudiar la realidad social."],
 ["Método científico","Procedimiento en fases sistemáticas para obtener información válida, objetiva y fiable."],
 ["Fiabilidad","Otra persona con la misma técnica obtendría resultados similares."],
 ["Validez externa","Los resultados se pueden generalizar a otras poblaciones similares."],
 ["Fuentes secundarias","Información ya elaborada; se consultan primero por ser más fáciles y baratas."],
 ["Fuentes primarias","Información nueva generada específicamente para la investigación."],
 ["Técnicas cualitativas","Buscan el sentido de las acciones sociales; valoran la subjetividad (entrevista, grupos, historias de vida)."],
 ["Investigación-acción","La comunidad investiga su propia realidad para transformarla, en una espiral de 4 fases."],
 ["Recopilación documental","Obtener información de hechos ya recogidos en documentos (fuentes secundarias)."],
 ["Operador AND","Busca documentos que contengan ambos términos."],
 ["RSS","Sistema para recibir automáticamente las novedades de las webs elegidas en un lector."],
 ["Encuesta","Recogida estandarizada de información mediante un cuestionario a una muestra representativa."],
 ["Cuestionario","Listado de preguntas estructuradas con respuestas limitadas, aplicado con neutralidad."],
 ["Encuesta explicativa","Busca las causas de un fenómeno (la descriptiva describe su distribución)."],
 ["Pregunta filtro","Se hace antes de otra para descartar a quien no le afecta la siguiente."],
 ["Pregunta de control","Repite o reformula una pregunta para verificar la validez de las respuestas."],
 ["Pregunta colchón","Se formula para suavizar la brusquedad de un tema difícil."],
 ["Escala de distancia social","Mide la cercanía que una persona acepta respecto a un grupo (minoría, nacionalidad…)."],
 ["Diferencial semántico","Escala con pares de adjetivos opuestos entre los que la persona se sitúa."],
 ["Pretest","Prueba piloto del cuestionario con un grupo pequeño para detectar errores."],
 ["Procedimiento muestral","Criterios para elegir a las personas de la muestra y evitar que esté sesgada."],
 ["Tabulación","Trasladar las respuestas a una tabla: filas = cuestionarios, columnas = preguntas."],
 ["Entrevista","Recogida de información mediante intercambio verbal entre dos o más personas."],
 ["Entrevista secuenciada","La más estructurada: mismas preguntas y mismo orden para todos."],
 ["Rapport","Relación inicial de confianza, credibilidad e interés con la persona entrevistada."],
 ["Grupo de discusión","6‑10 personas desconocidas con rasgos comunes debaten un tema; muy exploratorio."],
 ["Grupo focalizado","Grupo con preguntas más específicas y moderador más directivo."],
 ["Técnica Delphi","Expertos opinan de forma anónima en rondas sucesivas hasta llegar al consenso."],
 ["Historia de vida","Narración biográfica en entrevistas sucesivas; relato subjetivo de la propia vida."],
 ["Punto de saturación","Momento en que la información se repite y ya no aporta nada nuevo."],
 ["Observación participante","El observador participa en la situación (de forma natural o artificial)."],
 ["Observación experimental","Se prepara el entorno para observar el hecho (p. ej., role playing)."],
 ["Lista de comprobación","Registro que anota solo la presencia o ausencia de una conducta."],
 ["Anecdotario","Registro descriptivo: anotar lo que se ve o se oye sin interpretar."],
 ["Notas de campo","Registro narrativo que incluye impresiones personales; subjetivo."],
 ["Informe de investigación","Documento formal con los resultados y el diagnóstico; base del proyecto."],
 ["Privacidad vs. confidencialidad","Privacidad: la persona y su imagen. Confidencialidad: sus datos y el uso que se hace de ellos."],
 ["Sobregeneralización","Sesgo de universalizar resultados obtenidos solo con hombres."],
 ["Familismo","Sesgo de tomar la familia como unidad de análisis ignorando sus desigualdades internas."],
 ["Diagrama de espina de pescado","Diagrama causa‑efecto que representa las causas de un problema."],
 ["Diagrama de Pareto","Curva 80‑20: el 20 % de las causas provoca el 80 % de los efectos."]
],
quiz:[
 ["¿Qué fuentes se consultan primero en una investigación?",["Las secundarias","Las primarias","Las orales","Ninguna en concreto"],"Son las más fáciles de obtener y las más baratas."],
 ["La técnica cuantitativa por excelencia es…",["La encuesta","La historia de vida","El grupo de discusión","El diario"],"Es estandarizada y permite cuantificar."],
 ["Que otra persona obtenga los mismos resultados aplicando la misma técnica indica…",["Fiabilidad","Validez externa","Sesgo","Saturación"],"La validez, en cambio, es que los datos se ajusten a la realidad."],
 ["Para encontrar documentos con «enfermedad» pero sin «discapacidad» usamos…",["NOT","AND","OR","filetype"],"AND exige ambos y OR cualquiera de los dos."],
 ["«¿Has participado en un taller de teatro? Si la respuesta es sí…» es una pregunta…",["Filtro","De control","Colchón","De distensión"],"Separa a quienes deben responder la siguiente pregunta."],
 ["«¿Está a favor del uso del móvil en clase?» es una pregunta dicotómica…",["Desequilibrada: solo plantea una alternativa","Perfectamente equilibrada","Abierta","De batería"],"Lo correcto: «¿Está a favor o en contra…?»."],
 ["¿Cuándo es mejor pedir los datos personales en un cuestionario?",["Al final","Al principio","En medio","Nunca"],"Al principio pueden sentirse como una intromisión."],
 ["Probar un cuestionario con un grupo pequeño antes de aplicarlo se llama…",["Pretest","Tabulación","Muestra","Rapport"],"Detecta preguntas confusas, secuencias poco lógicas, etc."],
 ["El clima de confianza que se crea al inicio de una entrevista es el…",["Rapport","Pretest","Caucus","Feedback"],"La empatía es clave para lograrlo."],
 ["¿Cuántas personas suele tener un grupo de discusión?",["Entre 6 y 10","Entre 2 y 3","Más de 50","Solo una"],"Deben tener características comunes y no conocerse."],
 ["De estas técnicas de grupo, ¿cuál es la más estructurada?",["Técnica Delphi","Grupo de discusión","Lluvia de ideas","Grupo focalizado"],"El libro las ordena: discusión < focalizado < Delphi."],
 ["En una historia de vida se dejan de hacer sesiones cuando se alcanza…",["El punto de saturación","El rapport","El pretest","La validez interna"],"La información empieza a ser repetitiva."],
 ["Una integradora se une durante meses a un grupo que no es el suyo para observarlo. Es observación participante…",["Artificial","Natural","No participante","De laboratorio"],"Natural sería si ya formara parte del grupo."],
 ["El registro que anota lo observado SIN interpretar es…",["El anecdotario","Las notas de campo","El diario","La escala descriptiva subjetiva"],"Las notas de campo y el diario incluyen impresiones."],
 ["Generalizar a todo el mundo resultados de un estudio hecho solo con hombres es el sesgo de…",["Sobregeneralización","Familismo","Doble rasero","Dicotomía sexual"],"Invisibiliza la experiencia de las mujeres."],
 ["Según Pareto, ¿qué porcentaje de las causas provoca el 80 % de los efectos?",["20 %","50 %","80 %","10 %"],"Por eso se llama curva 80‑20."]
]
});

U("metodologia", {
n:3, title:"Diseño y ejecución de proyectos",
secs:[
 ["3.1. El proyecto de intervención social","Formalmente, el proyecto es un documento que expone toda la información de las actuaciones propuestas para atender una situación o problema social, desde el análisis de la realidad hasta las actividades y tareas. Se articula en: definición (según las necesidades detectadas), planificación (objetivos y actuaciones) y diseño de actividades; después, implementación y evaluación. Puede dirigirse a colectivos vulnerables o a la dinamización social, cultural o del ocio.",[]],
 ["3.2.1. La identificación del proyecto","Todo proyecto empieza identificándose con una denominación y una presentación.",
  ["Denominación (título): referencia clara al objeto, sin tecnicismos, ni muy concreta ni muy amplia, atractiva y que mencione la entidad. Bien: «Proyecto de mediación entre iguales en el Centro Abierto Las Eras». Mal: «Proyecto de mejora formativa de la población».","Presentación: resumen muy breve de lo esencial (a quién se dirige, qué se quiere hacer, dónde) con los datos y el logotipo de la entidad."]],
 ["3.2.2. El diagnóstico social","Concreta las características, necesidades y problemas de la población que el proyecto debe abordar. Objetiva las necesidades, permite fijar prioridades y delimita el problema. Un diagnóstico impreciso o inexistente hace fracasar el proyecto.",
  ["Criterio de prioridad 1, intensidad de la demanda: amplitud (cuántas personas), grado de insatisfacción y urgencia.","Criterio 2, utilidad de la demanda: beneficios sociales, sobre todo para los más vulnerables.","Criterio 3, viabilidad: posibilidad de éxito con los recursos; equilibrio entre presupuesto y beneficios esperados; posibilidad de participación de los agentes.","Delimitación del proyecto: problemática (¿qué?), público destinatario (¿a quién?, cuántos), delimitación espaciotemporal (¿dónde y cuándo?) y propuesta metodológica (¿cómo?). Hay que dimensionarlo bien: no plantear proyectos demasiado ambiciosos.","Justificación: fundamentación en el marco de referencia legal (normativa), programático (plan o programa del que deriva) y teórico (modelos en que se inspira); argumentación; y resultados esperados."]],
 ["3.3. La planificación del proyecto","Plantea objetivos y diseña actuaciones. Responde a cuatro preguntas: ¿qué? (objetivos), ¿cómo? (actuaciones y metodología), ¿cuándo? (temporalización) y ¿con qué? (recursos). Aporta racionalidad y evita actuar de forma instintiva.",[]],
 ["3.3.1. Los objetivos","Concretan las metas del proyecto; de ellos se derivan actividades, recursos y evaluación. Estructura: infinitivo + objeto directo + complementos (cantidad, lugar, tiempo). Deben ser claros, factibles y pertinentes; de lo abstracto a lo concreto y de lo general a lo particular.",
  ["Objetivos generales: intenciones del proyecto con bajo nivel de concreción; verbos no observables (favorecer, comprender, concienciar, potenciar, contribuir…). Pocos.","Objetivos específicos: concretan los generales en propósitos observables y medibles; una sola interpretación; traducibles en indicadores; verbos de acción (aumentar, organizar, realizar, identificar…).","Una sola acción por objetivo. Mal: «Dar a conocer las asociaciones y aumentar la participación» (dos metas).","Evitar expresiones vagas. Mal: «Crear lo antes posible…», «Aumentar considerablemente…».","Bien: «Aumentar en un 15 % el número de socios en un año» (acción, grado y periodo)."]],
 ["3.3.2. La metodología y las actividades","La metodología establece los principios, estrategias y procedimientos para alcanzar los objetivos; en lo social se prefieren metodologías participativas, vivenciales, integradoras, colaborativas, centradas en las personas y poco directivas. Las actividades deben ser coherentes con ella (si es cooperativa, nada de actividades competitivas). Las actividades son el conjunto de actuaciones diseñadas para conseguir los objetivos.",
  ["Tipos de actividades: de sensibilización, de difusión, de formación y orientación, de participación, de cooperación, asistenciales, de organización y gestión, y de evaluación y seguimiento.","Clasificación de Ander-Egg: formación, difusión, artísticas no profesionales, lúdicas y sociales.","Tareas: acciones concretas necesarias para realizar una actividad (contratar personal, buscar el local, elegir películas…)."]],
 ["3.3.3. La temporalización","Ordenación y distribución en el tiempo de las actuaciones, con su duración. Instrumentos:",
  ["Planning: calendario con todas las actividades del proyecto de principio a fin y fechas concretas.","Cronograma: matriz con actividades o tareas en filas y tiempo en columnas; la longitud de las barras indica la duración. Muestra secuencia (orden) y sincronía (actividades simultáneas).","Horario: planificación diaria o semanal (útil en colonias o campamentos)."]],
 ["3.3.4. Los recursos","Todos los medios físicos, humanos y económicos necesarios. Hay que planificarlos y conseguirlos.",
  ["Materiales: espacios (medios naturales, urbanos, locales), instalaciones y equipos, inventariables (se reutilizan: ordenadores, tiendas de campaña) y fungibles (se gastan: papel, pinturas).","Humanos: organigrama, perfil profesional y número de personas, voluntariado (Ley 45/2015 de Voluntariado: actividad solidaria, libre, sin contraprestación y a través de entidades), condiciones de contratación y formación.","Económicos: el presupuesto es un instrumento de planificación basado en un cálculo anticipado de gastos e ingresos en un periodo.","Gastos: personal, espacio, materiales, gastos corrientes e imprevistos (reservar entre el 5 y el 10 %).","Ingresos: subvenciones, patrocinadores, cuotas de usuarios, ventas, aportación de la entidad, ingresos atípicos (rifas) y otros (crowdfunding, teaming).","Saldo: ingresos − gastos. Positivo = superávit; negativo = déficit (hay que buscar financiación)."]],
 ["3.3.5. El diseño de actividades","El diseño o programación de una actividad es el documento que sintetiza toda la información para hacerla operativa. Es el máximo nivel de concreción. Ficha de actividad:",
  ["Denominación o título.","Objetivos operativos (muy específicos).","Público destinatario (número, perfil, agrupaciones).","Desarrollo (pasos y orientaciones).","Temporalización y duración, y distribución de tareas con responsables.","Recursos humanos, materiales y económicos.","Pautas de evaluación: indicadores por objetivo, satisfacción, actuación profesional y diseño.","Adaptación: prever adaptaciones por si participan personas con necesidades funcionales específicas."]],
 ["3.4. La ejecución del proyecto","Consiste en implementar las actividades planificadas en el orden y forma previstos; aquí se materializa todo. Las aptitudes y actitudes del profesional son clave.",
  ["Planificación flexible: adaptar si las circunstancias cambian, hay imprevistos (lluvia), se detectan errores o conviene para los objetivos; mejor tener alternativas previstas que improvisar.","La ejecución nunca es neutra: la implicación social del profesional es un valor. Se prefieren estilos democráticos y asertivos frente a autoritarios o inhibidos.","Sesión: unidad temporal básica de la programación en la que se ejecutan las actuaciones.","Fases de una sesión: preparación (entorno y adaptación psicoemocional), presentación (motivar y explicar), conducción (rol del profesional y habilidades sociales, personales y técnicas), control y seguimiento, y cierre.","Garantizar: entornos seguros (prevención de riesgos), trato igualitario y no discriminación (incluso acción positiva) y relación respetuosa."]],
 ["3.5. Perspectiva de género en los proyectos","El enfoque de género es transversal: en el diagnóstico, el diseño y la ejecución.",
  ["Análisis de género: estrategia para detectar desigualdades entre hombres y mujeres. Incluye datos desagregados por género (brechas), desigualdades y roles, necesidades expresadas por las propias mujeres, causas y elementos para el empoderamiento.","Diversidad: las mujeres son un colectivo diverso; cruzar con edad, ingresos, origen, salud… y visibilizar a las más vulnerables (víctimas de violencia, mayores, con discapacidad, inmigrantes…).","Diseño: lenguaje no sexista, objetivos contra estereotipos y desigualdades, medidas de empoderamiento y acción positiva, metodologías participativas, horarios que faciliten la conciliación y mecanismos de seguimiento.","Ejecución con compromiso: lenguaje no sexista, igualdad de condiciones, no asignar roles de género (incluso invertirlos para generar empatía). Sin compromiso: formar y sensibilizar al personal."]],
 ["Herramientas para diseñar y ejecutar","Cuatro herramientas de decisión:",
  ["Diagrama de árbol o matricial: visión de conjunto de los medios necesarios para llegar a una meta; categoriza y jerarquiza.","Diagrama de decisiones de acción: objetivo → estrategias → pasos → posibles problemas → contramedidas valoradas (X inadecuada, O adecuada). Es proactivo: anticipa problemas.","Diagrama de Gantt (Henry Gantt, principios del s. XX): barras de actividades en el tiempo; sirve también para el seguimiento (colorear barras o barra prevista vs. real).","PERT (técnica de valoración y revisión de programas): nodos (situaciones) y flechas (actuaciones) para optimizar el tiempo. Pasos: ordenar actuaciones, tiempos, ruta crítica (la más larga, que marca la duración total) y optimizar."]]
],
trucos:["Las 4 preguntas de la planificación = «QUÉ‑CÓMO‑CUÁNDO‑CON QUÉ»: objetivos, metodología, temporalización, recursos.","Objetivo bien escrito = VERBO + QUÉ + CUÁNTO + CUÁNDO: «Aumentar (verbo) los socios (qué) un 15 % (cuánto) en un año (cuándo)».","Prioridades del diagnóstico = I‑U‑V: Intensidad (¿a cuántos y cuánto molesta?), Utilidad (¿a quién beneficia?), Viabilidad (¿se puede?)."],
cards:[
 ["Proyecto (documento)","Documento con toda la información de las actuaciones para atender una situación o problema social."],
 ["Presentación del proyecto","Resumen muy breve de lo esencial: a quién se dirige, qué se quiere hacer y dónde."],
 ["Diagnóstico social","Concreta las características, necesidades y problemas de la población a abordar."],
 ["Intensidad de la demanda","Criterio de prioridad: amplitud, grado de insatisfacción y urgencia del problema."],
 ["Viabilidad","Posibilidad de éxito con los recursos: equilibrio entre presupuesto y beneficios."],
 ["Delimitación del proyecto","Concreta problemática, destinatarios, lugar y tiempo y propuesta metodológica."],
 ["Justificación","Motivos del proyecto: fundamentación legal, programática y teórica, argumentación y resultados esperados."],
 ["Objetivos generales","Intenciones del proyecto con poca concreción y verbos no observables (favorecer, potenciar)."],
 ["Objetivos específicos","Concretan los generales en propósitos observables, medibles y con una única interpretación."],
 ["Estructura de un objetivo","Infinitivo + objeto directo + complementos (cantidad, lugar, tiempo)."],
 ["Metodología","Principios, estrategias y procedimientos que orientan la intervención hacia los objetivos."],
 ["Actividades","Conjunto de actuaciones diseñadas para conseguir los objetivos."],
 ["Tareas","Acciones concretas necesarias para realizar una actividad."],
 ["Temporalización","Ordenación y distribución en el tiempo de las actuaciones, con su duración."],
 ["Planning","Calendario con todas las actividades del proyecto de principio a fin."],
 ["Cronograma","Matriz con actividades en filas y tiempo en columnas; barras = duración."],
 ["Secuencia y sincronía","Secuencia: orden de las actividades. Sincronía: actividades simultáneas."],
 ["Horario","Representa la planificación diaria o semanal."],
 ["Recursos inventariables","Se pueden usar muchas veces y quedan en la entidad (ordenadores, proyector)."],
 ["Recursos fungibles","Se gastan al usarse (papel, pinturas, cartulinas)."],
 ["Presupuesto","Cálculo anticipado de gastos e ingresos de un periodo concreto."],
 ["Partida de imprevistos","Reserva de entre el 5 y el 10 % del presupuesto para gastos no previstos."],
 ["Superávit / déficit","Superávit: más ingresos que gastos. Déficit: más gastos que ingresos."],
 ["Ley 45/2015","Ley de Voluntariado: actividad solidaria, libre, sin contraprestación y a través de entidades."],
 ["Ficha de actividad","Documento con título, objetivos, destinatarios, desarrollo, tiempos, recursos y evaluación."],
 ["Ejecución del proyecto","Implementación de las actividades planificadas en el orden y forma previstos."],
 ["Sesión","Unidad temporal básica de la programación en la que se ejecutan las actuaciones."],
 ["Análisis de género","Estrategia para detectar desigualdades entre hombres y mujeres (datos desagregados, roles, causas)."],
 ["Diagrama de árbol","Visión de conjunto de los medios necesarios para llegar a una meta."],
 ["Diagrama de decisiones de acción","Herramienta proactiva: prevé problemas en cada paso y valora contramedidas."],
 ["Diagrama de Gantt","Cronograma de barras que representa la secuencia de actividades en el tiempo."],
 ["PERT","Técnica que analiza actuaciones y relaciones para optimizar el tiempo del proyecto."],
 ["Ruta crítica","En el PERT, el recorrido de mayor duración, que determina la duración total del proyecto."]
],
quiz:[
 ["¿Cuál es un título de proyecto INCORRECTO según el libro?",["Proyecto de mejora formativa de la población","Proyecto de mediación entre iguales en el Centro Abierto Las Eras","Proyecto de dinamización cultural de la Asociación Más Futuro","Proyecto de inserción laboral para quien busca su primer empleo"],"Es demasiado amplio y no dice a quién ni dónde."],
 ["El número de personas afectadas por un problema forma parte del criterio de…",["Intensidad de la demanda","Viabilidad","Utilidad","Justificación teórica"],"La intensidad valora amplitud, insatisfacción y urgencia."],
 ["Indicar el plan o programa del que deriva el proyecto es la fundamentación…",["Programática","Legal","Teórica","Económica"],"La legal se refiere a la normativa y la teórica a los modelos."],
 ["¿Cuál de estos objetivos específicos está bien formulado?",["Aumentar en un 15 % el número de socios en un periodo de un año","Crear lo antes posible una asociación","Aumentar considerablemente las actividades","Dar a conocer las asociaciones y aumentar la participación"],"Tiene una sola acción, un grado y un periodo."],
 ["Un verbo típico de objetivo GENERAL es…",["Favorecer","Organizar","Calcular","Aumentar un 20 %"],"Los generales usan verbos no directamente observables."],
 ["Si la metodología es cooperativa, NO sería coherente programar…",["Actividades competitivas","Actividades en grupo","Dinámicas participativas","Trabajo colaborativo"],"Las actividades deben ser coherentes con la metodología."],
 ["En un cronograma, que dos actividades se hagan a la vez se llama…",["Sincronía","Secuencia","Ruta crítica","Saldo"],"La secuencia es el orden en el tiempo."],
 ["Unas tiendas de campaña que la asociación usa cada verano son un recurso…",["Inventariable","Fungible","Humano","Económico"],"Se reutilizan y quedan en la entidad."],
 ["¿Qué porcentaje del presupuesto se suele reservar para imprevistos?",["Entre el 5 y el 10 %","El 50 %","El 1 %","Nada"],"Así se cubren gastos que no se pueden prever."],
 ["Si los gastos superan a los ingresos, el proyecto tiene…",["Déficit","Superávit","Saldo positivo","Ruta crítica"],"Habrá que buscar mecanismos de financiación."],
 ["La unidad temporal básica en la que se ejecutan las actuaciones es…",["La sesión","El planning","El proyecto","La fase"],"Una actividad puede ocupar una o varias sesiones."],
 ["¿Qué estilo de relación se prefiere al ejecutar proyectos sociales?",["Democrático y asertivo","Autoritario","Inhibido","Indiferente"],"Fomentan la implicación y la participación."],
 ["Si una actividad al aire libre coincide con lluvia, el principio que permite cambiarla es…",["La planificación flexible","La neutralidad","La ruta crítica","La sincronía"],"Conviene tener alternativas previstas."],
 ["Planificar horarios que faciliten la asistencia de mujeres con cargas familiares es una medida del…",["Enfoque de género en el diseño","Presupuesto","PERT","Diagrama de árbol"],"Las cuestiones de conciliación limitan su participación."],
 ["En el PERT, la ruta crítica es…",["La de mayor duración, que marca la duración total","La más barata","La más corta","La que tiene más personas"],"A partir de ella se busca optimizar el proceso."],
 ["La herramienta que prevé problemas en cada paso y propone contramedidas es…",["El diagrama de decisiones de acción","El horario","El planning","El presupuesto"],"Es una herramienta proactiva."]
]
});

U("metodologia", {
n:4, title:"La evaluación del proyecto",
secs:[
 ["4.1. Qué es evaluar","La evaluación integra los procedimientos para valorar en qué medida las decisiones y actuaciones están en sintonía con lo previsto en el diseño. No es solo el final: está presente de forma continua desde antes de formular el proyecto hasta después de acabarlo. Sirve para detectar desviaciones, reajustar y decidir sobre el futuro. No debe tomarse como un trámite rutinario.",[]],
 ["4.1.1. Características de la evaluación","Requisitos del método científico y de los proyectos sociales:",
  ["Objetividad: captar la realidad sin ideas preconcebidas.","Validez: los datos reflejan fielmente la realidad.","Fiabilidad: el resultado no varía según quién evalúe ni cuándo.","Oportunidad: elegir el momento adecuado.","Practicidad: obtener resultados útiles; equilibrio entre lo ideal y lo viable.","En proyectos sociales debe ser continua (la final es resultado de las anteriores), sistemática (planificada), flexible (admite ajustes) y participativa (integra a los agentes; más laboriosa pero genera implicación y feedback)."]],
 ["4.1.2. Tipos de evaluación","Según distintos criterios:",
  ["Según quién la hace: autoevaluación (los propios ejecutores), interna (la entidad; conocen bien el proyecto pero hay riesgo de sesgo), externa (personal ajeno; más objetiva), mixta (combina ambas; riesgo de descoordinación) y de las personas usuarias (satisfacción, calidad percibida).","Según el momento: inicial (antes del diseño: pertinencia, necesidades, diagnóstico), formativa o de proceso (durante: detecta desviaciones) y final, de resultado o sumativa (al acabar: objetivos, satisfacción, coste y desviación del presupuesto).","Según la función: para el diagnóstico, para la predicción (prever problemas), para la orientación (feedback y ajustes) y para el control (comparar resultados con objetivos = eficacia).","Según la extensión: parcial (una parte) o global (integral; todo proyecto debería cerrarse con una global).","Según la continuidad: longitudinal (a lo largo del proceso) o puntual o transversal (en un momento concreto).","Según la información: cuantitativa (datos numéricos y estadística: frecuencias, media, dispersión) o cualitativa (motivos, opiniones, efectos no deseados). Se combinan."]],
 ["4.2. Metodología evaluadora","Conjunto de procedimientos que definen cómo recoger y analizar la información; debe ser congruente con la función de la evaluación.",
  ["Técnicas: documentación interna (hojas de registro e incidencias), cuestionarios (de satisfacción, de autoevaluación), entrevistas y observación (clave en la evaluación de proceso).","Instrumentos: registros abiertos (diario, anecdotario) o categoriales (escalas de estimación, listas de control).","Indicadores de evaluación: puntos de referencia o enunciados que permiten medir el grado de aproximación a un objetivo; siempre referidos a los objetivos y, si es posible, verificables y medibles.","Recursos: quién (interna, externa…), cuándo (inicial, continua, final), dónde y con qué (instrumentos, tableta, móvil; con consentimiento para fotos y grabaciones).","Opciones metodológicas: criterio prefijado muy general (exploratoria, evaluación inicial), plan establecido pero abierto (evaluación continua) y plan establecido y estructurado (cuestionarios, escalas; evaluación de resultado).","Análisis: comparación previsto‑obtenido y estadística sencilla con hoja de cálculo; o programas: SPSS, SAS, Minitab (cuantitativos) y ATLAS.ti, AQUAD (cualitativos)."]],
 ["4.3. La evaluación en cada fase del proyecto","Una evaluación integral se organiza por fases:",
  ["Evaluación del diagnóstico: comprobar que se hizo bien, que responde a las necesidades y que es fiable y válido. Es preventiva y se hace antes del diseño (¿técnicas adecuadas?, ¿causas definidas?, ¿viable?).","Evaluación del diseño: valora la idoneidad y eficacia de la planificación. Primer momento preventivo (al acabar de planificar, para asegurar coherencia) y segundo de control (al final, a posteriori). Se revisa cada elemento: objetivos, metodología, actividades, recursos, temporalización y criterios de evaluación.","Evaluación del proceso: evaluación continua durante las actividades para comprobar si todo va según lo previsto; de seguimiento o control. Genera feedback: las desviaciones leves se corrigen en el momento; las demás se anotan para la evaluación final.","Evaluación de los resultados (final): valora si los resultados responden a los objetivos; es global (diseño, profesionales, balance económico) y valora la rentabilidad social (relación coste‑beneficio). Sin ella el proyecto no puede cerrarse."]],
 ["4.4. El informe de evaluación","Documento que recoge la valoración del proceso y de los resultados, con logros y puntos débiles. Objetivos: analizar el cumplimiento de los objetivos y comunicar los resultados. Debe incluir una valoración global del éxito. La memoria es más completa y formal que el informe.",
  ["Partes: portada, resumen, información del proyecto, estudio valorativo (diseño de la evaluación y análisis de datos), resultados, discusión (datos contradictorios, explicaciones alternativas), conclusiones (jerarquizadas) y recomendaciones.","Deben participar en su redacción los profesionales del proyecto.","Comunicación: ideas claras y breves, lenguaje comprensible, gráficos que ayuden, sin divagaciones y con recomendaciones coherentes. Puede presentarse en persona o por vía telemática, con apoyo de presentaciones.","Pautas de Morris y Taylor: conocer a los grupos implicados, no dar información excesiva, empezar por lo más relevante, presentación amena, dejar tiempo para preguntas y ser siempre honesto sin ir más allá de los datos."]],
 ["4.5. Aspectos éticos de la evaluación","El dilema básico: hasta qué punto el valor de la investigación debe prevalecer sobre los derechos de las personas evaluadas.",
  ["Dilemas morales de Ernest R. House: derecho a la información, al bienestar, a la intimidad y privacidad, y a la dignidad y participación.","Allan J. Kimmel: actuar éticamente sin poner en peligro la validez. La relación evaluador‑usuario es asimétrica; propone estilos democráticos y participación activa.","Medidas: libre consentimiento informado, confidencialidad y privacidad, equidad en las relaciones (horizontales) y considerar el impacto y los beneficios.","Si la utilidad social no lo justifica, prevalecen los intereses de protección de las personas (p. ej., la privacidad)."]],
 ["4.6. Evaluación y perspectiva de género","Los indicadores de género permiten valorar el alcance de la aplicación del enfoque de género y su impacto en el avance hacia la igualdad. Se incluyen en todas las fases (transversalidad).",
  ["En el diagnóstico: datos desagregados por sexo, brecha de género, necesidades expresadas por las mujeres, barreras y múltiple vulnerabilidad.","En el diseño: objetivos contra estereotipos, metodología que asegura su participación, acción positiva, horarios de conciliación y seguimiento.","En la ejecución: formación del personal, experta en género, lenguaje no sexista, participación igualitaria y roles sin estereotipos (o invertidos).","Optimizarlos: desagregar por género, combinar cuantitativos y cualitativos e incluir indicadores de empoderamiento y participación.","Evaluar el impacto: ¿se superaron barreras?, ¿aumentó la concienciación?, ¿hubo participación equitativa en decisiones y liderazgo?, ¿se favoreció el empoderamiento? Un proyecto sin perspectiva de género no debería considerarse admisible."]],
 ["4.7. La gestión de la calidad","Conjunto de normas y procedimientos asumidos por toda la organización para mejorar la satisfacción de las necesidades y expectativas de las personas a las que sirve. En lo social: calidad del servicio, de los resultados, de la satisfacción de usuarios y trabajadores y de la gestión de recursos. El modelo más adoptado es el europeo EFQM. La dirección debe impulsar la cultura de la calidad.",
  ["Mapa de procesos: representación gráfica de los procesos de la organización y sus relaciones.","Procesos estratégicos: definen y despliegan la estrategia (recursos humanos, documentación, prevención de riesgos).","Procesos clave: buscan el objetivo fundamental (acogida, estancia, atención familiar); los que más influyen en la opinión de usuarios.","Procesos de apoyo: dan soporte (administración, mantenimiento y limpieza, informática).","Indicadores de calidad: ítems fácilmente identificables y significativos para medir la calidad de forma fiable (p. ej., % de residentes que hacen al menos una actividad de ocio al trimestre).","Carta de servicios: documento con el que la institución informa y se compromete públicamente con la calidad del servicio (compromisos, indicadores de seguimiento y medidas si se incumple)."]],
 ["Herramienta: la matriz DAFO","Analiza la situación interna y externa de una organización para tomar decisiones.",
  ["Análisis interno: Fortalezas y Debilidades.","Análisis externo (entorno): Oportunidades y Amenazas.","Pasos: analizar los cuatro factores, cruzarlos en una matriz de doble entrada y definir estrategias de prevención, crecimiento, atención preferente o mejora."]]
],
trucos:["Evaluación según el momento = una receta: INICIAL miro qué hay en la nevera, PROCESO pruebo mientras cocino, FINAL ¿ha quedado rico?","DAFO: lo de DENTRO son Debilidades y Fortalezas (lo controlas); lo de FUERA, Amenazas y Oportunidades (el entorno).","Procesos de calidad como un restaurante: ESTRATÉGICOS = el dueño decide la carta, CLAVE = cocinar y servir, de APOYO = fregar y hacer cuentas."],
cards:[
 ["Evaluación","Procedimientos para valorar si las decisiones y actuaciones están en sintonía con lo previsto en el diseño."],
 ["Fiabilidad (evaluación)","El resultado no varía según quién evalúe ni el momento en que se haga."],
 ["Oportunidad","Elegir el momento adecuado para evaluar."],
 ["Practicidad","Obtener resultados útiles; equilibrio entre lo ideal y lo viable."],
 ["Evaluación participativa","Integra a los agentes implicados; más laboriosa, pero genera implicación y feedback."],
 ["Autoevaluación","Los propios encargados de ejecutar el proyecto evalúan su actuación."],
 ["Evaluación interna","La hace la propia entidad; conoce bien el proyecto pero puede haber sesgo."],
 ["Evaluación externa","La realiza personal ajeno; más objetiva pero le cuesta conocer el proyecto."],
 ["Evaluación mixta","Equipo interno y externo; compensa inconvenientes pero exige coordinación."],

 ["Evaluación formativa o de proceso","Durante el proyecto: analiza el progreso y detecta desviaciones."],
 ["Evaluación sumativa","Al final: objetivos logrados, satisfacción, coste y desviación del presupuesto."],
 ["Evaluación para la predicción","Permite prever problemas y adoptar medidas para evitarlos."],
 ["Evaluación para el control","Compara resultados con objetivos para valorar la eficacia."],
 ["Evaluación longitudinal","Se realiza a lo largo de todo el proceso (base de la evaluación continua)."],
 ["Evaluación puntual o transversal","Se realiza en un momento concreto para tomar decisiones."],
 ["Metodología evaluadora","Procedimientos que definen cómo recoger y analizar la información."],
 ["Indicadores de evaluación","Enunciados que permiten medir el grado de aproximación a un objetivo."],
 ["Evaluación del diagnóstico","Preventiva: comprueba que el diagnóstico es correcto, fiable y válido antes de diseñar."],
 ["Evaluación del diseño","Valora la idoneidad y eficacia de la planificación (preventiva y de control)."],
 ["Evaluación del proceso","Evaluación continua de seguimiento durante las actividades."],
 ["Rentabilidad social","Si la relación coste‑beneficio del proyecto ha sido satisfactoria."],
 ["Informe de evaluación","Documento con la valoración del proceso y los resultados, logros y puntos débiles."],

 ["Dilemas de House","Derechos a la información, al bienestar, a la intimidad y a la dignidad en la evaluación."],
 ["Indicadores de género","Valoran la aplicación del enfoque de género y su impacto en la igualdad."],
 ["Indicadores de empoderamiento","Miden la capacidad de hombres y mujeres de controlar sus recursos y decidir."],
 ["Gestión de la calidad","Normas y procedimientos de toda la organización para mejorar la satisfacción de las personas a las que sirve."],
 ["EFQM","Modelo europeo de gestión de la calidad, el más adoptado."],
 ["Mapa de procesos","Representación gráfica de los procesos de la organización y sus relaciones."],
 ["Procesos clave","Actuaciones para el objetivo fundamental; las que más influyen en la opinión de los usuarios."],
 ["Procesos de apoyo","Dan soporte a los procesos clave (administración, limpieza, informática)."],
 ["Indicadores de calidad","Ítems identificables y significativos para medir la calidad de forma fiable."],
 ["Carta de servicios","Documento con el que la institución se compromete públicamente con la calidad del servicio."],
 ["Matriz DAFO","Análisis interno (Debilidades, Fortalezas) y externo (Amenazas, Oportunidades)."]
],
quiz:[
 ["¿Cuándo debe estar presente la evaluación?",["Siempre, de forma continua, desde antes de formular el proyecto","Solo al final","Solo si hay problemas","Solo al principio"],"La evaluación final es la consecuencia de las anteriores."],
 ["Que una evaluación dé el mismo resultado la haga quien la haga es…",["Fiabilidad","Validez","Oportunidad","Practicidad"],"La validez es que los datos reflejen fielmente la realidad."],
 ["La evaluación que más implicación y feedback genera, aunque es más laboriosa, es la…",["Participativa","Directiva","Externa","Puntual"],"Integra a todos los agentes implicados."],
 ["La evaluación que realiza una consultora ajena a la entidad es…",["Externa","Interna","Autoevaluación","Mixta"],"Es más objetiva pero le cuesta profundizar en el proyecto."],
 ["Detectar a mitad de proyecto que una actividad no funciona es propio de la evaluación…",["Formativa o de proceso","Inicial","Sumativa","Del diagnóstico"],"Permite reajustar sobre la marcha."],
 ["Comparar los resultados con los objetivos para valorar la eficacia es la función de…",["Control","Predicción","Orientación","Diagnóstico"],"Es la función inherente a toda evaluación."],
 ["La evaluación del diagnóstico es de tipo…",["Preventivo","De control final","Sumativo","Económico"],"Evita que un mal diagnóstico invalide todo el proyecto."],
 ["¿En qué dos momentos se evalúa el diseño?",["Al acabar la planificación (preventiva) y al final (de control)","Solo al final","Solo al principio","Nunca"],"Primero asegura la coherencia y después valora su idoneidad a posteriori."],
 ["Sin la evaluación final, un proyecto…",["No puede darse por cerrado","Se cierra igualmente","Es más barato","Es más objetivo"],"Tampoco se puede valorar su rentabilidad social."],
 ["El apartado del informe que analiza datos contradictorios y explicaciones alternativas es la…",["Discusión","Portada","Conclusión","Recomendación"],"Las conclusiones sintetizan las interpretaciones definitivas."],
 ["¿Qué documento es más completo y formal que el informe?",["La memoria","El resumen","La carta de servicios","El planning"],"A veces se usan como sinónimos, pero la memoria es más formal."],
 ["Según Morris y Taylor, al comunicar resultados hay que…",["Ser honesto y no ir más allá de los datos","Dar toda la información posible","Usar mucho vocabulario técnico","Evitar las preguntas"],"También empezar por lo más relevante y no saturar de información."],
 ["¿Qué autor plantea cuatro dilemas morales sobre información, bienestar, intimidad y dignidad?",["Ernest R. House","Allan J. Kimmel","Pérez Serrano","Henry Gantt"],"Kimmel propone actuar éticamente sin perder validez."],

U("metodologia", {
n:5, title:"Promoción y difusión del proyecto",
secs:[
 ["5.1. Por qué difundir el proyecto","De poco sirve un proyecto extraordinario si no llega a las personas a las que va dirigido; muchos triunfan sobre todo por una buena difusión. Para ello se usan las técnicas de la publicidad. La publicidad es una forma de comunicación para dar a conocer un producto, servicio o idea a un conjunto de personas y persuadirlas para que hagan algo. El mensaje debe ser sencillo, atractivo, fácil de entender y motivador.",
  ["Publicidad comercial: con ánimo de lucro; busca la compra (empresas).","Publicidad social: generalmente sin ánimo de lucro; concienciar, educar, sensibilizar o cambiar actitudes; promueve valores (justicia, solidaridad). Puede ser institucional (organismos públicos: informar de derechos y servicios) o de ONG (concienciar y conseguir fondos).","Publicidad política: informar de los proyectos de un partido para conseguir el voto; muy cercana a la propaganda.","Propaganda: comunicación ideológica para conseguir adeptos. Blanca (emisor identificado), gris (fuente poco clara) y negra (clandestina o falsificada; la usan sectas y grupos violentos)."]],
 ["5.1.2. Las campañas","Una campaña publicitaria es un conjunto organizado de estrategias para dar a conocer un producto o servicio a un grupo de población mediante anuncios en distintos medios. En lo social no vale todo: información verídica y de calidad, valores positivos, respeto a la dignidad y trato igualitario y no discriminatorio, tanto en el mensaje explícito como en el encubierto.",
  ["Tipos de campañas sociales: de cambio de comportamiento (tráfico, drogas), de denuncia (sinhogarismo, explotación infantil), de movilización social (pedir un centro de día), de captación de recursos (alimentos, voluntariado) e informativas sobre temas concretos (derechos, servicios).","Fases: 1) determinar el público objetivo, 2) elaborar el anuncio, 3) seleccionar los medios. Después, emitir con la frecuencia establecida.","Contravalores de la publicidad: elitismo, permisividad, contravalores (vanidad, superioridad), individualismo, estereotipos de género y consumismo."]],
 ["5.2. Fase 1: el público objetivo","La publicidad puede ser genérica (para toda la población) o segmentada, más eficaz para necesidades concretas.",
  ["Segmentación: separar el mercado en grupos con características similares (sexo, edad, zona, nivel socioeconómico, estilo de vida). La comercial suele perpetuar estereotipos (detergentes dirigidos a mujeres).","Público objetivo o target: grupo de personas al que se dirige una acción publicitaria. Hay que conocer sus gustos y costumbres (para el mensaje) y sus hábitos de medios (para la difusión).","Comportamiento del consumidor, modelos basados en el aprendizaje: modelo AIDA (Atención, Interés, Deseo, Acción).","Modelos basados en las motivaciones: estudian qué mueve al público para activarlo en el mensaje.","Modelos basados en las actitudes: parten de cómo percibe el público el producto para mejorar esa percepción."]],
 ["5.3. Fase 2: el anuncio","Un anuncio es un mensaje destinado a dar a conocer un producto o servicio. Combina un componente informativo (lo que se da a conocer) y uno persuasivo (emociones). Busca impactar y provocar un efecto (cambiar conductas o actitudes, sensibilizar). La publicidad subliminal emite mensajes por debajo del umbral de percepción consciente (imágenes escondidas, ilusiones visuales, dobles sentidos, ultrafrecuencia).",
  ["Estrategia argumentativa: demuestra con pruebas: testimonios (personas, expertos, famosos), comparación de comportamientos y silogismos («Si conduces habiendo bebido, puedes poner en peligro tu vida»).","Estrategia descriptiva: presenta los aspectos más atractivos del proyecto (instalaciones de una residencia).","Estrategia emotiva: despierta emociones; muy usada en sensibilización.","Estrategia proactiva: hechos sorprendentes que el receptor debe descodificar (inversión de papeles, exageración, analogía, símbolo visual, relación paradójica imagen‑texto)."]],
 ["5.3.2. El texto y el eslogan","El lenguaje es el eje del mensaje: cuanto más sintético, mejor. El eslogan es una frase o palabra atractiva, sugerente y fácil de recordar que recoge el concepto clave del mensaje.",
  ["Tipos de eslogan: describir la actividad, describir las ventajas del producto, sugerir su uso, ensalzar al consumidor, apoyar la marca o diferenciarla.","Recursos: adjetivación («Bueno, bonito y barato»), contradicción o antilogía («Pierde peso comiendo»), desafío («¿Te atreves…?»), dilogía (palabra con dos significados), frases hechas, hipérbole (exageración), identificación de la marca, interjección («Mmmm…»), onomatopeya, coloquialismos, personificación («Lavadoras inteligentes») y rima.","Elementos de audio (locución y música), gráficos (ilustrativos o con contenido) y multimedia (vídeo, animación)."]],
 ["5.3.4. Elementos de diseño: la composición","La composición es la manera de disponer los elementos de imagen y texto para crear el mensaje. Elementos:",
  ["La letra: tipografía, tamaño (cuerpo), efectos, color y orientación.","El punto (indica posición, atrae la vista), la línea (indica recorrido, da dinamismo) y la figura (línea cerrada que forma un contorno).","El plano: general (todo el decorado), conjunto (grupos en su entorno), entero (la figura completa; tres cuartos).","Encuadres: picado (desde arriba: empequeñece o ridiculiza), contrapicado (desde abajo: engrandece), inclinado (inestabilidad, sorpresa), imposible (extrañeza), a vista de pájaro (desde muy alto) y a vista de gusano (desde el suelo).","La luz: natural, artificial y efectos lumínicos (velas, fuego).","Las texturas: brillantes y lisas (alegría, modernidad), brillantes y ásperas (fuerza, agresividad), mates y rugosas (seriedad, austeridad), mates y rizadas (sensualidad), aterciopeladas (realeza, poder).","El color: rojo (fuerza, pasión), amarillo (alegría, juventud), verde (naturaleza, esperanza), azul (confianza, sabiduría, fidelidad), marrón (tierra, austeridad), gris (madurez, neutralidad), blanco (pureza, armonía), negro (misterio, muerte, pero también elegancia y poder)."]],
 ["Materiales impresos y audiovisuales","Elaboración de los materiales:",
  ["Carteles: imagen + eslogan; impacto directo y descodificación rápida; mejor si son sorprendentes y creativos.","Folletos: pieza promocional pequeña, sencilla y económica: título, explicación, fotos y contacto. Díptico (4 caras), tríptico (6 caras) y flyer (1 hoja, 2 caras). Los carteles crean impacto y los folletos amplían la información.","Audiovisuales: propios (cámara y editor) para proyectos pequeños o encargados a profesionales; mejor que no superen los 2 minutos. Ojo con las imágenes demasiado transgresoras: pueden generar rechazo."]],
 ["5.4. Fase 3: los medios de difusión","El plan de medios es la selección de los medios de difusión más adecuados para promocionar algo o comunicar una idea, con la mejor combinación para la máxima eficacia. Decide los medios y la frecuencia de emisión. OTS (opportunity to see) es el número de veces que una persona del público tiene ocasión de ver el anuncio (OTH, de oírlo). El marketing de resultados paga según los resultados conseguidos.",
  ["Publicidad exterior: en lugares públicos para público indeterminado: mobiliario urbano (marquesinas, columnas, mupis), vallas, lonas en fachadas y transporte público.","Folletos: reparto en mano, en mostradores, buzoneo o mailing (postal o electrónico). Pancartas para eventos.","Prensa: anuncios preferentes (página entera), generales, clasificados y encartes; revistas (más permanencia) y prensa gratuita (útil para proyectos locales).","Radio: mensajes claros y cortos, eslogan repetido, buena locución y música. Formatos: palabras y ráfagas, cuñas (unos 20 s), publirreportajes (2‑5 min), microprogramas y programas patrocinados.","Televisión: gran impacto pero muy cara (mejor televisiones locales). Formatos: spot (20‑30 s), publirreportaje (90 s‑3 min), infocomercial (más de 5 min), patrocinio, sobreimpresión y product placement (producto dentro del programa).","Internet: web propia, banners, cortinilla, layers, pop‑up y pop‑under, patrocinios, posicionamiento en buscadores, redes sociales e influencers, e‑mailing y ciberspot.","Community manager: gestor de comunidades en línea que gestiona la comunicación en redes y busca fidelizar y ampliar seguidores.","BTL (Below The Line) o marketing de guerrilla: fuera de los medios masivos. Street marketing: flashmob (multitud instantánea), dance marketing (baile sorpresa participativo) y lipdub (vídeo en un plano secuencia con playback). Baratos y con gran viralización."]],
 ["5.5. Proceso de una campaña","Cuatro fases (ejemplo: campaña de prevención de drogas en un barrio):",
  ["Fase I, briefing: documento resumido y ordenado con la información necesaria para la campaña: contexto, idea a publicitar, objetivos (concretos y medibles), target (p. ej., menores de 13‑17 años del barrio), tono y estilo, presupuesto y timing.","Fase II, diseño: elaborar el anuncio (eslogan con lluvia de ideas, imagen y soportes) y el plan de medios (trípticos, carteles, vídeo, web y banners, marketing directo, street marketing).","Fase III, preparación y lanzamiento: tener listos los recursos y el personal, ajustar el presupuesto, cronograma de tareas y sistema de decisiones rápidas ante imprevistos.","Fase IV, evaluación: ¿se llegó al público?, ¿impactó el mensaje?, ¿se recuerda el eslogan?, ¿hubo la afluencia esperada? Con indicadores e instrumentos."]],
 ["5.6. Perspectiva de género en la difusión","La difusión es donde más se nota el trato subordinado o denigrante a la mujer; la publicidad comercial refuerza estereotipos. La Ley Orgánica 3/2007 exige igualdad de trato.",
  ["Lenguaje no sexista: genéricos o colectivos (la ciudadanía, el alumnado), anteponer «persona» (las personas usuarias), nombrar cargos sin genérico masculino (la dirección), evitar «hombre» como genérico (el ser humano), feminizar cargos (la jueza), desdoblar alternando el orden (las niñas y los niños), barras (profesor/a), pronombres neutros (quien quiera), evitar «señorita». La arroba (@) no es correcta en un registro formal.","Protocolos: UNESCO (1987, 1989), Consejo de Europa (1990), Orden de 1995 sobre titulaciones, LO 3/2007 y Plan Estratégico de Igualdad de Oportunidades.","Prácticas sexistas: roles estereotipados, infravaloración de la mujer, cosificación (cuerpo como objeto de deseo) y exigencia de belleza.","Hacia una publicidad igualitaria: actualizar roles, no asignar productos a un sexo, voces de ambos sexos, mujeres activas con objetivos propios y emocionalmente estables, cuerpos saludables, no usar a la mujer como reclamo, representar la diversidad, formar a los profesionales y asegurar que la información llegue a todas las mujeres."]],
 ["Herramientas creativas y de consenso","Para crear mensajes y decidir:",
  ["Lluvia de ideas (brainstorming): técnica grupal para encontrar ideas creativas. Pasos: plantear el tema y las normas, aportar ideas libremente (cuantas más, mejor) y revisar y consensuar.","Diagrama de afinidad: clasifica muchas ideas en grupos según criterios del grupo.","Bola de nieve: técnica grupal para consensuar y priorizar: parejas → grupos de cuatro → grupos de ocho… hasta llegar al consenso."]]
],
trucos:["AIDA es una cantante que te seduce: te mira (Atención), te intriga (Interés), te enamora (Deseo) y compras su disco (Acción).","Campaña en 4 fases = «B‑D‑L‑E»: Briefing, Diseño, Lanzamiento, Evaluación.","Encuadres: PICADO = la cámara te pica desde arriba y te hace pequeño; CONTRAPICADO = desde abajo, te hace gigante."],

quiz:[
 ["Una campaña de una ONG para concienciar sobre el acoso escolar es publicidad…",["Social","Comercial","Política","Propaganda negra"],"Busca sensibilizar o cambiar actitudes, sin ánimo de lucro."],
 ["La propaganda cuyo emisor está oculto o falsificado es…",["Negra","Blanca","Gris","Institucional"],"Es la que usan sectas y grupos violentos."],
 ["Una campaña de recogida de alimentos es una campaña de…",["Captación de recursos","Denuncia","Movilización social","Cambio de comportamiento"],"Los recursos pueden ser materiales o personales (voluntariado)."],
 ["¿En qué orden van las fases del modelo AIDA?",["Atención, Interés, Deseo, Acción","Interés, Atención, Acción, Deseo","Deseo, Acción, Interés, Atención","Acción, Deseo, Interés, Atención"],"Primero captas la atención y al final provocas la acción."],
 ["«Si no usas preservativo, puedes contagiarte de una ETS» usa una estrategia…",["Argumentativa con silogismo","Descriptiva","Proactiva","Subliminal"],"Los silogismos aportan credibilidad demostrable."],

 ["Una foto tomada desde abajo para engrandecer a la persona es un plano…",["Contrapicado","Picado","Inclinado","General"],"El picado, desde arriba, empequeñece."],
 ["¿Qué color se asocia a la esperanza y la naturaleza?",["Verde","Rojo","Gris","Negro"],"El rojo es pasión y fuerza; el azul, confianza."],
 ["Un folleto de una hoja con dos pliegues y seis caras es un…",["Tríptico","Díptico","Flyer","Mupi"],"El díptico tiene cuatro caras y el flyer dos."],
 ["¿Cuánto suele durar una cuña de radio?",["Unos 20 segundos","Unos 5 minutos","1 hora","Medio minuto de silencio"],"Los publirreportajes duran entre 2 y 5 minutos."],
 ["Que una ONG aparezca en un póster dentro de una serie de televisión es…",["Product placement","Spot","Banner","Infocomercial"],"Es publicidad por emplazamiento."],
 ["Un grupo que aparece por sorpresa en una estación, baila e invita a la gente a sumarse hace…",["Dance marketing","Mailing","Product placement","Infocomercial"],"Es una modalidad de street marketing (BTL)."],

U("mediacion", {
n:1, title:"Introducción a la mediación comunitaria",
secs:[
 ["1.1. La convivencia","La convivencia es la interacción entre personas que comparten un mismo espacio y establecen normas y acuerdos para la armonía y el bienestar colectivo; se basa en el respeto, la cooperación y la gestión pacífica de las diferencias. No es fija: es un proceso en constante cambio. Las tensiones pueden dar lugar a conflictos, que son naturales; bien gestionados mejoran la comunicación y los vínculos, mal gestionados llevan a la confrontación.",[]],
 ["1.1.1. La mediación","La mediación es un proceso estructurado de resolución de conflictos en el que una persona imparcial facilita el diálogo entre las partes para que lleguen a un acuerdo satisfactorio para todas.",
  ["Proceso estructurado: con fases definidas.","Voluntariedad: se participa libremente y se puede abandonar.","Figura mediadora imparcial que facilita el diálogo y aclara posiciones.","El acuerdo lo alcanzan las propias partes.","Historia: Antigüedad (Mesopotamia, Egipto, Grecia, China y Japón; el juicio de Salomón), Edad Media (reyes, clérigos, gremios; el Tribunal de las Aguas de Valencia desde el siglo XIII), Edad Moderna (más reglada), siglo XIX (conflictos laborales, sindicatos) y siglo XX (método alternativo; la mediación comunitaria se consolida con los movimientos pacifistas y de derechos civiles)."]],
 ["1.1.2. La comunidad","Una comunidad es un grupo de personas que comparten un entorno y establecen vínculos, generando normas, valores y un sentido de pertenencia. Elementos: personas que interactúan, actividades y experiencias compartidas, normas y valores compartidos y, a menudo, un territorio definido.",
  ["Comunidades territoriales: barrio, localidad, comunidad de vecinos (ruidos, espacios comunes).","Comunidades educativas: docentes, alumnado y familias.","Comunidades laborales: personas de una misma organización o sector.","Comunidades culturales e identitarias: lengua, religión, historia; aquí es clave la mediación intercultural."]],
 ["1.1.3. La mediación comunitaria","Es un proceso de resolución de conflictos basado en la técnica de la mediación y en la participación activa de la comunidad. No solo resuelve el problema inmediato: tiene en cuenta su impacto en la colectividad y promueve la comunicación, el reconocimiento mutuo y la corresponsabilidad.",
  ["Ámbito: espacios de convivencia continua (barrios, asociaciones, centros educativos).","Participación activa de la comunidad: otros agentes pueden facilitar el diálogo.","Carácter preventivo y restaurativo.","Voluntariedad e imparcialidad.","La mirada comunitaria: ver los conflictos como parte de una estructura social interconectada y no como problemas aislados; busca soluciones cooperativas y sostenibles."]],
 ["1.2.1. La finalidad de la mediación comunitaria","Según los objetivos de la intervención:",
  ["Preventiva: detectar tensiones a tiempo y diseñar estrategias para evitar nuevos conflictos.","Educativa: enseñar a gestionar los conflictos dialogando (comunicación, negociación, resolución de problemas); crea una cultura de paz.","Reparadora: restaurar relaciones dañadas y reparar el daño (justicia restaurativa); previene la reincidencia."]],
 ["1.2.2. Los principios de la mediación comunitaria","Orientan la labor de la persona mediadora:",
  ["Voluntariedad: participación libre; se puede abandonar en cualquier momento.","Imparcialidad: no favorecer a ninguna parte.","Confidencialidad: no divulgar lo compartido sin consentimiento; espacio seguro.","Neutralidad: no imponer soluciones ni influir en las decisiones.","Buena fe: sinceridad y compromiso real.","Participación activa: implicarse en la construcción de acuerdos.","Enfoque restaurativo: reconstruir relaciones y confianza.","Adaptación cultural y contextual: ajustarse a cada comunidad.","Acceso equitativo: que todas las personas puedan resolver sus conflictos de forma justa y accesible."]],
 ["1.2.3. Los modelos de mediación","En la práctica se combinan, pero cada uno da pautas:",
  ["Tradicional lineal (Harvard): soluciones pragmáticas basadas en intereses. Principios: separar a las personas del problema, centrarse en los intereses y no en las posiciones, explorar múltiples opciones y usar criterios objetivos.","Transformativo: transformar a las personas y sus relaciones para que resuelvan solas futuros conflictos. Principios: empoderamiento (recuperar el control) y reconocimiento (comprender a la otra parte). El mediador es menos directivo; no garantiza un acuerdo inmediato.","Circular-narrativo: el conflicto es un relato; busca cambiar la historia que cuenta cada parte. Principios: causalidad circular (no hay una única causa) y comunicación circular (el diálogo evoluciona).","Interdisciplinario: integra psicología, sociología, derecho y trabajo social. Principios: enfoque holístico, trabajo en equipo y flexibilidad metodológica."]],
 ["1.3.1. Ámbitos de aplicación","Los ámbitos a veces se solapan (p. ej., absentismo escolar que afecta al barrio).",
  ["Conflictos vecinales y de convivencia: ruidos, espacios comunes, recursos compartidos.","Centros educativos: alumnado, profesorado y familias.","Intercultural y procesos migratorios.","Espacios asociativos y participación ciudadana.","Ámbito penitenciario y justicia restaurativa: reparar el daño en lugar de solo castigar; la persona responsable entiende las consecuencias y la afectada es escuchada."]],
 ["1.3.2. Los servicios de mediación comunitaria","Impulsados sobre todo por la Administración pública, a veces con el tercer sector.",
  ["Equipo: personas mediadoras (dirigen el proceso) y personal de supervisión técnica (supervisa, garantiza los principios y forma).","Relación con otros servicios: derivación al servicio (desde servicios sociales, educativos, policiales o judiciales) y derivación desde el servicio (a apoyo psicológico, legal o social).","Ubicación: fija (oficinas municipales) o itinerante (equipos que se desplazan a barrios con más necesidades).","Recursos: materiales de difusión y documentación de trabajo (protocolos, guías, formularios, registros de acuerdos)."]],
 ["1.3.3. Marco normativo","Garantiza imparcialidad, confidencialidad y voluntariedad:",
  ["Europea: Directiva 2008/52/CE (mediación en conflictos transfronterizos) y Reglamento (CE) 2201/2003 (responsabilidad parental, conflictos familiares internacionales).","Estatal: Ley 5/2012 de mediación en asuntos civiles y mercantiles (principios, papel del mediador, reconocimiento de acuerdos). El Real Decreto 980/2013 la desarrolla: formación mínima obligatoria, registro oficial de mediadores y seguro de responsabilidad civil.","Autonómica: cada comunidad puede regular la mediación comunitaria."]],
 ["1.4.1. Igualdad: perspectiva de género","La mediación debe tratar a todas las personas con equidad y crear condiciones de participación real. La perspectiva de género es un enfoque analítico para examinar y cuestionar las desigualdades y relaciones de poder entre los géneros. Sexo: características biológicas. Género: construcción social de normas y roles. Estereotipos de género: creencias sobre cómo debe comportarse cada género.",
  ["Efectos de los estereotipos: hombres que no muestran vulnerabilidad; mujeres que evitan la confrontación y ceden más; la voz masculina percibida con más autoridad; acceso desigual (si dependen de autorización familiar o recursos).","Estrategias: espacios seguros y equitativos (representación equilibrada, confianza, prevenir dinámicas de poder), sesiones individuales previas y facilitar la comunicación (turnos, preguntas dirigidas).","Formación continua de las personas mediadoras en perspectiva de género."]],
 ["1.4.2. Perspectiva de no discriminación y límites","Trato justo y equitativo sin que identidad, origen, religión, género, orientación o discapacidad supongan desventaja; enfoque proactivo. La persona mediadora debe revisar sus propios prejuicios.",
  ["Crear un entorno seguro donde todas las voces se escuchen.","Detectar y corregir sesgos en el proceso.","Adaptar los procedimientos a personas vulnerables.","Límites (no mediables): violencia de género (relación de poder desigual), conflictos altamente destructivos, falta de interés o boicot y conductas ilegales (fraude, corrupción, delitos graves)."]]

cards:[

 ["Tribunal de las Aguas de Valencia","Ejemplo histórico de mediación institucionalizada (desde el s. XIII) sobre el uso del agua."],
 ["Comunidad","Grupo que comparte un entorno, establece vínculos y genera normas, valores y sentido de pertenencia."],
 ["Mediación comunitaria","Resolución de conflictos basada en la mediación y en la participación activa de la comunidad."],
 ["Mirada comunitaria","Ver los conflictos como parte de una estructura social interconectada, no como problemas aislados."],

 ["Finalidad educativa","Enseñar a gestionar los conflictos dialogando; crea una cultura de paz."],
 ["Finalidad reparadora","Restaurar relaciones dañadas y reparar el daño; previene la reincidencia."],
 ["Voluntariedad","Las partes participan libremente y pueden abandonar el proceso en cualquier momento."],

 ["Buena fe","Participar con sinceridad, transparencia y compromiso real de encontrar una solución."],

 ["Real Decreto 980/2013","Desarrolla la Ley 5/2012: formación mínima, registro de mediadores y seguro de responsabilidad civil."],
 ["Directiva 2008/52/CE","Norma europea sobre mediación en conflictos transfronterizos."],
