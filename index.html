U("contexto", {
n:1, title:"La dinámica social",
secs:[
 ["1.1. La persona, un ser social","Las personas vivimos en comunidades y nos relacionamos para cubrir nuestras necesidades. Esas relaciones cambian según su naturaleza (familiar, afectiva, laboral), sus circunstancias, su profundidad y las personas implicadas, y van cambiando a lo largo de la vida. Eso influye en cómo nos relacionamos, en nuestra conducta y en nuestra identidad.",[]],
 ["1.1.1. El cambio a lo largo de la vida","Nuestras características físicas, psicológicas y emocionales cambian durante toda la vida. Este proceso de transformación tiene tres rasgos:",
  ["Continuidad: ocurre sin parar durante todo el ciclo vital.","Incremento de la complejidad: las habilidades se perfeccionan y los procesos se vuelven más eficaces.","Dependencia de las experiencias: influyen las situaciones vividas, las relaciones y los aprendizajes (la trayectoria de vida)."]],
 ["El ciclo vital y sus etapas","El ciclo vital es la sucesión de etapas por las que pasa una persona desde que nace hasta que muere. Las habilidades, capacidades e intereses dependen mucho de la edad.",
  ["Infancia (0‑12 años): cambios enormes y socialización muy intensa. Subetapas: primera infancia (0‑2: confianza en la figura de referencia, autonomía y lenguaje), segunda infancia (2‑6: independencia y deseo de responsabilidades), infancia tardía (6‑9: entra en la escuela, más relación con iguales) y preadolescencia (9‑12: empieza a construir su identidad).","Adolescencia (12‑18): empieza con la pubertad. Búsqueda de identidad, más conflictos con la familia, que es sustituida como fuente de valores por los iguales, los medios y las redes.","Edad adulta (19‑65): la más larga, centrada en la vida familiar y profesional. Adultez joven (19‑35: nuevos roles, formar familia, carrera) y adultez media (35‑65: revisión de la vida, posible crisis de la mitad de la vida).","Vejez (desde 65): puede tener muy buena calidad de vida, pero es una etapa de pérdidas: trabajo, independencia económica, personas cercanas, pareja."]],
 ["La trayectoria de vida","Es la secuencia completa de acontecimientos que vive una persona, sobre todo en lo familiar, formativo, laboral y residencial. Antes era lineal (estudiar → trabajo estable → familia → jubilación, casi siempre en el mismo sitio). Hoy hay disrupciones en todos los ámbitos:",
  ["Familiar: nuevos modelos de familia (monoparentales, homoparentales, reconstituidas, adoptivas, tardías), roles más democráticos y relaciones más inestables.","Formativo: la formación se alarga y se entra y sale del sistema educativo durante toda la vida.","Laboral: el empleo es inestable, con periodos de paro o inactividad.","Residencial: la precariedad y el acceso difícil a la vivienda obligan a mudarse y a reconstruir las redes sociales.","Resiliencia: capacidad de resistir las adversidades y adaptarse a ellas superándolas de forma positiva. Protege ante rupturas que pueden llevar a la exclusión."]],
 ["1.1.2. La conducta y la actitud","La conducta es el conjunto de comportamientos y maneras de actuar de una persona en los distintos contextos. Es una respuesta observable ante un estímulo y depende de factores internos (genética, personalidad, valores, capacidades) y externos (la situación, las personas presentes, el contexto).",
  ["Conducta adecuada: beneficiosa para la persona y aceptable para los demás.","Conducta inadecuada: sus consecuencias son negativas para la persona o para los demás; aumenta el riesgo de exclusión.","Sistema informal de normas: usos y costumbres (puede incluir estereotipos y prejuicios).","Sistema formal de normas: las leyes, con sanciones para faltas y delitos.","Actitud: disposición, tendencia o inclinación hacia algo o alguien. Se forma en la infancia con los modelos (familia, grupo) y suele ser duradera, pero puede cambiar. Para cambiar una conducta hace falta una actitud favorable, y es mejor ofrecer alternativas que imponer exigencias."]],
 ["1.1.3. La identidad y la socialización","La identidad es la concepción y expresión que cada persona tiene de su individualidad y de su pertenencia o no a ciertos grupos.",
  ["Identidad individual: lo que la persona se atribuye a sí misma. Sale de sus roles en los sistemas sociales, de su autoconcepto (la imagen que tiene de sí) y de su autoestima (el valor que se da).","Identidad social: las características que el contexto atribuye a cada persona (color de piel, lengua, religión, origen, género, cultura…).","Socialización: proceso por el que aprendemos e interiorizamos habilidades, valores y pautas de conducta para relacionarnos con el medio."]],
 ["Agentes y niveles de socialización","Los agentes de socialización son las personas o instancias que transmiten normas, valores y modelos de comportamiento. Sus efectos pueden ser positivos (solidaridad, sostenibilidad) o negativos (contenidos poco éticos, agresividad, malos hábitos, estereotipos).",
  ["Familia: el agente por excelencia; la socialización empieza en ella y sigue siendo referente toda la vida.","Escuela: socialización formal, intencionada y planificada.","Grupos de iguales: amistades, clase, pandilla; clave en la adolescencia.","Medios de comunicación (tradicionales y digitales): transmiten información, pero también estereotipos y modelos.","Socialización primaria: en la infancia, sobre todo en la familia; forma la base de la personalidad; muy afectiva.","Socialización secundaria: fuera de la familia (escuela, medios, organizaciones); da herramientas para desenvolverse socialmente.","Socialización terciaria: en instituciones reeducativas (prisiones, centros educativos). Es una resocialización para reintegrarse; se parece al trabajo de integración social."]],
 ["1.2. Las estructuras sociales","Una sociedad necesita ser estable y que sus miembros se relacionen de forma organizada. La estructura social es la forma que adopta el sistema de relaciones entre los individuos de una sociedad o grupo. Elementos:",
  ["Individuos: la unidad más pequeña.","Grupos sociales: personas unidas por objetivos comunes, con valores y conciencia de unidad. Tipos: de pertenencia (al que perteneces), de referencia (no perteneces pero te sirve de brújula), primario o comunidad (relaciones personales y cercanas: familia, amigos) y secundario o asociación (relaciones impersonales con un fin: empresa, club).","Cuasigrupos: no son grupos completos. Categoría (comparten un rasgo sin relación, p. ej. nacidos el mismo año) y conglomerado (comparten espacio sin interactuar, p. ej. viajeros de un tren).","Roles sociales: el papel de cada persona en un grupo (estudiante, madre…). Se espera de ellos un comportamiento (expectativa de rol); si no se cumple puede surgir el conflicto.","Normas y costumbres: el código que regula las relaciones.","Instituciones sociales: pautas duraderas que cubren necesidades básicas: familiar, educativa, política, económica, religiosa y recreativa."]],
 ["1.2.2. Categorización y valoración social","Cada sociedad clasifica y valora los rasgos de las personas, y eso determina su estatus: el lugar que ocupa cada uno en el grupo y en la sociedad, con su prestigio y sus ventajas o desventajas.",
  ["Estatus atribuido o adscrito: desde el nacimiento (sexo, edad, nivel económico familiar).","Estatus adquirido: por esfuerzo y méritos (deportista, enfermera, ser madre).","Estatus transferido: se recibe de otra persona (jefe del Estado).","Rasgos de alta valoración: deseables (poder económico, juventud, valentía) → aceptación social y estandarización (se convierten en norma).","Rasgos de baja valoración: no deseables (pobreza, vejez, timidez) → rechazo social y posiciones marginales.","Teorías de la desviación social: funcionalistas (la desviación marca límites y refuerza la norma), de las subculturas (grupos desfavorecidos crean su propia cultura), del etiquetaje (las instituciones etiquetan como desviados a ciertos grupos y perpetúan su exclusión) y criminología crítica (el concepto de desviación sirve para el control social)."]],
 ["1.2.3. El cambio social","La estructura social no es fija. El cambio social es el conjunto de transformaciones duraderas de una estructura social: lo normativo puede volverse marginal y al revés (p. ej., la homosexualidad pasó de considerarse pecado, desorden y enfermedad a algo legítimo y normal). Factores:",
  ["Demográficos: natalidad, mortalidad, migraciones.","Culturales: valores, creencias, tradiciones, acceso a la educación.","Económicos: reparto de bienes, producción, consumo, infraestructuras.","Tecnológicos: transporte, comunicación, avances médicos.","Ideológicos: ideas de una época (antimilitarismo, antisexismo, defensa de la democracia)."]],
 ["1.3. La participación social y comunitaria","La participación es la intervención de una persona en la toma de decisiones sobre los recursos y acciones que afectan al desarrollo de su comunidad. Es un derecho (art. 21 de la Declaración Universal de los Derechos Humanos).",
  ["Esfera pública: participación política (elegir representantes) y ciudadana (consultas, entidades).","Esfera privada: participación social (mejorar la vida de un colectivo) y comunitaria (resolver necesidades concretas de un grupo o sector).","Mecanismo 1, sociedad civil: asociaciones, sindicatos, colegios profesionales, asociaciones vecinales. Un tejido asociativo rico defiende mejor los derechos.","Mecanismo 2, redes comunitarias: la propia comunidad se organiza sin depender de entes externos (ayuda mutua en la pandemia o en la DANA de Valencia de 2024). Las mejoras son más sostenibles y la comunidad sale reforzada."]],
 ["1.3.2. Factores que influyen en la participación","No todo el mundo participa igual. Influyen: el empleo y su calidad, la economía, la educación (analfabetismo, brecha digital), la cultura (barreras lingüísticas, minorías), la política (procesos penales, situación jurídica), la vivienda, la salud, el entorno familiar, la conflictividad social y el entorno físico.",
  ["Mujeres: heteropatriarcado, brecha salarial y techo de cristal, falta de recursos.","LGTBIQ+: invisibilización, patologización, discriminación y violencia.","Inmigrantes: burocracia, barreras lingüísticas, falta de redes, desprotección.","Menores: adultocentrismo y desconocimiento de sus derechos.","Personas mayores: edadismo, precariedad, brecha digital.","Personas con discapacidad: capacitismo y barreras arquitectónicas y de comunicación.","Pueblo gitano: rechazo, falta de referentes propios, desconfianza en el sistema."]],
 ["1.4. La perspectiva de género como motor de cambio","El sexo es biológico (cromosomas XX y XY); el género son los roles, conductas y actitudes que la sociedad espera (hecho social y cultural). En Occidente lo más valorado se asocia al hombre masculino heterosexual: es el heteropatriarcado, un sistema que toma lo masculino como referente (androcentrismo) e impone la heterosexualidad. Perjudica a mujeres, personas LGTBIQ+ y también a los hombres. La desigualdad de género es la subordinación de la mujer respecto del hombre y se aprende con la socialización.",
  ["Educación: carreras STEM masculinizadas; educación y cuidados, feminizados.","Trabajo: más paro, empleos precarios (suelo pegajoso) y dificultad para ascender (techo de cristal).","Salud: protocolos pensados para hombres (p. ej., infartos).","Economía: salario medio más bajo (brecha salarial).","Medios: menos presencia y voz de las mujeres.","Hogar: cuidados y tareas recaen en ellas (doble jornada).","Espacios de decisión: poca presencia en política y dirección.","Violencia machista: física, psicológica, sexual o económica."]],
 ["1.4.2. Aplicar la perspectiva de género","Es el enfoque crítico de cualquier acción o situación teniendo en cuenta las desigualdades de género. Implica identificar las diferencias de roles, las dificultades de las mujeres para acceder a los recursos y los obstáculos para decidir su proyecto de vida. No consiste en hacer acciones solo para mujeres, sino en prever desde el diseño cómo afecta a mujeres y hombres. Permite:",
  ["Modificar estructuras, prácticas y valores sociales.","Repartir de forma equitativa las tareas en lo público y lo privado.","Favorecer el empoderamiento de las mujeres.","Cambiar los patrones de masculinidad (que llevan a los hombres a más conductas de riesgo)."]]
],
trucos:["CONDUCTA se Ve, ACTITUD se Siente: la actitud es el motor y la conducta el coche que ves pasar.","Socialización 1‑2‑3: PRIMARIA = Padres, SECUNDARIA = el Siguiente círculo (escuela, medios), TERCIARIA = Te reeducan (prisiones, centros).","Estatus A‑A‑T: Atribuido (naces con él), Adquirido (lo Aprendes/ganas), Transferido (te lo Traspasan)."],

quiz:[
 ["¿Cuál es el agente de socialización por excelencia?",["La familia","Los medios de comunicación","El grupo de iguales","La escuela"],"La socialización empieza en la familia y sigue siendo un referente toda la vida."],
 ["Un programa de reinserción dentro de una prisión es un ejemplo de socialización…",["Terciaria","Primaria","Secundaria","Informal"],"La terciaria se da en instituciones reeducativas y busca la resocialización."],

 ["¿Qué teoría dice que las instituciones etiquetan a ciertos grupos como desviados y perpetúan su exclusión?",["Teoría del etiquetaje","Teoría funcionalista","Teoría de las subculturas","Teoría del cambio social"],"Escuelas, servicios sociales o prisiones definen qué es legítimo y etiquetan a quien no encaja."],

 ["¿En qué etapa la familia es sustituida como fuente de valores por iguales, medios y redes?",["Adolescencia","Primera infancia","Edad adulta","Vejez"],"Es una etapa crítica de búsqueda de identidad."],
 ["Que las mujeres tengan más dificultades para llegar a cargos de responsabilidad se llama…",["Techo de cristal","Suelo pegajoso","Doble jornada","Brecha digital"],"El suelo pegajoso, en cambio, se refiere a los empleos precarios."],

 ["El grupo al que no perteneces pero que te sirve de modelo para tu conducta es el grupo de…",["Referencia","Pertenencia","Primario","Secundario"],"Sirve de brújula, para imitarlo o para evitarlo."],

U("contexto", {
n:2, title:"Procesos de inclusión y exclusión social",
secs:[
 ["2.1. Inclusión y exclusión: un continuo dinámico","La inclusión social es la aceptación de una persona o grupo y su participación plena en la vida social, económica y cultural. La exclusión social es el rechazo que le impide acceder al desarrollo personal, a la participación e incluso a la protección oficial. Son los extremos de un continuo (hay grados) dinámico (se puede pasar de una zona a otra). Las condiciones no son innatas ni irreversibles, sino del contexto.",
  ["Zona de inclusión o integración: estabilidad, ingresos regulares, trabajo y redes de apoyo sólidas.","Zona de vulnerabilidad o riesgo: inestabilidad y precariedad laboral, económica y sanitaria (riesgo social).","Zona de exclusión: imposibilidad de participar en ámbitos clave (trabajo, renta, sanidad, red social); la persona está marginada."]],
 ["2.1.1. Sistemas que facilitan la inclusión","La sociedad tiene mecanismos para que el mayor número de personas siga integrado:",
  ["Sistemas naturales: familia, iguales y vecindad. Dan identidad, protección y sentimiento de pertenencia. La clave es la reciprocidad (relaciones de respeto y colaboración entre iguales).","Sistemas organizados: asociaciones, fundaciones, obras sociales y el tercer sector (entidades privadas sin ánimo de lucro que reinvierten todo en su misión: ONG, cooperativas, fundaciones…). La Administración las financia con subvenciones y concursos.","Sistemas formales: la iniciativa pública (Estado y administraciones) con políticas sociales: pensiones, sanidad, educación, servicios sociales y leyes."]],
 ["2.1.2. Rasgos de la exclusión social","Teorías: causas patológicas (rasgos personales), subculturales (valores distintos), administrativas (fracaso de las instituciones) y estructurales (las estructuras de poder generan exclusión). La exclusión es:",
  ["Multifactorial: se debe a varios factores; las ventajas en un ámbito pueden compensar desventajas en otro.","Multidimensional (triple ruptura): dimensión subjetiva (privaciones y estigma), estructural (supera la protección del sistema) y relacional (rompe la red natural; desafiliación social).","Dinámica: depende del entorno y sus normas, que cambian.","Acumulativa: las desventajas se suman y se agravan.","Procesual: es un proceso, no un estado definitivo; es reversible.","Politizable: algunos grupos la usan para legitimar su poder.","Democratización del riesgo: hoy cualquier persona puede verse en situación de vulnerabilidad (crisis, precariedad, cambios familiares…), con nuevas figuras de la exclusión."]],
 ["Mecanismos de exclusión","La exclusión es un rechazo a la alteridad (lo distinto a la norma). Formas:",
  ["Sustracción o eliminación física: expulsión (destierro, deportación, limpieza étnica) o exterminio (genocidio).","Sustracción identitaria: persecución o destrucción de la cultura (etnocidio).","Segregación espacial: gueto o reclusión en instituciones (prisiones, centros psiquiátricos): institucionalización.","Segregación institucional: concentrar a un grupo en recursos distintos (guetización), p. ej. escuelas con casi solo alumnado extranjero.","Estigmatización: imagen negativa y discursos de odio, con discriminación legal (leyes discriminatorias: apartheid) o social (marginación e invisibilización)."]],
 ["Tipos de discriminación","Formas más frecuentes (también puede darse el autoodio: rechazar el propio rasgo):",
  ["Racismo: contra un grupo étnico considerado inferior.","Xenofobia: rechazo a personas o culturas extranjeras.","Por motivos culturales o religiosos: antisemitismo, islamofobia.","Sexismo: misoginia, homofobia, lesbofobia, bifobia, transfobia, LGTBIfobia.","Aporofobia: rechazo a la pobreza y a las personas pobres.","Edadismo: contra mayores o menores.","Capacitismo: contra personas con discapacidad.","Aculturación: abandonar los rasgos de tu cultura y adoptar los del grupo dominante (problemas de identidad en 2.ª y 3.ª generación).","Naturalización de la exclusión: ver la desventaja como natural, inevitable o culpa de quien la sufre."]],
 ["2.2.1. Ejes transversales de desigualdad","Un eje de desigualdad es un aspecto que, en cualquier ámbito, hace a la persona más vulnerable. Aumentan la vulnerabilidad, crean desventajas nuevas y dificultan la inclusión. Pueden sumarse varios.",
  ["Sexo: brecha salarial, techo de cristal, doble jornada, violencia machista.","Orientación sexual e identidad de género: rechazo, sinhogarismo, violencia.","Edad: mayores y menores en una sociedad adultocéntrica.","Clase social: más fracaso escolar y empleos precarios.","Discapacidad: estigma y barreras sin adaptaciones.","Territorio: medio rural o barrios desfavorecidos.","Etnia y religión: prejuicios, discriminación, barreras de idioma y situación irregular.","Brecha digital: no poder acceder a servicios que ya son digitales."]],
 ["2.2.2. Factores de riesgo","Condiciones que aumentan la probabilidad de exclusión; combinan elementos personales, relacionales y socioeconómicos.",
  ["Pobreza: absoluta (no cubre mínimos de subsistencia), relativa (por debajo del nivel de vida mínimo de su territorio; para Eurostat, ingresos menores al 60 % de la media) y subjetiva (la persona siente que no llega).","Precariedad laboral: falta de trabajo (paro de larga duración, subocupación, falsos autónomos), tipo de trabajo (sobrecualificación, trabajos estigmatizados) y malas condiciones.","Falta de formación: escolarización incompleta, aprendizaje deficiente, difícil acceso, barreras lingüísticas, falta de titulación y analfabetismo digital.","Problemas de salud: enfermedades crónicas o mentales, discapacidad, adicciones, maltrato.","Precariedad residencial: falta de vivienda, residencia irregular, coste excesivo, acoso inmobiliario, infravivienda, pobreza energética y entorno degradado o mal comunicado.","Bajo capital relacional: redes débiles, familias conflictivas, estigma, falta de arraigo.","Carencias culturales y de ocio.","Problemas legales y burocráticos: privación de libertad, situación irregular, desamparo de menores, acceso restringido a la justicia y a la ciudadanía."]],
 ["2.2.3. Factores de protección","Condiciones que reducen la posibilidad de riesgo o exclusión, en los mismos ámbitos:",
  ["Económico: rentas suficientes, políticas redistributivas, microcréditos.","Laboral: empleo estable (da derecho a prestaciones), reciclaje profesional, programas de inserción, cooperativas.","Educativo: sistema educativo universal, formación continua, aprendizaje de la lengua, educación inclusiva.","Salud: Sistema Nacional de Salud y programas de salud comunitaria.","Residencial: vivienda pública, ayudas, albergues, pisos tutelados.","Relacional: red de apoyo amplia y tejido asociativo rico.","Cultural: oferta de ocio accesible y buena gestión de la diversidad. Multiculturalidad: los grupos conviven separados y no se conocen. Interculturalidad: se relacionan, se conocen y se enriquecen mutuamente.","Jurídico: ciudadanía y residencia legal, justicia gratuita, protección de menores, acompañamiento y enfoque reinsertador de las prisiones."]],
 ["2.3. La violencia","Las personas vulnerables sufren más violencia, que puede ser causa o consecuencia de la exclusión. La naturalización (verla como normal o merecida) la agrava. Según su naturaleza:",
  ["Física: uso de la fuerza para causar daño.","Psicológica o emocional: manipular, humillar, controlar, aislar; difícil de detectar.","Sexual: actos contra la libertad sexual; incluye el acoso por razón de sexo (entorno hostil, bromas sexistas) y el acoso sexual (quien tiene poder lo usa para obtener favores sexuales).","Económica: controlar el dinero para crear dependencia.","Digital: ciberacoso, control del móvil, difundir imágenes íntimas."]],
 ["2.3.2. Maltrato infantil","Cualquier acción, omisión o trato negligente no accidental que priva a un menor de sus derechos y bienestar y amenaza su desarrollo. Polivictimización: sufrir varias formas de victimización.",
  ["Maltrato prenatal: daño al feto.","Negligencia o abandono: no se cubren sus necesidades básicas (incluye el absentismo).","Instrumentalización: manipulación contra el otro progenitor o violencia vicaria (dañar a los hijos para dañar a la madre/padre).","Abuso sexual y explotación sexual (si hay ganancia).","Explotación laboral o mendicidad.","Corrupción y maltrato médico-farmacéutico (p. ej., síndrome de Münchhausen por poderes).","Acoso: bullying (escolar), cyberbullying (en redes) y grooming (un adulto engaña al menor por internet con fines sexuales).","Bandas juveniles violentas.","Factores de riesgo: entorno familiar deficitario, entorno social adverso, características del menor (salud frágil, discapacidad) y servicios de protección deficitarios."]],
 ["2.3.3. Violencia contra la mujer","La violencia machista es la que se ejerce sobre las mujeres como manifestación de la desigualdad y las relaciones de poder de los hombres sobre ellas, en cualquier ámbito. La violencia de género es la que ejerce un hombre sobre una mujer que es o ha sido su pareja (aunque no convivan). Es progresiva y cíclica; su extremo es el feminicidio.",
  ["Ciclo, fase 1: construcción de la tensión (agresiones leves que aumentan).","Ciclo, fase 2: explosión violenta.","Ciclo, fase 3: calma o luna de miel (arrepentimiento, regalos, manipulación y culpa). Se repite cada vez con más intensidad; solo se rompe con la denuncia o la intervención de terceros.","Ámbito familiar: mutilación genital, matrimonio forzado, desescolarización de niñas, crímenes de honor.","Ámbito laboral: acoso sexual y por razón de sexo.","Medios y publicidad: cánones de belleza y modelos desiguales.","Social: hostigamiento verbal, agresiones sexuales, tráfico de mujeres, feminicidio.","Institucional: revictimización en el sistema judicial.","Más vulnerables: menores y adolescentes, mujeres con discapacidad, en exclusión, del medio rural, inmigrantes y trabajadoras sexuales."]],
 ["2.3.4. Maltrato a personas mayores o dependientes","Acción única o repetida, o falta de respuesta, que causa daño a una persona mayor o dependiente en una relación de confianza. Prevalecen el maltrato económico y la negligencia; suele ser invisible.",
  ["Vulneración de derechos: no respetar su opinión ni su proyecto de vida.","Obstinación diagnóstica: pruebas médicas sin beneficio real para la persona.","Obstinación terapéutica: alargar artificialmente la vida en enfermedad terminal.","Factores de riesgo: de la víctima (dependencia, aislamiento), de quien maltrata (sobrecarga, adicciones, dependencia económica), del entorno (edadismo, pobreza) y de las instituciones (personal poco preparado)."]],
 ["2.4. Indicadores de riesgo de exclusión","Un indicador es una señal, dato o hecho observable que revela riesgo o exclusión. Son indicios, no pruebas: hay que ver si se acumulan y analizar el caso en su globalidad.",
  ["Personales: de salud (enfermedad, discapacidad, adicciones), competenciales (déficits en AVD, bajo nivel educativo) y psicosociales (baja autoestima, falta de alternativas, actividades ligadas a la exclusión, restricciones a la ciudadanía).","Materiales: escasez económica (por debajo del 60 % del salario mínimo), baja intensidad de trabajo (menos del 20 % del potencial), privación material severa, vivienda inadecuada y entorno deteriorado.","Relacionales y sociales: familia desestructurada, pertenencia a grupos estigmatizados, conflictos con el entorno, falta de apoyo.","Violencia familiar: en la víctima (lesiones sin explicación, sumisión, aislamiento, absentismo), en el agresor (quiere estar siempre presente, no deja hablar a la víctima) y en el entorno (antecedentes, control de horarios)."]],
 ["2.5. Necesidades y demandas","Una necesidad es todo lo que una persona tiene que satisfacer para mantener la vida, la salud y el bienestar. Una demanda es la forma en que la persona o el colectivo expresa que quiere cubrirla y pide apoyo profesional. Lo que se pide y lo que se necesita pueden no coincidir.",
  ["Demanda explícita: se formula con claridad.","Demanda implícita: no se expresa abiertamente; hay que interpretarla.","Demanda inespecífica: la persona no llega a definirla; hay que acompañarla.","Ausencia de demanda: no pide nada (por no ser consciente o por miedo); hace falta un acompañamiento más profundo.","Modelos de necesidades: pirámide de Maslow (5 niveles), modelo biopsicosocial (necesidades biológicas, psíquicas y sociales) y modelo de derechos humanos (básicas, servicios fundamentales, trabajo digno y libertades y participación).","Cada colectivo tiene necesidades propias: p. ej., lo sanitario para LGTBIQ+, lo administrativo para inmigrantes."]],
 ["2.6. La reinserción social","Proceso de adaptarse o readaptarse a la sociedad tras haber estado fuera (prisión, centros psiquiátricos o de menores, años en la calle, sectas).",
  ["Factores que la facilitan: motivación, capacidad de entender las consecuencias, redes de apoyo, nivel socioeducativo, buena salud sin adicciones y no tener historial de reincidencia.","Factores que la dificultan: carencias personales (falta de autocrítica o empatía), aislamiento, entorno conflictivo, adicciones e identidad ligada a la exclusión.","Prisionización: interiorizar la subcultura de la prisión y adoptar la identidad de «preso».","Programas: educativos (talleres, habilidades), psicoemocionales (autoestima, terapia) y sociales (familia, ocio, contacto con la comunidad).","Iniciativas: módulos terapéuticos (UTE), medidas penales alternativas (reparar el daño, trabajos en beneficio de la comunidad) y terapia asistida con animales.","Tipos de programas: de reconducción de conducta (violencia, violencia de género, delitos sexuales, violencia contra la infancia), para personas con déficits sociales (extranjeros, jóvenes menores de 25) y terapéuticos (salud mental y adicciones)."]]
],
trucos:["Triple ruptura = E‑R‑S: Estructural (el sistema no llega), Relacional (me quedo sin red), Subjetiva (lo que siento y sufro).","Las 3 zonas como un semáforo: verde inclusión, ámbar vulnerabilidad, rojo exclusión. Y se puede cambiar de color en las dos direcciones.","Ciclo de la violencia = T‑E‑L: Tensión, Explosión, Luna de miel… y vuelta a empezar más fuerte.","Demandas: EXPLÍCITA lo dice claro, IMPLÍCITA lo insinúa, INESPECÍFICA no sabe qué pedir, AUSENCIA no pide nada."],
cards:[
 ["Inclusión social","Aceptación de una persona o grupo y su participación plena en la vida social, económica y cultural."],
 ["Exclusión social","Rechazo que impide a una persona o grupo acceder al desarrollo personal, la participación y la protección oficial."],
 ["Zona de vulnerabilidad","Zona intermedia de inestabilidad y precariedad laboral, económica y sanitaria (riesgo social)."],
 ["Sistemas naturales de inclusión","Familia, iguales y vecindad: dan identidad, protección y pertenencia. Clave: la reciprocidad."],
 ["Tercer sector","Entidades privadas sin ánimo de lucro (ONG, cooperativas, fundaciones) que reinvierten todo en su misión."],
 ["Sistemas formales de inclusión","La acción pública: pensiones, sanidad, educación, servicios sociales y leyes."],
 ["Triple ruptura","La exclusión afecta a la vez a las dimensiones estructural, relacional y subjetiva."],
 ["Exclusión procesual","No es un estado definitivo, sino un proceso reversible."],
 ["Democratización del riesgo","Hoy la vulnerabilidad ya no es exclusiva de grupos marginales: cualquiera puede verse en riesgo."],
 ["Etnocidio","Destrucción de la cultura de un grupo."],
 ["Guetización","Concentrar a un grupo vulnerable en espacios y recursos distintos al resto."],
 ["Aporofobia","Rechazo a la pobreza y a las personas pobres."],
 ["Capacitismo","Prejuicio o discriminación hacia las personas con discapacidad."],
 ["Aculturación","Abandonar los rasgos de la propia cultura para incorporar los del grupo dominante."],
 ["Naturalización de la exclusión","Ver la desventaja como natural, inevitable o culpa de la persona excluida."],
 ["Eje de desigualdad","Aspecto que, en cualquier ámbito, hace a la persona más vulnerable (sexo, edad, clase, territorio…)."],
 ["Pobreza relativa","No llegar al nivel de vida mínimo del territorio; Eurostat: ingresos inferiores al 60 % de la media."],
 ["Pobreza absoluta / subjetiva","Absoluta: no cubre mínimos de subsistencia. Subjetiva: la persona siente que no le llega."],
 ["Factores de protección","Condiciones que reducen o atenúan la posibilidad de riesgo o exclusión."],
 ["Interculturalidad","Los grupos culturales se relacionan, se conocen y se enriquecen mutuamente (no solo conviven)."],
 ["Multiculturalidad","Los grupos conviven en un territorio respetándose pero separados, sin conocerse."],
 ["Maltrato infantil","Acción, omisión o negligencia no accidental que priva al menor de sus derechos y amenaza su desarrollo."],
 ["Violencia vicaria","Dañar o amenazar a los hijos para hacer daño al otro progenitor."],
 ["Grooming","Un adulto engaña a un menor por internet, gana su confianza y lo extorsiona con fines sexuales."],
 ["Violencia machista","La ejercida sobre las mujeres como manifestación de la desigualdad y el poder de los hombres sobre ellas."],
 ["Violencia de género","La que ejerce un hombre sobre una mujer que es o ha sido su pareja, aunque no convivan."],
 ["Feminicidio","Asesinato de una mujer por el hecho de serlo; extremo del continuo de la violencia."],
 ["Obstinación terapéutica","Usar medios desproporcionados para alargar artificialmente la vida en una enfermedad terminal."],
 ["Indicador de riesgo","Señal, dato o hecho observable que revela riesgo o exclusión. Es un indicio, no una prueba."],
 ["Necesidad","Todo lo que una persona tiene que satisfacer para mantener la vida, la salud y el bienestar."],
 ["Demanda implícita","La persona no expresa abiertamente lo que necesita; hay que interpretarlo."],
 ["Reinserción social","Proceso de adaptarse o readaptarse a la sociedad tras haber estado fuera de ella."],
 ["Prisionización","Interiorizar la subcultura de la prisión y adoptar la identidad de preso."]
],
quiz:[
 ["La exclusión social es…",["Un proceso reversible","Un estado fijo y definitivo","Siempre culpa de la persona","Solo un problema económico"],"Es procesual: tanto el proceso como la situación son reversibles."],
 ["Una persona pierde el trabajo y su familia le da la espalda. ¿Qué dimensión de la triple ruptura aparece con la familia?",["Relacional","Estructural","Subjetiva","Económica"],"La dimensión relacional es la ruptura de la red natural de apoyo."],
 ["Las ONG, cooperativas y fundaciones forman parte de los sistemas…",["Organizados (tercer sector)","Naturales","Formales","Penitenciarios"],"Son iniciativas privadas de la sociedad civil."],
 ["Rechazar a las personas pobres se llama…",["Aporofobia","Xenofobia","Capacitismo","Edadismo"],"Es el rechazo a la pobreza y a quien la sufre."],
 ["Que una escuela de barrio acabe teniendo casi solo alumnado extranjero es un ejemplo de…",["Guetización (segregación institucional)","Etnocidio","Interculturalidad","Reinserción"],"Se concentra a un grupo en recursos diferentes a los del resto."],
 ["Según Eurostat, está en pobreza relativa quien tiene ingresos inferiores al…",["60 % de la media del país","20 % de la media","90 % de la media","Salario mínimo exacto"],"Es el umbral europeo de pobreza relativa."],
 ["En la interculturalidad, los grupos…",["Se relacionan y se enriquecen mutuamente","Viven separados sin conocerse","Abandonan su cultura","Se enfrentan siempre"],"En la multiculturalidad solo coexisten; en la interculturalidad interactúan."],
 ["¿En qué fase del ciclo de la violencia el agresor se arrepiente y hace regalos?",["Calma o luna de miel","Construcción de la tensión","Explosión violenta","Denuncia"],"La manipulación afectiva refuerza que la mujer siga en la relación."],
 ["Un adulto se hace pasar por adolescente en internet para ganarse la confianza de una niña y abusar de ella. Es…",["Grooming","Bullying","Violencia vicaria","Negligencia"],"Es el engaño pederasta a través de las redes."],
 ["Usar a los hijos para hacer daño a la expareja es…",["Violencia vicaria","Maltrato prenatal","Explotación laboral","Obstinación terapéutica"],"Es una forma de instrumentalización de los menores."],
 ["Una persona acude a servicios sociales sin pedir nada concreto porque no sabe qué necesita. Su demanda es…",["Inespecífica","Explícita","Implícita","Inexistente por voluntad"],"Hay que acompañarla para identificar sus necesidades."],
 ["Encontrar un único indicador de riesgo en una familia significa que…",["Hay un indicio que hay que contrastar","La familia está excluida","Hay que retirar a los menores","No significa nada"],"Los indicadores son indicios, no pruebas: se valora su acumulación y el caso global."],
 ["Interiorizar la subcultura de la cárcel y la identidad de «preso» se llama…",["Prisionización","Resiliencia","Aculturación","Socialización primaria"],"Dificulta la reinserción porque choca con la vida en sociedad."],
 ["Que hoy cualquier persona pueda verse en situación de vulnerabilidad se llama…",["Democratización del riesgo","Naturalización de la exclusión","Triple ruptura","Interculturalidad"],"Las crisis y la precariedad han extendido el riesgo a toda la población."],
 ["La violencia de género, según el libro, es la que…",["Ejerce un hombre sobre su pareja o expareja mujer","Ejerce cualquier persona sobre otra","Solo ocurre si conviven","Se da solo en el trabajo"],"La violencia machista es más amplia y se da en cualquier ámbito."]
]

U("contexto", {
n:3, title:"El marco de la intervención social",
secs:[
 ["3.1. La intervención social","La intervención o acción social es cualquier acción o conjunto de acciones planificadas para mejorar las condiciones sociales de una persona o grupo. Debe atender a las personas vulnerables, crear entornos que acojan la diferencia y fomentar la autonomía y la participación. Es más eficaz si se dirige a grupos o sectores concretos.",[]],
 ["3.1.1. Tipos de acciones","Según el objetivo que priorizan, las acciones son:",
  ["Preventivas: eliminan o reducen los factores de riesgo (currículos sobre diversidad y equidad, campañas de sensibilización contra estereotipos).","De promoción: refuerzan los factores de protección y la autonomía (programas de orientación laboral, incentivos a contratar a personas vulnerables).","De reinserción: acompañan la vuelta a la sociedad (formación en habilidades laborales, empleo protegido)."]],
 ["3.1.2. Discriminación positiva","La discriminación positiva o acción positiva es un conjunto de prácticas que compensan las desventajas de un grupo históricamente discriminado para avanzar hacia la igualdad de oportunidades. Beneficia específicamente al grupo desfavorecido. Puede generar tensiones: algunos la perciben como discriminación inversa.",
  ["Laboral: cuotas de reserva de empleo, contratación preferente, flexibilidad y teletrabajo para conciliar.","Residencial: cupos en viviendas de alquiler, prioridad en vivienda pública, ayudas preferentes.","Educativo: criterios de compensación en la admisión y reserva de plazas."]],
 ["3.1.3. Evolución histórica de la acción social","La forma de atender la alteridad (discapacidad, enfermedad, pobreza…) ha cambiado mucho:",
  ["Antigüedad: cuidado de mayores y enfermos desde el Neolítico, pero también exclusión por «impureza». Grecia trató las enfermedades como algo biofísico; Roma creó el Estado y la idea de humanitas (antecedente de la beneficencia).","Edad Media: caridad cristiana. Hospitales, leproserías, casas de huérfanos y misericordia bajo la Iglesia; iniciativas de benefactores; auxilio de los gremios.","Renacimiento: secularización de la pobreza. Las administraciones asumen la atención (impuestos de beneficencia), pero también se reprime la mendicidad.","Industrialización (s. XVII‑XIX): encierro de la alteridad en hospitales generales, hospicios, penitenciarías, asilos y manicomios; nace la psiquiatría.","Beneficencia (tras la Revolución francesa): el Estado atiende por civismo, no como deber. En España: Reglamento General de Beneficencia Pública (1822) y Ley General de Beneficencia (1849).","Asistencia social: la ayuda empieza a verse como un derecho. Movimiento obrero y leyes: Accidentes de Trabajo (1900), Trabajo de Mujeres y Niños (1900), Descanso Semanal (1904), Huelga (1909). Instituto Nacional de Previsión (antecedente de la Seguridad Social) e Instituto de Reformas Sociales. Mutualidades y montepíos.","Segunda República: Constitución de 1931 (no discriminación, enseñanza primaria gratuita, salario mínimo, seguros sociales). La Guerra Civil y la dictadura frenaron los avances hasta la democracia."]],
 ["3.1.4. El estado del bienestar","Tras la Segunda Guerra Mundial, los Estados asumieron ser garantes del bienestar con prestaciones en cuatro ámbitos: sanidad, seguridad social, educación y servicios sociales. Modelos:",
  ["Liberal o anglosajón (Reino Unido, Irlanda): predomina lo privado y los seguros; el Estado solo cubre a quien demuestra necesidad.","Conservador o continental (Francia, Alemania, Bélgica…): se apoya en la familia y en seguros contributivos (se cotiza para recibir).","Socialdemócrata o nórdico (Suecia, Dinamarca, Noruega…): universal por ciudadanía, financiado con impuestos altos.","Mediterráneo (España, Italia, Grecia, Portugal): llegó tarde (años 70‑80); la familia y lo privado pesan mucho. En España: sanidad básica y educación obligatoria universales, prestaciones contributivas y atención a la dependencia con pocos recursos.","Crisis del estado del bienestar: menos ingresos y más necesidades → endeudamiento, recortes, copagos y privatización. «Nanny state» (estado niñera) es una crítica a las políticas muy protectoras."]],
 ["3.2. Jerarquía normativa","La acción social es una competencia transferida y se regula en niveles internacional, estatal, autonómico y local. Si hay conflicto prevalece la norma de rango superior. De mayor a menor:",
  ["1. Constitución Española.","2. Reglamentos y directivas de la UE aplicables directamente.","3. Tratados internacionales ratificados por España.","4. Leyes de las Cortes (orgánicas y ordinarias) y estatutos de autonomía.","5. Reales decretos ley y reales decretos legislativos.","6. Reales decretos y órdenes ministeriales.","7. Leyes y reglamentos autonómicos.","8. Ordenanzas, reglamentos y bandos locales."]],
 ["3.2.1. Marco internacional","Las instituciones internacionales no pueden obligar del todo, pero influyen mucho.",
  ["ONU (1945): Declaración Universal de los Derechos Humanos y Agenda 2030 con 17 Objetivos de Desarrollo Sostenible (ODS).","Organismos de la ONU: PNUD (desarrollo), ONU‑Hábitat (vivienda), FAO y PMA (alimentación), OMS y ONUSIDA (salud), OIT (trabajo), UNESCO (educación), UNICEF (infancia), ONU Mujeres, OIM y ACNUR (migrantes y refugiados).","Tribunal Penal Internacional (La Haya): juzga genocidio, crímenes de guerra y crímenes contra la humanidad."]],
 ["3.2.2. Marco europeo","La Unión Europea apoya y complementa a los Estados, que deben trasladar sus normas.",
  ["Carta de Derechos Fundamentales de la UE (2000, reformada en 2007): obligatoria; incluye derecho a seguridad y ayuda social.","Pilar Europeo de Derechos Sociales (2017): 20 principios (p. ej., renta mínima y alojamiento para personas sin hogar).","Comité de Protección Social: coordina pensiones, sanidad y cuidados.","Fondos europeos: Fondo Social Europeo (FSE) y Mecanismo de Recuperación y Resiliencia."]],
 ["3.2.3. Marco estatal: la Constitución","La Constitución Española define España como Estado social y democrático de derecho y autonómico; proclama la dignidad de las personas y obliga a promover la libertad e igualdad efectivas. Los servicios sociales los desarrollan las comunidades autónomas. Tres grupos de derechos:",
  ["Derechos fundamentales y libertades públicas: educación, asociación, huelga, sindicación. Su cambio exige reforma constitucional.","Derechos y deberes de la ciudadanía: exigibles, pero necesitan leyes (trabajo, matrimonio, propiedad).","Principios rectores de la política social y económica: no son exigibles directamente (vivienda, salud, cultura, Seguridad Social, discapacidad).","En 2024 se reformó el art. 49: «disminuidos» pasó a «personas con discapacidad»."]],
 ["Leyes estatales por sectores","Algunas de las normas más importantes:",
  ["Económico: Ley 19/2021 del Ingreso Mínimo Vital (compatible con trabajar para evitar la «trampa de pobreza»).","Laboral: Estatuto de los Trabajadores (1980; RD Leg. 2/2015) y Ley 3/2023 de Empleo.","Residencial: Ley 12/2023 por el derecho a la vivienda (zonas tensionadas, límite a subidas del alquiler, grandes tenedores).","Salud: Ley 16/2003 de cohesión y calidad del SNS y Ley 33/2011 General de Salud Pública; quien reside más de 90 días tiene derecho a asistencia.","Educación: LOMLOE (LO 3/2020); FP (LO 3/2022).","Protección social: Ley General de la Seguridad Social (RD Leg. 8/2015).","Infancia: Observatorio de la Infancia y LO 8/2021 de protección integral frente a la violencia («Ley del menor»).","Mayores y dependencia: Imserso y Ley 39/2006 de Dependencia (crea el SAAD).","Discapacidad: Real Patronato sobre Discapacidad, Convención de la ONU (2006) y Ley 6/2022.","Igualdad: LO 1/2004 contra la Violencia de Género, LO 10/2022 de libertad sexual («solo sí es sí»), Ley 4/2023 trans y LGTBI (autodeterminación desde los 14, prohíbe terapias de conversión) y LO 3/2007 de igualdad efectiva.","Extranjería: LO 4/2000 (entrada, estancia, derechos, reagrupación, menores, refugio)."]],
 ["3.2.4‑3.2.6. Marco autonómico, local y planes","El Estatuto de Autonomía es la norma institucional básica de cada comunidad. Las autonomías tienen leyes de servicios sociales, educativas y sanitarias propias. Los entes locales (ayuntamientos, diputaciones, cabildos, comarcas, mancomunidades) se rigen por la Ley 7/1985 de Bases del Régimen Local (reformada por la Ley 27/2013).",
  ["Funciones locales: gestionar servicios sociales básicos, financiar servicios de proximidad (comida a domicilio), planes locales de inclusión participativos y apoyo a la participación ciudadana.","Plan estratégico: documento con líneas de actuación y acciones para alcanzar objetivos en un periodo de tiempo.","Tipos de planes: generales de inclusión y cohesión social, y específicos para ámbitos o colectivos (familias, discapacidad, pobreza, adicciones)."]],
 ["3.3. La protección social","Es el conjunto de medidas y recursos que la Administración pone en marcha para garantizar el bienestar y reducir la vulnerabilidad (derecho recogido en los arts. 22 y 23 de la DUDH). Busca cubrir las necesidades básicas, garantizar derechos laborales y asegurar rentas mínimas (subsidios, Ingreso Mínimo Vital). Beneficia a toda la sociedad. Sectores:",
  ["Económico: pensiones, garantía de renta y redistribución; propuestas como la renta básica o los microcréditos.","Laboral: inserción sociolaboral y economía social (cooperativas).","Educativo: refuerzo de la escuela pública, apoyo escolar, aulas de acogida, formación de adultos.","Salud: asistencia universal (también a personas en situación irregular), programas de salud, préstamo de productos de apoyo.","Residencial: mantener y acceder a la vivienda, regular el alquiler, viviendas de emergencia, VPO y lucha contra la pobreza energética.","Relacional: espacios de encuentro, consejos de participación y voluntariado.","Cultural: envejecimiento activo, deporte y equipamientos culturales accesibles.","Jurídico: justicia gratuita, protección de menores y prisiones orientadas a la reinserción."]],
 ["3.3.2. Los cuatro sistemas de protección social","Un sistema de protección social es un conjunto de instituciones y normas que regulan las prestaciones sociales y su financiación. En España hay cuatro:",
  ["Sistema Nacional de Salud (SNS): universal, equitativo y descentralizado. Copago farmacéutico del 0 al 60 %.","Sistema Nacional de Empleo: SEPE y servicios autonómicos (fomento del empleo, prestaciones por desempleo, formación).","Seguridad Social: INSS, ISM y Tesorería (pensiones, incapacidad, nacimiento, IMV…).","Servicios sociales: recursos y prestaciones de las Administraciones para necesidades específicas. Niveles: atención básica o primaria (puerta de entrada, local) y especializados (colectivos concretos).","Prestaciones garantizadas: derecho subjetivo, exigible incluso judicialmente.","Prestaciones no garantizadas o condicionadas: dependen del presupuesto disponible."]],
 ["3.4. El/la profesional de la integración social","La profesionalización viene de la Charity Organization Society (1869), las corrientes pedagógicas y las escuelas de formación. En España: Diplomatura de Trabajo Social (1990), de Educación Social (1992) y Técnico Superior en Integración Social (1995). Trabaja en equipo interdisciplinar.",
  ["Aptitudes: respeto y sinceridad, responsabilidad y compromiso, objetividad y serenidad (evitar el burnout), flexibilidad y creatividad.","Ámbitos: comunitario (a pie de calle, mediación), ocupacional (inserción laboral), residencial (centros, familias) y escolar (apoyo, prevención del acoso).","Funciones: recopilar y analizar información, diseñar y gestionar actuaciones, gestiones administrativas, itinerarios personalizados y acompañamiento, entrenamiento en habilidades, colaborar con la comunidad, generar conciencia crítica y mediar en conflictos."]],
 ["3.4.2. Principios éticos y deontológicos","Guían el comportamiento profesional:",
  ["Trato igualitario y respetuoso, sin discriminación.","Usar instrumentos éticos que no etiqueten ni atenten contra la dignidad.","Tener en cuenta las decisiones de la persona usuaria (también para terminar la intervención).","Confidencialidad y secreto profesional.","Profesionalidad: no crear relaciones de dependencia afectiva o íntima.","Velar por el buen desempeño: denunciar malas prácticas e intrusismo.","Difundir información veraz sobre los colectivos.","Cooperar con el equipo sin invadir funciones y asumir las decisiones de equipo.","Potenciar los recursos personales y del entorno."]]
],
trucos:["Modelos del bienestar N‑C‑L‑M: Nórdico = la Nación paga a todos · Continental = Cotizas y cobras · Liberal = Lo mínimo · Mediterráneo = Mamá (la familia) ayuda.","Historia de la acción social: CARIDAD (Iglesia) → BENEFICENCIA (Estado por civismo) → ASISTENCIA (empieza a ser derecho) → BIENESTAR (el Estado garantiza).","Los 4 sistemas de protección: «SESE»: Salud, Empleo, Seguridad social, sErvicios sociales."],
cards:[
 ["Intervención social","Acción o conjunto de acciones planificadas para mejorar las condiciones sociales de una persona o grupo."],
 ["Acciones preventivas","Eliminan o reducen los factores de riesgo antes de que aparezca la exclusión."],
 ["Acciones de promoción","Refuerzan los factores de protección y la autonomía para favorecer la inclusión."],
 ["Acciones de reinserción","Acompañan la reincorporación a la sociedad (formación laboral, empleo protegido)."],
 ["Discriminación positiva","Prácticas que compensan las desventajas de un grupo históricamente discriminado para lograr igualdad de oportunidades."],
 ["Discriminación inversa","Percepción del grupo no beneficiado de que la acción positiva le perjudica."],
 ["Beneficencia","Atención del Estado tras la Revolución francesa entendida como civismo, no como deber. En España, leyes de 1822 y 1849."],
 ["Instituto Nacional de Previsión","Fundado a principios del siglo XX; antecedente del sistema de Seguridad Social."],
 ["Estado del bienestar","El Estado garantiza sanidad, seguridad social, educación y servicios sociales a quien no puede lograrlos solo."],
 ["Modelo liberal","Predomina lo privado; el Estado solo cubre a quien demuestra necesidad (Reino Unido, Irlanda)."],
 ["Modelo mediterráneo","España, Italia, Grecia, Portugal: llegó tarde y la familia y lo privado tienen gran peso."],
 ["Jerarquía normativa","Principio por el que, en caso de conflicto, prevalece la norma de rango superior."],
 ["Agenda 2030","Plan de la ONU (2015) con 17 Objetivos de Desarrollo Sostenible (ODS)."],
 ["Tribunal Penal Internacional","Tribunal de La Haya que juzga genocidio, crímenes de guerra y contra la humanidad."],
 ["Pilar Europeo de Derechos Sociales","20 principios (2017) para mercados de trabajo y protección social justos."],
 ["Principios rectores (CE)","Derechos como vivienda o salud que guían la política pero no son exigibles directamente."],
 ["Ingreso Mínimo Vital","Prestación (Ley 19/2021) que garantiza ingresos mínimos y es compatible con trabajar."],
 ["Ley 39/2006","Ley de Dependencia: crea el Sistema para la Autonomía y Atención a la Dependencia (SAAD)."],
 ["LO 1/2004","Ley de Medidas de Protección Integral contra la Violencia de Género."],
 ["Ley 4/2023","Igualdad real de las personas trans y derechos LGTBI: autodeterminación de género desde los 14 años."],
 ["LO 4/2000","Ley de extranjería: entradas, estancia, derechos, reagrupación, menores y refugio."],
 ["Estatuto de Autonomía","Norma institucional básica de una comunidad o ciudad autónoma."],
 ["Plan estratégico","Documento con líneas de actuación y acciones para alcanzar objetivos en un periodo determinado."],
 ["Protección social","Medidas y recursos de la Administración para garantizar el bienestar y reducir la vulnerabilidad."],
 ["Sistema de protección social","Instituciones y normas que regulan las prestaciones sociales y su financiación."],
 ["Servicios sociales de atención básica","Primer nivel y puerta de entrada al sistema; locales (información, ayuda a domicilio, comedor social)."],
 ["Prestación garantizada","Derecho subjetivo: se puede exigir (incluso judicialmente) si se cumplen los requisitos."],
 ["Prestación condicionada","Depende de la disponibilidad presupuestaria y de los criterios de prioridad."],
 ["Copago","Parte del coste de un servicio o medicamento que paga la persona usuaria."],
 ["Ámbitos del integrador/a social","Comunitario, ocupacional, residencial y escolar."]
],
