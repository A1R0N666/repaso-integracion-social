cambio. Las tensiones pueden dar lugar a conflictos, que son naturales; bien gestionados mejoran la comunicación y los vínculos, mal gestionados llevan a la confrontación.</p><h4 style="font-size:18px;margin:16px 0 4px">1.1.1. La mediación</h4><p>La mediación es un proceso estructurado de resolución de conflictos en el que una persona imparcial facilita el diálogo entre las partes para que lleguen a un acuerdo satisfactorio para todas.</p><ul><li><b>Proceso estructurado:</b> con fases definidas.</li><li><b>Voluntariedad:</b> se participa libremente y se puede abandonar.</li><li>Figura mediadora imparcial que facilita el diálogo y aclara posiciones.</li><li>El acuerdo lo alcanzan las propias partes.</li><li><b>Historia:</b> Antigüedad (Mesopotamia, Egipto, Grecia, China y Japón; el juicio de Salomón), Edad Media (reyes, clérigos, gremios; el Tribunal de las Aguas de Valencia desde el siglo XIII), Edad Moderna (más reglada), siglo XIX (conflictos laborales, sindicatos) y siglo XX (método alternativo; la mediación comunitaria se consolida con los movimientos pacifistas y de derechos civiles).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.1.2. La comunidad</h4><p>Una comunidad es un grupo de personas que comparten un entorno y establecen vínculos, generando normas, valores y un sentido de pertenencia. Elementos: personas que interactúan, actividades y experiencias compartidas, normas y valores compartidos y, a menudo, un territorio definido.</p><ul><li><b>Comunidades territoriales:</b> barrio, localidad, comunidad de vecinos (ruidos, espacios comunes).</li><li><b>Comunidades educativas:</b> docentes, alumnado y familias.</li><li><b>Comunidades laborales:</b> personas de una misma organización o sector.</li><li><b>Comunidades culturales e identitarias:</b> lengua, religión, historia; aquí es clave la mediación intercultural.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.1.3. La mediación comunitaria</h4><p>Es un proceso de resolución de conflictos basado en la técnica de la mediación y en la participación activa de la comunidad. No solo resuelve el problema inmediato: tiene en cuenta su impacto en la colectividad y promueve la comunicación, el reconocimiento mutuo y la corresponsabilidad.</p><ul><li><b>Ámbito:</b> espacios de convivencia continua (barrios, asociaciones, centros educativos).</li><li><b>Participación activa de la comunidad:</b> otros agentes pueden facilitar el diálogo.</li><li>Carácter preventivo y restaurativo.</li><li>Voluntariedad e imparcialidad.</li><li><b>La mirada comunitaria:</b> ver los conflictos como parte de una estructura social interconectada y no como problemas aislados; busca soluciones cooperativas y sostenibles.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.2.1. La finalidad de la mediación comunitaria</h4><p>Según los objetivos de la intervención:</p><ul><li><b>Preventiva:</b> detectar tensiones a tiempo y diseñar estrategias para evitar nuevos conflictos.</li><li><b>Educativa:</b> enseñar a gestionar los conflictos dialogando (comunicación, negociación, resolución de problemas); crea una cultura de paz.</li><li><b>Reparadora:</b> restaurar relaciones dañadas y reparar el daño (justicia restaurativa); previene la reincidencia.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.2.2. Los principios de la mediación comunitaria</h4><p>Orientan la labor de la persona mediadora:</p><ul><li><b>Voluntariedad:</b> participación libre; se puede abandonar en cualquier momento.</li><li><b>Imparcialidad:</b> no favorecer a ninguna parte.</li><li><b>Confidencialidad:</b> no divulgar lo compartido sin consentimiento; espacio seguro.</li><li><b>Neutralidad:</b> no imponer soluciones ni influir en las decisiones.</li><li><b>Buena fe:</b> sinceridad y compromiso real.</li><li><b>Participación activa:</b> implicarse en la construcción de acuerdos.</li><li><b>Enfoque restaurativo:</b> reconstruir relaciones y confianza.</li><li><b>Adaptación cultural y contextual:</b> ajustarse a cada comunidad.</li><li><b>Acceso equitativo:</b> que todas las personas puedan resolver sus conflictos de forma justa y accesible.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.2.3. Los modelos de mediación</h4><p>En la práctica se combinan, pero cada uno da pautas:</p><ul><li><b>Tradicional lineal (Harvard):</b> soluciones pragmáticas basadas en intereses. Principios: separar a las personas del problema, centrarse en los intereses y no en las posiciones, explorar múltiples opciones y usar criterios objetivos.</li><li><b>Transformativo:</b> transformar a las personas y sus relaciones para que resuelvan solas futuros conflictos. Principios: empoderamiento (recuperar el control) y reconocimiento (comprender a la otra parte). El mediador es menos directivo; no garantiza un acuerdo inmediato.</li><li><b>Circular-narrativo:</b> el conflicto es un relato; busca cambiar la historia que cuenta cada parte. Principios: causalidad circular (no hay una única causa) y comunicación circular (el diálogo evoluciona).</li><li><b>Interdisciplinario:</b> integra psicología, sociología, derecho y trabajo social. Principios: enfoque holístico, trabajo en equipo y flexibilidad metodológica.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.3.1. Ámbitos de aplicación</h4><p>Los ámbitos a veces se solapan (p. ej., absentismo escolar que afecta al barrio).</p><ul><li><b>Conflictos vecinales y de convivencia:</b> ruidos, espacios comunes, recursos compartidos.</li><li><b>Centros educativos:</b> alumnado, profesorado y familias.</li><li>Intercultural y procesos migratorios.</li><li>Espacios asociativos y participación ciudadana.</li><li><b>Ámbito penitenciario y justicia restaurativa:</b> reparar el daño en lugar de solo castigar; la persona responsable entiende las consecuencias y la afectada es escuchada.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.3.2. Los servicios de mediación comunitaria</h4><p>Impulsados sobre todo por la Administración pública, a veces con el tercer sector.</p><ul><li><b>Equipo:</b> personas mediadoras (dirigen el proceso) y personal de supervisión técnica (supervisa, garantiza los principios y forma).</li><li><b>Relación con otros servicios:</b> derivación al servicio (desde servicios sociales, educativos, policiales o judiciales) y derivación desde el servicio (a apoyo psicológico, legal o social).</li><li><b>Ubicación:</b> fija (oficinas municipales) o itinerante (equipos que se desplazan a barrios con más necesidades).</li><li><b>Recursos:</b> materiales de difusión y documentación de trabajo (protocolos, guías, formularios, registros de acuerdos).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.3.3. Marco normativo</h4><p>Garantiza imparcialidad, confidencialidad y voluntariedad:</p><ul><li><b>Europea:</b> Directiva 2008/52/CE (mediación en conflictos transfronterizos) y Reglamento (CE) 2201/2003 (responsabilidad parental, conflictos familiares internacionales).</li><li><b>Estatal:</b> Ley 5/2012 de mediación en asuntos civiles y mercantiles (principios, papel del mediador, reconocimiento de acuerdos). El Real Decreto 980/2013 la desarrolla: formación mínima obligatoria, registro oficial de mediadores y seguro de responsabilidad civil.</li><li><b>Autonómica:</b> cada comunidad puede regular la mediación comunitaria.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.4.1. Igualdad: perspectiva de género</h4><p>La mediación debe tratar a todas las personas con equidad y crear condiciones de participación real. La perspectiva de género es un enfoque analítico para examinar y cuestionar las desigualdades y relaciones de poder entre los géneros. Sexo: características biológicas. Género: construcción social de normas y roles. Estereotipos de género: creencias sobre cómo debe comportarse cada género.</p><ul><li><b>Efectos de los estereotipos:</b> hombres que no muestran vulnerabilidad; mujeres que evitan la confrontación y ceden más; la voz masculina percibida con más autoridad; acceso desigual (si dependen de autorización familiar o recursos).</li><li><b>Estrategias:</b> espacios seguros y equitativos (representación equilibrada, confianza, prevenir dinámicas de poder), sesiones individuales previas y facilitar la comunicación (turnos, preguntas dirigidas).</li><li>Formación continua de las personas mediadoras en perspectiva de género.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.4.2. Perspectiva de no discriminación y límites</h4><p>Trato justo y equitativo sin que identidad, origen, religión, género, orientación o discapacidad supongan desventaja; enfoque proactivo. La persona mediadora debe revisar sus propios prejuicios.</p><ul><li>Crear un entorno seguro donde todas las voces se escuchen.</li><li>Detectar y corregir sesgos en el proceso.</li><li>Adaptar los procedimientos a personas vulnerables.</li><li><b>Límites (no mediables):</b> violencia de género (relación de poder desigual), conflictos altamente destructivos, falta de interés o boicot y conductas ilegales (fraude, corrupción, delitos graves).</li></ul><div style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Trucos:</b><ul><li>Los 4 principios básicos forman VINC (de vínculo): Voluntariedad, Imparcialidad, Neutralidad, Confidencialidad.</li><li>Finalidades = P‑E‑R: Prevenir, Educar, Reparar.</li><li>Modelos: HARVARD = negociar intereses · TRANSFORMATIVO = transformar a las personas · CIRCULAR‑NARRATIVO = reescribir la historia · INTERDISCIPLINARIO = juntar profesiones.</li></ul></div><h3 style="font-size:22px;margin:26px 0 8px">Tema 2. Los conflictos en mediación comunitaria</h3><h4 style="font-size:18px;margin:16px 0 4px">2.1. ¿Qué es un conflicto?</h4><p>Un conflicto es un estado de oposición o confrontación entre dos o más personas o grupos, provocado por discrepancias de intereses o por percepciones distintas sobre un hecho o idea. Está en todas las sociedades y no implica necesariamente violencia: su impacto depende de cómo se gestione. Condiciones: involucra a dos o más partes, hay una discrepancia (real o percibida) de intereses, valores, deseos o necesidades, y al menos una parte lo vive como algo problemático o injusto.</p><ul><li><b>Problema vs. conflicto:</b> el problema es una situación de dificultad basada en hechos demostrables (objetividad); el conflicto está dentro del problema y se centra en la relación y el desacuerdo entre las partes (subjetividad).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.1.1. ¿Por qué se producen?</h4><p>La diversidad no es el problema: el reto es cómo la gestionamos. Causas habituales:</p><ul><li>Diferencias de intereses o necesidades (dos asociaciones quieren el mismo local a la misma hora).</li><li>Diferencias de valores o creencias (centro cultural vs. derecho al descanso).</li><li>Problemas de comunicación o interpretación (malentendidos).</li><li>Factores estructurales o sociales (desigualdades en el acceso a recursos).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.1.2. ¿Cómo actuamos ante los conflictos?</h4><p>La forma de responder depende de factores personales (carácter, autoestima), relacionales y emocionales, sociales y culturales y situacionales (recursos, poder). Estrategias: ganar‑perder, perder‑perder y ganar‑ganar (la única que crea acuerdos duraderos). Estilos de afrontamiento:</p><ul><li><b>Evitación:</b> eludir el conflicto por miedo o incomodidad; puede prolongarlo o empeorarlo.</li><li><b>Competencia:</b> imponer el propio punto de vista (ganar‑perder).</li><li><b>Colaboración:</b> ambas partes buscan una solución que atienda las necesidades de todos; acuerdos sostenibles.</li><li><b>Adaptación:</b> una parte cede para evitar la confrontación; útil a veces, pero genera frustración si se repite.</li><li><b>Compromiso:</b> cada parte renuncia a algo para una solución intermedia; útil con poco tiempo o diferencias no profundas.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.1.3. Consecuencias</h4><p>Según sus efectos:</p><ul><li><b>Conflicto funcional:</b> bien gestionado, mejora la convivencia y fortalece relaciones (p. ej., crear normas consensuadas para un espacio común).</li><li><b>Conflicto disfuncional:</b> ignorado o mal gestionado, deteriora relaciones, genera desconfianza y puede cronificarse y debilitar el tejido social.</li><li><b>No hay conflictos puros:</b> uno puede pasar de funcional a disfuncional y al revés.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.2. Análisis: la teoría de las 3 pes</h4><p>Desarrollada por John Paul Lederach, divide el conflicto en tres componentes: Personas (quién), Proceso (cómo evoluciona) y Problema (el contenido).</p><h4 style="font-size:18px;margin:16px 0 4px">2.2.1. Las personas</h4><p>Hay que ir más allá de las posiciones y atender emociones, vínculos y necesidades.</p><ul><li><b>Por forma de representación:</b> individuos, grupos organizados y colectivos representados por portavoces.</li><li><b>Por implicación:</b> partes directas (participan y defienden su postura) e indirectas (no intervienen pero les afecta).</li><li><b>Por función:</b> protagonistas, personas mediadoras y mediadores naturales (sin ser profesionales, tienen legitimidad para acercar posturas).</li><li><b>Vínculos:</b> jerárquico (desequilibrio de poder), horizontal (igualdad formal, aunque puede haber poder informal), histórico o emocional (trayectoria compartida) y tenso o distante.</li><li><b>Posiciones:</b> lo que cada parte declara o exige.</li><li><b>Intereses:</b> las motivaciones detrás de la posición (lo que espera obtener o proteger).</li><li><b>Necesidades:</b> lo más profundo, en la base de los intereses (p. ej., poder descansar). Pirámide de Maslow: fisiológicas, seguridad, afiliación, reconocimiento y autorrealización.</li><li>Emociones (miedo, frustración, rabia) y valores (justicia, respeto, libertad) influyen en cómo se vive el conflicto.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.2.2. El proceso</h4><p>El proceso es el conjunto de dinámicas que conforman el desarrollo del conflicto a lo largo del tiempo. Los conflictos no aparecen de golpe y no siempre son lineales (son cíclicos). Conviene mirarlos en pasado (reparar), presente (transformar dinámicas) y futuro (construir relaciones nuevas).</p><ul><li><b>Fase latente:</b> existe pero no se expresa (clave: favorecer la toma de conciencia).</li><li><b>Fase de confrontación:</b> se hace explícito (contener la escalada, espacios seguros).</li><li><b>Fase de negociación:</b> se reconoce la interdependencia y se dialoga (acompañamiento y escucha activa).</li><li><b>Fase de transformación:</b> acuerdos y cambio en las relaciones (restablecer vínculos y reparar).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.2.3. El problema</h4><p>El problema es el motivo central del desacuerdo: lo que las partes perciben como una dificultad o amenaza. A menudo es solo la parte visible (iceberg del conflicto): debajo hay intereses, necesidades, emociones, expectativas ocultas o problemas del pasado. Cada parte puede definirlo de forma distinta.</p><ul><li><b>Mapa del conflicto:</b> representar gráficamente posiciones, intereses, causas y relaciones.</li><li>Análisis de posiciones, intereses y necesidades.</li><li><b>Escucha activa:</b> detectar matices e implícitos.</li><li><b>Paráfrasis y reformulación:</b> comprobar que lo entendido coincide con lo que se quería decir.</li><li><b>Preguntas abiertas:</b> favorecen la reflexión.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.3. Tipos de conflictos (I)</h4><p>Clasificar ayuda a adaptar la intervención.</p><ul><li><b>Mediables:</b> hay desacuerdo pero capacidad de dialogar y llegar a acuerdos.</li><li><b>No mediables:</b> violencia, abuso o vulneración de derechos (p. ej., violencia de género); la respuesta debe ser institucional y judicial.</li><li><b>Latente:</b> existe pero no se reconoce; se nota en tensión y desconfianza. Intervenir creando espacios seguros para expresar malestar.</li><li><b>Manifiesto:</b> reconocido y expresado abiertamente. Puede iniciarse la mediación si hay voluntad.</li><li><b>Invisible:</b> una parte se somete por miedo o desconocimiento; frecuente en relaciones de poder desigual (discriminación, abuso). Empoderar y abrir canales seguros.</li><li><b>Enmascarado:</b> solo se ve la punta del iceberg. Profundizar con preguntas abiertas y escucha activa.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">Tipos de conflictos (II)</h4><p>Más tipos según su visibilidad, sus causas y las personas:</p><ul><li><b>Inexistente:</b> una parte sufre un desequilibrio pero no lo ve como conflicto (lo justifica). Sensibilizar e informar de derechos.</li><li><b>Pseudoconflicto:</b> se vive como conflicto pero no hay motivos objetivos (malentendidos). Clarificar hechos y suposiciones.</li><li><b>Endémico:</b> instalado en el tiempo y normalizado. Visibilizarlo.</li><li><b>Institucionalizado:</b> trasladado a tribunales o instancias administrativas; la mediación puede acompañar para reconstruir el diálogo.</li><li><b>Por causas:</b> de relación (emociones, percepciones erróneas), de información (datos distintos, rumores), de intereses (recursos limitados), estructurales (reglas, roles o poder injustos) y de valores (culturales, generacionales, ideológicos o religiosos).</li><li><b>Por personas:</b> intrapersonal (dentro de una persona; no mediable en sentido estricto), interpersonal (entre personas; el más común), intragrupal (dentro de un grupo) e intergrupal (entre grupos distintos; más complejo).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.4.1. Prevención de conflictos</h4><p>No es evitar toda discrepancia, sino actuar sobre las causas antes de que estalle. La prevención es el conjunto de estrategias, acciones y modelos que permiten anticiparse a los conflictos, reducir su probabilidad o minimizar sus efectos.</p><ul><li><b>Modelo de prevención temprana:</b> detectar factores de riesgo y señales de alerta.</li><li><b>Modelo de diálogo estructurado:</b> espacios formales y regulares para expresar inquietudes.</li><li><b>Modelo de construcción de capacidades:</b> formar a la comunidad en comunicación, gestión emocional y mediación.</li><li><b>Modelo de transformación de conflictos:</b> actuar sobre causas estructurales (desigualdad, exclusión).</li><li><b>Técnicas:</b> planes de convivencia, metodologías participativas, gestión cooperativa de proyectos, programas de sensibilización, actividades de cohesión y mediación entre iguales.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.4.2. Gestión alternativa de conflictos (GAC)</h4><p>Conjunto de técnicas y estrategias para abordar los conflictos sin recurrir a mecanismos autoritarios ni judiciales; lógica colaborativa y consenso. Principios: respeto, voluntariedad, confidencialidad y neutralidad.</p><ul><li><b>Negociación:</b> las partes llegan a un acuerdo directamente, sin terceros.</li><li><b>Mediación:</b> una persona neutral facilita la comunicación para que las partes construyan la solución; no impone.</li><li><b>Conciliación:</b> un tercero neutral facilita y además propone soluciones concretas, que las partes no están obligadas a aceptar.</li><li><b>Arbitraje:</b> un árbitro escucha y decide; las partes se comprometen a acatarlo (contratos, deporte, comercio).</li><li><b>Transacción:</b> ambas partes hacen concesiones para evitar un proceso más largo o costoso (habitual antes de una sentencia).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.4.3. Resolución y transformación</h4><p>La resolución es la fase final en la que las partes alcanzan acuerdos concretos y consensuados: justos, realistas, coherentes con las causas y por escrito.</p><ul><li><b>Total:</b> acuerdo completo que satisface a todos.</li><li><b>Parcial:</b> se resuelven algunos aspectos.</li><li><b>Temporal:</b> soluciones provisionales para calmar.</li><li><b>Simbólica:</b> lo importante es el reconocimiento, la reparación moral o el cierre emocional.</li><li><b>Transformación de conflictos:</b> ir más allá y trabajar a largo plazo en relaciones, actitudes y estructuras.</li></ul><div style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Trucos:</b><ul><li>Posición, interés y necesidad son un ICEBERG: arriba la POSICIÓN («la sala solo para cultura»), bajo el agua el INTERÉS («que no haya ruido»), en el fondo la NECESIDAD («poder descansar»).</li><li>Las 3 pes de Lederach: PERSONAS (¿quién?), PROCESO (¿cómo va?), PROBLEMA (¿qué pasa?).</li><li>GAC de menos a más poder del tercero: NEGOCIACIÓN (no hay tercero) → MEDIACIÓN (facilita) → CONCILIACIÓN (propone) → ARBITRAJE (decide).</li><li>Estilos de afrontamiento = 5 animales: tortuga (evita), tiburón (compite), osito (se adapta), zorro (compromiso, mitad y mitad), búho (colabora).</li></ul></div><h3 style="font-size:22px;margin:26px 0 8px">Tema 3. El contexto y la planificación de la mediación</h3><h4 style="font-size:18px;margin:16px 0 4px">3.1. El contexto sociocultural</h4><p>Antes de intervenir hay que comprender el escenario amplio del conflicto. El contexto sociocultural es el conjunto de elementos sociales, culturales, históricos y estructurales que configuran el entorno en que viven las personas. Sin entenderlo, la mediación difícilmente tendrá éxito. Preguntas clave: ¿en qué entorno?, ¿quién vive ahí y cómo se relaciona?, ¿qué valores y costumbres comparten?, ¿qué tensiones o desigualdades hay?</p><h4 style="font-size:18px;margin:16px 0 4px">3.1.1. Componentes: cultura y creencias</h4><p>Componentes del contexto: cultura, religiones y creencias, valores sociales y factores estructurales.</p><ul><li><b>Cultura:</b> formas de vida, creencias, costumbres, normas, símbolos y valores que comparte una comunidad; se aprende (no se hereda biológicamente).</li><li><b>Socialización:</b> proceso por el que una persona adquiere desde la infancia los conocimientos, normas y valores para integrarse en la sociedad.</li><li><b>Enculturación:</b> interiorizar la cultura del grupo o comunidad en que se vive.</li><li><b>Rasgos de la cultura:</b> carácter simbólico (signos, rituales), compartido (la sostiene el grupo) y dinámico (cambia).</li><li><b>Religión:</b> sistema organizado de relatos, códigos éticos y símbolos con visión trascendente. Creencias: incluye también otras formas de pensamiento espiritual o filosófico.</li><li>Las creencias influyen en cómo se interpreta el conflicto, en las normas de convivencia, en quién lidera o media, en las prioridades y en la forma de participar.</li><li><b>Posturas:</b> religiones teístas (cristianismo, islam, hinduismo, judaísmo), no teístas o filosóficas (budismo, taoísmo, confucianismo), espiritualidades tradicionales y posturas no religiosas (ateísmo, agnosticismo, humanismo secular).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">Valores sociales y factores estructurales</h4><p>Los valores sociales son principios compartidos que orientan el comportamiento dentro de una comunidad; se aprenden con la socialización.</p><ul><li><b>Valores universales:</b> libertad, igualdad, justicia, respeto, dignidad (punto de encuentro en mediación).</li><li><b>Valores morales:</b> honestidad, integridad, fidelidad a la palabra.</li><li><b>Valores sociales:</b> solidaridad, tolerancia, diálogo, corresponsabilidad.</li><li><b>Funciones:</b> refuerzan la identidad colectiva, dan sentido a las normas, favorecen la integración y permiten interpretar los conflictos.</li><li><b>Factores estructurales (o sistémicos):</b> elementos de base del sistema que determinan cómo vive y participa la gente: contexto histórico (memoria colectiva), condiciones socioeconómicas, estructuras sociales (clase, género, edad, origen), acceso a servicios y derechos, relaciones de poder y entorno físico o territorial.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.1.2. Influencia del contexto: identidad y convivencia</h4><p>La identidad se construye socialmente a lo largo del tiempo.</p><ul><li><b>Identidad individual:</b> cómo se percibe una persona a sí misma.</li><li><b>Identidad social y colectiva:</b> sentimiento de pertenencia a grupos.</li><li><b>Identidad cultural:</b> lengua, costumbres, tradiciones de una comunidad; puede ser elemento de resistencia.</li><li><b>Identidad legitimada:</b> la que promueven las instituciones con poder (Estado, medios, escuela) como «normal».</li><li><b>Identidad de resistencia:</b> colectivos excluidos refuerzan su identidad para defenderse.</li><li><b>Identidad de proyecto:</b> un grupo decide transformar su situación y redefinir su lugar en la sociedad.</li><li><b>Grupo hegemónico:</b> posición dominante; impone sus referentes como «normales». Grupos subordinados: en desventaja; riesgo de invisibilidad o asimilación forzada.</li><li><b>Cohesión social:</b> grado de integración, confianza y participación entre los miembros de una comunidad. Fragmentación social: se debilitan los lazos y aumentan desconfianza, aislamiento y competencia.</li><li><b>Fortalecen la convivencia:</b> redes de apoyo, participación, reconocimiento de la diversidad, acceso equitativo, comunicación. La debilitan: aislamiento, exclusión, prejuicios, desigualdades y conflictos no gestionados.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.2.1. Diversidad cultural y migraciones</h4><p>La diversidad cultural es la coexistencia de múltiples expresiones culturales en un mismo espacio. Transforma la convivencia, cuestiona normas dominantes, visibiliza desigualdades y puede generar rechazo.</p><ul><li>Migración interna (dentro del país) e internacional (cruzando fronteras).</li><li><b>Causas:</b> económicas (empleo), políticas y de seguridad (guerras), ambientales (cambio climático) y tecnológicas y de globalización.</li><li><b>Asimilacionismo:</b> la minoría debe adaptarse por completo a la cultura dominante y renunciar a la suya (muy cuestionado).</li><li><b>Multiculturalismo:</b> coexistencia sin interacción; puede llevar al aislamiento.</li><li><b>Interculturalismo:</b> interacción, diálogo y reconocimiento mutuo con igualdad de oportunidades.</li><li><b>Integración vs. inclusión:</b> integrar puede implicar que quien llega se adapte; incluir es crear condiciones para que todos participen respetando su diversidad.</li><li><b>Prejuicio:</b> opinión negativa previa, no contrastada y con carga emocional. Estereotipo: imagen simplificada y generalizada de un grupo. Discriminación: trato desigual o injusto.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.2.2‑3.2.3. Desigualdades y nuevas problemáticas</h4><p>Las desigualdades socioeconómicas influyen en la convivencia.</p><ul><li><b>Datos de España:</b> el 10 % de hogares más ricos concentraba el 52,7 % de la riqueza (2022); el 26,1 % en riesgo de pobreza o exclusión (2024); paro juvenil del 26,5 %; segregación escolar alta; solo el 26 % de jóvenes de familias pobres llega a la universidad frente al 78 % de las ricas.</li><li><b>Interseccionalidad:</b> analizar cómo se combinan categorías (género, origen, clase, orientación) y generan experiencias únicas de discriminación o privilegio. Término propuesto por Kimberlé Crenshaw en 1989.</li><li><b>Brecha digital:</b> desigualdad en el acceso, uso y aprovechamiento de las tecnologías digitales; además, menos contacto presencial y más aislamiento.</li><li><b>Crisis climática:</b> desplazamientos, conflictos por recursos y ecoansiedad.</li><li><b>Gentrificación:</b> transformación de zonas por la llegada de residentes con más poder adquisitivo, que desplaza a los de siempre.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.3.1. Principios de actuación en contextos diversos</h4><p>No hay un modelo único válido para todos los casos. Tres bloques de principios:</p><ul><li><b>Éticos:</b> igualdad y no discriminación (equidad real, no trato idéntico), imparcialidad situada (adapta la neutralidad: compromiso con la justicia del proceso y con compensar desequilibrios) y confidencialidad contextualizada (ajustada a cada cultura).</li><li><b>Metodológicos:</b> perspectiva intercultural (diálogo activo entre formas de ver el mundo), enfoque sistémico (el conflicto como parte de un sistema de relaciones) y sostenibilidad y seguimiento (procesos que perduren).</li><li><b>De participación:</b> autonomía de las partes (deciden ellas; son expertas en su realidad), participación inclusiva (que se oigan las voces marginadas) y corresponsabilidad comunitaria (la comunidad garantiza los acuerdos).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.3.2. Estrategias de análisis del contexto</h4><p>Herramientas del equipo mediador:</p><ul><li><b>Recogida de información cualitativa:</b> entrevistas en profundidad con informantes clave, grupos focales, historias de vida y diagnóstico participativo rápido (DPR).</li><li><b>Visualización:</b> mapeo de actores (intereses, influencia, relaciones), sociograma (redes, tensiones y alianzas), cartografía social (mapas colectivos del territorio), mapa emocional del territorio (lugares significativos o de tensión) y línea del tiempo comunitaria.</li><li><b>Exploración:</b> observación no participante y visitas de campo, análisis de discursos dominantes, etnografía rápida (inmersión intensiva) y análisis documental (actas, prensa local).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.3.3. Adaptar la intervención al contexto</h4><p>Criterios para elegir el enfoque:</p><ul><li><b>Polarización:</b> si es alta, evitar al principio encuentros directos (entrevistas por separado, mediación en cadena, actividades de desescalada).</li><li><b>Competencias comunicativas:</b> si hay diferencias de idioma o nivel educativo, usar herramientas visuales o corporales (imágenes, teatro‑foro, mapas emocionales) y personas traductoras.</li><li><b>Historia previa:</b> si hay desconfianza acumulada, priorizar reconstruir la confianza (escucha empática, círculos restaurativos).</li><li><b>Diversidad cultural:</b> respetar ritmos, proximidad física, rituales y forma de expresar emociones.</li><li><b>Recursos y sostenibilidad:</b> técnicas ágiles si hay pocos medios.</li><li><b>Distribución del poder:</b> empoderar a los más vulnerables y equilibrar la participación.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.4. Planificación del proceso de mediación</h4><p>El proceso empieza al detectarse un conflicto (demanda directa, derivación o diagnóstico comunitario) y tiene tres fases: planificación (preparar), desarrollo (trabajar con las partes) y evaluación (valorar resultados). Una buena planificación ahorra tiempo y reduce resistencias.</p><ul><li><b>Recopilación y análisis de información:</b> diagnóstico del contexto comunitario, análisis de personas y grupos (incluidos los mediadores naturales) y encuadre del conflicto (naturaleza, alcance, dimensiones).</li><li><b>Premediación:</b> fase inicial con contactos por separado para recopilar información, informar del proceso y sus reglas, evaluar la viabilidad (riesgos: violencia, desequilibrio de poder, falta de voluntad), generar confianza y preparar el encuentro conjunto.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.4.2‑3.4.3. Objetivos y estrategia</h4><p>Los objetivos deben definirse de forma participativa (los impuestos generan resistencia), junto con criterios de evaluación.</p><ul><li><b>Generales:</b> finalidad amplia («mejorar la convivencia»).</li><li><b>Específicos:</b> metas observables («calendario consensuado de uso del parque»).</li><li><b>Relacionales:</b> transformar dinámicas entre grupos («reconocimiento mutuo entre jóvenes y mayores»).</li><li><b>Procedimentales:</b> sobre el propio proceso («participación equilibrada»).</li><li><b>Preventivos:</b> evitar conflictos futuros («protocolo de respuesta rápida»).</li><li><b>Diseño de la estrategia:</b> qué actividades, qué metodologías, cómo en el tiempo y qué recursos.</li><li><b>Actividades facilitadoras de la comunicación:</b> talleres de habilidades comunicativas, grupos de diálogo (café del mundo, círculos de diálogo), dinámicas de reconocimiento mutuo y técnicas creativas y expresivas (dibujo, teatro, metáforas).</li><li><b>Actividades de encuentro comunitario:</b> informativas y de sensibilización, de diagnóstico participativo y lúdicas y festivas.</li><li><b>Espacios de encuentro:</b> utilizar los existentes, adaptarlos, crear nuevos (sin significados previos) o revitalizar espacios en desuso.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">3.4.4. La convocatoria inicial</h4><p>Es la comunicación formal que invita a las partes a la primera sesión conjunta y fija sus condiciones básicas; marca el paso de la preparación al proceso formal.</p><ul><li><b>Datos logísticos:</b> día, hora, duración y lugar.</li><li>Participantes.</li><li>Contenido de la sesión y objetivo del encuentro.</li><li><b>Consideraciones prácticas:</b> documentación, traducción…</li><li><b>Vías:</b> carta, correo, llamada, mensajería o en persona (según la comunidad).</li></ul><div style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Trucos:</b><ul><li>Modelos de diversidad: ASIMILAR = «sé como yo», MULTICULTURAL = «cada uno en su casa», INTERCULTURAL = «quedamos y nos conocemos».</li><li>Identidades de Castells: LEGITIMADA = la del poder, de RESISTENCIA = me defiendo, de PROYECTO = me transformo.</li><li>Gentrificación = llega la «GENTE RIca» al barrio y los de siempre se tienen que ir.</li></ul></div><h3 style="font-size:22px;margin:26px 0 8px">Tema 4. El desarrollo de la mediación</h3><h4 style="font-size:18px;margin:16px 0 4px">4.1. Las seis fases del desarrollo</h4><p>Tras la planificación empieza el núcleo de la intervención. No siempre es lineal: volver a fases anteriores es normal, no un fracaso.</p><ul><li><b>Fase I, acogida y presentación:</b> marco de trabajo, presentaciones y reglas (¿cómo trabajaremos juntos?).</li><li><b>Fase II, exposición de las posiciones iniciales:</b> cada parte cuenta su visión sin interrupciones (¿cómo lo ve cada parte?).</li><li><b>Fase III, exploración de intereses y necesidades:</b> ir más allá de las posiciones (¿qué necesitamos realmente?).</li><li><b>Fase IV, búsqueda de acuerdos y negociación:</b> alternativas creativas (¿cómo podemos solucionarlo?).</li><li><b>Fase V, consolidación de acuerdos:</b> concretar y poner por escrito (¿a qué nos comprometemos?).</li><li><b>Fase VI, cierre y seguimiento:</b> final formal y comprobar el cumplimiento (¿hemos cumplido?).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.1.1. Fase I: el espacio de mediación</h4><p>Es el momento más delicado: se crea la confianza y se reducen tensiones. El espacio de mediación es el lugar físico diseñado o adaptado para favorecer el diálogo en igualdad y neutralidad.</p><ul><li><b>Favorecer el diálogo:</b> dimensiones adecuadas (ni muy grande ni muy pequeño), temperatura, luz, ventilación y aislamiento, accesibilidad universal y mobiliario cómodo.</li><li><b>Garantizar la imparcialidad:</b> terreno neutral, sin símbolos que favorezcan a una parte e igualdad de condiciones.</li><li><b>Áreas auxiliares:</b> salas de espera diferenciadas, sala para reuniones individuales y accesos independientes.</li><li><b>Mobiliario:</b> disposición circular o semicircular, sillas iguales y mediador a la misma distancia de todos. Mesa redonda (la más recomendable) o sin mesa en conflictos de baja tensión.</li><li><b>Detalles:</b> agua, pañuelos, material de escritura; comunicar bien la ubicación.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">Fase I: presentaciones y explicación del proceso</h4><p>Sin prisas: el tiempo invertido aquí reduce resistencias después.</p><ul><li><b>Presentación de la persona mediadora:</b> nombre y experiencia, aclarar que facilita (no es juez ni asesor), reconocer la información de la premediación y transmitir confianza.</li><li><b>Presentación de las partes:</b> en un orden que evite jerarquías (p. ej., alfabético), solo nombre y relación con la situación.</li><li><b>Explicación:</b> fases del proceso y normas (turnos de palabra y escucha activa, comunicación respetuosa sin ofensas, gestión de emociones y posibilidad de pausas).</li><li><b>Aspectos formales:</b> valor de los compromisos, confidencialidad y, si procede, tarifas. A veces se firma un acuerdo de mediación.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.1.3. Fase III: intereses y necesidades</h4><p>Se toman las posiciones como punto de partida para descubrir lo que hay detrás, sin interrogatorios (evitar el «¿por qué?»; mejor «Imaginemos que…», «Ponte en el lugar de…»).</p><ul><li><b>Preguntas abiertas:</b> «¿Qué es lo que más te preocupa?».</li><li><b>Preguntas de clarificación:</b> «¿A qué te refieres exactamente…?».</li><li><b>Preguntas de comprobación:</b> «Entonces, ¿lo que necesitas es más tranquilidad?».</li><li><b>Formulaciones empáticas y creativas:</b> «¿Qué crees que necesitaría la otra parte para sentirse mejor?».</li><li><b>Intereses comunes:</b> ambas partes los expresan (seguridad, respeto); facilitan el acuerdo.</li><li><b>Intereses diferentes pero compatibles:</b> no coinciden pero se pueden satisfacer a la vez.</li><li><b>Intereses excluyentes o incompatibles:</b> no pueden satisfacerse a la vez; exigen negociar y ceder.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.1.4. Fase IV: búsqueda de acuerdos</h4><p>Requiere flexibilidad y creatividad. La ZPA (zona de posible acuerdo) es la intersección entre las zonas de acuerdo de cada parte: el margen en el que ambas aceptarían una solución. Cada parte delimita su posición inicial, su zona de acuerdo, su punto máximo de concesión y su zona de no acuerdo.</p><ul><li>Crear condiciones favorables (recordar que es voluntario).</li><li><b>Empezar por lo posible:</b> lo más fácil primero genera acuerdos parciales.</li><li><b>Ampliar las opciones:</b> preguntas hipotéticas, lluvia de ideas.</li><li><b>Fomentar la reciprocidad:</b> ceder en lo que cuesta poco y vale mucho para el otro.</li><li><b>Ajustar el ritmo:</b> aparcar temas bloqueantes.</li><li><b>Si no hay acuerdo:</b> alternativas fuera de la negociación. MAAN (mejor alternativa a un acuerdo negociado): la opción más favorable fuera de la mediación; si es mejor que seguir, conviene retirarse. PAAN (peor alternativa): el riesgo de no llegar a acuerdo.</li><li><b>No llegar a un acuerdo no significa fracaso:</b> el diálogo abre puertas.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.1.5. Fase V: consolidación de acuerdos</h4><p>Las propuestas se convierten en compromisos concretos por escrito, en lenguaje claro y sin tecnicismos.</p><ul><li><b>Contenido:</b> identificación de las partes, breve descripción del conflicto, compromisos específicos con plazos, recursos necesarios, mecanismos de seguimiento, fecha y lugar y firmas.</li><li><b>Requisitos de un acuerdo viable y sostenible:</b> claridad, equilibrio (ambas partes se benefician), fundamentación sólida (resuelve el mayor número de aspectos) y permanencia y estabilidad.</li><li>El mediador comprueba que todos lo entienden y se sienten capaces de cumplirlo («¿Podrás cumplir este plazo?»).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.1.6. Fase VI: cierre y seguimiento</h4><p>Tiene función simbólica (reconocer el esfuerzo) y práctica (seguimiento y derivación).</p><ul><li><b>Reconocer y celebrar:</b> valorar el esfuerzo, celebrar los acuerdos, identificar aprendizajes y agradecimiento mutuo.</li><li><b>Seguimiento:</b> calendario de revisión (a los 15 días, 1 mes y 3 meses), indicadores de cumplimiento y canales de comunicación; protocolo ante incumplimientos.</li><li><b>Derivar a otros servicios:</b> detectar necesidades, informar de recursos, coordinarse y comprobar que la derivación se ha hecho.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.2.1. Técnicas de intervención comunicativa</h4><p>Las técnicas de mediación son las herramientas metodológicas que usa la persona mediadora para facilitar la comunicación, transformar el conflicto y llegar a soluciones sostenibles. Se combinan según el caso.</p><ul><li><b>Comunicación no violenta (CNV):</b> expresar las propias necesidades y comprender las ajenas sin juicios ni confrontación. Cuatro pasos: 1) observación sin juicio («Ayer no viniste a la reunión»), 2) expresión de sentimientos («Me sentí preocupada»), 3) identificación de necesidades («Necesito que nos coordinemos»), 4) formulación de peticiones («¿Podrías avisarme?»). Lenguaje «jirafa» (empático) frente a «chacal» (agresivo).</li><li><b>Reformulación:</b> devolver lo dicho con un lenguaje más neutro.</li><li><b>Interrogación estratégica:</b> preguntas abiertas, cerradas, lineales (precisar y ordenar), circulares (ver desde otra perspectiva: «Si estuviera en el lugar de la otra parte…») y estratégicas (orientar a soluciones: «¿En qué puede ceder?»).</li><li><b>Mensajes «yo»:</b> hablar de la propia vivencia sin culpar («Me sentí desplazada cuando…») frente a los mensajes «tú», que suenan a acusación («Tú siempre me dejas fuera»).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.2.2. Técnicas de transformación del conflicto</h4><p>Trabajan sobre las percepciones, creencias y emociones que sostienen el conflicto.</p><ul><li><b>Externalización:</b> separar el problema de las personas para que lo afronten como algo externo. Pasos: definición externa («La agresividad está afectando vuestra relación»), ponerle nombre («los malentendidos»), separación problema‑persona, análisis crítico y empoderamiento frente al problema («¿Qué podríais hacer juntos…?»). Requiere coherencia en el lenguaje.</li><li><b>Reestructuración cognitiva:</b> identificar y modificar pensamientos distorsionados que mantienen el conflicto. Pasos: identificar distorsiones, analizar su irracionalidad («¿Qué pruebas tienes?»), generar pensamientos alternativos («¿Qué pensaría una persona neutral?») y verificar los cambios. Con delicadeza: no se trata de convencer.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.2.3‑4.2.4. Conducción de la sesión y estrategias</h4><p>Técnicas transversales para mantener el proceso encauzado:</p><ul><li><b>Caucus:</b> reunión privada del mediador con una parte por separado, con confidencialidad (salvo autorización). Útil para emociones intensas o posiciones de negociación. Hay que ser transparente con ambas partes.</li><li><b>Pausas estratégicas:</b> de enfriamiento (emociones intensas), reflexivas (procesar propuestas), técnicas (el equipo se consulta) y de descanso.</li><li><b>Mantener la serenidad:</b> modelado del comportamiento, validación emocional («Es comprensible que te sientas así»), lenguaje calmante y respiración consciente (también relajación progresiva de Jacobson).</li><li><b>Conflictos multiparte:</b> mapeo de actores, preparación diferenciada, participación escalonada y facilitación grupal.</li><li><b>Conflictos interculturales:</b> mediadores culturales, adaptar espacios y rituales, traducción y valores universales.</li><li><b>Poder asimétrico:</b> análisis previo de asimetrías, preparación diferenciada y supervisión del equilibrio.</li><li><b>Alta intensidad emocional:</b> regulación emocional, ritmo pausado, educación emocional y apoyos complementarios.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">4.3. Habilidades para la mediación</h4><p>Competencias personales y profesionales que debe desarrollar (y formar continuamente) la persona mediadora:</p><ul><li><b>Comunicación verbal:</b> lenguaje claro y adaptado, tono y velocidad adecuados, lenguaje positivo y reformular con palabras neutrales.</li><li><b>Comunicación no verbal:</b> postura de acercamiento, contacto visual equilibrado con todas las partes, gestos coherentes, respetar la distancia según la cultura, controlar reacciones fisiológicas e imagen profesional.</li><li><b>Escucha activa:</b> interés genuino, respeto (no interrumpir), parafraseo («Quieres decir que…»), clarificación, síntesis periódica y concentración en el contenido.</li><li><b>Empatía:</b> ponerse en los zapatos del otro; el mediador la muestra y la fomenta entre las partes.</li><li><b>Gestión emocional:</b> acompañar las emociones de las partes y autorregularse (autoconciencia, autocontrol, gestión del estrés, prevención del desgaste y separar lo personal de lo profesional).</li><li><b>Organización:</b> coordinación logística, comunicación organizativa, gestión eficaz de las sesiones y documentación sistemática (anotar justo después de cada sesión).</li></ul><div style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Trucos:</b><ul><li>Las 6 fases como una cita: «Hola (acogida) → Te cuento (posiciones) → ¿Qué te importa de verdad? (intereses) → ¿Y si…? (negociar) → Lo firmamos (consolidar) → ¿Qué tal te va? (seguimiento)».</li><li>CNV en 4 pasos = «O‑S‑N‑P»: Observo, Siento, Necesito, Pido.</li><li>MAAN = tu «plan B» bueno (Mejor alternativa); PAAN = lo peor que te puede pasar si no hay acuerdo (Peor alternativa).</li><li>Seguimiento de acuerdos: 15 días, 1 mes y 3 meses.</li></ul></div><h3 style="font-size:22px;margin:26px 0 8px">Tema 5. La evaluación de la mediación</h3><h4 style="font-size:18px;margin:16px 0 4px">5.1. Los fundamentos de la evaluación</h4><p>Evaluar no es calificar ni castigar: es observar, aprender y mejorar. La evaluación en mediación comunitaria es el proceso sistemático de recogida y análisis de información que permite comprender, valorar y mejorar las intervenciones y sus efectos en las personas y comunidades. Dimensiones que se evalúan:</p><ul><li><b>El proceso:</b> cómo se desarrolló, qué técnicas funcionaron, cómo participaron las partes.</li><li><b>Los resultados:</b> acuerdos, compromisos y satisfacción.</li><li><b>Los impactos:</b> cambios a medio plazo en relaciones, convivencia y cohesión.</li><li><b>El contexto:</b> factores socioculturales que facilitaron o frenaron.</li><li>Nuestra propia actuación como equipo mediador.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.1.1‑5.1.2. Finalidades y modelos</h4><p>Para qué sirve evaluar y desde qué enfoque:</p><ul><li>Mejora de la práctica profesional.</li><li><b>Rendición de cuentas:</b> demostrar eficacia y eficiencia (sobre todo si hay dinero público): nº de conflictos, tasa de acuerdos, satisfacción.</li><li><b>Empoderamiento comunitario:</b> ver los logros refuerza la confianza en el diálogo.</li><li>Generación de conocimiento sobre qué funciona.</li><li>Adaptación y flexibilidad a las nuevas necesidades.</li><li><b>Modelos objetivistas o externos:</b> datos cuantificables (conflictos atendidos, cumplimiento, tiempo); útiles ante financiadores.</li><li><b>Modelos participativos y cualitativos:</b> experiencias y vivencias (entrevistas, grupos de discusión, autoevaluaciones); favorecen la reflexión compartida.</li><li>Pueden combinarse.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.2. ¿En qué momento evaluamos?</h4><p>La evaluación es una práctica sistemática desde el primer contacto hasta mucho después de firmar los acuerdos; si solo se evalúa al final se pierden oportunidades de ajuste.</p><ul><li><b>Evaluación inicial o diagnóstica:</b> antes de empezar; decide si la mediación es el método adecuado y planifica la intervención. Dimensiones: naturaleza del conflicto (tipo, fase, historia, violencia), características de las partes (voluntariedad, compromiso, poder, emociones, expectativas), contexto sociocultural y adecuación del servicio (competencias, recursos, conflictos de interés, alternativas). Instrumentos: fichas de valoración inicial, entrevistas diagnósticas, mapas de actores y listas de verificación de viabilidad.</li><li><b>Evaluación del proceso (continua o de seguimiento):</b> durante la mediación, para ajustar en tiempo real. Dimensiones: desarrollo de las sesiones, calidad de la comunicación, rol del mediador (neutralidad, ritmos, imprevistos) y participación y compromiso. Instrumentos: diario de sesiones, fichas de observación y reuniones de supervisión.</li><li><b>Evaluación final:</b> valora los logros respecto a los objetivos. En varios momentos: al acabar la última sesión (valoración «en caliente»), a los 15‑30 días (más reflexiva) y a los 3‑6 meses (sostenibilidad de los acuerdos y cambios).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.3. El sistema de evaluación</h4><p>Un sistema de evaluación es el conjunto articulado de criterios y procedimientos para recoger y analizar información sobre un proceso de mediación y valorar su desarrollo y resultados. Se diseña durante la planificación, no al final. Cuatro pasos:</p><ul><li><b>Paso 1, criterios:</b> ¿qué queremos evaluar?</li><li><b>Paso 2, indicadores:</b> ¿cómo sabremos si se cumplen?</li><li><b>Paso 3, técnicas e instrumentos:</b> ¿con qué medimos y de dónde sale la información?</li><li><b>Paso 4, implementación:</b> ¿cómo y cuándo recogemos la información?</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.3.1. Paso 1: los criterios</h4><p>Los criterios de evaluación son las dimensiones del proceso que es relevante valorar para determinar su calidad, eficacia y resultados. Deben salir de los objetivos de la planificación.</p><ul><li><b>Criterios de proceso:</b> participación, calidad metodológica, gestión del tiempo, clima y rol del mediador.</li><li><b>Criterios de resultado:</b> acuerdos, satisfacción, resolución de los temas y percepción de justicia.</li><li><b>Criterios de impacto:</b> efectos a medio y largo plazo (relaciones, autogestión de conflictos, cohesión, sostenibilidad).</li><li><b>Bien formulados:</b> claros («participación equitativa» mejor que «funcionamiento general»), relevantes (no «agua y bolígrafos»), de amplitud apropiada (ni «éxito de la mediación» ni «número de veces que habla cada uno») y contextualizados («comunicación intercultural respetuosa»).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.3.2. Paso 2: los indicadores</h4><p>Un indicador de evaluación es una señal observable y verificable que permite determinar en qué medida se cumple un criterio. Los criterios son generales; los indicadores, sus manifestaciones concretas. Se redactan en equipo y con la mirada de las personas implicadas.</p><ul><li><b>Ejemplo:</b> criterio «participación equitativa» → indicadores: tiempo de intervención de cada parte, número de propuestas de cada una.</li><li><b>Tipos de análisis:</b> medición (datos cuantificables), comparación (situación inicial vs. final) y reflexión y valoración (cómo se vivió).</li><li><b>Cuantitativos:</b> se expresan en números; permiten comparar y seguir tendencias.</li><li><b>Cualitativos:</b> percepciones y aspectos subjetivos que no se reducen a números.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.3.3. Paso 3: técnicas e instrumentos</h4><p>Una técnica de evaluación es el procedimiento o método general para recoger información; un instrumento es la herramienta concreta dentro de esa técnica.</p><ul><li><b>Técnicas de observación:</b> percepción directa de comportamientos sin intervenir ni preguntar; capta lo que no se verbaliza (lenguaje corporal, poder, clima). Instrumentos: diarios de campo, fichas de observación estructurada y formularios o escalas. La observación nunca es neutral: contrastar y, si se puede, varios observadores.</li><li><b>Técnicas de interrogación:</b> preguntas directas que dan voz a las personas. Instrumentos: entrevistas (inicial y final), cuestionarios (comparables) y grupos focales.</li><li><b>Técnicas documentales:</b> análisis de documentos del proceso.</li><li><b>Técnicas participativas:</b> las personas se convierten en coevaluadoras; empoderan. Instrumentos: autoevaluaciones y coevaluaciones, mapas colectivos o cartografías sociales, líneas de tiempo grupales y dinámicas activas.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.3.4. Paso 4: la implementación</h4><p>Plasmarla en un documento operativo que todos puedan consultar:</p><ul><li>Calendario de aplicación de cada instrumento.</li><li>Distribución de responsabilidades.</li><li>Recursos necesarios (tiempo, materiales).</li><li>Momentos de análisis para usar la información en la toma de decisiones.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">5.4. Registro y documentación</h4><p>El registro del proceso de mediación consiste en documentar de forma sistemática y organizada la información relevante para garantizar su trazabilidad, legalidad y mejora continua. Con rigor: lenguaje claro, información objetiva, confidencialidad y orden.</p><ul><li><b>Trazabilidad:</b> continuidad aunque intervengan varios profesionales.</li><li><b>Legalidad:</b> protege a las partes y al equipo al dejar constancia.</li><li><b>Mejora continua:</b> herramienta de reflexión profesional.</li><li><b>En la planificación:</b> ficha de solicitud y valoración inicial, consentimiento informado y hoja de derivación (si no es mediable).</li><li><b>En el desarrollo:</b> actas de sesión, registro de comunicaciones, instrumentos de seguimiento y acta de acuerdos.</li><li><b>En la evaluación:</b> instrumentos de evaluación e informe de cierre.</li><li><b>Memoria anual del servicio:</b> agrega los datos de todos los casos; muestra tendencias, tipos de conflicto, tasas de éxito y áreas de mejora.</li></ul><div style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Trucos:</b><ul><li>Los 4 pasos del sistema de evaluación = «QUÉ‑CÓMO SÉ‑CON QUÉ‑CUÁNDO»: criterios, indicadores, técnicas e instrumentos, implementación.</li><li>Criterio vs. indicador: el CRITERIO es la asignatura («participación equitativa»); el INDICADOR es la nota que lo demuestra («minutos que habla cada parte»).</li><li>Evaluación final en 3 tiempos: «en caliente» (último día), «en tibio» (15‑30 días) y «en frío» (3‑6 meses).</li></ul></div><h2 style="font-size:28px;margin:34px 0 8px">Promoción de la autonomía personal</h2><h3 style="font-size:22px;margin:26px 0 8px">Tema 1. La promoción de la autonomía personal</h3><h4 style="font-size:18px;margin:16px 0 4px">1.1. Autonomía personal y social</h4><p>A lo largo de la vida respondemos a necesidades (pirámide de Maslow: fisiológicas, seguridad, afiliación, reconocimiento y realización) gracias a capacidades que se van ampliando. La autonomía personal y social es la capacidad de decidir, por propia iniciativa, cómo vivir y de hacer sin ayuda las actividades para lograrlo. Tiene dos dimensiones: psicosocial (decidir → autodeterminación) y física (hacer → independencia).</p><h4 style="font-size:18px;margin:16px 0 4px">1.1.1. La autodeterminación</h4><p>Es la capacidad y el derecho de una persona para actuar libremente y tomar sus propias decisiones, asumiendo sus riesgos (incluye equivocarse). Sin ella, otros controlan su vida.</p><ul><li><b>Como capacidad:</b> competencia para decidir y responsabilizarse; se desarrolla con el aprendizaje.</li><li><b>Como derecho:</b> independientemente de la capacidad, debe garantizarse un proyecto propio con el mayor control posible.</li><li>Todas las personas tienen potencial para desarrollarla, incluso con discapacidad severa o trastornos graves; las personas con discapacidad intelectual y las mayores con deterioro cognitivo encuentran más limitaciones.</li><li><b>Derechos (art. 4 Ley 39/2006):</b> información comprensible, participar en las políticas que les afectan, decidir sobre su tutela, decidir libremente el ingreso en una residencia, derechos jurisdiccionales en internamientos involuntarios y derechos patrimoniales.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.1.2. La independencia y las AVD</h4><p>La independencia es la capacidad de realizar las actividades de la vida diaria por uno mismo, sin ayuda. Las AVD son todos los actos que organizan la vida cotidiana. El entorno puede favorecerla o impedirla (barreras arquitectónicas).</p><ul><li><b>AVD básicas (AVDB):</b> imprescindibles, de autocuidado: comer, vestirse, higiene, control de esfínteres, desplazarse.</li><li><b>AVD instrumentales (AVDI):</b> más complejas; para adaptarse al medio: leer, tomar la medicación, manejar dinero, transporte, cocinar, teléfono.</li><li><b>AVD avanzadas (AVDA):</b> estilo de vida y calidad de vida: ocio, deporte, trabajo, participación social.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.1.3. Las habilidades de autonomía personal y social (HAPS)</h4><p>Son las capacidades, conductas y destrezas de que dispone una persona para funcionar en su vida diaria (también llamadas HHAP).</p><ul><li><b>Clasificación de la AAIDD en 3 áreas:</b> conceptuales (lenguaje, cálculo, tiempo, dinero, autodeterminación), prácticas (AVD y entorno seguro) y sociales (relaciones, responsabilidad, normas, autoestima, evitar la victimización).</li><li><b>Clasificación en 10 áreas (AAIDD, 1992):</b> autocuidado, autodirección, comunicación, habilidades académicas funcionales, habilidades sociales, ocio y tiempo libre, salud y seguridad, trabajo, utilización de la comunidad y vida en el hogar.</li><li><b>Clasificación del libro (4 áreas):</b> AVD, movilidad y orientación, habilidades sociales y habilidades cognitivas.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.2. La dependencia</h4><p>Es el estado de carácter permanente en el que se encuentran las personas que requieren ayuda de otras para las AVD u otros actos de su autonomía. Puede deberse a la edad, la discapacidad, la enfermedad física o mental o un accidente; puede ser física, social, intelectual, mental o económica; y es permanente (desde el nacimiento o por pérdida).</p><ul><li><b>Grado I, dependencia moderada:</b> ayuda para varias AVD básicas al menos una vez al día, o apoyo intermitente o limitado.</li><li><b>Grado II, dependencia severa:</b> ayuda 2 o 3 veces al día, sin cuidador permanente.</li><li><b>Grado III, gran dependencia:</b> ayuda varias veces al día y presencia indispensable y continua de otra persona.</li><li>Se valora con el baremo BVD (Baremo de Valoración de los grados y niveles de Dependencia).</li><li>En 2021 había en España unos 1,4 millones de personas con dependencia reconocida (≈3 % de la población); aumenta por el «envejecimiento del envejecimiento» (más mayores de 80).</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.2.2. Los apoyos</h4><p>Un apoyo es cualquier recurso que se activa para que una persona dependiente aumente funcionalmente su autonomía. Son individuales y cambian con la persona y el entorno.</p><ul><li><b>Tipos:</b> productos de apoyo (bastón, silla de ruedas, cubiertos adaptados), ayudas personales y técnicas o metodologías (aprender a poner una lavadora, usar un tablero de comunicación).</li><li><b>Intensidad:</b> intermitente (solo cuando hace falta), limitado (continuo durante un tiempo), extenso (regular y sin límite temporal) y generalizado (intensivo, en varios entornos y quizá de por vida).</li><li>El principal apoyo para quien tiene poca autodeterminación es ayudarle a construir un proyecto de vida y una red de apoyo.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.2.3‑1.2.4. Factores de dependencia y calidad de vida</h4><p>Factores que favorecen la dependencia:</p><ul><li><b>Físicos:</b> envejecimiento, problemas de movilidad, limitaciones sensoriales, enfermedades crónicas (EPOC, artrosis, cáncer), consumo de fármacos y drogas.</li><li><b>Psíquicos:</b> discapacidad intelectual, demencias, depresión, enfermedad mental.</li><li><b>Contextuales:</b> ambiente físico (accesibilidad), ambiente social (red de apoyo, sobreprotección, estereotipos) y situación económica.</li><li><b>Dependencia no significa falta de calidad de vida:</b> hay calidad si sus necesidades están cubiertas, decide sobre su vida, se siente aceptada e integrada y tiene las mismas oportunidades.</li><li><b>Dimensiones de la calidad de vida:</b> bienestar emocional, relaciones interpersonales, bienestar material, desarrollo personal, bienestar físico, autodeterminación, inclusión social y derechos.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.2.5. Discapacidad y dependencia</h4><p>La discapacidad es la condición de la persona que tiene limitaciones para realizar ciertas funciones por un déficit sensorial, físico o intelectual. No implica necesariamente dependencia (una niña en silla de ruedas que no necesita ayuda es autónoma e independiente).</p><ul><li><b>Modelo de la CIF (OMS, 2001):</b> la discapacidad resulta de la relación entre condiciones de salud y factores contextuales; se manifiesta en déficits en el funcionamiento, limitaciones en la actividad y restricciones en la participación.</li><li><b>Modelo ecológico:</b> interacción de la persona con su entorno inmediato, la comunidad y la sociedad. La discapacidad aparece cuando el contexto no se ajusta (unas gafas eliminan la discapacidad de un miope). No es fija ni de todo o nada, y los apoyos la minimizan.</li><li><b>Modelo de la diversidad funcional (Foro de Vida Independiente, 2005):</b> las personas funcionan de manera diferente y tienen derecho a vivir con dignidad desde la diferencia y controlar su vida.</li><li>El CERMI defiende el término «persona con discapacidad» (el de la Convención de la ONU de 2006 y la ley) porque «diversidad funcional» es ambiguo y puede restar protección.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.3. La promoción de la autonomía: prevención</h4><p>Dos estrategias: prevenir la dependencia y atenderla cuando ya existe. La prevención de la dependencia son las medidas para que las personas, con su propio control, reduzcan los factores de riesgo que amenazan su autonomía.</p><ul><li><b>Prevención primaria:</b> promoción de la salud en la población general (dieta, descanso, ejercicio, no fumar).</li><li><b>Prevención secundaria:</b> detectar indicios precozmente para actuar antes de que la dependencia se instale o se cronifique.</li><li><b>Prevención terciaria:</b> cuando ya está establecida, evitar que progrese y minimizar sus efectos.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">1.3.2. La atención a la dependencia</h4><p>Tres tipos de recursos, todos buscando la máxima autonomía:</p><ul><li><b>Apoyo informal:</b> cuidados altruistas y gratuitos del entorno inmediato, sobre todo la familia. Perfil de quien cuida: mujer (83 %: hija, esposa o nuera), unos 52 años, convive con la persona, sin trabajo remunerado, ayuda a diario y sin apoyo. Riesgo: síndrome del cuidador.</li><li>Permanecer en el domicilio es lo más deseable (seguridad, orientación, red social), pero quien cuida no tiene formación y sufre un gran desgaste.</li><li><b>Apoyo formal:</b> recursos creados por la sociedad, recogidos en el catálogo de servicios sociales: centros residenciales, alojamientos alternativos (viviendas tuteladas), centros de día o noche y respiro, ayuda a domicilio y teleasistencia, y centros ocupacionales y de empleo. Prestaciones económicas: vinculada al servicio, para cuidados en el entorno familiar y de asistencia personal.</li><li><b>Acceso (SAAD):</b> solicitar la valoración, obtener el grado, solicitar el Programa Individual de Atención (PIA), resolución y solicitar los servicios.</li><li><b>El TSIS es personal de acción directa:</b> valora, programa, ejecuta, entrena y evalúa. Riesgo: burnout (síndrome del profesional quemado); prevenirlo con autocuidado.</li><li><b>Asistencia personal:</b> persona contratada que ayuda a realizar las tareas que alguien no puede hacer solo. Decide la persona usuaria (aunque al asistente le parezca un error); en cualquier lugar y horario flexible, frente a la ayuda a domicilio (horario fijo, decide el equipo) o los cuidados residenciales.</li></ul><div style="background:var(--yellow);color:#1C2142;padding:10px 12px;border-radius:10px"><b>Trucos:</b><ul><li>Autonomía = DECIDIR (autodeterminación) + HACER (independencia).</li><li>Grados de dependencia como el número de ayudas: I = 1 vez al día, II = 2‑3 veces, III = siempre alguien al lado.</li><li>AVD de menos a más: BÁSICAS = cuidarme (comer, vestirme) · INSTRUMENTALES = manejarme en el mundo (dinero, bus, pastillas) · AVANZADAS = disfrutar la vida (viajar, trabajar).</li><li>Intensidad de apoyos = I‑L‑E‑G: Intermitente, Limitado, Extenso, Generalizado (de menos a más).</li></ul></div><h3 style="font-size:22px;margin:26px 0 8px">Tema 2. El aprendizaje de las HAPS en personas en situación de vulnerabilidad</h3><h4 style="font-size:18px;margin:16px 0 4px">2.1. El aprendizaje de las HAPS</h4><p>El aprendizaje es el conjunto de procesos mediante los cuales se adquieren conceptos, conocimientos y habilidades. Nos permite adaptarnos a un entorno que cambia. Las HAPS son uno de esos aprendizajes, y casi todo lo aprendemos de forma natural, sin darnos cuenta.</p><h4 style="font-size:18px;margin:16px 0 4px">2.1.1. Habilidades, hábitos y rutinas</h4><p>Conseguir la autonomía es un proceso que empieza ejecutando habilidades y se consolida cuando se convierten en hábitos. Saber hacer algo no es ser autónomo: quien sabe cepillarse los dientes pero lo hace de vez en cuando no ha adquirido el hábito.</p><ul><li><b>Habilidad:</b> capacidad o destreza para realizar una actividad.</li><li><b>Hábito:</b> conducta aprendida que se ejecuta automáticamente en el momento oportuno y de forma adecuada. Pasar de habilidad a hábito exige tiempo y entrenamiento.</li><li><b>Rutina:</b> ritmo de actividad estable que, una vez aprendido, se aplica repetidamente casi sin pensar (cepillarse los dientes antes de dormir). Al repetir un hábito se interioriza y se convierte en rutina.</li><li><b>Diferencia:</b> las rutinas sí pueden cambiarse por otras o desaparecer cuando ya no se necesitan (coger el autobús al instituto).</li><li><b>Las rutinas no son innatas:</b> se adquieren en el contexto social, por eso hay que establecerlas y aprenderlas.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">Importancia de las rutinas en personas vulnerables (Doc. 2.1)</h4><p>Son muy importantes para personas con discapacidad intelectual, deterioro cognitivo o muy mayores. Una vida ordenada con rutinas es una herramienta excelente para aprender y practicar HAPS.</p><ul><li><b>Orden y claridad:</b> permiten prever lo que va a pasar, lo que da seguridad y tranquilidad.</li><li><b>Orientación temporal:</b> ayudan a diferenciar los momentos del día, las fases de una actividad y el orden de los acontecimientos.</li><li><b>Hábitos básicos:</b> facilitan los hábitos de alimentación, higiene y sueño, que dan más autonomía.</li><li><b>Hábitos sociales:</b> pueden convertirse en hábitos sociales (aspecto aseado, vestir adecuadamente, sentarse a la mesa), lo que favorece el desarrollo social y emocional.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.1.2. Fases de adquisición de las HAPS</h4><p>El aprendizaje de las HAPS es un proceso secuencial de cuatro fases, que sirven de referencia en todos los programas de entrenamiento.</p><ul><li><b>1. Preparación:</b> preparación psicológica; es condición necesaria que la persona esté predispuesta y motivada.</li><li><b>2. Aprendizaje:</b> se aprende la habilidad propiamente dicha y se ejecuta la conducta deseada.</li><li><b>3. Automatización:</b> se reproduce la conducta de forma automática cuando se requiere; se toma conciencia de las situaciones en que hay que hacerla.</li><li><b>4. Consolidación:</b> se afianza y se interioriza como hábito, de modo que se ejecuta de forma rutinaria en cualquier situación que lo requiera.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.1.3. Consideraciones sobre el aprendizaje</h4><p>Aprender es natural, pero implica mecanismos psicológicos sofisticados; no es un proceso tan lineal ni predecible.</p><ul><li>Todas las personas pueden aprender, aunque cambian la velocidad y la calidad.</li><li>No siempre es voluntario, y a veces ni siquiera consciente.</li><li><b>No solo se aprenden conocimientos:</b> también conductas, control de las emociones y relación social (inteligencia emocional).</li><li>No siempre se aprende lo correcto.</li><li>Todo aprendizaje se puede modificar con otro posterior, aunque las creencias arraigadas generan fuertes resistencias.</li><li><b>Solo se aprende aquello para lo que el organismo está capacitado:</b> hay una base neurofisiológica previa.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.2. Factores que inciden en el aprendizaje</h4><p>Aprender es común a todos, pero la velocidad y el grado alcanzado varían entre personas y momentos de la vida por factores individuales: inteligencia, atención, memoria, actitud y motivación, maduración y experiencia.</p><h4 style="font-size:18px;margin:16px 0 4px">2.2.1. La inteligencia y el cociente intelectual</h4><p>La inteligencia es la capacidad de razonar, resolver problemas, pensar en abstracto, comprender, desarrollar un lenguaje, aprender y crear. No todas las personas la tienen igual de desarrollada.</p><ul><li><b>Cociente intelectual (CI):</b> indicador numérico del grado de conocimiento, comprensión y entendimiento. Lo introdujo William Stern en 1912.</li><li><b>El CI relaciona la edad mental (EM) con la edad cronológica (EC):</b> EM = EC, sin discapacidad; EM &gt; EC, inteligencia superior al promedio; EM &lt; EC, por debajo de la media.</li><li><b>Ejemplo:</b> una persona de 18 años con discapacidad cognitiva puede tener una EM de 10 si solo hace con eficacia lo que haría un niño de esa edad.</li><li><b>Hoy se mide con pruebas psicométricas estandarizadas:</b> comprensión verbal, razonamiento perceptivo, memoria de trabajo, velocidad de procesamiento y habilidad intelectual general.</li><li><b>Cuidado:</b> los test comparan con personas de la misma edad pero no orientan la intervención, y el CI varía con factores emocionales y ambientales. No hay que «etiquetar» a nadie por su CI.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">Las inteligencias múltiples (Gardner, 1983)</h4><p>Howard Gardner superó la idea reduccionista de una sola inteligencia: todos tenemos, en distinta medida, ocho inteligencias. Su combinación es decisiva para aprender y se desarrolla con la educación, la experiencia y el entorno.</p><ul><li><b>Lingüística o lingüístico-verbal:</b> leer, escribir, hablar, escuchar, construir frases.</li><li><b>Lógico-matemática:</b> cálculo, razonamiento, problemas lógicos.</li><li><b>Espacial:</b> visualizar mentalmente ideas, volúmenes, imágenes y espacios en 3D.</li><li><b>Musical:</b> ritmo, entonación, audición; música, danza, composición.</li><li><b>Corporal-cinestésica:</b> usar el cuerpo para expresarse y para actividades de precisión, coordinación, fuerza y equilibrio.</li><li><b>Intrapersonal:</b> autoconocimiento y control del pensamiento, las emociones y la conducta.</li><li><b>Interpersonal:</b> habilidades sociales, reconocer a los demás, ayudar, establecer relaciones. Clave para trabajar en intervención social.</li><li><b>Naturalista:</b> observar, identificar y clasificar especies según semejanzas y diferencias.</li><li><b>Aportaciones posteriores:</b> inteligencia emocional (ligada a la intra e interpersonal), existencial o espiritual, pedagógica.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.2.2. La atención</h4><p>La atención es la capacidad de focalizar la percepción en un elemento. Aprender es un proceso activo, así que requiere atención voluntaria: cuanta más concentración, más rápido y eficaz el aprendizaje.</p><ul><li><b>Atención involuntaria:</b> la que prestamos sin darnos cuenta.</li><li><b>Atención voluntaria:</b> la fijamos a propósito según intereses o necesidades. Se relaciona con la concentración (mantener la atención de forma continuada y consciente).</li><li><b>Atención selectiva o focalizada:</b> centrarse en un estímulo ignorando el resto.</li><li><b>Atención dividida:</b> atender a varios estímulos o tareas a la vez (escuchar, mirar la pizarra y tomar apuntes). La afectan la esquizofrenia, el TDAH, los ictus o la discapacidad auditiva: conviene presentar las tareas escalonadas.</li><li><b>Factores:</b> el estado general (ánimo, enfermedad, cansancio, fatiga mental) la reduce; el interés y la afectividad la favorecen.</li><li><b>Para mejorarla (Doc. 2.2):</b> establecer rutinas y secuenciar actividades en vez de simultanearlas, elegir un lugar sin distracciones, dormir lo suficiente (pero no más de 9-10 horas) y buscar condiciones de relajación.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.2.3. La memoria</h4><p>La memoria es la capacidad de almacenar información y recuperarla voluntariamente. En las HAPS es fundamental: la persona debe recuperar de forma automática lo memorizado para hacer las actividades.</p><ul><li><b>Memoria sensorial:</b> dura milisegundos; si la información es relevante pasa a corto plazo y si no se desecha (sonidos y olores de la calle).</li><li><b>Memoria a corto plazo, operativa o de trabajo:</b> no más de 40 segundos; para usar la información en ese momento.</li><li><b>Memoria a largo plazo o diferida:</b> de horas a toda la vida, según la intensidad del estímulo, el esfuerzo y las veces que se use.</li><li><b>Fases:</b> 1) codificación o registro (lo percibido se transforma en información manejable), 2) almacenamiento, 3) recuperación o recuerdo. Cuantas más veces se recupera una información, mejor se consolida.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.2.4. La actitud y la motivación</h4><p>Para que aparezca una conducta hace falta un ambiente adecuado y un impulso que la active. Una actitud favorable está en la base de la motivación, y la motivación determina la conducta.</p><ul><li><b>Actitud:</b> predisposición a responder de una manera ante una situación. No es una reacción breve sino una tendencia estable y difícil de cambiar. Puede ser positiva o proactiva (favorece) o negativa (dificulta); si es negativa, lo primero es modificarla.</li><li><b>Motivación:</b> conjunto de factores capaces de provocar, mantener y dirigir la conducta hacia un objetivo. Combina procesos internos y variables externas (premios, halagos, metas).</li><li><b>Motivaciones primarias:</b> fisiológicas e innatas, no aprendidas (sed, hambre, sueño).</li><li><b>Motivaciones secundarias:</b> aprendidas (ropa de marca, un trabajo con prestigio, un coche).</li><li>La motivación aumenta si los contenidos son significativos y útiles, las metas son alcanzables, la persona se siente capaz, reconoce que su éxito depende de su esfuerzo y el aprendizaje elimina aburrimiento y ansiedad.</li><li>En personas en situación de dependencia la motivación es imprescindible y está muy ligada a un fuerte apoyo social.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.2.5. La maduración y 2.2.6. La experiencia</h4><p>Solo se aprende aquello para lo que el organismo está preparado. Y el aprendizaje se construye sobre lo que ya sabemos.</p><ul><li><b>Maduración:</b> cambios biológicos que permiten adquirir nuevas capacidades. Es condición necesaria (un bebé sin fuerza ni coordinación en las piernas no puede andar).</li><li><b>Experiencia:</b> conocimientos y habilidades adquiridos con la práctica continuada. A los adultos les facilita aprender, pero puede dificultarlo si lo aprendido antes era erróneo.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.3.1. Aprendizaje por refuerzo (conductismo)</h4><p>El conductismo (B. F. Skinner, 1904-1990) postula que aprendemos según las consecuencias de lo que hacemos: si a una conducta le sigue algo agradable tendemos a repetirla; si le sigue algo desagradable, a evitarla.</p><ul><li><b>Refuerzo:</b> respuesta agradable que se aplica a una conducta para que se repita o se perfeccione.</li><li><b>Castigo:</b> consecuencia desagradable ante una respuesta indeseada (reprimenda, amenaza, prohibición). Cada vez está más denostado por sus efectos contraproducentes y su baja eficacia.</li><li><b>Condicionamiento clásico (Watson, 1878-1958):</b> un estímulo incondicionado (el fuego) provoca una respuesta incondicionada (retirar la mano). Si un estímulo neutro se presenta repetidamente junto a él, acaba provocando solo la misma respuesta: se convierte en estímulo condicionado con respuesta condicionada.</li><li><b>Ejemplo:</b> una colonia o una canción que te recuerda a una persona.</li><li>El condicionamiento clásico, demasiado rígido, fue superado por el condicionamiento operante, que explica mejor la conducta humana.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.3.2. Aprendizaje por observación (Bandura)</h4><p>Albert Bandura (1925-2021), de las teorías del aprendizaje social, añadió el aprendizaje por observación o vicario: reproducir de forma consciente e intencionada una conducta que se ha visto hacer a otras personas (modelos). Se aprende por imitación y se mantiene por los refuerzos de esos modelos. Da cuerpo a la técnica del modelado.</p><ul><li><b>Atención:</b> observar y captar lo importante de la acción del modelo.</li><li><b>Retención:</b> memorizar la información e integrarla en el propio repertorio.</li><li><b>Motivación:</b> para reproducir la conducta del modelo.</li><li><b>Ejemplo:</b> jóvenes que visten y se comportan como sus deportistas o cantantes favoritos.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.3.3. Aprendizaje cognitivo (Piaget)</h4><p>Jean Piaget (1896-1980) aplica la adaptación darwiniana a la inteligencia: el aprendizaje es un proceso cognitivo que depende del desarrollo y las estructuras mentales alcanzadas. La psicología cognitiva (años 50) explica la conducta como un procesamiento de información parecido al de un ordenador; incluye a Piaget, Vygotsky, Bruner y Chomsky.</p><ul><li><b>Estadio I, sensomotor (0-2 años):</b> sin representación mental ni lenguaje; se aprende con movimiento, percepciones y manipulación de objetos.</li><li><b>Estadio II, preoperatorio o intuitivo (2-7 años):</b> aparece la función simbólica (juego simbólico, dibujo, lenguaje); pensamiento egocéntrico.</li><li><b>Estadio III, operatorio concreto (7-12 años):</b> fin del egocentrismo; razonamiento lógico sobre realidades concretas (clasificar, seriar, contar, espacio, tiempo, causalidad).</li><li><b>Estadio IV, operatorio formal (12-16 años):</b> pensamiento abstracto, hipotético y deductivo, sobre lo posible y no solo lo real.</li><li><b>Asimilación:</b> obtener información nueva del exterior e incorporarla a la estructura mental.</li><li><b>Acomodación:</b> reorganizar la estructura interna tras la asimilación. La adaptación o aprendizaje es el equilibrio entre las dos.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.3.4. Aprendizaje por mediación (Vygotsky)</h4><p>Lev Vygotsky (1896-1934) incorpora a una persona mediadora: la ayuda de otra persona en el momento oportuno hace eficaz el aprendizaje. Se relaciona con las técnicas de moldeado y encadenamiento.</p><ul><li><b>Zona de desarrollo real:</b> lo que la persona ya sabe hacer sola, sin ayuda (punto de partida).</li><li><b>Zona de desarrollo potencial:</b> lo que podrá hacer con la ayuda de una persona mediadora.</li><li><b>Zona de desarrollo próximo (ZDP):</b> la distancia entre las dos. Es donde se debe intervenir, porque ahí la ayuda es más eficaz.</li><li><b>Ejemplo (Doc. 2.5):</b> alguien que solo anda sostenido (potencial); el profesional le enseña a poner los pies y le anima a intentarlo solo (próximo); cuando camina solo, eso ya es su zona real y puede empezar otro aprendizaje.</li></ul><h4 style="font-size:18px;margin:16px 0 4px">2.3.5. Aprendizaje por descubrimiento (Bruner)</h4><p>Jerome S. Bruner (1915-2016): las personas construyen su conocimiento encontrando activamente contenidos que se suman a los que ya tienen. Da mucha importancia a la motivación y a plantear problemas como retos. La relación con el profesional debe ser interactiva, respetuosa y dialogante.</p><ul><li><b>Manera enactiva:</b> se aprende con la acción, la manipulación y la práctica (lo más habitual en las primeras etapas).</li><li><b>Manera icónica:</b> se aprende con imágenes reconocibles (fotos, dibujos).</li><li><b>Manera simbólica:</b> se apre
