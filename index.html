U("mediacion", {
n:2, title:"Los conflictos en mediación comunitaria",
secs:[
 ["2.1. ¿Qué es un conflicto?","Un conflicto es un estado de oposición o confrontación entre dos o más personas o grupos, provocado por discrepancias de intereses o por percepciones distintas sobre un hecho o idea. Está en todas las sociedades y no implica necesariamente violencia: su impacto depende de cómo se gestione. Condiciones: involucra a dos o más partes, hay una discrepancia (real o percibida) de intereses, valores, deseos o necesidades, y al menos una parte lo vive como algo problemático o injusto.",
  ["Problema vs. conflicto: el problema es una situación de dificultad basada en hechos demostrables (objetividad); el conflicto está dentro del problema y se centra en la relación y el desacuerdo entre las partes (subjetividad)."]],
 ["2.1.1. ¿Por qué se producen?","La diversidad no es el problema: el reto es cómo la gestionamos. Causas habituales:",
  ["Diferencias de intereses o necesidades (dos asociaciones quieren el mismo local a la misma hora).","Diferencias de valores o creencias (centro cultural vs. derecho al descanso).","Problemas de comunicación o interpretación (malentendidos).","Factores estructurales o sociales (desigualdades en el acceso a recursos)."]],
 ["2.1.2. ¿Cómo actuamos ante los conflictos?","La forma de responder depende de factores personales (carácter, autoestima), relacionales y emocionales, sociales y culturales y situacionales (recursos, poder). Estrategias: ganar‑perder, perder‑perder y ganar‑ganar (la única que crea acuerdos duraderos). Estilos de afrontamiento:",
  ["Evitación: eludir el conflicto por miedo o incomodidad; puede prolongarlo o empeorarlo.","Competencia: imponer el propio punto de vista (ganar‑perder).","Colaboración: ambas partes buscan una solución que atienda las necesidades de todos; acuerdos sostenibles.","Adaptación: una parte cede para evitar la confrontación; útil a veces, pero genera frustración si se repite.","Compromiso: cada parte renuncia a algo para una solución intermedia; útil con poco tiempo o diferencias no profundas."]],
 ["2.1.3. Consecuencias","Según sus efectos:",
  ["Conflicto funcional: bien gestionado, mejora la convivencia y fortalece relaciones (p. ej., crear normas consensuadas para un espacio común).","Conflicto disfuncional: ignorado o mal gestionado, deteriora relaciones, genera desconfianza y puede cronificarse y debilitar el tejido social.","No hay conflictos puros: uno puede pasar de funcional a disfuncional y al revés."]],
 ["2.2. Análisis: la teoría de las 3 pes","Desarrollada por John Paul Lederach, divide el conflicto en tres componentes: Personas (quién), Proceso (cómo evoluciona) y Problema (el contenido).",[]],
 ["2.2.1. Las personas","Hay que ir más allá de las posiciones y atender emociones, vínculos y necesidades.",
  ["Por forma de representación: individuos, grupos organizados y colectivos representados por portavoces.","Por implicación: partes directas (participan y defienden su postura) e indirectas (no intervienen pero les afecta).","Por función: protagonistas, personas mediadoras y mediadores naturales (sin ser profesionales, tienen legitimidad para acercar posturas).","Vínculos: jerárquico (desequilibrio de poder), horizontal (igualdad formal, aunque puede haber poder informal), histórico o emocional (trayectoria compartida) y tenso o distante.","Posiciones: lo que cada parte declara o exige.","Intereses: las motivaciones detrás de la posición (lo que espera obtener o proteger).","Necesidades: lo más profundo, en la base de los intereses (p. ej., poder descansar). Pirámide de Maslow: fisiológicas, seguridad, afiliación, reconocimiento y autorrealización.","Emociones (miedo, frustración, rabia) y valores (justicia, respeto, libertad) influyen en cómo se vive el conflicto."]],
 ["2.2.2. El proceso","El proceso es el conjunto de dinámicas que conforman el desarrollo del conflicto a lo largo del tiempo. Los conflictos no aparecen de golpe y no siempre son lineales (son cíclicos). Conviene mirarlos en pasado (reparar), presente (transformar dinámicas) y futuro (construir relaciones nuevas).",
  ["Fase latente: existe pero no se expresa (clave: favorecer la toma de conciencia).","Fase de confrontación: se hace explícito (contener la escalada, espacios seguros).","Fase de negociación: se reconoce la interdependencia y se dialoga (acompañamiento y escucha activa).","Fase de transformación: acuerdos y cambio en las relaciones (restablecer vínculos y reparar)."]],
 ["2.2.3. El problema","El problema es el motivo central del desacuerdo: lo que las partes perciben como una dificultad o amenaza. A menudo es solo la parte visible (iceberg del conflicto): debajo hay intereses, necesidades, emociones, expectativas ocultas o problemas del pasado. Cada parte puede definirlo de forma distinta.",
  ["Mapa del conflicto: representar gráficamente posiciones, intereses, causas y relaciones.","Análisis de posiciones, intereses y necesidades.","Escucha activa: detectar matices e implícitos.","Paráfrasis y reformulación: comprobar que lo entendido coincide con lo que se quería decir.","Preguntas abiertas: favorecen la reflexión."]],
 ["2.3. Tipos de conflictos (I)","Clasificar ayuda a adaptar la intervención.",
  ["Mediables: hay desacuerdo pero capacidad de dialogar y llegar a acuerdos.","No mediables: violencia, abuso o vulneración de derechos (p. ej., violencia de género); la respuesta debe ser institucional y judicial.","Latente: existe pero no se reconoce; se nota en tensión y desconfianza. Intervenir creando espacios seguros para expresar malestar.","Manifiesto: reconocido y expresado abiertamente. Puede iniciarse la mediación si hay voluntad.","Invisible: una parte se somete por miedo o desconocimiento; frecuente en relaciones de poder desigual (discriminación, abuso). Empoderar y abrir canales seguros.","Enmascarado: solo se ve la punta del iceberg. Profundizar con preguntas abiertas y escucha activa."]],
 ["Tipos de conflictos (II)","Más tipos según su visibilidad, sus causas y las personas:",
  ["Inexistente: una parte sufre un desequilibrio pero no lo ve como conflicto (lo justifica). Sensibilizar e informar de derechos.","Pseudoconflicto: se vive como conflicto pero no hay motivos objetivos (malentendidos). Clarificar hechos y suposiciones.","Endémico: instalado en el tiempo y normalizado. Visibilizarlo.","Institucionalizado: trasladado a tribunales o instancias administrativas; la mediación puede acompañar para reconstruir el diálogo.","Por causas: de relación (emociones, percepciones erróneas), de información (datos distintos, rumores), de intereses (recursos limitados), estructurales (reglas, roles o poder injustos) y de valores (culturales, generacionales, ideológicos o religiosos).","Por personas: intrapersonal (dentro de una persona; no mediable en sentido estricto), interpersonal (entre personas; el más común), intragrupal (dentro de un grupo) e intergrupal (entre grupos distintos; más complejo)."]],
 ["2.4.1. Prevención de conflictos","No es evitar toda discrepancia, sino actuar sobre las causas antes de que estalle. La prevención es el conjunto de estrategias, acciones y modelos que permiten anticiparse a los conflictos, reducir su probabilidad o minimizar sus efectos.",
  ["Modelo de prevención temprana: detectar factores de riesgo y señales de alerta.","Modelo de diálogo estructurado: espacios formales y regulares para expresar inquietudes.","Modelo de construcción de capacidades: formar a la comunidad en comunicación, gestión emocional y mediación.","Modelo de transformación de conflictos: actuar sobre causas estructurales (desigualdad, exclusión).","Técnicas: planes de convivencia, metodologías participativas, gestión cooperativa de proyectos, programas de sensibilización, actividades de cohesión y mediación entre iguales."]],
 ["2.4.2. Gestión alternativa de conflictos (GAC)","Conjunto de técnicas y estrategias para abordar los conflictos sin recurrir a mecanismos autoritarios ni judiciales; lógica colaborativa y consenso. Principios: respeto, voluntariedad, confidencialidad y neutralidad.",
  ["Negociación: las partes llegan a un acuerdo directamente, sin terceros.","Mediación: una persona neutral facilita la comunicación para que las partes construyan la solución; no impone.","Conciliación: un tercero neutral facilita y además propone soluciones concretas, que las partes no están obligadas a aceptar.","Arbitraje: un árbitro escucha y decide; las partes se comprometen a acatarlo (contratos, deporte, comercio).","Transacción: ambas partes hacen concesiones para evitar un proceso más largo o costoso (habitual antes de una sentencia)."]],
 ["2.4.3. Resolución y transformación","La resolución es la fase final en la que las partes alcanzan acuerdos concretos y consensuados: justos, realistas, coherentes con las causas y por escrito.",
  ["Total: acuerdo completo que satisface a todos.","Parcial: se resuelven algunos aspectos.","Temporal: soluciones provisionales para calmar.","Simbólica: lo importante es el reconocimiento, la reparación moral o el cierre emocional.","Transformación de conflictos: ir más allá y trabajar a largo plazo en relaciones, actitudes y estructuras."]]
],
trucos:["Posición, interés y necesidad son un ICEBERG: arriba la POSICIÓN («la sala solo para cultura»), bajo el agua el INTERÉS («que no haya ruido»), en el fondo la NECESIDAD («poder descansar»).","Las 3 pes de Lederach: PERSONAS (¿quién?), PROCESO (¿cómo va?), PROBLEMA (¿qué pasa?).","GAC de menos a más poder del tercero: NEGOCIACIÓN (no hay tercero) → MEDIACIÓN (facilita) → CONCILIACIÓN (propone) → ARBITRAJE (decide).","Estilos de afrontamiento = 5 animales: tortuga (evita), tiburón (compite), osito (se adapta), zorro (compromiso, mitad y mitad), búho (colabora)."],

U("mediacion", {
n:3, title:"El contexto y la planificación de la mediación",
secs:[
 ["3.1. El contexto sociocultural","Antes de intervenir hay que comprender el escenario amplio del conflicto. El contexto sociocultural es el conjunto de elementos sociales, culturales, históricos y estructurales que configuran el entorno en que viven las personas. Sin entenderlo, la mediación difícilmente tendrá éxito. Preguntas clave: ¿en qué entorno?, ¿quién vive ahí y cómo se relaciona?, ¿qué valores y costumbres comparten?, ¿qué tensiones o desigualdades hay?",[]],
 ["3.1.1. Componentes: cultura y creencias","Componentes del contexto: cultura, religiones y creencias, valores sociales y factores estructurales.",
  ["Cultura: formas de vida, creencias, costumbres, normas, símbolos y valores que comparte una comunidad; se aprende (no se hereda biológicamente).","Socialización: proceso por el que una persona adquiere desde la infancia los conocimientos, normas y valores para integrarse en la sociedad.","Enculturación: interiorizar la cultura del grupo o comunidad en que se vive.","Rasgos de la cultura: carácter simbólico (signos, rituales), compartido (la sostiene el grupo) y dinámico (cambia).","Religión: sistema organizado de relatos, códigos éticos y símbolos con visión trascendente. Creencias: incluye también otras formas de pensamiento espiritual o filosófico.","Las creencias influyen en cómo se interpreta el conflicto, en las normas de convivencia, en quién lidera o media, en las prioridades y en la forma de participar.","Posturas: religiones teístas (cristianismo, islam, hinduismo, judaísmo), no teístas o filosóficas (budismo, taoísmo, confucianismo), espiritualidades tradicionales y posturas no religiosas (ateísmo, agnosticismo, humanismo secular)."]],
 ["Valores sociales y factores estructurales","Los valores sociales son principios compartidos que orientan el comportamiento dentro de una comunidad; se aprenden con la socialización.",
  ["Valores universales: libertad, igualdad, justicia, respeto, dignidad (punto de encuentro en mediación).","Valores morales: honestidad, integridad, fidelidad a la palabra.","Valores sociales: solidaridad, tolerancia, diálogo, corresponsabilidad.","Funciones: refuerzan la identidad colectiva, dan sentido a las normas, favorecen la integración y permiten interpretar los conflictos.","Factores estructurales (o sistémicos): elementos de base del sistema que determinan cómo vive y participa la gente: contexto histórico (memoria colectiva), condiciones socioeconómicas, estructuras sociales (clase, género, edad, origen), acceso a servicios y derechos, relaciones de poder y entorno físico o territorial."]],
 ["3.1.2. Influencia del contexto: identidad y convivencia","La identidad se construye socialmente a lo largo del tiempo.",
  ["Identidad individual: cómo se percibe una persona a sí misma.","Identidad social y colectiva: sentimiento de pertenencia a grupos.","Identidad cultural: lengua, costumbres, tradiciones de una comunidad; puede ser elemento de resistencia.","Identidad legitimada: la que promueven las instituciones con poder (Estado, medios, escuela) como «normal».","Identidad de resistencia: colectivos excluidos refuerzan su identidad para defenderse.","Identidad de proyecto: un grupo decide transformar su situación y redefinir su lugar en la sociedad.","Grupo hegemónico: posición dominante; impone sus referentes como «normales». Grupos subordinados: en desventaja; riesgo de invisibilidad o asimilación forzada.","Cohesión social: grado de integración, confianza y participación entre los miembros de una comunidad. Fragmentación social: se debilitan los lazos y aumentan desconfianza, aislamiento y competencia.","Fortalecen la convivencia: redes de apoyo, participación, reconocimiento de la diversidad, acceso equitativo, comunicación. La debilitan: aislamiento, exclusión, prejuicios, desigualdades y conflictos no gestionados."]],
 ["3.2.1. Diversidad cultural y migraciones","La diversidad cultural es la coexistencia de múltiples expresiones culturales en un mismo espacio. Transforma la convivencia, cuestiona normas dominantes, visibiliza desigualdades y puede generar rechazo.",
  ["Migración interna (dentro del país) e internacional (cruzando fronteras).","Causas: económicas (empleo), políticas y de seguridad (guerras), ambientales (cambio climático) y tecnológicas y de globalización.","Asimilacionismo: la minoría debe adaptarse por completo a la cultura dominante y renunciar a la suya (muy cuestionado).","Multiculturalismo: coexistencia sin interacción; puede llevar al aislamiento.","Interculturalismo: interacción, diálogo y reconocimiento mutuo con igualdad de oportunidades.","Integración vs. inclusión: integrar puede implicar que quien llega se adapte; incluir es crear condiciones para que todos participen respetando su diversidad.","Prejuicio: opinión negativa previa, no contrastada y con carga emocional. Estereotipo: imagen simplificada y generalizada de un grupo. Discriminación: trato desigual o injusto."]],
 ["3.2.2‑3.2.3. Desigualdades y nuevas problemáticas","Las desigualdades socioeconómicas influyen en la convivencia.",
  ["Datos de España: el 10 % de hogares más ricos concentraba el 52,7 % de la riqueza (2022); el 26,1 % en riesgo de pobreza o exclusión (2024); paro juvenil del 26,5 %; segregación escolar alta; solo el 26 % de jóvenes de familias pobres llega a la universidad frente al 78 % de las ricas.","Interseccionalidad: analizar cómo se combinan categorías (género, origen, clase, orientación) y generan experiencias únicas de discriminación o privilegio. Término propuesto por Kimberlé Crenshaw en 1989.","Brecha digital: desigualdad en el acceso, uso y aprovechamiento de las tecnologías digitales; además, menos contacto presencial y más aislamiento.","Crisis climática: desplazamientos, conflictos por recursos y ecoansiedad.","Gentrificación: transformación de zonas por la llegada de residentes con más poder adquisitivo, que desplaza a los de siempre."]],
 ["3.3.1. Principios de actuación en contextos diversos","No hay un modelo único válido para todos los casos. Tres bloques de principios:",
  ["Éticos: igualdad y no discriminación (equidad real, no trato idéntico), imparcialidad situada (adapta la neutralidad: compromiso con la justicia del proceso y con compensar desequilibrios) y confidencialidad contextualizada (ajustada a cada cultura).","Metodológicos: perspectiva intercultural (diálogo activo entre formas de ver el mundo), enfoque sistémico (el conflicto como parte de un sistema de relaciones) y sostenibilidad y seguimiento (procesos que perduren).","De participación: autonomía de las partes (deciden ellas; son expertas en su realidad), participación inclusiva (que se oigan las voces marginadas) y corresponsabilidad comunitaria (la comunidad garantiza los acuerdos)."]],
 ["3.3.2. Estrategias de análisis del contexto","Herramientas del equipo mediador:",
  ["Recogida de información cualitativa: entrevistas en profundidad con informantes clave, grupos focales, historias de vida y diagnóstico participativo rápido (DPR).","Visualización: mapeo de actores (intereses, influencia, relaciones), sociograma (redes, tensiones y alianzas), cartografía social (mapas colectivos del territorio), mapa emocional del territorio (lugares significativos o de tensión) y línea del tiempo comunitaria.","Exploración: observación no participante y visitas de campo, análisis de discursos dominantes, etnografía rápida (inmersión intensiva) y análisis documental (actas, prensa local)."]],
 ["3.3.3. Adaptar la intervención al contexto","Criterios para elegir el enfoque:",
  ["Polarización: si es alta, evitar al principio encuentros directos (entrevistas por separado, mediación en cadena, actividades de desescalada).","Competencias comunicativas: si hay diferencias de idioma o nivel educativo, usar herramientas visuales o corporales (imágenes, teatro‑foro, mapas emocionales) y personas traductoras.","Historia previa: si hay desconfianza acumulada, priorizar reconstruir la confianza (escucha empática, círculos restaurativos).","Diversidad cultural: respetar ritmos, proximidad física, rituales y forma de expresar emociones.","Recursos y sostenibilidad: técnicas ágiles si hay pocos medios.","Distribución del poder: empoderar a los más vulnerables y equilibrar la participación."]],
 ["3.4. Planificación del proceso de mediación","El proceso empieza al detectarse un conflicto (demanda directa, derivación o diagnóstico comunitario) y tiene tres fases: planificación (preparar), desarrollo (trabajar con las partes) y evaluación (valorar resultados). Una buena planificación ahorra tiempo y reduce resistencias.",
  ["Recopilación y análisis de información: diagnóstico del contexto comunitario, análisis de personas y grupos (incluidos los mediadores naturales) y encuadre del conflicto (naturaleza, alcance, dimensiones).","Premediación: fase inicial con contactos por separado para recopilar información, informar del proceso y sus reglas, evaluar la viabilidad (riesgos: violencia, desequilibrio de poder, falta de voluntad), generar confianza y preparar el encuentro conjunto."]],
 ["3.4.2‑3.4.3. Objetivos y estrategia","Los objetivos deben definirse de forma participativa (los impuestos generan resistencia), junto con criterios de evaluación.",
  ["Generales: finalidad amplia («mejorar la convivencia»).","Específicos: metas observables («calendario consensuado de uso del parque»).","Relacionales: transformar dinámicas entre grupos («reconocimiento mutuo entre jóvenes y mayores»).","Procedimentales: sobre el propio proceso («participación equilibrada»).","Preventivos: evitar conflictos futuros («protocolo de respuesta rápida»).","Diseño de la estrategia: qué actividades, qué metodologías, cómo en el tiempo y qué recursos.","Actividades facilitadoras de la comunicación: talleres de habilidades comunicativas, grupos de diálogo (café del mundo, círculos de diálogo), dinámicas de reconocimiento mutuo y técnicas creativas y expresivas (dibujo, teatro, metáforas).","Actividades de encuentro comunitario: informativas y de sensibilización, de diagnóstico participativo y lúdicas y festivas.","Espacios de encuentro: utilizar los existentes, adaptarlos, crear nuevos (sin significados previos) o revitalizar espacios en desuso."]],
 ["3.4.4. La convocatoria inicial","Es la comunicación formal que invita a las partes a la primera sesión conjunta y fija sus condiciones básicas; marca el paso de la preparación al proceso formal.",
  ["Datos logísticos: día, hora, duración y lugar.","Participantes.","Contenido de la sesión y objetivo del encuentro.","Consideraciones prácticas: documentación, traducción…","Vías: carta, correo, llamada, mensajería o en persona (según la comunidad)."]]
],
trucos:["Modelos de diversidad: ASIMILAR = «sé como yo», MULTICULTURAL = «cada uno en su casa», INTERCULTURAL = «quedamos y nos conocemos».","Identidades de Castells: LEGITIMADA = la del poder, de RESISTENCIA = me defiendo, de PROYECTO = me transformo.","Gentrificación = llega la «GENTE RIca» al barrio y los de siempre se tienen que ir."],

U("mediacion", {
n:4, title:"El desarrollo de la mediación",
secs:[
 ["4.1. Las seis fases del desarrollo","Tras la planificación empieza el núcleo de la intervención. No siempre es lineal: volver a fases anteriores es normal, no un fracaso.",
  ["Fase I, acogida y presentación: marco de trabajo, presentaciones y reglas (¿cómo trabajaremos juntos?).","Fase II, exposición de las posiciones iniciales: cada parte cuenta su visión sin interrupciones (¿cómo lo ve cada parte?).","Fase III, exploración de intereses y necesidades: ir más allá de las posiciones (¿qué necesitamos realmente?).","Fase IV, búsqueda de acuerdos y negociación: alternativas creativas (¿cómo podemos solucionarlo?).","Fase V, consolidación de acuerdos: concretar y poner por escrito (¿a qué nos comprometemos?).","Fase VI, cierre y seguimiento: final formal y comprobar el cumplimiento (¿hemos cumplido?)."]],
 ["4.1.1. Fase I: el espacio de mediación","Es el momento más delicado: se crea la confianza y se reducen tensiones. El espacio de mediación es el lugar físico diseñado o adaptado para favorecer el diálogo en igualdad y neutralidad.",
  ["Favorecer el diálogo: dimensiones adecuadas (ni muy grande ni muy pequeño), temperatura, luz, ventilación y aislamiento, accesibilidad universal y mobiliario cómodo.","Garantizar la imparcialidad: terreno neutral, sin símbolos que favorezcan a una parte e igualdad de condiciones.","Áreas auxiliares: salas de espera diferenciadas, sala para reuniones individuales y accesos independientes.","Mobiliario: disposición circular o semicircular, sillas iguales y mediador a la misma distancia de todos. Mesa redonda (la más recomendable) o sin mesa en conflictos de baja tensión.","Detalles: agua, pañuelos, material de escritura; comunicar bien la ubicación."]],
 ["Fase I: presentaciones y explicación del proceso","Sin prisas: el tiempo invertido aquí reduce resistencias después.",
  ["Presentación de la persona mediadora: nombre y experiencia, aclarar que facilita (no es juez ni asesor), reconocer la información de la premediación y transmitir confianza.","Presentación de las partes: en un orden que evite jerarquías (p. ej., alfabético), solo nombre y relación con la situación.","Explicación: fases del proceso y normas (turnos de palabra y escucha activa, comunicación respetuosa sin ofensas, gestión de emociones y posibilidad de pausas).","Aspectos formales: valor de los compromisos, confidencialidad y, si procede, tarifas. A veces se firma un acuerdo de mediación."]],
 ["4.1.3. Fase III: intereses y necesidades","Se toman las posiciones como punto de partida para descubrir lo que hay detrás, sin interrogatorios (evitar el «¿por qué?»; mejor «Imaginemos que…», «Ponte en el lugar de…»).",
  ["Preguntas abiertas: «¿Qué es lo que más te preocupa?».","Preguntas de clarificación: «¿A qué te refieres exactamente…?».","Preguntas de comprobación: «Entonces, ¿lo que necesitas es más tranquilidad?».","Formulaciones empáticas y creativas: «¿Qué crees que necesitaría la otra parte para sentirse mejor?».","Intereses comunes: ambas partes los expresan (seguridad, respeto); facilitan el acuerdo.","Intereses diferentes pero compatibles: no coinciden pero se pueden satisfacer a la vez.","Intereses excluyentes o incompatibles: no pueden satisfacerse a la vez; exigen negociar y ceder."]],
 ["4.1.4. Fase IV: búsqueda de acuerdos","Requiere flexibilidad y creatividad. La ZPA (zona de posible acuerdo) es la intersección entre las zonas de acuerdo de cada parte: el margen en el que ambas aceptarían una solución. Cada parte delimita su posición inicial, su zona de acuerdo, su punto máximo de concesión y su zona de no acuerdo.",
  ["Crear condiciones favorables (recordar que es voluntario).","Empezar por lo posible: lo más fácil primero genera acuerdos parciales.","Ampliar las opciones: preguntas hipotéticas, lluvia de ideas.","Fomentar la reciprocidad: ceder en lo que cuesta poco y vale mucho para el otro.","Ajustar el ritmo: aparcar temas bloqueantes.","Si no hay acuerdo: alternativas fuera de la negociación. MAAN (mejor alternativa a un acuerdo negociado): la opción más favorable fuera de la mediación; si es mejor que seguir, conviene retirarse. PAAN (peor alternativa): el riesgo de no llegar a acuerdo.","No llegar a un acuerdo no significa fracaso: el diálogo abre puertas."]],
 ["4.1.5. Fase V: consolidación de acuerdos","Las propuestas se convierten en compromisos concretos por escrito, en lenguaje claro y sin tecnicismos.",
  ["Contenido: identificación de las partes, breve descripción del conflicto, compromisos específicos con plazos, recursos necesarios, mecanismos de seguimiento, fecha y lugar y firmas.","Requisitos de un acuerdo viable y sostenible: claridad, equilibrio (ambas partes se benefician), fundamentación sólida (resuelve el mayor número de aspectos) y permanencia y estabilidad.","El mediador comprueba que todos lo entienden y se sienten capaces de cumplirlo («¿Podrás cumplir este plazo?»)."]],
 ["4.1.6. Fase VI: cierre y seguimiento","Tiene función simbólica (reconocer el esfuerzo) y práctica (seguimiento y derivación).",
  ["Reconocer y celebrar: valorar el esfuerzo, celebrar los acuerdos, identificar aprendizajes y agradecimiento mutuo.","Seguimiento: calendario de revisión (a los 15 días, 1 mes y 3 meses), indicadores de cumplimiento y canales de comunicación; protocolo ante incumplimientos.","Derivar a otros servicios: detectar necesidades, informar de recursos, coordinarse y comprobar que la derivación se ha hecho."]],
 ["4.2.1. Técnicas de intervención comunicativa","Las técnicas de mediación son las herramientas metodológicas que usa la persona mediadora para facilitar la comunicación, transformar el conflicto y llegar a soluciones sostenibles. Se combinan según el caso.",
  ["Comunicación no violenta (CNV): expresar las propias necesidades y comprender las ajenas sin juicios ni confrontación. Cuatro pasos: 1) observación sin juicio («Ayer no viniste a la reunión»), 2) expresión de sentimientos («Me sentí preocupada»), 3) identificación de necesidades («Necesito que nos coordinemos»), 4) formulación de peticiones («¿Podrías avisarme?»). Lenguaje «jirafa» (empático) frente a «chacal» (agresivo).","Reformulación: devolver lo dicho con un lenguaje más neutro.","Interrogación estratégica: preguntas abiertas, cerradas, lineales (precisar y ordenar), circulares (ver desde otra perspectiva: «Si estuviera en el lugar de la otra parte…») y estratégicas (orientar a soluciones: «¿En qué puede ceder?»).","Mensajes «yo»: hablar de la propia vivencia sin culpar («Me sentí desplazada cuando…») frente a los mensajes «tú», que suenan a acusación («Tú siempre me dejas fuera»)."]],
 ["4.2.2. Técnicas de transformación del conflicto","Trabajan sobre las percepciones, creencias y emociones que sostienen el conflicto.",
  ["Externalización: separar el problema de las personas para que lo afronten como algo externo. Pasos: definición externa («La agresividad está afectando vuestra relación»), ponerle nombre («los malentendidos»), separación problema‑persona, análisis crítico y empoderamiento frente al problema («¿Qué podríais hacer juntos…?»). Requiere coherencia en el lenguaje.","Reestructuración cognitiva: identificar y modificar pensamientos distorsionados que mantienen el conflicto. Pasos: identificar distorsiones, analizar su irracionalidad («¿Qué pruebas tienes?»), generar pensamientos alternativos («¿Qué pensaría una persona neutral?») y verificar los cambios. Con delicadeza: no se trata de convencer."]],
 ["4.2.3‑4.2.4. Conducción de la sesión y estrategias","Técnicas transversales para mantener el proceso encauzado:",
  ["Caucus: reunión privada del mediador con una parte por separado, con confidencialidad (salvo autorización). Útil para emociones intensas o posiciones de negociación. Hay que ser transparente con ambas partes.","Pausas estratégicas: de enfriamiento (emociones intensas), reflexivas (procesar propuestas), técnicas (el equipo se consulta) y de descanso.","Mantener la serenidad: modelado del comportamiento, validación emocional («Es comprensible que te sientas así»), lenguaje calmante y respiración consciente (también relajación progresiva de Jacobson).","Conflictos multiparte: mapeo de actores, preparación diferenciada, participación escalonada y facilitación grupal.","Conflictos interculturales: mediadores culturales, adaptar espacios y rituales, traducción y valores universales.","Poder asimétrico: análisis previo de asimetrías, preparación diferenciada y supervisión del equilibrio.","Alta intensidad emocional: regulación emocional, ritmo pausado, educación emocional y apoyos complementarios."]],
 ["4.3. Habilidades para la mediación","Competencias personales y profesionales que debe desarrollar (y formar continuamente) la persona mediadora:",
  ["Comunicación verbal: lenguaje claro y adaptado, tono y velocidad adecuados, lenguaje positivo y reformular con palabras neutrales.","Comunicación no verbal: postura de acercamiento, contacto visual equilibrado con todas las partes, gestos coherentes, respetar la distancia según la cultura, controlar reacciones fisiológicas e imagen profesional.","Escucha activa: interés genuino, respeto (no interrumpir), parafraseo («Quieres decir que…»), clarificación, síntesis periódica y concentración en el contenido.","Empatía: ponerse en los zapatos del otro; el mediador la muestra y la fomenta entre las partes.","Gestión emocional: acompañar las emociones de las partes y autorregularse (autoconciencia, autocontrol, gestión del estrés, prevención del desgaste y separar lo personal de lo profesional).","Organización: coordinación logística, comunicación organizativa, gestión eficaz de las sesiones y documentación sistemática (anotar justo después de cada sesión)."]]
],
trucos:["Las 6 fases como una cita: «Hola (acogida) → Te cuento (posiciones) → ¿Qué te importa de verdad? (intereses) → ¿Y si…? (negociar) → Lo firmamos (consolidar) → ¿Qué tal te va? (seguimiento)».","CNV en 4 pasos = «O‑S‑N‑P»: Observo, Siento, Necesito, Pido.","MAAN = tu «plan B» bueno (Mejor alternativa); PAAN = lo peor que te puede pasar si no hay acuerdo (Peor alternativa).","Seguimiento de acuerdos: 15 días, 1 mes y 3 meses."],
cards:[
 ["Espacio de mediación","Lugar diseñado o adaptado para favorecer el diálogo en igualdad y neutralidad."],
 ["Terreno neutral","El lugar no debe estar vinculado a ninguna parte ni evocar experiencias que den ventaja."],
 ["Mesa redonda","Opción más recomendable: elimina cabeceras y favorece la igualdad simbólica."],
 ["Fase II","Exposición de las posiciones iniciales: cada parte cuenta su visión sin interrupciones."],
 ["Fase III","Exploración de intereses y necesidades, más allá de las posiciones."],
 ["Preguntas de comprobación","Verifican que se ha entendido bien: «Entonces, ¿lo que necesitas es…?»."],
 ["Intereses compatibles","No coinciden pero pueden satisfacerse a la vez sin perjudicar a nadie."],
 ["Intereses excluyentes","No pueden satisfacerse a la vez; requieren negociar y ceder."],
 ["ZPA","Zona de posible acuerdo: intersección de los márgenes que cada parte acepta."],
 ["Punto máximo","Máxima concesión que una parte acepta antes de retirarse."],
 ["Reciprocidad","Ceder en lo que cuesta poco y vale mucho para la otra parte."],
 ["MAAN","Mejor alternativa a un acuerdo negociado: la opción más favorable fuera de la mediación."],
 ["PAAN","Peor alternativa a un acuerdo negociado: el riesgo de no llegar a acuerdo."],
 ["Requisitos de un buen acuerdo","Claridad, equilibrio, fundamentación sólida y permanencia o estabilidad."],
 ["Calendario de revisión","Comprobar el cumplimiento a los 15 días, 1 mes y 3 meses."],
 ["Técnicas de mediación","Herramientas para facilitar la comunicación, transformar el conflicto y llegar a soluciones."],
 ["Comunicación no violenta","Expresar necesidades y comprender las ajenas sin juicios: observar, sentir, necesitar, pedir."],
 ["Reformulación","Devolver lo dicho con un lenguaje más neutro que conserve el sentido."],
 ["Preguntas circulares","Invitan a ver el problema desde otras perspectivas («Si estuviera en su lugar…»)."],
 ["Preguntas estratégicas","Reposicionan hacia soluciones («¿En qué puede ceder?»)."],
 ["Mensajes «yo»","Hablar de la propia vivencia sin culpar a la otra parte."],
 ["Externalización","Separar el problema de las personas para que lo afronten como algo externo."],
 ["Reestructuración cognitiva","Identificar y modificar pensamientos distorsionados que mantienen el conflicto."],
 ["Caucus","Reunión privada del mediador con una de las partes, con confidencialidad."],
 ["Pausa de enfriamiento","Interrupción para que las partes se calmen cuando las emociones son muy intensas."],
 ["Validación emocional","Reconocer y normalizar las emociones sin amplificarlas: «Es comprensible que te sientas así»."],
 ["Conflicto multiparte","Participan más de dos actores principales; requiere mapeo y facilitación grupal."],
 ["Escucha activa","Atender al mensaje con interés, parafrasear, clarificar y sintetizar."],
 ["Empatía","Ponerse en los zapatos de la otra persona."],
 ["Autorregulación emocional","Autoconciencia, autocontrol, gestión del estrés, prevención del desgaste y separar lo personal."]
],
quiz:[
 ["¿Cuál es la tercera fase del desarrollo de la mediación?",["Exploración de intereses y necesidades","Búsqueda de acuerdos","Acogida y presentación","Cierre y seguimiento"],"Acogida → posiciones → intereses → acuerdos → consolidación → seguimiento."],
 ["¿Qué disposición de asientos se recomienda en la mayoría de los casos?",["Mesa redonda","Mesa con cabecera","Escritorio del mediador delante","Filas como en clase"],"Elimina posiciones de cabecera y transmite igualdad."],
 ["Las partes se presentan en un orden que evite jerarquías, por ejemplo…",["Alfabético","Por edad","Por sueldo","Quien llegue primero"],"Así nadie se siente por encima."],
 ["«Entonces, ¿lo que necesitas es más tranquilidad?» es una pregunta de…",["Comprobación","Clarificación","Cierre","Distensión"],"Verifica que se ha comprendido sin imponer interpretaciones."],
 ["Unos quieren la sala por la mañana y otros por la tarde: sus intereses son…",["Diferentes pero compatibles","Excluyentes","Comunes","Inexistentes"],"Se pueden satisfacer a la vez sin perjudicar a nadie."],
 ["El espacio donde se cruzan los márgenes aceptables de ambas partes es la…",["ZPA","MAAN","PAAN","CNV"],"Zona de posible acuerdo."],
 ["La mejor opción que tiene una parte fuera de la mediación se llama…",["MAAN","PAAN","ZPA","Caucus"],"Si es mejor que seguir negociando, conviene retirarse."],
 ["¿Cuándo se revisa normalmente el cumplimiento de los acuerdos?",["A los 15 días, 1 mes y 3 meses","Solo al año","Nunca","A la semana y ya"],"Se usan indicadores de cumplimiento y canales de comunicación."],
 ["«Ayer no acudiste a la reunión» (sin añadir «eres un irresponsable») corresponde al paso de la CNV de…",["Observación sin juicio","Expresión de sentimientos","Identificación de necesidades","Formulación de peticiones"],"Se describe lo ocurrido sin valoraciones."],
 ["«Me sentí desplazada cuando no me avisaste» es un ejemplo de…",["Mensaje yo","Mensaje tú","Caucus","Pregunta lineal"],"Habla desde la propia emoción sin acusar."],
 ["«La desconfianza está afectando a vuestra relación» es una frase propia de la técnica de…",["Externalización","Reestructuración cognitiva","Caucus","Pausa técnica"],"Separa el problema de las personas."],
 ["Preguntar «¿Qué pruebas tienes de que eso sea cierto?» forma parte de la…",["Reestructuración cognitiva","Externalización","Acogida","Consolidación de acuerdos"],"Es el paso de analizar la irracionalidad de un pensamiento."],
 ["Una reunión privada del mediador con una sola parte es un…",["Caucus","Arbitraje","Pretest","Grupo focal"],"Lo compartido es confidencial salvo autorización."],
 ["En un conflicto intercultural se recomienda…",["Usar mediadores culturales y adaptar espacios y rituales","Imponer las costumbres del grupo mayoritario","Evitar hablar de valores","Acelerar el proceso"],"También técnicas de traducción y enfoque en valores universales."],
 ["Repetir con tus palabras lo esencial de lo que alguien dijo para comprobar que lo has entendido es…",["Parafraseo","Síntesis","Validación","Distensión"],"Por ejemplo: «Si no he entendido mal, te refieres a…»."]
]
});

U("mediacion", {
n:5, title:"La evaluación de la mediación",
secs:[
 ["5.1. Los fundamentos de la evaluación","Evaluar no es calificar ni castigar: es observar, aprender y mejorar. La evaluación en mediación comunitaria es el proceso sistemático de recogida y análisis de información que permite comprender, valorar y mejorar las intervenciones y sus efectos en las personas y comunidades. Dimensiones que se evalúan:",
  ["El proceso: cómo se desarrolló, qué técnicas funcionaron, cómo participaron las partes.","Los resultados: acuerdos, compromisos y satisfacción.","Los impactos: cambios a medio plazo en relaciones, convivencia y cohesión.","El contexto: factores socioculturales que facilitaron o frenaron.","Nuestra propia actuación como equipo mediador."]],
 ["5.1.1‑5.1.2. Finalidades y modelos","Para qué sirve evaluar y desde qué enfoque:",
  ["Mejora de la práctica profesional.","Rendición de cuentas: demostrar eficacia y eficiencia (sobre todo si hay dinero público): nº de conflictos, tasa de acuerdos, satisfacción.","Empoderamiento comunitario: ver los logros refuerza la confianza en el diálogo.","Generación de conocimiento sobre qué funciona.","Adaptación y flexibilidad a las nuevas necesidades.","Modelos objetivistas o externos: datos cuantificables (conflictos atendidos, cumplimiento, tiempo); útiles ante financiadores.","Modelos participativos y cualitativos: experiencias y vivencias (entrevistas, grupos de discusión, autoevaluaciones); favorecen la reflexión compartida.","Pueden combinarse."]],
 ["5.2. ¿En qué momento evaluamos?","La evaluación es una práctica sistemática desde el primer contacto hasta mucho después de firmar los acuerdos; si solo se evalúa al final se pierden oportunidades de ajuste.",
  ["Evaluación inicial o diagnóstica: antes de empezar; decide si la mediación es el método adecuado y planifica la intervención. Dimensiones: naturaleza del conflicto (tipo, fase, historia, violencia), características de las partes (voluntariedad, compromiso, poder, emociones, expectativas), contexto sociocultural y adecuación del servicio (competencias, recursos, conflictos de interés, alternativas). Instrumentos: fichas de valoración inicial, entrevistas diagnósticas, mapas de actores y listas de verificación de viabilidad.","Evaluación del proceso (continua o de seguimiento): durante la mediación, para ajustar en tiempo real. Dimensiones: desarrollo de las sesiones, calidad de la comunicación, rol del mediador (neutralidad, ritmos, imprevistos) y participación y compromiso. Instrumentos: diario de sesiones, fichas de observación y reuniones de supervisión.","Evaluación final: valora los logros respecto a los objetivos. En varios momentos: al acabar la última sesión (valoración «en caliente»), a los 15‑30 días (más reflexiva) y a los 3‑6 meses (sostenibilidad de los acuerdos y cambios)."]],
 ["5.3. El sistema de evaluación","Un sistema de evaluación es el conjunto articulado de criterios y procedimientos para recoger y analizar información sobre un proceso de mediación y valorar su desarrollo y resultados. Se diseña durante la planificación, no al final. Cuatro pasos:",
  ["Paso 1, criterios: ¿qué queremos evaluar?","Paso 2, indicadores: ¿cómo sabremos si se cumplen?","Paso 3, técnicas e instrumentos: ¿con qué medimos y de dónde sale la información?","Paso 4, implementación: ¿cómo y cuándo recogemos la información?"]],
 ["5.3.1. Paso 1: los criterios","Los criterios de evaluación son las dimensiones del proceso que es relevante valorar para determinar su calidad, eficacia y resultados. Deben salir de los objetivos de la planificación.",
  ["Criterios de proceso: participación, calidad metodológica, gestión del tiempo, clima y rol del mediador.","Criterios de resultado: acuerdos, satisfacción, resolución de los temas y percepción de justicia.","Criterios de impacto: efectos a medio y largo plazo (relaciones, autogestión de conflictos, cohesión, sostenibilidad).","Bien formulados: claros («participación equitativa» mejor que «funcionamiento general»), relevantes (no «agua y bolígrafos»), de amplitud apropiada (ni «éxito de la mediación» ni «número de veces que habla cada uno») y contextualizados («comunicación intercultural respetuosa»)."]],
 ["5.3.2. Paso 2: los indicadores","Un indicador de evaluación es una señal observable y verificable que permite determinar en qué medida se cumple un criterio. Los criterios son generales; los indicadores, sus manifestaciones concretas. Se redactan en equipo y con la mirada de las personas implicadas.",
  ["Ejemplo: criterio «participación equitativa» → indicadores: tiempo de intervención de cada parte, número de propuestas de cada una.","Tipos de análisis: medición (datos cuantificables), comparación (situación inicial vs. final) y reflexión y valoración (cómo se vivió).","Cuantitativos: se expresan en números; permiten comparar y seguir tendencias.","Cualitativos: percepciones y aspectos subjetivos que no se reducen a números."]],
 ["5.3.3. Paso 3: técnicas e instrumentos","Una técnica de evaluación es el procedimiento o método general para recoger información; un instrumento es la herramienta concreta dentro de esa técnica.",
  ["Técnicas de observación: percepción directa de comportamientos sin intervenir ni preguntar; capta lo que no se verbaliza (lenguaje corporal, poder, clima). Instrumentos: diarios de campo, fichas de observación estructurada y formularios o escalas. La observación nunca es neutral: contrastar y, si se puede, varios observadores.","Técnicas de interrogación: preguntas directas que dan voz a las personas. Instrumentos: entrevistas (inicial y final), cuestionarios (comparables) y grupos focales.","Técnicas documentales: análisis de documentos del proceso.","Técnicas participativas: las personas se convierten en coevaluadoras; empoderan. Instrumentos: autoevaluaciones y coevaluaciones, mapas colectivos o cartografías sociales, líneas de tiempo grupales y dinámicas activas."]],
 ["5.3.4. Paso 4: la implementación","Plasmarla en un documento operativo que todos puedan consultar:",
  ["Calendario de aplicación de cada instrumento.","Distribución de responsabilidades.","Recursos necesarios (tiempo, materiales).","Momentos de análisis para usar la información en la toma de decisiones."]],
 ["5.4. Registro y documentación","El registro del proceso de mediación consiste en documentar de forma sistemática y organizada la información relevante para garantizar su trazabilidad, legalidad y mejora continua. Con rigor: lenguaje claro, información objetiva, confidencialidad y orden.",
  ["Trazabilidad: continuidad aunque intervengan varios profesionales.","Legalidad: protege a las partes y al equipo al dejar constancia.","Mejora continua: herramienta de reflexión profesional.","En la planificación: ficha de solicitud y valoración inicial, consentimiento informado y hoja de derivación (si no es mediable).","En el desarrollo: actas de sesión, registro de comunicaciones, instrumentos de seguimiento y acta de acuerdos.","En la evaluación: instrumentos de evaluación e informe de cierre.","Memoria anual del servicio: agrega los datos de todos los casos; muestra tendencias, tipos de conflicto, tasas de éxito y áreas de mejora."]]
],
trucos:["Los 4 pasos del sistema de evaluación = «QUÉ‑CÓMO SÉ‑CON QUÉ‑CUÁNDO»: criterios, indicadores, técnicas e instrumentos, implementación.","Criterio vs. indicador: el CRITERIO es la asignatura («participación equitativa»); el INDICADOR es la nota que lo demuestra («minutos que habla cada parte»).","Evaluación final en 3 tiempos: «en caliente» (último día), «en tibio» (15‑30 días) y «en frío» (3‑6 meses)."],
cards:[
 ["Evaluación en mediación","Proceso sistemático de recogida y análisis de información para comprender, valorar y mejorar las intervenciones."],
 ["Dimensión de impacto","Cambios a medio plazo en relaciones, convivencia, cohesión y capacidad de gestionar conflictos."],
 ["Rendición de cuentas","Demostrar la eficacia y eficiencia del servicio, sobre todo si usa recursos públicos."],
 ["Modelos objetivistas","Recogen datos cuantificables (conflictos atendidos, cumplimiento, tiempo); útiles ante financiadores."],
 ["Modelos participativos","Priorizan la experiencia y vivencia de las personas; favorecen la reflexión compartida."],
 ["Evaluación inicial o diagnóstica","Antes de empezar: decide si la mediación es adecuada y planifica la intervención."],
 ["Listas de verificación de viabilidad","Instrumento de la evaluación inicial para comprobar si el caso es mediable."],
 ["Evaluación del proceso","Continua o de seguimiento: durante la mediación, para ajustar en tiempo real."],
 ["Reuniones de supervisión","Instrumento de evaluación del proceso junto a diarios de sesiones y fichas de observación."],
 ["Evaluación final","Al acabar, a los 15‑30 días y a los 3‑6 meses: logros y sostenibilidad de los acuerdos."],
 ["Sistema de evaluación","Conjunto articulado de criterios y procedimientos para recoger y analizar información de la mediación."],
 ["Criterios de evaluación","Dimensiones relevantes que valorar (calidad, eficacia, resultados); salen de los objetivos."],
 ["Criterios de impacto","Analizan los efectos a medio y largo plazo de la mediación."],
 ["Indicador de evaluación","Señal observable y verificable que muestra en qué medida se cumple un criterio."],
 ["Análisis por comparación","Contrastar la situación inicial y la final o las expectativas con los resultados."],
 ["Técnica vs. instrumento","Técnica: método general. Instrumento: herramienta concreta dentro de esa técnica."],
 ["Técnicas de observación","Recogida de información por percepción directa sin intervenir ni preguntar."],
 ["Técnicas de interrogación","Preguntas directas a las personas: entrevistas, cuestionarios, grupos focales."],
 ["Técnicas participativas","Las personas implicadas producen y analizan la información (autoevaluación, cartografías…)."],
 ["Coevaluación","Los participantes valoran juntos su contribución y aprendizajes."],
 ["Registro del proceso","Documentación sistemática para garantizar trazabilidad, legalidad y mejora continua."],
 ["Consentimiento informado","Documento que formaliza la aceptación voluntaria del proceso y los compromisos."],
 ["Hoja de derivación","Documenta por qué un caso no es mediable y a qué servicio se deriva."],
 ["Acta de acuerdos","Documento formal con los compromisos finales alcanzados."],
 ["Informe de cierre","Síntesis del proceso con recomendaciones para el seguimiento."],
 ["Memoria anual","Agrega los datos de todos los casos del servicio: tendencias, éxito y mejoras."]
],
quiz:[
 ["La evaluación que decide si la mediación es el método adecuado es la…",["Inicial o diagnóstica","Final","Del proceso","Externa"],"Se hace antes de comenzar formalmente."],
 ["La evaluación final a los 3‑6 meses sirve sobre todo para comprobar…",["La sostenibilidad de los acuerdos","La satisfacción inmediata","Si el caso es mediable","El horario de las sesiones"],"La valoración «en caliente» se hace al acabar la última sesión."],
 ["Demostrar con datos la eficacia de un servicio financiado con dinero público es…",["Rendición de cuentas","Empoderamiento comunitario","Generación de conocimiento","Coevaluación"],"Se usan datos como la tasa de acuerdos o la satisfacción."],
 ["¿Cuál es el primer paso para diseñar un sistema de evaluación?",["Definir los criterios","Elegir los instrumentos","Planificar la implementación","Escribir el informe de cierre"],"Criterios → indicadores → técnicas e instrumentos → implementación."],
 ["¿Cuándo debe diseñarse el sistema de evaluación?",["Durante la planificación de la mediación","Al final del proceso","Nunca","Solo si hay problemas"],"Así se recoge información desde el inicio."],
 ["«Éxito de la mediación» es un criterio mal formulado porque es…",["Demasiado general","Demasiado específico","Irrelevante","Contextualizado"],"Mejor «equilibrio en la participación»."],
 ["«Tiempo de intervención de cada parte» es un…",["Indicador","Criterio","Objetivo general","Principio"],"Concreta el criterio «participación equitativa»."],
 ["Un cuestionario de satisfacción es…",["Un instrumento de la técnica de interrogación","Una técnica de observación","Un criterio de impacto","Un acta de acuerdos"],"La técnica es el método; el instrumento, la herramienta concreta."],
 ["Que el grupo dibuje un mapa con los cambios vividos en el barrio es una técnica…",["Participativa","De observación","Documental","Objetivista"],"Las personas se convierten en coevaluadoras."],
 ["¿Por qué conviene que observe más de una persona?",["Porque la observación nunca es completamente neutral","Porque es más barato","Para que sea más rápido","No conviene"],"Contrastar reduce el efecto de los prejuicios propios."],
 ["El documento que formaliza que una parte acepta participar voluntariamente es el…",["Consentimiento informado","Acta de sesión","Informe de cierre","Hoja de derivación"],"Se usa durante la planificación."],
 ["Si un caso no es mediable, se documenta en la…",["Hoja de derivación","Memoria anual","Acta de acuerdos","Ficha de observación"],"Recoge los motivos y el servicio al que se deriva."],
 ["La memoria anual del servicio sirve para…",["Identificar tendencias, tipos de conflicto y tasas de éxito","Firmar acuerdos","Convocar a las partes","Sustituir las actas"],"Es una herramienta clave de mejora continua."]
]
});

U("promocion", {
n:1, title:"La promoción de la autonomía personal",
secs:[
 ["1.1. Autonomía personal y social","A lo largo de la vida respondemos a necesidades (pirámide de Maslow: fisiológicas, seguridad, afiliación, reconocimiento y realización) gracias a capacidades que se van ampliando. La autonomía personal y social es la capacidad de decidir, por propia iniciativa, cómo vivir y de hacer sin ayuda las actividades para lograrlo. Tiene dos dimensiones: psicosocial (decidir → autodeterminación) y física (hacer → independencia).",[]],
 ["1.1.1. La autodeterminación","Es la capacidad y el derecho de una persona para actuar libremente y tomar sus propias decisiones, asumiendo sus riesgos (incluye equivocarse). Sin ella, otros controlan su vida.",
  ["Como capacidad: competencia para decidir y responsabilizarse; se desarrolla con el aprendizaje.","Como derecho: independientemente de la capacidad, debe garantizarse un proyecto propio con el mayor control posible.","Todas las personas tienen potencial para desarrollarla, incluso con discapacidad severa o trastornos graves; las personas con discapacidad intelectual y las mayores con deterioro cognitivo encuentran más limitaciones.","Derechos (art. 4 Ley 39/2006): información comprensible, participar en las políticas que les afectan, decidir sobre su tutela, decidir libremente el ingreso en una residencia, derechos jurisdiccionales en internamientos involuntarios y derechos patrimoniales."]],
 ["1.1.2. La independencia y las AVD","La independencia es la capacidad de realizar las actividades de la vida diaria por uno mismo, sin ayuda. Las AVD son todos los actos que organizan la vida cotidiana. El entorno puede favorecerla o impedirla (barreras arquitectónicas).",
  ["AVD básicas (AVDB): imprescindibles, de autocuidado: comer, vestirse, higiene, control de esfínteres, desplazarse.","AVD instrumentales (AVDI): más complejas; para adaptarse al medio: leer, tomar la medicación, manejar dinero, transporte, cocinar, teléfono.","AVD avanzadas (AVDA): estilo de vida y calidad de vida: ocio, deporte, trabajo, participación social."]],
 ["1.1.3. Las habilidades de autonomía personal y social (HAPS)","Son las capacidades, conductas y destrezas de que dispone una persona para funcionar en su vida diaria (también llamadas HHAP).",
  ["Clasificación de la AAIDD en 3 áreas: conceptuales (lenguaje, cálculo, tiempo, dinero, autodeterminación), prácticas (AVD y entorno seguro) y sociales (relaciones, responsabilidad, normas, autoestima, evitar la victimización).","Clasificación en 10 áreas (AAIDD, 1992): autocuidado, autodirección, comunicación, habilidades académicas funcionales, habilidades sociales, ocio y tiempo libre, salud y seguridad, trabajo, utilización de la comunidad y vida en el hogar.","Clasificación del libro (4 áreas): AVD, movilidad y orientación, habilidades sociales y habilidades cognitivas."]],
 ["1.2. La dependencia","Es el estado de carácter permanente en el que se encuentran las personas que requieren ayuda de otras para las AVD u otros actos de su autonomía. Puede deberse a la edad, la discapacidad, la enfermedad física o mental o un accidente; puede ser física, social, intelectual, mental o económica; y es permanente (desde el nacimiento o por pérdida).",
  ["Grado I, dependencia moderada: ayuda para varias AVD básicas al menos una vez al día, o apoyo intermitente o limitado.","Grado II, dependencia severa: ayuda 2 o 3 veces al día, sin cuidador permanente.","Grado III, gran dependencia: ayuda varias veces al día y presencia indispensable y continua de otra persona.","Se valora con el baremo BVD (Baremo de Valoración de los grados y niveles de Dependencia).","En 2021 había en España unos 1,4 millones de personas con dependencia reconocida (≈3 % de la población); aumenta por el «envejecimiento del envejecimiento» (más mayores de 80)."]],
 ["1.2.2. Los apoyos","Un apoyo es cualquier recurso que se activa para que una persona dependiente aumente funcionalmente su autonomía. Son individuales y cambian con la persona y el entorno.",
  ["Tipos: productos de apoyo (bastón, silla de ruedas, cubiertos adaptados), ayudas personales y técnicas o metodologías (aprender a poner una lavadora, usar un tablero de comunicación).","Intensidad: intermitente (solo cuando hace falta), limitado (continuo durante un tiempo), extenso (regular y sin límite temporal) y generalizado (intensivo, en varios entornos y quizá de por vida).","El principal apoyo para quien tiene poca autodeterminación es ayudarle a construir un proyecto de vida y una red de apoyo."]],
 ["1.2.3‑1.2.4. Factores de dependencia y calidad de vida","Factores que favorecen la dependencia:",
  ["Físicos: envejecimiento, problemas de movilidad, limitaciones sensoriales, enfermedades crónicas (EPOC, artrosis, cáncer), consumo de fármacos y drogas.","Psíquicos: discapacidad intelectual, demencias, depresión, enfermedad mental.","Contextuales: ambiente físico (accesibilidad), ambiente social (red de apoyo, sobreprotección, estereotipos) y situación económica.","Dependencia no significa falta de calidad de vida: hay calidad si sus necesidades están cubiertas, decide sobre su vida, se siente aceptada e integrada y tiene las mismas oportunidades.","Dimensiones de la calidad de vida: bienestar emocional, relaciones interpersonales, bienestar material, desarrollo personal, bienestar físico, autodeterminación, inclusión social y derechos."]],
 ["1.2.5. Discapacidad y dependencia","La discapacidad es la condición de la persona que tiene limitaciones para realizar ciertas funciones por un déficit sensorial, físico o intelectual. No implica necesariamente dependencia (una niña en silla de ruedas que no necesita ayuda es autónoma e independiente).",
  ["Modelo de la CIF (OMS, 2001): la discapacidad resulta de la relación entre condiciones de salud y factores contextuales; se manifiesta en déficits en el funcionamiento, limitaciones en la actividad y restricciones en la participación.","Modelo ecológico: interacción de la persona con su entorno inmediato, la comunidad y la sociedad. La discapacidad aparece cuando el contexto no se ajusta (unas gafas eliminan la discapacidad de un miope). No es fija ni de todo o nada, y los apoyos la minimizan.","Modelo de la diversidad funcional (Foro de Vida Independiente, 2005): las personas funcionan de manera diferente y tienen derecho a vivir con dignidad desde la diferencia y controlar su vida.","El CERMI defiende el término «persona con discapacidad» (el de la Convención de la ONU de 2006 y la ley) porque «diversidad funcional» es ambiguo y puede restar protección."]],
 ["1.3. La promoción de la autonomía: prevención","Dos estrategias: prevenir la dependencia y atenderla cuando ya existe. La prevención de la dependencia son las medidas para que las personas, con su propio control, reduzcan los factores de riesgo que amenazan su autonomía.",
  ["Prevención primaria: promoción de la salud en la población general (dieta, descanso, ejercicio, no fumar).","Prevención secundaria: detectar indicios precozmente para actuar antes de que la dependencia se instale o se cronifique.","Prevención terciaria: cuando ya está establecida, evitar que progrese y minimizar sus efectos."]],
 ["1.3.2. La atención a la dependencia","Tres tipos de recursos, todos buscando la máxima autonomía:",
  ["Apoyo informal: cuidados altruistas y gratuitos del entorno inmediato, sobre todo la familia. Perfil de quien cuida: mujer (83 %: hija, esposa o nuera), unos 52 años, convive con la persona, sin trabajo remunerado, ayuda a diario y sin apoyo. Riesgo: síndrome del cuidador.","Permanecer en el domicilio es lo más deseable (seguridad, orientación, red social), pero quien cuida no tiene formación y sufre un gran desgaste.","Apoyo formal: recursos creados por la sociedad, recogidos en el catálogo de servicios sociales: centros residenciales, alojamientos alternativos (viviendas tuteladas), centros de día o noche y respiro, ayuda a domicilio y teleasistencia, y centros ocupacionales y de empleo. Prestaciones económicas: vinculada al servicio, para cuidados en el entorno familiar y de asistencia personal.","Acceso (SAAD): solicitar la valoración, obtener el grado, solicitar el Programa Individual de Atención (PIA), resolución y solicitar los servicios.","El TSIS es personal de acción directa: valora, programa, ejecuta, entrena y evalúa. Riesgo: burnout (síndrome del profesional quemado); prevenirlo con autocuidado.","Asistencia personal: persona contratada que ayuda a realizar las tareas que alguien no puede hacer solo. Decide la persona usuaria (aunque al asistente le parezca un error); en cualquier lugar y horario flexible, frente a la ayuda a domicilio (horario fijo, decide el equipo) o los cuidados residenciales."]]
],
trucos:["Autonomía = DECIDIR (autodeterminación) + HACER (independencia).","Grados de dependencia como el número de ayudas: I = 1 vez al día, II = 2‑3 veces, III = siempre alguien al lado.","AVD de menos a más: BÁSICAS = cuidarme (comer, vestirme) · INSTRUMENTALES = manejarme en el mundo (dinero, bus, pastillas) · AVANZADAS = disfrutar la vida (viajar, trabajar).","Intensidad de apoyos = I‑L‑E‑G: Intermitente, Limitado, Extenso, Generalizado (de menos a más)."],
cards:[
 ["Autonomía personal y social","Capacidad de decidir por iniciativa propia cómo vivir y de hacer sin ayuda las actividades para lograrlo."],
 ["Autodeterminación","Capacidad y derecho de actuar libremente y tomar las propias decisiones, asumiendo sus riesgos."],
 ["Independencia","Capacidad de realizar las actividades de la vida diaria por uno mismo, sin ayuda."],
 ["AVD","Actividades de la vida diaria: todos los actos que organizan la vida cotidiana."],
 ["AVD básicas (AVDB)","Imprescindibles, de autocuidado: comer, vestirse, higiene, esfínteres, desplazarse."],
 ["AVD instrumentales (AVDI)","Para adaptarse al medio: leer, medicación, dinero, transporte, cocinar, teléfono."],
 ["AVD avanzadas (AVDA)","Ligadas al estilo de vida: ocio, deporte, trabajo, participación social."],
 ["HAPS","Habilidades de autonomía personal y social: capacidades, conductas y destrezas para funcionar en la vida diaria."],
 ["Áreas de la AAIDD","Habilidades conceptuales, prácticas y sociales."],
 ["Dependencia","Estado permanente en que la persona necesita ayuda de otras para las AVD u otros actos de su autonomía."],
 ["Grado I","Dependencia moderada: ayuda al menos una vez al día o apoyo intermitente o limitado."],
 ["Grado II","Dependencia severa: ayuda 2 o 3 veces al día, sin cuidador permanente."],
 ["Grado III","Gran dependencia: ayuda varias veces al día y presencia continua de otra persona."],
 ["BVD","Baremo de Valoración de los grados y niveles de Dependencia."],
 ["Apoyo","Cualquier recurso que se activa para que una persona aumente funcionalmente su autonomía."],
 ["Apoyo limitado","Se aplica de forma continua pero durante un tiempo determinado."],
 ["Apoyo generalizado","Intensivo, en varios entornos, sin límite temporal, quizá de por vida."],
 ["Discapacidad","Limitaciones para realizar ciertas funciones por un déficit sensorial, físico o intelectual."],
 ["Modelo ecológico","La discapacidad aparece cuando el contexto no se ajusta a las características de la persona."],
 ["Diversidad funcional","Modelo del Foro de Vida Independiente: funcionar de forma diferente con derecho a controlar la propia vida."],
 ["CERMI","Comité Español de Representantes de Personas con Discapacidad; defiende el término «persona con discapacidad»."],
 ["Prevención de la dependencia","Medidas para que las personas reduzcan los factores de riesgo que amenazan su autonomía."],
 ["Prevención primaria","Promoción de la salud y hábitos saludables en la población general."],
 ["Prevención secundaria","Detectar indicios precozmente para actuar antes de que la dependencia se instale."],
 ["Prevención terciaria","Con la dependencia ya instalada, evitar que progrese y minimizar sus efectos."],
 ["Apoyo informal","Cuidados altruistas y gratuitos del entorno inmediato, sobre todo la familia."],
 ["Apoyo formal","Recursos y servicios creados por la sociedad (catálogo de servicios sociales)."],
 ["Síndrome del cuidador","Agotamiento cuando el cuidado recae casi por completo en un familiar."],
 ["Burnout","Síndrome del profesional quemado: agotamiento físico y emocional."],
 ["Asistente personal","Persona contratada que ayuda a realizar las tareas que alguien no puede hacer solo; decide la persona usuaria."],
 ["Programa Individual de Atención","Documento que fija los servicios o prestaciones de la persona dependiente tras su valoración."]
],
quiz:[
 ["Una persona necesita ayuda 2 o 3 veces al día pero no cuidador permanente. ¿Qué grado tiene?",["Grado II, dependencia severa","Grado I","Grado III","No es dependiente"],"Así lo define la Ley 39/2006."],
 ["La dimensión física de la autonomía se corresponde con…",["La independencia","La autodeterminación","La autoestima","La socialización"],"La psicosocial es decidir (autodeterminación)."],
 ["La autodeterminación incluye el derecho a…",["Tomar decisiones aunque sean desacertadas","Que otros decidan por ti","No asumir consecuencias","Elegir solo lo que aprueba el profesional"],"Ejercerla implica también equivocarse."],
 ["Tomar la medicación es una AVD…",["Instrumental","Básica","Avanzada","Social"],"Requiere más autonomía que el autocuidado."],
 ["Viajar o practicar un deporte son AVD…",["Avanzadas","Básicas","Instrumentales","Conceptuales"],"Tienen que ver con el estilo y la calidad de vida."],
 ["Según la AAIDD, las HAPS se agrupan en habilidades…",["Conceptuales, prácticas y sociales","Físicas, mentales y espirituales","Básicas, medias y altas","Escolares y laborales"],"En 1992 propuso además una clasificación en 10 áreas."],
 ["Un apoyo que se da de forma continua pero durante un tiempo concreto es…",["Limitado","Intermitente","Extenso","Generalizado"],"El intermitente se da solo cuando hace falta."],
 ["¿Una persona con discapacidad es siempre dependiente?",["No, no tiene por qué","Sí, siempre","Solo si es mayor","Solo si es intelectual"],"Si no necesita ayuda de otra persona, es autónoma e independiente."],
 ["Unas gafas que permiten a un miope llevar una vida normal ilustran el modelo…",["Ecológico","Médico","De la diversidad funcional","Asistencialista"],"La discapacidad depende del ajuste entre persona y contexto."],
 ["Promover hábitos saludables en toda la población es prevención…",["Primaria","Secundaria","Terciaria","Cuaternaria"],"La secundaria detecta precozmente; la terciaria actúa cuando ya existe."],
 ["¿Quién es mayoritariamente la cuidadora informal según el Imserso?",["Una mujer de unos 52 años, sobre todo la hija","Un hombre joven","Un profesional contratado","Un voluntario"],"El 83 % son mujeres."],
 ["¿Quién toma las decisiones en la asistencia personal?",["La persona usuaria","El asistente","La dirección del centro","La familia"],"El asistente apoya aunque la decisión le parezca errónea."],
 ["¿Qué ley regula la dependencia en España?",["Ley 39/2006","Ley Orgánica 3/2007","Ley 5/2012","Ley 45/2015"],"Clasifica la dependencia en tres grados."],
 ["El primer paso para acceder a los recursos de la ley de dependencia es…",["Solicitar la valoración del grado","Pedir directamente una residencia","Contratar un asistente","Ir al médico de cabecera"],"Después viene el Programa Individual de Atención."],
 ["El organismo que pide volver a usar «persona con discapacidad» es el…",["CERMI","Foro de Vida Independiente","OMS","Imserso"],"Considera que «diversidad funcional» es ambiguo y puede restar protección."]
]
